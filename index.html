          ctx.fillStyle = '#d4a45c';
          ctx.beginPath(); ctx.moveTo(x - 18 * s, y); ctx.lineTo(x, y - 20 * s); ctx.lineTo(x + 18 * s, y); ctx.fill();
          ctx.fillStyle = '#b8863f';
          ctx.beginPath(); ctx.moveTo(x, y - 20 * s); ctx.lineTo(x + 18 * s, y); ctx.lineTo(x + 5 * s, y); ctx.fill();
        } else if (d.v < 0.5) {
          ctx.fillStyle = '#6a9a3a';
          ctx.fillRect(x - 1.5 * s, y - 12 * s, 3 * s, 12 * s);
          ctx.fillRect(x - 5 * s, y - 8 * s, 2.5 * s, 5 * s);
          ctx.fillRect(x + 2.5 * s, y - 10 * s, 2.5 * s, 5 * s);
        } else {
          ctx.strokeStyle = 'rgba(160,110,50,0.5)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y + 10 * s, 14 * s, -2.4, -0.7); ctx.stroke();
        }
        break;
      case 3:
        ctx.fillStyle = '#9fb3c8';
        ctx.beginPath(); ctx.moveTo(x - 16 * s, y); ctx.lineTo(x, y - 24 * s); ctx.lineTo(x + 16 * s, y); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(x - 6 * s, y - 15 * s); ctx.lineTo(x, y - 24 * s); ctx.lineTo(x + 6 * s, y - 15 * s); ctx.fill();
        break;
      case 4:
        if (d.v < 0.2) {
          ctx.fillStyle = '#4a2018';
          ctx.beginPath(); ctx.moveTo(x - 20 * s, y); ctx.lineTo(x - 5 * s, y - 24 * s); ctx.lineTo(x + 5 * s, y - 24 * s); ctx.lineTo(x + 20 * s, y); ctx.fill();
          ctx.fillStyle = `rgba(255,111,0,${0.6 + Math.sin(t * 3 + d.v * 20) * 0.3})`;
          ctx.beginPath(); ctx.ellipse(x, y - 24 * s, 5 * s, 2 * s, 0, 0, TAU); ctx.fill();
        } else {
          ctx.fillStyle = '#2a1512';
          ctx.beginPath(); ctx.ellipse(x, y, 8 * s, 5 * s, 0, Math.PI, 0); ctx.fill();
          ctx.fillStyle = `rgba(255,87,34,${0.4 + Math.sin(t * 2 + d.v * 9) * 0.2})`;
          ctx.fillRect(x - 2, y - 3, 4, 2);
        }
        break;
      case 5:
        ctx.fillStyle = '#2b2140';
        ctx.fillRect(x - 5 * s, y - 20 * s, 10 * s, 20 * s);
        ctx.beginPath(); ctx.moveTo(x - 7 * s, y - 20 * s); ctx.lineTo(x, y - 30 * s); ctx.lineTo(x + 7 * s, y - 20 * s); ctx.fill();
        ctx.fillStyle = 'rgba(234,128,252,0.6)';
        ctx.fillRect(x - 1.5, y - 15 * s, 3, 4);
        break;
    }
  }

  drawNode(ctx, n, t, isGoal) {
    const un = isUnlocked(n.id);
    const done = !!SAVE.done[n.id];
    const r = n.type === 'boss' ? 16 : n.type === 'town' ? 15 : 13;
    const x = n.x, y = n.y;
    if (n.id === this.sel) {
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.sin(t * 5) * 0.3})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + 6 + Math.sin(t * 5) * 1.5, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.8, r, r * 0.35, 0, 0, TAU); ctx.fill();
    const col = !un ? '#8a8a8a' : { town: '#8d6e63', level: '#fafafa', boss: '#c62828', treasure: '#ffca28', challenge: '#7e57c2', arena: '#ff7043' }[n.type];
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = done ? '#43a047' : un ? '#3e2723' : '#555';
    ctx.stroke();
    ctx.fillStyle = !un ? '#555' : n.type === 'level' ? '#3e2723' : '#ffffff';
    ctx.strokeStyle = ctx.fillStyle;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!un) {
      ctx.fillRect(x - 5, y - 1, 10, 8);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y - 2, 3.5, Math.PI, 0); ctx.stroke();
    } else {
      switch (n.type) {
        case 'town':
          ctx.beginPath(); ctx.moveTo(x - 8, y - 1); ctx.lineTo(x, y - 9); ctx.lineTo(x + 8, y - 1); ctx.fill();
          ctx.fillRect(x - 6, y - 1, 12, 8);
          ctx.fillStyle = '#8d6e63'; ctx.fillRect(x - 2, y + 2, 4, 5);
          break;
        case 'level':
          ctx.font = '900 12px system-ui,sans-serif';
          ctx.fillText(String(n.region + 1) + '-' + String(n.idx + 1), x, y + 1);
          break;
        case 'boss':
          ctx.beginPath(); ctx.arc(x, y - 2, 8, 0, TAU); ctx.fill();
          ctx.fillRect(x - 5, y + 3, 10, 6);
          ctx.fillStyle = '#c62828';
          ctx.fillRect(x - 5, y - 4, 3.5, 3.5); ctx.fillRect(x + 1.5, y - 4, 3.5, 3.5);
          ctx.fillRect(x - 3, y + 5, 1.5, 4); ctx.fillRect(x + 1.5, y + 5, 1.5, 4);
          break;
        case 'treasure':
          ctx.fillStyle = '#6d4c41';
          ctx.fillRect(x - 8, y - 3, 16, 10);
          ctx.fillStyle = '#8d6e63';
          ctx.beginPath(); ctx.ellipse(x, y - 3, 8, 5, 0, Math.PI, 0); ctx.fill();
          ctx.fillStyle = '#ffeb3b'; ctx.fillRect(x - 2, y - 3, 4, 4);
          break;
        case 'challenge':
        case 'arena':
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); ctx.stroke();
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(x - 7, y + 3); ctx.lineTo(x - 3, y + 7); ctx.moveTo(x + 7, y + 3); ctx.lineTo(x + 3, y + 7); ctx.stroke();
          break;
      }
    }
    const rank = SAVE.ranks[n.id];
    if (rank) {
      const rc = { S: '#ffd740', A: '#69f0ae', B: '#40c4ff', C: '#e0e0e0' }[rank];
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x + r * 0.8, y - r * 0.8, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = rc;
      ctx.font = '900 9px system-ui,sans-serif';
      ctx.fillText(rank, x + r * 0.8, y - r * 0.8 + 0.5);
    } else if (done && n.type !== 'town') {
      ctx.fillStyle = '#43a047';
      ctx.beginPath(); ctx.arc(x + r * 0.8, y - r * 0.8, 6, 0, TAU); ctx.fill();
    }
    if (isGoal && !this.walker.path) {
      const by = y - r - 14 + Math.sin(t * 5) * 3;
      ctx.fillStyle = '#ffd740';
      ctx.beginPath(); ctx.moveTo(x - 7, by - 6); ctx.lineTo(x + 7, by - 6); ctx.lineTo(x, by + 3); ctx.fill();
      ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  drawWalker(ctx) {
    const w = this.walker;
    const moving = !!w.path;
    const pose = moving ? runPose(w.ph, 0.25) : idlePose(this.t);
    const bob = moving ? 0 : 0;
    const k = skel(w.x, w.y - 8 + bob, w.facing, 0.62, pose, true);
    drawShadowEllipse(ctx, w.x, w.y - 7, 8, 0.3);
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(k.headX - w.facing * 2, k.headY);
    ctx.lineTo(k.headX - w.facing * 10, k.headY + 2 + Math.sin(this.t * 10) * 1.5);
    ctx.stroke();
    drawStick(ctx, k, '#141414', { outline: 'rgba(255,255,255,0.7)' });
    drawWeapon(ctx, k, SAVE.weapon, this.t);
  }
}

// ---------- Title scene ----------
class TitleScene {
  constructor() {
    this.t = 0;
    this.usesControls = false;
    this.backdrop = new Backdrop(REGIONS[0], 4242);
    this.camX = 0;
    this.scarf = [];
    for (let i = 0; i < 7; i++) this.scarf.push({ x: 0, y: 0 });
  }
  enter() {
    Input.active = false;
    UI.showTitle();
    Music.play('title');
  }
  exit() {}
  update(dt) {
    this.t += dt;
    this.camX += 70 * dt;
  }
  draw(ctx) {
    const W = Game.W, H = Game.H, t = this.t;
    this.backdrop.draw(ctx, this.camX, 40, W, H, t);
    const gy = H - 44;
    ctx.fillStyle = REGIONS[0].ground;
    ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = REGIONS[0].top;
    ctx.fillRect(0, gy, W, 8);
    ctx.fillStyle = REGIONS[0].topDark;
    ctx.fillRect(0, gy + 8, W, 3);
    const off = (this.camX * 1.0) % 40;
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let x = -off; x < W; x += 40) ctx.fillRect(x, gy + 18, 10, 4);
    // hero running, with a jump + flip every few seconds
    const hx = W * 0.3;
    const cyc = t % 4;
    let hy = gy, rot = 0, pose = runPose(t * 13, 0.3);
    if (cyc > 3 && cyc < 3.7) {
      const p = (cyc - 3) / 0.7;
      hy = gy - Math.sin(p * Math.PI) * 70;
      rot = p * TAU;
      pose = PZ.jump;
    }
    const k = skel(hx, hy, 1, 1.35, pose, hy >= gy);
    // scarf
    const ax = k.headX - 5, ay = k.headY + 1;
    this.scarf[0].x = ax; this.scarf[0].y = ay;
    for (let i = 1; i < this.scarf.length; i++) {
      const p = this.scarf[i], q = this.scarf[i - 1];
      p.x += -3 + Math.sin(t * 12 + i) * 0.6;
      p.y += 0.3 + Math.cos(t * 9 + i) * 0.4;
      const d = Math.hypot(p.x - q.x, p.y - q.y) || 1;
      p.x = q.x + ((p.x - q.x) / d) * 6;
      p.y = q.y + ((p.y - q.y) / d) * 6;
    }
    drawShadowEllipse(ctx, hx, gy, 16, 0.3);
    ctx.save();
    if (rot) { ctx.translate(hx, hy - 30); ctx.rotate(rot); ctx.translate(-hx, -(hy - 30)); }
    ctx.strokeStyle = '#e53935';
    ctx.lineCap = 'round';
    for (let i = 1; i < this.scarf.length; i++) {
      ctx.lineWidth = 5 - i * 0.5;
      ctx.beginPath(); ctx.moveTo(this.scarf[i - 1].x, this.scarf[i - 1].y); ctx.lineTo(this.scarf[i].x, this.scarf[i].y); ctx.stroke();
    }
    drawStick(ctx, k, '#141414', { outline: 'rgba(255,255,255,0.6)', back: '#3b3b3b' });
    drawWeapon(ctx, k, 'sword', t);
    ctx.restore();
    // chasing grunts
    for (let i = 0; i < 3; i++) {
      const ex = hx - 110 - i * 55 + Math.sin(t * 2 + i) * 8;
      const ek = skel(ex, gy, 1, 1.1 + i * 0.05, runPose(t * 12 + i * 2, 0.35), true);
      drawShadowEllipse(ctx, ex, gy, 12, 0.25);
      drawStick(ctx, ek, ['#e53935', '#fb8c00', '#8e24aa'][i], { outline: 'rgba(0,0,0,0.35)', eye: '#fff', angry: true });
      if (i === 1) drawWeapon(ctx, ek, 'esword', t);
    }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0.35)');
    g.addColorStop(0.5, 'rgba(0,0,0,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- DOM user interface (menus, shop, dialogs) ----------
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  return e;
}
const $ = (id) => document.getElementById(id);

function btn(label, fn, cls, disabled) {
  return el('button', {
    class: 'btn ' + (cls || ''),
    disabled: disabled ? 'disabled' : null,
    onclick: (e) => {
      e.stopPropagation();
      Sound.init();
      Sound.play('select');
      fn && fn(e);
    },
  }, label);
}

const RANK_COLORS = { S: '#ffd740', A: '#69f0ae', B: '#40c4ff', C: '#e0e0e0' };

const UI = {
  modalOpen: false,
  shopTab: 'weapons',
  rotateDismissed: false,

  init() {
    this.titleEl = $('title');
    this.maphud = $('maphud');
    this.modalEl = $('modal');
    this.panel = $('modal-panel');
    this.toastEl = $('toast');
    this.rotateEl = $('rotate');
    this.nodePanel = $('nodepanel');
    $('mh-gear').addEventListener('click', () => { Sound.init(); Sound.play('select'); this.showGear(); });
    $('mh-set').addEventListener('click', () => { Sound.init(); Sound.play('select'); this.showSettings(); });
    $('mh-menu').addEventListener('click', () => { Sound.init(); Sound.play('select'); Game.setScene(new TitleScene()); });
    $('rotate-ok').addEventListener('click', () => { this.rotateDismissed = true; this.rotateEl.classList.remove('show'); });
    this.modalEl.addEventListener('pointerdown', (e) => e.stopPropagation());
  },

  hideAll() {
    this.titleEl.classList.remove('show');
    this.maphud.classList.remove('show');

  },

  setPortrait(p) {
    if (p && !this.rotateDismissed) this.rotateEl.classList.add('show');
    else this.rotateEl.classList.remove('show');
  },

  // ----- title -----
  showTitle() {
    this.hideAll();
    this.titleEl.classList.add('show');
    const menu = $('title-menu');
    menu.innerHTML = '';
    if (SAVE.started) {
      menu.appendChild(btn('CONTINUE', () => { Game.tryFullscreen(); Game.toMap(); }, 'big green'));
      menu.appendChild(btn('NEW GAME', () => {
        this.dialog('Start a new game?', 'Your current progress (Lv ' + SAVE.lvl + ', ' + Object.keys(SAVE.done).length + ' places visited) will be erased.', [
          { label: 'ERASE & START', cls: 'red', fn: () => { newGame(); Game.tryFullscreen(); Game.toMap(); } },
          { label: 'CANCEL', fn: () => this.closeModal() },
        ]);
      }));
    } else {
      menu.appendChild(btn('START ADVENTURE', () => { newGame(); Game.tryFullscreen(); Game.toMap(); }, 'big green'));
    }
    const row = el('div', { class: 'row' },
      btn('HOW TO PLAY', () => this.showHelp()),
      btn('SETTINGS', () => this.showSettings()));
    menu.appendChild(row);
    this.refreshTitleFoot();
  },

  refreshTitleFoot() {
    const foot = $('title-foot');
    if (!foot) return;
    foot.innerHTML = '';
    if (Game.installPrompt) {
      foot.appendChild(btn('INSTALL APP', () => {
        const p = Game.installPrompt;
        Game.installPrompt = null;
        p.prompt();
        p.userChoice.finally(() => this.refreshTitleFoot());

function weaponIcon(id) {
  const cv = el('canvas', { width: 64, height: 64 });
  const c = cv.getContext('2d');
  c.scale(2, 2);
  if (id === 'fists') {
    c.fillStyle = '#ffd54f';
    c.beginPath(); c.arc(16, 16, 8, 0, TAU); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.3)';
    for (let i = 0; i < 3; i++) c.fillRect(11 + i * 3.5, 10, 1.5, 6);
  } else {
    const span = { sword: [-5, 33], katana: [-7, 40], cosmic: [-6, 44], spear: [-24, 52], hammer: [-6, 38] }[id] || [-5, 33];
    const s = 26 / (span[1] - span[0]);
    const ang = 2.36;
    const dx = Math.sin(ang), dy = Math.cos(ang);
    const mid = (span[0] + span[1]) / 2;
    const hx = 16 - dx * mid * s, hy = 16 - dy * mid * s;
    drawWeapon(c, { fa: [0, 0, hx, hy, ang], f: 1, s: s * 1.25, wAng: ang }, id, 0);
  }
  return el('div', { class: 'it-icon' }, cv);
}

function applySettings() {
  const s = SAVE.settings;
  Sound.setSfx(!!s.sfx);
  Sound.setMusic(!!s.music);
  Input.size = s.ctrl || 1;
  Input.alpha = s.alpha || 0.5;
  if (s.touch === 'on') Input.touchMode = true;
  else if (s.touch === 'off') Input.touchMode = false;
  else Input.touchMode = Input.detectedTouch;
  Input.layout(Game.W, Game.H);
}

// ---------- Save data ----------
let SAVE = null;
const SAVE_KEY = 'stickman-odyssey-save-v1';

function loadGame() {
  const d0 = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      SAVE = Object.assign(d0, d);
      SAVE.up = Object.assign(defaultSave().up, d.up || {});
      SAVE.settings = Object.assign(defaultSave().settings, d.settings || {});
      SAVE.stats = Object.assign(defaultSave().stats, d.stats || {});
      SAVE.done = d.done || {};
      SAVE.ranks = d.ranks || {};
      SAVE.seen = d.seen || {};
      if (!WEAPONS[SAVE.weapon]) SAVE.weapon = 'fists';
      if (!Array.isArray(SAVE.slots) || SAVE.slots.length !== 2) SAVE.slots = ['blast', null];
      if (!MAP.nodes[SAVE.at]) SAVE.at = 'r0-town';
      SAVE.done['r0-town'] = true;
      return;
    }
  } catch (e) { /* corrupted or unavailable storage: start fresh */ }
  SAVE = d0;
  SAVE.done['r0-town'] = true;
}

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* storage unavailable */ }
}

function newGame() {
  const s = SAVE ? SAVE.settings : null;
  SAVE = defaultSave();
  if (s) SAVE.settings = s;
  SAVE.done['r0-town'] = true;
  SAVE.started = true;
  saveGame();
}

function grantXp(n) {
  SAVE.xp += n;
  let lv = 0;
  while (SAVE.xp >= xpNeed(SAVE.lvl)) {
    SAVE.xp -= xpNeed(SAVE.lvl);
    SAVE.lvl++;
    lv++;
  }
  saveGame();
  return lv;
}

    });
    addEventListener('pagehide', () => saveGame());
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.installPrompt = e;
      UI.refreshTitleFoot();
    });
    const unlock = () => Sound.init();
    addEventListener('pointerdown', unlock, { passive: true });
    addEventListener('touchend', unlock, { passive: true });
    this.setScene(new TitleScene());
    this.frame = this.frame.bind(this);
    requestAnimationFrame(this.frame);
    this.registerSW();
  },

  registerSW() {
    try {
      const ok = 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
      if (!ok) return;
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (navigator.serviceWorker.controller) this.offlineReady = true;
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (w) w.addEventListener('statechange', () => {
            if (w.state === 'activated') { this.offlineReady = true; UI.refreshTitleFoot(); }
          });
        });
        UI.refreshTitleFoot();
      }).catch(() => {});
    } catch (e) { /* not supported here */ }
  },

  isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; },

  tryFullscreen() {
    if (!Input.touchMode || this.isStandalone()) return;
    const d = document.documentElement;
    const req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      const p = req.call(d, { navigationUI: 'hide' });
      const lock = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* unsupported */ } };
      if (p && p.then) p.then(lock).catch(() => {});
      else lock();
    } catch (e) { /* denied */ }
  },
  toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const d = document.documentElement;
      const req = d.requestFullscreen || d.webkitRequestFullscreen;
      if (req) { try { const p = req.call(d); if (p && p.catch) p.catch(() => {}); } catch (e) { /* denied */ } }
    }
  },

  // Keep the phone screen on while a stage is being played.
  keepAwake(on) {
    try {
      if (on && !this.wakeLock && navigator.wakeLock) {
        navigator.wakeLock.request('screen').then((l) => {
          this.wakeLock = l;
          l.addEventListener('release', () => { if (this.wakeLock === l) this.wakeLock = null; });
        }).catch(() => {});
      } else if (!on && this.wakeLock) {
        this.wakeLock.release().catch(() => {});
        this.wakeLock = null;
      }
    } catch (e) { /* unsupported */ }
  },

  vibrate(ms) {
    if (!SAVE.settings.shake) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ }
  },

  safeArea() {
    const probe = $('safe-probe');
    if (!probe) return { left: 0, right: 0 };
    const cs = getComputedStyle(probe);
    return { left: parseFloat(cs.paddingLeft) || 0, right: parseFloat(cs.paddingRight) || 0 };
  },

  resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const a = vw / vh;
    let cw = vw, ch = vh;
    if (a < 1.3) ch = Math.round(vw / 1.3);
    else if (a > 2.4) cw = Math.round(vh * 2.4);
    const c = this.canvas;
    c.style.width = cw + 'px';
    c.style.height = ch + 'px';
    c.style.left = Math.round((vw - cw) / 2) + 'px';
    c.style.top = Math.round((vh - ch) / 2) + 'px';
    this.H = 360;
    this.W = Math.round((360 * cw) / ch);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(cw * dpr);
    c.height = Math.round(ch * dpr);
    this.pxScale = c.height / this.H;
    const sa = this.safeArea();
    const cssPerLogical = ch / this.H;
    const cl = (vw - cw) / 2;
    Input.safeL = Math.max(0, sa.left - cl) / cssPerLogical;
    Input.safeR = Math.max(0, sa.right - cl) / cssPerLogical;
    Input.view = { W: this.W, H: this.H };
    Input.layout(this.W, this.H);
    UI.setPortrait(a < 1);
  },

  setScene(s) {
    if (this.scene && this.scene.exit) this.scene.exit();
    Input.reset();
    this.scene = s;
    Input.active = !!s.usesControls;
    if (s.enter) s.enter();
  },

  startLevel(def) {
    this.setScene(new LevelScene(def));
  },

  toMap(after) {
    saveGame();
    const m = new MapScene();
    this.setScene(m);
    if (after) after(m);
  },

  finishLevel(scene) {
    const r = scene.result;
    if (scene.def.kind === 'ambush') { this.toMap((m) => m.afterArrive()); return; }
    if (r && r.final) { this.toMap(() => UI.ending()); return; }
    this.toMap();
  },

  frame(now) {
    requestAnimationFrame(this.frame);
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 0.1);
    this.acc += dt;
    let steps = 0;
    while (this.acc >= STEP && steps < 5) {
      Input.poll();
      try { this.scene.update(STEP); } catch (e) { this.report(e); }
      this.acc -= STEP;
      steps++;
    }
    if (steps >= 5) this.acc = 0;
    const ctx = this.ctx;
    ctx.setTransform(this.pxScale, 0, 0, this.pxScale, 0, 0);
    try { this.scene.draw(ctx); } catch (e) { this.report(e); }
  },

  report(e) {
    this.errors++;
    if (this.errors < 5) console.error(e);
    window.__lastError = String(e && e.stack || e);
  },
};

// Debug / test hooks (harmless in normal play)
window.__SO = {
  Game, MAP, REGIONS, Input, generateLevel, levelDefFor,
  save: () => SAVE,
  play: (nodeId) => Game.startLevel(levelDefFor(MAP.nodes[nodeId])),
};

Game.init();

})();
</script>
