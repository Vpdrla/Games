  jump: mkPose(0.05, 2.2, 0.5, 2.6, 0.4, 0.3, -1.4, 1.0, -1.5),
  fall: mkPose(0.0, 1.8, 0.6, 2.0, 0.5, -0.3, -0.5, 0.4, -0.7),
  dash: mkPose(0.85, -1.2, 0.3, -0.9, 0.3, -0.7, -0.4, 1.1, -0.3),
  hurt: mkPose(-0.45, 2.3, 0.8, 2.0, 0.9, 0.35, -0.5, 0.6, -0.3),
  crouch: mkPose(0.35, 0.8, 1.4, 1.0, 1.5, -0.1, -1.9, 1.2, -1.7),
  cast: mkPose(0.12, 1.2, 0.3, 1.6, 0.0, -0.3, 0.05, 0.35, -0.15),
  castUp: mkPose(-0.05, 2.9, 0.2, 3.0, 0.1, -0.2, 0.0, 0.2, 0.0),
  victory: mkPose(-0.05, 0.5, 0.4, 3.05, 0.1, -0.15, 0.0, 0.15, 0.0),
  down: mkPose(1.45, 0.8, 0.2, 1.2, 0.2, 1.4, -0.2, 1.5, -0.1),
  walkSlow: mkPose(0.05, 0.3, 0.3, 0.3, 0.3, -0.2, 0, 0.2, -0.1),
  windup: mkPose(-0.15, 0.6, 1.4, 2.8, 0.6, -0.4, 0.05, 0.4, -0.3),
  strike: mkPose(0.35, 0.3, 1.0, 1.3, 0.1, -0.55, 0.1, 0.65, -0.45),
  aim: mkPose(0.0, 1.57, 0.0, 1.45, 1.6, -0.3, 0.05, 0.3, -0.1),
  throwBack: mkPose(-0.2, 0.6, 1.0, 3.6, 0.5, -0.3, 0.0, 0.4, -0.2),
  throwFwd: mkPose(0.3, 0.4, 1.0, 1.6, 0.2, -0.5, 0.0, 0.6, -0.4),
  shieldUp: mkPose(0.1, 1.4, 1.3, 0.5, 1.3, -0.25, 0.05, 0.3, -0.15),
};

function runPose(ph, lean = 0.3) {
  const s = Math.sin(ph), c = Math.cos(ph);
  const s2 = Math.sin(ph + Math.PI), c2 = Math.cos(ph + Math.PI);
  return mkPose(
    lean,
    0.25 + 0.95 * s, 1.5,
    0.25 - 0.95 * s, 1.5,
    0.85 * s2, -(0.25 + 1.3 * Math.max(0, c2)),
    0.85 * s, -(0.25 + 1.3 * Math.max(0, c))
  );
}
function walkPose(ph) {
  const s = Math.sin(ph), c = Math.cos(ph);
  return mkPose(0.08, 0.15 + 0.5 * s, 0.5, 0.15 - 0.5 * s, 0.5, -0.5 * s, -(0.1 + 0.6 * Math.max(0, -c)), 0.5 * s, -(0.1 + 0.6 * Math.max(0, c)));
}
function idlePose(t) {
  const b = Math.sin(t * 2.6);
  return mkPose(0.07 + b * 0.015, 0.4 + b * 0.05, 1.3, 0.6 + b * 0.05, 1.4, -0.2, 0.05 - b * 0.03, 0.2, -0.1 - b * 0.03);
}

function skel(x, y, f, s, p, grounded) {
  const TH = 11 * s, SH = 11 * s, TO = 15 * s, UA = 9.5 * s, FA = 9.5 * s, HR = 6.5 * s;
  let hipH;
  if (grounded) {
    const d1 = Math.cos(p.bl1) * TH + Math.cos(p.bl1 + p.bl2) * SH;
    const d2 = Math.cos(p.fl1) * TH + Math.cos(p.fl1 + p.fl2) * SH;
    hipH = Math.max(d1, d2, 5 * s);
  } else hipH = 21 * s;
  const hx = x, hy = y - hipH;
  const nx = hx + Math.sin(p.lean) * TO * f, ny = hy - Math.cos(p.lean) * TO;
  const ha = p.lean + (p.head || 0);
  const headX = nx + Math.sin(ha) * (HR + 1.5 * s) * f;
  const headY = ny - Math.cos(ha) * (HR + 1.5 * s);
  const shx = hx + (nx - hx) * 0.88, shy = hy + (ny - hy) * 0.88;
  const limb = (ox, oy, a1, a2, l1, l2) => {
    const ex = ox + Math.sin(a1) * l1 * f, ey = oy + Math.cos(a1) * l1;
    const a = a1 + a2;
    return [ex, ey, ex + Math.sin(a) * l2 * f, ey + Math.cos(a) * l2, a];
  };
  return {
    hx, hy, nx, ny, headX, headY, hr: HR, shx, shy, f, s, lean: p.lean,
    ba: limb(shx, shy, p.ba1, p.ba2, UA, FA),
    fa: limb(shx, shy, p.fa1, p.fa2, UA, FA),
    bl: limb(hx, hy, p.bl1, p.bl2, TH, SH),
    fl: limb(hx, hy, p.fl1, p.fl2, TH, SH),
    wAng: p.w != null ? p.w : null,
  };
}

function strokeLimbs(ctx, k, back) {
  ctx.beginPath();
  if (back) {
    ctx.moveTo(k.shx, k.shy); ctx.lineTo(k.ba[0], k.ba[1]); ctx.lineTo(k.ba[2], k.ba[3]);
    ctx.moveTo(k.hx, k.hy); ctx.lineTo(k.bl[0], k.bl[1]); ctx.lineTo(k.bl[2], k.bl[3]);
  } else {
    ctx.moveTo(k.hx, k.hy); ctx.lineTo(k.nx, k.ny);
    ctx.moveTo(k.hx, k.hy); ctx.lineTo(k.fl[0], k.fl[1]); ctx.lineTo(k.fl[2], k.fl[3]);
    ctx.moveTo(k.shx, k.shy); ctx.lineTo(k.fa[0], k.fa[1]); ctx.lineTo(k.fa[2], k.fa[3]);
  }
  ctx.stroke();
}

function drawStick(ctx, k, color, opt = {}) {
  const lw = (opt.lw || 3.4) * k.s;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (opt.outline) {
    ctx.strokeStyle = opt.outline;
    ctx.lineWidth = lw + 3;
    strokeLimbs(ctx, k, true);
    strokeLimbs(ctx, k, false);
    ctx.beginPath();
    ctx.arc(k.headX, k.headY, k.hr + 1.5, 0, TAU);
    ctx.fillStyle = opt.outline;
    ctx.fill();
  }
  ctx.lineWidth = lw;
  ctx.strokeStyle = opt.back || color;
  strokeLimbs(ctx, k, true);
  ctx.strokeStyle = color;
  strokeLimbs(ctx, k, false);
  ctx.beginPath();
  ctx.arc(k.headX, k.headY, k.hr, 0, TAU);
  ctx.fillStyle = color;
  ctx.fill();
  if (opt.eye) {
    ctx.fillStyle = opt.eye;
    const ex = k.headX + k.f * k.hr * 0.45, ey = k.headY - k.hr * 0.1;
    if (opt.angry) {
      ctx.beginPath();
      ctx.moveTo(ex - k.f * 2.5 * k.s, ey - 2 * k.s);
      ctx.lineTo(ex + k.f * 2 * k.s, ey);
      ctx.lineTo(ex - k.f * 1.5 * k.s, ey + 1.2 * k.s);
      ctx.fill();
    } else {
      ctx.fillRect(ex - 1.2 * k.s, ey - 1.5 * k.s, 2.4 * k.s, 2.6 * k.s);
    }
  }
}

function weaponDir(k) {
  const ang = k.wAng != null ? k.wAng : k.fa[4];
  return { dx: Math.sin(ang) * k.f, dy: Math.cos(ang), ang };
}

function drawWeapon(ctx, k, wid, t) {
  if (!wid || wid === 'fists') {
    if (wid === 'fists') {
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.arc(k.fa[2], k.fa[3], 3 * k.s, 0, TAU);
      ctx.fill();
    }
    return;
  }
  const s = k.s;
  const hx = k.fa[2], hy = k.fa[3];
  const { dx, dy } = weaponDir(k);
  const px = -dy, py = dx;
  const P = (a, b) => [hx + dx * a * s + px * b * s, hy + dy * a * s + py * b * s];
  const line = (a, b, w, c) => {
    ctx.strokeStyle = c; ctx.lineWidth = w * s;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  };
  ctx.lineCap = 'round';
  switch (wid) {
    case 'sword':
    case 'esword': {
      const blade = wid === 'sword' ? '#e0e7ec' : '#b0a8a0';
      line(P(-5, 0), P(3, 0), 3, '#5d4037');
      line(P(3, 0), P(33, 0), 3.2, blade);
      line(P(5, 0), P(31, 0), 1, '#ffffff');
      line(P(3, -5.5), P(3, 5.5), 2.6, wid === 'sword' ? '#c8a24a' : '#6d5d4b');
      break;
    }
    case 'katana': {
      line(P(-7, 0), P(3, 0), 3.2, '#b71c1c');
      ctx.strokeStyle = '#f5f9ff'; ctx.lineWidth = 2.6 * s;
      const a = P(3, 0), m = P(22, -2.2), b = P(40, -5);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(m[0], m[1], b[0], b[1]); ctx.stroke();
      ctx.fillStyle = '#37474f';
      const g = P(3, 0);
      ctx.beginPath(); ctx.arc(g[0], g[1], 2.8 * s, 0, TAU); ctx.fill();
      break;
    }
    case 'cosmic': {
      ctx.save();
      ctx.shadowColor = '#b388ff';
      ctx.shadowBlur = 10;
      line(P(-6, 0), P(3, 0), 3.4, '#311b92');
      line(P(3, 0), P(44, 0), 4.6, 'rgba(179,136,255,0.9)');
      line(P(4, 0), P(42, 0), 1.8, '#ffffff');
      ctx.restore();
      line(P(3, -6), P(3, 6), 3, '#ffd740');
      const tw = (Math.sin(t * 10) + 1) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${0.5 + tw * 0.5})`;
      const sp = P(20 + tw * 18, 0);
      ctx.fillRect(sp[0] - 1, sp[1] - 1, 2, 2);
      break;
    }
    case 'spear': {
      line(P(-24, 0), P(40, 0), 2.6, '#8d6e63');
      ctx.fillStyle = '#cfd8dc';
      const a = P(38, -4), b = P(52, 0), c = P(38, 4);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fill();
      line(P(36, -3), P(36, 3), 2, '#c62828');
      break;
    }
    case 'hammer': {
      line(P(-6, 0), P(30, 0), 3, '#6d4c41');
      const c1 = P(26, -11), c2 = P(38, -11), c3 = P(38, 11), c4 = P(26, 11);
      ctx.fillStyle = '#90a4ae';
      ctx.beginPath(); ctx.moveTo(c1[0], c1[1]); ctx.lineTo(c2[0], c2[1]); ctx.lineTo(c3[0], c3[1]); ctx.lineTo(c4[0], c4[1]); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#455a64'; ctx.lineWidth = 1.5; ctx.stroke();
      break;
    }
    case 'club': {
      line(P(-4, 0), P(30, 0), 5, '#6d4c41');
      line(P(18, 0), P(34, 0), 10, '#795548');
      break;
    }
    case 'dagger': {
      line(P(-2, 0), P(3, 0), 2.5, '#424242');
      line(P(3, 0), P(17, 0), 2.4, '#cfd8dc');
      break;
    }
    case 'staff': {
      line(P(-20, 0), P(24, 0), 2.4, '#5d4037');
      const o = P(27, 0);
      ctx.fillStyle = '#80deea';
      ctx.beginPath(); ctx.arc(o[0], o[1], 4.5 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(o[0] - 1, o[1] - 1, 1.5 * s, 0, TAU); ctx.fill();
      break;
    }
    case 'darksword': {
      ctx.save();
      ctx.shadowColor = '#d500f9';
      ctx.shadowBlur = 8;
      line(P(-6, 0), P(3, 0), 3.4, '#1a0033');
      line(P(3, 0), P(40, 0), 4.2, '#4a148c');
      line(P(5, 0), P(38, 0), 1.4, '#ea80fc');
      ctx.restore();
      line(P(3, -6), P(3, 6), 3, '#212121');
      break;
    }
    case 'bomb': {
      ctx.fillStyle = '#212121';
      ctx.beginPath(); ctx.arc(hx, hy, 5 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = (t * 8) % 1 > 0.5 ? '#ffeb3b' : '#ff5722';
      ctx.fillRect(hx + 2 * s, hy - 7 * s, 2 * s, 2 * s);
      break;
    }
  }
}

function drawBow(ctx, k, draw) {
  const s = k.s, f = k.f;
  const hx = k.ba[2], hy = k.ba[3];
  const R = 13 * s;
  const cx = hx - f * 6 * s;
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 2.4 * s;
  ctx.beginPath();
  if (f > 0) ctx.arc(cx, hy, R, -1.1, 1.1);
  else ctx.arc(cx, hy, R, Math.PI - 1.1, Math.PI + 1.1);
  ctx.stroke();
  const ex = cx + f * Math.cos(1.1) * R, ey = Math.sin(1.1) * R;
  const px = draw ? k.fa[2] : ex, py = draw ? k.fa[3] : hy;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ex, hy - ey);
  ctx.lineTo(px, py);
  ctx.lineTo(ex, hy + ey);
  ctx.stroke();
  if (draw) {
    ctx.strokeStyle = '#d7ccc8';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(hx + f * 10 * s, hy);
    ctx.stroke();
  }
}

function drawShield(ctx, k, color) {
  const s = k.s;
  const x = k.ba[2] + k.f * 4 * s, y = k.ba[3] - 2 * s;
  ctx.fillStyle = color;
  roundRect(ctx, x - 5 * s, y - 16 * s, 10 * s, 30 * s, 4 * s);
  ctx.fill();
  ctx.strokeStyle = '#eceff1';
  ctx.lineWidth = 2 * s;
  ctx.stroke();
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.arc(x, y - 1 * s, 2.5 * s, 0, TAU); ctx.fill();
}

function drawShadowEllipse(ctx, x, y, w, a = 0.25) {
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath();
  ctx.ellipse(x, y, w, w * 0.22, 0, 0, TAU);
  ctx.fill();
}

// ---------- Creatures ----------
function drawBat(ctx, x, y, s, t, color, f, horns) {
  const flap = Math.sin(t * 18);
  ctx.fillStyle = color;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * 4 * s, y - 2 * s);
    ctx.lineTo(x + side * 13 * s, y - (5 + flap * 8) * s);
    ctx.lineTo(x + side * 22 * s, y - (1 + flap * 10) * s);
    ctx.lineTo(x + side * 17 * s, y + (2 - flap * 2) * s);
    ctx.lineTo(x + side * 12 * s, y + 0.5 * s);
    ctx.lineTo(x + side * 7 * s, y + 4 * s);
    ctx.closePath();
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(x, y, 7 * s, 6.5 * s, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 5 * s, y - 4 * s); ctx.lineTo(x - 4 * s, y - 10 * s); ctx.lineTo(x - 1.5 * s, y - 5 * s);
  ctx.moveTo(x + 5 * s, y - 4 * s); ctx.lineTo(x + 4 * s, y - 10 * s); ctx.lineTo(x + 1.5 * s, y - 5 * s);
  ctx.fill();
  if (horns) {
    ctx.fillStyle = '#ffe082';
    ctx.beginPath();
    ctx.moveTo(x - 4 * s, y - 5 * s); ctx.lineTo(x - 7 * s, y - 12 * s); ctx.lineTo(x - 2 * s, y - 6 * s);
    ctx.moveTo(x + 4 * s, y - 5 * s); ctx.lineTo(x + 7 * s, y - 12 * s); ctx.lineTo(x + 2 * s, y - 6 * s);
    ctx.fill();
  }
  ctx.fillStyle = horns ? '#fff59d' : '#ff5252';
  ctx.fillRect(x + f * 1.5 * s - 3 * s, y - 2 * s, 2 * s, 2 * s);
  ctx.fillRect(x + f * 1.5 * s + 1 * s, y - 2 * s, 2 * s, 2 * s);
}

function drawSlime(ctx, x, y, s, t, color, sq, f) {
  const w = 14 * s * (1 + sq * 0.35), h = 17 * s * (1 - sq * 0.35);
  const g = ctx.createLinearGradient(x, y - h, x, y);
  g.addColorStop(0, shade(color, 0.3));
  g.addColorStop(1, shade(color, -0.2));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w, y);
  ctx.quadraticCurveTo(x - w * 1.05, y - h * 0.9, x, y - h);
  ctx.quadraticCurveTo(x + w * 1.05, y - h * 0.9, x + w, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(x - w * 0.35, y - h * 0.68, 3 * s, 2 * s, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(x + f * 3 * s - 4 * s, y - h * 0.55, 2.5 * s, 3.5 * s);
  ctx.fillRect(x + f * 3 * s + 2 * s, y - h * 0.55, 2.5 * s, 3.5 * s);
}

function drawSpider(ctx, x, y, s, t, color, f, moving, scorpion) {
  const bodyY = y - 9 * s;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 * s;
  ctx.lineCap = 'round';
  const legs = scorpion ? 3 : 4;
  for (let i = 0; i < legs; i++) {
    for (const side of [-1, 1]) {
      const ph = t * (moving ? 16 : 3) + i * 1.3 + (side > 0 ? 0 : Math.PI);
      const lift = Math.max(0, Math.sin(ph)) * 4 * s;
      const baseX = x + (i - (legs - 1) / 2) * 5 * s;
      const kneeX = baseX + side * 8 * s, kneeY = bodyY - 7 * s - lift;
      const footX = baseX + side * 14 * s + Math.cos(ph) * 2 * s, footY = y - lift * 0.3;
      ctx.beginPath();
      ctx.moveTo(baseX, bodyY);
      ctx.lineTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();
    }
  }
  ctx.fillStyle = color;
  if (scorpion) {
    ctx.beginPath(); ctx.ellipse(x - f * 3 * s, bodyY, 11 * s, 6 * s, 0, 0, TAU); ctx.fill();
    // tail
    ctx.lineWidth = 3.5 * s;
    ctx.beginPath();
    const tb = x - f * 12 * s;
    ctx.moveTo(tb, bodyY);
    const sw = Math.sin(t * 4) * 2 * s;
    ctx.quadraticCurveTo(tb - f * 12 * s, bodyY - 10 * s, tb - f * 6 * s + sw, bodyY - 22 * s);
    ctx.quadraticCurveTo(tb + f * 2 * s + sw, bodyY - 26 * s, tb + f * 6 * s + sw, bodyY - 19 * s);
    ctx.stroke();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.arc(tb + f * 7 * s + sw, bodyY - 18 * s, 2.2 * s, 0, TAU); ctx.fill();
    // claws
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5 * s;
    for (const off of [-3, 3]) {
      ctx.beginPath();
      ctx.moveTo(x + f * 6 * s, bodyY + off * 0.3 * s);
      ctx.lineTo(x + f * 14 * s, bodyY - 3 * s + off * s);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x + f * 16 * s, bodyY - 3 * s + off * s, 3 * s, 0, TAU); ctx.fill();
    }
  } else {
    ctx.beginPath(); ctx.ellipse(x - f * 6 * s, bodyY - 1 * s, 9 * s, 7 * s, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + f * 5 * s, bodyY, 5.5 * s, 5 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ef5350';
    ctx.fillRect(x + f * 7 * s - 1 * s, bodyY - 2 * s, 2 * s, 2 * s);
    ctx.fillRect(x + f * 7 * s - 4 * s * f - 1 * s, bodyY - 2.5 * s, 1.6 * s, 1.6 * s);
    ctx.fillStyle = 'rgba(255,82,82,0.6)';
    ctx.beginPath(); ctx.arc(x - f * 7 * s, bodyY - 3 * s, 2.5 * s, 0, TAU); ctx.fill();
  }
}

// ---------- Icons ----------
function drawCoinIcon(ctx, x, y, r, t) {
  const sq = Math.abs(Math.cos(t || 0));
  ctx.fillStyle = '#f9a825';
  ctx.beginPath(); ctx.ellipse(x, y, r * Math.max(0.25, sq), r, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath(); ctx.ellipse(x, y, r * 0.7 * Math.max(0.25, sq), r * 0.7, 0, 0, TAU); ctx.fill();
}
function drawHeartIcon(ctx, x, y, r, color) {
  ctx.fillStyle = color || '#ff4d6d';
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.4);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
  ctx.fill();
}
function drawPotionIcon(ctx, x, y, r) {
  ctx.fillStyle = '#ff5277';
  ctx.beginPath(); ctx.arc(x, y + r * 0.25, r * 0.55, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0e0e0';
  ctx.fillRect(x - r * 0.18, y - r * 0.6, r * 0.36, r * 0.45);
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(x - r * 0.24, y - r * 0.75, r * 0.48, r * 0.2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(x - r * 0.2, y + r * 0.1, r * 0.14, 0, TAU); ctx.fill();
}
function drawSkillGlyph(ctx, id, x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, r * 0.18);
  ctx.lineCap = 'round';
  switch (id) {
    case 'blast':
      ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, TAU); ctx.fill();
      ctx.globalAlpha *= 0.6;
      ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, TAU); ctx.stroke();
      break;
    case 'quake':
      ctx.beginPath();
      ctx.moveTo(x - r, y + r * 0.4); ctx.lineTo(x - r * 0.4, y - r * 0.3); ctx.lineTo(x, y + r * 0.2);
      ctx.lineTo(x + r * 0.4, y - r * 0.5); ctx.lineTo(x + r, y + r * 0.4);
      ctx.stroke();
      break;
    case 'whirl':
      ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, Math.PI * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r * 0.35, Math.PI, Math.PI * 2.5); ctx.stroke();
      break;
    case 'thunder':
      ctx.beginPath();
      ctx.moveTo(x + r * 0.2, y - r); ctx.lineTo(x - r * 0.45, y + r * 0.1); ctx.lineTo(x + r * 0.05, y + r * 0.1);
      ctx.lineTo(x - r * 0.2, y + r); ctx.lineTo(x + r * 0.5, y - r * 0.15); ctx.lineTo(x, y - r * 0.15); ctx.closePath();
      ctx.fill();
      break;
    case 'frost':
      for (let i = 0; i < 3; i++) {
        const a = (i * Math.PI) / 3;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.stroke();
      }
      break;
    case 'meteor':
      ctx.beginPath(); ctx.arc(x + r * 0.25, y + r * 0.25, r * 0.45, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - r * 0.9, y - r * 0.9); ctx.lineTo(x, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - r * 0.3, y - r * 1.0); ctx.lineTo(x + r * 0.2, y - r * 0.2); ctx.stroke();
      break;
  }
  ctx.restore();
}

// ---------- Parallax backdrop ----------
class Backdrop {
  constructor(region, seed) {
    this.R = region;
    const rng = new RNG(seed);
    this.LW = 1600;
    this.t = 0;
    const N = 80;
    const ridge = (base, amps) => {
      const pts = [];
      const coefs = amps.map(([k, a]) => [k, a, rng.range(0, TAU)]);
      for (let i = 0; i < N; i++) {
        const x = (i / N) * TAU;
        let y = base;
        for (const [k, a, ph] of coefs) y -= a * Math.sin(k * x + ph);
        pts.push(y);
      }
      return pts;
    };
    const items = (n, minS, maxS) => {
      const arr = [];
      for (let i = 0; i < n; i++) arr.push({ x: rng.range(0, this.LW), s: rng.range(minS, maxS), v: rng.next() });
      arr.sort((a, b) => a.x - b.x);
      return arr;
    };
    const R = region;
    this.layers = [];
    switch (R.shape) {
      case 'hills':
        this.layers.push({ pf: 0.1, color: R.far, pts: ridge(205, [[3, 30], [7, 18], [13, 8]]), items: [], kind: 'mount' });
        this.layers.push({ pf: 0.28, color: R.mid, pts: ridge(255, [[2, 16], [5, 12], [9, 4]]), items: items(14, 0.7, 1.3), kind: 'lolli' });
        this.layers.push({ pf: 0.5, color: R.near, pts: ridge(300, [[3, 12], [6, 8]]), items: items(8, 0.9, 1.4), kind: 'lolli' });
        break;
      case 'trees':
        this.layers.push({ pf: 0.1, color: R.far, pts: ridge(220, [[4, 8], [9, 5]]), items: items(40, 0.7, 1.1), kind: 'pine' });
        this.layers.push({ pf: 0.28, color: R.mid, pts: ridge(265, [[3, 8], [7, 5]]), items: items(26, 1.0, 1.5), kind: 'pine' });
        this.layers.push({ pf: 0.55, color: R.near, pts: ridge(320, [[2, 6], [5, 4]]), items: items(10, 1.0, 1.6), kind: 'trunk' });
        break;
      case 'dunes':
        this.layers.push({ pf: 0.08, color: R.far, pts: ridge(235, [[2, 12], [5, 6]]), items: items(3, 0.8, 1.3), kind: 'pyramid' });
        this.layers.push({ pf: 0.25, color: R.mid, pts: ridge(265, [[2, 20], [4, 10]]), items: [], kind: '' });
        this.layers.push({ pf: 0.5, color: R.near, pts: ridge(305, [[3, 14], [5, 8]]), items: items(5, 0.8, 1.2), kind: 'cactus' });
        break;
      case 'peaks':
        this.layers.push({ pf: 0.08, color: R.far, pts: ridge(190, [[4, 40], [9, 22], [17, 9]]), items: [], kind: 'snowcap' });
        this.layers.push({ pf: 0.25, color: R.mid, pts: ridge(255, [[3, 18], [8, 9]]), items: items(34, 0.6, 1.0), kind: 'snowpine' });
        this.layers.push({ pf: 0.5, color: R.near, pts: ridge(305, [[2, 10], [5, 6]]), items: items(8, 0.9, 1.3), kind: 'snowpine' });
        break;
      case 'volcano':
        this.layers.push({ pf: 0.06, color: R.far, pts: ridge(250, [[2, 10], [5, 6]]), items: items(2, 1.0, 1.3), kind: 'volcano' });
        this.layers.push({ pf: 0.25, color: R.mid, pts: ridge(270, [[5, 22], [11, 12], [19, 6]]), items: [], kind: '' });
        this.layers.push({ pf: 0.5, color: R.near, pts: ridge(315, [[4, 14], [9, 10]]), items: [], kind: '' });
        break;
      case 'spires':
        this.layers.push({ pf: 0.08, color: R.far, pts: ridge(245, [[2, 6]]), items: items(7, 0.8, 1.4), kind: 'castle' });
        this.layers.push({ pf: 0.25, color: R.mid, pts: ridge(275, [[3, 6]]), items: items(9, 0.8, 1.3), kind: 'tower' });
        this.layers.push({ pf: 0.5, color: R.near, pts: ridge(320, [[2, 4]]), items: [], kind: 'wall' });
        break;
    }
    this.clouds = [];
    const nc = R.shape === 'volcano' ? 5 : R.shape === 'spires' ? 3 : 6;
    for (let i = 0; i < nc; i++) this.clouds.push({ x: rng.range(0, 2000), y: rng.range(20, 130), s: rng.range(0.6, 1.4) });
    this.stars = [];
    if (R.shape === 'spires' || R.shape === 'volcano' || R.shape === 'trees') {
      for (let i = 0; i < 60; i++) this.stars.push({ x: rng.range(0, 1), y: rng.range(0, 0.5), s: rng.range(0.5, 1.6), p: rng.range(0, TAU) });
    }
  }

  draw(ctx, camX, camY, W, H, t) {
    const R = this.R;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, R.sky[0]);
    g.addColorStop(1, R.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const s of this.stars) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + s.p);
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    // sun / moon
    const sx = W * 0.76, sy = 64 - camY * 0.05;
    const night = R.shape === 'spires' || R.shape === 'trees';
    const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 90);
    sg.addColorStop(0, rgba(R.sun.length === 7 ? R.sun : '#ffffff', 0.55));
    sg.addColorStop(1, rgba(R.sun.length === 7 ? R.sun : '#ffffff', 0));
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 90, sy - 90, 180, 180);
    ctx.fillStyle = R.sun;
    ctx.beginPath(); ctx.arc(sx, sy, night ? 20 : 26, 0, TAU); ctx.fill();
    if (night) {
      ctx.fillStyle = R.sky[0];
      ctx.beginPath(); ctx.arc(sx + 9, sy - 5, 17, 0, TAU); ctx.fill();
    }
    // clouds
    if (R.shape !== 'volcano') {
      ctx.fillStyle = night ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.75)';
      for (const c of this.clouds) {
        const x = ((((c.x - camX * 0.04 - t * 8 * c.s) % 2000) + 2000) % 2000) - 200;
        if (x > W + 100) continue;
        const y = c.y - camY * 0.05;
        ctx.beginPath();
        ctx.ellipse(x, y, 34 * c.s, 11 * c.s, 0, 0, TAU);
        ctx.ellipse(x + 18 * c.s, y - 8 * c.s, 20 * c.s, 12 * c.s, 0, 0, TAU);
        ctx.ellipse(x - 14 * c.s, y - 5 * c.s, 16 * c.s, 9 * c.s, 0, 0, TAU);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = 'rgba(40,20,20,0.35)';
      for (const c of this.clouds) {
        const x = ((((c.x - camX * 0.04 - t * 5 * c.s) % 2000) + 2000) % 2000) - 200;
        ctx.beginPath(); ctx.ellipse(x, c.y * 0.6, 60 * c.s, 14 * c.s, 0, 0, TAU); ctx.fill();
      }
    }
    for (let li = 0; li < this.layers.length; li++) this.drawLayer(ctx, this.layers[li], camX, camY, W, H, t, li);
    if (R.shape === 'trees') {
      const fg = ctx.createLinearGradient(0, H * 0.5, 0, H);
      fg.addColorStop(0, 'rgba(160,200,180,0)');
      fg.addColorStop(1, 'rgba(160,200,180,0.12)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, H * 0.5, W, H * 0.5);
    }
    if (R.shape === 'volcano') {
      const lg = ctx.createLinearGradient(0, H * 0.55, 0, H);
      lg.addColorStop(0, 'rgba(255,87,34,0)');
      lg.addColorStop(1, `rgba(255,87,34,${0.18 + Math.sin(t * 1.5) * 0.05})`);
      ctx.fillStyle = lg;
      ctx.fillRect(0, H * 0.55, W, H * 0.45);
    }
  }

  drawLayer(ctx, L, camX, camY, W, H, t, li) {
    const LW = this.LW;
    const N = L.pts.length;
    const step = LW / N;
    const off = (((camX * L.pf) % LW) + LW) % LW;
    const yOff = -camY * L.pf * 0.35 + (H - 360) * 0.5 + 30 * L.pf;
    ctx.fillStyle = L.color;
    ctx.beginPath();
    ctx.moveTo(-2, H);
    const i0 = Math.floor(off / step);
    const cnt = Math.ceil(W / step) + 2;
    for (let k = 0; k <= cnt; k++) {
      const i = i0 + k;
      const x = i * step - off;
      ctx.lineTo(x, L.pts[i % N] + yOff);
    }
    ctx.lineTo(W + 2, H);
    ctx.closePath();
    ctx.fill();
    if (!L.items.length && L.kind !== 'wall' && L.kind !== 'snowcap') return;
    const yAt = (x) => {
      const fx = (x + off) / step;
      const i = Math.floor(fx);
      const fr = fx - i;
      return lerp(L.pts[((i % N) + N) % N], L.pts[(((i + 1) % N) + N) % N], fr) + yOff;
    };
    if (L.kind === 'snowcap') {
      // snow on peaks: draw lighter ridge tops
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let k = 0; k <= cnt; k++) {
        const i = i0 + k;
        const y = L.pts[i % N], yp = L.pts[(i - 1 + N) % N], yn = L.pts[(i + 1) % N];
        if (y < yp && y < yn && y < 170) {
          const x = i * step - off;
          ctx.beginPath();
          ctx.moveTo(x, y + yOff - 1);
          ctx.lineTo(x - step * 0.9, y + yOff + 16);
          ctx.lineTo(x - step * 0.3, y + yOff + 11);
          ctx.lineTo(x, y + yOff + 17);
          ctx.lineTo(x + step * 0.3, y + yOff + 11);
          ctx.lineTo(x + step * 0.9, y + yOff + 16);
          ctx.closePath();
          ctx.fill();
        }
      }
      return;
    }
    if (L.kind === 'wall') {
      ctx.fillStyle = L.color;
      const bw = 26;
      const o2 = off % (bw * 2);
      for (let x = -o2; x < W + bw; x += bw * 2) {
        const y = yAt(x) - 14;
        ctx.fillRect(x, y, bw, 16);
      }
      return;
    }
    for (const it of L.items) {
      for (const rep of [0, LW]) {
        const x = it.x + rep - off;
        if (x < -120 || x > W + 120) continue;
        const y = yAt(x) + 2;
        const s = it.s;
        switch (L.kind) {
          case 'lolli': {
            ctx.fillStyle = shade(L.color, -0.25);
            ctx.fillRect(x - 2 * s, y - 22 * s, 4 * s, 22 * s);
            ctx.fillStyle = shade(L.color, 0.08);
            ctx.beginPath(); ctx.arc(x, y - 28 * s, 13 * s, 0, TAU); ctx.fill();
            ctx.fillStyle = shade(L.color, -0.08);
            ctx.beginPath(); ctx.arc(x + 5 * s, y - 25 * s, 8 * s, 0, TAU); ctx.fill();
            break;
          }
          case 'pine':
          case 'snowpine': {
            const c = L.color;
            ctx.fillStyle = c;
            const h = 60 * s;
            ctx.fillRect(x - 2 * s, y - 10 * s, 4 * s, 12 * s);
            for (let j = 0; j < 3; j++) {
              const ty = y - 8 * s - j * h * 0.26;
              const tw = (18 - j * 4.5) * s;
              ctx.beginPath();
              ctx.moveTo(x - tw, ty);
              ctx.lineTo(x, ty - h * 0.42);
              ctx.lineTo(x + tw, ty);
              ctx.closePath();
              ctx.fill();
            }
            if (L.kind === 'snowpine') {
              ctx.fillStyle = 'rgba(255,255,255,0.7)';
              ctx.beginPath();
              ctx.moveTo(x - 5 * s, y - h * 0.62);
              ctx.lineTo(x, y - h * 0.94);
              ctx.lineTo(x + 5 * s, y - h * 0.62);
              ctx.closePath();
              ctx.fill();
            }
            break;
          }
          case 'trunk': {
            ctx.fillStyle = L.color;
            ctx.fillRect(x - 9 * s, y - 360, 18 * s, 362);
            ctx.beginPath(); ctx.arc(x, y - 250 * s, 70 * s, 0, TAU); ctx.fill();
            ctx.fillRect(x - 30 * s, y - 120 * s, 22 * s, 4 * s);
            break;
          }
          case 'pyramid': {
            ctx.fillStyle = shade(L.color, -0.05);
            ctx.beginPath();
            ctx.moveTo(x - 70 * s, y + 4);
            ctx.lineTo(x, y - 75 * s);
            ctx.lineTo(x + 70 * s, y + 4);
            ctx.fill();
            ctx.fillStyle = shade(L.color, -0.18);
            ctx.beginPath();
            ctx.moveTo(x, y - 75 * s);
            ctx.lineTo(x + 70 * s, y + 4);
            ctx.lineTo(x + 18 * s, y + 4);
            ctx.fill();
            break;
          }
          case 'cactus': {
            ctx.fillStyle = shade(L.color, -0.2);
            ctx.fillRect(x - 3 * s, y - 34 * s, 7 * s, 36 * s);
            ctx.fillRect(x - 12 * s, y - 24 * s, 5 * s, 12 * s);
            ctx.fillRect(x - 12 * s, y - 14 * s, 10 * s, 4 * s);
            ctx.fillRect(x + 8 * s, y - 28 * s, 5 * s, 12 * s);
            ctx.fillRect(x + 3 * s, y - 18 * s, 10 * s, 4 * s);
            break;
          }
          case 'volcano': {
            ctx.fillStyle = L.color;
            ctx.beginPath();
            ctx.moveTo(x - 150 * s, y + 10);
            ctx.lineTo(x - 28 * s, y - 120 * s);
            ctx.lineTo(x + 28 * s, y - 120 * s);
            ctx.lineTo(x + 150 * s, y + 10);
            ctx.fill();
            const glow = 0.6 + Math.sin(t * 2 + it.v * 6) * 0.2;
            ctx.fillStyle = `rgba(255,111,0,${glow})`;
            ctx.beginPath(); ctx.ellipse(x, y - 120 * s, 28 * s, 6 * s, 0, 0, TAU); ctx.fill();
            ctx.strokeStyle = `rgba(255,87,34,${glow * 0.8})`;
            ctx.lineWidth = 3 * s;
            ctx.beginPath(); ctx.moveTo(x - 5 * s, y - 118 * s); ctx.lineTo(x - 18 * s, y - 70 * s); ctx.lineTo(x - 10 * s, y - 40 * s); ctx.stroke();
            ctx.fillStyle = 'rgba(60,40,40,0.35)';
            for (let j = 0; j < 4; j++) {
              const pp = (t * 0.15 + j * 0.25 + it.v) % 1;
              ctx.beginPath(); ctx.arc(x + Math.sin(pp * 6 + j) * 15 * s, y - 130 * s - pp * 120 * s, (10 + pp * 25) * s, 0, TAU); ctx.fill();
            }
            break;
          }
          case 'castle': {
            ctx.fillStyle = L.color;
            const w = 26 * s, h = 90 * s + it.v * 60 * s;
            ctx.fillRect(x - w / 2, y - h, w, h + 4);
            ctx.beginPath(); ctx.moveTo(x - w / 2 - 4, y - h); ctx.lineTo(x, y - h - 40 * s); ctx.lineTo(x + w / 2 + 4, y - h); ctx.fill();
            ctx.fillStyle = 'rgba(255,213,79,0.7)';
            for (let j = 0; j < 3; j++) if ((it.v * 10 + j) % 2 < 1.3) ctx.fillRect(x - 3 * s, y - h + 14 * s + j * 22 * s, 5 * s, 8 * s);
            break;
          }
          case 'tower': {
            ctx.fillStyle = L.color;
            const w = 34 * s, h = 70 * s + it.v * 40 * s;
            ctx.fillRect(x - w / 2, y - h, w, h + 4);
            for (let j = 0; j < 4; j++) ctx.fillRect(x - w / 2 + j * (w / 3.5), y - h - 8 * s, w / 7, 8 * s);
            ctx.fillStyle = 'rgba(255,183,77,0.55)';
            ctx.fillRect(x - 4 * s, y - h + 16 * s, 8 * s, 12 * s);
            break;
          }
        }
      }
    }
  }
}

// ---------- Screen-space weather ----------
class Weather {
  constructor(kind, W, H) {
    this.kind = kind;
    this.p = [];
    const n = { snow: 70, leaves: 18, sand: 45, embers: 40, ash: 35 }[kind] || 0;
    for (let i = 0; i < n; i++) this.p.push(this.spawn(W, H, true));
  }
  spawn(W, H, init) {
    const k = this.kind;
    const o = { x: rand(0, W), y: init ? rand(0, H) : -10, s: rand(0.6, 1.4), ph: rand(0, TAU), r: rand(0, TAU) };
    if (k === 'embers') { o.y = init ? rand(0, H) : H + 10; }
    if (k === 'sand') { o.x = init ? rand(0, W) : -10; o.y = rand(0, H); }
    return o;
  }
  update(dt, camDX, W, H) {
    const k = this.kind;
    for (let i = 0; i < this.p.length; i++) {
      const o = this.p[i];
      o.x -= camDX * 0.9;
      o.ph += dt;
      switch (k) {
        case 'snow': o.y += 30 * o.s * dt; o.x += Math.sin(o.ph * 1.5) * 12 * dt - 8 * dt; break;
        case 'leaves': o.y += 26 * o.s * dt; o.x += Math.sin(o.ph * 1.2) * 30 * dt - 10 * dt; o.r += dt * 2; break;
        case 'sand': o.x += 220 * o.s * dt; o.y += Math.sin(o.ph * 3) * 10 * dt; break;
        case 'embers': o.y -= 40 * o.s * dt; o.x += Math.sin(o.ph * 2) * 16 * dt; break;
        case 'ash': o.y += 16 * o.s * dt; o.x += Math.sin(o.ph) * 10 * dt + 6 * dt; break;
      }
      if (o.x < -20) o.x += W + 40;
      if (o.x > W + 20) o.x -= W + 40;
      if (k === 'embers') { if (o.y < -10) this.p[i] = this.spawn(W, H, false); }
      else if (o.y > H + 10) this.p[i] = this.spawn(W, H, false);
    }
  }
  draw(ctx) {
    const k = this.kind;
    for (const o of this.p) {
      switch (k) {
        case 'snow':
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath(); ctx.arc(o.x, o.y, 1.6 * o.s, 0, TAU); ctx.fill();
          break;
        case 'leaves':
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.rotate(o.r);
          ctx.fillStyle = o.s > 1 ? 'rgba(205,160,60,0.8)' : 'rgba(120,170,70,0.75)';
          ctx.beginPath(); ctx.ellipse(0, 0, 4 * o.s, 2 * o.s, 0, 0, TAU); ctx.fill();
          ctx.restore();
          break;
        case 'sand':
          ctx.fillStyle = 'rgba(255,236,190,0.5)';
          ctx.fillRect(o.x, o.y, 6 * o.s, 1.2);
          break;
        case 'embers':
          ctx.fillStyle = `rgba(255,${(140 + Math.sin(o.ph * 5) * 60) | 0},40,0.85)`;
          ctx.fillRect(o.x, o.y, 2 * o.s, 2 * o.s);
          break;
        case 'ash':
          ctx.fillStyle = 'rgba(200,190,220,0.35)';
          ctx.fillRect(o.x, o.y, 2 * o.s, 2 * o.s);
          break;
      }
    }
  }
}

// ===== 06-world.js =====
// ---------- Tile world, collision & level generation ----------
const T_EMPTY = 0, T_SOLID = 1, T_PLAT = 2, T_SPIKE = 3, T_LAVA = 4, T_ICE = 5;
const ROWS = 15;

class World {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.t = new Uint8Array(cols * rows);
    this.pw = cols * TILE;
    this.ph = rows * TILE;
  }
  get(c, r) {
    if (c < 0 || c >= this.cols) return T_SOLID;
    if (r < 0 || r >= this.rows) return T_EMPTY;
    return this.t[r * this.cols + c];
  }
  set(c, r, v) {
    if (c >= 0 && c < this.cols && r >= 0 && r < this.rows) this.t[r * this.cols + c] = v;
  }
  solidAt(c, r) {
    const v = this.get(c, r);
    return v === T_SOLID || v === T_ICE;
  }
  solidPx(x, y) { return this.solidAt(Math.floor(x / TILE), Math.floor(y / TILE)); }
  standablePx(x, y) {
    const v = this.get(Math.floor(x / TILE), Math.floor(y / TILE));
    return v === T_SOLID || v === T_ICE || v === T_PLAT;
  }
  // y (px) of the first walkable surface at/below y in column of x, or null
  groundBelow(x, y) {
    const c = Math.floor(x / TILE);
    for (let r = Math.max(0, Math.floor(y / TILE)); r < this.rows; r++) {
      const v = this.get(c, r);
      if (v === T_SOLID || v === T_ICE || v === T_PLAT) return r * TILE;
      if (v === T_LAVA) return r * TILE;
    }
    return null;
  }
}

function moveActor(a, dt, world, platforms) {
  a.hitWall = 0;
  a.hitCeil = false;
  if (a.plat) {
    const p = a.plat;
    if (p.solid && a.x + a.w > p.x && a.x < p.x + p.w && Math.abs(a.y + a.h - p.prevY) < 4) {
      a.x += p.dx;
      a.y += p.dy;
    }
  }
  a.plat = null;
  // horizontal
  let nx = a.x + a.vx * dt;
  const r0 = Math.floor((a.y + 1) / TILE), r1 = Math.floor((a.y + a.h - 1) / TILE);
  if (a.vx > 0) {
    const c = Math.floor((nx + a.w) / TILE);
    for (let r = r0; r <= r1; r++) {
      if (world.solidAt(c, r)) { nx = c * TILE - a.w - 0.01; a.vx = 0; a.hitWall = 1; break; }
    }
  } else if (a.vx < 0) {
    const c = Math.floor(nx / TILE);
    for (let r = r0; r <= r1; r++) {
      if (world.solidAt(c, r)) { nx = (c + 1) * TILE + 0.01; a.vx = 0; a.hitWall = -1; break; }
    }
  }
  a.x = nx;
  // vertical
  const prevBottom = a.y + a.h;
  let ny = a.y + a.vy * dt;
  a.onGround = false;
  a.onIce = false;
  a.onPlat = false;
  const c0 = Math.floor((a.x + 2) / TILE), c1 = Math.floor((a.x + a.w - 2) / TILE);
  if (a.vy >= 0) {
    const r = Math.floor((ny + a.h) / TILE);
    let land = false, ice = false, plat = false;
    for (let c = c0; c <= c1; c++) {
      const t = world.get(c, r);
      if (t === T_SOLID || t === T_ICE) { land = true; if (t === T_ICE) ice = true; }
      else if (t === T_PLAT && !(a.dropping > 0) && prevBottom <= r * TILE + 1) { land = true; plat = true; }
    }
    if (land) {
      ny = r * TILE - a.h;
      a.vy = 0;
      a.onGround = true;
      a.onIce = ice;
      a.onPlat = plat && !ice;
    }
  } else {
    const r = Math.floor(ny / TILE);
    for (let c = c0; c <= c1; c++) {
      if (world.solidAt(c, r)) { ny = (r + 1) * TILE; a.vy = 0; a.hitCeil = true; break; }
    }
  }
  a.y = ny;
  if (platforms && a.vy >= 0 && !(a.dropping > 0)) {
    for (const p of platforms) {
      if (!p.solid) continue;
      if (a.x + a.w > p.x + 2 && a.x < p.x + p.w - 2) {
        const top = p.y;
        if (prevBottom <= Math.max(top, p.prevY) + 2 && a.y + a.h >= top) {
          a.y = top - a.h;
          a.vy = 0;
          a.onGround = true;
          a.onPlat = true;
          a.onIce = false;
          a.plat = p;
        }
      }
    }
  }
}

// ---------- Level generator ----------
const HEAVY_BY_REGION = ['grunt', 'sword', 'mummy', 'yeti', 'brute', 'knight'];

function makeWaves(n, diff, region, rng) {
  const pool = REGIONS[region].pool;
  const waves = [];
  for (let i = 0; i < n; i++) {
    const cnt = Math.min(7, 2 + Math.floor(diff * 0.45) + i);
    const wv = [];
    for (let k = 0; k < cnt; k++) wv.push(rng.weighted(pool));
    if (i === n - 1 && diff >= 1.2) wv.push(HEAVY_BY_REGION[region]);
    waves.push(wv);
  }
  return waves;
}

function generateLevel(def) {
  const R = REGIONS[def.region];
  const rng = new RNG(def.seed || 1);
  const kind = def.kind;
  const diff = def.diff;
  const maxCols = (def.len || 40) + 160;
  const w = new World(maxCols, ROWS);
  const L = {
    spawns: [], coins: [], gems: [], crates: [], chests: [], springs: [], platforms: [], hazards: [],
    decor: [], signs: [], checkpoints: [], arenas: [], bridges: [], goal: null, start: null,
  };
  let x = 0, g = 11;
  const hz = R.hazards;
  const pool = R.pool;
  const lava = hz.includes('lava');
  const ground = (c, top, tile) => { for (let r = top; r < ROWS; r++) w.set(c, r, tile || T_SOLID); };
  const flat = (n, tile) => { for (let i = 0; i < n; i++) ground(x + i, g, tile); x += n; };
  const px = (c) => c * TILE + TILE / 2;
  const gy = () => g * TILE;
  const enemyScale = kind === 'treasure' ? 0.3 : 1;
  const pickEnemy = (fly) => {
    let t = 'grunt';
    for (let i = 0; i < 12; i++) {
      t = rng.weighted(pool);
      if (fly === undefined || !!ENEMIES[t].flying === fly) return t;
    }
    return fly ? 'bat' : 'grunt';
  };
  const enemy = (c, type, groundY) => {
    type = type || pickEnemy();
    const fly = !!ENEMIES[type].flying;
    const yy = groundY != null ? groundY : gy();
    L.spawns.push({ type, x: px(c), y: fly ? yy - rng.int(70, 120) : yy });
  };
  const enemiesFor = (n) => {
    const per = diff < 1 ? 9.5 : diff < 3 ? 7.5 : 6.5;
    return Math.floor((n / per) * enemyScale + rng.next());
  };
  const coinArc = (c0, c1, baseY, hgt) => {
    const n = c1 - c0;
    for (let i = 0; i <= n; i++) {
      const t = n ? i / n : 0.5;
      L.coins.push({ x: px(c0 + i), y: baseY - 22 - Math.sin(t * Math.PI) * hgt });
    }
  };
  const coinLine = (c0, n, y) => { for (let i = 0; i < n; i++) L.coins.push({ x: px(c0 + i), y }); };
  const lavaPit = (c0, n) => {
    if (!lava) return;
    for (let i = 0; i < n; i++) { w.set(c0 + i, ROWS - 2, T_LAVA); w.set(c0 + i, ROWS - 1, T_SOLID); }
  };
  const addSign = (c, text) => L.signs.push({ x: px(c), y: gy(), text });
  const checkpoint = () => { flat(3); L.checkpoints.push({ x: px(x - 2), y: gy() }); };

  const C = {
    flat() {
      const n = rng.int(6, 10), c0 = x;
      flat(n);
      const ne = enemiesFor(n);
      for (let i = 0; i < ne; i++) enemy(c0 + rng.int(2, n - 2));
      if (rng.chance(kind === 'treasure' ? 0.9 : 0.4)) coinLine(c0 + 2, Math.min(4, n - 3), gy() - 22);
    },
    step() {
      let dy = rng.pick([-2, -1, 1, 2]);
      if (g <= 7) dy = Math.abs(dy);
      if (g >= 11) dy = -Math.abs(dy);
      const ng = clamp(g + dy, 6, 12);
      flat(2);
      if (ng < g) coinArc(x - 1, x + 1, ng * TILE, 30);
      g = ng;
      const c0 = x, n = rng.int(4, 7);
      flat(n);
      if (rng.chance(0.5 * enemyScale)) enemy(c0 + rng.int(1, n - 1));
    },
    gap() {
      flat(2);
      let gw = rng.int(2, diff < 0.5 ? 3 : 4);
      const ng = clamp(g + rng.int(-1, 1), 6, 12);
      if (ng < g) gw = Math.min(gw, 3);
      const c0 = x;
      lavaPit(c0, gw);
      x += gw;
      coinArc(c0 - 1, c0 + gw, Math.min(g, ng) * TILE, 64);
      g = ng;
      flat(3);
    },
    platGap() {
      flat(1);
      const gw = rng.int(6, 9), c0 = x;
      const pr = g - rng.int(1, 2);
      lavaPit(c0, gw);
      if (gw <= 7) {
        const pc = c0 + Math.floor((gw - 3) / 2);
        for (let i = 0; i < 3; i++) w.set(pc + i, pr, T_PLAT);
        coinLine(pc, 3, pr * TILE - 22);
      } else {
        const a = c0 + 2, b = c0 + gw - 3;
        for (let i = 0; i < 2; i++) { w.set(a + i, pr, T_PLAT); w.set(b + i, pr, T_PLAT); }
        coinLine(a, 2, pr * TILE - 22);
        coinLine(b, 2, pr * TILE - 22);
      }
      if (rng.chance(0.35 * enemyScale)) enemy(c0 + Math.floor(gw / 2), pickEnemy(true));
      x += gw;
      flat(2);
    },
    moving() {
      flat(1);
      const gw = rng.int(6, 9), c0 = x;
      const pw = 3 * TILE;
      lavaPit(c0, gw);
      L.platforms.push({ kind: 'move', x: c0 * TILE + 4, y: gy(), w: pw, h: 12, ax: c0 * TILE + 4, bx: (c0 + gw) * TILE - pw - 4, ay: gy(), by: gy(), speed: 70 + diff * 6 });
      coinLine(c0 + 1, gw - 2, gy() - 60);
      x += gw;
      flat(2);
    },
    spikes() {
      const n = rng.int(8, 11), c0 = x;
      flat(n);
      let c = c0 + 2;
      const maxS = diff < 1 ? 2 : 3;
      while (c < c0 + n - 2) {
        const s = rng.int(1, maxS);
        if (c + s > c0 + n - 2) break;
        for (let i = 0; i < s; i++) w.set(c + i, g - 1, T_SPIKE);
        coinArc(c - 1, c + s, gy(), 56);
        c += s + rng.int(2, 4);
      }
    },
    upper() {
      const n = rng.int(11, 14), c0 = x;
      flat(n);
      const p1 = c0 + 2, r1 = g - 3;
      for (let i = 0; i < 3; i++) w.set(p1 + i, r1, T_PLAT);
      const p2 = c0 + 6, r2 = g - 5;
      for (let i = 0; i < 3; i++) w.set(p2 + i, r2, T_PLAT);
      if (rng.chance(kind === 'treasure' ? 0.8 : 0.35)) L.chests.push({ x: px(p2 + 1), y: r2 * TILE });
      else coinLine(p2, 3, r2 * TILE - 22);
      coinLine(p1, 3, r1 * TILE - 22);
      if (n >= 13 && rng.chance(0.5)) {
        for (let i = 0; i < 2; i++) w.set(c0 + 10 + i, r1, T_PLAT);
        if (rng.chance(0.5)) L.gems.push({ x: px(c0 + 10) + 16, y: r1 * TILE - 24 });
      }
      const ne = enemiesFor(n);
      for (let i = 0; i < ne; i++) enemy(c0 + rng.int(1, n - 2));
    },
    wall() {
      flat(2);
      const h = rng.int(2, 3), wd = rng.int(2, 4), c0 = x;
      for (let i = 0; i < wd; i++) ground(x + i, g - h);
      x += wd;
      coinLine(c0, wd, (g - h) * TILE - 22);
      if (rng.chance(0.45 * enemyScale)) {
        const t = pool.some((p) => p[0] === 'archer') ? 'archer' : pickEnemy(false);
        enemy(c0 + Math.floor(wd / 2), t, (g - h) * TILE);
      }
      flat(3);
    },
    crates() {
      const n = rng.int(7, 9), c0 = x;
      flat(n);
      const k = rng.int(2, 4);
      for (let i = 0; i < k; i++) L.crates.push({ x: px(c0 + 1 + i * 2), y: gy() });
      if (rng.chance(0.4 * enemyScale)) enemy(c0 + n - 2);
    },
    spring() {
      flat(2);
      const c0 = x;
      flat(7);
      L.springs.push({ x: px(c0 + 1), y: gy() });
      const pr = Math.max(1, g - 7);
      for (let i = 0; i < 4; i++) w.set(c0 + 3 + i, pr, T_PLAT);
      for (let k = 2; k <= 5; k++) L.coins.push({ x: px(c0 + 1), y: gy() - k * 38 });
      if (rng.chance(0.5)) L.chests.push({ x: px(c0 + 5), y: pr * TILE });
      else L.gems.push({ x: px(c0 + 5), y: pr * TILE - 24 });
      coinLine(c0 + 3, 2, pr * TILE - 22);
    },
    falling() {
      flat(1);
      const gw = rng.int(7, 10), c0 = x;
      lavaPit(c0, gw);
      const count = gw >= 9 ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const cx = c0 + Math.round(((i + 1) * gw) / (count + 1)) - 1;
        L.platforms.push({ kind: 'fall', x: cx * TILE, y: gy(), w: 64, h: 12, ax: cx * TILE, bx: cx * TILE, ay: gy(), by: gy(), speed: 0 });
        L.coins.push({ x: cx * TILE + 32, y: gy() - 40 });
      }
      x += gw;
      flat(2);
    },
    bridge() {
      flat(2);
      const gw = rng.int(8, 12), c0 = x;
      for (let i = 0; i < gw; i++) w.set(x + i, g, T_PLAT);
      L.bridges.push({ c0, c1: c0 + gw, y: gy() });
      lavaPit(c0, gw);
      x += gw;
      const ne = Math.max(1, enemiesFor(gw));
      for (let i = 0; i < ne; i++) enemy(c0 + rng.int(2, gw - 2), pickEnemy(false));
      coinLine(c0 + 2, gw - 4, gy() - 22);
      flat(2);
    },
    stairs() {
      const steps = rng.int(2, 3);
      const dir = g - steps >= 6 && (g >= 10 || rng.chance(0.5)) ? -1 : 1;
      for (let s = 0; s < steps; s++) {
        flat(2);
        g = clamp(g + dir, 6, 12);
      }
      flat(3);
      if (rng.chance(0.5 * enemyScale)) enemy(x - 2);
    },
    saw() {
      const n = rng.int(10, 12), c0 = x;
      flat(n);
      L.hazards.push({ type: 'saw', x0: px(c0 + 2), x1: px(c0 + n - 3), y: gy() - 15, r: 16, speed: 90 + diff * 10 });
      coinLine(c0 + 3, n - 6, gy() - 90);
    },
    fire() {
      const n = rng.int(10, 12), c0 = x;
      flat(n);
      const k = rng.int(2, 3);
      for (let i = 0; i < k; i++) L.hazards.push({ type: 'fire', x: px(c0 + 2 + i * 3), y: gy(), phase: i * 0.7, period: 2.8 });
    },
    icicle() {
      const n = rng.int(10, 12), c0 = x;
      flat(n);
      const cr = g - 5;
      for (let i = 1; i < n - 1; i++) w.set(c0 + i, cr, T_ICE);
      for (let k = 0; k < 3; k++) L.hazards.push({ type: 'icicle', x: px(c0 + 2 + k * 3), y: (cr + 1) * TILE });
      coinLine(c0 + 2, n - 4, cr * TILE - 22);
    },
    lava() {
      const n = rng.int(10, 12), c0 = x;
      flat(n);
      let c = c0 + 2;
      while (c < c0 + n - 3) {
        const s = rng.int(2, 3);
        if (c + s > c0 + n - 2) break;
        for (let i = 0; i < s; i++) w.set(c + i, g, T_LAVA);
        coinArc(c - 1, c + s, gy(), 56);
        c += s + rng.int(2, 3);
      }
    },
    iceRun() {
      const n = rng.int(10, 14), c0 = x;
      flat(n, T_ICE);
      const ne = enemiesFor(n);
      for (let i = 0; i < ne; i++) enemy(c0 + rng.int(2, n - 2));
    },
    lift() {
      const rise = rng.int(3, 4);
      if (g - rise < 5) { C.step(); return; }
      flat(2);
      const c0 = x, sw = 3;
      lavaPit(c0, sw);
      L.platforms.push({ kind: 'move', x: c0 * TILE, y: gy(), w: sw * TILE, h: 12, ax: c0 * TILE, bx: c0 * TILE, ay: gy(), by: (g - rise) * TILE, speed: 60 });
      x += sw;
      g -= rise;
      flat(5);
      coinLine(c0 + sw, 3, gy() - 22);
    },
  };

  const arenaChunk = (waves) => {
    flat(2);
    const n = 22, c0 = x;
    flat(n);
    if (rng.chance(0.6)) {
      for (let i = 0; i < 3; i++) { w.set(c0 + 4 + i, g - 3, T_PLAT); w.set(c0 + n - 7 + i, g - 3, T_PLAT); }
    }
    L.arenas.push({ x0: c0 * TILE, x1: (c0 + n) * TILE, gy: gy(), waves: waves || makeWaves(diff < 1 ? 2 : 3, diff, def.region, rng), done: false });
    flat(2);
  };

  const weights = () => {
    const tr = kind === 'treasure';
    return [
      ['flat', tr ? 2 : 3], ['step', 3], ['gap', 3], ['platGap', 2], ['spikes', hz.includes('spikes') ? 2 : 0.6],
      ['upper', tr ? 4 : 2], ['wall', 1.5], ['crates', tr ? 3 : 1.5], ['moving', diff >= 0.6 ? 2 : 0],
      ['spring', tr ? 3 : 1], ['falling', hz.includes('fall') ? 2 : 0], ['bridge', def.region === 1 ? 2.5 : 0.7],
      ['stairs', 1], ['saw', hz.includes('saw') ? 2 : 0], ['fire', hz.includes('fire') ? 2 : 0],
      ['icicle', hz.includes('icicle') ? 2 : 0], ['lava', lava ? 2.5 : 0], ['iceRun', hz.includes('ice') ? 1.5 : 0],
      ['lift', diff >= 1 ? 1 : 0],
    ].filter((e) => e[1] > 0);
  };

  const levelTo = (target) => {
    while (g < target) { flat(2); g++; }
    while (g > target) { flat(2); g--; }
  };

  if (kind === 'normal' || kind === 'treasure' || kind === 'boss') {
    flat(10);
    L.start = { x: px(3), y: gy() };
    if (def.tutorial) {
      addSign(5, 'Welcome, hero! {MOVE}');
      flat(6);
      addSign(x - 2, 'Press {JUMP} to jump. Press it again in mid-air to DOUBLE JUMP!');
      flat(2); g -= 2; flat(5);
      C.gap();
      flat(2);
      addSign(x - 1, 'An enemy! Press {ATTACK} repeatedly for a 3-hit combo.');
      flat(4); enemy(x + 3, 'grunt'); flat(8);
      addSign(x - 1, 'Hold UP + {ATTACK} for an uppercut launcher. In the air, hold DOWN + {ATTACK} to slam!');
      flat(3); enemy(x + 4, 'grunt'); enemy(x + 8, 'slime'); flat(12);
      addSign(x - 1, 'Smash crates for coins and loot!');
      C.crates();
      addSign(x, 'Use {DASH} to zip past danger. You are invincible while dashing!');
      flat(2);
      C.spikes();
      addSign(x + 1, 'Skills use ENERGY (blue bar). Hits recharge it. Try {SKILL}!');
      flat(4); enemy(x + 4, 'slime'); enemy(x + 7, 'grunt'); enemy(x + 10, 'bat'); flat(13);
      checkpoint();
      C.platGap();
      addSign(x + 1, 'Hold DOWN + {JUMP} to drop through wooden platforms.');
      C.upper();
      addSign(x + 1, 'Arenas lock you in until every enemy is defeated!');
      flat(3);
      arenaChunk([['grunt', 'slime'], ['grunt', 'grunt', 'bat']]);
      addSign(x + 1, 'Hurt? Drink a potion with the flask button (top-left). Now go reach the flag!');
      flat(4);
    } else {
      const target = def.len;
      let arenaPlaced = kind !== 'normal';
      let cpPlaced = kind === 'boss';
      let last = '';
      while (x < target) {
        if (!cpPlaced && x > target * 0.48) { levelTo(clamp(g, 8, 11)); checkpoint(); cpPlaced = true; }
        if (!arenaPlaced && x > target * 0.55) { arenaChunk(); arenaPlaced = true; continue; }
        const ws = weights().filter((e) => e[0] !== last);
        const ch = rng.weighted(ws);
        last = ch;
        C[ch]();
      }
    }
    if (kind === 'boss') {
      levelTo(11);
      flat(3);
      checkpoint();
      flat(2);
      const n = 26, c0 = x;
      flat(n);
      L.arenas.push({ x0: c0 * TILE, x1: (c0 + n) * TILE, gy: gy(), boss: def.boss, waves: [], done: false });
    } else {
      levelTo(clamp(g, 8, 11));
      flat(4);
      L.goal = { x: px(x + 3), y: gy() };
      flat(10);
    }
  } else {
    // arena-only stages: challenge / ambush / endless
    g = 11;
    const n = 30;
    flat(n);
    for (let i = 0; i < 4; i++) { w.set(5 + i, g - 3, T_PLAT); w.set(n - 9 + i, g - 3, T_PLAT); }
    for (let i = 0; i < 4; i++) w.set(13 + i, g - 5, T_PLAT);
    L.start = { x: px(Math.floor(n / 2)), y: gy() };
    const waves = kind === 'endless' ? [] : makeWaves(def.waves || 3, diff, def.region, rng);
    L.arenas.push({ x0: 0, x1: n * TILE, gy: gy(), waves, done: false, endless: kind === 'endless' });
  }

  // trim to used width
  const cols = x;
  const fw = new World(cols, ROWS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < cols; c++) fw.t[r * cols + c] = w.t[r * maxCols + c];
  L.world = fw;
  L.cols = cols;

  // decorations on walkable surfaces
  const decoRng = new RNG((def.seed || 1) + 99);
  for (let c = 0; c < cols; c++) {
    for (let r = 1; r < ROWS; r++) {
      const t = fw.get(c, r);
      if (t === T_SOLID) {
        const above = fw.get(c, r - 1);
        if (above === T_EMPTY && decoRng.chance(0.32)) {
          L.decor.push({ type: decoRng.pick(R.decor), x: c * TILE + decoRng.range(4, 28), y: r * TILE, s: decoRng.range(0.75, 1.2), v: decoRng.next() });
        }
        break;
      }
      if (t !== T_EMPTY) break;
    }
  }
  return L;
}

// ===== 07-fx.js =====
// ---------- Particles & visual effects ----------
class FX {
  constructor() {
    this.list = [];
    this.texts = [];
    this.flashA = 0;
    this.flashC = '#ffffff';
  }
  add(p) {
    if (this.list.length > 500) this.list.splice(0, 50);
    p.t = 0;
    this.list.push(p);
    return p;
  }
  spark(x, y, color, n = 8, spd = 260, dir = 0, spread = TAU) {
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * spread;
      const v = spd * rand(0.4, 1);
      this.add({ type: 'line', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 300, drag: 3, life: rand(0.18, 0.35), color, size: rand(1.5, 2.5) });
    }
  }

      }

      ctx.fillText(p.str, p.x, p.y);
    }

  }

        ctx.fillStyle = '#b3e5fc';
        ctx.beginPath();
        for (let i = 0; i < 7; i++) { const a = (i / 7) * TAU; const rr = this.r * (0.8 + ((i * 37) % 10) / 30); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.fill();
        ctx.strokeStyle = '#e1f5fe'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        break;
      }
      case 'shard': {
        ctx.fillStyle = '#e1f5fe';
        ctx.save(); ctx.translate(x, y); ctx.rotate(t * 10);
        ctx.fillRect(-4, -2, 8, 4);
        ctx.restore();
        break;
      }
      case 'icespike': {
        const warn = 0.55;
        if (this.t < warn) {
          ctx.strokeStyle = `rgba(179,229,252,${0.4 + 0.4 * Math.sin(t * 30)})`;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x - 12, y - 1); ctx.lineTo(x - 3, y - 4); ctx.lineTo(x + 4, y - 1); ctx.lineTo(x + 12, y - 3); ctx.stroke();
        } else if (this.rect && this.rect.h > 0) {
          const h = this.rect.h;
          ctx.fillStyle = '#b3e5fc';
          ctx.beginPath(); ctx.moveTo(x - 11, y); ctx.lineTo(x - 2, y - h); ctx.lineTo(x + 11, y); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 2, y - h); ctx.lineTo(x + 2, y); ctx.fill();
        }
        break;
      }
      case 'beam': {
        const warn = this.warn || 0.8;
        const bw = this.bw || 22;
        const col = this.color || '#ea80fc';
        if (this.t < warn) {
          ctx.fillStyle = rgba(col, 0.15 + 0.15 * Math.sin(t * 25));
          ctx.fillRect(x - bw, 0, bw * 2, 2000);
          ctx.strokeStyle = rgba(col, 0.6);
          ctx.lineWidth = 1;
          ctx.strokeRect(x - bw, -10, bw * 2, 2000);
        } else {
          const k = 1 - (this.t - warn) / (this.life - warn);
          ctx.fillStyle = rgba(col, 0.55 * k + 0.2);
          ctx.fillRect(x - bw * k, -10, bw * 2 * k, 2000);
          ctx.fillStyle = `rgba(255,255,255,${0.8 * k})`;
          ctx.fillRect(x - bw * 0.35 * k, -10, bw * 0.7 * k, 2000);
        }
        break;
      }
      case 'wave': {
        const f = sign(this.vx) || 1;
        ctx.fillStyle = 'rgba(213,0,249,0.75)';
        ctx.beginPath();
        ctx.moveTo(x - f * 6, y - 26);
        ctx.quadraticCurveTo(x + f * 18, y, x - f * 6, y + 26);
        ctx.quadraticCurveTo(x + f * 6, y, x - f * 6, y - 26);
        ctx.fill();
        break;
      }
      case 'flame': {
        const k = this.t / this.life;
        ctx.fillStyle = k < 0.3 ? '#ffe082' : k < 0.6 ? '#ff9800' : 'rgba(244,67,54,0.7)';
        ctx.beginPath(); ctx.arc(x, y, this.r * (0.6 + k * 0.8), 0, TAU); ctx.fill();
        break;
      }
      case 'marker': {
        if (this.gy != null) {
          const k = clamp(1 - (this.gy - this.y) / 500, 0.2, 1);
          ctx.fillStyle = `rgba(255,50,50,${0.25 + 0.25 * k})`;
          ctx.beginPath(); ctx.ellipse(this.tx != null ? this.tx : x, this.gy, 18 * k + 6, 4, 0, 0, TAU); ctx.fill();
        }
        if (this.t < (this.delay || 0)) break;
        if (this.kind === 'icicle') {
          ctx.fillStyle = '#b3e5fc';
          ctx.beginPath(); ctx.moveTo(x - 7, y - 26); ctx.lineTo(x + 7, y - 26); ctx.lineTo(x, y + 4); ctx.fill();
        } else if (this.kind === 'darkorb') {
          ctx.fillStyle = 'rgba(213,0,249,0.4)'; ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.fill();
          ctx.fillStyle = '#6a1b9a'; ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill();
        } else if (this.kind === 'rock') {
          ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.arc(x - 2, y - 2, 4, 0, TAU); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,87,34,0.35)'; ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ffe082'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
        }
        break;
      }
    }
  }
}

// ---------- Pickups ----------
class Pickup {
  constructor(type, x, y, o = {}) {
    this.type = type;
    this.x = x; this.y = y;
    this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.fixed = !!o.fixed;
    this.value = o.value || 1;
    this.t = rand(0, 10);
    this.age = 0;
    this.dead = false;
    this.r = type === 'shard' ? 14 : 8;
    this.life = o.life || (this.fixed ? 1e9 : 14);
  }
  update(dt, scene) {
    this.t += dt;
    this.age += dt;
    const p = scene.player;
    if (!this.fixed) {
      this.vy += 900 * dt;
      this.vx *= Math.max(0, 1 - 1.5 * dt);
      const nx = this.x + this.vx * dt;
      if (!scene.world.solidPx(nx, this.y)) this.x = nx; else this.vx = -this.vx * 0.4;
      const ny = this.y + this.vy * dt;
      if (this.vy > 0 && scene.world.standablePx(this.x, ny + 6)) {
        this.y = Math.floor((ny + 6) / TILE) * TILE - 6;
        this.vy = -this.vy * 0.35;
        if (Math.abs(this.vy) < 40) this.vy = 0;
        this.vx *= 0.7;
      } else this.y = ny;
      if (this.y > scene.world.ph + 40) this.dead = true;
    }
    if (p && !p.dead && this.age > 0.25) {
      const dx = p.x + p.w / 2 - this.x, dy = p.y + p.h / 2 - this.y;
      const d = Math.hypot(dx, dy);
      const magnet = this.type === 'coin' || this.type === 'gem' ? 80 : 40;
      if (d < magnet && this.type !== 'shard') {
        this.fixed = true;
        const sp = 520 * dt;
        this.x += (dx / d) * sp;
        this.y += (dy / d) * sp;
      }
      if (d < 22) this.collect(scene);
    }
    if (this.age > this.life) this.dead = true;
  }
  collect(scene) {
    if (this.dead) return;
    const p = scene.player;
    switch (this.type) {
      case 'coin':
        scene.addCoins(this.value);
        Sound.play('coin');
        scene.fx.spark(this.x, this.y, '#ffeb3b', 4, 100);
        break;
      case 'gem':
        scene.addCoins(this.value);
        Sound.play('gem');
        scene.fx.text(this.x, this.y - 10, '+' + this.value, '#80deea', 13);
        scene.fx.spark(this.x, this.y, '#80deea', 8, 140);
        break;
      case 'heart': {
        const amt = Math.round(p.maxHp * 0.2);
        p.heal(amt);
        break;
      }
      case 'energy':
        p.en = Math.min(p.maxEn, p.en + 30);
        Sound.play('magic');
        scene.fx.text(this.x, this.y - 10, '+30 EN', '#4fc3f7', 12);
        break;
      case 'potion':
        if (SAVE.potions < p.potMax) {
          SAVE.potions++;
          scene.fx.text(this.x, this.y - 10, '+1 POTION', '#ff80ab', 12);
        } else {
          scene.addCoins(20);
          scene.fx.text(this.x, this.y - 10, 'BAG FULL +20', '#ffeb3b', 11);
        }
        Sound.play('heal');
        break;
      case 'shard':
        scene.collectShard();
        break;
    }
    this.dead = true;
  }
  draw(ctx) {
    if (this.age > this.life - 2 && Math.floor(this.age * 10) % 2 === 0) return;
    const bob = this.fixed && this.type !== 'coin' ? Math.sin(this.t * 3) * 3 : 0;
    const x = this.x, y = this.y + bob;
    switch (this.type) {
      case 'coin':
        drawCoinIcon(ctx, x, y, this.value >= 5 ? 7.5 : 6, this.t * 4);
        break;
      case 'gem': {
        ctx.fillStyle = '#26c6da';
        ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x + 8, y - 2); ctx.lineTo(x, y + 9); ctx.lineTo(x - 8, y - 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#b2ebf2';
        ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x + 3, y - 2); ctx.lineTo(x, y + 3); ctx.lineTo(x - 3, y - 2); ctx.closePath(); ctx.fill();
        break;
      }
      case 'heart':
        drawHeartIcon(ctx, x, y, 7);
        break;
      case 'energy':
        ctx.fillStyle = 'rgba(79,195,247,0.35)'; ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.fill();
        ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 2, y - 2, 2, 0, TAU); ctx.fill();
        break;
      case 'potion':
        drawPotionIcon(ctx, x, y, 11);
        break;
      case 'shard': {
        const g = ctx.createRadialGradient(x, y, 2, x, y, 40);
        g.addColorStop(0, 'rgba(255,255,255,0.8)');
        g.addColorStop(1, 'rgba(129,212,250,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.fill();
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(this.t * 2) * 0.3);
        ctx.fillStyle = '#81d4fa';
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(9, -3); ctx.lineTo(4, 16); ctx.lineTo(-5, 14); ctx.lineTo(-9, -4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e1f5fe';
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(3, -2); ctx.lineTo(-2, 12); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      }
    }
  }
}

// ---------- Level props ----------
class Crate {
  constructor(x, y) {
    this.w = 28; this.h = 28;
    this.x = x - 14; this.y = y - 28;
    this.hp = 2; this.dead = false; this.flash = 0; this.isProp = true;
  }
  takeHit(h, scene) {
    if (this.dead) return false;
    this.hp -= h.heavy ? 2 : 1;
    this.flash = 0.1;
    if (this.hp <= 0) {
      this.dead = true;
      Sound.play('break');
      scene.fx.shards(this.x + 14, this.y + 14, '#a1887f', 8, 260, 6);
      const cx = this.x + 14, cy = this.y + 10;
      scene.dropCoins(cx, cy, randi(3, 7));
      const r = Math.random();
      if (r < 0.15) scene.addPickup(new Pickup('heart', cx, cy, { vy: -250 }));
      else if (r < 0.27) scene.addPickup(new Pickup('energy', cx, cy, { vy: -250 }));
      else if (r < 0.32) scene.addPickup(new Pickup('potion', cx, cy, { vy: -250 }));
    } else Sound.play('hit');
    return 'hit';
  }
  update(dt) { this.flash = Math.max(0, this.flash - dt); }
  draw(ctx) {
    const x = this.x, y = this.y;
    ctx.fillStyle = this.flash > 0 ? '#fff' : '#a1887f';
    ctx.fillRect(x, y, 28, 28);
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, 26, 26);
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + 26, y + 26);
    ctx.moveTo(x + 26, y + 2); ctx.lineTo(x + 2, y + 26);
    ctx.stroke();
    if (this.hp < 2) {
      ctx.strokeStyle = '#3e2723';
      ctx.beginPath(); ctx.moveTo(x + 8, y + 3); ctx.lineTo(x + 13, y + 12); ctx.lineTo(x + 9, y + 18); ctx.stroke();
    }
  }
}

class Chest {
  constructor(x, y, tier) {
    this.w = 30; this.h = 22;
    this.x = x - 15; this.y = y - 22;
    this.open = false; this.t = 0; this.tier = tier; this.isProp = true;
  }
  update(dt, scene) {
    this.t += dt;
    const p = scene.player;
    if (!this.open && overlap(this, p)) {
      this.open = true;
      Sound.play('chest');
      const cx = this.x + 15, cy = this.y;
      const val = Math.round((20 + Math.random() * 25) * (1 + this.tier * 0.8));
      scene.dropCoins(cx, cy, val, true);
      if (Math.random() < 0.3) scene.addPickup(new Pickup('potion', cx, cy, { vy: -320, vx: rand(-60, 60) }));
      scene.fx.burst(cx, cy, '#ffeb3b', 16, 220, 3);
      scene.fx.text(cx, cy - 20, 'TREASURE!', '#ffd54f', 14);
    }
  }
  takeHit() { return false; }
  draw(ctx) {
    const x = this.x, y = this.y;
    ctx.fillStyle = '#8d5524';
    ctx.fillRect(x, y + 8, 30, 14);
    ctx.fillStyle = '#ffca28';
    ctx.fillRect(x, y + 8, 30, 2);
    ctx.fillRect(x + 13, y + 10, 4, 6);
    if (this.open) {
      ctx.fillStyle = '#6d3f19';
      ctx.fillRect(x, y - 2, 30, 6);
      ctx.fillStyle = 'rgba(255,235,59,0.5)';
      ctx.fillRect(x + 3, y + 4, 24, 5);
    } else {
      ctx.fillStyle = '#a0632b';
      ctx.beginPath(); ctx.moveTo(x, y + 9); ctx.quadraticCurveTo(x + 15, y - 3, x + 30, y + 9); ctx.fill();
      ctx.fillStyle = '#ffca28';
      ctx.fillRect(x + 12, y + 4, 6, 6);
      if (Math.sin(this.t * 4) > 0.8) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 22, y + 2, 2, 2); }
    }
  }
}

class Spring {
  constructor(x, y) {
    this.w = 28; this.h = 10;
    this.x = x - 14; this.y = y - 10;
    this.t = 1;
  }
  update(dt, scene) {
    this.t += dt;
    const p = scene.player;
    if (p.vy > 50 && p.x + p.w > this.x + 2 && p.x < this.x + this.w - 2 && p.y + p.h >= this.y && p.y + p.h <= this.y + 16) {
      p.vy = -980;
      p.y = this.y - p.h - 1;
      p.jumps = 1;
      p.airDash = true;
      p.airAtk = 0;
      p.jumpHeld = false;
      this.t = 0;
      Sound.play('spring');
      scene.fx.dust(this.x + 14, this.y + 8, 6);
    }
  }
  draw(ctx) {
    const x = this.x, y = this.y;
    const k = this.t < 0.25 ? Math.sin((this.t / 0.25) * Math.PI) : 0;
    ctx.fillStyle = '#546e7a';
    ctx.fillRect(x, y + 6, 28, 4);
    ctx.strokeStyle = '#b0bec5';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const top = y - k * 10;
    for (let i = 0; i <= 4; i++) { const yy = lerp(y + 6, top + 3, i / 4); ctx.lineTo(x + 14 + (i % 2 ? 7 : -7), yy); }
    ctx.stroke();
    ctx.fillStyle = '#e53935';
    ctx.fillRect(x + 1, top, 26, 4);
  }
}

class Checkpoint {
  constructor(x, y) {
    this.x = x; this.y = y; this.active = false; this.t = 0; this.raise = 0;
  }
  update(dt, scene) {
    this.t += dt;
    if (this.active) this.raise = Math.min(1, this.raise + dt * 2);
    const p = scene.player;
    if (!this.active && Math.abs(p.x + p.w / 2 - this.x) < 20 && Math.abs(p.y + p.h - this.y) < 60) {
      this.active = true;
      scene.setCheckpoint(this);
    }
  }
  draw(ctx) {
    const x = this.x, y = this.y;
    ctx.fillStyle = '#9e9e9e';
    ctx.fillRect(x - 2, y - 64, 4, 64);
    ctx.fillStyle = '#757575';
    ctx.fillRect(x - 6, y - 4, 12, 4);
    const fy = y - 24 - this.raise * 36;
    const wave = Math.sin(this.t * 6) * 2;
    ctx.fillStyle = this.active ? '#43a047' : '#e53935';
    ctx.beginPath();
    ctx.moveTo(x + 2, fy);
    ctx.lineTo(x + 24, fy + 6 + wave);
    ctx.lineTo(x + 2, fy + 14);
    ctx.fill();
  }
}

class Goal {
  constructor(x, y) { this.x = x; this.y = y; this.t = 0; this.reached = false; }
  update(dt, scene) {
    this.t += dt;
    const p = scene.player;
    if (!this.reached && Math.abs(p.x + p.w / 2 - this.x) < 26 && p.y + p.h > this.y - 110) {
      this.reached = true;
      scene.completeLevel();
    }
  }
  draw(ctx) {
    const x = this.x, y = this.y, t = this.t;
    // glowing portal arch
    const g = ctx.createRadialGradient(x, y - 48, 4, x, y - 48, 60);
    g.addColorStop(0, 'rgba(255,255,255,0.7)');
    g.addColorStop(0.5, 'rgba(255,215,64,0.35)');
    g.addColorStop(1, 'rgba(255,215,64,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - 48, 60, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath(); ctx.ellipse(x, y - 46, 20, 44, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffc107';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(x, y - 46, 22 + Math.sin(t * 4) * 1.5, 46, 0, 0, TAU); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = t * 2 + i * 1.26;
      ctx.fillStyle = '#ffe082';
      ctx.fillRect(x + Math.cos(a) * 26 - 1.5, y - 46 + Math.sin(a) * 50 - 1.5, 3, 3);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 11px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GOAL', x, y - 100);
  }
}

class Sign {
  constructor(x, y, text) { this.x = x; this.y = y; this.text = text; this.show = 0; }
  update(dt, scene) {
    const p = scene.player;
    const near = Math.abs(p.x + p.w / 2 - this.x) < 110 && Math.abs(p.y + p.h - this.y) < 120;
    this.show = clamp(this.show + (near ? dt * 5 : -dt * 5), 0, 1);
  }
  draw(ctx) {
    const x = this.x, y = this.y;
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(x - 2, y - 26, 4, 26);
    ctx.fillStyle = '#a1887f';
    ctx.fillRect(x - 12, y - 34, 24, 14);
    ctx.fillStyle = '#4e342e';
    ctx.fillRect(x - 8, y - 30, 16, 2);
    ctx.fillRect(x - 8, y - 25, 12, 2);
  }
  drawBubble(ctx, scene) {
    if (this.show <= 0) return;
    const txt = resolveKeys(this.text);
    ctx.font = '600 11px system-ui,-apple-system,sans-serif';
    const lines = wrapText(ctx, txt, 200);
    const w = Math.min(220, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16);
    const h = lines.length * 14 + 10;
    let bx = this.x - w / 2;
    const camX = scene.cam.x;
    bx = clamp(bx, camX + 6, camX + Game.W - w - 6);
    const by = this.y - 48 - h;
    ctx.globalAlpha = this.show;
    ctx.fillStyle = 'rgba(15,20,30,0.88)';
    roundRect(ctx, bx, by, w, h, 6);
    ctx.fill();
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, bx + 8, by + 6 + i * 14));
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }
}

function resolveKeys(text) {
  const touch = Input.touchMode;
  const map = touch
    ? { MOVE: 'Drag the joystick on the LEFT side of the screen to move.', JUMP: 'JUMP (arrow button)', ATTACK: 'ATTACK (big button)', DASH: 'DASH (>> button)', SKILL: 'the SKILL button' }
    : { MOVE: 'Move with Arrow keys / WASD.', JUMP: 'SPACE / K', ATTACK: 'J / X', DASH: 'L / SHIFT', SKILL: 'I (skill 1) / O (skill 2)' };
  return text.replace(/\{(\w+)\}/g, (m, k) => map[k] || m);
}

// ---------- Moving & falling platforms ----------
class Platform {
  constructor(o) {
    Object.assign(this, o);
    this.u = 0; this.dir = 1; this.wait = 0.5;
    this.prevY = this.y; this.dx = 0; this.dy = 0;
    this.solid = true; this.state = 'idle'; this.standT = 0; this.vy = 0; this.timer = 0;
    this.len = Math.hypot(this.bx - this.ax, this.by - this.ay);
  }
  update(dt, scene) {
    const ox = this.x, oy = this.y;
    this.prevY = this.y;
    if (this.kind === 'move') {
      if (this.len > 0) {
        if (this.wait > 0) this.wait -= dt;
        else {
          this.u += (this.dir * this.speed * dt) / this.len;
          if (this.u >= 1) { this.u = 1; this.dir = -1; this.wait = 0.7; }
          if (this.u <= 0) { this.u = 0; this.dir = 1; this.wait = 0.7; }
        }
        this.x = lerp(this.ax, this.bx, easeInOut(this.u));
        this.y = lerp(this.ay, this.by, easeInOut(this.u));
      }
    } else if (this.kind === 'fall') {
      const p = scene.player;
      if (this.state === 'idle') {
        if (p.plat === this) {
          this.standT += dt;
          if (this.standT > 0.45) { this.state = 'falling'; this.vy = 0; }
        } else this.standT = Math.max(0, this.standT - dt);
      } else if (this.state === 'falling') {
        this.vy += 1300 * dt;
        this.y += this.vy * dt;
        if (this.y > scene.world.ph + 60) { this.state = 'gone'; this.solid = false; this.timer = 2.5; }
      } else if (this.state === 'gone') {
        this.timer -= dt;
        if (this.timer <= 0) {
          this.state = 'idle'; this.solid = true; this.x = this.ax; this.y = this.ay; this.prevY = this.y; this.standT = 0;
          scene.fx.smoke(this.x + this.w / 2, this.y, 5, 'rgba(255,255,255,0.4)');
        }
      }
    }
    this.dx = this.x - ox;
    this.dy = this.y - oy;
  }
  draw(ctx, R) {
    if (this.state === 'gone') return;
    let x = this.x, y = this.y;
    if (this.kind === 'fall' && this.state === 'idle' && this.standT > 0) x += Math.sin(this.standT * 80) * 1.5;
    ctx.fillStyle = this.kind === 'fall' ? shade(R.plat, -0.15) : R.plat;
    ctx.fillRect(x, y, this.w, this.h);
    ctx.fillStyle = shade(R.plat, 0.25);
    ctx.fillRect(x, y, this.w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x, y + this.h - 3, this.w, 3);
    if (this.kind === 'move') {
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(x + 4, y + 5, 4, 3);
      ctx.fillRect(x + this.w - 8, y + 5, 4, 3);
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + this.w * 0.4, y + 2); ctx.lineTo(x + this.w * 0.5, y + 7); ctx.lineTo(x + this.w * 0.45, y + 11); ctx.stroke();
    }
  }
}

// ---------- Hazards ----------
class Hazard {
  constructor(o) {
    Object.assign(this, o);
    this.t = 0;
    if (this.type === 'saw') { this.x = this.x0; this.dir = 1; }
    if (this.type === 'icicle') { this.state = 'hang'; this.hy = this.y; this.vy = 0; this.timer = 0; }
  }
  update(dt, scene) {
    this.t += dt;
    const p = scene.player;
    switch (this.type) {
      case 'saw': {
        this.x += this.dir * this.speed * dt;
        if (this.x > this.x1) { this.x = this.x1; this.dir = -1; }
        if (this.x < this.x0) { this.x = this.x0; this.dir = 1; }
        if (circleRect(this.x, this.y, this.r - 3, p)) scene.hazardHit(this.x, 0.12);
        if (Math.random() < 0.3) scene.fx.add({ type: 'line', x: this.x - this.dir * 10, y: this.y + this.r - 2, vx: -this.dir * rand(60, 160), vy: rand(-120, -30), g: 500, life: 0.2, color: '#ffe082', size: 1.5 });
        break;
      }
      case 'fire': {
        const c = (this.t + this.phase) % this.period;
        this.stage = c < 1.2 ? 'off' : c < 1.75 ? 'warn' : 'on';
        if (this.stage === 'warn' && Math.random() < 0.3) scene.fx.smoke(this.x, this.y - 4, 1, 'rgba(90,90,90,0.5)');
        if (this.stage === 'on') {
          const rect = { x: this.x - 11, y: this.y - 92, w: 22, h: 92 };
          if (overlap(rect, p)) scene.hazardHit(this.x, 0.12);
          if (Math.random() < 0.9) scene.fx.add({ type: 'dot', x: this.x + rand(-8, 8), y: this.y - rand(0, 20), vx: rand(-20, 20), vy: rand(-320, -200), g: 0, drag: 1, life: 0.35, color: Math.random() < 0.5 ? '#ffab40' : '#ff5722', size: rand(5, 9) });
          if (!this.snd) { this.snd = true; Sound.play('fire'); }
        } else this.snd = false;
        break;
      }
      case 'icicle': {
        if (this.state === 'hang') {
          if (Math.abs(p.x + p.w / 2 - this.x) < 44 && p.y > this.hy) { this.state = 'shake'; this.timer = 0.35; }
        } else if (this.state === 'shake') {
          this.timer -= dt;
          if (this.timer <= 0) { this.state = 'fall'; this.vy = 0; }
        } else if (this.state === 'fall') {
          this.vy += 1500 * dt;
          this.y += this.vy * dt;
          if (circleRect(this.x, this.y + 18, 7, p)) scene.hazardHit(this.x, 0.12);
          if (scene.world.standablePx(this.x, this.y + 26)) {
            scene.fx.shards(this.x, this.y + 20, '#b3e5fc', 7, 200, 5);
            Sound.play('break');
            this.state = 'gone';
            this.timer = 3;
          }
        } else if (this.state === 'gone') {
          this.timer -= dt;
          if (this.timer <= 0) { this.state = 'hang'; this.y = this.hy; }
        }
        break;
      }
    }
  }
  draw(ctx) {
    switch (this.type) {
      case 'saw': {
        const x = this.x, y = this.y, r = this.r;
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(this.x0, y); ctx.lineTo(this.x1, y); ctx.stroke();
        ctx.save(); ctx.translate(x, y); ctx.rotate(this.t * 14 * this.dir);
        ctx.fillStyle = '#b0bec5';
        ctx.beginPath();
        for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; const rr = i % 2 ? r : r * 0.78; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#607d8b'; ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, TAU); ctx.fill();
        ctx.restore();
        break;
      }
      case 'fire': {
        const x = this.x, y = this.y;
        ctx.fillStyle = '#424242';
        ctx.fillRect(x - 12, y - 6, 24, 6);
        ctx.fillStyle = this.stage === 'warn' ? '#ff9800' : '#212121';
        ctx.fillRect(x - 7, y - 7, 14, 3);
        if (this.stage === 'on') {
          const g = ctx.createLinearGradient(x, y, x, y - 92);
          g.addColorStop(0, 'rgba(255,235,59,0.95)');
          g.addColorStop(0.5, 'rgba(255,111,0,0.8)');
          g.addColorStop(1, 'rgba(244,67,54,0)');
          ctx.fillStyle = g;
          const wob = Math.sin(this.t * 40) * 2;
          ctx.beginPath(); ctx.moveTo(x - 10, y - 6); ctx.quadraticCurveTo(x - 14 + wob, y - 50, x + wob, y - 96); ctx.quadraticCurveTo(x + 14 - wob, y - 50, x + 10, y - 6); ctx.fill();
        }
        break;
      }
      case 'icicle': {
        if (this.state === 'gone') return;
        let x = this.x;
        if (this.state === 'shake') x += Math.sin(this.t * 90) * 1.5;
        const y = this.y;
        ctx.fillStyle = '#b3e5fc';
        ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 28); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x + 1, y); ctx.lineTo(x - 1, y + 20); ctx.fill();
        break;
      }
    }
  }
}

// ---------- Player ----------
class Player {
  constructor(scene, x, y) {
    this.scene = scene;
    this.w = 18; this.h = 46;
    this.x = x - this.w / 2; this.y = y - this.h;
    this.vx = 0; this.vy = 0; this.facing = 1;
    this.onGround = false; this.onIce = false; this.onPlat = false; this.plat = null;
    this.refreshStats(true);
    this.state = 'normal'; this.t = 0; this.animT = 0; this.runPh = 0;
    this.jumps = 0; this.coyote = 0; this.jumpBuf = 0; this.jumpHeld = false; this.dropping = 0; this.dashBuf = 0;
    this.airDash = true; this.airAtk = 0; this.dashCd = 0; this.dashT = 0;
    this.inv = 0; this.flash = 0; this.rot = 0; this.spinT = 0;
    this.combo = 0; this.comboWin = 0; this.cur = null; this.queued = false;
    this.skillCd = [0, 0]; this.slowT = 0;
    this.hitChain = 0; this.hitChainT = 0;
    this.dead = false; this.deadT = 0; this.victory = false;
    this.safe = { x: this.x, y: this.y };
    this.ghostT = 0; this.landT = 0; this.hurtT = 0; this.castT = 0; this.recoverT = 0; this.whirlT = 0; this.tick = 0;
    this.scarf = [];
    for (let i = 0; i < 7; i++) this.scarf.push({ x: this.x, y: this.y + 8 });
  }
  refreshStats(full) {
    const st = playerStats(SAVE);
    const oldMax = this.maxHp || st.maxHp;
    this.maxHp = st.maxHp; this.power = st.atk; this.def = st.def;
    this.maxEn = st.maxEn; this.enRegen = st.enRegen; this.potMax = st.potMax;
    if (full) { this.hp = this.maxHp; this.en = Math.round(this.maxEn * 0.6); }
    else this.hp = Math.min(this.maxHp, this.hp + Math.max(0, this.maxHp - oldMax));
    this.weaponId = SAVE.weapon;
    this.weapon = WEAPONS[this.weaponId] || WEAPONS.fists;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }

  update(dt) {
    const I = Input;
    this.t += dt;
    this.animT += dt;
    this.inv = Math.max(0, this.inv - dt);
    this.flash = Math.max(0, this.flash - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.skillCd[0] = Math.max(0, this.skillCd[0] - dt);
    this.skillCd[1] = Math.max(0, this.skillCd[1] - dt);
    this.comboWin = Math.max(0, this.comboWin - dt);
    this.slowT = Math.max(0, this.slowT - dt);
    this.dropping = Math.max(0, this.dropping - dt);
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    this.dashBuf = Math.max(0, this.dashBuf - dt);
    this.coyote = Math.max(0, this.coyote - dt);
    this.landT = Math.max(0, this.landT - dt);
    if (this.hitChainT > 0) {
      this.hitChainT -= dt;
      if (this.hitChainT <= 0) this.endChain();
    }
    if (this.spinT > 0) {
      this.spinT -= dt;
      this.rot = (1 - Math.max(0, this.spinT) / 0.36) * TAU * this.facing;
      if (this.spinT <= 0) this.rot = 0;
    }
    if (this.dead) { this.deadT += dt; return; }
    if (this.victory) {
      this.state = 'normal';
