<style>
:root{--gold:#ffc940;--panel:rgba(14,18,28,.96);--line:#34425a;--text:#f5f5f5;--muted:#9aa7b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

#toast{position:absolute;left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(0,0,0,.85);border:1px solid var(--gold);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;transition:opacity .4s,transform .4s;max-width:90vw;text-align:center}

.phone{width:46px;height:78px;border:4px solid #fff;border-radius:10px;position:relative;animation:rot 2.2s ease-in-out infinite}

@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

</style>

<canvas id="game"></canvas>

<script>
(function () {
// ===== 01-util.js =====
'use strict';
// ---------- Core constants & helpers ----------
const TAU = Math.PI * 2;
const TILE = 32;
const GRAVITY = 1800;
const STEP = 1 / 60;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w);
  const ny = clamp(cy, b.y, b.y + b.h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hash2(a, b) {
  let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + this.f() * (b - a); }
  int(a, b) { return Math.floor(a + this.f() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  weighted(entries) {
    let total = 0;
    for (const e of entries) total += e[1];
    let r = this.f() * total;
    for (const e of entries) {
      r -= e[1];
      if (r <= 0) return e[0];
    }
    return entries[entries.length - 1][0];
  }
}

function shade(hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) {
    r *= 1 + amt; g *= 1 + amt; b *= 1 + amt;
  } else {
    r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt;
  }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function rgba(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 100000) return (n / 1000).toFixed(0) + 'k';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const ss = Math.floor(s % 60);
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

function wrapText(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        out.push(line);
        line = w;
      } else line = test;
    }
    out.push(line);
  }
  return out;
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ===== 02-audio.js =====
// ---------- Synthesized sound effects & music (no audio files needed) ----------
const Sound = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null,
  sfxOn: true, musicOn: true, last: {},

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = 0.8;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 5;
    this.master.connect(comp);
    comp.connect(c.destination);
    this.sfx = c.createGain();
    this.sfx.gain.value = this.sfxOn ? 0.6 : 0;
    this.sfx.connect(this.master);
    this.mus = c.createGain();
    this.mus.gain.value = this.musicOn ? 0.26 : 0;
    this.mus.connect(this.master);
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (c.state === 'suspended') c.resume().catch(() => {});
    Music.onReady();
  },

  setSfx(on) { this.sfxOn = on; if (this.sfx) this.sfx.gain.value = on ? 0.6 : 0; },
  setMusic(on) { this.musicOn = on; if (this.mus) this.mus.gain.value = on ? 0.26 : 0; },

  tone(f, dur, o = {}) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(o.bus || this.sfx);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  noise(dur, o = {}) {
    const c = this.ctx;
    if (!c || !this.noiseBuf) return;
    const t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    const f0 = o.freq || 1200;
    f.frequency.setValueAtTime(f0, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, f0 + o.slide), t + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.bus || this.sfx);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.05);
  },

  play(name, v = 1) {
    if (!this.ctx || !this.sfxOn || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    if (this.last[name] && now - this.last[name] < 0.04) return;
    this.last[name] = now;
    const T = (f, d, o) => this.tone(f, d, o);
    const N = (d, o) => this.noise(d, o);
    switch (name) {
      case 'swing': N(0.09, { vol: 0.12, freq: 2400, filter: 'bandpass', q: 0.8, slide: -1600 }); break;
      case 'swingHeavy': N(0.18, { vol: 0.17, freq: 1300, filter: 'bandpass', q: 0.7, slide: -1000 }); break;

const MIDI = (m) => 440 * Math.pow(2, (m - 69) / 12);
const SCALES = {
  major: [0, 2, 4, 5, 7, 9, 11],
  minor: [0, 2, 3, 5, 7, 8, 10],
  harm: [0, 2, 3, 5, 7, 8, 11],
  phryg: [0, 1, 4, 5, 7, 8, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  lydian: [0, 2, 4, 6, 7, 9, 11],
};
const TRACKS = {
  title: { bpm: 84, root: 57, scale: 'minor', prog: [0, 5, 3, 4], drums: 0, arp: [0, 1, 2, 3, 2, 1], lead: 0.45, pad: true },
  map: { bpm: 100, root: 60, scale: 'major', prog: [0, 4, 5, 3], drums: 1, arp: [0, 2, 1, 2], lead: 0.55, pad: true },
  meadow: { bpm: 126, root: 60, scale: 'major', prog: [0, 5, 3, 4], drums: 2, arp: [0, 1, 2, 1], lead: 0.7 },
  woods: { bpm: 112, root: 57, scale: 'dorian', prog: [0, 6, 5, 4], drums: 2, arp: [0, 2, 1, 3], lead: 0.55 },
  dunes: { bpm: 118, root: 62, scale: 'phryg', prog: [0, 1, 0, 6], drums: 2, arp: [0, 1, 0, 2], lead: 0.65 },
  frost: { bpm: 100, root: 64, scale: 'minor', prog: [0, 3, 5, 4], drums: 1, arp: [0, 2, 3, 2], lead: 0.5, pad: true },
  volcano: { bpm: 138, root: 52, scale: 'harm', prog: [0, 5, 6, 4], drums: 3, arp: [0, 1, 2, 1], lead: 0.65 },
  citadel: { bpm: 128, root: 50, scale: 'harm', prog: [0, 3, 5, 4], drums: 3, arp: [0, 2, 1, 3], lead: 0.6, pad: true },
  boss: { bpm: 156, root: 50, scale: 'minor', prog: [0, 0, 5, 6], drums: 3, arp: [0, 2, 1, 3], lead: 0.75 },
  arena: { bpm: 146, root: 55, scale: 'dorian', prog: [0, 3, 6, 4], drums: 3, arp: [0, 1, 2, 3], lead: 0.7 },
  victory: { bpm: 110, root: 60, scale: 'lydian', prog: [0, 4, 5, 3], drums: 1, arp: [0, 1, 2, 3], lead: 0.6, pad: true },
};

const Music = {
  cur: null, name: null, timer: null, step: 0, next: 0, melody: null, want: null,
  onReady() {
    if (this.want) {
      const w = this.want;
      this.want = null;
      this.play(w);
    }
  },
  play(name) {
    if (!Sound.ctx) { this.want = name; return; }
    if (this.name === name) return;
    this.stop();
    this.name = name;
    this.cur = TRACKS[name];
    if (!this.cur) return;
    const rng = new RNG(hashStr(name) + 7);
    this.melody = [];
    for (let i = 0; i < 32; i++) this.melody.push(rng.chance(this.cur.lead || 0.5) ? rng.int(0, 7) : -1);
    this.step = 0;
    this.next = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 45);
  },
  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this.name = null;
    this.cur = null;
  },
  tick() {
    const c = Sound.ctx;
    if (!c || !this.cur) return;
    if (c.state !== 'running' || !Sound.musicOn) { this.next = c.currentTime + 0.05; return; }
    const sd = 60 / this.cur.bpm / 2;
    if (this.next < c.currentTime - 0.3) this.next = c.currentTime + 0.02;
    while (this.next < c.currentTime + 0.18) {
      this.playStep(this.step, this.next, sd);
      this.next += sd;
      this.step++;
    }
  },
  playStep(step, t, sd) {
    const tr = this.cur;
    const sc = SCALES[tr.scale];
    const bar = Math.floor(step / 8) % tr.prog.length;
    const s8 = step % 8;
    const deg = tr.prog[bar];
    const note = (d, oct) => tr.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
    const bus = Sound.mus;
    const delay = Math.max(0, t - Sound.ctx.currentTime);
    if (s8 === 0 || s8 === 3 || s8 === 4 || s8 === 6)
      Sound.tone(MIDI(note(deg, -2)), sd * 1.5, { type: 'triangle', vol: 0.3, delay, bus });
    const arp = tr.arp;
    const ct = [0, 2, 4, 7][arp[step % arp.length] % 4];
    Sound.tone(MIDI(note(deg + ct, 0)), sd * 0.9, { type: 'square', vol: 0.035, delay, bus });
    if (step % 2 === 0) {
      const m = this.melody[(step / 2) % 32];
      if (m >= 0) Sound.tone(MIDI(note(deg + m, 1)), sd * 1.8, { type: 'triangle', vol: 0.08, delay, bus });
    }
    if (tr.pad && s8 === 0) Sound.tone(MIDI(note(deg + 2, -1)), sd * 8, { type: 'sine', vol: 0.07, attack: 0.25, delay, bus });
    const dr = tr.drums || 0;
    if (dr >= 1 && (s8 === 0 || (dr >= 2 && s8 === 4))) Sound.tone(110, 0.18, { type: 'sine', vol: 0.45, slide: -70, delay, bus });
    if (dr >= 2 && (s8 === 2 || s8 === 6)) Sound.noise(0.12, { vol: 0.16, freq: 1800, filter: 'bandpass', delay, bus });
    if (dr >= 3) Sound.noise(0.03, { vol: 0.05, freq: 7000, filter: 'highpass', delay, bus });
  },
};

// ===== 03-input.js =====
// ---------- Input: touch (virtual joystick + buttons), keyboard, gamepad ----------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyK: 'jump', KeyZ: 'jump',
  KeyJ: 'attack', KeyX: 'attack',
  KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash', KeyC: 'dash',
  KeyI: 'skill1', KeyV: 'skill1', KeyU: 'skill1',
  KeyO: 'skill2', KeyB: 'skill2',
  KeyQ: 'potion', KeyH: 'potion',
  Escape: 'pause', KeyP: 'pause',
};
const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'dash', 'skill1', 'skill2', 'potion', 'pause'];

const Input = {
  key: {}, touch: {}, pad: {}, held: {}, prev: {}, pressed: {}, latch: {},
  active: false, touchMode: false, detectedTouch: false, canvas: null,
  view: { W: 640, H: 360 },
  stick: { id: null, ox: 0, oy: 0, x: 0, y: 0 },
  stickHome: { x: 90, y: 280 },
  buttons: [], btnPtr: new Map(),
  size: 1, alpha: 0.5, safeL: 0, safeR: 0,

  init(canvas) {
    this.canvas = canvas;
    try { this.detectedTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { this.detectedTouch = false; }
    this.touchMode = this.detectedTouch;
    addEventListener('keydown', (e) => {
      const a = KEYMAP[e.code];
      if (a) {
        if (!e.repeat) { this.key[a] = true; this.latch[a] = true; }
        if (this.active) e.preventDefault();
      }
      Sound.init();
    });
    addEventListener('keyup', (e) => {
      const a = KEYMAP[e.code];
      if (a) this.key[a] = false;
    });
    addEventListener('blur', () => this.reset());
    const opt = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.down(e), opt);
    canvas.addEventListener('pointermove', (e) => this.move(e), opt);
    canvas.addEventListener('pointerup', (e) => this.up(e), opt);
    canvas.addEventListener('pointercancel', (e) => this.up(e), opt);
    canvas.addEventListener('lostpointercapture', (e) => this.up(e), opt);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), opt);
  },

  reset() {
    this.key = {}; this.touch = {}; this.pad = {}; this.latch = {};
    this.stick.id = null;
    this.btnPtr.clear();
  },

  pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * this.view.W, y: ((e.clientY - r.top) / r.height) * this.view.H };
  },

  down(e) {
    if (e.pointerType === 'touch' && !this.detectedTouch) {
      this.detectedTouch = true;
      if (!SAVE || !SAVE.settings.touch || SAVE.settings.touch === 'auto') this.touchMode = true;
    }
    Sound.init();
    const p = this.pos(e);
    if (!this.active) {
      if (Game.scene && Game.scene.onPointer) Game.scene.onPointer('down', p, e);
      return;
    }
    e.preventDefault();
    try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    let best = null, bd = 1e9;
    for (const b of this.buttons) {
      if (b.hidden) continue;
      const d = Math.hypot(p.x - b.x, p.y - b.y);
      if (d < b.r + 12 * this.size && d < bd) { best = b; bd = d; }
    }
    if (best) {
      this.btnPtr.set(e.pointerId, best.name);
      this.touch[best.name] = true;
      this.latch[best.name] = true;
      return;
    }
    if (p.x < this.view.W * 0.5 && this.stick.id === null) {
      const s = this.stick;
      s.id = e.pointerId;
      s.ox = p.x; s.oy = p.y; s.x = p.x; s.y = p.y;
      this.updStick();
    }
  },

  move(e) {
    const p = this.pos(e);
    if (!this.active) {
      if (Game.scene && Game.scene.onPointer) Game.scene.onPointer('move', p, e);
      return;
    }
    e.preventDefault();
    const s = this.stick;
    if (e.pointerId === s.id) {
      s.x = p.x; s.y = p.y;
      const R = 46 * this.size;
      const dx = s.x - s.ox, dy = s.y - s.oy;
      const d = Math.hypot(dx, dy);
      if (d > R * 1.5) {
        s.ox = s.x - (dx / d) * R * 1.5;
        s.oy = s.y - (dy / d) * R * 1.5;
      }
      this.updStick();
    }
  },

  up(e) {
    const p = this.pos(e);
    if (!this.active) {
      if (e.type !== 'lostpointercapture' && Game.scene && Game.scene.onPointer) Game.scene.onPointer('up', p, e);
      return;
    }
    const name = this.btnPtr.get(e.pointerId);
    if (name) {
      this.btnPtr.delete(e.pointerId);
      let still = false;
      for (const v of this.btnPtr.values()) if (v === name) still = true;
      if (!still) this.touch[name] = false;
    }
    if (e.pointerId === this.stick.id) {
      this.stick.id = null;
      this.touch.left = this.touch.right = this.touch.up = this.touch.down = false;
    }
  },

  updStick() {
    const s = this.stick;
    const dx = s.x - s.ox, dy = s.y - s.oy;
    const T = 13 * this.size;
    const wasUp = this.touch.up, wasDown = this.touch.down;
    this.touch.left = dx < -T;
    this.touch.right = dx > T;
    this.touch.up = dy < -T * 2 && Math.abs(dy) > Math.abs(dx) * 0.85;
    this.touch.down = dy > T * 2 && Math.abs(dy) > Math.abs(dx) * 0.85;
    if (this.touch.up && !wasUp) this.latch.up = true;
    if (this.touch.down && !wasDown) this.latch.down = true;
  },

  pollPad() {
    const p = this.pad;
    for (const a of ACTIONS) p[a] = false;
    let pads = null;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { pads = null; }
    if (!pads) return;
    for (const gp of pads) {
      if (!gp) continue;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      p.left = p.left || ax < -0.4 || b(14);
      p.right = p.right || ax > 0.4 || b(15);
      p.up = p.up || ay < -0.6 || b(12);
      p.down = p.down || ay > 0.6 || b(13);
      p.jump = p.jump || b(0);
      p.attack = p.attack || b(2);
      p.dash = p.dash || b(1) || b(7);
      p.skill1 = p.skill1 || b(3);
      p.skill2 = p.skill2 || b(5);
      p.potion = p.potion || b(4);
      p.pause = p.pause || b(9);
    }
  },

  poll() {
    this.pollPad();
    for (const a of ACTIONS) {
      const h = !!(this.key[a] || this.touch[a] || this.pad[a]);
      this.pressed[a] = (h && !this.prev[a]) || !!this.latch[a];
      this.held[a] = h;
      this.prev[a] = h;
      this.latch[a] = false;
    }
  },

  clearPressed() {
    for (const a of ACTIONS) this.pressed[a] = false;
  },

  layout(W, H) {
    const s = this.size, L = this.safeL, R = this.safeR;
    this.buttons = [
      { name: 'attack', x: W - R - 72 * s, y: H - 72 * s, r: 38 * s },
      { name: 'jump', x: W - R - 160 * s, y: H - 46 * s, r: 31 * s },
      { name: 'dash', x: W - R - 156 * s, y: H - 128 * s, r: 25 * s },
      { name: 'skill1', x: W - R - 88 * s, y: H - 158 * s, r: 25 * s },
      { name: 'skill2', x: W - R - 30 * s, y: H - 140 * s, r: 22 * s },
      { name: 'potion', x: L + 26, y: 88, r: 17 },
      { name: 'pause', x: W - R - 24, y: 22, r: 17 },
    ];
    this.stickHome = { x: L + 88 * s, y: H - 78 * s };
  },

  btn(name) { return this.buttons.find((b) => b.name === name); },

  draw(ctx, info) {
    const showTouch = this.touchMode;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const b of this.buttons) {
      if (!showTouch && b.name !== 'pause' && b.name !== 'potion') continue;
      const on = !!this.touch[b.name] || !!this.key[b.name];
      let dim = false, cd = 0, color = '#ffffff';
      if (b.name === 'skill1' || b.name === 'skill2') {
        const si = b.name === 'skill1' ? 0 : 1;
        const sk = info.skills[si];
        if (!sk) { dim = true; }
        else {
          color = sk.color;
          dim = !sk.ready;
          cd = sk.cd;
        }
      }
      if (b.name === 'potion' && info.potions <= 0) dim = true;
      const a = this.alpha * (dim ? 0.55 : 1);
      ctx.globalAlpha = Math.min(1, a + (on ? 0.35 : 0));
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = on ? 'rgba(255,255,255,0.35)' : 'rgba(10,14,22,0.45)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = b.name.startsWith('skill') && !dim ? color : 'rgba(255,255,255,0.75)';
      ctx.stroke();
      if (cd > 0) {
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * cd);
        ctx.closePath();
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fill();
      }
      ctx.globalAlpha = Math.min(1, this.alpha + 0.3) * (dim ? 0.6 : 1);
      drawButtonIcon(ctx, b, info);
    }
    if (showTouch) {
      const s = this.stick;
      const R = 46 * this.size;
      const active = s.id !== null;
      const ox = active ? s.ox : this.stickHome.x;
      const oy = active ? s.oy : this.stickHome.y;
      ctx.globalAlpha = this.alpha * (active ? 1 : 0.7);
      ctx.beginPath();
      ctx.arc(ox, oy, R, 0, TAU);
      ctx.fillStyle = 'rgba(10,14,22,0.35)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 4; i++) {
        const ang = (i * Math.PI) / 2;
        const cx = ox + Math.cos(ang) * (R - 10), cy = oy + Math.sin(ang) * (R - 10);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * 6, cy + Math.sin(ang) * 6);
        ctx.lineTo(cx + Math.cos(ang + 2.3) * 5, cy + Math.sin(ang + 2.3) * 5);
        ctx.lineTo(cx + Math.cos(ang - 2.3) * 5, cy + Math.sin(ang - 2.3) * 5);
        ctx.fill();
      }
      let kx = ox, ky = oy;
      if (active) {
        const dx = s.x - ox, dy = s.y - oy;
        const d = Math.hypot(dx, dy);
        const m = Math.min(d, R * 0.8);
        if (d > 0) { kx = ox + (dx / d) * m; ky = oy + (dy / d) * m; }
      }
      ctx.globalAlpha = Math.min(1, this.alpha + 0.2);
      ctx.beginPath();
      ctx.arc(kx, ky, R * 0.42, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fill();
    }
    ctx.restore();
  },
};

function drawButtonIcon(ctx, b, info) {
  const x = b.x, y = b.y, r = b.r;
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = Math.max(2, r * 0.1);
  switch (b.name) {
    case 'attack': {
      if (info.weapon === 'fists') {
        ctx.beginPath();
        roundRect(ctx, x - r * 0.32, y - r * 0.28, r * 0.64, r * 0.56, r * 0.18);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        for (let i = 0; i < 3; i++) ctx.fillRect(x - r * 0.2 + i * r * 0.16, y - r * 0.26, 1.5, r * 0.22);
      } else {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-Math.PI / 4);
        ctx.fillRect(-r * 0.07, -r * 0.55, r * 0.14, r * 0.75);
        ctx.fillRect(-r * 0.28, r * 0.18, r * 0.56, r * 0.1);
        ctx.fillRect(-r * 0.05, r * 0.26, r * 0.1, r * 0.24);
        ctx.restore();
      }
      break;
    }
    case 'jump':
      ctx.beginPath();
      ctx.moveTo(x - r * 0.4, y + r * 0.15);
      ctx.lineTo(x, y - r * 0.3);
      ctx.lineTo(x + r * 0.4, y + r * 0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.4, y + r * 0.45);
      ctx.lineTo(x, y);
      ctx.lineTo(x + r * 0.4, y + r * 0.45);
      ctx.globalAlpha *= 0.5;
      ctx.stroke();
      break;
    case 'dash':
      for (let i = 0; i < 2; i++) {
        const ox = (i - 0.5) * r * 0.45;
        ctx.beginPath();
        ctx.moveTo(x + ox - r * 0.2, y - r * 0.35);
        ctx.lineTo(x + ox + r * 0.18, y);
        ctx.lineTo(x + ox - r * 0.2, y + r * 0.35);
        ctx.stroke();
      }
      break;
    case 'skill1':
    case 'skill2': {
      const sk = info.skills[b.name === 'skill1' ? 0 : 1];
      if (!sk) {
        ctx.beginPath();
        ctx.arc(x, y - r * 0.12, r * 0.22, Math.PI, 0);
        ctx.stroke();
        ctx.fillRect(x - r * 0.3, y - r * 0.1, r * 0.6, r * 0.45);
      } else {
        drawSkillGlyph(ctx, sk.id, x, y, r * 0.55, sk.color);
      }
      break;
    }
    case 'potion':
      drawPotionIcon(ctx, x, y + 1, r * 0.9);
      ctx.font = 'bold 11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('x' + info.potions, x + r * 0.95, y + r + 4);
      if (!Input.touchMode) {
        ctx.font = '9px system-ui,sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('[Q]', x, y + r + 14);
      }
      break;
    case 'pause':
      ctx.fillRect(x - r * 0.3, y - r * 0.38, r * 0.2, r * 0.76);
      ctx.fillRect(x + r * 0.1, y - r * 0.38, r * 0.2, r * 0.76);
      break;
  }
}

function buildMap() {
  const nodes = {};
  const list = [];
  const add = (n) => { n.adj = []; nodes[n.id] = n; list.push(n); return n; };
  const link = (a, b) => { nodes[a].adj.push(b); nodes[b].adj.push(a); };
  const layout = [[40, 250], [125, 170], [205, 240], [215, 108], [295, 165], [372, 236]];
  for (let r = 0; r < 6; r++) {
    const bx = 60 + r * MAP_REGION_W;
    const flip = r % 2 === 1;
    const pos = (i) => ({ x: bx + layout[i][0], y: flip ? 350 - layout[i][1] : layout[i][1] });
    add(Object.assign({ id: `r${r}-town`, type: 'town', region: r, name: NODE_NAMES[r][0] }, pos(0)));
    add(Object.assign({ id: `r${r}-l1`, type: 'level', idx: 0, region: r, name: NODE_NAMES[r][1] }, pos(1)));
    add(Object.assign({ id: `r${r}-l2`, type: 'level', idx: 1, region: r, name: NODE_NAMES[r][2] }, pos(2)));
    add(Object.assign({ id: `r${r}-side`, type: SIDE_TYPE[r], region: r, name: NODE_NAMES[r][3] }, pos(3)));
    add(Object.assign({ id: `r${r}-l3`, type: 'level', idx: 2, region: r, name: NODE_NAMES[r][4] }, pos(4)));
    add(Object.assign({ id: `r${r}-boss`, type: 'boss', region: r, name: NODE_NAMES[r][5] }, pos(5)));
    link(`r${r}-town`, `r${r}-l1`);
    link(`r${r}-l1`, `r${r}-l2`);
    link(`r${r}-l2`, `r${r}-side`);
    link(`r${r}-l2`, `r${r}-l3`);
    link(`r${r}-l3`, `r${r}-boss`);
    if (r > 0) link(`r${r - 1}-boss`, `r${r}-town`);
  }
  add({ id: 'arena', type: 'arena', region: 0, name: 'Grand Colosseum', x: 60 + 118, y: 60 + 20 });
  link('r0-town', 'arena');
  return { nodes, list };
}

function levelDefFor(node) {
  const r = node.region;
  const seed = hashStr(node.id + ':v1');
  switch (node.type) {
    case 'level':
      return { kind: 'normal', region: r, diff: r + node.idx * 0.33, len: 115 + node.idx * 22 + r * 8, seed, tutorial: node.id === 'r0-l1', name: node.name, nodeId: node.id };
    case 'boss':
      return { kind: 'boss', region: r, diff: r + 0.9, len: 60, seed, boss: BOSS_ORDER[r], name: node.name, nodeId: node.id };
    case 'treasure':
      return { kind: 'treasure', region: r, diff: r + 0.4, len: 95, seed, name: node.name, nodeId: node.id };
    case 'challenge':
      return { kind: 'challenge', region: r, diff: r + 0.8, len: 0, seed, waves: 5, name: node.name, nodeId: node.id };
    case 'arena': {
      const top = highestRegionCleared();
      return { kind: 'endless', region: top, diff: top + 0.5, len: 0, seed: (Math.random() * 1e9) | 0, name: node.name, nodeId: node.id };
    }
  }
  return null;
}

function highestRegionCleared() {
  let top = 0;
  for (let r = 0; r < 6; r++) if (SAVE && SAVE.done[`r${r}-boss`]) top = Math.min(5, r + 1);

// ---------- Stickman skeleton, poses & drawing ----------
// Angles: arms/legs measured from straight down; positive = toward facing direction.
// a2 = relative bend of forearm / shin.
const POSE_KEYS = ['lean', 'ba1', 'ba2', 'fa1', 'fa2', 'bl1', 'bl2', 'fl1', 'fl2', 'head'];
function mkPose(lean, ba1, ba2, fa1, fa2, bl1, bl2, fl1, fl2, extra) {
  return Object.assign({ lean, ba1, ba2, fa1, fa2, bl1, bl2, fl1, fl2, head: 0, w: null }, extra || {});
}
function lerpPose(a, b, t) {
  const o = {};
  for (const k of POSE_KEYS) o[k] = a[k] + (b[k] - a[k]) * t;
  if (a.w != null || b.w != null) {
    const aw = a.w != null ? a.w : b.w;
    const bw = b.w != null ? b.w : a.w;
    o.w = aw + (bw - aw) * t;
  } else o.w = null;
  return o;
}
