      this.vx = approach(this.vx, 0, 1500 * dt);
      this.physics(dt);
      return;
    }
    this.en = Math.min(this.maxEn, this.en + this.enRegen * dt);
    if (I.pressed.jump) this.jumpBuf = 0.13;
    if (I.pressed.dash) this.dashBuf = 0.15;
    if (I.pressed.potion) this.usePotion();

    switch (this.state) {
      case 'normal': this.stNormal(dt); break;
      case 'attack': this.stAttack(dt); break;
      case 'dash': this.stDash(dt); break;
      case 'slam': this.stSlam(dt); break;
      case 'whirl': this.stWhirl(dt); break;
      case 'cast':
        this.castT -= dt;
        this.vx = approach(this.vx, 0, 1400 * dt);
        if (this.castT <= 0) this.state = 'normal';
        break;
      case 'recover':
        this.recoverT -= dt;
        this.vx = approach(this.vx, 0, 1800 * dt);
        if (this.recoverT <= 0) this.state = 'normal';
        break;
      case 'hurt':
        this.hurtT -= dt;
        this.vx = approach(this.vx, 0, 500 * dt);
        if (this.hurtT <= 0) this.state = 'normal';
        break;
    }
    if (this.state !== 'dead') this.physics(dt);
    if (Math.abs(this.vx) > 20 && this.onGround) {
      const prev = this.runPh;
      this.runPh += Math.abs(this.vx) * dt * 0.052;
      if (Math.floor(prev / Math.PI) !== Math.floor(this.runPh / Math.PI)) Sound.play('step');
    }
  }

  physics(dt) {
    const S = this.scene;
    if (this.state !== 'dash' && this.state !== 'whirl') {
      let g = GRAVITY * (this.vy > 0 ? 1.15 : 1);
      if (this.state === 'attack' && !this.onGround) g *= 0.4;
      this.vy = Math.min(this.vy + g * dt, this.state === 'slam' ? 1100 : 900);
    }
    const wasGround = this.onGround;
    const prevVy = this.vy;
    moveActor(this, dt, S.world, S.platforms);
    if (this.onGround) {
      this.coyote = 0.1;
      this.jumps = 0;
      this.airDash = true;
      this.airAtk = 0;
      if (!wasGround) this.onLand(prevVy);
      if (!this.onPlat && this.state !== 'hurt') {
        const W = S.world;
        const c0 = Math.floor((this.x - 22) / TILE), c1 = Math.floor((this.x + this.w + 22) / TILE);
        const r = Math.floor((this.y + this.h + 2) / TILE);
        let ok = true;
        for (let c = c0; c <= c1; c++) {
          const t = W.get(c, r);
          if (t !== T_SOLID && t !== T_ICE) ok = false;
          const ta = W.get(c, r - 1);
          if (ta === T_SPIKE || ta === T_LAVA) ok = false;
        }
        if (ok) { this.safe.x = this.x; this.safe.y = this.y; }
      }
    }
    this.checkTiles();
    if (this.y > S.world.ph + 40 && !this.dead) S.playerFell();
  }

  onLand(prevVy) {
    if (prevVy > 420) {
      this.landT = 0.1;
      this.scene.fx.dust(this.cx, this.feet, 4);
      Sound.play('land');
    }
  }

  checkTiles() {
    const W = this.scene.world;
    const c0 = Math.floor((this.x + 3) / TILE), c1 = Math.floor((this.x + this.w - 3) / TILE);
    const r0 = Math.floor((this.y + 4) / TILE), r1 = Math.floor((this.y + this.h - 1) / TILE);
    for (let c = c0; c <= c1; c++) {
      for (let r = r0; r <= r1; r++) {
        const t = W.get(c, r);
        if (t === T_SPIKE && this.y + this.h > r * TILE + 12) { this.scene.hazardHit(c * TILE + 16, 0.12, true); return; }
        if (t === T_LAVA && this.y + this.h > r * TILE + 8) { this.scene.lavaHit(); return; }
      }
    }
  }

  moveInput() {
    const I = Input;
    return (I.held.right ? 1 : 0) - (I.held.left ? 1 : 0);
  }

  stNormal(dt) {
    const I = Input;
    const dir = this.moveInput();
    const spd = 235 * (this.slowT > 0 ? 0.55 : 1);
    let acc, fr;
    if (this.onGround) { acc = this.onIce ? 650 : 2400; fr = this.onIce ? 200 : 2600; }
    else { acc = 1500; fr = 500; }
    if (dir) {
      this.vx = approach(this.vx, dir * spd, acc * dt);
      this.facing = dir;
    } else this.vx = approach(this.vx, 0, fr * dt);
    if (this.jumpBuf > 0) this.tryJump();
    if (!I.held.jump && this.jumpHeld) {
      this.jumpHeld = false;
      if (this.vy < -330 && !Input.touchMode) this.vy = -330;
    }
    if (I.pressed.attack || (I.held.attack && this.canAutoAttack())) this.startAttack(false);
    else if (this.dashBuf > 0) this.startDash();
    else if (I.pressed.skill1) this.castSkill(0);
    else if (I.pressed.skill2) this.castSkill(1);
  }

  canJump() { return this.onGround || this.coyote > 0 || this.jumps < 2; }

  // Holding ATTACK keeps the combo going; in the air it only repeats while air attacks remain.
  canAutoAttack() { return this.onGround || this.airAtk < 3; }

  tryJump() {
    const I = Input;
    const S = this.scene;
    if (this.onGround || this.coyote > 0) {
      if (I.held.down && this.onGround && this.onPlat) {
        this.dropping = 0.28;
        this.onGround = false;
        this.jumpBuf = 0;
        this.plat = null;
        return;
      }
      this.vy = -640;
      this.jumps = 1;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.jumpHeld = true;
      this.onGround = false;
      this.plat = null;
      Sound.play('jump');
      S.fx.dust(this.cx, this.feet, 4);
    } else if (this.jumps < 2) {
      this.vy = -580;
      this.jumps = 2;
      this.jumpBuf = 0;
      this.jumpHeld = true;
      this.spinT = 0.36;
      Sound.play('djump');
      S.fx.ring(this.cx, this.feet, 4, 22, 'rgba(255,255,255,0.8)', 0.25, 2);
    }
  }

  startAttack(fromDash) {
    const I = Input;
    const style = this.weapon.style;
    let kind;
    if (fromDash) kind = 'dash';
    else if (!this.onGround) {
      if (I.held.down) kind = 'slam';
      else if (I.held.up) kind = 'up';
      else kind = 'air';
    } else if (I.held.up) kind = 'up';
    else kind = 'c' + (this.comboWin > 0 ? Math.min(3, this.combo + 1) : 1);
    if (!this.onGround && (kind === 'air' || kind === 'up')) {
      if (this.airAtk >= 3) return;
      this.airAtk++;
    }
    this.jumpHeld = false;
    if (kind === 'slam') {
      this.state = 'slam';
      this.vy = -160;
      this.vx = this.facing * 40;
      this.cur = { kind: 'slam', t: 0, hitSet: new Set() };
      Sound.play('swing');
      return;
    }
    const spec = ATTACKS[style][kind];
    this.cur = { kind, spec, t: 0, dur: spec.dur / this.weapon.speed, hitSet: new Set(), lunged: false };
    if (kind[0] === 'c') this.combo = +kind[1];
    this.state = 'attack';
    this.queued = false;
    if (kind === 'up') {
      this.vy = this.onGround ? -470 : Math.min(this.vy, -340);
      this.onGround = false;
      this.plat = null;
    }
    if (kind === 'air' && this.vy > -120) this.vy = -120;
    if (kind === 'dash') this.inv = Math.max(this.inv, 0.12);
  }

  hitboxFor(spec) {
    const b = spec.box(this.weapon.reach);
    return { x: this.facing > 0 ? this.cx + b.fx : this.cx - b.fx - b.w, y: this.feet + b.y, w: b.w, h: b.h };
  }

  stAttack(dt) {
    const I = Input;
    const a = this.cur;
    if (!a) { this.state = 'normal'; return; }
    const sp = a.spec;
    a.t += dt;
    const p = a.t / a.dur;
    if (this.onGround) this.vx = approach(this.vx, 0, 1700 * dt);
    else {
      const dir = this.moveInput();
      this.vx = approach(this.vx, dir * 160, 900 * dt);
    }
    if (!a.lunged && p >= sp.hit[0]) {
      a.lunged = true;
      if (sp.lunge) this.vx = this.facing * sp.lunge * (this.onGround ? 1 : 0.4);
      Sound.play(sp.sfx);
      this.spawnSwingFx(sp);
    }
    if (p >= sp.hit[0] && p <= sp.hit[1]) this.doMelee(sp, this.hitboxFor(sp));
    if (I.pressed.attack || (I.held.attack && p > sp.hit[1])) this.queued = true;
    if (p >= sp.hit[0] && this.dashBuf > 0 && this.dashCd <= 0 && (this.onGround || this.airDash)) { this.startDash(); return; }
    if (p > sp.hit[1]) {
      if (this.jumpBuf > 0 && this.canJump()) { this.state = 'normal'; this.cur = null; this.tryJump(); return; }
      if (I.pressed.skill1) { this.castSkill(0); if (this.state !== 'attack') return; }
      if (I.pressed.skill2) { this.castSkill(1); if (this.state !== 'attack') return; }
      if (this.queued && p > sp.hit[1] + 0.08) {
        if (a.kind[0] === 'c' && this.combo < 3 && this.onGround) { this.comboWin = 1; this.startAttack(false); return; }
        if ((a.kind === 'air' || a.kind === 'up') && !this.onGround && this.airAtk < 3) { this.startAttack(false); return; }
        if (a.kind === 'dash' && this.onGround) { this.comboWin = 0; this.startAttack(false); return; }
      }
    }
    if (p >= 1) {
      this.state = 'normal';
      if (a.kind[0] === 'c') this.comboWin = a.kind === 'c3' ? 0 : 0.35;
      this.cur = null;
      if (this.queued && this.onGround) { this.queued = false; this.startAttack(false); }
    }
  }

  spawnSwingFx(sp) {
    const S = this.scene;
    const col = this.weaponId === 'cosmic' ? '#d1b3ff' : this.weaponId === 'fists' ? 'rgba(255,224,130,0.9)' : 'rgba(255,255,255,0.85)';
    if (sp.slash) {
      const r = sp.slash.r || this.weapon.reach * 0.85 + 8;
      S.fx.slash(this.cx, this.feet + sp.slash.cy, r, sp.slash.a0, sp.slash.a1, this.facing, col, sp.slash.width || 7, sp.slash.full ? 0.22 : 0.16);
    } else if (sp.thrust) {
      const hb = this.hitboxFor(sp);
      const y = hb.y + hb.h / 2;
      for (let i = 0; i < 3; i++) {
        S.fx.add({ type: 'line', x: this.facing > 0 ? hb.x + hb.w : hb.x, y: y + rand(-5, 5), vx: this.facing * rand(500, 800), vy: 0, g: 0, drag: 8, life: 0.12, color: col, size: 2 });
      }
    }
  }

  doMelee(sp, hb) {
    const S = this.scene;
    const a = this.cur;
    const heavy = sp.heavy || !!this.weapon.heavy;
    let hitAny = false;
    for (const e of S.enemies) {
      if (e.dead || a.hitSet.has(e)) continue;
      if (!overlap(hb, e)) continue;
      a.hitSet.add(e);
      const r = S.playerHit(e, {
        dmg: this.power * this.weapon.dmg * sp.dmg, dir: this.facing, kbx: sp.kb[0] * this.weapon.kb, kby: sp.kb[1],
        heavy, launch: !!sp.launch, x: clamp(e.x + e.w / 2, hb.x, hb.x + hb.w), y: clamp(e.y + e.h * 0.4, hb.y, hb.y + hb.h), kind: 'melee',
      });
      if (r) hitAny = true;
    }
    for (const c of S.props) {
      if (c.dead || !c.isProp || a.hitSet.has(c)) continue;
      if (overlap(hb, c)) { a.hitSet.add(c); c.takeHit({ heavy }, S); }
    }
    for (const pr of S.projectiles) {
      if (pr.owner === 'enemy' && pr.destroyable && !pr.dead && circleRect(pr.x, pr.y, pr.r + 4, hb)) pr.hitBy(S, this.facing);
    }
    if (hitAny && !this.onGround && this.vy > -60) this.vy = -60;
  }

  startDash() {
    if (this.dashCd > 0) return;
    if (!this.onGround && !this.airDash) return;
    const dir = this.moveInput();
    if (dir) this.facing = dir;
    this.state = 'dash';
    this.cur = null;
    this.dashT = 0.2;
    this.vx = this.facing * 560;
    this.vy = 0;
    this.inv = Math.max(this.inv, 0.24);
    this.dashCd = 0.5;
    this.dashBuf = 0;
    if (!this.onGround) this.airDash = false;
    Sound.play('dash');
    this.scene.fx.dust(this.cx - this.facing * 6, this.feet, 4);
  }

  stDash(dt) {
    this.dashT -= dt;
    this.vy = 0;
    this.ghostT -= dt;
    if (this.ghostT <= 0) {
      this.ghostT = 0.035;
      this.scene.fx.ghost(this.skel(), '#90caf9', 0.2);
    }
    if (Input.pressed.attack) { this.startAttack(true); return; }
    if (this.jumpBuf > 0 && this.canJump()) { this.state = 'normal'; this.vx *= 0.7; this.tryJump(); return; }
    if (this.dashT <= 0) { this.state = 'normal'; this.vx = this.facing * 235; }
  }

  stSlam(dt) {
    const S = this.scene;
    const a = this.cur;
    a.t += dt;
    if (a.t > 0.08) this.vy = 1050;
    this.vx = approach(this.vx, 0, 400 * dt);
    const hb = { x: this.cx - 16, y: this.feet - 16, w: 32, h: 28 };
    for (const e of S.enemies) {
      if (e.dead || a.hitSet.has(e) || !overlap(hb, e)) continue;
      a.hitSet.add(e);
      S.playerHit(e, { dmg: this.power * this.weapon.dmg * 0.8, dir: this.facing, kbx: 60, kby: 300, heavy: false, x: this.cx, y: this.feet, kind: 'melee' });
    }
    if (this.onGround && a.t > 0.08) {
      const R = 62 + this.weapon.reach * 0.5;
      const q = { x: this.cx - R, y: this.feet - 40, w: R * 2, h: 44 };
      const heavyHit = new Set();
      for (const e of S.enemies) {
        if (e.dead || heavyHit.has(e) || !overlap(q, e)) continue;
        heavyHit.add(e);
        S.playerHit(e, { dmg: this.power * this.weapon.dmg * 1.5, dir: sign(e.x + e.w / 2 - this.cx) || this.facing, kbx: 160, kby: -380, heavy: true, launch: true, x: e.x + e.w / 2, y: this.feet - 10, kind: 'melee' });
      }
      for (const c of S.props) if (!c.dead && c.isProp && overlap(q, c)) c.takeHit({ heavy: true }, S);
      S.fx.ring(this.cx, this.feet, 8, R, 'rgba(255,255,255,0.8)', 0.3, 4);
      S.fx.dust(this.cx - 20, this.feet, 5);
      S.fx.dust(this.cx + 20, this.feet, 5);
      S.shake(7, 0.25);
      Sound.play('hitHeavy');
      this.state = 'recover';
      this.recoverT = 0.16;
      this.cur = null;
      return;
    }
    if (a.t > 1.6) { this.state = 'normal'; this.cur = null; }
  }

  stWhirl(dt) {
    const S = this.scene;
    this.whirlT -= dt;
    this.inv = Math.max(this.inv, 0.1);
    const dir = this.moveInput();
    if (dir) this.facing = dir;
    this.vx = approach(this.vx, dir * 270, 2000 * dt);
    this.vy = approach(this.vy, 110, 1500 * dt);
    this.rot += dt * 26 * this.facing;
    this.tick -= dt;
    if (this.tick <= 0) {
      this.tick = 0.11;
      const hb = { x: this.cx - 50, y: this.y - 10, w: 100, h: this.h + 20 };
      for (const e of S.enemies) {
        if (e.dead || !overlap(hb, e)) continue;
        S.playerHit(e, { dmg: this.power * (0.55 + this.weapon.dmg * 0.35), dir: sign(e.x + e.w / 2 - this.cx) || 1, kbx: 90, kby: -120, heavy: false, x: e.x + e.w / 2, y: e.y + e.h / 2, kind: 'skill' });
      }
      for (const c of S.props) if (!c.dead && c.isProp && overlap(hb, c)) c.takeHit({ heavy: true }, S);
      for (const pr of S.projectiles) if (pr.owner === 'enemy' && pr.destroyable && !pr.dead && circleRect(pr.x, pr.y, pr.r, hb)) pr.hitBy(S, this.facing);
      S.fx.slash(this.cx, this.cy, 40, -Math.PI, Math.PI, 1, 'rgba(174,213,129,0.8)', 6, 0.12);
      Sound.play('swing');
    }
    if (this.whirlT <= 0) { this.state = 'normal'; this.rot = 0; }
  }

  castSkill(slot) {
    const id = SAVE.slots[slot];
    if (!id) return;
    const sk = SKILLS[id];
    const S = this.scene;
    if (this.skillCd[slot] > 0) return;
    if (this.en < sk.cost) {
      S.fx.text(this.cx, this.y - 10, 'NO ENERGY', '#90caf9', 11);
      Sound.play('error');
      this.skillCd[slot] = 0.3;
      return;
    }
    this.en -= sk.cost;
    this.skillCd[slot] = sk.cd;
    this.cur = null;
    const f = this.facing, P = this.power;
    S.stats.skills++;
    switch (id) {
      case 'blast':
        S.addProjectile(new Projectile({ type: 'pblast', owner: 'player', x: this.cx + f * 16, y: this.y + 18, vx: f * 580, r: 11, dmg: P * 2.2, pierce: true, life: 1.1, kb: 200 }));
        this.state = 'cast'; this.castT = 0.2; this.castPose = PZ.cast;
        Sound.play('blast');
        S.fx.ring(this.cx + f * 16, this.y + 18, 4, 20, '#4fc3f7', 0.2, 3);
        break;
      case 'quake': {
        const gy = S.world.groundBelow(this.cx, this.feet - 4);
        const y = gy != null && gy - this.feet < 220 ? gy : this.feet;
        for (const d of [-1, 1]) {
          S.addProjectile(new Projectile({ type: 'pquake', owner: 'player', x: this.cx + d * 10, y, vx: d * 400, r: 16, dmg: P * 2.4, pierce: true, life: 0.95, hgt: 36, heavy: true, launch: true, kby: -420 }));
        }
        S.shake(8, 0.35);
        S.fx.ring(this.cx, y, 10, 70, '#ffb74d', 0.35, 5);
        Sound.play('quake');
        this.state = 'cast'; this.castT = 0.3; this.castPose = ATTACKS.fist.slam;
        break;
      }
      case 'whirl':
        this.state = 'whirl'; this.whirlT = 0.95; this.tick = 0;
        Sound.play('whirl');
        break;
      case 'thunder': {
        const targets = S.enemies.filter((e) => !e.dead && Math.abs(e.x + e.w / 2 - this.cx) < 430 && Math.abs(e.y - this.y) < 260)
          .sort((a, b) => Math.abs(a.x - this.x) - Math.abs(b.x - this.x)).slice(0, 5);
        const spots = targets.length ? targets.map((e) => ({ e, x: e.x + e.w / 2 })) : [80, 170, 260].map((d) => ({ e: null, x: this.cx + f * d }));
        spots.forEach((s, i) => {
          S.schedule(i * 0.09, () => {
            const x = s.e && !s.e.dead ? s.e.x + s.e.w / 2 : s.x;
            const gy = S.world.groundBelow(x, (s.e ? s.e.y : this.y) - 10) || this.feet;
            S.fx.bolt(x, S.cam.y - 20, x, gy, '#fff59d', 0.3);
            S.fx.ring(x, gy, 4, 40, '#fff59d', 0.3, 3);
            S.playerAoE(x, gy - 30, 44, { dmg: P * 3.2, kbx: 60, kby: -200, heavy: true, stun: 0.6, kind: 'skill' });
          });
        });
        S.fx.flash('#fffde7', 0.35);
        S.shake(6, 0.3);
        Sound.play('thunder');
        this.state = 'cast'; this.castT = 0.3; this.castPose = PZ.castUp;
        break;
      }
      case 'frost': {
        S.fx.ring(this.cx, this.cy, 10, 190, '#80deea', 0.45, 8);
        S.fx.ring(this.cx, this.cy, 5, 140, '#e0f7fa', 0.35, 4);
        S.fx.shards(this.cx, this.cy, '#b2ebf2', 14, 320, 5);
        for (const e of S.enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x + e.w / 2 - this.cx, e.y + e.h / 2 - this.cy) < 190) {
            S.playerHit(e, { dmg: P * 1.5, dir: sign(e.x + e.w / 2 - this.cx) || 1, kbx: 30, kby: 0, heavy: true, x: e.x + e.w / 2, y: e.y + e.h / 2, kind: 'skill', freeze: 2.8 });
          }
        }
        S.fx.flash('#e0f7fa', 0.3);
        Sound.play('freeze');
        this.state = 'cast'; this.castT = 0.3; this.castPose = PZ.castUp;
        break;
      }
      case 'meteor': {
        for (let i = 0; i < 9; i++) {
          const x = this.cx + f * rand(70, 470);
          const gy = S.world.groundBelow(x, S.cam.y + 40);
          if (gy == null) continue;
          const sy = S.cam.y - 60 - rand(0, 80);
          S.addProjectile(new Projectile({ type: 'marker', kind: 'meteor', owner: 'player', x: x - f * 90, tx: x, y: sy, vx: f * 90 * (900 / Math.max(200, gy - sy)), vy: 500, g: 400, gy, r: 12, dmg: P * 2.6, boom: 62, delay: i * 0.13, noContact: true, life: 5 }));
        }
        Sound.play('meteor');
        S.fx.flash('#ffccbc', 0.25);
        this.state = 'cast'; this.castT = 0.35; this.castPose = PZ.castUp;
        break;
      }
    }
  }

  usePotion() {
    if (this.dead || SAVE.potions <= 0) return;
    if (this.hp >= this.maxHp) { this.scene.fx.text(this.cx, this.y - 10, 'HP FULL', '#a5d6a7', 11); return; }
    SAVE.potions--;
    this.heal(Math.round(this.maxHp * 0.5));
    this.scene.fx.flash('#a5d6a7', 0.25);
  }

  heal(amt) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amt);
    const got = Math.round(this.hp - before);
    this.scene.fx.text(this.cx, this.y - 8, '+' + got, '#69f0ae', 14);
    this.scene.fx.burst(this.cx, this.cy, '#69f0ae', 10, 120, 3, -100);
    Sound.play('heal');
  }

  addChain() {
    const S = this.scene;
    this.hitChain++;
    this.hitChainT = 1.8;
    if (this.hitChain > S.stats.maxCombo) S.stats.maxCombo = this.hitChain;
    if (this.hitChain >= 5) Sound.play('combo', this.hitChain);
  }

  endChain() {
    const S = this.scene;
    if (this.hitChain >= 10) {
      const bonus = Math.floor(this.hitChain / 4);
      S.addCoins(bonus);
      S.fx.text(this.cx, this.y - 30, `COMBO BONUS +${bonus}`, '#ffd740', 13, { life: 1.2 });
    }
    this.hitChain = 0;
    this.hitChainT = 0;
  }

  hurt(dmg, srcX, kb = 220, o = {}) {
    const S = this.scene;
    if (this.dead || this.inv > 0 || this.state === 'dash' || this.state === 'whirl' || this.victory) return false;
    if (S.godMode) return false;
    dmg = Math.max(1, Math.round(dmg * (1 - this.def)));
    this.hp -= dmg;
    S.stats.dmgTaken += dmg;
    this.inv = o.inv || 1.0;
    this.flash = 0.15;
    const dir = sign(this.cx - srcX) || -this.facing;
    this.vx = dir * kb;
    this.vy = o.vy != null ? o.vy : -300;
    this.state = 'hurt';
    this.hurtT = 0.32;
    this.cur = null;
    this.rot = 0;
    this.spinT = 0;
    this.onGround = false;
    this.plat = null;
    S.fx.text(this.cx, this.y - 6, '-' + dmg, '#ff5252', 15);
    S.fx.burst(this.cx, this.cy, '#ff5252', 8, 160, 3);
    S.shake(6, 0.25);
    S.hitstop(0.06);
    Sound.play('hurt');
    Game.vibrate(dmg >= this.maxHp * 0.15 ? 60 : 25);
    if (o.slow) this.slowT = Math.max(this.slowT, o.slow);
    this.endChain();
    if (this.hp <= 0) this.die();
    return true;
  }

  die() {
    this.hp = 0;
    this.dead = true;
    this.deadT = 0;
    this.state = 'dead';
    Sound.play('die');
    this.scene.fx.debris(this.skel(), '#141414', this.vx, -200);
    this.scene.fx.burst(this.cx, this.cy, '#ffffff', 16, 260, 3);
    this.scene.onPlayerDeath();
  }

  getPose() {
    switch (this.state) {
      case 'attack': {
        const a = this.cur;
        if (!a) break;
        const sp = a.spec;
        const p = clamp(a.t / a.dur, 0, 1);
        const [wp, sp2] = sp.poses;
        const h0 = sp.hit[0], h1 = sp.hit[1];
        if (p < h0) return lerpPose(PZ.stand, wp, easeOut(p / h0));
        if (p < h1) return lerpPose(wp, sp2, easeOut((p - h0) / (h1 - h0)));
        const r = clamp(((p - h1) / (1 - h1)) * 1.4 - 0.4, 0, 1);
        return lerpPose(sp2, this.onGround ? PZ.stand : PZ.fall, easeIn(r));
      }
      case 'dash': return PZ.dash;
      case 'slam': return ATTACKS[this.weapon.style].slam;
      case 'whirl': return mkPose(0, 1.57, 0, 1.57, 0, -0.3, -0.3, 0.3, -0.3);
      case 'cast': return this.castPose || PZ.cast;
      case 'hurt': return PZ.hurt;
      case 'recover': return PZ.crouch;
    }
    if (this.victory && this.onGround) return PZ.victory;
    if (!this.onGround) return this.vy < 0 ? PZ.jump : PZ.fall;
    if (this.landT > 0) return lerpPose(PZ.stand, PZ.crouch, this.landT / 0.1);
    if (Math.abs(this.vx) > 25) return runPose(this.runPh);
    if (Input.held.down) return PZ.crouch;
    return idlePose(this.animT);
  }

  skel() {
    return skel(this.cx, this.feet, this.facing, 1, this.getPose(), this.onGround && this.state !== 'whirl');
  }

  updScarf(k, dt) {
    const n = this.scarf.length;
    const ax = k.headX - k.f * 4, ay = k.headY + 1;
    this.scarf[0].x = ax;
    this.scarf[0].y = ay;
    for (let i = 1; i < n; i++) {
      const p = this.scarf[i], q = this.scarf[i - 1];
      p.x += -this.vx * 0.012 - this.facing * 0.25 + Math.sin(this.t * 11 + i) * 0.45;
      p.y += 0.5 + Math.cos(this.t * 9 + i) * 0.35 - this.vy * 0.004;
      const dx = p.x - q.x, dy = p.y - q.y;
      const d = Math.hypot(dx, dy) || 1;
      p.x = q.x + (dx / d) * 5;
      p.y = q.y + (dy / d) * 5;
    }
  }

  draw(ctx) {
    if (this.dead) return;
    const S = this.scene;
    const k = this.skel();
    this.updScarf(k, STEP);
    const gy = S.world.groundBelow(this.cx, this.feet - 2);
    if (gy != null && gy - this.feet < 200) drawShadowEllipse(ctx, this.cx, gy, 13 * (1 - (gy - this.feet) / 260), 0.28);
    const blink = this.inv > 0 && this.state !== 'dash' && this.state !== 'whirl' && this.state !== 'attack' && Math.floor(this.inv * 18) % 2 === 0;
    ctx.save();
    if (blink) ctx.globalAlpha = 0.35;
    // scarf
    ctx.strokeStyle = '#e53935';
    ctx.lineCap = 'round';
    for (let i = 1; i < this.scarf.length; i++) {
      ctx.lineWidth = 4 - i * 0.4;
      ctx.beginPath();
      ctx.moveTo(this.scarf[i - 1].x, this.scarf[i - 1].y);
      ctx.lineTo(this.scarf[i].x, this.scarf[i].y);
      ctx.stroke();
    }
    let rot = this.rot;
    if (this.state === 'attack' && this.cur && this.cur.spec.spin && !this.onGround) rot = clamp(this.cur.t / this.cur.dur, 0, 1) * TAU * this.facing;
    if (rot) {
      const px = this.cx, py = this.feet - 24;
      ctx.translate(px, py);
      ctx.rotate(rot);
      ctx.translate(-px, -py);
    }
    const col = this.flash > 0 ? '#ff8a80' : '#141414';
    drawStick(ctx, k, col, { outline: 'rgba(255,255,255,0.5)', back: this.flash > 0 ? '#ff8a80' : '#3b3b3b' });
    // headband
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(k.headX, k.headY, k.hr * 0.9, -2.6, -0.5);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(k.headX + k.f * k.hr * 0.4 - 1.2, k.headY - 1.5, 2.4, 2.6);
    drawWeapon(ctx, k, this.weaponId, this.t);
    ctx.restore();
  }
}

// ===== 09-enemies.js =====
// ---------- Enemies ----------
class Enemy {
  constructor(scene, type, x, y, o = {}) {
    const T = ENEMIES[type];
    this.T = T;
    this.type = type;
    this.scene = scene;
    this.s = T.scale || 1;
    this.w = T.w || 18 * this.s;
    this.h = T.h || 44 * this.s;
    this.x = x - this.w / 2;
    this.y = y - this.h;
    const hpMul = o.hpMul || scene.hpMul;
    this.maxHp = Math.max(1, Math.round(T.hp * hpMul));
    this.hp = this.maxHp;
    this.dmg = Math.max(1, Math.round(T.dmg * scene.dmgMul));
    this.speed = T.speed * (1 + Math.min(0.25, scene.diff * 0.035));
    this.vx = 0; this.vy = 0; this.facing = -1;
    this.onGround = false; this.plat = null; this.dropping = 0;
    this.state = 'idle'; this.st = 0; this.t = rand(0, 10); this.cd = rand(0.6, 1.6);
    this.aggro = !!o.aggro;
    this.home = x;
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.flash = 0; this.hurtT = 0; this.freezeT = 0; this.stunT = 0; this.airStun = false;
    this.hpShow = 0; this.dead = false; this.flying = !!T.flying; this.arena = o.arena || null;
    this.spawnT = o.drop ? 0.45 : 0;
    this.dodgeCd = 0; this.animPh = rand(0, 6); this.alpha = 1;
    this.baseY = this.y;
    this.didHit = false;
    this.squash = 0;
    this.lastK = null;
    if (T.ai === 'shade') { this.aggro = true; this.state = 'dash'; this.life = 1.4; }
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }

  setState(s) { this.state = s; this.st = 0; this.didHit = false; }

  update(dt) {
    const S = this.scene, P = S.player;
    this.t += dt;
    this.st += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.hpShow -= dt;
    this.cd -= dt;
    this.dodgeCd -= dt;
    this.squash = Math.max(0, this.squash - dt * 4);
    if (this.spawnT > 0) this.spawnT -= dt;
    if (Math.abs(this.vx) > 10 && this.onGround) this.animPh += Math.abs(this.vx) * dt * 0.06;
    if (this.freezeT > 0) {
      this.freezeT -= dt;
      this.vx = approach(this.vx, 0, 900 * dt);
      if (this.flying) this.vy = approach(this.vy, 0, 900 * dt);
      this.phys(dt, !this.flying);
      return;
    }
    if (this.stunT > 0) {
      this.stunT -= dt;
      this.vx = approach(this.vx, 0, 900 * dt);
      this.phys(dt, !this.flying);
      return;
    }
    if (this.hurtT > 0 || this.airStun) {
      this.hurtT -= dt;
      if (this.flying) {
        this.vx *= Math.max(0, 1 - 4 * dt);
        this.vy *= Math.max(0, 1 - 4 * dt);
        this.phys(dt, false);
        if (this.hurtT <= 0) this.airStun = false;
        return;
      }
      if (this.onGround) this.vx = approach(this.vx, 0, 700 * dt);
      const wasAir = !this.onGround;
      this.phys(dt, true, this.airStun ? 0.8 : 1);
      if (this.airStun && this.onGround && wasAir && this.hurtT <= 0.2) {
        this.airStun = false;
        this.stunT = 0.4;
        this.squash = 1;
        S.fx.dust(this.cx, this.feet, 5);
      }
      if (this.hurtT <= -1.5) this.airStun = false;
      return;
    }
    const dx = P.cx - this.cx, dy = P.cy - this.cy, adx = Math.abs(dx);
    if (!this.aggro && adx < 340 && Math.abs(dy) < 170 && !P.dead) this.aggro = true;
    if (P.dead) this.aggro = false;
    const fn = this['ai_' + this.T.ai];
    if (fn) fn.call(this, dt, dx, dy, adx, P, S);
    if (this.T.body || this.T.ai === 'shade') {
      if (!P.dead && this.hurtT <= 0 && overlap(this, P)) {
        S.hitPlayer(this, this.dmg, this.cx, 220, this.T.chill ? { slow: 1.5 } : {});
        if (this.T.ai === 'shade') this.vanish();
      }
    }
    if (!this.flying) this.phys(dt, true);
  }

  phys(dt, gravity, gmul = 1) {
    const S = this.scene;
    if (gravity) this.vy = Math.min(this.vy + GRAVITY * gmul * dt, 900);
    const wasGround = this.onGround;
    moveActor(this, dt, S.world, S.platforms);
    if (this.onGround && !wasGround && gravity) this.squash = 0.6;
    if (this.y > S.world.ph + 60 && !this.dead) {
      this.hp = 0;
      this.die(null, true);
    }
  }

  groundAhead(dir) {
    const W = this.scene.world;
    const fx = dir > 0 ? this.x + this.w + 3 : this.x - 3;
    const c = Math.floor(fx / TILE);
    const r = Math.floor((this.y + this.h + 4) / TILE);
    const t = W.get(c, r);
    if (!(t === T_SOLID || t === T_ICE || t === T_PLAT)) {
      // moving platforms count as ground too
      for (const p of this.scene.platforms) if (p.solid && fx > p.x && fx < p.x + p.w && Math.abs(p.y - (this.y + this.h)) < 8) return true;
      return false;
    }
    const inRow = W.get(c, r - 1);
    if (inRow === T_SPIKE || inRow === T_LAVA || inRow === T_SOLID || inRow === T_ICE) return false;
    if (W.solidAt(c, Math.floor((this.y + 4) / TILE))) return false;
    return true;
  }

  // Is it safe to step off the ledge ahead (solid landing within a few tiles, no hazards)?
  safeDrop(dir) {
    const W = this.scene.world;
    const c = Math.floor((dir > 0 ? this.x + this.w + 3 : this.x - 3) / TILE);
    const r0 = Math.floor((this.y + this.h + 4) / TILE);
    if (W.solidAt(c, Math.floor((this.y + 4) / TILE)) || W.solidAt(c, r0 - 1)) return false;
    for (let r = r0; r < Math.min(W.rows, r0 + 6); r++) {
      const t = W.get(c, r);
      if (t === T_SPIKE || t === T_LAVA) return false;
      if (t === T_SOLID || t === T_ICE || t === T_PLAT) return true;
    }
    return false;
  }

  walk(dt, dir, spd) {
    if (this.onGround && !this.groundAhead(dir)) {
      const P = this.scene.player;
      if (this.aggro && !P.dead && P.feet > this.feet + 24 && this.safeDrop(dir)) {
        this.vx = approach(this.vx, dir * spd, 1100 * dt);
        return true;
      }
      this.vx = approach(this.vx, 0, 1500 * dt);
      return false;
    }
    this.vx = approach(this.vx, dir * spd, 1100 * dt);
    return true;
  }

  patrol(dt) {
    if (Math.abs(this.cx - this.home) > 80) this.dir = sign(this.home - this.cx) || this.dir;
    this.facing = this.dir;
    if (!this.walk(dt, this.dir, this.speed * 0.35)) this.dir = -this.dir;
  }

  stop(dt) { this.vx = approach(this.vx, 0, 1300 * dt); }

  attackBox(reach, hmul = 0.62) {
    return { x: this.facing > 0 ? this.cx : this.cx - reach - 6, y: this.y + 3, w: reach + 6, h: this.h * hmul };
  }

  // ----- AI behaviours -----
  ai_melee(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx > T.reach + 8 || Math.abs(dy) > 60) { this.walk(dt, this.facing, this.speed); this.state = 'chase'; }
        else {
          this.stop(dt);
          if (this.cd <= 0) this.setState('windup');
        }
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= T.windup) {
          this.setState('attack');
          this.vx = this.facing * 130;
          Sound.play('swing');
        }
        break;
      case 'attack':
        this.vx = approach(this.vx, 0, 600 * dt);
        if (!this.didHit && S.hitPlayer(this.attackBox(T.reach), this.dmg, this.cx, 240)) this.didHit = true;
        if (this.st >= 0.16) this.setState('recover');
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.42) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.3); }
        break;
      default: this.setState('chase');
    }
  }

  ai_shield(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx > T.reach + 10) { this.walk(dt, this.facing, this.speed); this.state = 'chase'; }
        else { this.stop(dt); if (this.cd <= 0) this.setState('windup'); }
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= T.windup) { this.setState('attack'); this.vx = this.facing * 260; Sound.play('swingHeavy'); }
        break;
      case 'attack':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (!this.didHit && S.hitPlayer(this.attackBox(T.reach + 6, 0.8), this.dmg, this.cx, 360)) this.didHit = true;
        if (this.st >= 0.2) this.setState('recover');
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.5) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.3); }
        break;
      default: this.setState('chase');
    }
  }

  ai_brute(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx > T.reach + 14 || Math.abs(dy) > 80) { this.walk(dt, this.facing, this.speed); this.state = 'chase'; }
        else { this.stop(dt); if (this.cd <= 0) this.setState('windup'); }
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= T.windup) {
          this.setState('attack');
          Sound.play('hitHeavy');
          S.shake(5, 0.2);
          S.fx.dust(this.cx + this.facing * 30, this.feet, 8);
          S.addProjectile(new Projectile({ type: 'shock', x: this.cx + this.facing * 30, y: this.feet, vx: this.facing * 300, dmg: Math.round(this.dmg * 0.7), life: 0.8, r: 14, hgt: 28 }));
        }
        break;
      case 'attack':
        if (!this.didHit && S.hitPlayer(this.attackBox(T.reach * this.s * 0.8, 0.9), this.dmg, this.cx, 380)) this.didHit = true;
        if (this.st >= 0.2) this.setState('recover');
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.7) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.2); }
        break;
      default: this.setState('chase');
    }
  }

  ai_archer(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx < 150) { if (!this.walk(dt, -this.facing, this.speed)) this.stop(dt); }
        else if (adx > T.range) this.walk(dt, this.facing, this.speed);
        else this.stop(dt);
        if (this.cd <= 0 && adx < T.range + 40 && Math.abs(dy) < 220) this.setState('windup');
        break;
      case 'windup':
        this.stop(dt);
        this.facing = sign(dx) || this.facing;
        if (this.st >= T.windup) {
          const sx = this.cx + this.facing * 14, sy = this.y + 16 * this.s;
          const tx = P.cx, ty = P.cy;
          const d = Math.hypot(tx - sx, ty - sy) || 1;
          const spd = 440;
          const time = d / spd;
          S.addProjectile(new Projectile({ type: 'arrow', x: sx, y: sy, vx: ((tx - sx) / d) * spd, vy: ((ty - sy) / d) * spd - 0.5 * 300 * time, g: 300, r: 4, dmg: this.dmg, destroyable: true, life: 2.5, kb: 160 }));
          Sound.play('shoot');
          this.setState('recover');
        }
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.45) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.3); }
        break;
      default: this.setState('chase');
    }
  }

  ai_bomber(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx < 150) { if (!this.walk(dt, -this.facing, this.speed)) this.stop(dt); }
        else if (adx > T.range) this.walk(dt, this.facing, this.speed);
        else this.stop(dt);
        if (this.cd <= 0 && adx < T.range + 30 && Math.abs(dy) < 200) this.setState('windup');
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= T.windup) {
          const sx = this.cx + this.facing * 8, sy = this.y + 4;
          const time = 0.85;
          const g = 900;
          const vx = clamp((P.cx - sx) / time, -380, 380);
          const vy = (P.feet - 10 - sy - 0.5 * g * time * time) / time;
          S.addProjectile(new Projectile({ type: 'bomb', x: sx, y: sy, vx, vy: Math.max(-700, vy), g, r: 7, dmg: this.dmg, destroyable: true, life: 1.6 }));
          Sound.play('swing');
          this.setState('recover');
        }
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.5) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.3); }
        break;
      default: this.setState('chase');
    }
  }

  ai_mage(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx < 150 && this.dodgeCd <= 0) { this.setState('tpOut'); return; }
        if (adx > T.range) this.walk(dt, this.facing, this.speed);
        else if (adx < 160) { if (!this.walk(dt, -this.facing, this.speed)) this.stop(dt); }
        else this.stop(dt);
        if (this.cd <= 0 && adx < T.range && Math.abs(dy) < 220) this.setState('windup');
        break;
      case 'windup':
        this.stop(dt);
        this.facing = sign(dx) || this.facing;
        if (Math.random() < 0.5) S.fx.add({ type: 'dot', x: this.cx + rand(-14, 14), y: this.y + rand(-10, 20), vx: 0, vy: -40, g: 0, life: 0.4, color: '#80deea', size: 3 });
        if (this.st >= T.windup) {
          for (let i = 0; i < 3; i++) {
            const a = -Math.PI / 2 + (i - 1) * 0.7;
            S.addProjectile(new Projectile({ type: 'orb', x: this.cx + Math.cos(a) * 18, y: this.y + 6 + Math.sin(a) * 18, vx: Math.cos(a) * 160 + this.facing * 40, vy: Math.sin(a) * 160, home: 1.8, r: 7, dmg: this.dmg, destroyable: true, life: 4 }));
          }
          Sound.play('magic');
          this.setState('recover');
        }
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.6) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.2); }
        break;
      case 'tpOut':
        this.stop(dt);
        this.alpha = 1 - this.st / 0.3;
        if (this.st >= 0.3) {
          const side = Math.random() < 0.5 ? -1 : 1;
          let placed = false;
          for (const sd of [side, -side]) {
            const nx = P.cx + sd * rand(190, 260);
            const gy = S.world.groundBelow(nx, P.y - 40);
            if (gy != null && Math.abs(gy - P.feet) < 140 && nx > S.bounds.x0 + 20 && nx < S.bounds.x1 - 20 && !S.world.solidPx(nx, gy - 20)) {
              this.x = nx - this.w / 2;
              this.y = gy - this.h;
              placed = true;
              break;
            }
          }
          if (!placed) this.x -= this.facing * 120;
          S.fx.smoke(this.cx, this.cy, 6, 'rgba(128,222,234,0.5)');
          Sound.play('teleport');
          this.dodgeCd = 3.5;
          this.setState('tpIn');
        }
        break;
      case 'tpIn':
        this.alpha = this.st / 0.3;
        if (this.st >= 0.3) { this.alpha = 1; this.setState('chase'); this.cd = Math.min(this.cd, 0.4); }
        break;
      default: this.setState('chase');
    }
  }

  ai_ninja(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx > T.reach + 8) {
          const ok = this.walk(dt, this.facing, this.speed);
          if (!ok && this.onGround && Math.abs(dy) < 120 && adx < 260) { this.vy = -600; this.vx = this.facing * this.speed; this.onGround = false; }
          if (this.cd <= 0 && adx > 150 && adx < 330 && Math.random() < 0.02) this.setState('throw');
        } else {
          this.stop(dt);
          if (this.cd <= 0) this.setState('windup');
        }
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= T.windup) { this.setState('attack'); this.vx = this.facing * 240; Sound.play('swing'); }
        break;
      case 'attack':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (!this.didHit && S.hitPlayer(this.attackBox(T.reach), this.dmg, this.cx, 220)) this.didHit = true;
        if (this.st >= 0.15) {
          this.setState('retreat');
          if (this.onGround && this.groundAhead(-this.facing)) { this.vy = -480; this.vx = -this.facing * 230; this.onGround = false; }
        }
        break;
      case 'retreat':
        if (this.onGround && this.st > 0.15) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.4); }
        if (this.st > 1.2) this.setState('chase');
        break;
      case 'throw':
        this.stop(dt);
        if (this.st >= 0.3) {
          for (const a of [-0.12, 0.08]) {
            const d = Math.hypot(dx, dy) || 1;
            const ang = Math.atan2(dy, dx) + a;
            S.addProjectile(new Projectile({ type: 'shuriken', x: this.cx, y: this.y + 16, vx: Math.cos(ang) * 420, vy: Math.sin(ang) * 420, r: 5, dmg: Math.round(this.dmg * 0.8), destroyable: true, life: 1.6 }));
            void d;
          }
          Sound.play('shoot');
          this.setState('recover');
        }
        break;
      case 'recover':
        this.stop(dt);
        if (this.st >= 0.3) { this.setState('chase'); this.cd = T.cd * rand(0.8, 1.3); }
        break;
      default: this.setState('chase');
    }
  }

  ai_flyer(dt, dx, dy, adx, P, S) {
    const T = this.T;
    this.facing = sign(dx) || this.facing;
    if (!this.aggro) {
      this.vx = Math.sin(this.t * 1.3) * 30;
      this.vy = (this.baseY + Math.sin(this.t * 2.2) * 12 - this.y) * 3;
      this.phys(dt, false);
      return;
    }
    switch (this.state) {
      case 'idle':
      case 'chase': {
        const tx = P.cx - this.w / 2 + Math.sin(this.t * 0.9) * 90;
        const ty = P.y - 85 + Math.sin(this.t * 2.3) * 14;
        this.vx = approach(this.vx, clamp((tx - this.x) * 2.5, -T.speed, T.speed), 500 * dt);
        this.vy = approach(this.vy, clamp((ty - this.y) * 2.5, -T.speed, T.speed), 500 * dt);
        this.phys(dt, false);
        if (this.cd <= 0 && adx < 260 && !P.dead) this.setState(T.shoots ? 'windup' : 'swoopPrep');
        break;
      }
      case 'swoopPrep':
        this.vx *= 0.9;
        this.vy = approach(this.vy, -70, 700 * dt);
        this.phys(dt, false);
        if (this.st > 0.35) {
          this.setState('swoop');
          const d = Math.hypot(dx, dy) || 1;
          this.vx = (dx / d) * 320;
          this.vy = (dy / d) * 320;
        }
        break;
      case 'swoop':
        this.phys(dt, false);
        if (this.st > 0.75 || this.onGround || this.hitWall) this.setState('recover');
        break;
      case 'windup':
        this.vx *= 0.92;
        this.vy *= 0.92;
        this.phys(dt, false);
        if (this.st > 0.6) {
          const d = Math.hypot(dx, dy) || 1;
          S.addProjectile(new Projectile({ type: 'imp', x: this.cx, y: this.cy, vx: (dx / d) * 260, vy: (dy / d) * 260, r: 6, dmg: this.dmg, destroyable: true, life: 2.5 }));
          Sound.play('fire');
          this.setState('recover');
        }
        break;
      case 'recover':
        this.vy = approach(this.vy, -130, 700 * dt);
        this.vx *= 0.95;
        this.phys(dt, false);
        if (this.st > 0.6) { this.setState('chase'); this.cd = rand(1.6, 2.8); }
        break;
      default: this.setState('chase');
    }
  }

  ai_hopper(dt, dx, dy, adx, P, S) {
    if (this.onGround) {
      this.vx = approach(this.vx, 0, 1400 * dt);
      if (this.cd <= 0) {
        const dir = this.aggro ? sign(dx) || 1 : (this.dir = Math.abs(this.cx - this.home) > 60 ? sign(this.home - this.cx) : this.dir);
        this.facing = dir;
        if (this.groundAhead(dir) || this.aggro) {
          this.vx = dir * (this.aggro ? 150 : 70);
          this.vy = this.aggro ? -440 : -280;
          this.onGround = false;
        }
        this.cd = this.aggro ? rand(0.8, 1.3) : rand(1.2, 2.2);
      }
    }
  }

  ai_crawler(dt, dx, dy, adx, P, S) {
    const T = this.T;
    switch (this.state) {
      case 'idle':
      case 'chase':
        if (!this.aggro) { this.patrol(dt); return; }
        this.facing = sign(dx) || this.facing;
        if (adx < 100 && this.cd <= 0 && Math.abs(dy) < 50) this.setState('windup');
        else this.walk(dt, this.facing, this.speed);
        break;
      case 'windup':
        this.stop(dt);
        if (this.st >= 0.35) { this.setState('attack'); if (this.groundAhead(this.facing)) this.vx = this.facing * 380; }
        break;
      case 'attack':
        if (this.onGround && !this.groundAhead(this.facing)) this.vx = 0;
        if (this.st >= 0.3) this.setState('recover');
        break;
      case 'recover':
        this.stop(dt);
        if (this.st > 0.5) { this.setState('chase'); this.cd = rand(1.2, 2); }
        break;
      default: this.setState('chase');
    }
  }

  ai_shade(dt, dx, dy, adx, P, S) {
    this.life -= dt;
    if (this.state === 'dash') {
      if (this.st < 0.35) {
        this.vx = 0; this.vy = 0;
        this.facing = sign(dx) || this.facing;
        this.aim = { x: dx, y: dy };
      } else {
        const d = Math.hypot(this.aim.x, this.aim.y) || 1;
        this.vx = (this.aim.x / d) * this.T.speed;
        this.vy = (this.aim.y / d) * this.T.speed * 0.5;
        if (Math.random() < 0.6) S.fx.ghost(this.skel(), '#7b1fa2', 0.2);
      }
      this.phys(dt, false);
      this.y = clamp(this.y, 0, S.world.ph);
    }
    if (this.life <= 0 || this.hitWall) this.vanish();
  }

  vanish() {
    if (this.dead) return;
    this.dead = true;
    this.scene.fx.smoke(this.cx, this.cy, 8, 'rgba(74,20,140,0.6)');
  }

  // ----- damage -----
  takeHit(h) {
    if (this.dead || this.spawnT > 0.25) return false;
    const S = this.scene, T = this.T;
    if (T.ai === 'shade') { this.vanish(); return 'hit'; }
    const front = sign(h.dir) === -this.facing;
    const busy = this.state === 'attack' || this.state === 'windup';
    const canBlock = h.kind !== 'skill' && front && this.freezeT <= 0 && this.stunT <= 0 && this.hurtT <= 0 && !this.airStun;
    if (canBlock) {
      let blocked = false;
      if (T.ai === 'shield' && this.state !== 'attack') {
        if (h.heavy) {
          this.stunT = 0.9;
          this.setState('chase');
          S.fx.text(this.cx, this.y - 12, 'GUARD BREAK!', '#ffab40', 12);
        } else blocked = true;
      } else if (T.block && !busy && !h.heavy && Math.random() < T.block) blocked = true;
      if (blocked) {
        S.fx.spark(h.x, h.y, '#ffffff', 6, 200, h.dir > 0 ? Math.PI : 0, 1.6);
        S.fx.text(this.cx, this.y - 10, 'BLOCK', '#cfd8dc', 11);
        Sound.play('block');
        this.vx = h.dir * 140;
        this.hpShow = 2;
        this.aggro = true;
        if (T.ai !== 'shield') { this.setState('windup'); this.st = T.windup * 0.4; }
        return 'block';
      }
    }
    let dmg = h.dmg;
    if (this.freezeT > 0) dmg *= 1.3;
    dmg = Math.max(1, Math.round(dmg));
    this.hp -= dmg;
    h.dealt = dmg;
    this.flash = 0.12;
    this.hpShow = 3;
    this.aggro = true;
    if (h.freeze && !T.armor) this.freezeT = h.freeze;
    else if (h.freeze) this.stunT = Math.max(this.stunT, 0.8);
    if (h.stun) this.stunT = Math.max(this.stunT, h.stun);
    const armored = T.armor && !h.heavy;
    if (!armored) {
      if (busy) this.setState('chase');
      this.vx = h.dir * (h.kbx || 150) * (this.flying ? 0.8 : 1);
      if (h.kby && h.kby < 0) {
        this.vy = h.kby * (this.flying ? 0.5 : 1);
        if (!this.flying) this.airStun = true;
        this.onGround = false;
        this.plat = null;
      } else if (h.kby && h.kby > 0) this.vy = h.kby;
      else if (!this.onGround && !this.flying) { this.vy = Math.min(this.vy, -200); this.airStun = true; }
      this.hurtT = 0.28;
    } else {
      this.vx += h.dir * 40;
      if (h.freeze) this.freezeT = 0;
    }
    if (this.freezeT <= 0) this.facing = -sign(h.dir) || this.facing;
    if (this.hp <= 0) this.die(h);
    return 'hit';
  }

  die(h, fell) {
    if (this.dead) return;
    this.dead = true;
    const S = this.scene, T = this.T;
    S.onEnemyKilled(this);
    if (fell) return;
    const dir = h ? h.dir : 0;
    if (!T.body) S.fx.debris(this.lastK || this.skel(), T.color, dir * 240, -160);
    else S.fx.burst(this.cx, this.cy, T.color, 16, 220, 4);
    S.fx.burst(this.cx, this.cy, '#ffffff', 6, 200, 2);
    Sound.play('enemyDie');
    if (T.noLoot) return;
    const tier = S.tier;
    const coins = Math.round(randi(T.coin[0], T.coin[1]) * (1 + tier * 0.6));
    S.dropCoins(this.cx, this.cy, coins);
    const r = Math.random();
    if (r < 0.08) S.addPickup(new Pickup('heart', this.cx, this.cy, { vy: -260, vx: rand(-60, 60) }));
    else if (r < 0.2) S.addPickup(new Pickup('energy', this.cx, this.cy, { vy: -260, vx: rand(-60, 60) }));
    else if (r < 0.215) S.addPickup(new Pickup('potion', this.cx, this.cy, { vy: -260, vx: rand(-60, 60) }));
  }

  // ----- drawing -----
  getPose() {
    const T = this.T;
    if (this.freezeT > 0) return this.frozenPose || PZ.stand;
    this.frozenPose = null;
    if (this.hurtT > 0 || this.airStun) return PZ.hurt;
    if (this.stunT > 0) return lerpPose(PZ.stand, PZ.hurt, 0.35 + Math.sin(this.t * 8) * 0.1);
    const ai = T.ai;
    const wk = T.windup || 0.5;
    switch (this.state) {
      case 'windup': {
        const k = clamp(this.st / wk, 0, 1);
        if (ai === 'archer') return lerpPose(PZ.stand, PZ.aim, easeOut(k));
        if (ai === 'bomber') return lerpPose(PZ.stand, PZ.throwBack, easeOut(k));
        if (ai === 'mage') return lerpPose(PZ.stand, PZ.castUp, easeOut(k));
        if (ai === 'brute') return lerpPose(PZ.stand, PZ.castUp, easeOut(k));
        if (ai === 'shield') return lerpPose(PZ.stand, PZ.shieldUp, easeOut(k));
        return lerpPose(PZ.stand, PZ.windup, easeOut(k));
      }
      case 'attack':
        if (ai === 'brute') return mkPose(0.6, 1.2, 0.2, 1.3, 0.2, -0.6, 0.1, 0.8, -0.8);
        if (ai === 'shield') return mkPose(0.45, 1.6, 0.4, 0.3, 1.0, -0.6, 0.1, 0.7, -0.5);
        return PZ.strike;
      case 'recover':
        if (ai === 'archer') return lerpPose(PZ.aim, PZ.stand, clamp(this.st / 0.3, 0, 1));
        if (ai === 'bomber') return lerpPose(PZ.throwFwd, PZ.stand, clamp(this.st / 0.4, 0, 1));
        if (ai === 'mage') return lerpPose(PZ.cast, PZ.stand, clamp(this.st / 0.4, 0, 1));
        return lerpPose(PZ.strike, PZ.stand, clamp(this.st / 0.35, 0, 1));
      case 'throw': return PZ.throwFwd;
      case 'dash': return PZ.dash;
    }
    if (!this.onGround) return this.vy < 0 ? PZ.jump : PZ.fall;
    if (Math.abs(this.vx) > 15) return Math.abs(this.vx) > 120 ? runPose(this.animPh) : walkPose(this.animPh);
    if (ai === 'shield') return PZ.shieldUp;
    return idlePose(this.t);
  }

  skel() {
    const pose = this.getPose();
    if (this.freezeT > 0 && !this.frozenPose) this.frozenPose = pose;
    return skel(this.cx, this.feet, this.facing, this.s, pose, this.onGround || this.T.ai === 'shade');
  }

  draw(ctx) {
    const T = this.T;
    const S = this.scene;
    ctx.save();
    let a = this.alpha;
    if (this.spawnT > 0) a *= 1 - this.spawnT / 0.45;
    if (T.ai === 'shade') a *= 0.75;
    ctx.globalAlpha = clamp(a, 0, 1);
    const col = this.flash > 0 ? '#ffffff' : T.color;
    const warn = this.state === 'windup' && this.st > (T.windup || 0.5) - 0.18;
    if (T.body) {
      const x = this.cx;
      if (T.body === 'bat' || T.body === 'imp') drawBat(ctx, x, this.cy, T.body === 'imp' ? 1.05 : 1, this.t, col, this.facing, T.body === 'imp');
      else if (T.body === 'slime') {
        drawShadowEllipse(ctx, x, this.feet, 12, 0.2);
        drawSlime(ctx, x, this.feet, 1, this.t, col, this.onGround ? this.squash : -0.3, this.facing);
      } else if (T.body === 'spider' || T.body === 'scorpion') {
        drawShadowEllipse(ctx, x, this.feet, 14, 0.2);
        drawSpider(ctx, x, this.feet, 1, this.t, col, this.facing, Math.abs(this.vx) > 10, T.body === 'scorpion');
      }
      if (warn || this.state === 'swoopPrep') this.drawAlert(ctx, x, this.y - 12);
    } else {
      const k = this.skel();
      this.lastK = k;
      if (this.onGround) drawShadowEllipse(ctx, this.cx, this.feet, 12 * this.s, 0.22);
      if (warn) {
        ctx.save();
        ctx.globalAlpha *= 0.6;
        drawStick(ctx, k, '#ff1744', { lw: 6 });
        ctx.restore();
      }
      if (T.ai === 'shade') drawStick(ctx, k, '#4a148c', { outline: 'rgba(234,128,252,0.4)' });
      else drawStick(ctx, k, col, { outline: 'rgba(0,0,0,0.35)', back: shade(T.color, -0.25), eye: '#ffffff', angry: true });
      this.drawGear(ctx, k, col);
      if (this.state === 'windup' && this.st < 0.3) this.drawAlert(ctx, k.headX, k.headY - 16 * this.s);
    }
    if (this.freezeT > 0) {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#b3e5fc';
      roundRect(ctx, this.x - 5, this.y - 8, this.w + 10, this.h + 10, 4);
      ctx.fill();
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = '#e1f5fe';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (this.stunT > 0 && !this.freezeT) {
      for (let i = 0; i < 3; i++) {
        const ang = this.t * 6 + (i * TAU) / 3;
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(this.cx + Math.cos(ang) * 10 - 2, this.y - 8 + Math.sin(ang) * 3 - 2, 4, 4);
      }
    }
    if (this.hpShow > 0 && this.hp < this.maxHp && T.ai !== 'shade') {
      const bw = Math.max(26, this.w + 8), bx = this.cx - bw / 2, by = this.y - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
      ctx.fillStyle = '#ef5350';
      ctx.fillRect(bx, by, bw * clamp(this.hp / this.maxHp, 0, 1), 3);
    }
    ctx.restore();
    void S;
  }

  drawAlert(ctx, x, y) {
    ctx.fillStyle = '#ff1744';
    ctx.font = '900 14px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', x, y);
  }

  drawGear(ctx, k, col) {
    const T = this.T;
    const s = this.s;
    if (T.weapon === 'bow') drawBow(ctx, k, this.state === 'windup');
    else if (T.weapon === 'shield') drawShield(ctx, k, '#1565c0');
    else if (T.weapon === 'bomb') { if (this.state === 'windup' || this.state === 'idle' || this.state === 'chase') drawWeapon(ctx, k, 'bomb', this.t); }
    else if (T.weapon) drawWeapon(ctx, k, T.weapon, this.t);
    if (T.helmet) {
      ctx.fillStyle = '#37474f';
      ctx.beginPath();
      ctx.arc(k.headX, k.headY, k.hr + 1.5, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(k.headX - k.hr - 1.5, k.headY - 1, (k.hr + 1.5) * 2, 4 * s);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(k.headX + k.f * 1 * s - 3 * s, k.headY + 0.5, 6 * s, 1.5 * s);
      ctx.fillStyle = '#c62828';
      ctx.beginPath();
      ctx.moveTo(k.headX, k.headY - k.hr - 1);
      ctx.quadraticCurveTo(k.headX - k.f * 10 * s, k.headY - k.hr - 8 * s, k.headX - k.f * 14 * s, k.headY - k.hr + 2);
      ctx.lineTo(k.headX - k.f * 4 * s, k.headY - k.hr);
      ctx.fill();
    }
    if (T.bandage) {
      ctx.strokeStyle = 'rgba(120,100,90,0.8)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) {
        const tt = 0.2 + i * 0.28;
        const x = lerp(k.hx, k.nx, tt), y = lerp(k.hy, k.ny, tt);
        ctx.beginPath(); ctx.moveTo(x - 3, y - 1); ctx.lineTo(x + 3, y + 1.5); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(k.headX - k.hr, k.headY - 2); ctx.lineTo(k.headX + k.hr, k.headY + 1); ctx.stroke();
    }
    if (T.fur) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(k.headX, k.headY + 1, k.hr * 1.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0277bd';
      ctx.fillRect(k.headX + k.f * 2 * s - 4 * s, k.headY - 1, 8 * s, 4 * s);
    }
    if (T.ai === 'mage') {
      ctx.fillStyle = shade(T.color, -0.3);
      ctx.beginPath();
      ctx.moveTo(k.headX - k.hr - 2, k.headY - 2);
      ctx.lineTo(k.headX - k.f * 3, k.headY - k.hr - 14);
      ctx.lineTo(k.headX + k.hr + 2, k.headY - 2);
      ctx.fill();
    }
    if (T.ai === 'ninja') {
      ctx.strokeStyle = '#d32f2f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(k.headX - k.f * k.hr, k.headY - 2);
      ctx.lineTo(k.headX - k.f * (k.hr + 9), k.headY - 4 + Math.sin(this.t * 12) * 2);
      ctx.stroke();
    }
    if (T.ai === 'bomber') {
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(k.headX - k.hr - 1, k.headY - k.hr - 1, (k.hr + 1) * 2, 4);
    }
  }
}

// ===== 10-bosses.js =====
// ---------- Bosses ----------
class Boss {
  constructor(scene, kind, arena, w, h) {
    const B = BOSSES[kind];
    this.scene = scene;
    this.kind = kind;
    this.B = B;
    this.isBoss = true;
    this.name = B.name;
    this.title = B.title;
    this.maxHp = B.hp;
    this.hp = B.hp;
    this.dmg = B.dmg;
    this.arena = arena;
    this.ax0 = arena.x0;
    this.ax1 = arena.x1;
    this.gy = arena.gy;
    this.w = w;
    this.h = h;
    this.x = arena.x1 - 150 - w / 2;
    this.y = arena.gy - h;
    this.vx = 0; this.vy = 0; this.facing = -1;
    this.onGround = false; this.plat = null;
    this.state = 'intro'; this.st = 0; this.t = 0;
    this.flash = 0; this.dead = false;
    this.phase = 1; this.stagger = 0; this.freezeT = 0;
    this.hidden = false; this.alpha = 1;
    this.last = '';
    this.didHit = false;
    this.T = { color: '#fff', ai: 'boss' };
    this.hpShow = 0;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }
  get P() { return this.scene.player; }
  setState(s) { this.state = s; this.st = 0; this.didHit = false; this.n = 0; }
  spd() { return this.phase === 2 ? 1.25 : 1; }
  pick(opts) {
    const f = opts.filter((o) => o[0] !== this.last && o[1] > 0);
    const c = new RNG((Math.random() * 1e9) | 0).weighted(f.length ? f : opts);
    this.last = c;
    return c;
  }
  face() { this.facing = sign(this.P.cx - this.cx) || this.facing; }
  update(dt) {
    this.t += dt;
    this.st += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.stagger = Math.max(0, this.stagger - dt * 0.04);
    if (this.dead) return;
    if (this.state === 'intro') {
      this.introUpdate(dt);
      if (this.st > 2.0) this.setState('idle');
      return;
    }
    if (this.state === 'stagger') {
      this.vx = approach(this.vx, 0, 600 * dt);
      this.staggerUpdate(dt);
      if (this.st > 1.6) this.setState('idle');
      return;
    }
    if (this.freezeT > 0) {
      this.freezeT -= dt;
      this.staggerUpdate(dt);
      return;
    }
    this.think(dt);
  }
  introUpdate(dt) { this.face(); this.phys(dt, true); }
  staggerUpdate(dt) { this.phys(dt, true); }
  phys(dt, gravity) {
    if (gravity) this.vy = Math.min(this.vy + GRAVITY * dt, 1000);
    moveActor(this, dt, this.scene.world, null);
    this.clampArena();
  }
  clampArena() {
    if (this.x < this.ax0 + 2) { this.x = this.ax0 + 2; this.hitEdge = -1; }
    else if (this.x + this.w > this.ax1 - 2) { this.x = this.ax1 - 2 - this.w; this.hitEdge = 1; }
    else this.hitEdge = 0;
  }
  contact(mul = 1, kb = 320) {
    const P = this.P;
    if (!this.hidden && overlap(this, P)) this.scene.hitPlayer(this, this.dmg * mul, this.cx, kb);
  }
  takeHit(h) {
    if (this.dead || this.state === 'intro' || this.hidden) return false;
    const S = this.scene;
    if (this.parry && this.parry(h)) return 'block';
    const dmg = Math.max(1, Math.round(h.dmg * (this.state === 'stagger' ? 1.25 : 1)));
    h.dealt = dmg;
    this.hp -= dmg;
    this.flash = 0.1;
    if (h.freeze) this.freezeT = Math.max(this.freezeT, 0.5);
    if (this.state !== 'stagger') {
      this.stagger += (dmg / this.maxHp) * (h.heavy ? 8 : 5.5);
      if (this.stagger >= 1) {
        this.stagger = 0;
        this.onStagger();
        this.setState('stagger');
        this.hidden = false;
        this.alpha = 1;
        this.vx = h.dir * 120;
        S.fx.text(this.cx, this.y - 20, 'STAGGERED!', '#ffd740', 16, { life: 1.2 });
        Sound.play('hitHeavy');
      }
    }
    if (this.phase === 1 && this.hp < this.maxHp * 0.5) {
      this.phase = 2;
      S.fx.text(this.cx, this.y - 34, 'ENRAGED!', '#ff5252', 18, { life: 1.4 });
      Sound.play('roar');
      S.shake(8, 0.6);
      S.fx.flash('#ff5252', 0.3);
    }
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      S.onBossDefeated(this);
    }
    return 'hit';
  }
  onStagger() {}
  deathSkel() { return null; }
  alert(ctx, x, y) {
    ctx.fillStyle = '#ff1744';
    ctx.font = '900 20px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', x, y);
  }
}

// ----- BIG BRUTO -----
class BossBruto extends Boss {
  constructor(scene, arena) { super(scene, 'bruto', arena, 44, 100); this.s = 2.2; }
  think(dt) {
    const S = this.scene, P = this.P;
    const dx = P.cx - this.cx, adx = Math.abs(dx);
    const k = this.spd();
    switch (this.state) {
      case 'idle':
        this.face();
        this.vx = approach(this.vx, adx > 90 ? this.facing * 75 * k : 0, 600 * dt);
        this.phys(dt, true);
        if (this.st > (this.phase === 2 ? 0.55 : 0.95)) {
          if (adx < 125) this.setState('swing');
          else this.setState(this.pick([['chargePrep', 3], ['poundPrep', 3], ['swing', adx < 200 ? 1 : 0]]));
        }
        break;
      case 'swing':
        this.vx = approach(this.vx, 0, 900 * dt);
        this.phys(dt, true);
        if (this.st > 0.6 / k && !this.didHit) {
          this.didHit = true;
          Sound.play('swingHeavy');
          S.shake(6, 0.2);
          const hb = { x: this.facing > 0 ? this.cx : this.cx - 125, y: this.y, w: 125, h: this.h };
          S.hitPlayer(hb, this.dmg, this.cx, 420);
          S.fx.slash(this.cx, this.y + 40, 80, -2.0, 0.8, this.facing, 'rgba(255,255,255,0.8)', 10, 0.2);
        }
        if (this.st > 1.1 / k) this.setState('idle');
        break;
      case 'chargePrep':
        this.face();
        this.vx = 0;
        this.phys(dt, true);
        if (this.st < dt * 1.5) Sound.play('warn');
        if (Math.random() < 0.3) S.fx.dust(this.cx - this.facing * 20, this.feet, 1);
        if (this.st > 0.75 / k) { this.setState('charge'); Sound.play('roar'); }
        break;
      case 'charge':
        this.vx = this.facing * 440 * k;
        this.phys(dt, true);
        this.contact(1, 460);
        if (Math.random() < 0.6) S.fx.dust(this.cx - this.facing * 20, this.feet, 1);
        if (this.hitEdge || this.hitWall || this.st > 2.4) {
          S.shake(10, 0.4);
          Sound.play('hitHeavy');
          S.fx.shards(this.cx + this.facing * 24, this.y + 30, '#9e9e9e', 8, 260, 6);
          this.setState('dizzy');
          this.vx = -this.facing * 120;
          this.vy = -200;
        }
        break;
      case 'dizzy':
        this.vx = approach(this.vx, 0, 400 * dt);
        this.phys(dt, true);
        if (this.st > (this.phase === 2 ? 1.1 : 1.6)) this.setState('idle');
        break;
      case 'poundPrep':
        this.face();
        this.vx = 0;
        this.phys(dt, true);
        if (this.st > 0.35 / k) {
          this.vy = -820;
          this.vx = clamp((P.cx - this.cx) / 0.9, -420, 420);
          this.onGround = false;
          this.setState('poundAir');
        }
        break;
      case 'poundAir':
        this.phys(dt, true);
        if (this.onGround && this.st > 0.1) {
          S.shake(10, 0.4);
          Sound.play('quake');
          S.fx.dust(this.cx - 20, this.feet, 8);
          S.fx.dust(this.cx + 20, this.feet, 8);
          S.fx.ring(this.cx, this.feet, 10, 90, 'rgba(255,255,255,0.7)', 0.4, 5);
          S.hitPlayer({ x: this.cx - 60, y: this.feet - 30, w: 120, h: 30 }, this.dmg, this.cx, 360);
          for (const d of [-1, 1]) S.addProjectile(new Projectile({ type: 'shock', x: this.cx + d * 30, y: this.feet, vx: d * 330, dmg: Math.round(this.dmg * 0.8), life: 1.4, r: 14, hgt: 34 }));
          if (this.phase === 2) {
            for (let i = 0; i < 4; i++) {
              const x = rand(this.ax0 + 40, this.ax1 - 40);
              S.addProjectile(new Projectile({ type: 'marker', kind: 'rock', x, tx: x, y: S.cam.y - 40, vx: 0, vy: 100, g: 900, gy: this.gy, r: 10, dmg: Math.round(this.dmg * 0.7), boom: 38, delay: 0.3 + i * 0.2, life: 6 }));
            }
          }
          this.vx = 0;
          this.setState('recover');
        }
        break;
      case 'recover':
        this.vx = approach(this.vx, 0, 900 * dt);
        this.phys(dt, true);
        if (this.st > 0.8 / k) this.setState('idle');
        break;
      default: this.setState('idle');
    }
  }
  pose() {
    switch (this.state) {
      case 'swing': {
        const w = 0.6 / this.spd();
        if (this.st < w) return lerpPose(PZ.stand, mkPose(-0.2, 0.6, 1.3, 3.6, 0.3, -0.35, 0.05, 0.4, -0.3), easeOut(this.st / w));
        return mkPose(0.45, 0.3, 1.0, 1.0, 0.1, -0.6, 0.1, 0.7, -0.6);
      }
      case 'chargePrep': return mkPose(0.5, -0.4, 0.8, -0.2, 0.8, -0.4, -0.6, 0.9, -1.2);
      case 'charge': return runPose(this.t * 16, 0.6);
      case 'dizzy': case 'stagger': return lerpPose(PZ.stand, PZ.hurt, 0.4 + Math.sin(this.t * 6) * 0.15);
      case 'poundPrep': return PZ.crouch;
      case 'poundAir': return this.vy < 0 ? PZ.castUp : ATTACKS.fist.slam;
      case 'recover': return PZ.crouch;
      case 'intro': return this.st > 1 ? PZ.castUp : PZ.stand;
    }
    return Math.abs(this.vx) > 10 ? walkPose(this.t * 5) : idlePose(this.t);
  }
  deathSkel() { return skel(this.cx, this.feet, this.facing, this.s, PZ.hurt, true); }
  draw(ctx) {
    const k = skel(this.cx, this.feet, this.facing, this.s, this.pose(), this.onGround);
    drawShadowEllipse(ctx, this.cx, this.gy, 34, 0.3);
    const col = this.flash > 0 ? '#ffffff' : this.freezeT > 0 ? '#b3e5fc' : '#8d2a1a';
    if (this.state === 'chargePrep' || (this.state === 'swing' && this.st < 0.6 / this.spd() && this.st > 0.3)) {
      ctx.globalAlpha = 0.5;
      drawStick(ctx, k, '#ff1744', { lw: 6 });
      ctx.globalAlpha = 1;
    }
    drawStick(ctx, k, col, { outline: 'rgba(0,0,0,0.4)', back: '#5d1a10', eye: '#ffeb3b', angry: true });
    // horned helmet
    ctx.fillStyle = '#616161';
    ctx.beginPath(); ctx.arc(k.headX, k.headY, k.hr + 2, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#eeeeee';
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(k.headX + sd * k.hr, k.headY - 4);
      ctx.quadraticCurveTo(k.headX + sd * (k.hr + 12), k.headY - 10, k.headX + sd * (k.hr + 8), k.headY - 24);
      ctx.lineTo(k.headX + sd * (k.hr - 2), k.headY - 8);
      ctx.fill();
    }
    drawWeapon(ctx, k, 'club', this.t);
    if (this.state === 'dizzy' || this.state === 'stagger') {
      for (let i = 0; i < 4; i++) {
        const a = this.t * 5 + (i * TAU) / 4;
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(k.headX + Math.cos(a) * 20 - 3, k.headY - 26 + Math.sin(a) * 5 - 3, 6, 6);
      }
    }
    if (this.state === 'chargePrep' || this.state === 'poundPrep') this.alert(ctx, k.headX, k.headY - 34);
  }
}

// ----- ARACHNA (spider queen) -----
class BossSpider extends Boss {
  constructor(scene, arena) { super(scene, 'spider', arena, 90, 52); }
  think(dt) {
    const S = this.scene, P = this.P;
    const dx = P.cx - this.cx, adx = Math.abs(dx);
    const k = this.spd();
    switch (this.state) {
      case 'idle': {
        this.face();
        const want = adx > 190 ? this.facing : adx < 120 ? -this.facing : 0;
        this.vx = approach(this.vx, want * 120 * k, 700 * dt);
        this.phys(dt, true);
        if (this.st > (this.phase === 2 ? 0.6 : 1.0)) {
          const spiders = S.enemies.filter((e) => !e.dead && e.type === 'spider').length;
          this.setState(this.pick([['web', 3], ['lunge', adx < 260 ? 3 : 1], ['climb', 2], ['summon', spiders < 3 ? 1.5 : 0]]));
        }
        break;
      }
      case 'web':
        this.face();
        this.vx = approach(this.vx, 0, 900 * dt);
        this.phys(dt, true);
        if (this.st > 0.5 / k && !this.didHit) {
          this.didHit = true;
          const n = this.phase === 2 ? 5 : 3;
          const base = Math.atan2(P.cy - (this.y + 10), P.cx - (this.cx + this.facing * 40));
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.22;
            S.addProjectile(new Projectile({ type: 'web', x: this.cx + this.facing * 40, y: this.y + 10, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, r: 8, dmg: Math.round(this.dmg * 0.6), slow: 2.0, destroyable: true, life: 2.5 }));
          }
          Sound.play('shoot');
        }
        if (this.st > 1.0 / k) this.setState('idle');
        break;
      case 'lunge':
        if (this.st < 0.45 / k) {
          this.face();
          this.vx = approach(this.vx, 0, 900 * dt);
        } else if (this.st < 0.45 / k + 0.5) {
          if (!this.didHit) { this.didHit = true; Sound.play('dash'); }
          this.vx = this.facing * 540 * k;
          this.contact(1, 380);
        } else this.vx = approach(this.vx, 0, 1200 * dt);
        this.phys(dt, true);
        if (this.st > 0.45 / k + 1.0) this.setState('idle');
        break;
      case 'climb':
        this.vx = 0;
        this.vy = -650;
        moveActor(this, dt, S.world, null);
        if (this.y < S.cam.y - 140 || this.st > 1.2) {
          this.hidden = true;
          this.setState('hang');
        }
        break;
      case 'hang': {
        this.hidden = true;
        this.vy = 0;
        this.y = S.cam.y - 160;
        this.x = approach(this.x, P.cx - this.w / 2, 260 * k * dt);
        this.clampArena();
        if (this.st > 1.3 / k) { this.setState('drop'); this.hidden = false; this.vy = 200; Sound.play('warn'); }
        break;
      }
      case 'drop':
        this.hidden = false;
        this.vy = Math.min(this.vy + 2600 * dt, 1300);
        this.y += this.vy * dt;
        this.contact(1.2, 300);
        if (this.y + this.h >= this.gy) {
          this.y = this.gy - this.h;
          this.vy = 0;
          this.onGround = true;
          S.shake(9, 0.35);
          Sound.play('quake');
          S.fx.dust(this.cx, this.feet, 10);
          for (const d of [-1, 1]) S.addProjectile(new Projectile({ type: 'shock', x: this.cx + d * 40, y: this.feet, vx: d * 300, dmg: Math.round(this.dmg * 0.7), life: 1.0, r: 14, hgt: 26 }));
          this.setState('recover');
        }
        break;
      case 'summon':
        this.vx = approach(this.vx, 0, 900 * dt);
        this.phys(dt, true);
        if (this.st > 0.6 && !this.didHit) {
          this.didHit = true;
          const n = this.phase === 2 ? 3 : 2;
          for (let i = 0; i < n; i++) {
            const e = S.spawnEnemy('spider', this.cx + (i - (n - 1) / 2) * 40, this.feet, { aggro: true, drop: true });
            e.vy = -300;
            e.vx = rand(-150, 150);
          }
          Sound.play('magic');
          S.fx.smoke(this.cx, this.cy, 8, 'rgba(120,80,60,0.5)');
        }
        if (this.st > 1.1) this.setState('idle');
        break;
      case 'recover':
        this.vx = approach(this.vx, 0, 900 * dt);
        this.phys(dt, true);
        if (this.st > 1.0 / k) this.setState('idle');
        break;
      default: this.setState('idle');
    }
  }
  onStagger() { if (this.state === 'hang' || this.state === 'climb') { this.y = this.gy - this.h - 80; this.vy = 0; } }
  draw(ctx) {
    const S = this.scene;
    if (this.state === 'hang') {
      const x = this.cx;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, S.cam.y); ctx.lineTo(x, S.cam.y + 40); ctx.stroke();
      const pulse = 0.5 + 0.5 * Math.sin(this.t * 14);
      ctx.fillStyle = `rgba(255,23,68,${0.25 + pulse * 0.25})`;
      ctx.beginPath(); ctx.ellipse(x, this.gy, 50, 8, 0, 0, TAU); ctx.fill();
      return;
    }
    if (this.state === 'climb' || this.state === 'drop') {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(this.cx, S.cam.y - 10); ctx.lineTo(this.cx, this.y + 10); ctx.stroke();
    }
    drawShadowEllipse(ctx, this.cx, this.gy, 50, 0.3);
    const col = this.flash > 0 ? '#ffffff' : this.freezeT > 0 ? '#b3e5fc' : '#3e2723';
    ctx.save();
    const moving = Math.abs(this.vx) > 20;
    ctx.translate(this.cx, this.feet);
    const rear = this.state === 'web' || (this.state === 'lunge' && this.st < 0.45 / this.spd());
    if (rear) ctx.rotate(-this.facing * 0.2);
    drawSpider(ctx, 0, 0, 3.2, this.t, col, this.facing, moving || this.state === 'drop', false);
    // crown & glowing eyes
    const hx = this.facing * 16, hy = -32;
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(hx - 10, hy - 10); ctx.lineTo(hx - 8, hy - 20); ctx.lineTo(hx - 3, hy - 13); ctx.lineTo(hx, hy - 22);
    ctx.lineTo(hx + 3, hy - 13); ctx.lineTo(hx + 8, hy - 20); ctx.lineTo(hx + 10, hy - 10);
    ctx.fill();
    ctx.fillStyle = this.phase === 2 ? '#ff1744' : '#ff5252';
    for (let i = 0; i < 3; i++) ctx.fillRect(hx + this.facing * (6 + i * 3) - 2, hy - 4 + (i % 2) * 3, 3, 3);
    // abdomen pattern
    ctx.fillStyle = 'rgba(255,82,82,0.8)';
    ctx.beginPath(); ctx.moveTo(-this.facing * 20, -40); ctx.lineTo(-this.facing * 14, -30); ctx.lineTo(-this.facing * 20, -20); ctx.lineTo(-this.facing * 26, -30); ctx.fill();
    ctx.restore();
    if (this.state === 'lunge' && this.st < 0.45 / this.spd()) this.alert(ctx, this.cx, this.y - 16);
  }
}

// ----- SETH-RA (pharaoh) -----
class BossPharaoh extends Boss {
  constructor(scene, arena) { super(scene, 'pharaoh', arena, 30, 76); this.s = 1.6; this.hover = 44; }
  think(dt) {
    const S = this.scene, P = this.P;
    const dx = P.cx - this.cx, adx = Math.abs(dx);
    const k = this.spd();
    const floatY = this.gy - this.h - this.hover + Math.sin(this.t * 2) * 8;
    this.y = approach(this.y, floatY, 200 * dt);
    this.onGround = false;
    switch (this.state) {
      case 'idle': {
        this.face();
        const want = adx > 260 ? this.facing : adx < 170 ? -this.facing : 0;
        this.vx = approach(this.vx, want * 110 * k, 500 * dt);
        this.x += this.vx * dt;
        this.clampArena();
        if (this.hitEdge && adx < 170) { this.setState('tpOut'); break; }
        if (this.st > (this.phase === 2 ? 0.7 : 1.0)) {
          const mummies = S.enemies.filter((e) => !e.dead && e.type === 'mummy').length;
          this.setState(this.pick([['orbs', 3], ['tornado', 2], ['summon', mummies < 2 ? 1.2 : 0], ['tpOut', 1.5], ['beams', this.phase === 2 ? 2.5 : 0]]));
        }
        break;
      }
      case 'tpOut':
        this.alpha = 1 - this.st / 0.35;
        if (this.st > 0.35) {
          let nx = this.cx;
          for (let i = 0; i < 10; i++) {
            nx = rand(this.ax0 + 60, this.ax1 - 60);
            if (Math.abs(nx - P.cx) > 170) break;
          }
          this.x = nx - this.w / 2;
          this.hidden = true;
          S.fx.smoke(this.cx, this.cy, 8, 'rgba(255,213,79,0.5)');
          Sound.play('teleport');
          this.setState('tpIn');
        }
        break;
      case 'tpIn':
        this.hidden = this.st < 0.15;
        this.alpha = this.st / 0.35;
        if (this.st > 0.35) { this.alpha = 1; this.hidden = false; this.setState('idle'); this.st = 0.5; }
        break;
      case 'orbs':
        this.face();
        this.vx = 0;
        if (this.st > 0.6 / k && !this.didHit) {
          this.didHit = true;
          const n = this.phase === 2 ? 7 : 5;
          const sx = this.cx + this.facing * 16, sy = this.y + 6;
          const base = Math.atan2(P.cy - sy, P.cx - sx);
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.2;
            S.addProjectile(new Projectile({ type: 'sandorb', x: sx, y: sy, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, r: 7, dmg: Math.round(this.dmg * 0.7), destroyable: true, life: 3 }));
          }
          Sound.play('magic');
        }
        if (this.st > 1.1 / k) this.setState('idle');
        break;
      case 'tornado':
        this.vx = 0;
        if (this.st > 0.5 / k && !this.didHit) {
          this.didHit = true;
          const dirs = this.phase === 2 ? [-1, 1] : [sign(dx) || 1];
          for (const d of dirs) S.addProjectile(new Projectile({ type: 'tornado', x: this.cx + d * 20, y: this.gy, vx: d * 160, r: 18, dmg: Math.round(this.dmg * 0.8), life: 4.5 }));
          Sound.play('whirl');
        }
        if (this.st > 1.0) this.setState('idle');
        break;
      case 'summon':
        if (this.st > 0.6 && !this.didHit) {
          this.didHit = true;
          for (let i = 0; i < 2; i++) {
            const x = clamp(P.cx + (i ? 1 : -1) * rand(110, 180), this.ax0 + 30, this.ax1 - 30);
            S.spawnEnemy('mummy', x, this.gy, { aggro: true, drop: true });
            S.fx.dust(x, this.gy, 8, 'rgba(230,200,150,0.8)');
          }
          Sound.play('magic');
        }
        if (this.st > 1.2) this.setState('idle');
        break;
      case 'beams':
        if (this.st > 0.4 && !this.didHit) {
          this.didHit = true;
          for (let i = 0; i < 3; i++) {
            S.schedule(i * 0.35, () => {
              S.addProjectile(new Projectile({ type: 'beam', x: this.P.cx + (i - 1) * 20, y: 0, r: 20, bw: 22, dmg: Math.round(this.dmg * 0.8), life: 1.2, warn: 0.75, color: '#ffd54f' }));
            });
          }
          Sound.play('warn');
        }
        if (this.st > 1.8) this.setState('idle');
        break;
      default: this.setState('idle');
    }
  }
  staggerUpdate(dt) {
    this.alpha = 1;
    this.hidden = false;
    this.y = approach(this.y, this.gy - this.h - 6, 300 * dt);
  }
  introUpdate(dt) { this.face(); this.y = approach(this.y, this.gy - this.h - this.hover, 120 * dt); }
  draw(ctx) {
    if (this.alpha <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = clamp(this.alpha, 0, 1);
    drawShadowEllipse(ctx, this.cx, this.gy, 22, 0.25);
    const casting = (this.state === 'orbs' || this.state === 'beams' || this.state === 'summon' || this.state === 'tornado');
    const pose = this.state === 'stagger' ? PZ.hurt : casting ? PZ.castUp : mkPose(0.05, 0.4, 1.2, 1.2, 0.8, -0.1, 0, 0.1, 0);
    const k = skel(this.cx, this.feet, this.facing, this.s, pose, false);
    const col = this.flash > 0 ? '#ffffff' : this.freezeT > 0 ? '#b3e5fc' : '#3e2723';
    // robe
    ctx.fillStyle = this.flash > 0 ? '#fff' : '#f5f5f5';
    ctx.beginPath();
    ctx.moveTo(k.hx - 8, k.hy - 6);
    ctx.lineTo(k.hx + 8, k.hy - 6);
    ctx.lineTo(k.hx + 16 + Math.sin(this.t * 3) * 2, this.feet + 4);
    ctx.lineTo(k.hx - 16 + Math.sin(this.t * 3 + 1) * 2, this.feet + 4);
    ctx.fill();
    ctx.fillStyle = '#1565c0';
    ctx.fillRect(k.hx - 12, k.hy + 6, 24, 4);
    drawStick(ctx, k, col, { outline: 'rgba(255,213,79,0.4)', eye: '#ffeb3b', angry: true });
    // nemes headdress
    ctx.fillStyle = '#ffca28';
    ctx.beginPath();
    ctx.moveTo(k.headX - k.hr - 2, k.headY - 4);
    ctx.lineTo(k.headX + k.hr + 2, k.headY - 4);
    ctx.lineTo(k.headX + k.hr + 7, k.headY + 16);
    ctx.lineTo(k.headX - k.hr - 7, k.headY + 16);
    ctx.fill();
    ctx.fillStyle = '#1565c0';
    for (let i = 0; i < 3; i++) ctx.fillRect(k.headX - k.hr - 4 - i, k.headY + 1 + i * 5, (k.hr + 4 + i) * 2, 2);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(k.headX, k.headY, k.hr * 0.85, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(k.headX + k.f * 3 - 2, k.headY - 2, 4, 3);
    ctx.fillStyle = '#ffca28';
    ctx.beginPath(); ctx.arc(k.headX, k.headY - k.hr, 3, 0, TAU); ctx.fill();
    // staff with sun disc
    const hx = k.fa[2], hy = k.fa[3];
    ctx.strokeStyle = '#ffb300';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx, hy + 30); ctx.lineTo(hx, hy - 30); ctx.stroke();
    const glow = casting ? 1 : 0.5;
    ctx.fillStyle = `rgba(255,213,79,${0.3 * glow})`;
