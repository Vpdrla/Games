<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Runebound: Card Duels</title>
<meta name="theme-color" content="#170d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c170;--gold2:#a8813a;--ink:#f3ead7;--mw:min(13.2vw,11vh,86px);--mh:calc(var(--mw)*1.22);--hw:min(16vw,12vh,90px);--cf:min(2.05vw,1.7vh,13px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07050f;color:var(--ink);font-family:Inter,'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.hidden{display:none!important}
#app.shake{animation:shake .4s}
#app.shake2{animation:shake2 .55s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
@keyframes shake2{0%,100%{transform:none}10%{transform:translate(-14px,6px) rotate(-.6deg)}30%{transform:translate(12px,-8px) rotate(.5deg)}50%{transform:translate(-9px,5px)}70%{transform:translate(6px,-4px)}90%{transform:translate(-3px,2px)}}

/* ---------- generic UI ---------- */
.bgfantasy{background:radial-gradient(ellipse at 50% 0%,#3a2366 0%,#170d2e 45%,#07050f 100%)}
.btn{appearance:none;border:2px solid #a8813a;background:linear-gradient(#3a2b52,#1e1530);color:#f3ead7;font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #0c0817,0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .1s,filter .15s;position:relative;letter-spacing:.03em}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c0817}
.btn.gold{background:linear-gradient(#f3d07f,#b8862c);color:#2a1a05;border-color:#fff1c4;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.big{font-size:22px;padding:16px 26px;width:100%}
.btn.small{font-size:12px;padding:7px 11px;border-radius:9px}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.badge{position:absolute;top:-9px;right:-9px;background:#ff3b5c;color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;font-family:Inter;border:2px solid #fff;animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.panel{background:linear-gradient(rgba(40,28,64,.85),rgba(20,14,34,.9));border:1px solid rgba(232,193,112,.35);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
h3{font-family:Cinzel,'Noto Sans KR',serif;margin:0 0 8px;color:var(--gold);font-size:15px;letter-spacing:.05em}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));z-index:5;flex:none}
.lvl{width:40px;height:40px;border-radius:50%;background:radial-gradient(#6b4bc7,#2a1760);border:2px solid var(--gold);display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:16px;flex:none}
.xpb{flex:1;max-width:220px}
.xpb .bar{height:9px;border-radius:9px;background:#1a1228;border:1px solid #5a4680;overflow:hidden}
.xpb .bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#c79bff);border-radius:9px;transition:width .6s}
.xpb small{font-size:11px;opacity:.75}
.gold{color:var(--gold)}
.goldc{font-weight:800;font-size:16px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:6px 11px;border-radius:999px;border:1px solid rgba(232,193,112,.4)}
.iconbtn{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;flex:none}
.spacer{flex:1}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(20,10,30,.92);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;z-index:200;font-weight:600;pointer-events:none;animation:toast 1.8s forwards;white-space:nowrap;font-size:14px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(5,3,10,.78);z-index:120;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modal .mbox{max-width:780px;width:100%;max-height:92vh;overflow:auto}
.modaltitle{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:24px;text-align:center;color:var(--gold);margin-bottom:12px}

/* ---------- home ---------- */
#scr-home .homewrap{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 16px 24px;z-index:2}
.logo{text-align:center;margin-top:4px}
.logo .l1{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:clamp(38px,9vw,64px);letter-spacing:.08em;background:linear-gradient(#fff6d8,#e8c170 45%,#8a5a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(232,150,40,.45));line-height:1}
.logo .l2{font-family:Cinzel,'Noto Sans KR',serif;letter-spacing:.5em;font-size:13px;opacity:.8;margin-top:4px}
.col{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.rankcard{display:flex;align-items:center;gap:14px}
.emblem{width:64px;height:64px;flex:none;display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:22px;color:#1a1008;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rk);box-shadow:inset 0 0 12px rgba(0,0,0,.4);position:relative}
.emblem::after{content:'';position:absolute;inset:5px;clip-path:inherit;border:0;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 55%)}
.rname{font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;font-size:20px}
.stars{font-size:22px;letter-spacing:3px;color:#4a3e60}
.stars .on{color:#ffd54a;text-shadow:0 0 10px #ffb300}
.streak{color:#ff9147;font-weight:800;font-size:13px;margin-top:2px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.quest:first-of-type{border-top:0}
.quest .qt{flex:1;font-size:13px}
.quest .qbar{height:6px;background:#1a1228;border-radius:6px;margin-top:5px;overflow:hidden}
.quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,#3fd47a,#a8ff7a)}
.quest .qg{font-weight:800;color:var(--gold);font-size:13px;white-space:nowrap}
.smallrow{font-size:12px;opacity:.75;text-align:center;line-height:1.7}
.smallrow a{color:var(--gold);cursor:pointer;text-decoration:underline}
.daily{font-size:13px;text-align:center;padding:8px;border-radius:10px;background:rgba(255,200,80,.08);border:1px dashed rgba(232,193,112,.4)}

/* ---------- cards ---------- */
.card{position:relative;width:8em;height:11.2em;flex:none;font-family:Cinzel,'Noto Sans KR',serif;color:#fff;transition:transform .14s,filter .14s;--rc:#ccc;--c1:#555;--c2:#222}
.card .cframe{position:absolute;inset:0;border-radius:.75em;overflow:hidden;background:linear-gradient(165deg,var(--c1),var(--c2));border:.2em solid var(--rc);box-shadow:0 .3em .8em rgba(0,0,0,.6),inset 0 0 1.4em rgba(0,0,0,.55)}
.card .art{position:absolute;left:.45em;right:.45em;top:.5em;height:4.5em;border-radius:.5em .5em 2em 2em/.5em .5em 1em 1em;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.4),rgba(255,255,255,.05) 55%,rgba(0,0,0,.35));display:grid;place-items:center;border:.1em solid rgba(255,255,255,.25);overflow:hidden}
.card.spell .art{left:1em;right:1em;border-radius:50%}
.card .art span{font-size:3em;line-height:1;filter:drop-shadow(0 .06em .1em rgba(0,0,0,.6))}
.card .cname{position:absolute;left:.15em;right:.15em;top:5.15em;height:1.35em;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 15%,rgba(0,0,0,.65) 85%,transparent)}
.card .cname b{font-size:.7em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 .5em;text-shadow:0 .08em .1em #000}
.card .ctext{position:absolute;left:.5em;right:.5em;top:6.65em;bottom:1.15em;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(255,248,230,.9);border-radius:.35em;color:#2a1d10}
.card .ctext div{font-family:Inter,'Noto Sans KR',sans-serif;font-size:.55em;line-height:1.22;padding:0 .3em;font-weight:600}
.card .ctext.blank{background:rgba(0,0,0,.25);color:rgba(255,255,255,.45);font-style:italic}
.card .ctext b{color:#000;font-weight:900}
.card .gem{position:absolute;width:1.85em;height:1.85em;font-size:1.1em;display:grid;place-items:center;font-weight:900;border-radius:50%;text-shadow:0 0 .2em #000,0 .08em 0 #000;font-family:Cinzel,'Noto Sans KR',serif;border:.12em solid rgba(255,255,255,.7);box-shadow:0 .1em .3em rgba(0,0,0,.7);z-index:2}
.card .cost{left:-.32em;top:-.32em;background:radial-gradient(circle at 35% 30%,#8fd0ff,#1f6ad6 55%,#0b2e6e)}
.card .atk{left:-.32em;bottom:-.32em;background:radial-gradient(circle at 35% 30%,#ffe58a,#d99a12 55%,#6e4a05)}
.card .hp{right:-.32em;bottom:-.32em;background:radial-gradient(circle at 35% 30%,#ff9a8a,#d62a1f 55%,#6e0b05);border-radius:50% 50% 50% 50%/58% 58% 42% 42%}
.card .rgem{position:absolute;left:50%;top:5em;width:.65em;height:.65em;transform:translate(-50%,-50%) rotate(45deg);background:var(--rc);box-shadow:0 0 .5em var(--rc);border:.06em solid #fff;z-index:1}
.card.r-t .rgem{display:none}
.card.r-l .cframe::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,225,160,.45) 50%,transparent 65%);background-size:300% 100%;animation:shimmer 3.2s infinite;pointer-events:none}
.card.r-l .cframe{box-shadow:0 0 1.2em rgba(255,164,27,.55),inset 0 0 1.4em rgba(0,0,0,.55)}
.card.r-l::before{content:'♛';position:absolute;top:-1.05em;left:50%;transform:translateX(-50%);font-size:1.1em;color:#ffcf6a;text-shadow:0 0 .5em #ff9d00;z-index:3}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-150% 0}}
.r-c{--rc:#dfe4ec}.r-r{--rc:#3d9bff}.r-e{--rc:#c04dff}.r-l{--rc:#ffa41b}.r-t{--rc:#8a8a8a}
.c-arcanist{--c1:#c8451c;--c2:#3e0d05}
.c-light{--c1:#cf9d22;--c2:#4a3206}
.c-necro{--c1:#6b2fc4;--c2:#1c0838}
.c-beast{--c1:#2f8a3a;--c2:#0b2a0f}
.c-neutral{--c1:#646d80;--c2:#1c2029}
.cardback{width:8em;height:11.2em;border-radius:.75em;background:radial-gradient(circle at 50% 45%,#4b2f8a,#1a0e36 70%);border:.22em solid #b8913f;box-shadow:0 .25em .6em rgba(0,0,0,.6),inset 0 0 0 .35em #2a1a52,inset 0 0 0 .45em #b8913f66;position:relative;display:grid;place-items:center}
.cardback::after{content:'ᚱ';font-family:serif;font-size:3.6em;color:#e8c170;text-shadow:0 0 .3em #ffb84d;opacity:.9}

/* ---------- match ---------- */
#scr-match{background:radial-gradient(ellipse at 50% 50%,#4a3420 0%,#25190d 55%,#0d0905 100%)}
#scr-match::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.015) 0 2px,transparent 2px 7px);pointer-events:none}
.mtable{position:absolute;left:3%;right:3%;top:21%;bottom:30%;border-radius:40px;background:radial-gradient(ellipse at 50% 50%,#5a4128,#3a2914 70%);box-shadow:inset 0 0 60px rgba(0,0,0,.7),0 0 0 6px #2a1c0c,0 0 0 9px #6b4e24;pointer-events:none}
#eHand{height:calc(var(--cf)*4.2);display:flex;justify-content:center;align-items:flex-start;flex:none;z-index:2;padding-top:4px}
#eHand .cardback{font-size:calc(var(--cf)*.42);margin:0 -.9em;transform:rotate(180deg)}
.herorow{flex:none;display:grid;grid-template-columns:1fr auto auto 1fr;align-items:center;gap:min(3vw,22px);padding:2px 10px;z-index:3;position:relative}
.herorow .hl{justify-self:end;text-align:right;font-size:12px;opacity:.9;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.herorow .hr{justify-self:start}
.pill{background:rgba(0,0,0,.45);padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.15);white-space:nowrap;font-weight:600}
.hero{position:relative;width:var(--hw);height:calc(var(--hw)*1.1);cursor:pointer;font-size:calc(var(--hw)/7)}
.hero .hport{position:absolute;inset:0;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 50% 35%,var(--c1),var(--c2) 75%);border:.3em solid #b8913f;box-shadow:0 .3em 1em rgba(0,0,0,.7),inset 0 0 1em rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.hero .hport span{font-size:4em;filter:drop-shadow(0 .1em .15em rgba(0,0,0,.6))}
.hero .hhp{position:absolute;right:-.5em;bottom:-.4em;width:2.4em;height:2.6em;background:radial-gradient(circle at 35% 30%,#ff9a8a,#d62a1f 55%,#6e0b05);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:1.25em;border:.12em solid #ffd6cf;text-shadow:0 0 .2em #000,0 .08em 0 #000;z-index:2}
.hero .harmor{position:absolute;left:-.5em;bottom:-.3em;width:2.3em;height:2.5em;background:linear-gradient(#cfd6e0,#6b7484);clip-path:polygon(50% 0,100% 15%,92% 70%,50% 100%,8% 70%,0 15%);display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:1.1em;color:#111;z-index:2}
.hero .hname{position:absolute;left:50%;top:-1.5em;transform:translateX(-50%);font-size:.95em;white-space:nowrap;font-weight:800;text-shadow:0 1px 3px #000;font-family:Cinzel,'Noto Sans KR',serif;color:#f6e6c4}
.herorow.bottom .hero .hname{top:auto;bottom:-1.6em}
.dmg{color:#ff6b6b!important}
.up{color:#7dff8a!important}
.power{position:relative;width:calc(var(--hw)*.62);height:calc(var(--hw)*.62);border-radius:50%;background:radial-gradient(circle at 40% 35%,#5d4a8a,#22163e);border:3px solid #6b5a8a;display:grid;place-items:center;font-size:calc(var(--hw)*.3);cursor:pointer;filter:grayscale(.7) brightness(.7);transition:all .2s}
.power.can{filter:none;border-color:#47ff8a;box-shadow:0 0 14px #47ff8a;animation:pulse 1.4s infinite}
.power.used{transform:rotateY(180deg);filter:grayscale(1) brightness(.4)}
.power .pc{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd0ff,#1f6ad6 55%,#0b2e6e);font-size:13px;font-weight:900;font-family:Cinzel,'Noto Sans KR',serif;display:grid;place-items:center;border:1.5px solid #fff}
.mana{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.mana .mt{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:16px;color:#8fd0ff;text-shadow:0 0 8px #1f6ad6}
.mana .cr{display:flex;gap:2px;flex-wrap:wrap;max-width:110px}
.mana .cr i{width:9px;height:12px;background:linear-gradient(#8fd0ff,#1f6ad6);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:1}
.mana .cr i.off{background:#1a2a44}
.board{flex:1;display:flex;justify-content:center;align-items:center;gap:calc(var(--mw)*.14);z-index:2;min-height:calc(var(--mh) + 10px);position:relative}
#mid{height:0;position:relative;z-index:4;flex:none}
#endTurn{position:absolute;right:max(1.5vw,8px);top:50%;transform:translateY(-50%);font-size:min(3.2vw,14px);padding:10px 12px;min-width:min(22vw,118px)}
#endTurn.ready{background:linear-gradient(#7dff9a,#1f9a45);color:#032;border-color:#d6ffe0;animation:pulse 1.2s infinite}
#endTurn:disabled{background:linear-gradient(#5a5a5a,#2a2a2a);color:#aaa;border-color:#666;filter:none}
#menuBtn{position:absolute;left:8px;top:8px;z-index:10}
.minion{position:relative;width:var(--mw);height:var(--mh);font-size:calc(var(--mw)/6);cursor:pointer;z-index:0;transition:transform .15s}
.minion .mb{position:absolute;inset:0;border-radius:50%/46%;background:radial-gradient(circle at 50% 38%,var(--c1),var(--c2) 80%);border:.22em solid var(--rc);box-shadow:0 .25em .6em rgba(0,0,0,.7),inset 0 0 .8em rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.minion .mb span{font-size:2.9em;filter:drop-shadow(0 .06em .1em rgba(0,0,0,.6))}
.minion .ms{position:absolute;bottom:-.25em;width:1.75em;height:1.75em;display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:1.15em;border-radius:50%;text-shadow:0 0 .2em #000,0 .08em 0 #000;border:.1em solid rgba(255,255,255,.75);z-index:3}
.minion .ms.a{left:-.25em;background:radial-gradient(circle at 35% 30%,#ffe58a,#d99a12 55%,#6e4a05)}
.minion .ms.h{right:-.25em;background:radial-gradient(circle at 35% 30%,#ff9a8a,#d62a1f 55%,#6e0b05);border-radius:50% 50% 50% 50%/58% 58% 42% 42%}
.minion .mi{position:absolute;top:-.35em;left:50%;transform:translateX(-50%);display:flex;gap:.1em;font-size:.95em;z-index:3;filter:drop-shadow(0 0 .15em #000)}
.minion .zz{position:absolute;right:-.2em;top:.2em;font-size:1.1em;animation:bob 1.6s infinite;z-index:3}
.minion.taunt::before{content:'';position:absolute;inset:-.55em -.45em -.25em;background:linear-gradient(#a3a9b5,#474c57);clip-path:polygon(50% 0,100% 13%,96% 68%,50% 100%,4% 68%,0 13%);z-index:-1;filter:drop-shadow(0 0 2px #000)}
.minion.ward .mb{box-shadow:0 0 0 .22em #fff2a8,0 0 1.2em .35em #ffd54a,inset 0 0 1em rgba(255,230,120,.7)}
.minion.frozen .mb::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(190,235,255,.7),rgba(90,170,255,.4));}
.minion.frozen .mb span{filter:grayscale(.6) brightness(1.2)}
.minion.ready::after,.hero.tgt::after,.minion.tgt::after{content:'';position:absolute;inset:-.28em;border-radius:50%/46%;border:.2em solid #47ff8a;box-shadow:0 0 .8em #47ff8a,inset 0 0 .5em #47ff8a;animation:pulse 1.1s infinite;pointer-events:none;z-index:4}
.minion.tgt::after,.hero.tgt::after{border-color:#ff4d4d;box-shadow:0 0 1em #ff4d4d,inset 0 0 .5em #ff4d4d}
.hero.tgt::after{border-radius:45% 45% 40% 40%;inset:-.4em}
.tgt.friendly::after{border-color:#5cd2ff!important;box-shadow:0 0 1em #5cd2ff,inset 0 0 .5em #5cd2ff!important}
.minion.sel{transform:translateY(-8%) scale(1.1);z-index:5}
.minion.spawn{animation:spawn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes spawn{0%{transform:scale(1.8) translateY(-30%);opacity:0;filter:brightness(3)}100%{transform:none;opacity:1;filter:none}}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-7%) rotate(-4deg);filter:brightness(2) saturate(.3)}60%{transform:translateX(6%) rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
#pHand{flex:none;height:calc(var(--cf)*11.2 + 26px);display:flex;justify-content:center;align-items:flex-end;padding-bottom:18px;z-index:6;position:relative}
#pHand .card{font-size:var(--cf);cursor:pointer;transform-origin:50% 100%}
#pHand .card.playable .cframe{border-color:#47ff8a;box-shadow:0 0 0 .1em #47ff8a,0 0 1.1em #47ff8a,inset 0 0 1.4em rgba(0,0,0,.55)}
#pHand .card.sel{transform:translateY(-22%) scale(1.12);z-index:10}
@media (hover:hover){#pHand .card:hover{transform:translateY(-26%) scale(1.22);z-index:20}}
#pHand .card.nope{animation:hit .35s}
#pHand.hidden-hand .card{visibility:hidden}
#arrow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#preview{position:fixed;left:max(2vw,10px);top:50%;transform:translateY(-50%);z-index:80;pointer-events:none;display:none;flex-direction:column;gap:8px;align-items:flex-start}
#preview.on{display:flex}
#preview .card{font-size:min(22px,3.3vh)}
.kwbox{max-width:13em;font-size:12px;background:rgba(10,6,20,.92);border:1px solid #a8813a;border-radius:10px;padding:8px 10px;line-height:1.35}
.kwbox b{color:var(--gold)}
#preview.center{left:50%;transform:translate(-50%,-50%);align-items:center}
.float{position:fixed;z-index:95;pointer-events:none;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;transform:translate(-50%,-50%);animation:floatUp 1.1s forwards;text-shadow:0 0 6px #000,0 2px 0 #000}
.float.d{color:#fff;font-size:30px;width:64px;height:64px;display:grid;place-items:center;background:radial-gradient(#ff3d2e,#a30d05);clip-path:polygon(50% 0,61% 32%,98% 22%,70% 50%,98% 78%,61% 68%,50% 100%,39% 68%,2% 78%,30% 50%,2% 22%,39% 32%)}
.float.d.big{font-size:40px;width:90px;height:90px}
.float.h{color:#7dff8a;font-size:30px}
.float.t{color:#ffe27a;font-size:20px;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
#banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:85;pointer-events:none;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:clamp(34px,8vw,72px);letter-spacing:.06em;white-space:nowrap;display:none}
#banner.on{display:block;animation:banner 1.3s forwards}
#banner.mine{background:linear-gradient(#fff6d8,#e8c170 50%,#a8661a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,180,60,.8))}
#banner.theirs{color:#ff8a8a;text-shadow:0 0 20px #c00;font-size:clamp(26px,6vw,52px)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#showcase{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:84;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:8px}
#showcase.on{display:flex;animation:showc .95s forwards}
#showcase .card{font-size:min(20px,3vh)}
#showcase .lbl{font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;color:#ffb3b3;text-shadow:0 2px 4px #000;font-size:16px}
@keyframes showc{0%{opacity:0;transform:translate(-50%,-80%) scale(.4) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
.bubble{position:fixed;z-index:86;background:#fff8e6;color:#2a1a05;padding:8px 13px;border-radius:14px;font-weight:700;font-size:14px;max-width:220px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:bubble 2.6s forwards;font-family:Inter,'Noto Sans KR',sans-serif}
@keyframes bubble{0%{opacity:0;transform:scale(.5)}8%{opacity:1;transform:scale(1.05)}14%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
#emotes{position:fixed;z-index:87;display:none;flex-direction:column;gap:6px}
#emotes.on{display:flex}
#emotes button{background:#fff8e6;color:#2a1a05;border:2px solid #a8813a;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:13px}
#pass{position:fixed;inset:0;z-index:110;background:radial-gradient(#2a1a4a,#07050f);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#pass.on{display:flex}
#pass .pt{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:clamp(28px,6vw,48px);color:var(--gold)}
.flash{position:fixed;inset:0;z-index:96;pointer-events:none;animation:flash .7s forwards}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* ---------- matchmaking / vs ---------- */
#mm{position:fixed;inset:0;z-index:105;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(#2a1a4a,#07050f)}
#mm.on{display:flex}
.spin{width:70px;height:70px;border-radius:50%;border:5px solid rgba(232,193,112,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vs{display:flex;align-items:center;gap:min(6vw,50px)}
.vs .side{text-align:center;animation:vsIn .5s both}
.vs .side.r{animation-name:vsInR}
.vs .side .hero{margin:0 auto 26px;cursor:default;--hw:min(26vw,140px);width:var(--hw);height:calc(var(--hw)*1.1);font-size:calc(var(--hw)/7)}
.vs .vt{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:clamp(40px,10vw,80px);color:#ff5a3c;text-shadow:0 0 25px #ff2a00;animation:vsPop .5s .3s both}
.vs .nm{font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;font-size:clamp(14px,3.5vw,20px)}
.vs .sub{font-size:12px;opacity:.7;margin-top:3px}
@keyframes vsIn{from{opacity:0;transform:translateX(-120px)}}
@keyframes vsInR{from{opacity:0;transform:translateX(120px)}}
@keyframes vsPop{from{opacity:0;transform:scale(3)}}

/* ---------- hero select ---------- */
.hsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.hsc{position:relative;border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:linear-gradient(165deg,var(--c1),var(--c2));border:2px solid rgba(255,255,255,.25);transition:transform .15s,box-shadow .15s}
.hsc:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 2px var(--gold)}
.hsc .e{font-size:54px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hsc .n{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:17px;margin-top:4px}
.hsc .d{font-size:12px;opacity:.9;margin-top:6px;min-height:30px}
.hsc .p{font-size:11px;margin-top:8px;background:rgba(0,0,0,.35);border-radius:8px;padding:5px}
.hsc.locked{filter:grayscale(.9) brightness(.55);cursor:not-allowed}
.hsc.locked::after{content:attr(data-lock);position:absolute;inset:0;display:grid;place-items:center;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:16px;background:rgba(0,0,0,.35);border-radius:14px;color:#fff}

/* ---------- result ---------- */
#scr-result{align-items:center;justify-content:center;padding:20px;overflow:auto}
.restitle{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:clamp(52px,13vw,110px);letter-spacing:.06em;line-height:1;animation:vsPop .6s both}
.restitle.win{background:linear-gradient(#fff6d8,#ffd04a 45%,#b8661a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,190,60,.7))}
.restitle.lose{color:#8c95a8;text-shadow:0 0 20px #000}
.reswrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.resline{font-size:14px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.05);width:100%;animation:vsIn .4s both}
.bigxp{width:100%}
.bigxp .bar{height:16px;border-radius:12px;background:#1a1228;border:1px solid #5a4680;overflow:hidden}
.bigxp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#e0b3ff);transition:width .7s ease-out}
.lvlup{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:28px;color:#d8b4ff;text-shadow:0 0 18px #9b5cff;animation:vsPop .5s both}

/* ---------- shop ---------- */
#scr-shop .shopwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center}
.pack{width:170px;height:240px;border-radius:14px;position:relative;background:linear-gradient(150deg,#7b3fe4,#2a0f5e 60%,#150735);border:4px solid #e8c170;box-shadow:0 0 40px rgba(155,92,255,.6),inset 0 0 30px rgba(0,0,0,.5);display:grid;place-items:center;animation:packbob 2.4s ease-in-out infinite;cursor:pointer}
.pack::before{content:'ᚱ';font-family:serif;font-size:96px;color:#ffe3a1;text-shadow:0 0 22px #ffb84d}
.pack::after{content:'RUNEBOUND';position:absolute;bottom:16px;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;letter-spacing:.15em;font-size:13px;color:#ffe3a1}
.pack .cnt{position:absolute;top:-12px;right:-12px;background:#ff3b5c;border:3px solid #fff;border-radius:999px;min-width:38px;height:38px;display:grid;place-items:center;font-weight:900;font-size:18px}
.pack.empty{filter:grayscale(1) brightness(.4);animation:none;cursor:default}
.pack.open{animation:packopen .8s forwards}
@keyframes packbob{50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes packopen{0%{transform:scale(1)}30%{transform:scale(1.1) rotate(-4deg)}50%{transform:scale(1.05) rotate(4deg)}70%{transform:scale(1.15) rotate(-3deg);filter:brightness(1.6)}100%{transform:scale(2.2);opacity:0;filter:brightness(4)}}
#reveal{position:fixed;inset:0;z-index:100;background:radial-gradient(#2a1650,#07050f 80%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:16px}
#reveal.on{display:flex}
.revrow{display:flex;flex-wrap:wrap;justify-content:center;gap:2.6em min(3vw,22px);max-width:900px;padding-bottom:2em}
.flip{font-size:min(3.6vw,2.3vh,17px);perspective:900px;cursor:pointer;animation:dealIn .5s both;animation-delay:calc(var(--d)*.1s);position:relative}
.flip .fi{position:relative;width:8em;height:11.2em;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.flipped .fi{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip:not(.flipped):hover .fi{transform:translateY(-6px) rotate(-2deg)}
.flip.r-r:not(.flipped) .cardback{box-shadow:0 0 1.2em .3em #3d9bff,inset 0 0 0 .35em #2a1a52}
.flip.r-e:not(.flipped) .cardback{box-shadow:0 0 1.5em .5em #c04dff,inset 0 0 0 .35em #2a1a52;animation:pulse 1s infinite}
.flip.r-l:not(.flipped) .cardback{box-shadow:0 0 2em .8em #ffa41b,inset 0 0 0 .35em #2a1a52;animation:legglow .6s infinite alternate}
@keyframes legglow{to{box-shadow:0 0 3em 1.2em #ffcf4a,inset 0 0 0 .35em #2a1a52}}
@keyframes dealIn{from{opacity:0;transform:translateY(80px) scale(.6) rotate(10deg)}}
.newtag,.extratag{position:absolute;left:50%;transform:translateX(-50%);bottom:-1.9em;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:.9em;white-space:nowrap;opacity:0;transition:opacity .3s .4s}
.newtag{color:#7dff8a;text-shadow:0 0 8px #2a8}
.extratag{color:var(--gold)}
.flip.flipped .newtag,.flip.flipped .extratag{opacity:1}

/* ---------- collection ---------- */
#scr-coll .cwrap{flex:1;display:flex;gap:10px;padding:0 10px 10px;min-height:0}
.ctabs{display:flex;gap:6px;padding:0 10px 8px;flex-wrap:wrap;flex:none}
.ctab{padding:7px 12px;border-radius:10px;cursor:pointer;font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;font-size:13px;background:linear-gradient(var(--c1),var(--c2));border:2px solid transparent;opacity:.65}
.ctab.on{opacity:1;border-color:var(--gold);box-shadow:0 0 12px rgba(232,193,112,.5)}
.pool{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(8em*var(--pf) + 6px),1fr));gap:28px 8px;padding:14px 6px 30px;--pf:1;font-size:11px;align-content:start}
.pc{position:relative;cursor:pointer;display:flex;justify-content:center}
.pc .card{font-size:11px}
.pc:hover .card{transform:scale(1.05)}
.pc.unowned .card{filter:grayscale(1) brightness(.4)}
.pc .own{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:#000a;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pc .indeck{position:absolute;top:-8px;right:4px;background:#47ff8a;color:#032;font-weight:900;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;border:2px solid #fff;z-index:4}
.dpanel{width:250px;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
.dlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.drow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:linear-gradient(90deg,var(--c1),var(--c2));cursor:pointer;font-size:13px;border-left:4px solid var(--rc)}
.drow:hover{filter:brightness(1.25)}
.drow .dc{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd0ff,#1f6ad6 55%,#0b2e6e);display:grid;place-items:center;font-weight:900;font-family:Cinzel,'Noto Sans KR',serif;font-size:12px;flex:none}
.drow .dn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.curve{display:flex;align-items:flex-end;gap:4px;height:46px;padding:4px 2px 0}
.curve div{flex:1;background:linear-gradient(#8fd0ff,#1f6ad6);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.curve div span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.7}
@media (max-width:640px){
 #scr-coll .cwrap{flex-direction:column}
 .dpanel{width:auto;height:38%}
 .curve,.curvesp,.dhelp{display:none}
 .pool,.pc .card{font-size:11.5px}
 .pc .own{font-size:10px}
 .acct span{display:none}
 .xpb small{font-size:10px}
 .herorow{gap:8px;padding:2px 6px}
 .mana .cr{max-width:70px}
 .mana .cr i{width:6px;height:9px}
 .herorow .hl{font-size:10px}
}
@media (max-height:560px){.mtable{display:none}}
/* trials */
.blist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.boss{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(110deg,var(--c1),var(--c2) 70%);border:2px solid rgba(255,255,255,.15);cursor:pointer;position:relative}
.boss .be{font-size:46px;width:70px;text-align:center;filter:drop-shadow(0 3px 4px #000)}
.boss .bn{font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;font-size:17px}
.boss .bd{font-size:12px;opacity:.85;margin-top:2px}
.boss .br{font-size:12px;color:var(--gold);margin-top:5px;font-weight:700}
.boss.locked{filter:grayscale(1) brightness(.45);cursor:not-allowed}
.boss.done::after{content:'✓ DEFEATED';position:absolute;right:12px;top:10px;font-family:Cinzel,'Noto Sans KR',serif;font-weight:900;color:#7dff8a;font-size:12px}
.helpgrid{display:grid;gap:8px;font-size:14px;line-height:1.45}
.helpgrid b{color:var(--gold)}

/* ---------- login ---------- */
#scr-login .lgwrap{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 16px 30px;width:100%;max-width:480px;margin:0 auto;z-index:2}
.lgheroes{display:flex;gap:16px;font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.lgheroes span{animation:bob 2.4s ease-in-out infinite;display:inline-block}
.lgheroes span:nth-child(2){animation-delay:.3s}.lgheroes span:nth-child(3){animation-delay:.6s}.lgheroes span:nth-child(4){animation-delay:.9s}
.lgcard{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.lgsub{font-size:13px;opacity:.8;line-height:1.4}
.lgst{font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.4}
.lgst.ok{color:#7dff8a}.lgst.bad{color:#ffb38a}
#lgNick{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid rgba(232,193,112,.5);background:rgba(0,0,0,.35);color:#fff;text-align:center;outline:none}
#lgNick:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,193,112,.25)}
.spin.sm{width:16px;height:16px;border-width:3px;display:inline-block;vertical-align:middle}
.langsw{display:inline-flex;border:1px solid rgba(232,193,112,.5);border-radius:999px;overflow:hidden;align-self:center}
.langsw button{background:rgba(0,0,0,.3);color:#ccc;border:0;padding:7px 13px;font-weight:800;cursor:pointer;font-size:13px}
.langsw button.on{background:var(--gold);color:#2a1a05}
.acct{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px;cursor:pointer;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
/* ---------- tap-to-read sheet ---------- */
#cardInfo{position:fixed;inset:0;z-index:115;display:none;align-items:center;justify-content:center;background:rgba(5,3,10,.6);padding:10px}
#cardInfo.on{display:flex}
.ciw{display:flex;flex-direction:column;align-items:center;gap:12px;animation:vsPop .18s both;max-width:100%}
.ciw .card{font-size:min(24px,6.4vw,3.9vh)}
.ciw .kwbox{max-width:min(24em,92vw);font-size:14px}
.cib{display:flex;gap:10px}
.cib .btn{min-width:120px;font-size:16px}
#preview .card .ctext div,.ciw .card .ctext div{font-size:.62em}
.card .ctext div.long{font-size:.47em}
#preview .card .ctext div.long,.ciw .card .ctext div.long{font-size:.54em}
html[lang=ko] .card .ctext div{word-break:keep-all}
/* ---------- compact (phones) ---------- */
body.compact{--mw:min(13.4vw,10.5vh,86px);--hw:min(18vw,11vh,90px);--cf:min(3.3vw,2.25vh,13px)}
body.compact #pHand .card .ctext{display:none}
body.compact #pHand .card .art{height:5.6em}
body.compact #pHand .card .art span{font-size:3.4em}
body.compact #pHand .card .rgem{top:6.1em}
body.compact #pHand .card .cname{top:6.5em;height:2.7em;background:rgba(0,0,0,.5)}
body.compact #pHand .card .cname b{font-size:.95em;white-space:normal;line-height:1.1;text-align:center;word-break:keep-all}
body.compact #pHand .card.sel{transform:translateY(-14%) scale(1.08)!important}
body.compact .herorow{gap:8px;padding:2px 6px}
body.compact .btn.big{font-size:19px;padding:14px 18px}
.xpb small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
body.compact .herorow .pill{font-size:10.5px;padding:2px 7px}
body.compact .pname{max-width:27vw;overflow:hidden;text-overflow:ellipsis}
body.compact .mana .cr{display:none}
body.compact .mana .mt{font-size:19px}
body.compact #endTurn{font-size:12px;padding:9px 8px;min-width:78px}
body.compact .mtable{left:1.5%;right:1.5%}
body.compact .minion .ms{font-size:1.3em}
body.compact .hero .hhp{font-size:1.45em}
body.compact .power .pc{width:20px;height:20px;font-size:12px}
body.compact #menuBtn{width:34px;height:34px;font-size:15px}
body.compact .bubble{font-size:13px;max-width:170px}
body.compact #emotes button{font-size:14px;padding:8px 14px}
body.compact.landscape #eHand{height:calc(var(--cf)*3.2)}
.pname{font-family:Cinzel,'Noto Sans KR',serif;font-weight:800;color:#f6e6c4;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app">
  <section id="scr-login" class="screen bgfantasy on"></section>
  <section id="scr-home" class="screen bgfantasy"></section>
  <section id="scr-match" class="screen">
    <div class="mtable"></div>
    <button class="iconbtn" id="menuBtn" title="Menu">☰</button>
    <div id="eHand"></div>
    <div class="herorow top" id="eHeroRow"></div>
    <div class="board" id="eBoard"></div>
    <div id="mid"><button class="btn" id="endTurn">END TURN</button></div>
    <div class="board" id="pBoard"></div>
    <div class="herorow bottom" id="pHeroRow"></div>
    <div id="pHand"></div>
  </section>
  <section id="scr-result" class="screen bgfantasy"></section>
  <section id="scr-shop" class="screen bgfantasy"></section>
  <section id="scr-coll" class="screen bgfantasy"></section>

function isHero(t){return !!t&&t.board!==undefined;}
function keyOf(S,t){return isHero(t)?'h'+S.p.indexOf(t):'m'+t.uid;}
function ev(S,type,o){if(!S.sim)S.ev.push(Object.assign({type},o||{}));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function mkP(c){
  return {name:c.name,cls:c.cls,hero:c.hero,hp:c.hp||30,maxHp:c.hp||30,armor:0,mana:0,maxMana:0,
    deck:shuffle(c.deck.slice()),hand:[],board:[],powerUsed:false,power:c.power,fatigue:0,ai:!!c.ai,
    st:{minions:0,spells:0,face:0,kills:0}};
}
function newGame(c0,c1,firstIdx){
  const S={p:[mkP(c0),mkP(c1)],cur:0,turn:1,uid:1,over:false,winner:null,ev:[],sim:false};
  const first=firstIdx!=null?firstIdx:(Math.random()<.5?0:1);
  S.cur=first;S.first=first;
  for(let i=0;i<3;i++)drawCard(S,first);
  for(let i=0;i<4;i++)drawCard(S,1-first);
  S.p[1-first].hand.push('coin');
  [c0,c1].forEach((c,i)=>(c.startBoard||[]).forEach(id=>{const m=summon(S,i,id);if(m){m.sleep=false;}}));
  startTurn(S);
  return S;
}
function drawCard(S,pi){
  const p=S.p[pi];
  if(!p.deck.length){p.fatigue++;ev(S,'fatigue',{pi,n:p.fatigue});dealDmg(S,p,p.fatigue,1-pi,null);return;}
  const id=p.deck.pop();
  if(p.hand.length>=10){ev(S,'burn',{pi,id});return;}
  p.hand.push(id);ev(S,'draw',{pi});
}
function summon(S,pi,id){
  const p=S.p[pi];if(p.board.length>=7)return null;
  const d=CARDS[id];
  const m={uid:S.uid++,id,atk:d.atk,hp:d.hp,maxHp:d.hp,kw:{},sleep:true,atkLeft:0,frozen:0,tempAtk:0,owner:pi};
  (d.kw||[]).forEach(k=>m.kw[k]=1);
  m.atkLeft=m.kw.windfury?2:1;
  p.board.push(m);ev(S,'summon',{k:'m'+m.uid});
  return m;
}
function dealDmg(S,t,n,by,srcM){
  if(!t||n<=0)return 0;
  if(isHero(t)){
    const a=Math.min(t.armor,n);t.armor-=a;t.hp-=(n-a);
    ev(S,'dmg',{k:keyOf(S,t),n});
    if(S.p[by]&&S.p[by]!==t)S.p[by].st.face+=n;
  }else{
    if(t.kw.ward){t.kw.ward=0;ev(S,'ward',{k:'m'+t.uid});return 0;}
    t.hp-=n;ev(S,'dmg',{k:'m'+t.uid,n});
    if(srcM&&srcM.kw&&srcM.kw.venom){t.destroyed=true;}
  }
  if(srcM&&srcM.kw&&srcM.kw.lifesteal)healT(S,S.p[srcM.owner],n);
  return n;
}
function healT(S,t,n){
  if(!t)return 0;const amt=Math.max(0,Math.min(n,t.maxHp-t.hp));
  if(amt>0){t.hp+=amt;ev(S,'heal',{k:keyOf(S,t),n:amt});}
  return amt;
}
function buff(S,m,a,b){if(!m||isHero(m))return;m.atk+=a;m.hp+=b;m.maxHp+=b;ev(S,'buff',{k:'m'+m.uid});}
function freezeT(S,t){if(!t)return;if(!isHero(t))t.frozen=1;ev(S,'freeze',{k:keyOf(S,t)});}

function H(S,pi,src){
  const me=S.p[pi],op=S.p[1-pi];
  const alive=a=>a.filter(m=>m.hp>0&&!m.destroyed);
  const h={S,me,op,pi,src,
    dmg:(t,n)=>dealDmg(S,t,n,pi,src&&!isHero(src)?src:null),
    heal:(t,n)=>healT(S,t,n),
    summon:id=>summon(S,pi,id),
    draw:n=>{for(let i=0;i<n;i++)drawCard(S,pi);},
    buff:(m,a,b)=>buff(S,m,a,b),
    tempBuff:(m,a)=>{m.atk+=a;m.tempAtk+=a;ev(S,'buff',{k:'m'+m.uid});},
    freeze:t=>freezeT(S,t),
    destroy:m=>{m.destroyed=true;},
    giveKw:(m,k)=>{if(isHero(m))return;m.kw[k]=1;ev(S,'buff',{k:'m'+m.uid});},
    setHp:(m,v)=>{if(isHero(m))return;m.hp=v;m.maxHp=v;ev(S,'buff',{k:'m'+m.uid});},
    myMinions:()=>alive(me.board),
    enemyMinions:()=>alive(op.board),
    allMinions:()=>alive(me.board).concat(alive(op.board)),
    enemies:()=>[op].concat(alive(op.board)),
    rand:a=>a[Math.floor(Math.random()*a.length)],
    discard:()=>{if(me.hand.length){const i=Math.floor(Math.random()*me.hand.length);const id=me.hand.splice(i,1)[0];ev(S,'burn',{pi,id});}},
    steal:()=>{if(op.hand.length&&me.hand.length<10){me.hand.push(op.hand[Math.floor(Math.random()*op.hand.length)]);ev(S,'draw',{pi});}},
    mindControl:()=>{const em=alive(op.board);if(!em.length||me.board.length>=7)return;const m=em[Math.floor(Math.random()*em.length)];op.board.splice(op.board.indexOf(m),1);m.owner=pi;m.sleep=true;m.atkLeft=0;me.board.push(m);ev(S,'summon',{k:'m'+m.uid});}
  };
  return h;
}
function resolve(S){
  for(let g=0;g<30;g++){
    const dead=[];
    for(let i=0;i<2;i++)for(const m of S.p[i].board)if(m.hp<=0||m.destroyed)dead.push([i,m]);
    if(!dead.length)break;
    for(const [i,m] of dead){const b=S.p[i].board;const ix=b.indexOf(m);if(ix>=0)b.splice(ix,1);S.p[1-i].st.kills++;ev(S,'death',{k:'m'+m.uid,id:m.id});}
    for(const [i,m] of dead){const d=CARDS[m.id];if(d.dr)d.dr(H(S,i,null));}
  }
  const a=S.p[0].hp<=0,b=S.p[1].hp<=0;
  if(!S.over&&(a||b)){S.over=true;S.winner=a&&b?-1:(a?1:0);ev(S,'over',{w:S.winner});}
}
function startTurn(S){
  const p=S.p[S.cur];
  p.maxMana=Math.min(10,p.maxMana+1);p.mana=p.maxMana;p.powerUsed=false;
  p.board.forEach(m=>{m.sleep=false;m.atkLeft=m.kw.windfury?2:1;});
  ev(S,'turn',{pi:S.cur});
  drawCard(S,S.cur);
  resolve(S);
}
function endTurn(S){
  if(S.over)return;
  const p=S.p[S.cur];
  p.board.forEach(m=>{if(m.tempAtk){m.atk-=m.tempAtk;m.tempAtk=0;}m.frozen=0;});
  S.cur=1-S.cur;S.turn++;
  startTurn(S);
}
function tgtList(S,pi,tt){
  const me=S.p[pi],op=S.p[1-pi],out=[];
  const addH=i=>out.push({s:i,u:'h'});
  const addM=(i,arr)=>arr.forEach(m=>{if(m.hp>0&&!m.destroyed)out.push({s:i,u:m.uid});});
  switch(tt){
    case 'any':addH(1-pi);addM(1-pi,op.board);addH(pi);addM(pi,me.board);break;
    case 'minion':addM(1-pi,op.board);addM(pi,me.board);break;
    case 'enemyMinion':addM(1-pi,op.board);break;
    case 'friendlyMinion':addM(pi,me.board);break;
    case 'enemyChar':addH(1-pi);addM(1-pi,op.board);break;

}
const sameT=(a,b)=>a&&b&&a.s===b.s&&a.u===b.u;
function getT(S,d){if(!d)return null;const p=S.p[d.s];return d.u==='h'?p:(p.board.find(m=>m.uid===d.u)||null);}
function canAttack(m){return m.atkLeft>0&&m.atk>0&&!m.frozen&&(!m.sleep||m.kw.charge||m.kw.rush);}
function atkTargets(S,pi,m){
  if(!canAttack(m))return[];
  const op=S.p[1-pi];
  const taunts=op.board.filter(x=>x.kw.taunt&&x.hp>0);
  const pool=taunts.length?taunts:op.board;
  const out=pool.filter(x=>x.hp>0).map(x=>({s:1-pi,u:x.uid}));
  if(!taunts.length&&(!m.sleep||m.kw.charge))out.push({s:1-pi,u:'h'});
  return out;
}
function doAttack(S,pi,uid,d){
  if(S.over||S.cur!==pi)return false;
  const m=S.p[pi].board.find(x=>x.uid===uid),t=getT(S,d);
  if(!m||!t)return false;
  if(!atkTargets(S,pi,m).some(x=>sameT(x,d)))return false;
  m.atkLeft--;
  const a=m.atk,b=isHero(t)?0:t.atk;
  ev(S,'attack',{from:'m'+uid,to:keyOf(S,t)});
  dealDmg(S,t,a,pi,m);
  if(!isHero(t)&&b>0)dealDmg(S,m,b,1-pi,t);
  resolve(S);return true;
}
function canPlay(S,pi,i){
  const p=S.p[pi],d=CARDS[p.hand[i]];
  if(!d||S.over||S.cur!==pi||d.cost>p.mana)return false;
  if(d.type==='m'&&p.board.length>=7)return false;
  if(d.type==='s'&&d.spT&&!tgtList(S,pi,d.spT).length)return false;
  return true;
}
function doPlay(S,pi,i,d){
  if(!canPlay(S,pi,i))return false;
  const p=S.p[pi],id=p.hand[i],c=CARDS[id];
  const tt=c.type==='m'?c.bcT:c.spT;let t=null;
  if(tt){const L=tgtList(S,pi,tt);if(d&&L.some(x=>sameT(x,d)))t=getT(S,d);else if(c.type==='s')return false;}
  p.mana-=c.cost;p.hand.splice(i,1);
  ev(S,'play',{pi,id});
  if(c.type==='m'){p.st.minions++;const m=summon(S,pi,id);if(m&&c.bc&&(!tt||t))c.bc(H(S,pi,m),t);}
  else{if(id!=='coin')p.st.spells++;c.sp(H(S,pi,null),t);
    p.board.slice().forEach(m=>{const dm=CARDS[m.id];if(dm.onSpell&&m.hp>0&&!m.destroyed)dm.onSpell(H(S,pi,m),m);});}
  resolve(S);return true;
}
function canPower(S,pi){
  const p=S.p[pi],P=POWERS[p.power];
  if(S.over||S.cur!==pi||p.powerUsed||p.mana<P.cost)return false;
  if(P.need&&!P.need(H(S,pi,null)))return false;
  if(P.tt&&!tgtList(S,pi,P.tt).length)return false;
  return true;
}
function doPower(S,pi,d){
  if(!canPower(S,pi))return false;
  const p=S.p[pi],P=POWERS[p.power];let t=null;
  if(P.tt){if(!d||!tgtList(S,pi,P.tt).some(x=>sameT(x,d)))return false;t=getT(S,d);}
  p.mana-=P.cost;p.powerUsed=true;ev(S,'power',{pi});
  P.fn(H(S,pi,null),t);resolve(S);return true;
}
function legalActions(S,pi){
  const acts=[],p=S.p[pi];if(S.over||S.cur!==pi)return acts;
  const seen={};
  p.hand.forEach((id,i)=>{
    if(seen[id])return;seen[id]=1;
    if(!canPlay(S,pi,i))return;const d=CARDS[id];
    const tt=d.type==='m'?d.bcT:d.spT;
    if(tt){const ts=tgtList(S,pi,tt);if(!ts.length)acts.push({k:'play',i});else ts.forEach(t=>acts.push({k:'play',i,t}));}
    else acts.push({k:'play',i});
  });
  if(canPower(S,pi)){const P=POWERS[p.power];if(P.tt)tgtList(S,pi,P.tt).forEach(t=>acts.push({k:'pow',t}));else acts.push({k:'pow'});}
  p.board.forEach(m=>atkTargets(S,pi,m).forEach(t=>acts.push({k:'atk',u:m.uid,t})));
  return acts;
}
function applyAction(S,pi,a){
  if(a.k==='play')return doPlay(S,pi,a.i,a.t);
  if(a.k==='atk')return doAttack(S,pi,a.u,a.t);
  if(a.k==='pow')return doPower(S,pi,a.t);

}
/* ---- AI ---- */
function cloneS(S){const ev0=S.ev;S.ev=[];const c=JSON.parse(JSON.stringify(S));S.ev=ev0;c.sim=true;return c;}
function mval(m,mine,myTurn){
  const d=CARDS[m.id];
  let atk=m.atk-m.tempAtk;
  if(m.tempAtk&&mine&&myTurn&&canAttack(m))atk+=m.tempAtk*.7;
  let v=1+atk+m.hp;
  if(m.kw.taunt)v+=1.5;
  if(m.kw.ward)v+=atk*.8+1;
  if(m.kw.venom)v+=2.5;
  if(m.kw.lifesteal)v+=atk*.5;
  if(m.kw.windfury)v+=atk*.7;
  if(d.dr)v+=1.5;
  if(d.onSpell)v+=1.5;
  if(m.frozen)v-=atk*.4;
  return v;
}
function heroV(h){return h<=0?-500:10*Math.sqrt(h);}
function score(S,pi){
  if(S.over){if(S.winner===pi)return 1e6;if(S.winner===1-pi)return -1e6;return 0;}
  const me=S.p[pi],op=S.p[1-pi];const myTurn=S.cur===pi;
  let s=heroV(me.hp+me.armor)-heroV(op.hp+op.armor);
  me.board.forEach(m=>s+=mval(m,true,myTurn));
  op.board.forEach(m=>s-=mval(m,false,myTurn)*1.1);
  s+=Math.min(me.hand.length,9)*2;
  const opAtk=op.board.reduce((a,m)=>a+(m.frozen?0:m.atk*(m.kw.windfury?2:1)),0);
  if(!me.board.some(m=>m.kw.taunt)&&opAtk>=me.hp+me.armor)s-=40;
  return s;
}
function aiChoose(S,pi,blunder){
  const acts=legalActions(S,pi);if(!acts.length)return null;
  const base=score(S,pi);let best=null,bv=0.05;const good=[];
  for(const a of acts){
    const c=cloneS(S);applyAction(c,pi,a);let v=score(c,pi)-base;
    const d=a.k==='play'?CARDS[S.p[pi].hand[a.i]]:null;
    if(d&&d.cost>=4)v+=0.3; // prefer spending mana on big plays
    if(v>bv){bv=v;best=a;}
    if(v>0.5)good.push(a);
  }
  if(best&&bv<1e5&&good.length&&Math.random()<blunder)return good[Math.floor(Math.random()*good.length)];
  return best;
}
/* ---- deck building ---- */
function collectible(){return Object.values(CARDS).filter(d=>!d.tok);}
function wpick(arr,w){let tot=0;const ws=arr.map(x=>{const v=Math.max(0,w(x));tot+=v;return v;});if(tot<=0)return null;let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function buildDeck(cls,avail,q){
  const pool=collectible().filter(d=>d.cls===cls||d.cls==='neutral');
  const w=d=>{let b=avail?({c:1,r:2.2,e:3,l:4}[d.r]):({c:1,r:.3+q*1.2,e:q*1.1,l:q*.7}[d.r]);if(d.cls===cls)b*=1.7;return b;};
  const maxC=d=>{let m=d.r==='l'?1:2;if(avail)m=Math.min(m,avail[d.id]||0);return m;};
  const cnt={},deck=[];
  const add=c=>{deck.push(c.id);cnt[c.id]=(cnt[c.id]||0)+1;};
  const bk=d=>Math.max(1,Math.min(7,d.cost));
  [[1,3],[2,4],[3,4],[4,3],[5,2],[6,2],[7,2]].forEach(([b,n])=>{for(let k=0;k<n;k++){const c=wpick(pool.filter(d=>bk(d)===b&&(cnt[d.id]||0)<maxC(d)),w);if(c)add(c);}});
  while(deck.length<20){const c=wpick(pool.filter(d=>(cnt[d.id]||0)<maxC(d)&&d.cost<=6),w)||wpick(pool.filter(d=>(cnt[d.id]||0)<maxC(d)),w);if(!c)break;add(c);}
  return deck;
}

function freshProfile(){

  return {gold:100,xp:0,lvl:1,coll,decks:{},packs:2,pity:0,rank:{r:0,s:0,streak:0,legend:0,best:0},quests:null,lastWin:'',bosses:{},stats:{games:0,wins:0,losses:0},muted:false,seenHelp:false,seenWelcome:false};
}
const normalize=o=>Object.assign(freshProfile(),o||{});
const AUTH={mode:null,avail:null,db:null,user:null,uid:null,name:'',nick:'',writing:false,dirty:false,last:'',noWrite:false,timer:null};
function save(){
  if(AUTH.mode==='claude'&&!AUTH.noWrite){lsSet(SKEY+'_c_'+AUTH.uid,P);clearTimeout(AUTH.timer);AUTH.timer=setTimeout(flushCloud,600);}
  else if(AUTH.mode==='claude'){lsSet(SKEY+'_c_'+AUTH.uid,P);}
  else lsSet(SKEY,P);
}
async function flushCloud(){
  if(AUTH.mode!=='claude'||AUTH.noWrite)return;
  if(AUTH.writing){AUTH.dirty=true;return;}
  const body=JSON.stringify(P);if(body===AUTH.last)return;
  AUTH.writing=true;
  for(let attempt=0;attempt<2;attempt++){
    try{await AUTH.db.doc('data/users/'+AUTH.uid+'/save').set({v:1,p:JSON.parse(body)});AUTH.last=body;break;}
    catch(e){const c=e&&e.code;
      if(c==='unavailable'&&attempt===0){await sleep(800+Math.random()*800);continue;}
      if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){AUTH.noWrite=true;toast(t('cloudNoWrite'));}
      break;}
  }
  AUTH.writing=false;
  if(AUTH.dirty){AUTH.dirty=false;flushCloud();}
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
async function initAuth(){
  try{
    let w=0;while(!(window.claude&&typeof window.claude.use==='function')&&w++<20)await sleep(100);
    if(!(window.claude&&typeof window.claude.use==='function'))throw 0;
    const [db,user]=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),11000);
    if(db&&user){const id=await user.id();if(id){AUTH.db=db;AUTH.user=user;AUTH.uid=id;try{const me=await user.me();AUTH.name=(me&&me.name)||'';}catch(e){}AUTH.avail=true;}}
  }catch(e){}
  if(AUTH.avail!==true)AUTH.avail=false;
  if($('#scr-login').classList.contains('on'))renderLogin();
  const last=lsGet(AKEY);
  if(last&&last.mode==='claude'&&AUTH.avail&&!AUTH.mode)loginClaude();
}
function displayName(){return AUTH.mode==='claude'?(AUTH.name||t('myAccount')):(AUTH.nick||'Guest');}
async function loginClaude(){
  if(!AUTH.avail)return;
  const btn=$('#lgClaude');if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin sm"></span> ${t('loading')}`;}
  try{
    const snap=await withTimeout(AUTH.db.doc('data/users/'+AUTH.uid+'/save').get(),10000);
    const d=snap.exists?snap.data():null;
    AUTH.mode='claude';AUTH.noWrite=false;lsSet(AKEY,{mode:'claude'});
    if(d&&d.p){P=normalize(JSON.parse(JSON.stringify(d.p)));AUTH.last=JSON.stringify(P);enterGame();}
    else{
      const local=lsGet(SKEY);
      if(local&&local.stats&&local.stats.games>0){
        P=freshProfile();
        modal(`<div class="modaltitle">☁️ ${t('account')}</div><p style="text-align:center;line-height:1.5">${t('importQ',{l:local.lvl,g:local.stats.games})}</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn gold" id="imYes">${t('importYes')}</button><button class="btn" id="imNo">${t('importNo')}</button></div>`);

        $('#imNo').onclick=()=>{P=freshProfile();closeModal();save();enterGame();};

}
function loginGuest(nick){

const muted=()=>P?P.muted:false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,d,type,v,f2,delay){const a=ac();if(!a||muted())return;const tt=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,tt);if(f2)o.frequency.exponentialRampToValueAtTime(f2,tt+d);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v||.1,tt+.012);g.gain.exponentialRampToValueAtTime(.0001,tt+d);o.connect(g);g.connect(a.destination);o.start(tt);o.stop(tt+d+.05);}
function noise(d,v,freq,delay){const a=ac();if(!a||muted())return;if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}const tt=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1000;f.Q.value=.9;const g=a.createGain();g.gain.setValueAtTime(v||.2,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(tt);s.stop(tt+d+.05);}

/* ---------- particles ---------- */
const FX={c:null,x:null,ps:[],run:false,ambient:false,dpr:1};
function fxInit(){FX.c=$('#fx');FX.x=FX.c.getContext('2d');fxResize();window.addEventListener('resize',fxResize);}
function fxResize(){FX.dpr=Math.min(2,window.devicePixelRatio||1);FX.c.width=innerWidth*FX.dpr;FX.c.height=innerHeight*FX.dpr;}
function burst(x,y,o){
  o=Object.assign({n:24,colors:['#ffb347'],speed:5,life:45,size:3.2,grav:.12,ring:false},o||{});
  for(let i=0;i<o.n;i++){const a=Math.random()*Math.PI*2,sp=o.ring?o.speed:o.speed*(.3+Math.random()*.9);
    FX.ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),life:o.life*(.6+Math.random()*.6),max:o.life,size:o.size*(.5+Math.random()),c:rnd(o.colors),g:o.grav});}
  fxStart();
}
function fxStart(){if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){
  const x=FX.x,d=FX.dpr;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,FX.c.width,FX.c.height);x.setTransform(d,0,0,d,0,0);
  if(FX.ambient&&Math.random()<.35)FX.ps.push({x:Math.random()*innerWidth,y:innerHeight+5,vx:(Math.random()-.5)*.4,vy:-(.6+Math.random()*1.3),life:260,max:260,size:1+Math.random()*2.2,c:rnd(['#ffb347','#ff7a3c','#ffd98a','#c9a0ff']),g:-.002,amb:1});
  x.globalCompositeOperation='lighter';
  for(let i=FX.ps.length-1;i>=0;i--){const p=FX.ps[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;if(!p.amb){p.vx*=.965;p.vy*=.975;}p.life--;
    if(p.life<=0){FX.ps.splice(i,1);continue;}
    const al=Math.min(1,p.life/p.max*1.6)*(p.amb?.55:1);x.globalAlpha=al;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.size,0,6.283);x.fill();
    if(!p.amb&&p.size>2){x.globalAlpha=al*.25;x.beginPath();x.arc(p.x,p.y,p.size*3,0,6.283);x.fill();}}
  x.globalAlpha=1;
  if(FX.ps.length||FX.ambient)requestAnimationFrame(fxLoop);else{FX.run=false;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,FX.c.width,FX.c.height);}
}
function center(r){return [r.left+r.width/2,r.top+r.height/2];}
function floatText(x,y,txt,cls){const e=document.createElement('div');e.className='float '+cls;e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1150);}
function shake(big){const a=$('#app');a.classList.remove('shake','shake2');void a.offsetWidth;a.classList.add(big?'shake2':'shake');}
function flash(color){const e=document.createElement('div');e.className='flash';e.style.background=color;document.body.appendChild(e);setTimeout(()=>e.remove(),720);}
function toast(s){const e=document.createElement('div');e.className='toast';e.innerHTML=s;document.body.appendChild(e);setTimeout(()=>e.remove(),2300);}

function fmtText(d){
  const ko=LANG==='ko';const parts=[];
  const txt=ko?(CARD_KO[d.id]||''):(d.text||'');
  if(d.kw&&d.kw.length)parts.push(d.kw.map(kwName).join(', ')+(txt?'.':''));
  if(txt)parts.push(txt);
  let s=esc(parts.join(' '));
  const re=ko?/(전투의 함성:|최후의 숨결:|빙결|도발|돌진|속공|보호막|생명력 흡수|맹독|질풍)/g:/(Battlecry:|Last Breath:|Freeze|Taunt|Charge|Rush|Ward|Lifesteal|Venom|Windfury)/g;
  return s.replace(re,'<b>$1</b>');
}
function cardHTML(id,extra,attrs){
  const d=CARDS[id];const ft=fmtText(d);const long=ft.replace(/<[^>]+>/g,'').length>(LANG==='ko'?44:70);
  return `<div class="card c-${d.cls} r-${d.r} ${d.type==='s'?'spell':''} ${extra||''}" data-cid="${id}" ${attrs||''}><div class="cframe"><div class="art"><span>${d.art}</span></div><div class="cname"><b>${esc(d.name)}</b></div>${ft?`<div class="ctext"><div class="${long?'long':''}">${ft}</div></div>`:`<div class="ctext blank"><div>${d.tok?t('token'):''}</div></div>`}</div><div class="rgem"></div><div class="gem cost">${d.cost}</div>${d.type==='m'?`<div class="gem atk">${d.atk}</div><div class="gem hp">${d.hp}</div>`:''}</div>`;
}
function kwHelp(d,m){
  const ks=new Set((d.kw||[]));if(m)Object.keys(m.kw).forEach(k=>m.kw[k]&&ks.add(k));
  const out=[];ks.forEach(k=>out.push(`<b>${kwName(k)}</b>: ${kwDesc(k)}`));
  const lb=KWLBL[LANG];const raw=d.text||'';
  if(d.bc)out.push(`<b>${lb.battlecry}</b>: ${kwDesc('battlecry')}`);
  if(d.dr)out.push(`<b>${lb.lastbreath}</b>: ${kwDesc('lastbreath')}`);
  if(/Freeze/.test(raw)||(m&&m.frozen))out.push(`<b>${lb.freeze}</b>: ${kwDesc('freeze')}`);
  return out.length?`<div class="kwbox">${out.join('<br>')}</div>`:'';
}

function refreshQuests(){
  const d=today();
  if(P.quests&&P.quests.date===d)return;
  let seed=0;for(const ch of d)seed=(seed*31+ch.charCodeAt(0))%100000;
  const pool=QDEFS.slice();const list=[];
  while(list.length<3){seed=(seed*9301+49297)%233280;const i=Math.floor(seed/233280*pool.length);const q=Object.assign({},pool.splice(i,1)[0]);
    if(q.t==='winCls'){const opts=PCLS.filter(unlocked);q.cls=opts[seed%opts.length];}
    q.prog=0;q.done=false;q.claimed=false;list.push(q);}
  P.quests={date:d,list};save();
}

/* ---------- decks ---------- */
function deckValid(cls){
  const d=P.decks[cls];if(!d||d.length!==20)return false;
  const cnt={};for(const id of d){cnt[id]=(cnt[id]||0)+1;const c=CARDS[id];if(!c||c.tok||(c.cls!==cls&&c.cls!=='neutral'))return false;if(cnt[id]>(P.coll[id]||0)||cnt[id]>(c.r==='l'?1:2))return false;}
  return true;
}
function getDeck(cls){
  if(!deckValid(cls)){
    const cur=P.decks[cls]||[],keep=[],cnt={};
    for(const id of cur){const c=CARDS[id];if(!c||c.tok||(c.cls!==cls&&c.cls!=='neutral'))continue;const n=(cnt[id]||0)+1;if(n>(P.coll[id]||0)||n>(c.r==='l'?1:2))continue;if(keep.length>=20)break;cnt[id]=n;keep.push(id);}
    let guard=0;while(keep.length<20&&guard++<10){for(const id of buildDeck(cls,P.coll,0)){if(keep.length>=20)break;const c=CARDS[id];const n=(cnt[id]||0)+1;if(n>(P.coll[id]||0)||n>(c.r==='l'?1:2))continue;cnt[id]=n;keep.push(id);}}
    P.decks[cls]=keep;save();
  }
  return P.decks[cls].slice();
}

async function runFx(old,spellCard){
  const evs=S.ev;S.ev=[];

        sfx(e.n>=5?'bighit':'hit');

      case 'freeze':if(c){burst(c[0],c[1],{n:30,colors:['#bfefff','#5cc8ff','#fff'],speed:3.5,grav:.02});}sfx('freeze');break;
      case 'death':deaths++;if(c){const cc=c;setTimeout(()=>{burst(cc[0],cc[1],{n:46,colors:['#9a8a7a','#5a4a3a','#ff7a3c','#d0c0a0'],speed:6,size:3.6,life:50});},120+deaths*60);}setTimeout(()=>sfx('death'),120);break;
      case 'summon':if(c){burst(c[0],c[1]+r.height*.4,{n:18,colors:['#d8c8a8','#fff'],speed:3,grav:.02,life:28});}if(!evs.some(x=>x.type==='play'))sfx('summon');break;
      case 'buff':if(c)burst(c[0],c[1],{n:16,colors:['#7dff8a','#fff8a0'],speed:2.4,grav:-.05});break;

function genPack(){
  const pool=collectible();const out=[];let hasRare=false,hasLeg=false;
  for(let i=0;i<5;i++){let x=Math.random(),r=x<.015?'l':x<.08?'e':x<.30?'r':'c';
    if(i===4&&!hasRare&&r==='c')r='r';
    if(i===4&&!hasLeg&&P.pity>=9)r='l';
    if(r!=='c')hasRare=true;if(r==='l')hasLeg=true;
    const notMax=rr=>pool.filter(c=>c.r===rr&&(P.coll[c.id]||0)<(rr==='l'?1:2)&&!out.some(o=>o.id===c.id&&rr==='l'));
    let cand=notMax(r);
    if(!cand.length&&r==='c'){r='r';hasRare=true;cand=notMax(r);}
    if(!cand.length)cand=pool.filter(c=>c.r===r);
    const d=rnd(cand);
    const have=P.coll[d.id]||0,max=r==='l'?1:2;
    const o={id:d.id,isNew:have===0,extra:0};
    if(have>=max){o.extra={c:5,r:20,e:50,l:150}[r];P.gold+=o.extra;}else P.coll[d.id]=have+1;
    out.push(o);}
  P.pity=hasLeg?0:P.pity+1;
  return out;
}
async function openPack(){
  if(!P.packs||busy)return;busy=true;P.packs--;const cards=genPack();save();
  const pk=$('#packEl');pk.classList.add('open');sfx('pack');
  await sleep(650);const [x,y]=center(pk.getBoundingClientRect());burst(x,y,{n:90,colors:['#c79bff','#ffd54a','#fff'],speed:9,life:55});flash('rgba(200,160,255,.5)');
  const rv=$('#reveal');
  rv.innerHTML=`<div class="modaltitle" style="margin:0">${t('tapReveal')}</div><div class="revrow">${cards.map((c,i)=>`<div class="flip r-${CARDS[c.id].r}" data-f="${i}" style="--d:${i}"><div class="fi"><div class="face back"><div class="cardback"></div></div><div class="face front">${cardHTML(c.id)}</div></div>${c.isNew?`<div class="newtag">${t('newTag')}</div>`:''}${c.extra?`<div class="extratag">${t('extraTag',{g:c.extra})}</div>`:''}</div>`).join('')}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="revAll">${t('revealAll')}</button><button class="btn gold hidden" id="revDone">${t('cont')}</button><button class="btn gold hidden" id="revNext">${t('openNext')}</button></div>`;
  rv.classList.add('on');busy=false;
  let flipped=0;
  const flipOne=el=>{if(el.classList.contains('flipped'))return false;el.classList.add('flipped');flipped++;const c=cards[+el.dataset.f],r=CARDS[c.id].r;
    const [fx,fy]=center(el.getBoundingClientRect());
    if(r==='c'){sfx('flip');burst(fx,fy,{n:14,colors:['#fff','#ddd'],speed:3});}
    else if(r==='r'){sfx('rare');burst(fx,fy,{n:40,colors:['#3d9bff','#bfe0ff','#fff'],speed:5});}
    else if(r==='e'){sfx('epic');burst(fx,fy,{n:70,colors:['#c04dff','#e9b3ff','#fff'],speed:6.5});shake();}
    else{sfx('legend');flash('rgba(255,190,60,.75)');shake(true);for(let k=0;k<4;k++)setTimeout(()=>burst(fx,fy,{n:80,colors:['#ffa41b','#ffe08a','#fff','#ff6b2a'],speed:9,life:70}),k*160);const b=$('#banner');b.className='';void b.offsetWidth;b.textContent='LEGENDARY!';b.className='on mine';}
    if(flipped===5){$('#revAll').classList.add('hidden');$('#revDone').classList.remove('hidden');if(P.packs)$('#revNext').classList.remove('hidden');}
    return true;};
  rv.querySelectorAll('.flip').forEach(el=>el.onclick=()=>{if(!flipOne(el)&&TOUCH){openInfo(cardBig(cards[+el.dataset.f].id),null);}});
  $('#revAll').onclick=async()=>{for(const el of rv.querySelectorAll('.flip:not(.flipped)')){flipOne(el);await sleep(260);}};
  $('#revDone').onclick=()=>{rv.classList.remove('on');renderShop();};
  $('#revNext').onclick=()=>{rv.classList.remove('on');renderShop();setTimeout(openPack,120);};
}

/* ---------- collection & deck builder ---------- */
let DB={cls:'arcanist'};
function renderColl(){
  show('scr-coll');
  const cls=DB.cls;if(!P.decks[cls])getDeck(cls);const deck=P.decks[cls];
  const all=collectible();const ownedU=all.filter(d=>P.coll[d.id]).length;
  const pool=all.filter(d=>d.cls===cls||d.cls==='neutral').sort((a,b)=>(a.cls===cls?0:1)-(b.cls===cls?0:1)||a.cost-b.cost||a.name.localeCompare(b.name));
  const inD={};deck.forEach(id=>inD[id]=(inD[id]||0)+1);
  const curve=[0,0,0,0,0,0,0,0];deck.forEach(id=>curve[Math.min(7,CARDS[id].cost)]++);const cm=Math.max(1,...curve);
  const rows=Object.keys(inD).sort((a,b)=>CARDS[a].cost-CARDS[b].cost||CARDS[a].name.localeCompare(CARDS[b].name)).map(id=>{const d=CARDS[id];return `<div class="drow c-${d.cls} r-${d.r}" data-rm="${id}"><span class="dc">${d.cost}</span><span>${d.art}</span><span class="dn">${esc(d.name)}</span><span>${inD[id]>1?'×'+inD[id]:d.r==='l'?'♛':''}</span></div>`;}).join('');
  $('#scr-coll').innerHTML=topbar(true)+`<div class="ctabs">${PCLS.map(c=>`<div class="ctab c-${c} ${c===cls?'on':''}" data-tab="${c}">${CLS[c].hero} ${clsName(c)}${unlocked(c)?'':' 🔒'}</div>`).join('')}<div class="spacer"></div><div style="font-size:12px;opacity:.8;align-self:center">${t('collection')}: <b>${ownedU}/${all.length}</b> (${Math.round(ownedU/all.length*100)}%)</div></div>
  <div class="cwrap"><div class="pool">${pool.map(d=>{const o=P.coll[d.id]||0,n=inD[d.id]||0;return `<div class="pc ${o?'':'unowned'}" data-add="${d.id}">${cardHTML(d.id)}${n?`<div class="indeck">${n}</div>`:''}<div class="own">${o?t('owned',{n:o}):t('findPacks')}</div></div>`;}).join('')}</div>
  <div class="dpanel panel"><h3 style="margin:0">${t('deckTitle',{c:clsName(cls)})} — <span style="color:${deck.length===20?'#7dff8a':'#ff8a8a'}">${deck.length}/20</span></h3>
  <div class="curve">${curve.map((v,i)=>`<div style="height:${v/cm*100}%"><span>${i===7?'7+':i}</span></div>`).join('')}</div><div class="curvesp" style="height:12px"></div>
  <div class="dlist">${rows||`<div style="opacity:.6;font-size:13px;padding:10px">${t('tapToAdd')}</div>`}</div>
  <div style="display:flex;gap:6px"><button class="btn small" id="dAuto" style="flex:1">${t('auto')}</button><button class="btn small" id="dClear" style="flex:1">${t('clear')}</button></div>
  ${deck.length<20?`<div style="font-size:11px;color:#ffb38a">${t('autoFillWarn')}</div>`:''}<div class="dhelp" style="font-size:11px;opacity:.6">${t('deckHelp')}</div></div></div>`;
  $$('[data-tab]').forEach(x=>x.onclick=()=>{DB.cls=x.dataset.tab;sfx('click');renderColl();});
  $$('[data-add]').forEach(el=>el.onclick=()=>{const id=el.dataset.add,d=CARDS[id],o=P.coll[id]||0,n=inD[id]||0;
    if(!o){sfx('error');toast(t('notOwned'));return;}
    if(deck.length>=20){sfx('error');toast(t('deckFull'));return;}
    if(n>=o||n>=(d.r==='l'?1:2)){sfx('error');toast(n>=(d.r==='l'?1:2)?t('copyLimit'):t('noCopy'));return;}
    deck.push(id);save();sfx('play');const sc=$('.pool').scrollTop;renderColl();$('.pool').scrollTop=sc;});
  $$('[data-rm]').forEach(el=>el.onclick=()=>{const i=deck.indexOf(el.dataset.rm);if(i>=0)deck.splice(i,1);save();sfx('click');const sc=$('.pool').scrollTop;renderColl();$('.pool').scrollTop=sc;});
  $('#dAuto').onclick=()=>{P.decks[cls]=buildDeck(cls,P.coll,0);save();sfx('spell');renderColl();};
  $('#dClear').onclick=()=>{P.decks[cls]=[];save();sfx('click');renderColl();};
}

/* ---------- layout mode ---------- */
function applyLayout(){
  const compact=innerWidth<720||innerHeight<620;
  document.body.classList.toggle('compact',compact);
  document.body.classList.toggle('landscape',compact&&innerWidth>innerHeight);
}

/* ---------- boot ---------- */
setLang(LANG);applyLayout();fxInit();
window.addEventListener('resize',()=>{applyLayout();if(S&&$('#scr-match').classList.contains('on'))render();});
FX.ambient=true;fxStart();
(function boot(){
  const last=lsGet(AKEY)||{};
  AUTH.nick=last.nick||'';
  if(last.mode==='guest'){loginGuest(last.nick);}
  else{show('scr-login');renderLogin();}
  initAuth();
})();
/* Offline install (GitHub Pages / https only; skipped inside another page's frame such as claude.ai) */
(function registerSW(){
  try{
    let embedded=true;try{embedded=window.self!==window.top;}catch(e){}
    const ok=!embedded&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
    if(ok)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
})();
