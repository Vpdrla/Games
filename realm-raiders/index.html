  const ai = u.ai, B = u.boss;
  u.mx = u.my = 0;
  if (ai.shieldT > 0) { ai.shieldT -= dt; if (ai.shieldT <= 0) ai.shielded = false; }
  if (ai.phase === 1 && u.hp < u.maxHp * 0.5) {
    ai.phase = 2;
    u.spd = B.spd * 1.25;
    ai.cd = 1.2;
    ai.shielded = true;
    ai.shieldT = 1.5;
    w.emit('banner', B.name.toUpperCase() + ' IS ENRAGED!', '', '#ff4f6d');
    w.emit('shake', 12);
    w.emit('sfx', 'roar');
  }
  // contact damage
  for (const h of w.foesIn(u.team, u.x, u.y, 6)) {
    if ((u.contactT[h.id] || 0) < w.t) { u.contactT[h.id] = w.t + 0.8; w.hit(u, h, B.dmg * 0.5, { kind: 'mob', knock: 200 }); }
  }
  if (w.cantAct(u) || u.dash) return;
  const t = mobPickTarget(w, u, dt);
  if (!t) return;
  ai.busy = Math.max(0, (ai.busy || 0) - dt);
  if (ai.busy > 0) return;
  ai.cd -= dt;
  const dd = dist(u.x, u.y, t.x, t.y);
  u.ang = angTo(u.x, u.y, t.x, t.y);
  if (dd > 210) mobSteer(w, u, t.x, t.y, 1); else if (dd < 140) mobSteer(w, u, t.x, t.y, -1, 0.5);
  if (ai.cd <= 0) {
    const list = ai.phase === 2 ? B.p2 : B.moves;
    let m;
    for (let k = 0; k < 4; k++) { m = list[Math.floor(w.rand() * list.length)]; if (m !== ai.last) break; }
    ai.last = m;
    const dur = BOSS_MOVES[m](w, u, t, ai.phase === 2);
    ai.busy = dur * 0.75;
    ai.cd = (ai.phase === 2 ? 0.7 : 1.2) + w.rand() * 0.6;
    u.anim = 1;
  }
}

// ===== 06-bots.js =====
// ---------- Hero bots ----------
// A bot drives a hero through the same input a player uses (move, skill, ultimate, dash). It reacts
// to telegraphs and shots after a human-like delay, revives fallen allies, kites or dives depending
// on its hero, and spends its powers when they are worth it. skill: 0 easy, 1 normal, 2 hard.

const BOT_SKILL = [
  { react: 0.42, dodge: 0.45, think: 0.2, use: 0.6 },
  { react: 0.27, dodge: 0.78, think: 0.12, use: 0.9 },
  { react: 0.17, dodge: 0.95, think: 0.08, use: 1 },
];

class HeroBot {
  constructor(skill, seed) {
    this.k = BOT_SKILL[clamp(skill == null ? 1 : skill, 0, 2)];
    this.rng = new RNG(seed || 7);
    this.t = 0;
    this.mx = 0; this.my = 0;
    this.seen = new Map();
    this.strafe = this.rng.next() < 0.5 ? 1 : -1;
    this.tgt = null;
    this.wantSkill = 0;
    this.wantUlt = 0;
  }

  think(w, u, dt) {
    const inp = u.input;
    inp.skill = inp.ult = inp.dash = false;
    inp.aim = null;
    if (u.ko) { inp.mx = inp.my = 0; return; }
    if (u.downed) {
      const al = this.nearestAlly(w, u, 900);
      if (al) { const a = angTo(u.x, u.y, al.x, al.y); inp.mx = Math.cos(a); inp.my = Math.sin(a); } else inp.mx = inp.my = 0;
      return;
    }
    this.t -= dt;
    if (this.t <= 0) { this.t = this.k.think * (0.7 + this.rng.next() * 0.6); this.decide(w, u); }
    let mx = this.mx, my = this.my;
    const dg = this.danger(w, u, dt);
    if (dg) {
      mx = dg.x; my = dg.y;
      if (dg.urgent && u.cd.dash <= 0 && this.rng.next() < this.k.dodge * 0.5) {
        inp.dash = true;
        inp.mx = mx; inp.my = my;
      }
    }
    const k = Math.min(1, dt * 14);
    inp.mx = lerp(inp.mx, mx, k);
    inp.my = lerp(inp.my, my, k);
    if (this.wantSkill > 0) { this.wantSkill -= dt; if (this.wantSkill <= 0) { inp.skill = true; inp.aim = this.skillAim; } }
    if (this.wantUlt > 0) { this.wantUlt -= dt; if (this.wantUlt <= 0) { inp.ult = true; inp.aim = this.ultAim; } }
  }

  nearestAlly(w, u, r) {
    let best = null, bd = r * r;
    for (const o of w.units) if (o !== u && o.kind === 'hero' && o.team === u.team && alive(o)) { const d = dist2(o.x, o.y, u.x, u.y); if (d < bd) { bd = d; best = o; } }
    return best;
  }

  // Returns an escape direction when the bot stands in (or in the path of) something dangerous.
  danger(w, u, dt) {
    let best = null, urgency = 9;
    for (const a of w.areas) {
      if (a.team === u.team || a.friendly || a.hidden) continue;
      if (!a.tele && !a.hostile) continue;
      const left = a.tele && !a.fired ? a.delay - a.t : 0;
      if (a.tele && a.fired && !a.beam && !a.hostile) continue;
      const m = { x: u.x, y: u.y, r: u.r + 14 };
      if (!w.inArea(a, m)) { this.seen.delete(a.id); continue; }
      if (!this.seen.has(a.id)) this.seen.set(a.id, w.t);
      if (w.t - this.seen.get(a.id) < this.k.react) continue;
      let ex, ey;
      if (a.shape === 'circle') {
        let ang = angTo(a.x, a.y, u.x, u.y);
        if (dist2(a.x, a.y, u.x, u.y) < 16) ang = this.rng.next() * TAU;
        ex = Math.cos(ang); ey = Math.sin(ang);
      } else if (a.shape === 'line' || a.shape === 'cone') {
        const n = a.ang + Math.PI / 2;
        const side = Math.cos(n) * (u.x - a.x) + Math.sin(n) * (u.y - a.y) >= 0 ? 1 : -1;
        ex = Math.cos(n) * side; ey = Math.sin(n) * side;
        if (a.shape === 'cone') { const aw = angTo(a.x, a.y, u.x, u.y); ex = ex * 0.7 + Math.cos(aw) * 0.3; ey = ey * 0.7 + Math.sin(aw) * 0.3; }
      } else { ex = 0; ey = 0; }
      const urg = left;
      if (urg < urgency) { urgency = urg; best = { x: ex, y: ey, urgent: urg < 0.32 }; }
    }
    // incoming shots
    for (const p of w.projs) {
      if (p.team === u.team || p.lob || !p.dmg) continue;
      const rx = u.x - p.x, ry = u.y - p.y;
      if (rx * rx + ry * ry > 230 * 230) continue;
      const v2 = p.vx * p.vx + p.vy * p.vy;
      if (v2 < 1) continue;
      const tc = (rx * p.vx + ry * p.vy) / v2;
      if (tc < 0 || tc > 0.65) continue;
      const cx = p.x + p.vx * tc - u.x, cy = p.y + p.vy * tc - u.y;
      if (cx * cx + cy * cy > (u.r + p.r + 8) * (u.r + p.r + 8)) continue;
      if (this.rng.next() > this.k.dodge * 0.35) continue;
      const n = Math.atan2(p.vy, p.vx) + Math.PI / 2;
      const side = Math.cos(n) * rx + Math.sin(n) * ry >= 0 ? 1 : -1;
      if (tc < urgency) { urgency = tc; best = { x: Math.cos(n) * side, y: Math.sin(n) * side, urgent: tc < 0.2 }; }
    }
    if (best) {
      // stay inside the room
      const b = w.bounds(u.r + 30);
      if (u.x < b.x0 && best.x < 0) best.x = 0.6;
      if (u.x > b.x1 && best.x > 0) best.x = -0.6;
      if (u.y < b.y0 && best.y < 0) best.y = 0.6;
      if (u.y > b.y1 && best.y > 0) best.y = -0.6;
    }
    return best;
  }

  decide(w, u) {
    const h = u.hero, hint = AI_HINT[h.id], kit = u.kit;
    const melee = h.basic.kind === 'melee' || h.basic.kind === 'thrust';
    const hpr = u.hp / u.maxHp;
    let foes = [], near150 = 0, near300 = 0, boss = null;
    for (const o of w.units) {
      if (o.team === u.team || !alive(o) || o.untargetable) continue;
      const d = dist(u.x, u.y, o.x, o.y);
      if (d > 900) continue;
      foes.push({ o, d });
      if (d < 150 + o.r) near150++;
      if (d < 300 + o.r) near300++;
      if (o.kind === 'boss') boss = o;
    }
    foes.sort((a, b) => a.d - b.d);
    const allies = w.units.filter((o) => o.kind === 'hero' && o.team === u.team && o !== u);
    // 1) revive fallen allies
    const down = allies.filter((o) => o.downed && !o.deadOut && !(o.autoRev > 0)).sort((a, b) => dist2(a.x, a.y, u.x, u.y) - dist2(b.x, b.y, u.x, u.y))[0];
    let goal = null;
    if (down && !w.arena) {
      let threat = 0;
      for (const f of foes) if (dist(f.o.x, f.o.y, down.x, down.y) < 170) threat++;
      if (threat <= 2 || hpr > 0.55 || h.role === 'Tank' || h.role === 'Healer') goal = { x: down.x, y: down.y, stop: 20 };
    }
    // 2) pick a target
    let tgt = this.tgt && alive(this.tgt) && dist(u.x, u.y, this.tgt.x, this.tgt.y) < 620 ? this.tgt : null;
    if (!tgt || this.rng.next() < 0.08) {
      let best = null, bs = 1e9;
      for (const f of foes) {
        let s = f.d;
        if (f.o.kind === 'boss') s -= 120;
        if (f.o.elite) s -= 40;
        if (f.o.kind === 'hero') s -= (1 - f.o.hp / f.o.maxHp) * 160;
        if (f.o.kind === 'summon') s += 150;
        if (s < bs) { bs = s; best = f.o; }
      }
      tgt = best;
    }
    this.tgt = tgt;
    if (tgt) u.target = tgt;
    // 3) movement
    let mx = 0, my = 0;
    const retreat = hpr < 0.3 && near300 > 0 && !w.arena || (w.arena && hpr < 0.25 && near300 > 1);
    if (goal) {
      const d = dist(u.x, u.y, goal.x, goal.y);
      if (d > goal.stop) { const a = angTo(u.x, u.y, goal.x, goal.y); mx = Math.cos(a); my = Math.sin(a); }
    } else if (retreat) {
      let cx = 0, cy = 0;
      for (const f of foes) if (f.d < 320) { cx += f.o.x - u.x; cy += f.o.y - u.y; }
      const a = Math.atan2(-cy, -cx);
      mx = Math.cos(a); my = Math.sin(a);
      const healer = allies.find((o) => alive(o) && (o.hero.role === 'Healer'));
      if (healer) { const b = angTo(u.x, u.y, healer.x, healer.y); mx = (mx + Math.cos(b)) / 2; my = (my + Math.sin(b)) / 2; }
    } else if (tgt) {
      const d = dist(u.x, u.y, tgt.x, tgt.y);
      const want = melee ? tgt.r + u.r + h.basic.range * 0.45 : Math.min(h.basic.range * 0.72, 330);
      const a = angTo(u.x, u.y, tgt.x, tgt.y);
      if (this.rng.next() < 0.05) this.strafe = -this.strafe;
      if (d > want + 30) { mx = Math.cos(a); my = Math.sin(a); }
      else if (d < want - 50 && !melee) { mx = -Math.cos(a); my = -Math.sin(a); }
      else { const s = a + Math.PI / 2 * this.strafe; mx = Math.cos(s) * 0.6; my = Math.sin(s) * 0.6; }
      // ranged heroes back off from anything in their face
      if (!melee && foes.length && foes[0].d < 110 + foes[0].o.r) {
        const f = foes[0].o, b = angTo(f.x, f.y, u.x, u.y);
        mx = mx * 0.3 + Math.cos(b); my = my * 0.3 + Math.sin(b);
      }
    } else {
      const g = w.mode && w.mode.botGoal ? w.mode.botGoal(u) : null;
      if (g) {
        const d = dist(u.x, u.y, g.x, g.y);
        if (d > (g.stop || 30)) { const a = angTo(u.x, u.y, g.x, g.y); mx = Math.cos(a); my = Math.sin(a); }
      }
    }
    // avoid hugging walls
    const b = w.bounds(u.r + 40);
    if (u.x < b.x0) mx += 0.5; if (u.x > b.x1) mx -= 0.5; if (u.y < b.y0) my += 0.5; if (u.y > b.y1) my -= 0.5;
    this.mx = mx; this.my = my;

    // 4) powers
    if (this.wantSkill <= 0 && u.cd.skill <= 0 && !u.channel && this.rng.next() < this.k.use) {
      if (this.shouldSkill(w, u, hint.skill, kit.sr, tgt, foes, allies, hpr, near150, boss)) { this.wantSkill = this.k.react * 0.6; }
    }
    if (this.wantUlt <= 0 && u.ult >= 100 && !u.channel && this.rng.next() < this.k.use) {
      if (this.shouldUlt(w, u, hint.ult, kit.ur, tgt, foes, allies, hpr, boss)) { this.wantUlt = this.k.react * 0.6; this.ultAim = null; }
    }
  }

  shouldSkill(w, u, kind, range, tgt, foes, allies, hpr, near150, boss) {
    const inR = (r) => foes.filter((f) => f.d < r + f.o.r).length;
    const td = tgt ? dist(u.x, u.y, tgt.x, tgt.y) : 1e9;
    this.skillAim = null;
    switch (kind) {
      case 'engage':
        if (u.hero.id === 'volt' && hpr < 0.35 && foes.length && foes[0].d < 160) { this.skillAim = angTo(foes[0].o.x, foes[0].o.y, u.x, u.y); return true; }
        return tgt && td < range && td > 70 && hpr > 0.3;
      case 'cone': return tgt && td < range && (inR(range) >= 2 || tgt.kind === 'boss' || tgt.elite || tgt.kind === 'hero');
      case 'target': return tgt && td < range * 1.05 && (inR(range) >= 2 || tgt.kind === 'boss' || tgt.elite || tgt.kind === 'hero' || tgt.heavy);
      case 'heal': return allies.concat([u]).some((a) => alive(a) && a.hp / a.maxHp < 0.65 && dist(a.x, a.y, u.x, u.y) < 420);
      case 'nova': return inR(range) >= 2 || (tgt && td < range && (tgt.kind === 'boss' || tgt.elite || tgt.kind === 'hero'));
      case 'summon': return foes.some((f) => f.d < 520);
      case 'buff': return inR(450) >= 2 || !!boss;
      case 'shield': return allies.concat([u]).some((a) => alive(a) && a.hp / a.maxHp < 0.7 && dist(a.x, a.y, u.x, u.y) < 280) || near150 >= 4;
      case 'escape': return hpr < 0.45 && u.hist.length > 6 && u.hist[0].hp > u.hp * 1.3;
      case 'leap': return tgt && td < range && td > 90;
    }
    return false;
  }

  shouldUlt(w, u, kind, range, tgt, foes, allies, hpr, boss) {
    const inR = (r) => foes.filter((f) => f.d < r + f.o.r).length;
    const bossIn = (r) => boss && dist(u.x, u.y, boss.x, boss.y) < r + boss.r;
    switch (kind) {
      case 'aoe': return inR(range) >= 4 || bossIn(range) || (tgt && tgt.elite && inR(range) >= 2) || (w.arena && inR(range) >= 1);
      case 'tank': return inR(300) >= 4 || bossIn(300) || (w.arena && inR(250) >= 1);
      case 'revive': return allies.some((a) => a.downed) || allies.filter((a) => alive(a) && a.hp / a.maxHp < 0.45).length >= 2 || hpr < 0.3 || (w.arena && hpr < 0.4);
      case 'melee': return inR(150) >= 3 || bossIn(150) || (w.arena && inR(150) >= 1);
      case 'buff': return inR(320) >= 3 || bossIn(400) || (w.arena && inR(300) >= 1);
      case 'poison': return foes.filter((f) => f.d < 650 && f.o.st.poison > 0).length >= 4 || (boss && boss.st.poisonN >= 6) || (w.arena && foes.some((f) => f.d < 600 && f.o.st.poisonN >= 4));
    }
    return false;
  }
}

// ===== 07-modes.js =====
// ---------- Modes: Adventure runs, the endless Abyss, and the hero Arena ----------

function makeRoom(rng, pal, type, W, H, realm) {
  const room = { w: W, h: H, obst: [], pal, type, deco: [], seed: rng.int(1, 1e9), realm };
  const n = type === 'boss' ? rng.int(2, 4) : type === 'calm' ? rng.int(2, 3) : rng.int(4, 8);
  const keepOut = [{ x: W / 2, y: H - 150, r: 220 }, { x: W / 2, y: 150, r: 190 }];
  if (type === 'boss') keepOut.push({ x: W / 2, y: H / 2, r: 330 });
  for (let i = 0, tries = 0; i < n && tries < 200; tries++) {
    const r = rng.range(26, 46);
    const x = rng.range(150, W - 150), y = rng.range(150, H - 160);
    if (keepOut.some((k) => dist(k.x, k.y, x, y) < k.r + r)) continue;
    if (room.obst.some((o) => dist(o.x, o.y, x, y) < o.r + r + 110)) continue;
    room.obst.push({ x, y, r, k: rng.int(0, 3) });
    i++;
  }
  for (let i = 0; i < 46; i++) room.deco.push({ x: rng.range(40, W - 40), y: rng.range(40, H - 40), k: rng.int(0, 5), s: rng.range(0.6, 1.4) });
  return room;
}

function makeArenaRoom(rng) {
  const W = ARENA_W, H = ARENA_H;
  const room = { w: W, h: H, obst: [], pal: ARENA_PAL, type: 'arena', deco: [], seed: rng.int(1, 1e9) };
  const half = [[W * 0.3, H * 0.28, 40], [W * 0.3, H * 0.72, 40], [W * 0.42, H * 0.5, 30], [W * 0.2, H * 0.5, 34]];
  for (const [x, y, r] of half) { room.obst.push({ x, y, r, k: 0 }); room.obst.push({ x: W - x, y, r, k: 0 }); }
  room.obst.push({ x: W / 2, y: H * 0.2, r: 34, k: 1 }, { x: W / 2, y: H * 0.8, r: 34, k: 1 });
  for (let i = 0; i < 40; i++) room.deco.push({ x: rng.range(40, W - 40), y: rng.range(40, H - 40), k: rng.int(0, 5), s: rng.range(0.6, 1.4) });
  return room;
}

function rollBlessings(rng, u, n, luck) {
  const wts = BLESS_WEIGHT.map((x, i) => x * (i > 0 ? 1 + luck * 0.2 * i : 1));
  const pool = BLESSINGS.filter((b) => {
    if ((u.bless[b.id] || 0) >= b.max) return false;
    if (b.id === 'pierce' && u.hero.basic.kind !== 'shot') return false;
    return true;
  });
  const out = [];
  for (let k = 0; k < n && pool.length; k++) {
    const r = rng.weighted(wts.map((x, i) => [i, pool.some((b) => b.rar === i) ? x : 0]));
    const cands = pool.filter((b) => b.rar === r && !out.includes(b.id));
    const pick = cands.length ? rng.pick(cands) : pool.filter((b) => !out.includes(b.id))[0];
    if (!pick) break;
    out.push(pick.id);
  }
  return out;
}

function botPickBlessing(ids) {
  let best = ids[0], bs = -1;
  for (const id of ids) {
    const b = BLESS_BY_ID[id];
    let s = b.rar * 10 + (b.m.dmg ? 4 : 0) + (b.m.as ? 3 : 0) + (b.m.hp ? 2 : 0);
    if (id === 'greed' || id === 'swift') s -= 3;
    if (s > bs) { bs = s; best = id; }
  }
  return best;
}

class RunMode {
  // cfg: { kind: 'adventure' | 'abyss', realm, diff, luck }
  constructor(w, cfg) {
    this.w = w;
    this.cfg = cfg;
    this.kind = cfg.kind;
    this.abyss = cfg.kind === 'abyss';
    this.realmId = cfg.realm || 1;
    this.diff = cfg.diff || 0;
    this.roomIdx = -1;
    this.total = this.abyss ? 0 : 8;
    this.phase = 'travel';
    this.t = 0;
    this.portals = [];
    this.offers = {};
    this.waves = [];
    this.waveT = 0;
    this.next = { type: 'combat', reward: 'bless' };
    this.banner = null;
    this.result = null;
    this.downsAtBoss = 0;
    this.startT = 0;
    this.boss = null;
    this.travelT = 0.01;
    this.reward = null;
    this.clearT = 0;
  }

  realm() {
    if (!this.abyss) return REALMS[this.realmId - 1];
    const f = Math.max(1, this.roomIdx + 1);
    return REALMS[Math.floor((f - 1) / 5) % 5];
  }

  partyN() { return Math.max(1, this.w.heroes().length); }

  mult(isBoss) {
    const R = this.realm(), D = DIFFS[this.diff], n = this.partyN();
    let hp, dmg;
    if (this.abyss) {
      const f = this.roomIdx;
      hp = 1.2 * Math.pow(1.14, f); dmg = 1.1 * Math.pow(1.075, f);
    } else {
      hp = R.hp * D.hp * (1 + 0.05 * this.roomIdx);
      dmg = R.dmg * D.dmg * (1 + 0.03 * this.roomIdx);
    }
    hp *= isBoss ? 0.55 + 0.45 * n : 0.85 + 0.15 * n;
    return { hp, dmg };
  }

  goldMul() { return (this.abyss ? 1 + this.roomIdx * 0.08 : this.realm().id * 0.6 + 0.4) * DIFFS[this.diff].gold; }
  ilvl() { return this.abyss ? 1 + Math.floor(this.roomIdx * 0.9) : (this.realm().id - 1) * 6 + 1 + Math.floor(this.roomIdx / 2) + DIFFS[this.diff].ilvl; }

  label() {
    if (this.abyss) return 'Abyss · Floor ' + (this.roomIdx + 1);
    return this.realm().name + ' · ' + (this.roomIdx >= this.total - 1 ? 'Boss' : 'Room ' + (this.roomIdx + 1) + '/' + (this.total - 1));
  }

  enterRoom() {
    const w = this.w;
    this.roomIdx++;
    const info = this.next;
    const isBoss = info.type === 'boss';
    const R = this.realm();
    const W = isBoss ? 1500 : info.type === 'calm' ? 1100 : ROOM_W, H = isBoss ? 1000 : info.type === 'calm' ? 760 : ROOM_H;
    w.setRoom(makeRoom(w.rng, R.pal, info.type, W, H, R.id));
    w.vacuum = false;
    w.hurtThisRoom = false;
    this.reward = info.reward;
    this.type = info.type;
    this.boss = null;
    this.portals = [];
    this.offers = {};
    this.phase = 'enter';
    this.t = 0;
    this.waves = [];
    this.waveT = 0;
    this.spawnLeft = 0;
    const hs = w.heroes();
    hs.forEach((h, i) => {
      h.x = h.px = W / 2 + (i - (hs.length - 1) / 2) * 56;
      h.y = h.py = H - 110;
      h.kx = h.ky = 0;
      h.dash = null;
      h.counters.swUsed = false;
      if (h.deadOut || h.downed) w.revive(h, 0.5, null);
      h.ang = -Math.PI / 2;
    });
    for (const s of w.units) if (s.kind === 'summon' && s.keep && s.owner) { s.x = s.owner.x; s.y = s.owner.y; }
    if (isBoss) w.emit('banner', BOSSES[this.bossId()].name, BOSSES[this.bossId()].title, '#ff4f6d');
    else if (info.type === 'calm') w.emit('banner', 'Healing Spring', 'Rest a moment', '#5df0b0');
    else w.emit('banner', this.abyss ? 'Floor ' + (this.roomIdx + 1) : R.name, this.abyss ? R.name : (info.type === 'elite' ? 'Elite Den' : 'Room ' + (this.roomIdx + 1)), info.type === 'elite' ? '#ff5a4a' : R.pal.accent);
    w.emit('room', this.roomIdx);
    if (this.roomIdx === 0) this.startT = w.t;
  }

  bossId() {
    if (!this.abyss) return this.realm().boss;
    return this.realm().boss;
  }

  planWaves() {
    const R = this.realm(), n = this.partyN();
    const cnt = 0.6 + 0.4 * n;
    const depth = this.abyss ? Math.min(10, 3 + this.roomIdx * 0.35) : this.roomIdx;
    const waves = this.type === 'elite' ? 2 : depth < 2 ? 2 : 3;
    const mobs = this.abyss ? [...new Set(R.mobs.concat(REALMS[(R.id) % 5].mobs.slice(0, this.roomIdx > 10 ? 3 : 1)))] : R.mobs;
    const out = [];
    for (let i = 0; i < waves; i++) {
      let budget = (5 + depth * 1.1 + i * 1.5) * cnt;
      const wave = [];
      if (this.type === 'elite' && i === waves - 1) {
        const ne = n >= 3 ? 2 : 1;
        for (let k = 0; k < ne; k++) wave.push({ id: this.w.rng.pick(mobs.filter((m) => !MOBS[m].heavy) .concat(mobs)), elite: this.w.rng.pick(ELITE_AFFIX).key });
        budget *= 0.5;
      }
      while (budget > 0) {
        const id = this.w.rng.pick(mobs);
        const cost = MOBS[id].heavy ? 3.5 : 1;
        if (cost > budget + 1) { budget -= 0.5; continue; }
        budget -= cost;
        const elite = depth >= 2 && this.w.rng.chance(0.06 + depth * 0.008) ? this.w.rng.pick(ELITE_AFFIX).key : null;
        wave.push({ id, elite });
      }
      out.push(wave);
    }
    return out;
  }

  spawnWave(list) {
    const w = this.w, room = w.room, mult = this.mult(false);
    const hs = w.heroes().filter(alive);
    for (const m of list) {
      let x = 0, y = 0;
      for (let k = 0; k < 30; k++) {
        x = w.rng.range(90, room.w - 90); y = w.rng.range(90, room.h - 90);
        if (hs.some((h) => dist(h.x, h.y, x, y) < 330)) continue;
        if (room.obst.some((o) => dist(o.x, o.y, x, y) < o.r + 40)) continue;
        break;
      }
      w.tele(1, 'circle', x, y, 0.9, (w2) => { w2.spawnMob(m.id, x, y, mult, m.elite); w2.emit('spawn', x, y); }, { r: 26, kind: 'spawn', small: true });
      this.spawnLeft++;
      w.later(0.95, () => { this.spawnLeft--; });
    }
  }

  mobsAlive() { return this.w.units.some((u) => (u.kind === 'mob' || u.kind === 'boss') && !u.dead); }

  update(dt) {
    const w = this.w;
    this.t += dt;
    if (this.result) return;
    if (this.phase === 'travel') {
      this.travelT -= dt;
      if (this.travelT <= 0) this.enterRoom();
      return;
    }
    // defeat
    const hs = w.heroes();
    if (hs.length && hs.every((h) => h.downed && !(h.autoRev > 0)) && this.phase !== 'won') {
      if (!this.loseT) this.loseT = 1.6;
      this.loseT -= dt;
      if (this.loseT <= 0) this.finish(false);
      return;
    }
    this.loseT = 0;
    if (this.phase === 'enter') {
      if (this.t > 1.1) {
        if (this.type === 'boss') {
          const id = this.bossId();
          w.tele(1, 'circle', w.room.w / 2, 230, 1.2, (w2) => { this.boss = w2.spawnBoss(id, w2.room.w / 2, 230, this.mult(true)); w2.emit('shake', 10); w2.emit('sfx', 'roar'); }, { r: 80, kind: 'spawn' });
          this.phase = 'boss';
          this.downsAtBoss = w.stats.downs;
          this.bossT = 0;
        } else if (this.type === 'calm') {
          this.phase = 'clear';
          this.grant();
        } else {
          this.waves = this.planWaves();
          this.spawnWave(this.waves.shift());
          this.phase = 'fight';
          this.waveT = 0;
        }
      }
      return;
    }
    if (this.phase === 'fight') {
      this.waveT += dt;
      const left = w.units.filter((u) => u.kind === 'mob').length;
      if (this.waves.length && this.spawnLeft <= 0 && (left <= 2 || this.waveT > 16)) { this.spawnWave(this.waves.shift()); this.waveT = 0; }
      if (!this.waves.length && this.spawnLeft <= 0 && !this.mobsAlive()) this.roomClear();
      return;
    }
    if (this.phase === 'boss') {
      this.bossT += dt;
      if (this.boss && this.boss.dead) {
        this.phase = 'won';
        this.t = 0;
        for (const m of w.units) if (m.kind === 'mob') { m.dead = true; w.emit('die', m.x, m.y, m.mob.look.color, m.r, m.mid); }
        w.projs.length = 0;
        w.areas = w.areas.filter((a) => a.team !== 1);
        w.emit('bossdie', this.boss.x, this.boss.y, this.boss.boss.color2);
        w.emit('banner', this.abyss ? 'FLOOR ' + (this.roomIdx + 1) + ' CLEARED' : 'VICTORY!', this.boss.boss.name + ' falls', '#ffd23f');
        w.stats.bosses++;
        if (w.stats.downs === this.downsAtBoss) w.stats.bossNoDown++;
        const g = 160 * this.goldMul();
        for (let i = 0; i < 30; i++) w.drop('gold', this.boss.x, this.boss.y, g / 30);
        w.vacuum = true;
        this.lootAll(2, 1);
        for (const h of w.heroes()) if (h.downed) w.revive(h, 0.5, null);
        w.bossKilled = this.bossId();
      }
      return;
    }
    if (this.phase === 'won') {
      if (this.abyss) { if (this.t > 2.5) { w.stats.abyss++; this.afterReward(); } }
      else if (this.t > 4) this.finish(true);
      return;
    }
    if (this.phase === 'reward') {
      const pend = Object.keys(this.offers).filter((k) => !this.offers[k].done);
      this.rewardT += dt;
      for (const k of pend) {
        const of = this.offers[k];
        if (of.bot && this.rewardT > of.delay) this.pick(+k, 0);
      }
      if (this.rewardT > 40) for (const k of pend) this.pick(+k, 0);
      if (!Object.keys(this.offers).some((k) => !this.offers[k].done)) this.afterReward();
      return;
    }
    if (this.phase === 'portal') {
      const humans = hs.filter((h) => h.pl && h.pl.kind !== 'bot' && alive(h));
      const counted = humans.length ? humans : hs.filter(alive);
      for (const p of this.portals) {
        const on = counted.some((h) => dist(h.x, h.y, p.x, p.y) < 52);
        p.prog = on ? p.prog + dt : Math.max(0, p.prog - dt * 2);
        if (p.prog >= 1) { this.choose(p); break; }
      }
    }
  }

  roomClear() {
    const w = this.w;
    this.phase = 'clear';
    w.stats.rooms++;
    if (this.abyss) w.stats.abyss++;
    if (!w.hurtThisRoom) w.stats.flawless++;
    w.vacuum = true;
    w.emit('banner', 'ROOM CLEAR', w.hurtThisRoom ? '' : 'Flawless!', '#ffd23f');
    w.emit('sfx', 'clear');
    for (const h of w.heroes()) if (h.downed) w.revive(h, 0.35, null);
    this.grant();
  }

  // Hands out the reward promised by the portal the party took.
  grant() {
    const w = this.w, r = this.reward;
    const hs = w.heroes();
    if (r === 'gold') {
      const g = 70 * this.goldMul() * (0.8 + 0.2 * hs.length);
      for (let i = 0; i < 26; i++) w.drop('gold', w.room.w / 2, w.room.h / 2, g / 26);
      w.emit('chest', w.room.w / 2, w.room.h / 2, 'gold');
    }
    if (r === 'gear' || r === 'elite') { this.lootAll(1, r === 'elite' ? 1 : 0); w.emit('chest', w.room.w / 2, w.room.h / 2, 'gear'); }
    if (r === 'heal') {
      for (const h of hs) { if (h.downed) w.revive(h, 1, null); w.heal(h, h.maxHp); }
      w.emit('flash', '#5df0b0', 0.25);
      w.emit('ring', w.room.w / 2, w.room.h / 2, 300, '#5df0b0');
      for (const h of hs) h.ult = Math.min(100, h.ult + 30);
    }
    if (r === 'bless' || r === 'elite') {
      this.phase = 'reward';
      this.rewardT = 0;
      for (const h of hs) {
        const pl = h.pl;
        this.offers[pl.slot] = { ids: rollBlessings(w.rng, h, 3, (pl.luck || 0) + (r === 'elite' ? 2 : 0)), done: false, bot: pl.kind === 'bot', delay: 0.6 + w.rng.next(), rerolls: pl.rerolls || 0 };
      }
      w.emit('offers');
      return;
    }
    this.afterReward();
  }

  lootAll(n, bonus) {
    for (const h of this.w.heroes()) {
      if (h.pl.kind === 'bot') continue;
      for (let i = 0; i < n; i++) this.w.emit('loot', h.pl.slot, this.ilvl(), bonus);
    }
    this.w.stats.chests++;
  }

  pick(slot, idx) {
    const of = this.offers[slot];
    if (!of || of.done) return;
    const pl = this.w.players.find((p) => p.slot === slot);
    const u = pl && pl.unit;
    if (!u) { of.done = true; return; }
    const id = of.bot ? botPickBlessing(of.ids) : of.ids[clamp(idx, 0, of.ids.length - 1)];
    of.done = true;
    of.picked = id;
    if (id) {
      this.w.addBlessing(u, id);
      this.w.emit('blessed', slot, id);
    }
  }

  reroll(slot) {
    const of = this.offers[slot];
    if (!of || of.done || of.rerolls <= 0) return;
    const pl = this.w.players.find((p) => p.slot === slot);
    of.rerolls--;
    pl.rerolls = of.rerolls;
    of.ids = rollBlessings(this.w.rng, pl.unit, 3, pl.luck || 0);
    this.w.emit('offers');
  }

  afterReward() {
    const w = this.w;
    this.phase = 'portal';
    const room = w.room;
    const nextIdx = this.roomIdx + 1;
    let opts;
    if (!this.abyss && nextIdx === this.total - 1) opts = [{ type: 'boss', reward: 'boss' }];
    else if (this.abyss && (nextIdx + 1) % 5 === 0) opts = [{ type: 'boss', reward: 'boss' }];
    else {
      const n = w.rng.chance(0.3) ? 3 : 2;
      const pool = [['bless', 40], ['gold', 18], ['gear', 18]];
      if (nextIdx >= 2) pool.push(['elite', 12]);
      if (w.heroes().some((h) => h.downed || h.hp < h.maxHp * 0.6)) pool.push(['heal', 20]); else pool.push(['heal', 5]);
      opts = [];
      for (let i = 0; i < n * 4 && opts.length < n; i++) {
        const r = w.rng.weighted(pool);
        if (opts.some((o) => o.reward === r)) continue;
        opts.push({ type: r === 'heal' ? 'calm' : r === 'elite' ? 'elite' : 'combat', reward: r });
      }
      if (!opts.some((o) => o.reward === 'bless') && w.rng.chance(0.6)) opts[0] = { type: 'combat', reward: 'bless' };
    }
    this.portals = opts.map((o, i) => ({ x: room.w / 2 + (i - (opts.length - 1) / 2) * 230, y: 120, type: o.type, reward: o.reward, prog: 0 }));
    w.emit('portals');
  }

  choose(p) {
    this.next = { type: p.type, reward: p.reward };
    this.portals = [];
    this.phase = 'travel';
    this.travelT = 0.7;
    this.w.emit('travel');
    // turrets and raised skeletons stay behind
    for (const u of this.w.units) if (u.kind === 'summon' && !u.keep) u.dead = true;
  }

  finish(win) {
    if (this.result) return;
    const w = this.w;
    this.phase = win ? 'done' : 'lost';
    if (!win) w.emit('banner', 'DEFEATED', this.abyss ? 'Floor ' + (this.roomIdx + 1) : 'Room ' + (this.roomIdx + 1), '#ff4f6d');
    this.result = {
      win, kind: this.kind, realm: this.realmId, diff: this.diff, rooms: w.stats.rooms, floor: this.abyss ? w.stats.abyss : 0,
      time: w.t - this.startT, gold: Math.round(w.gold), boss: win ? this.bossId() : null,
    };
    w.emit('end', win ? 1 : 0);
  }

  onKill(u, src) {
    if (u.kind === 'mob') onMobDeath(this.w, u, src, this.goldMul());
    if (u.kind === 'boss') { this.w.countKill(u); this.w.emit('die', u.x, u.y, u.boss.color2, u.r, u.bid); }
  }

  onDown(u) { this.w.emit('text', u.x, u.y - 30, 'DOWN!', '#ff5a4a', 15); }

  botGoal(u) {
    const w = this.w;
    const humans = w.heroes().filter((h) => h !== u && h.pl && h.pl.kind !== 'bot' && alive(h));
    const lead = u.pl && u.pl.kind !== 'bot';
    if (humans.length && !lead) {
      let best = humans[0], bd = 1e9;
      for (const h of humans) { const d = dist2(h.x, h.y, u.x, u.y); if (d < bd) { bd = d; best = h; } }
      return { x: best.x, y: best.y + 40, stop: 90 };
    }
    if (this.phase === 'portal' && this.portals.length) {
      if (!this.botPortal || !this.portals.includes(this.botPortal)) {
        const order = ['bless', 'elite', 'gear', 'boss', 'heal', 'gold'];
        this.botPortal = this.portals.slice().sort((a, b) => order.indexOf(a.reward) - order.indexOf(b.reward))[0];
      }
      return { x: this.botPortal.x, y: this.botPortal.y, stop: 10 };
    }
    if (this.phase === 'clear' || this.phase === 'reward') return { x: w.room.w / 2, y: w.room.h / 2, stop: 120 };
    return null;
  }

  hud() {
    return { label: this.label(), phase: this.phase, boss: this.boss && !this.boss.dead ? this.boss : null };
  }
}

// ---------- Arena ----------
class ArenaMode {
  // cfg: { teams: 2 | 0 (free for all), target, time }
  constructor(w, cfg) {
    this.w = w;
    this.cfg = cfg;
    this.kind = 'arena';
    this.ffa = !cfg.teams;
    this.target = cfg.target || 10;
    this.timeLeft = cfg.time || 180;
    this.score = {};
    this.phase = 'enter';
    this.t = 0;
    this.result = null;
    this.feed = [];
    this.puT = 6;
    w.arena = true;
  }

  start() {
    const w = this.w;
    w.setRoom(makeArenaRoom(w.rng));
    for (const h of w.heroes()) { this.score[h.team] = this.score[h.team] || 0; this.place(h); }
    w.emit('banner', 'ARENA', this.ffa ? 'Free for all · first to ' + this.target : 'Team battle · first to ' + this.target, '#ffd23f');
  }

  spawnPoint(team, i) {
    const W = ARENA_W, H = ARENA_H;
    if (this.ffa) {
      const ids = Object.keys(this.score).map(Number).sort((a, b) => a - b);
      const k = ids.indexOf(team), n = Math.max(2, ids.length);
      const a = k / n * TAU + Math.PI;
      return { x: W / 2 + Math.cos(a) * W * 0.4, y: H / 2 + Math.sin(a) * H * 0.38 };
    }
    return { x: team === 0 ? 110 : W - 110, y: H / 2 + ((i % 4) - 1.5) * 90 };
  }

  place(h) {
    const mates = this.w.heroes().filter((o) => o.team === h.team);
    const p = this.spawnPoint(h.team, mates.indexOf(h));
    h.x = h.px = p.x; h.y = h.py = p.y;
    h.kx = h.ky = 0;
    h.ang = h.x < ARENA_W / 2 ? 0 : Math.PI;
  }

  update(dt) {
    const w = this.w;
    this.t += dt;
    if (this.result) return;
    if (this.phase === 'enter') { if (this.t > 1.5) this.phase = 'fight'; return; }
    if (this.phase === 'over') { this.overT -= dt; if (this.overT <= 0) this.finish(); return; }
    this.timeLeft -= dt;
    for (const h of w.heroes()) {
      if (!h.ko) continue;
      h.respawn -= dt;
      if (h.respawn <= 0) {
        h.ko = false;
        h.hp = h.maxHp;
        h.st = newStatus();
        h.st.invuln = 2;
        h.ult = Math.max(h.ult, 20);
        this.place(h);
        w.emit('revive', h.id, h.x, h.y);
      }
    }
    this.puT -= dt;
    if (this.puT <= 0) {
      this.puT = 11;
      if (w.picks.length < 3) {
        const spots = [[ARENA_W / 2, ARENA_H / 2], [ARENA_W / 2, ARENA_H * 0.32], [ARENA_W / 2, ARENA_H * 0.68]];
        const s = w.rng.pick(spots.filter((s) => !w.picks.some((p) => dist(p.x, p.y, s[0], s[1]) < 30)) .concat([spots[0]]));
        const kind = w.rng.pick(['heal', 'power', 'ultorb']);
        w.picks.push({ id: w.nid++, kind, x: s[0], y: s[1], vx: 0, vy: 0, val: 1, t: 0 });
      }
    }
    const best = Math.max(...Object.values(this.score));
    if (best >= this.target || this.timeLeft <= 0) {
      const leaders = Object.keys(this.score).filter((k) => this.score[k] === best);
      if (leaders.length === 1 || this.timeLeft < -30) {
        this.winner = +leaders[0];
        this.phase = 'over';
        this.overT = 3;
        w.emit('banner', this.teamName(this.winner) + ' WINS!', '', '#ffd23f');
        w.emit('sfx', 'win');
      } else if (this.timeLeft <= 0 && !this.ot) { this.ot = true; w.emit('banner', 'OVERTIME', 'Next knockout wins', '#ff4f6d'); }
    }
  }

  teamName(team) {
    if (!this.ffa) return team === 0 ? 'BLUE TEAM' : 'RED TEAM';
    const h = this.w.heroes().find((o) => o.team === team);
    return h ? (h.pl.name || h.hero.name).toUpperCase() : 'PLAYER';
  }

  onKO(v, src) {
    const w = this.w;
    if (v.ko) return;
    const killer = src && src.kind === 'summon' ? src.owner : src;
    v.ko = true;
    v.respawn = 3.5;
    v.deaths++;
    v.streak = 0;
    v.channel = null;
    v.dash = null;
    v.buffs.length = 0;
    w.emit('die', v.x, v.y, v.hero.color, v.r, 'hero');
    if (killer && killer.kind === 'hero' && killer.team !== v.team) {
      this.score[killer.team] = (this.score[killer.team] || 0) + 1;
      killer.kos++;
      killer.streak++;
      if (killer.team === 0 || true) w.stats.bestStreak = Math.max(w.stats.bestStreak || 0, killer.pl.kind !== 'bot' ? killer.streak : 0);
      killer.ult = Math.min(100, killer.ult + 25);
      this.feed.push({ t: w.t, k: killer.id, v: v.id });
      w.emit('ko', killer.id, v.id, killer.streak);
    } else {
      const other = Object.keys(this.score).map(Number).filter((t) => t !== v.team);
      if (!this.ffa && other.length) this.score[other[0]]++;
      w.emit('ko', 0, v.id, 0);
    }
    if (this.feed.length > 5) this.feed.shift();
  }

  onKill(u) { if (u.kind === 'summon') w2poof(this.w, u); }

  finish() {
    const w = this.w;
    this.result = { win: null, kind: 'arena', winner: this.winner, score: Object.assign({}, this.score), time: this.t, gold: 0 };
    w.emit('end', 1);
  }

  botGoal(u) {
    const w = this.w;
    if (u.hp < u.maxHp * 0.7 || u.ult < 100) {
      let best = null, bd = 700 * 700;
      for (const p of w.picks) { const d = dist2(p.x, p.y, u.x, u.y); if (d < bd && (p.kind !== 'heal' || u.hp < u.maxHp * 0.7)) { bd = d; best = p; } }
      if (best) return { x: best.x, y: best.y, stop: 4 };
    }
    return { x: ARENA_W / 2, y: ARENA_H / 2, stop: 160 };
  }

  hud() { return { label: this.ffa ? 'Arena · Free for all' : 'Arena · Team battle', phase: this.phase, boss: null }; }
}

function w2poof(w, u) { w.emit('poof', u.x, u.y, '#ffffff'); }

// ===== 08-meta.js =====
// ---------- Progression: save, heroes, gear, camp upgrades, achievements, daily quests ----------

const SAVE_KEY = 'realm-raiders-save-v1';
const MAX_LVL = 30;
const INV_MAX = 150;

function freshSave() {
  const s = {
    v: 1, name: 'Raider', gold: 200, sel: 'brand', items: [], uid: 1, talents: {}, ach: {}, realms: { 1: 0 },
    heroes: {}, daily: { day: '', quests: [], chest: '', bonus: false },
    stats: { kills: 0, boss: {}, heroicClears: 0, mythicClears: 0, abyssBest: 0, bestRar: 0, maxUp: 0, flawless: 0, bossNoDown: 0, bestCombo: 0,
      bestMulti: 0, ults: 0, revives: 0, maxBless: 0, legBless: 0, goldEarned: 0, fastClear: 0, coopRuns: 0, onlineGames: 0, arenaWins: 0,
      bestStreak: 0, quests: 0, runs: 0, rooms: 0, wins: 0 },
    settings: { sfx: 0.8, music: 0.45, shake: 1, nums: 1, botSkill: 1, bots: 2, autoSalvage: false, lang: 'auto', btnAlpha: 0.35 },
    created: Date.now(), savedAt: 0, tutorial: false,
  };
  for (const h of HEROES) s.heroes[h.id] = { unlocked: h.unlock.gold === 0, lvl: 1, xp: 0, gear: { weapon: null, armor: null, charm: null }, runs: 0, kills: 0, best: 0 };
  return s;
}

function normalizeSave(s) {
  const f = freshSave();
  if (!s || typeof s !== 'object') return f;
  for (const k in f) if (s[k] == null) s[k] = f[k];
  for (const k in f.stats) if (s.stats[k] == null) s.stats[k] = f.stats[k];
  for (const k in f.settings) if (s.settings[k] == null) s.settings[k] = f.settings[k];
  for (const h of HEROES) {
    if (!s.heroes[h.id]) s.heroes[h.id] = f.heroes[h.id];
    const hh = s.heroes[h.id];
    for (const k in f.heroes[h.id]) if (hh[k] == null) hh[k] = f.heroes[h.id][k];
  }
  if (!HERO_BY_ID[s.sel] || !s.heroes[s.sel].unlocked) s.sel = 'brand';
  if (!Array.isArray(s.items)) s.items = [];
  return s;
}

const Meta = {
  s: null,
  toasts: [],
  cloud: null,
  pending: [],

  load() {
    let s = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) s = JSON.parse(raw); } catch (e) { s = null; }
    this.s = normalizeSave(s);
    if (!s) { this.s.items.push(this.makeItem(1, 0, 0, 'weapon', 1)); this.equip('brand', this.s.items[0].uid); }
    this.daily();
    return this.s;
  },

  save() {
    const s = this.s;
    s.savedAt = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
    if (this.cloud) {
      clearTimeout(this.cloudT);
      this.cloudT = setTimeout(() => this.pushCloud(), 4000);
    }
  },

  // Cloud save inside the claude.ai artifact viewer (when the page is served there).
  async connectCloud() {
    try {
      let n = 0;
      while (!(window.claude && typeof window.claude.use === 'function') && n++ < 20) await new Promise((r) => setTimeout(r, 100));
      if (!(window.claude && typeof window.claude.use === 'function')) return false;
      const to = (p) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      const [db, user] = await to(Promise.all([window.claude.use('db'), window.claude.use('user')]));
      if (!db || !user) return false;
      const id = await to(user.id());
      if (!id) return false;
      const ref = db.doc('data/users/' + id + '/save');
      const snap = await to(ref.get());
      const d = snap && snap.exists ? snap.data() : null;
      this.cloud = { ref };
      if (d && d.json) {
        const remote = normalizeSave(JSON.parse(d.json));
        if ((remote.savedAt || 0) > (this.s.savedAt || 0)) { this.s = remote; this.daily(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(remote)); } catch (e) { /* ignore */ } return 'loaded'; }
      }
      this.pushCloud();
      return true;
    } catch (e) { return false; }
  },

  async pushCloud() {
    if (!this.cloud) return;
    try { await this.cloud.ref.set({ json: JSON.stringify(this.s), at: Date.now() }); } catch (e) { /* offline */ }
  },

  exportCode() {
    const j = JSON.stringify(this.s);
    return 'RR1' + btoa(unescape(encodeURIComponent(j)));
  },

  importCode(code) {
    code = String(code || '').trim();
    if (!code.startsWith('RR1')) return false;
    try {
      const s = JSON.parse(decodeURIComponent(escape(atob(code.slice(3)))));
      if (!s || !s.heroes) return false;
      this.s = normalizeSave(s);
      this.daily();
      this.save();
      return true;
    } catch (e) { return false; }
  },

  reset() { this.s = freshSave(); this.s.items.push(this.makeItem(1, 0, 0, 'weapon', 1)); this.equip('brand', this.s.items[0].uid); this.daily(); this.save(); },

  // ---------- heroes ----------
  hero(id) { return this.s.heroes[id]; },
  xpNeed(lvl) { return Math.round(70 * Math.pow(lvl, 1.42)); },

  addXp(id, xp) {
    const h = this.hero(id);
    const before = h.lvl;
    h.xp += Math.round(xp);
    while (h.lvl < MAX_LVL && h.xp >= this.xpNeed(h.lvl)) { h.xp -= this.xpNeed(h.lvl); h.lvl++; }
    if (h.lvl >= MAX_LVL) h.xp = 0;
    return { before, after: h.lvl };
  },

  canUnlock(id) {
    const d = HERO_BY_ID[id];
    return !this.hero(id).unlocked && d.unlock.gold != null && this.s.gold >= d.unlock.gold;
  },

  unlock(id) {
    if (!this.canUnlock(id)) return false;
    this.s.gold -= HERO_BY_ID[id].unlock.gold;
    this.hero(id).unlocked = true;
    this.checkAch();
    this.save();
    return true;
  },

  // A hero's power: what level and gear add, as the sim expects it.
  loadout(id) {
    const h = this.hero(id);
    const mods = {};
    const uniq = [];
    for (const slot of SLOTS) {
      const it = this.item(h.gear[slot]);
      if (!it) continue;
      for (const [k, v] of this.itemStats(it)) mods[k] = (mods[k] || 0) + v / 100;
      if (it.uniq) uniq.push(it.uniq);
    }
    const t = this.s.talents;
    mods.dmg = (mods.dmg || 0) + (t.might || 0) * TALENT_BY_ID.might.per;
    mods.hp = (mods.hp || 0) + (t.vital || 0) * TALENT_BY_ID.vital.per;
    return { mods, uniq };
  },

  power(id) {
    const h = this.hero(id), L = this.loadout(id), m = L.mods;
    const lv = h.lvl - 1;
    const off = (1 + 0.06 * lv) * (1 + (m.dmg || 0)) * (1 + (m.as || 0) * 0.8) * (1 + (m.crit || 0) * 0.6);
    const def = (1 + 0.07 * lv) * (1 + (m.hp || 0)) / (1 - Math.min(0.6, m.armor || 0));
    return Math.round(Math.sqrt(off * def) * 100 + (L.uniq.length * 15));
  },

  playerInfo(id) {
    const t = this.s.talents;
    return { hero: id, lvl: this.hero(id).lvl, load: this.loadout(id), luck: t.luck || 0, rerolls: t.reroll || 0, ankh: !!t.revive, name: this.s.name };
  },

  botInfo(id, refId) {
    const ref = this.hero(refId || this.s.sel);
    const own = this.hero(id);
    const lvl = own.unlocked ? Math.max(own.lvl, ref.lvl - 2) : Math.max(1, ref.lvl - 1);
    const L = this.loadout(refId || this.s.sel);
    const mods = {};
    for (const k in L.mods) mods[k] = L.mods[k] * 0.7;
    return { hero: id, lvl: clamp(lvl, 1, MAX_LVL), load: { mods, uniq: [] }, luck: 0, rerolls: 0, ankh: false };
  },

  // ---------- gear ----------
  item(uid) { return uid ? this.s.items.find((i) => i.uid === uid) : null; },

  rollRarity(rng, boost, luck, ilvl) {
    const lk = 1 + luck * 0.25 + Math.min(1.5, ilvl / 30);
    const w = [60, 28 * lk, 9 * lk * (1 + boost * 0.8), 2.4 * lk * (1 + boost * 1.5), 0.35 * lk * (1 + boost * 2) * (ilvl >= 12 ? 1 : 0.2)];
    let r = rng.weighted(w.map((x, i) => [i, x]));
    if (boost >= 1 && r < 1) r = 1;
    if (boost >= 2 && r < 2) r = 2;
    return r;
  },

  makeItem(ilvl, boost, luck, slot, forceRar) {
    const rng = new RNG((Math.random() * 1e9) | 0);
    const rar = forceRar != null ? forceRar - 1 + 1 : this.rollRarity(rng, boost || 0, luck || 0, ilvl);
    slot = slot || rng.pick(SLOTS);
    const it = { uid: this.s ? this.s.uid++ : 1, slot, rar: clamp(rar, 0, 4), ilvl: Math.max(1, Math.round(ilvl)), up: 0, base: rng.pick(GEAR_BASES[slot]), stats: [], uniq: null, isNew: true, lock: false };
    const val = (k, mainK) => {
      const g = GEAR_STATS[k];
      let v = (g[1] + g[2] * it.ilvl) * RAR_MULT[it.rar] * (mainK ? 1.6 : rng.range(0.7, 1.15));
      return Math.round(v * 10) / 10;
    };
    const main = MAIN_STAT[slot] || rng.pick(['crit', 'as', 'cdr', 'ult', 'critDmg']);
    it.stats.push([main, val(main, true)]);
    const keys = Object.keys(GEAR_STATS).filter((k) => k !== main);
    rng.shuffle(keys);
    const nAff = Math.min(4, it.rar + (it.rar >= 3 ? 0 : 0));
    for (let i = 0; i < nAff; i++) it.stats.push([keys[i], val(keys[i])]);
    if (it.rar >= 3) {
      const u = rng.pick(UNIQUES.filter((x) => x.slot === slot));
      it.uniq = u.id;
      it.name = u.name;
    } else {
      const top = it.stats.length > 1 ? it.stats[1][0] : main;
      it.name = PREFIX[top] + ' ' + it.base + (it.rar >= 2 ? ' ' + rng.pick(SUFFIX) : '');
    }
    return it;
  },

  itemStats(it) {
    const m = 1 + 0.1 * (it.up || 0);
    return it.stats.map(([k, v]) => [k, Math.round(v * m * 10) / 10]);
  },

  itemScore(it) {
    let s = 0;
    const w = { dmg: 3, hp: 2, as: 3, crit: 3, critDmg: 1, cdr: 2, ms: 2, ls: 4, ult: 1.5, armor: 4, gold: 0.5, regen: 12 };
    for (const [k, v] of this.itemStats(it)) s += v * (w[k] || 1);
    if (it.uniq) s += 60;
    return Math.round(s);
  },

  upCost(it) { return Math.round((40 + it.ilvl * 9) * RAR_MULT[it.rar] * Math.pow(1.38, it.up)); },
  salvageValue(it) { return Math.round((10 + it.ilvl * 3) * [1, 2, 4, 10, 25][it.rar] * (1 + 0.25 * it.up)); },

  upgrade(uid) {
    const it = this.item(uid);
    if (!it || it.up >= 10) return false;
    const c = this.upCost(it);
    if (this.s.gold < c) return false;
    this.s.gold -= c;
    it.up++;
    this.s.stats.maxUp = Math.max(this.s.stats.maxUp, it.up);
    this.checkAch();
    this.save();
    return true;
  },

  equippedBy(uid) {
    for (const h of HEROES) { const g = this.hero(h.id).gear; for (const s of SLOTS) if (g[s] === uid) return h.id; }
    return null;
  },

  equip(heroId, uid) {
    const it = this.item(uid);
    if (!it) return;
    const other = this.equippedBy(uid);
    if (other) this.hero(other).gear[it.slot] = null;
    this.hero(heroId).gear[it.slot] = uid;
    it.isNew = false;
    this.save();
  },

  unequip(heroId, slot) { this.hero(heroId).gear[slot] = null; this.save(); },

  salvage(uid) {
    const it = this.item(uid);
    if (!it || it.lock) return 0;
    const by = this.equippedBy(uid);
    if (by) this.hero(by).gear[it.slot] = null;
    this.s.items = this.s.items.filter((i) => i.uid !== uid);
    const v = this.salvageValue(it);
    this.s.gold += v;
    this.save();
    return v;
  },

  salvageBelow(rar) {
    let g = 0, n = 0;
    for (const it of this.s.items.slice()) if (it.rar <= rar && !it.lock && !this.equippedBy(it.uid)) { g += this.salvage(it.uid); n++; }
    return { g, n };
  },

  addItem(it) {
    this.s.stats.bestRar = Math.max(this.s.stats.bestRar, it.rar);
    if (this.s.items.length >= INV_MAX) {
      const worst = this.s.items.filter((i) => !i.lock && !this.equippedBy(i.uid)).sort((a, b) => this.itemScore(a) - this.itemScore(b))[0];
      if (worst && this.itemScore(worst) < this.itemScore(it)) this.salvage(worst.uid); else { this.s.gold += this.salvageValue(it); return false; }
    }
    if (this.s.settings.autoSalvage && it.rar === 0) { this.s.gold += this.salvageValue(it); return false; }
    this.s.items.push(it);
    return true;
  },

  // ---------- camp upgrades ----------
  talentCost(id) { const t = TALENT_BY_ID[id], l = this.s.talents[id] || 0; return l >= t.max ? null : t.cost(l); },
  buyTalent(id) {
    const c = this.talentCost(id);
    if (c == null || this.s.gold < c) return false;
    this.s.gold -= c;
    this.s.talents[id] = (this.s.talents[id] || 0) + 1;
    this.checkAch();
    this.save();
    return true;
  },

  // ---------- realms ----------
  realmUnlocked(id) { return id === 1 || (this.s.realms[id - 1] || 0) >= 1; },
  diffUnlocked(id, d) { return this.realmUnlocked(id) && (d === 0 || (this.s.realms[id] || 0) >= d); },
  abyssUnlocked() { return (this.s.realms[1] || 0) >= 1; },

  // ---------- run results ----------
  // res: mode result; ws: world stats; heroId: the local player's hero; ctx: { coop, online, items }
  applyRun(res, ws, heroId, ctx) {
    const s = this.s, st = s.stats, t = s.talents;
    const out = { gold: 0, xp: 0, items: ctx.items || [], lvl: null, ach: [], realmUnlock: null };
    let gold = res.gold || 0;
    if (res.kind === 'arena') {
      const won = ctx.won;
      gold += won ? 90 : 35;
      out.xp = won ? 80 : 40;
      if (won) st.arenaWins++;
      st.bestStreak = Math.max(st.bestStreak, ws.bestStreak || 0);
    } else {
      const dm = [1, 1.6, 2.4][res.diff || 0];
      if (res.win && res.kind === 'adventure') gold += 120 * res.realm * DIFFS[res.diff].gold;
      out.xp = ((ws.kills || 0) * 1.1 + (ws.rooms || 0) * 22 + (res.win ? 180 : 0) + (res.floor || 0) * 18) * dm;
      st.rooms += ws.rooms || 0;
      if (res.kind === 'abyss') st.abyssBest = Math.max(st.abyssBest, res.floor || 0);
      if (res.win && res.kind === 'adventure') {
        st.wins++;
        const prev = s.realms[res.realm] || 0;
        if (res.diff + 1 > prev) {
          s.realms[res.realm] = res.diff + 1;
          if (res.diff === 0 && res.realm < 5) out.realmUnlock = res.realm + 1;
        }
        if (res.diff === 1) st.heroicClears++;
        if (res.diff === 2) st.mythicClears++;
        if (!st.fastClear || res.time < st.fastClear) st.fastClear = Math.round(res.time);
      }
      if (ctx.bossKilled) st.boss[ctx.bossKilled] = (st.boss[ctx.bossKilled] || 0) + 1;
    }
    gold = Math.round(gold * (1 + (t.fortune || 0) * TALENT_BY_ID.fortune.per));
    out.gold = gold;
    s.gold += gold;
    st.goldEarned += gold;
    out.xp = Math.round(out.xp * (1 + (t.wisdom || 0) * TALENT_BY_ID.wisdom.per));
    out.lvl = this.addXp(heroId, out.xp);
    const hh = this.hero(heroId);
    hh.runs++;
    hh.kills += ws.kills || 0;
    st.runs++;
    st.kills += ws.kills || 0;
    st.ults += ws.ults || 0;
    st.revives += ws.revives || 0;
    st.flawless += ws.flawless || 0;
    st.bossNoDown += ws.bossNoDown || 0;
    st.bestCombo = Math.max(st.bestCombo, ws.bestCombo || 0);
    st.bestMulti = Math.max(st.bestMulti, ws.bestMulti || 0);
    st.maxBless = Math.max(st.maxBless, ws.maxBless || 0);
    st.legBless += ws.legBless || 0;
    if (ctx.coop) st.coopRuns++;
    if (ctx.online) st.onlineGames++;
    for (const it of out.items) this.addItem(it);
    this.questProgress({ kills: ws.kills, rooms: ws.rooms, elites: ws.elites, bosses: ws.bosses, ults: ws.ults, gold: ws.gold, chests: ws.chests, arenaWins: res.kind === 'arena' && ctx.won ? 1 : 0, blessings: ws.blessings, abyss: ws.abyss });
    out.ach = this.checkAch();
    this.save();
    return out;
  },

  // ---------- achievements ----------
  checkAch() {
    const got = [];
    for (const a of ACHIEVEMENTS) {
      if (this.s.ach[a.id]) continue;
      let ok = false;
      try { ok = a.test(this.s); } catch (e) { ok = false; }
      if (!ok) continue;
      this.s.ach[a.id] = Date.now();
      this.s.gold += a.gold || 0;
      if (a.hero && this.hero(a.hero)) this.hero(a.hero).unlocked = true;
      got.push(a);
      this.toasts.push({ kind: 'ach', a });
    }
    if (got.length) this.save();
    return got;
  },

  // ---------- daily ----------
  today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); },

  daily() {
    const s = this.s, day = this.today();
    if (s.daily.day === day) return;
    const rng = new RNG(hashStr(day + ':rr'));
    const pool = QUESTS.slice();
    rng.shuffle(pool);
    s.daily = { day, quests: pool.slice(0, 3).map((q) => { const tier = rng.int(0, 2); return { id: q.id, n: q.n[tier], prog: 0, claimed: false, gold: Math.round(q.gold * (1 + tier * 0.5)) }; }), chest: s.daily.chest || '', bonus: false };
  },

  questProgress(add) {
    this.daily();
    for (const q of this.s.daily.quests) {
      const d = QUESTS.find((x) => x.id === q.id);
      q.prog = Math.min(q.n, q.prog + (add[d.stat] || 0));
    }
  },

  claimQuest(i) {
    const q = this.s.daily.quests[i];
    if (!q || q.claimed || q.prog < q.n) return false;
    q.claimed = true;
    this.s.gold += q.gold;
    this.s.stats.quests++;
    this.checkAch();
    this.save();
    return q.gold;
  },

  canBonus() { const d = this.s.daily; return !d.bonus && d.quests.length && d.quests.every((q) => q.claimed); },
  claimBonus() {
    if (!this.canBonus()) return null;
    this.s.daily.bonus = true;
    const it = this.makeItem(this.bestIlvl(), 1, this.s.talents.luck || 0);
    this.addItem(it);
    this.save();
    return it;
  },

  chestReady() { return this.s.daily.chest !== this.today(); },
  claimChest() {
    if (!this.chestReady()) return null;
    this.s.daily.chest = this.today();
    const gold = 80 + 40 * this.highestRealm();
    this.s.gold += gold;
    const it = this.makeItem(this.bestIlvl(), 0, this.s.talents.luck || 0);
    this.addItem(it);
    this.save();
    return { gold, item: it };
  },

  highestRealm() { let r = 1; for (let i = 1; i <= 5; i++) if ((this.s.realms[i] || 0) >= 1) r = Math.min(5, i + 1); return r; },
  bestIlvl() { return (this.highestRealm() - 1) * 6 + 3; },
};

// Display settings read by the renderer and effects (kept in sync by applySettings).
const Settings = { nums: 1, shake: 1, btnAlpha: 0.35 };

// ===== 09-input.js =====
// ---------- Input: touch, keyboard (three players on one keyboard), gamepads, mouse ----------
// Devices: 'touch', 'kb1', 'kb2', 'kb3', 'pad0'..'pad3'. Each local player owns one device.

const KEYMAP = {
  kb1: { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], skill: ['KeyQ'], ult: ['KeyE'], dash: ['Space', 'ShiftLeft'] },
  kb2: { up: ['KeyI'], down: ['KeyK'], left: ['KeyJ'], right: ['KeyL'], skill: ['KeyU'], ult: ['KeyO'], dash: ['Semicolon', 'KeyP'] },
  kb3: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], skill: ['Numpad1', 'Slash'], ult: ['Numpad2', 'Enter'], dash: ['Numpad0', 'ShiftRight'] },
};
// When only one keyboard player is in the game, they can use either hand.
const KB_SOLO = { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], skill: ['KeyJ', 'Numpad1'], ult: ['KeyK', 'Numpad2'], dash: ['KeyL', 'Numpad0'] };
const KEY_HINT = { kb1: 'WASD · Q skill · E ult · Space dash', kb2: 'IJKL · U skill · O ult · ; dash', kb3: 'Arrows · 1 skill · 2 ult · 0 dash (numpad)', touch: 'Touch', pad0: 'Gamepad 1', pad1: 'Gamepad 2', pad2: 'Gamepad 3', pad3: 'Gamepad 4' };
const DEV_NAME = { kb1: 'Keyboard (left)', kb2: 'Keyboard (right)', kb3: 'Keyboard (arrows)', touch: 'Touch', pad0: 'Gamepad 1', pad1: 'Gamepad 2', pad2: 'Gamepad 3', pad3: 'Gamepad 4' };

const Input = {
  keys: new Set(),
  pressed: new Set(),
  pads: [],
  padPrev: [],
  mouse: { x: 0, y: 0, t: -1e9, down: 0, l: false, r: false },
  touches: new Map(),
  stick: null,
  btn: { skill: null, ult: null, dash: null },
  edge: { skill: false, ult: false, dash: false, pause: false },
  touchAim: { skill: null, ult: null },
  usedTouch: false,
  soloKb: true,
  canvas: null,
  enabled: true,
  layout: null,
  rot: false,
  onPause: null,

  init(canvas) {
    this.canvas = canvas;
    addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (!this.keys.has(e.code)) this.pressed.add(e.code);
      this.keys.add(e.code);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      if (e.code === 'Escape' && this.onPause) this.onPause();
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.touches.clear(); this.stick = null; });
    canvas.addEventListener('mousemove', (e) => { this.mouse.x = e.offsetX; this.mouse.y = e.offsetY; this.mouse.t = performance.now(); });
    canvas.addEventListener('mousedown', (e) => {
      this.mouse.x = e.offsetX; this.mouse.y = e.offsetY; this.mouse.t = performance.now();
      if (e.button === 0) this.mouse.l = true;
      if (e.button === 2) this.mouse.r = true;
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    const opt = { passive: false };
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.usedTouch = true; for (const t of e.changedTouches) this.tStart(t); }, opt);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) this.tMove(t); }, opt);
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); for (const t of e.changedTouches) this.tEnd(t); }, opt);
    canvas.addEventListener('touchcancel', (e) => { for (const t of e.changedTouches) this.tEnd(t, true); }, opt);
  },

  // Button positions in CSS pixels, recomputed by the view on resize.
  setLayout(W, H, safe) {
    const s = clamp(Math.min(W, H) / 390, 0.8, 1.35);
    const R = safe ? safe.r : 0, B = safe ? safe.b : 0;
    this.layout = {
      s, W, H,
      skill: { x: W - R - 92 * s, y: H - B - 88 * s, r: 44 * s },
      ult: { x: W - R - 190 * s, y: H - B - 58 * s, r: 36 * s },
      dash: { x: W - R - 66 * s, y: H - B - 186 * s, r: 31 * s },
      pause: { x: W - R - 34 * s, y: 34 * s + (safe ? safe.t : 0), r: 23 * s },
      stickR: 60 * s,
    };
  },

  hitBtn(x, y) {
    const L = this.layout;
    if (!L) return null;
    for (const k of ['skill', 'ult', 'dash', 'pause']) { const b = L[k]; if (dist(x, y, b.x, b.y) < b.r * 1.25) return k; }
    return null;
  },

  // With the game turned sideways on an upright phone, screen x/y map to the game's y/x.
  tPos(t) {
    if (this.rot) return { x: t.clientY, y: innerWidth - t.clientX };
    const r = this.canvas.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  },

  tStart(t) {
    const p = this.tPos(t);
    if (this.touchHook && this.touchHook(p.x, p.y)) return;
    const b = this.hitBtn(p.x, p.y);
    if (b === 'pause') { if (this.onPause) this.onPause(); return; }
    if (b === 'dash') { this.edge.dash = true; this.touches.set(t.identifier, { kind: 'dash' }); return; }
    if (b === 'skill' || b === 'ult') { this.touches.set(t.identifier, { kind: b, x0: p.x, y0: p.y, x: p.x, y: p.y }); this.btn[b] = { x: p.x, y: p.y, dx: 0, dy: 0 }; return; }
    if (!this.stick && p.x < this.layout.W * 0.55) {
      this.stick = { id: t.identifier, x0: p.x, y0: p.y, x: p.x, y: p.y };
      this.touches.set(t.identifier, { kind: 'stick' });
    }
  },

  tMove(t) {
    const tt = this.touches.get(t.identifier);
    if (!tt) return;
    const p = this.tPos(t);
    if (tt.kind === 'stick' && this.stick) {
      this.stick.x = p.x; this.stick.y = p.y;
      const R = this.layout.stickR, d = dist(this.stick.x0, this.stick.y0, p.x, p.y);
      if (d > R * 1.4) { const a = angTo(p.x, p.y, this.stick.x0, this.stick.y0); this.stick.x0 = p.x + Math.cos(a) * R * 1.4; this.stick.y0 = p.y + Math.sin(a) * R * 1.4; }
    } else if (tt.kind === 'skill' || tt.kind === 'ult') {
      tt.x = p.x; tt.y = p.y;
      const b = this.btn[tt.kind];
      if (b) { b.dx = p.x - tt.x0; b.dy = p.y - tt.y0; }
    }
  },

  tEnd(t, cancel) {
    const tt = this.touches.get(t.identifier);
    if (!tt) return;
    this.touches.delete(t.identifier);
    if (tt.kind === 'stick') this.stick = null;
    if (tt.kind === 'skill' || tt.kind === 'ult') {
      const dx = tt.x - tt.x0, dy = tt.y - tt.y0, d = Math.hypot(dx, dy);
      this.btn[tt.kind] = null;
      if (cancel) return;
      if (d > 20) this.touchAim[tt.kind] = { ang: Math.atan2(dy, dx), d: clamp(d / (95 * this.layout.s), 0.15, 1) };
      else this.touchAim[tt.kind] = null;
      this.edge[tt.kind] = true;
    }
  },

  pollPads() {
    let list = [];
    try { list = navigator.getGamepads ? navigator.getGamepads() || [] : []; } catch (e) { list = []; }
    for (let i = 0; i < 4; i++) {
      const g = list[i];
      this.padPrev[i] = this.pads[i] ? this.pads[i].b.slice() : [];
      if (!g || !g.connected) { this.pads[i] = null; continue; }
      this.pads[i] = { ax: g.axes.slice(0, 4), b: g.buttons.map((b) => b.pressed || b.value > 0.5) };
    }
  },

  padDown(i, b) { const p = this.pads[i]; return !!(p && p.b[b]); },
  padHit(i, b) { const p = this.pads[i]; return !!(p && p.b[b] && !(this.padPrev[i] || [])[b]); },

  keyAny(list) { for (const k of list) if (this.keys.has(k)) return true; return false; },
  keyHit(list) { for (const k of list) if (this.pressed.has(k)) return true; return false; },

  map(dev) {
    const m = KEYMAP[dev];
    if (dev === 'kb1' && this.soloKb) {
      const o = {};
      for (const k in m) o[k] = m[k].concat(KB_SOLO[k]);
      return o;
    }
    return m;
  },

  // Reads one device into an input record { mx, my, skill, ult, dash, aim, aimD }.
  read(dev, out) {
    out.skill = out.skill || false;
    out.ult = out.ult || false;
    out.dash = out.dash || false;
    if (!this.enabled) { out.mx = out.my = 0; return out; }
    let mx = 0, my = 0;
    if (dev === 'touch') {
      if (this.stick) {
        const R = this.layout.stickR;
        const dx = this.stick.x - this.stick.x0, dy = this.stick.y - this.stick.y0, d = Math.hypot(dx, dy);
        if (d > 6) { const m = Math.min(1, d / R); mx = dx / d * m; my = dy / d * m; }
      }
      if (this.edge.skill) { out.skill = true; out.aim = this.touchAim.skill ? this.touchAim.skill.ang : null; out.aimD = this.touchAim.skill ? this.touchAim.skill.d : 0; }
      if (this.edge.ult) { out.ult = true; out.aim = this.touchAim.ult ? this.touchAim.ult.ang : null; out.aimD = this.touchAim.ult ? this.touchAim.ult.d : 0; }
      if (this.edge.dash) out.dash = true;
      this.edge.skill = this.edge.ult = this.edge.dash = false;
    } else if (dev.startsWith('kb')) {
      const m = this.map(dev);
      if (this.keyAny(m.left)) mx -= 1;
      if (this.keyAny(m.right)) mx += 1;
      if (this.keyAny(m.up)) my -= 1;
      if (this.keyAny(m.down)) my += 1;
      if (mx && my) { mx *= 0.7071; my *= 0.7071; }
      if (this.keyHit(m.skill)) out.skill = true;
      if (this.keyHit(m.ult)) out.ult = true;
      if (this.keyHit(m.dash)) out.dash = true;
      if (dev === 'kb1') {
        if (this.mouse.l) { out.skill = true; this.mouse.l = false; }
        if (this.mouse.r) { out.ult = true; this.mouse.r = false; }
      }
    } else if (dev.startsWith('pad')) {
      const i = +dev.slice(3), p = this.pads[i];
      if (p) {
        mx = p.ax[0] || 0; my = p.ax[1] || 0;
        const d = Math.hypot(mx, my);
        if (d < 0.22) { mx = my = 0; } else if (d > 1) { mx /= d; my /= d; }
        if (p.b[14]) mx = -1; if (p.b[15]) mx = 1; if (p.b[12]) my = -1; if (p.b[13]) my = 1;
        const rx = p.ax[2] || 0, ry = p.ax[3] || 0;
        if (Math.hypot(rx, ry) > 0.5) { out.aim = Math.atan2(ry, rx); out.aimD = 0.8; out.aimStick = true; }
        if (this.padHit(i, 2) || this.padHit(i, 5)) out.skill = true;
        if (this.padHit(i, 1) || this.padHit(i, 3) || this.padHit(i, 7)) out.ult = true;
        if (this.padHit(i, 0) || this.padHit(i, 4) || this.padHit(i, 6)) out.dash = true;
        if (this.padHit(i, 9) && this.onPause) this.onPause();
      }
    }
    out.mx = mx; out.my = my;
    return out;
  },

  // Edges for menus: { left, right, up, down, ok, alt, back }
  menu(dev) {
    const o = { left: false, right: false, up: false, down: false, ok: false, alt: false };
    if (dev.startsWith('kb')) {
      const m = this.map(dev);
      o.left = this.keyHit(m.left); o.right = this.keyHit(m.right); o.up = this.keyHit(m.up); o.down = this.keyHit(m.down);
      o.ok = this.keyHit(m.skill) || this.keyHit(m.dash) || (dev === 'kb1' && this.keyHit(['Enter']) && !KEYMAP.kb3.ult.includes('Enter'));
      o.alt = this.keyHit(m.ult);
    } else if (dev.startsWith('pad')) {
      const i = +dev.slice(3), p = this.pads[i];
      if (p) {
        const px = p.ax[0] || 0;
        const st = this.padStick || (this.padStick = {});
        const dir = px < -0.6 ? -1 : px > 0.6 ? 1 : 0;
        if (dir !== (st[i] || 0)) { if (dir < 0) o.left = true; if (dir > 0) o.right = true; }
        st[i] = dir;
        if (this.padHit(i, 14)) o.left = true;
        if (this.padHit(i, 15)) o.right = true;
        o.ok = this.padHit(i, 0) || this.padHit(i, 2);
        o.alt = this.padHit(i, 3);
      }
    }
    return o;
  },

  // A device that pressed an action this frame (to join a local game), or null.
  joinPress() {
    for (const dev of ['kb1', 'kb2', 'kb3']) {
      const m = KEYMAP[dev];
      if (this.keyHit(m.skill) || this.keyHit(m.ult) || this.keyHit(m.dash)) return dev;
    }
    for (let i = 0; i < 4; i++) if (this.pads[i] && (this.padHit(i, 0) || this.padHit(i, 2) || this.padHit(i, 9))) return 'pad' + i;
    return null;
  },

  endFrame() { this.pressed.clear(); this.mouse.l = this.mouse.r = false; },
};

// ===== 10-net.js =====
// ---------- Online play: WebRTC between phones (adapted from Blast Squad for up to 4 players) ----------
// Devices connect directly with WebRTC data channels. A PeerJS-compatible signaling server (the free
// public one at 0.peerjs.com by default) only introduces them by room code; no game data goes through it.
// Page URL options: ?signal=host:port (own PeerJS server), ?ice=none, ?lag=MS&loss=PCT (debug)
//   const room = await Net.hostRoom(token, (code) => {...}, (link) => {...}, maxGuests)  // room.close()
//   const link = await Net.joinRoom(code, token)
//   link.send(obj, fast)   link.listen(fn)   link.onclose = (why) => {}   link.rtt
const NET_PREFIX = 'realmraiders-v1-';
const NET_PROTO = 1;
const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET_TIMEOUT = 15000;

const netCode = (n) => { let s = ''; for (let i = 0; i < n; i++) s += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)]; return s; };
const netId = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

function netConfig() {
  const qs = new URLSearchParams(location.search);
  const sig = qs.get('signal');
  let base = 'wss://0.peerjs.com:443/peerjs?key=peerjs';
  if (sig) {
    let u = sig;
    if (!/^wss?:\/\//.test(u)) u = (/^(localhost|127\.|10\.|192\.168\.|\[::1\])/.test(u) ? 'ws://' : 'wss://') + u;
    if (!/\/$/.test(u)) u += '/';
    base = u + 'peerjs?key=' + (qs.get('key') || 'peerjs');
  }
  const ice = qs.get('ice') === 'none' ? [] : [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  ];
  const lag = Math.max(0, +qs.get('lag') || 0), loss = clamp(+qs.get('loss') || 0, 0, 100);
  return { base, ice, lag, loss };
}

class NetError extends Error {
  constructor(code, msg) { super(msg || code); this.code = code; }
}

class Signal {
  constructor(id) { this.id = id; this.ws = null; this.onmsg = null; this.hb = null; this.closed = false; }

  open(timeoutMs) {
    const cfg = netConfig();
    return new Promise((resolve, reject) => {
      let done = false;
      const fail = (code, msg) => { if (done) return; done = true; this.close(); reject(new NetError(code, msg)); };
      const offline = 'Could not reach the matchmaking server. Online play needs an internet connection (it does not work inside the Claude preview; open the GitHub Pages version).';
      const timer = setTimeout(() => fail('offline', offline), timeoutMs || 10000);
      let ws;
      try { ws = new WebSocket(cfg.base + '&id=' + encodeURIComponent(this.id) + '&token=' + netId() + '&version=1.5.4'); } catch (e) { clearTimeout(timer); fail('offline', offline); return; }
      this.ws = ws;
      ws.onmessage = (ev) => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!done) {
          if (m.type === 'OPEN') { done = true; clearTimeout(timer); this.hb = setInterval(() => this.raw({ type: 'HEARTBEAT' }), 5000); resolve(this); }
          else if (m.type === 'ID-TAKEN') { clearTimeout(timer); fail('taken'); }
          else if (m.type === 'ERROR') { clearTimeout(timer); fail('server', 'The matchmaking server refused the connection.'); }
          return;
        }
        if (this.onmsg) this.onmsg(m);
      };
      ws.onerror = () => { clearTimeout(timer); fail('offline', offline); };
      ws.onclose = () => { clearTimeout(timer); if (!done) fail('offline', offline); if (this.hb) clearInterval(this.hb); this.hb = null; };
    });
  }

  raw(m) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); } catch (e) { /* socket gone */ } }
  send(type, dst, payload) { this.raw({ type, dst, payload }); }
  close() {
    if (this.closed) return;
    this.closed = true;
    if (this.hb) clearInterval(this.hb);
    this.hb = null;
    try { if (this.ws) this.ws.close(); } catch (e) { /* already closed */ }
    this.ws = null;
  }
}

class Link {
  constructor(pc, r, u, role, timeout) {
    this.pc = pc; this.r = r; this.u = u; this.role = role;
    this.onmsg = null; this.onclose = null; this.closed = false;
    this.rtt = 0;
    this.timeout = timeout || NET_TIMEOUT;
    this.lastRecv = performance.now();
    this.queue = [];
    this.bytesOut = 0;
    const cfg = netConfig();
    this.lag = cfg.lag; this.loss = cfg.loss; this.rAt = 0;
    const recv = (ev) => {
      this.lastRecv = performance.now();
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === '_p') { this.send({ t: '_q', ts: m.ts }); return; }
      if (m.t === '_q') { this.rtt = performance.now() - m.ts; return; }
      if (this.onmsg) this.onmsg(m); else this.queue.push(m);
    };
    r.onmessage = recv;
    u.onmessage = recv;
    r.onclose = () => this.close('closed');
    pc.onconnectionstatechange = () => { const s = pc.connectionState; if (s === 'failed' || s === 'closed') this.close('lost'); };
    this.pinger = setInterval(() => {
      this.send({ t: '_p', ts: performance.now() });
      if (performance.now() - this.lastRecv > this.timeout) this.close('timeout');
    }, 1000);
  }

  listen(fn) { this.onmsg = fn; const q = this.queue; this.queue = []; for (const m of q) fn(m); }

  send(m, fast) {
    if (this.closed) return 0;
    const ch = fast && this.u.readyState === 'open' ? this.u : this.r;
    if (ch.readyState !== 'open') return 0;
    const s = JSON.stringify(m);
    this.bytesOut += s.length;
    if (!this.lag && !this.loss) { this.put(ch, s); return s.length; }
    if (ch === this.u && Math.random() * 100 < this.loss) return s.length;
    const now = performance.now();
    let at = now + this.lag * (0.8 + Math.random() * 0.4);
    if (ch === this.r) { at = Math.max(at, this.rAt); this.rAt = at; }
    setTimeout(() => { if (!this.closed && ch.readyState === 'open') this.put(ch, s); }, at - now);
    return s.length;
  }

  put(ch, s) { try { ch.send(s); } catch (e) { /* channel closing */ } }

  close(why) {
    if (this.closed) return;
    this.closed = true;
    clearInterval(this.pinger);
    try { this.r.close(); } catch (e) { /* ignore */ }
    try { this.u.close(); } catch (e) { /* ignore */ }
    try { this.pc.close(); } catch (e) { /* ignore */ }
    if (this.onclose) this.onclose(why || 'closed');
  }
}

// An in-page pair of links for tests (no network): latency in ms.
function mockLinkPair(lag) {
  const mk = (role) => ({ role, onmsg: null, onclose: null, closed: false, rtt: (lag || 0) * 2, queue: [], other: null,
    listen(fn) { this.onmsg = fn; const q = this.queue; this.queue = []; for (const m of q) fn(m); },
    send(m) { if (this.closed) return 0; const s = JSON.stringify(m), o = this.other; setTimeout(() => { if (o.closed) return; const v = JSON.parse(s); if (o.onmsg) o.onmsg(v); else o.queue.push(v); }, lag || 0); return s.length; },
    close(why) { if (this.closed) return; this.closed = true; if (this.onclose) this.onclose(why || 'closed'); if (!this.other.closed) this.other.close('closed'); } });
  const a = mk('host'), b = mk('guest');
  a.other = b; b.other = a;
  return [a, b];
}

// Same-computer transport for testing: with ?net=bc two tabs of the game talk over a BroadcastChannel.
const netBc = () => { try { return new URLSearchParams(location.search).get('net') === 'bc' && typeof BroadcastChannel !== 'undefined'; } catch (e) { return false; } };
class BcLink {
  constructor(name, role) {
    this.role = role; this.onmsg = null; this.onclose = null; this.closed = false; this.rtt = 5; this.queue = [];
    this.ch = new BroadcastChannel(name);
    this.ch.onmessage = (ev) => {
      const m = ev.data;
      if (!m || m.from === role) return;
      if (m.close) { this.close('closed'); return; }
      if (this.onmsg) this.onmsg(m.d); else this.queue.push(m.d);
    };
  }
  listen(fn) { this.onmsg = fn; const q = this.queue; this.queue = []; for (const m of q) fn(m); }
  send(m) { if (this.closed) return 0; this.ch.postMessage({ from: this.role, d: m }); return 1; }
  close(why) { if (this.closed) return; this.closed = true; try { this.ch.postMessage({ from: this.role, close: 1 }); this.ch.close(); } catch (e) { /* ignore */ } if (this.onclose) this.onclose(why || 'closed'); }
}

const Net = {
  supported() { return netBc() || (typeof RTCPeerConnection !== 'undefined' && typeof WebSocket !== 'undefined'); },

  token() {
    const t = { cancelled: false, fns: [] };
    t.cancel = () => { if (t.cancelled) return; t.cancelled = true; for (const f of t.fns) { try { f(); } catch (e) { /* ignore */ } } };
    t.on = (f) => { if (t.cancelled) f(); else t.fns.push(f); };
    return t;
  },

  // Opens a room and keeps accepting friends (up to maxGuests) until room.close().
  async hostRoom(token, onCode, onGuest, maxGuests) {
    if (netBc()) {
      const code = netCode(4), lobby = new BroadcastChannel('rr-room-' + code);
      const room = { code, links: [], full: false, close: () => { try { lobby.close(); } catch (e) { /* ignore */ } } };
      lobby.onmessage = (ev) => {
        const m = ev.data;
        if (!m || !m.hello) return;
        if (room.full || room.links.filter((l) => !l.closed).length >= (maxGuests || 3)) { lobby.postMessage({ busy: m.hello }); return; }
        const link = new BcLink('rr-link-' + m.hello, 'host');
        room.links.push(link);
        lobby.postMessage({ welcome: m.hello });
        onGuest(link);
      };
      token.on(() => room.close());
      onCode(code);
      return room;
    }
    for (let i = 0; i < 6; i++) {
      if (token.cancelled) throw new NetError('cancelled');
      const code = netCode(4);
      const sig = new Signal(NET_PREFIX + code);
      token.on(() => sig.close());
      try { await sig.open(12000); } catch (e) { if (e.code === 'taken') continue; throw e; }
      onCode(code);
      return this.acceptGuests(sig, token, onGuest, maxGuests || 3, code);
    }
    throw new NetError('server', 'Could not create a room. Try again.');
  },

  acceptGuests(sig, token, onGuest, maxGuests, code) {
    const cfg = netConfig();
    const peers = new Map();
    const room = { code, links: [], full: false, close: () => { sig.close(); for (const p of peers.values()) if (!p.done) { try { p.pc.close(); } catch (e) { /* ignore */ } } } };
    token.on(() => room.close());
    sig.onmsg = async (m) => {
      const p = m.payload || {};
      if (m.type === 'OFFER') {
        const open = room.links.filter((l) => !l.closed).length;
        if (open >= maxGuests || room.full) { sig.send('LEAVE', m.src, { why: 'busy' }); return; }
        if (p.v !== NET_PROTO) { sig.send('LEAVE', m.src, { why: 'version' }); return; }
        const old = peers.get(m.src);
        if (old && !old.done) { try { old.pc.close(); } catch (e) { /* ignore */ } }
        const pc = new RTCPeerConnection({ iceServers: cfg.ice });
        const ent = { pc, cid: p.cid, chans: {}, pend: [], done: false };
        peers.set(m.src, ent);
        const check = () => {
          if (ent.done) return;
          const c = ent.chans;
          if (c.r && c.u && c.r.readyState === 'open' && c.u.readyState === 'open') {
            ent.done = true;
            const link = new Link(pc, c.r, c.u, 'host');
            room.links.push(link);
            onGuest(link);
          }
        };
        pc.onicecandidate = (ev) => { if (ev.candidate) sig.send('CANDIDATE', m.src, { cid: ent.cid, c: ev.candidate.toJSON() }); };
        pc.ondatachannel = (ev) => { const ch = ev.channel; ent.chans[ch.label] = ch; ch.onopen = check; check(); };
        try {
          await pc.setRemoteDescription(p.sdp);
          for (const c of ent.pend.splice(0)) await pc.addIceCandidate(c).catch(() => {});
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          sig.send('ANSWER', m.src, { cid: ent.cid, sdp: pc.localDescription });
        } catch (e) { try { pc.close(); } catch (e2) { /* ignore */ } peers.delete(m.src); }
      } else if (m.type === 'CANDIDATE') {
        const ent = peers.get(m.src);
        if (!ent || p.cid !== ent.cid) return;
        if (ent.pc.remoteDescription) ent.pc.addIceCandidate(p.c).catch(() => {}); else ent.pend.push(p.c);
      } else if (m.type === 'LEAVE') {
        const ent = peers.get(m.src);
        if (ent && !ent.done) { try { ent.pc.close(); } catch (e) { /* ignore */ } peers.delete(m.src); }
      }
    };
    return room;
  },

  async joinId(hostId, token, timeoutMs) {
    const cfg = netConfig();
    const sig = new Signal(NET_PREFIX + 'g-' + netId());
    token.on(() => sig.close());
    await sig.open(12000);
    return new Promise((resolve, reject) => {
      let done = false;
      const pc = new RTCPeerConnection({ iceServers: cfg.ice });
      const r = pc.createDataChannel('r', { ordered: true });
      const u = pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 });
      const cid = netId();
      const pend = [];
      const finish = (err, link) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (err) { try { pc.close(); } catch (e) { /* ignore */ } sig.close(); reject(err); } else { setTimeout(() => sig.close(), 1500); resolve(link); }
      };
      const timer = setTimeout(() => finish(new NetError('timeout', 'Could not connect to your friend. Check the code, or try another network (Wi-Fi).')), timeoutMs || 20000);
      token.on(() => finish(new NetError('cancelled')));
      const check = () => { if (r.readyState === 'open' && u.readyState === 'open') finish(null, new Link(pc, r, u, 'guest')); };
      r.onopen = check;
      u.onopen = check;
      pc.onicecandidate = (ev) => { if (ev.candidate) sig.send('CANDIDATE', hostId, { cid, c: ev.candidate.toJSON() }); };
      pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') finish(new NetError('failed', 'The connection failed. Your networks may block direct connections; try Wi-Fi.')); };
      sig.onmsg = async (m) => {
        if (m.src !== hostId || done) { if (m.type === 'EXPIRE' && !done) finish(new NetError('notfound', 'Room not found. Check the code and make sure your friend is waiting.')); return; }
        const p = m.payload || {};
        if (m.type === 'ANSWER' && p.cid === cid) {
          try { await pc.setRemoteDescription(p.sdp); for (const c of pend.splice(0)) await pc.addIceCandidate(c).catch(() => {}); } catch (e) { finish(new NetError('failed', 'The connection failed.')); }
        } else if (m.type === 'CANDIDATE' && p.cid === cid) {
          if (pc.remoteDescription) pc.addIceCandidate(p.c).catch(() => {}); else pend.push(p.c);
        } else if (m.type === 'EXPIRE') finish(new NetError('notfound', 'Room not found. Check the code and make sure your friend is waiting.'));
        else if (m.type === 'LEAVE') {
          const why = p.why;
          finish(new NetError(why || 'left', why === 'busy' ? 'That room is full.' : why === 'version' ? 'Your friend is running a different version. Both of you should reload.' : 'The host left the room.'));
