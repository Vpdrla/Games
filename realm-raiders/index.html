<style>

/* blessings */
#offers{pointer-events:auto;align-items:center;justify-content:center;flex-direction:column;gap:.6em;background:radial-gradient(ellipse at center,rgba(40,20,90,.6),rgba(6,4,14,.82))}

#pause,#results{pointer-events:auto;align-items:center;justify-content:center;background:rgba(6,4,14,.75)}

.mbox h1{text-align:center;font-size:2em;font-weight:900}
.mbox .btn{width:100%}
.res{width:min(calc(var(--vw,1vw)*94),44em)}

#toasts{position:absolute;right:calc(var(--sar,0px) + .6em);top:calc(var(--sat,0px) + 3.4em);display:flex;flex-direction:column;gap:.35em;align-items:flex-end;max-width:46%;pointer-events:none;z-index:5}

@keyframes tin{from{transform:translateY(-1em) scale(.9);opacity:0}to{transform:none;opacity:1}}

<body>
<div id="safe-probe"></div>
<div id="app">
<canvas id="game"></canvas>
<div id="ui">
  <div id="menu" class="screen"></div>
  <div id="panel" class="screen"></div>
  <div id="offers" class="screen"></div>
  <div id="pause" class="screen"></div>
  <div id="results" class="screen"></div>
  <div id="toasts"></div>
</div>

<script>
(function () {
// ===== 01-util.js =====
'use strict';
// ---------- Core helpers ----------
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = (id) => document.getElementById(id);

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + this.f() * (b - a); }
  int(a, b) { return Math.floor(a + this.f() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.f() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  weighted(entries) {
    let total = 0;
    for (const e of entries) total += e[1];
    let r = this.f() * total;
    for (const e of entries) {
      r -= e[1];
      if (r <= 0) return e[0];
    }
    return entries[entries.length - 1][0];
  }
}

function shade(hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) {
    r *= 1 + amt; g *= 1 + amt; b *= 1 + amt;
  } else {
    r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt;
  }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function rgba(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 100000) return (n / 1000).toFixed(0) + 'k';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

function fmtDuration(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  if (s >= 60) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return s + 's';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function ellipse(ctx, x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU);
}

function circle(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0.01, r), 0, TAU);
}

// Outlined bold text used all over the battle HUD.
function outlineText(ctx, text, x, y, size, fill, align, stroke) {
  ctx.font = `900 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.24;
  ctx.strokeStyle = stroke || 'rgba(0,0,0,0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill || '#fff';
  ctx.fillText(text, x, y);
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// ---------- Angles & vectors (Blast Squad) ----------
const wrapAng = (a) => { a %= TAU; return a < -Math.PI ? a + TAU : a > Math.PI ? a - TAU : a; }; // to [-PI, PI]
const angDiff = (a, b) => wrapAng(b - a); // signed shortest turn from a to b
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const len2 = (x, y) => x * x + y * y;

// ===== 02b-lang.js =====
// ---------- Languages: English and Korean ----------
// Text is written in English in the code and translated on display with tr(). Text that arrives
// from the simulation (banners, room labels, pop-ups) goes through trx(), which also understands
// labels with numbers and names in them. Each device shows its own language, also online.

const Lang = { ko: false };

function langAuto() {
  try { return /^ko/i.test(navigator.language || '') || (navigator.languages || []).some((l) => /^ko/i.test(l)); } catch (e) { return false; }
}

function setLang(code) {
  Lang.ko = code === 'ko' || (code === 'auto' && langAuto());
  try { document.documentElement.lang = Lang.ko ? 'ko' : 'en'; } catch (e) { /* no document */ }
}

function fillParams(s, p) {
  if (!p) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (p[k] != null ? p[k] : m));
}

// Korean particles that depend on the last syllable of a name: 이/가, 은/는, 을/를, (으)로.
function josa(s) {
  const fin = (ch) => { const c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c <= 11171 ? c % 28 : -1; };
  return s
    .replace(/([가-힣])((?:<\/b>)?)이\(가\)/g, (m, ch, b) => ch + b + (fin(ch) > 0 ? '이' : '가'))
    .replace(/([가-힣])((?:<\/b>)?)\(으\)로/g, (m, ch, b) => ch + b + (fin(ch) > 0 && fin(ch) !== 8 ? '으로' : '로'));
}

// Translate a fixed English text (with optional {params}).
function tr(s, p) {
  if (s == null) return '';
  if (Lang.ko) { const k = KO[s]; if (k != null) return p ? josa(fillParams(k, p)) : k; }
  const e = EN[s];
  return fillParams(e != null ? e : s, p);
}

let KO_LOWER = null;
function trName(s) {
  if (!Lang.ko) return s;
  if (KO[s] != null) return KO[s];
  if (!KO_LOWER) { KO_LOWER = {}; for (const k in KO) KO_LOWER[k.toLowerCase()] = KO[k]; }
  const v = KO_LOWER[String(s).toLowerCase()];
  return v != null ? v : s;
}

// Translate text built by the game ("Whispering Woods · Room 3/7", "FLOOR 5 CLEARED", ...).
function trx(s) {
  if (!Lang.ko || s == null || s === '') return s == null ? '' : s;
  s = String(s);
  if (s.includes(' · ')) return s.split(' · ').map(trx).join(' · ');
  const n = trName(s);
  if (n !== s) return n;
  for (const [re, f] of KO_PAT) { const m = s.match(re); if (m) return f(m); }
  return s;
}

const KO_PAT = [
  [/^Room (\d+)\/(\d+)$/, (m) => '방 ' + m[1] + '/' + m[2]],
  [/^Room (\d+)$/, (m) => m[1] + '번 방'],
  [/^Floor (\d+)$/, (m) => m[1] + '층'],
  [/^FLOOR (\d+) CLEARED$/, (m) => m[1] + '층 돌파!'],
  [/^(.+) IS ENRAGED!$/, (m) => trName(m[1]) + ', 분노하다!'],
  [/^(.+) falls$/, (m) => trName(m[1]) + ' 처치!'],
  [/^(.+) WINS!$/, (m) => trName(m[1]) + ' 승리!'],
  [/^first to (\d+)$/, (m) => m[1] + '점 선취'],
  [/^(\d+)x MULTI-KILL!$/, (m) => m[1] + '연속 처치!'],
  [/^Gamepad (\d)$/, (m) => '게임패드 ' + m[1]],
  [/^Player (\d)$/, (m) => '플레이어 ' + m[1]],
  [/^Joining room (\w+)\.\.\.$/, (m) => m[1] + ' 방에 들어가는 중...'],
];

// Item names are built from parts, so they are rebuilt in Korean word order.
function itemName(it) {
  if (it.uniq) return tr(UNIQUE_BY_ID[it.uniq].name);
  if (!Lang.ko) return it.name;
  const parts = String(it.name).split(' ');
  const pre = parts[0], base = parts[1] || it.base, suf = parts.slice(2).join(' ');
  return (suf ? tr(suf) + ' ' : '') + tr(pre) + ' ' + tr(base);
}

// ===== 03-world.js =====
// ---------- World: the combat simulation ----------
// One World runs a room (or an arena) at a fixed 60 Hz. It owns every unit, projectile, area and
// pickup, and pushes events (w.ev) that the renderer, sound and the online sync consume.
// Teams: heroes and their summons are team 0 in adventures; monsters are team 1. In the arena every
// side has its own team number.

const isFoe = (a, b) => a.team !== b.team;
const alive = (u) => !u.dead && !u.downed && !u.ko;

function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l = dx * dx + dy * dy;
  let t = l > 0 ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const x = ax + dx * t - px, y = ay + dy * t - py;
  return x * x + y * y;
}

function newStatus() {
  return { burn: 0, burnDps: 0, burnT: 0, burnSrc: null, poison: 0, poisonN: 0, poisonDps: 0, poisonT: 0, poisonSrc: null,
    slow: 0, slowAmt: 0, freeze: 0, stun: 0, root: 0, taunt: 0, tauntSrc: null, invis: 0, invuln: 0, voidMark: 0, cc: 0 };
}

class World {
  constructor(cfg) {
    this.cfg = cfg || {};
    this.rng = new RNG(this.cfg.seed || 12345);
    this.t = 0;
    this.tick = 0;
    this.units = [];
    this.projs = [];
    this.areas = [];
    this.picks = [];
    this.ev = [];
    this.nid = 1;
    this.players = [];
    this.room = null;
    this.mode = null;
    this.timeStop = null;
    this.combo = { n: 0, t: 0 };
    this.multi = { n: 0, t: 0 };
    this.gold = 0;
    this.teamFlags = {};
    this.arena = false;
    this.stats = { kills: 0, elites: 0, bosses: 0, ults: 0, gold: 0, chests: 0, rooms: 0, blessings: 0, revives: 0, abyss: 0,
      bestCombo: 0, bestMulti: 0, flawless: 0, bossNoDown: 0, legBless: 0, maxBless: 0, downs: 0 };
    this.hurtThisRoom = false;
  }

  emit(...a) { this.ev.push(a); }
  rand() { return this.rng.next(); }

  // ---------- room ----------
  setRoom(room) {
    this.room = room;
    this.projs.length = 0;
    this.areas.length = 0;
    this.picks.length = 0;
    this.units = this.units.filter((u) => u.kind === 'hero' || (u.kind === 'summon' && u.keep));
  }

  bounds(r) {
    const W = this.room ? this.room.w : ROOM_W, H = this.room ? this.room.h : ROOM_H;
    return { x0: 28 + r, y0: 28 + r, x1: W - 28 - r, y1: H - 28 - r };
  }

  // ---------- units ----------
  newUnit(kind, team, x, y, r) {
    const u = { id: this.nid++, kind, team, x, y, px: x, py: y, r, baseR: r, hp: 1, maxHp: 1, shield: 0, dead: false,
      ang: -Math.PI / 2, mx: 0, my: 0, kx: 0, ky: 0, spd: 100, spdMul: 1, mass: 1, flash: 0, st: newStatus(),
      buffs: [], bf: { dmg: 0, as: 0, ms: 0, dr: 0, ls: 0, size: 0, crit: 0 }, anim: 0, animK: 0, born: this.t };
    this.units.push(u);
    return u;
  }

  spawnHero(pl, x, y) {
    const h = HERO_BY_ID[pl.hero];
    const u = this.newUnit('hero', pl.team || 0, x, y, HERO_R);
    u.hero = h;
    u.pl = pl;
    u.kit = KITS[h.id];
    u.lvl = pl.lvl || 1;
    u.load = pl.load || { mods: {}, uniq: [] };
    u.bless = {};
    u.blessN = 0;
    u.cd = { skill: 1.2, dash: 0, skillMax: h.skill.cd };
    u.ult = pl.ultStart || 0;
    u.atkT = 0.3;
    u.basicN = 0;
    u.input = { mx: 0, my: 0, skill: false, ult: false, dash: false, aim: null, aimD: 0 };
    u.hist = [];
    u.histT = 0;
    u.lastHurt = -99;
    u.lastAtk = -99;
    u.downed = false;
    u.bleed = 0;
    u.reviveP = 0;
    u.counters = { crits: 0, storm: 0, ws: 0, rez: 0, swUsed: false, bulT: 0, stoneT: 0, frostT: 0 };
    u.mass = 3;
    u.target = null;
    u.channel = null;
    u.dash = null;
    u.ko = false;
    u.ccImmune = 0;
    u.summons = [];
    u.kos = 0; u.streak = 0; u.deaths = 0;
    this.recalc(u, true);
    u.counters.rez = (u.s.uq.has('phoenix') ? 1 : 0) + (pl.ankh ? 1 : 0);
    pl.unit = u;
    const f = this.teamFlags[u.team] || (this.teamFlags[u.team] = {});
    if (h.id === 'rime') f.shatter = true;
    if (h.id === 'vex') f.venom = true;
    if (h.id === 'ember') f.combust = true;
    return u;
  }

  // Rebuild a hero's stats from level, gear, camp upgrades and blessings.
  recalc(u, fill) {
    const h = u.hero, L = u.load || {}, M = L.mods || {};
    const B = {};
    for (const id in u.bless) {
      const b = BLESS_BY_ID[id];
      for (const k in b.m) B[k] = (B[k] || 0) + b.m[k] * u.bless[id];
    }
    const g = (k) => (M[k] || 0) + (B[k] || 0);
    const lv = (u.lvl || 1) - 1;
    const uq = new Set(L.uniq || []);
    const s = { uq };
    s.dmg = (1 + 0.06 * lv) * Math.max(0.2, 1 + g('dmg'));
    s.hpMul = (1 + 0.07 * lv) * Math.max(0.3, 1 + g('hp') + (uq.has('titan') ? 0.4 : 0));
    s.as = Math.max(0.3, 1 + g('as') + (h.id === 'chrona' ? 0.1 : 0));
    s.ms = clamp(1 + g('ms') + (uq.has('windcloak') ? 0.15 : 0), 0.6, 1.8);
    s.crit = 0.05 + g('crit') + (h.id === 'nyx' ? 0.25 : 0);
    s.critDmg = (h.id === 'nyx' ? 2.2 : 1.6) + g('critDmg');
    s.cdr = g('cdr') + (h.id === 'chrona' ? 0.15 : 0) + (uq.has('chrono') ? 0.2 : 0);
    s.ult = g('ult');
    s.ls = g('ls') + (uq.has('fang') ? 0.08 : 0);
    s.thorns = g('thorns') + (uq.has('thornmail') ? 0.8 : 0);
    s.dr = Math.min(0.8, 1 - (1 - h.armor) * (1 - clamp(g('armor'), 0, 0.6)) * (uq.has('titan') ? 0.9 : 1));
    s.regen = g('regen');
    s.gold = g('gold') + (uq.has('midas') ? 0.6 : 0);
    for (const k of ['multi', 'pierce', 'pIgnite', 'pChill', 'pStatic', 'pToxic', 'exec', 'bulwark', 'blades', 'wisps', 'echo', 'nova', 'ultDmg', 'size', 'secondwind', 'phoenix', 'storm', 'midas', 'avatar', 'twin']) s[k] = B[k] || 0;
    if (uq.has('stormring')) s.pStatic += 0.1;
    const arenaHp = this.arena ? 2.4 : 1;
    const oldMax = u.maxHp;
    u.s = s;
    u.maxHp = Math.round(h.hp * s.hpMul * arenaHp);
    if (fill || u.downed) u.hp = u.maxHp;
    else u.hp = clamp(u.hp + Math.max(0, u.maxHp - oldMax), 1, u.maxHp);
    u.spd = h.spd * s.ms;
    u.baseR = HERO_R * (1 + s.size);
    u.r = u.baseR * (1 + u.bf.size);
    u.ultScale = Math.max(1, h.basic.dmg * s.dmg / 2.2);
    if (!fill && u.s.phoenix && !u.counters.phoenixGiven) { u.counters.phoenixGiven = true; u.counters.rez++; }
    // spirit wisps follow their hero
    if (!this.arena || true) {
      u.summons = u.summons.filter((m) => !m.dead);
      const have = u.summons.filter((m) => m.stype === 'wisp').length;
      for (let i = have; i < s.wisps; i++) this.spawnSummon(u, 'wisp', u.x, u.y);
    }
  }

  addBlessing(u, id) {
    u.bless[id] = (u.bless[id] || 0) + 1;
    u.blessN++;
    this.stats.blessings++;
    if (BLESS_BY_ID[id].rar >= 3) this.stats.legBless++;
    this.stats.maxBless = Math.max(this.stats.maxBless, u.blessN);
    this.recalc(u, false);
  }

  spawnMob(id, x, y, mult, elite) {
    const d = MOBS[id];
    const u = this.newUnit('mob', 1, x, y, d.r);
    u.mob = d;
    u.mid = id;
    u.mult = { hp: mult.hp, dmg: mult.dmg };
    u.elite = elite || null;
    let hp = d.hp * mult.hp;
    u.spd = d.spd * (0.92 + this.rand() * 0.16);
    u.mass = d.heavy ? 4 : 1;
    u.heavy = !!d.heavy;
    u.flyer = !!d.flyer;
    if (elite) {
      hp *= 3.6;
      u.r = u.baseR = d.r * 1.35;
      u.mass *= 2;
      if (elite === 'swift') u.spd *= 1.45;
      if (elite === 'brutal') u.mult.dmg *= 1.6;
      if (elite === 'armored') hp *= 1.4;
    }
    u.maxHp = u.hp = Math.round(hp);
    if (d.shield) u.shield = u.maxShield = Math.round(u.maxHp * d.shield);
    u.ai = { cd: 0.6 + this.rand() * 1.4, state: 'move', t: 0, tgt: null, retarget: 0, strafe: this.rand() < 0.5 ? 1 : -1, wob: this.rand() * TAU };
    u.contactT = {};
    return u;
  }

  spawnBoss(id, x, y, mult) {
    const d = BOSSES[id];
    const u = this.newUnit('boss', 1, x, y, d.r);
    u.boss = d;
    u.bid = id;
    u.mult = { hp: mult.hp, dmg: mult.dmg };
    u.maxHp = u.hp = Math.round(d.hp * mult.hp);
    u.spd = d.spd;
    u.mass = 50;
    u.heavy = true;
    u.ai = { cd: 2, move: null, t: 0, phase: 1, last: '', tgt: null, retarget: 0, spin: 0 };
    u.contactT = {};
    return u;
  }

  // stype: skeleton | champion | turret | wisp
  spawnSummon(owner, stype, x, y, o) {
    o = o || {};
    const u = this.newUnit('summon', owner.team, x, y, stype === 'champion' ? 18 : stype === 'turret' ? 15 : stype === 'wisp' ? 9 : 14);
    u.owner = owner;
    u.stype = stype;
    u.pow = owner.s ? owner.s.dmg : 1;
    const hpBase = { skeleton: 130, champion: 320, turret: 220, wisp: 1 }[stype];
    u.maxHp = u.hp = Math.round(hpBase * (owner.s ? owner.s.hpMul : 1) * (this.arena ? 1.5 : 1));
    u.spd = { skeleton: 175, champion: 165, turret: 0, wisp: 260 }[stype];
    u.life = o.life || (stype === 'wisp' ? 1e9 : 15);
    u.atkT = 0.5;
    u.mass = stype === 'turret' ? 99 : 1;
    u.untargetable = stype === 'wisp';
    u.flyer = stype === 'wisp';
    u.keep = stype === 'wisp';
    u.ai = { tgt: null, retarget: 0 };
    owner.summons.push(u);
    return u;
  }

  heroes() { return this.units.filter((u) => u.kind === 'hero'); }

  // ---------- queries ----------
  foesIn(team, x, y, r, fn) {
    const out = [];
    for (const u of this.units) {
      if (u.team === team || !alive(u) || u.untargetable) continue;
      const rr = r + u.r;
      if (dist2(x, y, u.x, u.y) <= rr * rr && (!fn || fn(u))) out.push(u);
    }
    return out;
  }

  alliesIn(team, x, y, r, heroesOnly) {
    const out = [];
    for (const u of this.units) {
      if (u.team !== team || !alive(u) || u.untargetable) continue;
      if (heroesOnly && u.kind !== 'hero') continue;
      const rr = r + u.r;
      if (dist2(x, y, u.x, u.y) <= rr * rr) out.push(u);
    }
    return out;
  }

  foesInLine(team, x, y, ang, len, wid) {
    const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    return this.units.filter((u) => u.team !== team && alive(u) && !u.untargetable && segDist2(u.x, u.y, x, y, ex, ey) <= (wid / 2 + u.r) * (wid / 2 + u.r));
  }

  foesInCone(team, x, y, ang, range, arc) {
    return this.units.filter((u) => {
      if (u.team === team || !alive(u) || u.untargetable) return false;
      const d = dist(x, y, u.x, u.y);
      if (d > range + u.r) return false;
      if (d < u.r + 4) return true;
      return Math.abs(angDiff(ang, angTo(x, y, u.x, u.y))) <= arc / 2 + Math.atan2(u.r, d);
    });
  }

  nearestFoe(u, range, fn) {
    let best = null, bd = range * range;
    for (const o of this.units) {
      if (o.team === u.team || !alive(o) || o.untargetable) continue;
      if (o.kind === 'hero' && o.st.invis > 0 && u.kind !== 'hero') continue;
      if (fn && !fn(o)) continue;
      const rr = range + o.r;
      const d = dist2(u.x, u.y, o.x, o.y);
      if (d <= rr * rr && d < bd + rr * rr - range * range) { bd = d; best = o; }
    }
    return best;
  }

  flag(u, f) { return !!(u && this.teamFlags[u.team] && this.teamFlags[u.team][f]); }

  timeFrozen(team) { return this.timeStop && this.timeStop.t > 0 && team !== this.timeStop.team; }

  lyraNear(u) {
    for (const o of this.units) if (o.kind === 'hero' && o.team === u.team && o.hero.id === 'lyra' && alive(o) && dist2(o.x, o.y, u.x, u.y) < 220 * 220) return true;
    return false;
  }

  // Shared aim for skills and ultimates: manual aim if given, else the best target in range.
  aim(u, range, wantCluster) {
    const inp = u.input || {};
    if (inp.aim != null) {
      const d = inp.aimD ? clamp(inp.aimD, 0.15, 1) * range : range * 0.75;
      return { ang: inp.aim, x: u.x + Math.cos(inp.aim) * d, y: u.y + Math.sin(inp.aim) * d, tgt: null };
    }
    let tgt = null;
    if (wantCluster) {
      let best = 0;
      for (const o of this.units) {
        if (o.team === u.team || !alive(o) || o.untargetable) continue;
        const d = dist(u.x, u.y, o.x, o.y);
        if (d > range * 1.15) continue;
        let sc = o.kind === 'boss' ? 6 : o.elite ? 3 : 1;
        for (const p of this.units) if (p !== o && p.team === o.team && alive(p) && dist2(p.x, p.y, o.x, o.y) < 120 * 120) sc++;
        sc -= d / range;
        if (sc > best) { best = sc; tgt = o; }
      }
    } else tgt = (u.target && alive(u.target) && dist(u.x, u.y, u.target.x, u.target.y) < range * 1.15) ? u.target : this.nearestFoe(u, range * 1.15);
    if (tgt) {
      const a = angTo(u.x, u.y, tgt.x, tgt.y);
      return { ang: a, x: tgt.x, y: tgt.y, tgt };
    }
    return { ang: u.ang, x: u.x + Math.cos(u.ang) * range * 0.6, y: u.y + Math.sin(u.ang) * range * 0.6, tgt: null };
  }

  // ---------- damage ----------
  dmgPow(src, o) {
    if (!src) return 1;
    if (src.kind === 'hero') {
      let m = src.s.dmg * (1 + src.bf.dmg);
      if (o.kind === 'ult') m *= 1 + src.s.ultDmg;
      if (src.hero.id === 'krag') m *= 1 + 0.5 * (1 - src.hp / src.maxHp);
      if (this.lyraNear(src)) m *= 1.1;
      return m;
    }
    if (src.kind === 'summon') return src.pow * (1 + (src.owner ? src.owner.bf.dmg : 0));
    return src.mult ? src.mult.dmg : 1;
  }

  // amt is the base value of the attack; o: { kind: basic|skill|ult|proc|dot|mob, raw, noCrit, knock, ka, fx, dist }
  hit(src, tgt, amt, o) {
    o = o || {};
    if (!tgt || tgt.dead || tgt.downed || tgt.ko) return 0;
    if (tgt.st.invuln > 0) return 0;
    if (!o.raw) amt *= this.dmgPow(src, o);
    let crit = false;
    const hsrc = src && src.kind === 'hero' ? src : null;
    if (hsrc && !o.noCrit) {
      let c = hsrc.s.crit + hsrc.bf.crit;
      if (hsrc.counters.crits > 0 && o.kind === 'basic') { c = 1; hsrc.counters.crits--; }
      if (this.rand() < c) { crit = true; amt *= hsrc.s.critDmg; }
      if (hsrc.s.exec && tgt.hp < tgt.maxHp * 0.3) amt *= 1 + hsrc.s.exec;
      if (hsrc.s.uq.has('voidorb') && (tgt.kind === 'boss' || tgt.elite)) amt *= 1.25;
      if (hsrc.hero.id === 'drakon' && tgt.st.burn > 0) amt *= 1.15;
      if (hsrc.hero.id === 'hawke') amt *= 1 + clamp((dist(hsrc.x, hsrc.y, tgt.x, tgt.y) - 150) / 900, 0, 0.3);
    }
    if (tgt.st.freeze > 0 && this.flag(src, 'shatter')) amt *= 1.4;
    if (tgt.st.voidMark > 0 && src && src.team !== tgt.team) amt *= 1.25;
    if (tgt.kind === 'hero') {
      if (tgt.hero.id === 'gale' && !o.noDodge && o.kind !== 'dot' && this.rand() < 0.15) { this.emit('text', tgt.x, tgt.y - 28, 'DODGE', '#9be7ff', 13); return 0; }
      amt *= (1 - tgt.s.dr) * (1 - clamp(tgt.bf.dr, 0, 0.8));
      if (src && src.kind !== 'hero' && src.st.poison > 0 && this.flag(tgt, 'venom')) amt *= 0.8;
      if (this.arena && src && src.kind === 'hero') amt *= 0.85;
    } else if (tgt.elite === 'armored') amt *= 0.7;
    if (tgt.kind === 'boss' && tgt.ai.shielded) amt *= 0.25;
    amt = Math.max(1, amt);
    let left = amt;
    if (tgt.shield > 0) { const a = Math.min(tgt.shield, left); tgt.shield -= a; left -= a; }
    tgt.hp -= left;
    tgt.flash = 0.12;
    const shown = Math.round(amt);
    const ht = tgt.kind === 'hero' ? tgt.team + 1 : 0;
    if (o.kind === 'dot') this.emit('dmg', tgt.x, tgt.y - tgt.r, shown, 0, ht, o.fx === 'poison' ? 2 : 3);
    else this.emit('dmg', tgt.x + (this.rand() - 0.5) * tgt.r, tgt.y - tgt.r, shown, crit ? 1 : 0, ht, 0);
    if (tgt.kind === 'hero') {
      tgt.lastHurt = this.t;
      tgt.counters.stoneT = 0;
      tgt.ult = Math.min(100, tgt.ult + amt / tgt.maxHp * 22);
      if (tgt.team === 0) this.hurtThisRoom = true;
      if (src && src.team !== tgt.team && src.kind !== 'hero' && tgt.s.uq.has('frostheart')) this.slow(src, 0.4, 2);
      if (tgt.s.uq.has('frostheart') && tgt.hp < tgt.maxHp * 0.3 && this.t - tgt.counters.frostT > 15) {
        tgt.counters.frostT = this.t;
        for (const f of this.foesIn(tgt.team, tgt.x, tgt.y, 170)) this.freeze(f, 2);
        this.emit('ring', tgt.x, tgt.y, 170, '#a8eaff');
      }
      if (tgt.s.thorns > 0 && src && src.kind !== 'hero' && !o.thorn && o.kind !== 'dot' && alive(src)) this.hit(tgt, src, amt * tgt.s.thorns, { raw: true, kind: 'proc', thorn: true, noCrit: true });
    }
    // attacker side effects
    const owner = hsrc || (src && src.kind === 'summon' ? src.owner : null);
    if (owner && owner.kind === 'hero') {
      if (o.kind !== 'ult') {
        const mul = o.kind === 'dot' ? 0.35 : hsrc ? 1 : 0.5;
        owner.ult = Math.min(100, owner.ult + clamp(amt / owner.ultScale, 0, 7) * (1 + owner.s.ult) * mul * (this.arena ? 0.7 : 1));
      }
      if (hsrc && o.kind !== 'dot') {
        const ls = hsrc.s.ls + hsrc.bf.ls;
        if (ls > 0) this.heal(hsrc, amt * ls);
        if (crit && hsrc.s.uq.has('fang')) this.heal(hsrc, hsrc.maxHp * 0.02);
      }
      if (hsrc && (o.kind === 'basic' || o.kind === 'skill') && !o.noProc) this.procs(hsrc, tgt, o);
      if (tgt.team !== owner.team && owner.team === 0 && o.kind !== 'dot') { this.combo.n++; this.combo.t = 2.4; if (this.combo.n > this.stats.bestCombo) this.stats.bestCombo = this.combo.n; }
    }
    if (o.knock && !tgt.heavy && tgt.kind !== 'boss' && tgt.kind !== 'summon' || (o.knock && tgt.kind === 'summon' && tgt.stype !== 'turret')) {
      const a = o.ka != null ? o.ka : src ? angTo(src.x, src.y, tgt.x, tgt.y) : 0;
      const f = o.knock / (tgt.mass || 1) * (tgt.kind === 'hero' ? 0.5 : 1);
      tgt.kx += Math.cos(a) * f * 3;
      tgt.ky += Math.sin(a) * f * 3;
    }
    if (tgt.elite === 'vampiric' && src) this.heal(tgt, 0);
    if (src && src.elite === 'vampiric' && tgt.team !== src.team) this.heal(src, amt * 0.5);
    if (tgt.hp <= 0) this.onZero(tgt, src, o);
    return amt;
  }

  procs(h, tgt, o) {
    const s = h.s, base = h.hero.basic.dmg;
    if (s.pIgnite && this.rand() < s.pIgnite) this.burn(tgt, h, 3, base * 0.35 * s.dmg);
    if (s.uq.has('emberblade')) this.burn(tgt, h, 2.5, base * 0.25 * s.dmg);
    if (s.pChill && this.rand() < s.pChill) this.slow(tgt, 0.35, 1.6);
    if (s.pToxic && this.rand() < s.pToxic) this.poison(tgt, h, 1, base * 0.16 * s.dmg);
    if (s.pStatic && this.rand() < s.pStatic) this.chain(h, tgt, base * 0.7, 3, 170, { kind: 'proc' });
    if (s.storm && o.kind === 'basic') {
      h.counters.storm++;
      if (h.counters.storm % 3 === 0) this.strike(h, tgt.x, tgt.y, 46, base * 1.4, '#fff36a');
    }
    if (s.uq.has('worldsplit') && o.kind === 'basic') {
      h.counters.ws++;
      if (h.counters.ws % 5 === 0) {
        for (const f of this.foesIn(h.team, tgt.x, tgt.y, 120)) this.hit(h, f, base * 1.2, { kind: 'proc', knock: 120 });
        this.emit('ring', tgt.x, tgt.y, 120, '#ffd23f');
      }
    }
    if (h.hero.id === 'sol' && o.kind === 'basic') {
      let low = null, lr = 1;
      for (const a of this.alliesIn(h.team, h.x, h.y, 320, true)) { const r = a.hp / a.maxHp; if (r < lr) { lr = r; low = a; } }
      if (low) { this.heal(low, low.maxHp * 0.025); this.emit('zap', h.x, h.y, low.x, low.y, '#fff1a0', 0); }
    }
  }

  // instant lightning strike at a point (proc damage)
  strike(src, x, y, r, dmg, color) {
    for (const f of this.foesIn(src.team, x, y, r)) this.hit(src, f, dmg, { kind: 'proc' });
    this.emit('bolt', x, y, color || '#fff36a');
  }

  chain(src, first, dmg, jumps, range, o) {
    let cur = first;
    const hitSet = new Set([first.id]);
    let fx = src.x, fy = src.y, d = dmg;
    for (let i = 0; i <= jumps && cur; i++) {
      this.emit('zap', fx, fy, cur.x, cur.y, '#fff36a', 1);
      this.hit(src, cur, d, Object.assign({ noProc: i > 0 }, o));
      fx = cur.x; fy = cur.y;
      hitSet.add(cur.id);
      d *= 0.85;
      let next = null, bd = range * range;
      for (const u of this.units) {
        if (u.team === src.team || !alive(u) || hitSet.has(u.id) || u.untargetable) continue;
        const dd = dist2(fx, fy, u.x, u.y);
        if (dd < bd) { bd = dd; next = u; }
      }
      cur = next;
    }
  }

  onZero(u, src, o) {
    if (u.kind === 'hero') {
      if (this.arena) { u.hp = 0; this.mode.onKO(u, src); return; }
      if (u.s.secondwind && !u.counters.swUsed) {
        u.counters.swUsed = true;
        u.hp = 1;
        u.st.invuln = 2;
        this.emit('text', u.x, u.y - 34, 'SECOND WIND', '#ffd23f', 16);
        return;
      }
      this.down(u);
      return;
    }
    if (u.dead) return;
    u.dead = true;
    u.hp = 0;
    if (this.mode && this.mode.onKill) this.mode.onKill(u, src, o);
  }

  down(u) {
    u.downed = true;
    u.hp = 0;
    u.shield = 0;
    u.bleed = BLEED_TIME;
    u.reviveP = 0;
    u.channel = null;
    u.dash = null;
    u.st = newStatus();
    u.buffs.length = 0;
    this.stats.downs++;
    this.emit('down', u.id, u.x, u.y);
    if (u.counters.rez > 0) { u.counters.rez--; u.autoRev = 1.4; }
    if (this.mode && this.mode.onDown) this.mode.onDown(u);
  }

  revive(u, frac, by) {
    if (!u.downed && !u.deadOut) return;
    u.downed = false;
    u.deadOut = false;
    u.autoRev = 0;
    u.hp = Math.max(1, Math.round(u.maxHp * frac));
    u.st.invuln = 1.6;
    u.reviveP = 0;
    this.emit('revive', u.id, u.x, u.y);
    if (by && by !== u && by.team === 0) this.stats.revives++;
  }

  heal(u, amt) {
    if (!u || u.dead || u.downed || u.ko || amt <= 0) return;
    const before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + amt);
    const got = u.hp - before;
    if (got > 0 && u.kind === 'hero') {
      u.healAcc = (u.healAcc || 0) + got;
    }
  }

  shieldUp(u, amt, dur) {
    u.shield = Math.max(u.shield, amt);
    u.shieldT = Math.max(u.shieldT || 0, dur || 6);
  }

  // ---------- statuses ----------
  ccScale(t) { return t.kind === 'boss' ? 0.25 : t.kind === 'hero' ? 0.5 : t.heavy || t.elite ? 0.6 : 1; }
  burn(t, src, dur, dps) {
    if (!t || t.dead || (t.kind === 'hero' && t.hero.id === 'drakon')) return;
    if (t.st.burn <= 0) t.st.burnDps = 0;
    t.st.burn = Math.max(t.st.burn, dur);
    t.st.burnDps = Math.max(t.st.burnDps, dps);
    t.st.burnSrc = src;
  }
  poison(t, src, stacks, dps) {
    if (!t || t.dead) return;
    if (t.st.poison <= 0) { t.st.poisonN = 0; t.st.poisonDps = 0; }
    t.st.poisonN = Math.min(12, t.st.poisonN + stacks);
    t.st.poison = 4.5;
    t.st.poisonDps = Math.max(t.st.poisonDps, dps);
    t.st.poisonSrc = src;
  }
  slow(t, amt, dur) {
    if (!t || t.dead) return;
    if (t.kind === 'boss') amt *= 0.5;
    if (t.st.slow <= 0 || amt >= t.st.slowAmt) t.st.slowAmt = amt;
    t.st.slow = Math.max(t.st.slow, dur);
  }
  freeze(t, dur) {
    if (!t || t.dead || t.ccImmune > 0) return;
    t.st.freeze = Math.max(t.st.freeze, dur * this.ccScale(t));
  }
  stun(t, dur) {
    if (!t || t.dead || t.ccImmune > 0) return;
    t.st.stun = Math.max(t.st.stun, dur * this.ccScale(t));
  }
  root(t, dur) {
    if (!t || t.dead || t.ccImmune > 0) return;
    t.st.root = Math.max(t.st.root, dur * this.ccScale(t));
  }
  taunt(t, src, dur) {
    if (!t || t.dead || t.kind === 'hero') return;
    t.st.taunt = dur * (t.kind === 'boss' ? 0.4 : 1);
    t.st.tauntSrc = src;
  }
  buff(u, id, t, mods) {
    const b = u.buffs.find((x) => x.id === id);
    if (b) { b.t = Math.max(b.t, t); Object.assign(b, mods); return; }
    u.buffs.push(Object.assign({ id, t }, mods));
  }

  tickStatus(u, dt) {
    const st = u.st;
    if (st.slow > 0) st.slow -= dt;
    if (st.freeze > 0) st.freeze -= dt;
    if (st.stun > 0) st.stun -= dt;
    if (st.root > 0) st.root -= dt;
    if (st.taunt > 0) st.taunt -= dt;
    if (st.invis > 0) st.invis -= dt;
    if (st.invuln > 0) st.invuln -= dt;
    if (st.voidMark > 0) st.voidMark -= dt;
    if (u.ccImmune > 0) u.ccImmune -= dt;
    if (u.flash > 0) u.flash -= dt;
    if (u.shieldT > 0) { u.shieldT -= dt; if (u.shieldT <= 0) u.shield = u.kind === 'mob' && u.maxShield ? u.shield : 0; }
    if (st.burn > 0) {
      st.burn -= dt;
      st.burnT += dt;
      if (st.burnT >= 0.5) { st.burnT -= 0.5; this.hit(st.burnSrc, u, st.burnDps * 0.5, { raw: true, kind: 'dot', noCrit: true, fx: 'burn' }); }
    }
    if (st.poison > 0 && !u.dead) {
      st.poison -= dt;
      st.poisonT += dt;
      if (st.poisonT >= 0.5) { st.poisonT -= 0.5; this.hit(st.poisonSrc, u, st.poisonDps * st.poisonN * 0.5, { raw: true, kind: 'dot', noCrit: true, fx: 'poison' }); }
    }
    // buffs
    const bf = u.bf;
    bf.dmg = bf.as = bf.ms = bf.dr = bf.ls = bf.size = bf.crit = 0;
    for (let i = u.buffs.length - 1; i >= 0; i--) {
      const b = u.buffs[i];
      b.t -= dt;
      if (b.t <= 0) { u.buffs.splice(i, 1); continue; }
      if (b.dmg) bf.dmg += b.dmg;
      if (b.as) bf.as += b.as;
      if (b.ms) bf.ms += b.ms;
      if (b.dr) bf.dr = Math.max(bf.dr, b.dr);
      if (b.ls) bf.ls += b.ls;
      if (b.size) bf.size += b.size;
      if (b.crit) bf.crit += b.crit;
    }
    u.r = u.baseR * (1 + bf.size);
  }

  cantAct(u) { return u.st.freeze > 0 || u.st.stun > 0 || (u.kind === 'hero' && (u.downed || u.ko)); }

  // ---------- projectiles ----------
  // p: { x, y, ang, spd, r, dmg, life|range, pierce, kind, color, o, homing, src, onHit, onEnd, explode, noObst, lob }
  shoot(src, p) {
    p.id = this.nid++;
    p.team = src.team;
    p.src = src;
    p.vx = Math.cos(p.ang) * p.spd;
    p.vy = Math.sin(p.ang) * p.spd;
    if (p.life == null) p.life = (p.range || 400) / p.spd;
    p.pierce = p.pierce || 0;
    p.hits = new Set();
    p.t = 0;
    p.o = p.o || { kind: src.kind === 'hero' ? 'basic' : 'mob' };
    this.projs.push(p);
    return p;
  }

  updateProjs(dt) {
    const b = this.bounds(0);
    for (const p of this.projs) {
      if (p.done) continue;
      if (this.timeFrozen(p.team)) continue;
      p.t += dt;
      if (p.lob) {
        const k = clamp(p.t / p.lob.T, 0, 1);
        p.x = lerp(p.lob.x0, p.lob.x1, k);
        p.y = lerp(p.lob.y0, p.lob.y1, k);
        p.h = Math.sin(k * Math.PI) * p.lob.H;
        if (k >= 1) { p.done = true; if (p.onEnd) p.onEnd(this, p); }
        continue;
      }
      if (p.homing) {
        const tgt = (p.tgt && alive(p.tgt)) ? p.tgt : this.nearestFoe(p, 320);
        p.tgt = tgt;
        if (tgt) {
          const a = Math.atan2(p.vy, p.vx);
          const want = angTo(p.x, p.y, tgt.x, tgt.y);
          const na = a + clamp(angDiff(a, want), -p.homing * dt, p.homing * dt);
          const sp = Math.hypot(p.vx, p.vy);
          p.vx = Math.cos(na) * sp;
          p.vy = Math.sin(na) * sp;
        }
      }
      if (p.accel) { p.vx *= 1 + p.accel * dt; p.vy *= 1 + p.accel * dt; }
      if (p.curve) {
        const a = Math.atan2(p.vy, p.vx) + p.curve * dt, sp = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0 || p.x < b.x0 - 10 || p.x > b.x1 + 10 || p.y < b.y0 - 10 || p.y > b.y1 + 10) { this.endProj(p); continue; }
      if (!p.noObst && this.room) {
        let blocked = false;
        for (const ob of this.room.obst) if (dist2(p.x, p.y, ob.x, ob.y) < (ob.r + p.r * 0.5) * (ob.r + p.r * 0.5)) { blocked = true; break; }
        if (blocked) { this.endProj(p); continue; }
      }
      for (const u of this.units) {
        if (u.team === p.team || !alive(u) || u.untargetable || p.hits.has(u.id)) continue;
        if (u.kind === 'hero' && u.st.invuln > 0 && p.team !== 0 && !this.arena) continue;
        const rr = u.r + p.r;
        if (dist2(p.x, p.y, u.x, u.y) > rr * rr) continue;
        p.hits.add(u.id);
        const o = Object.assign({}, p.o);
        if (p.knock) { o.knock = p.knock; o.ka = Math.atan2(p.vy, p.vx); }
        if (p.src && alive(p.src) || p.src) this.hit(p.src, u, p.dmg, o);
        if (p.onHit) p.onHit(this, p, u);
        if (p.pierce-- <= 0) { this.endProj(p); break; }
      }
    }
    this.projs = this.projs.filter((p) => !p.done);
  }

  endProj(p) {
    if (p.done) return;
    p.done = true;
    if (p.explode) {
      for (const u of this.foesIn(p.team, p.x, p.y, p.explode.r)) if (!p.hits.has(u.id) || p.explode.all) this.hit(p.src, u, p.explode.dmg, Object.assign({}, p.o, { noProc: true }));
      this.emit('boom', p.x, p.y, p.explode.r, p.color);
    } else this.emit('poof', p.x, p.y, p.color);
    if (p.onEnd) p.onEnd(this, p);
  }

  // ---------- areas (zones, telegraphs, beams) ----------
  // a: { team, x, y, r, dur, delay, tele, shape: circle|line|cone, ang, len, wid, arc, tick, onTick, onFire, onUpdate, onEnd, follow, kind }
  addArea(a) {
    a.id = this.nid++;
    a.t = 0;
    a.tickT = 0;
    a.shape = a.shape || 'circle';
    if (a.dur == null) a.dur = a.delay || 1;
    this.areas.push(a);
    return a;
  }

  // A warning marker that deals its effect when the delay runs out.
  tele(team, shape, x, y, delay, onFire, o) {
    return this.addArea(Object.assign({ team, shape, x, y, delay, dur: delay, tele: true, onFire, r: 60 }, o));
  }

  inArea(a, u) {
    if (a.shape === 'circle') return dist2(a.x, a.y, u.x, u.y) <= (a.r + u.r) * (a.r + u.r);
    if (a.shape === 'ring') { const d = dist(a.x, a.y, u.x, u.y); return d >= a.r - a.wid / 2 - u.r && d <= a.r + a.wid / 2 + u.r; }
    if (a.shape === 'line') {
      const ex = a.x + Math.cos(a.ang) * a.len, ey = a.y + Math.sin(a.ang) * a.len;
      return segDist2(u.x, u.y, a.x, a.y, ex, ey) <= (a.wid / 2 + u.r) * (a.wid / 2 + u.r);
    }
    if (a.shape === 'cone') {
      const d = dist(a.x, a.y, u.x, u.y);
      if (d > a.len + u.r) return false;
      return d < u.r || Math.abs(angDiff(a.ang, angTo(a.x, a.y, u.x, u.y))) <= a.arc / 2 + Math.atan2(u.r, d);
    }
    return false;
  }

  foesInArea(a) { return this.units.filter((u) => u.team !== a.team && alive(u) && !u.untargetable && this.inArea(a, u)); }

  updateAreas(dt) {
    for (const a of this.areas) {
      if (a.done) continue;
      if (a.team !== -1 && this.timeFrozen(a.team)) continue;
      a.t += dt;
      if (a.follow) {
        if (a.follow.dead || a.follow.downed) { if (a.endOnOwner !== false) { a.done = true; if (a.onEnd) a.onEnd(this, a); continue; } } else { a.x = a.follow.x; a.y = a.follow.y; }
      }
      if (a.onUpdate) a.onUpdate(this, a, dt);
      if (a.delay && !a.fired && a.t >= a.delay) { a.fired = true; if (a.onFire) a.onFire(this, a); }
      if (a.tick && (!a.delay || a.fired)) {
        a.tickT += dt;
        while (a.tickT >= a.tick && !a.done) { a.tickT -= a.tick; if (a.onTick) a.onTick(this, a); }
      }
      if (a.t >= a.dur && !a.done) { a.done = true; if (a.onEnd) a.onEnd(this, a); }
    }
    this.areas = this.areas.filter((a) => !a.done);
  }

  // ---------- pickups ----------
  drop(kind, x, y, val) {
    const a = this.rand() * TAU, s = 60 + this.rand() * 120;
    this.picks.push({ id: this.nid++, kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, val: val || 1, t: 0 });
  }

  updatePicks(dt) {
    const hs = this.units.filter((u) => u.kind === 'hero' && alive(u) && (u.team === 0 || this.arena));
    for (const p of this.picks) {
      p.t += dt;
      p.vx *= Math.exp(-dt * 4);
      p.vy *= Math.exp(-dt * 4);
      let near = null, nd = 1e9;
      for (const h of hs) { const d = dist2(h.x, h.y, p.x, p.y); if (d < nd) { nd = d; near = h; } }
      const pull = p.kind === 'gold' ? (this.vacuum ? 5000 : 150) : 60;
      if (near && p.t > 0.35 && nd < pull * pull) {
        const a = angTo(p.x, p.y, near.x, near.y), sp = this.vacuum && p.kind === 'gold' ? 900 : 520;
        p.vx = lerp(p.vx, Math.cos(a) * sp, Math.min(1, dt * 7));
        p.vy = lerp(p.vy, Math.sin(a) * sp, Math.min(1, dt * 7));
        if (nd < (near.r + 10) * (near.r + 10)) { p.done = true; this.collect(near, p); }
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const b = this.bounds(6);
      p.x = clamp(p.x, b.x0, b.x1);
      p.y = clamp(p.y, b.y0, b.y1);
      if (p.kind !== 'gold' && p.t > 30) p.done = true;
    }
    this.picks = this.picks.filter((p) => !p.done);
  }

  collect(h, p) {
    if (p.kind === 'gold') {
      const v = p.val * (1 + h.s.gold);
      this.gold += v;
      this.stats.gold += v;
      this.emit('coin', p.x, p.y, Math.round(v));
    } else if (p.kind === 'heal') {
      this.heal(h, h.maxHp * 0.2);
      this.emit('pick', h.x, h.y, '#5df0b0', 'HEAL');
    } else if (p.kind === 'power') {
      this.buff(h, 'power', 8, { dmg: 0.4, ms: 0.2 });
      this.emit('pick', h.x, h.y, '#ff5a4a', 'POWER!');
    } else if (p.kind === 'ultorb') {
      h.ult = Math.min(100, h.ult + 35);
      this.emit('pick', h.x, h.y, '#ffd23f', 'ULT +35');
    }
  }

  // ---------- hero turn ----------
  heroTick(u, dt) {
    const inp = u.input;
    if (u.ko) { inp.skill = inp.ult = inp.dash = false; return; }
    if (u.downed) {
      if (u.autoRev > 0) { u.autoRev -= dt; if (u.autoRev <= 0) { this.revive(u, 0.6, u); this.emit('text', u.x, u.y - 40, 'REBORN!', '#ffb22e', 18); } }
      else if (!u.deadOut) {
        u.bleed -= dt;
        if (u.bleed <= 0) { u.deadOut = true; this.emit('text', u.x, u.y - 30, 'OUT', '#ff5a4a', 14); }
      }
      u.mx = inp.mx * 0.25; u.my = inp.my * 0.25;
      inp.skill = inp.ult = inp.dash = false;
      return;
    }
    const s = u.s;
    u.cd.skill = Math.max(0, u.cd.skill - dt);
    u.cd.dash = Math.max(0, u.cd.dash - dt);
    u.atkT -= dt * (1 + u.bf.as) * (u.hero.id === 'gizmo' ? 1 + 0.15 * u.summons.filter((m) => !m.dead && m.stype === 'turret').length : 1);
    // regeneration, healer aura, shields
    let regen = s.regen;
    if (!this.arena && this.t - u.lastHurt > 5) regen += 0.01;
    if (regen > 0) this.heal(u, u.maxHp * regen * dt);
    if (s.bulwark) { u.counters.bulT += dt; if (u.counters.bulT >= 10) { u.counters.bulT = 0; this.shieldUp(u, u.maxHp * s.bulwark, 8); } }
    if (u.healAcc >= Math.max(6, u.maxHp * 0.04) && this.tick % 30 === 0) { this.emit('heal', u.x, u.y - u.r - 8, Math.round(u.healAcc)); u.healAcc = 0; }
    if (u.kit.tick) u.kit.tick(this, u, dt);
    // history for Rewind
    u.histT += dt;
    if (u.histT >= 0.1) { u.histT = 0; u.hist.push({ x: u.x, y: u.y, hp: u.hp }); if (u.hist.length > 32) u.hist.shift(); }
    // spirit blades
    if (s.blades) this.bladesTick(u, dt);

    const stunned = this.cantAct(u);
    u.mx = 0; u.my = 0;
    if (!stunned) {
      let mx = inp.mx, my = inp.my;
      const m = Math.hypot(mx, my);
      if (m > 1) { mx /= m; my /= m; }
      u.mx = mx; u.my = my;
      if (u.channel && u.channel.speed != null) { u.mx *= u.channel.speed; u.my *= u.channel.speed; }
      if (m > 0.2 && this.t - u.lastAtk > 0.35) u.ang = Math.atan2(my, mx);
      // dash
      if (inp.dash && u.cd.dash <= 0 && !u.dash) {
        const a = m > 0.2 ? Math.atan2(my, mx) : u.ang;
        u.dash = { vx: Math.cos(a) * 820, vy: Math.sin(a) * 820, t: 0.17 };
        u.st.invuln = Math.max(u.st.invuln, 0.26);
        u.cd.dash = DASH_CD * (s.uq.has('windcloak') ? 0.5 : 1);
        u.ang = a;
        this.emit('dash', u.id, u.x, u.y, a);
      }
      // skill
      if (inp.skill && u.cd.skill <= 0 && !u.channel) {
        if (u.kit.skill(this, u) !== false) {
          u.cd.skillMax = u.hero.skill.cd / (1 + s.cdr);
          u.cd.skill = u.cd.skillMax;
          if (s.echo && this.rand() < s.echo) { u.cd.skill = 0.25; this.emit('text', u.x, u.y - 34, 'ECHO!', '#c46bff', 14); }
          if (s.nova) {
            const n = s.nova;
            for (const f of this.foesIn(u.team, u.x, u.y, 130 + 20 * n)) this.hit(u, f, u.hero.basic.dmg * (1.2 + 0.6 * n), { kind: 'proc', knock: 140 });
            this.emit('ring', u.x, u.y, 130 + 20 * n, u.hero.color);
          }
          this.emit('cast', u.id, 'skill');
        }
      }
      // ultimate
      if (inp.ult && u.ult >= 100 && !u.channel) {
        if (u.kit.ult(this, u) !== false) {
          u.ult = 0;
          if (u.team === 0 || this.arena) this.stats.ults++;
          if (s.avatar) this.buff(u, 'avatar', 6, { dmg: 0.5, ms: 0.3 });
          this.emit('ult', u.id, u.hero.ult.name);
        }
      }
      // channel
      if (u.channel) {
        u.channel.t -= dt;
        if (u.channel.onTick) u.channel.onTick(this, u, dt);
        if (u.channel.t <= 0) { const c = u.channel; u.channel = null; if (c.onEnd) c.onEnd(this, u); }
      }
      // basic attack (automatic)
      if (u.atkT <= 0 && !(u.channel && u.channel.noBasic)) {
        const rng = u.basicRange ? u.basicRange : u.hero.basic.range;
        let tgt = u.target && alive(u.target) && dist(u.x, u.y, u.target.x, u.target.y) <= rng + u.target.r ? u.target : null;
        if (!tgt) tgt = this.nearestFoe(u, rng);
        if (tgt && u.st.invis > 0 && u.counters.crits <= 0 && false) tgt = null;
        if (tgt) {
          u.target = tgt;
          u.ang = angTo(u.x, u.y, tgt.x, tgt.y);
          u.lastAtk = this.t;
          u.kit.basic(this, u, tgt);
          u.basicN++;
          if (s.twin) {
            const t2 = tgt;
            this.later(0.12, () => { if (alive(u) && alive(t2)) u.kit.basic(this, u, t2, 0.5); });
          }
          u.anim = 1;
          u.animK = 0;
          u.atkT = 1 / (u.hero.basic.rate * s.as * (u.rateMul || 1));
        } else u.atkT = Math.max(u.atkT, 0);
      }
    }
    if (u.anim > 0) u.anim = Math.max(0, u.anim - dt * 5);
    inp.skill = inp.ult = inp.dash = false;
  }

  bladesTick(u, dt) {
    const n = u.s.blades;
    u.counters.bladeHit = u.counters.bladeHit || {};
    for (let i = 0; i < n; i++) {
      const a = this.t * 3.2 + (i / n) * TAU;
      const bx = u.x + Math.cos(a) * 62, by = u.y + Math.sin(a) * 62;
      for (const f of this.foesIn(u.team, bx, by, 12)) {
        const k = f.id;
        if ((u.counters.bladeHit[k] || 0) > this.t) continue;
        u.counters.bladeHit[k] = this.t + 0.45;
        this.hit(u, f, u.hero.basic.dmg * 0.55, { kind: 'proc', knock: 60 });
      }
    }
  }

  // run fn after a delay in sim time. A team other than -1 pauses while that team is frozen in time.
  later(delay, fn, team) { this.addArea({ team: team == null ? -1 : team, x: 0, y: 0, r: 0, dur: delay, hidden: true, onEnd: fn }); }

  summonTick(u, dt) {
    u.life -= dt;
    if (u.life <= 0 || (u.owner && u.owner.dead) || (u.stype === 'wisp' && u.owner && u.owner.ko)) { u.dead = true; this.emit('poof', u.x, u.y, '#9affc6'); return; }
    u.mx = u.my = 0;
    if (this.cantAct(u)) return;
    const o = u.owner;
    u.atkT -= dt;
    if (u.stype === 'wisp') {
      if (!o || o.downed) return;
      const a = this.t * 1.6 + u.id;
      const tx = o.x + Math.cos(a) * 44, ty = o.y - 30 + Math.sin(a) * 14;
      u.x = lerp(u.x, tx, Math.min(1, dt * 6));
      u.y = lerp(u.y, ty, Math.min(1, dt * 6));
      if (u.atkT <= 0) {
        const t = this.nearestFoe(u, 360);
        if (t) {
          u.atkT = 0.9;
          this.shoot(u, { x: u.x, y: u.y, ang: angTo(u.x, u.y, t.x, t.y), spd: 520, r: 6, dmg: o.hero.basic.dmg * 0.45, range: 380, kind: 'wisp', color: '#bff8ff', o: { kind: 'proc' }, homing: 4 });
        }
      }
      return;
    }
    u.ai.retarget -= dt;
    if (!u.ai.tgt || !alive(u.ai.tgt) || u.ai.retarget <= 0) { u.ai.tgt = this.nearestFoe(u, u.stype === 'turret' ? 400 : 600); u.ai.retarget = 0.6; }
    const t = u.ai.tgt;
    if (u.stype === 'turret') {
      if (t && u.atkT <= 0) {
        u.atkT = 1 / 3;
        u.ang = angTo(u.x, u.y, t.x, t.y);
        this.shoot(u, { x: u.x + Math.cos(u.ang) * 14, y: u.y + Math.sin(u.ang) * 14, ang: u.ang + (this.rand() - 0.5) * 0.1, spd: 700, r: 5, dmg: 13, range: 420, kind: 'rivet', color: '#ffd27a', o: { kind: 'proc' } });
      }
      return;
    }
    // skeleton warriors
    if (t) {
      const d = dist(u.x, u.y, t.x, t.y);
      u.ang = angTo(u.x, u.y, t.x, t.y);
      if (d > u.r + t.r + 18) { u.mx = Math.cos(u.ang); u.my = Math.sin(u.ang); }
      else if (u.atkT <= 0) {
        u.atkT = 0.85;
        u.anim = 1;
        this.hit(u, t, u.stype === 'champion' ? 34 : 15, { kind: 'proc', knock: 40 });
        this.emit('slash', u.x, u.y, u.ang, u.r + 22, 1.4, '#cfe8d8');
      }
    } else if (o && alive(o)) {
      const d = dist(u.x, u.y, o.x, o.y);
      if (d > 90) { const a = angTo(u.x, u.y, o.x, o.y); u.mx = Math.cos(a); u.my = Math.sin(a); }
    }
    if (u.anim > 0) u.anim = Math.max(0, u.anim - dt * 5);
  }

  // ---------- movement & collisions ----------
  moveUnits(dt) {
    const ob = this.room ? this.room.obst : [];
    for (const u of this.units) {
      if (u.dead) continue;
      if (this.timeFrozen(u.team) && u.kind !== 'hero') { u.px = u.x; u.py = u.y; continue; }
      if (this.timeFrozen(u.team) && u.kind === 'hero') { u.px = u.x; u.py = u.y; continue; }
      u.px = u.x; u.py = u.y;
      if (u.stype === 'wisp') continue;
      let vx = 0, vy = 0;
      const st = u.st;
      if (u.dash) {
        vx = u.dash.vx; vy = u.dash.vy;
        u.dash.t -= dt;
        if (u.dash.t <= 0) { const dd = u.dash; u.dash = null; if (dd.onEnd) dd.onEnd(this, u); }
      } else if (!(st.freeze > 0 || st.stun > 0 || st.root > 0)) {
        const sp = u.spd * u.spdMul * (1 - (st.slow > 0 ? st.slowAmt : 0)) * (1 + u.bf.ms) * (u.downed ? 0.35 : 1);
        vx = u.mx * sp; vy = u.my * sp;
      }
      vx += u.kx; vy += u.ky;
      const damp = Math.exp(-dt * 9);
      u.kx *= damp; u.ky *= damp;
      u.x += vx * dt;
      u.y += vy * dt;
      if (!u.flyer && !(u.dash && u.dash.air)) {
        for (const o of ob) {
          const dx = u.x - o.x, dy = u.y - o.y, m = u.r + o.r;
          const d2 = dx * dx + dy * dy;
          if (d2 < m * m) {
            const d = Math.sqrt(d2) || 0.01;
            u.x = o.x + dx / d * m;
            u.y = o.y + dy / d * m;
          }
        }
      }
      const b = this.bounds(u.r);
      u.x = clamp(u.x, b.x0, b.x1);
      u.y = clamp(u.y, b.y0, b.y1);
    }
    // separation
    const us = this.units;
    for (let i = 0; i < us.length; i++) {
      const a = us[i];
      if (a.dead || a.downed || a.ko || a.stype === 'wisp' || (a.dash && a.dash.air)) continue;
      for (let j = i + 1; j < us.length; j++) {
        const b = us[j];
        if (b.dead || b.downed || b.ko || b.stype === 'wisp' || (b.dash && b.dash.air)) continue;
        if (a.flyer !== b.flyer && (a.kind === 'mob' || b.kind === 'mob')) continue;
        const dx = b.x - a.x, dy = b.y - a.y, m = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= m * m || d2 === 0) continue;
        const d = Math.sqrt(d2), push = (m - d);
        const sameHeroTeam = a.kind === 'hero' && b.kind === 'hero' && a.team === b.team;
        const k = sameHeroTeam ? 0.15 : 0.5;
        const ma = a.mass, mb = b.mass, tot = ma + mb;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push * (mb / tot) * k * 2;
        a.y -= ny * push * (mb / tot) * k * 2;
        b.x += nx * push * (ma / tot) * k * 2;
        b.y += ny * push * (ma / tot) * k * 2;
      }
    }
  }

  // ---------- main step ----------
  step() {
    const dt = SIM_DT;
    this.t += dt;
    this.tick++;
    if (this.timeStop) { this.timeStop.t -= dt; if (this.timeStop.t <= 0) this.timeStop = null; }
    if (this.mode) this.mode.update(dt);
    for (const u of this.units) {
      if (u.dead) continue;
      if (this.timeFrozen(u.team)) { if (u.flash > 0) u.flash -= dt; continue; }
      this.tickStatus(u, dt);
      if (u.dead) continue;
      if (u.kind === 'hero') this.heroTick(u, dt);
      else if (u.kind === 'mob') mobTick(this, u, dt);
      else if (u.kind === 'boss') bossTick(this, u, dt);
      else if (u.kind === 'summon') this.summonTick(u, dt);
    }
    this.moveUnits(dt);
    this.updateProjs(dt);
    this.updateAreas(dt);
    this.updatePicks(dt);
    this.reviveTick(dt);
    if (this.units.some((u) => u.dead)) this.units = this.units.filter((u) => !u.dead);
    if (this.combo.t > 0) { this.combo.t -= dt; if (this.combo.t <= 0) this.combo.n = 0; }
    if (this.multi.t > 0) { this.multi.t -= dt; if (this.multi.t <= 0) { if (this.multi.n >= 6) this.emit('multi', this.multi.n); this.multi.n = 0; } }
  }

  reviveTick(dt) {
    if (this.arena) return;
    for (const u of this.units) {
      if (u.kind !== 'hero' || !u.downed || u.deadOut || u.autoRev > 0) continue;
      let helper = null;
      for (const o of this.units) if (o !== u && o.kind === 'hero' && o.team === u.team && alive(o) && dist2(o.x, o.y, u.x, u.y) < 72 * 72) { helper = o; break; }
      if (helper) {
        u.reviveP += dt;
        u.reviver = helper;
        if (u.reviveP >= REVIVE_TIME) this.revive(u, 0.4, helper);
      } else u.reviveP = Math.max(0, u.reviveP - dt * 0.5);
    }
  }

  // counts a monster kill towards streaks and multi-kills
  countKill(u) {
    this.stats.kills++;
    this.multi.n++;
    this.multi.t = 0.8;
    if (this.multi.n > this.stats.bestMulti) this.stats.bestMulti = this.multi.n;
    if (u.elite) this.stats.elites++;
  }
}

// ===== 04-abilities.js =====
// ---------- Hero kits: basic attacks, skills, ultimates and passives ----------
// KITS[id] = { basic(w, u, tgt, mul), skill(w, u), ult(w, u), tick?(w, u, dt), sr (skill range), ur (ult range) }
// A skill or ult returning false was not cast (no cooldown spent).

function heroColor(u) { return u.hero.color; }

function meleeBasic(w, u, tgt, mul) {
  const b = u.hero.basic, multi = u.s.multi;
  const range = b.range * (1 + 0.25 * multi) + u.r;
  const arc = b.arc * (1 + 0.25 * multi);
  const a = angTo(u.x, u.y, tgt.x, tgt.y);
  const fs = w.foesInCone(u.team, u.x, u.y, a, range, arc);
  if (!fs.includes(tgt)) fs.push(tgt);
  for (const f of fs) w.hit(u, f, b.dmg * (mul || 1), { kind: 'basic', knock: b.knock, ka: angTo(u.x, u.y, f.x, f.y) });
  w.emit('slash', u.x, u.y, a, range, arc, u.hero.look.wcol, u.id);
}

function shotBasic(w, u, tgt, mul, extra) {
  const b = u.hero.basic;
  const n = 1 + u.s.multi;
  const base = angTo(u.x, u.y, tgt.x, tgt.y);
  for (let i = 0; i < n; i++) {
    const ang = base + (i - (n - 1) / 2) * 0.17 + (b.spread ? (w.rand() - 0.5) * b.spread * 2 : 0);
    const p = {
      x: u.x + Math.cos(ang) * u.r, y: u.y + Math.sin(ang) * u.r, ang, spd: b.spd, r: b.r, dmg: b.dmg * (mul || 1), range: b.range * 1.15,
      pierce: (b.pierce || 0) + u.s.pierce, kind: b.fx, color: heroColor(u), homing: b.homing, o: { kind: 'basic' },
    };
    if (b.splash) p.explode = { r: b.splash, dmg: b.dmg * 0.5 * (mul || 1) };
    if (extra) Object.assign(p, extra);
    w.shoot(u, p);
  }
  w.emit('shoot', u.id, b.fx);
}

function dashHit(w, u, ang, speed, t, hitR, onHit, o) {
  u.dash = Object.assign({ vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, t }, o || {});
  u.ang = ang;
  const seen = new Set();
  w.addArea({ team: u.team, follow: u, r: hitR, dur: t + 0.04, tick: 1 / 60, hidden: true, onTick: (w2, a) => {
    for (const f of w2.foesIn(u.team, a.x, a.y, hitR)) { if (seen.has(f.id)) continue; seen.add(f.id); onHit(f); }
  } });
}

function lob(w, u, x, y, T, H, kind, onLand, tele) {
  if (tele) w.tele(u.team, 'circle', x, y, T, null, { r: tele, friendly: true, kind });
  w.shoot(u, { x: u.x, y: u.y, ang: 0, spd: 0, r: 10, dmg: 0, life: 99, kind, color: heroColor(u), lob: { x0: u.x, y0: u.y, x1: x, y1: y, T, H }, onEnd: onLand });
}

function clampToRoom(w, x, y, r) {
  const b = w.bounds(r);
  x = clamp(x, b.x0, b.x1);
  y = clamp(y, b.y0, b.y1);
  if (w.room) for (const o of w.room.obst) {
    const dx = x - o.x, dy = y - o.y, m = o.r + r, d = Math.hypot(dx, dy);
    if (d < m) { const k = (d || 0.01); x = o.x + dx / k * m; y = o.y + dy / k * m; }
  }
  return { x: clamp(x, b.x0, b.x1), y: clamp(y, b.y0, b.y1) };
}

function cleanse(u) {
  const s = u.st;
  s.burn = s.poison = s.slow = s.freeze = s.stun = s.root = 0;
}

// ===== 05-enemies.js =====
// ---------- Monster and boss behaviour ----------
// Every dangerous attack is announced with a telegraph (a red area that fills up) so players and
// bots can step out of it.

function mobPickTarget(w, u, dt) {
  const ai = u.ai;
  if (u.st.taunt > 0 && u.st.tauntSrc && alive(u.st.tauntSrc)) return (ai.tgt = u.st.tauntSrc);
  ai.retarget -= dt;
  const t = ai.tgt;
  if (!t || !alive(t) || t.untargetable || (t.kind === 'hero' && t.st.invis > 0) || ai.retarget <= 0) {
    let best = null, bs = 1e18;
    for (const o of w.units) {
      if (o.team === u.team || !alive(o) || o.untargetable) continue;
      if (o.kind === 'hero' && o.st.invis > 0) continue;
      let s = dist2(u.x, u.y, o.x, o.y);
      if (o.kind === 'summon') s *= 1.6;
      if (s < bs) { bs = s; best = o; }
    }
    ai.tgt = best;
    ai.retarget = 0.8 + w.rand() * 0.8;
  }
  return ai.tgt;
}

// Walk towards (or away from) a point, sliding around obstacles.
function mobSteer(w, u, tx, ty, dir, mul) {
  let a = angTo(u.x, u.y, tx, ty);
  if (dir < 0) a += Math.PI;
  if (!u.flyer && w.room) {
    const ax = u.x + Math.cos(a) * 70, ay = u.y + Math.sin(a) * 70;
    for (const o of w.room.obst) {
      const rr = o.r + u.r + 4;
      if (dist2(o.x, o.y, u.x, u.y) > (rr + 90) * (rr + 90)) continue;
      if (segDist2(o.x, o.y, u.x, u.y, ax, ay) < rr * rr) {
        const cross = Math.cos(a) * (o.y - u.y) - Math.sin(a) * (o.x - u.x);
        a += cross > 0 ? -1.1 : 1.1;
        break;
      }
    }
  }
  u.mx = Math.cos(a) * (mul == null ? 1 : mul);
  u.my = Math.sin(a) * (mul == null ? 1 : mul);
}

function clearShot(w, x0, y0, x1, y1) {
  if (!w.room) return true;
  for (const o of w.room.obst) if (segDist2(o.x, o.y, x0, y0, x1, y1) < (o.r + 4) * (o.r + 4)) return false;
  return true;
}

function mobShot(w, u, ang, s) {
  const n = s.n || 1;
  for (let i = 0; i < n; i++) {
    const a = ang + (n > 1 ? (i - (n - 1) / 2) * (s.spread || 0.2) : 0);
    w.shoot(u, { x: u.x + Math.cos(a) * u.r, y: u.y + Math.sin(a) * u.r, ang: a, spd: s.spd, r: s.r, dmg: u.mob ? u.mob.dmg : s.dmg, range: s.range || 760, kind: s.kind, color: s.color, homing: s.homing,
      onHit: s.slow ? (w2, p, t) => w2.slow(t, 0.35, 1.5) : null, o: { kind: 'mob' } });
  }
}

function heroesOf(w, team) { return w.units.filter((h) => h.kind === 'hero' && h.team !== team && alive(h)); }

function mobTick(w, u, dt) {
  const d = u.mob, ai = u.ai;
  u.mx = u.my = 0;
  u.spdMul = 1;
  if (u.elite === 'frozen' && w.tick % 18 === 0) for (const h of w.foesIn(u.team, u.x, u.y, 130)) w.slow(h, 0.35, 0.5);
  if (w.cantAct(u)) { if (ai.state !== 'move') { ai.state = 'move'; ai.cd = Math.max(ai.cd, 0.4); } return; }
  if (u.dash) return;
  ai.cd -= dt * (u.elite === 'swift' ? 1.35 : 1);
  ai.t -= dt;
  const t = mobPickTarget(w, u, dt);
  if (!t) { ai.wob += dt; u.mx = Math.cos(ai.wob) * 0.3; u.my = Math.sin(ai.wob) * 0.3; return; }
  const dd = dist(u.x, u.y, t.x, t.y);
  const face = angTo(u.x, u.y, t.x, t.y);
  if (ai.state === 'move') u.ang = face;
  const mult = u.mult.dmg;
  const keep = d.keep || 0;
  const strafe = () => {
    if (w.rand() < dt * 0.4) ai.strafe = -ai.strafe;
    const a = face + Math.PI / 2 * ai.strafe;
    u.mx = Math.cos(a) * 0.55; u.my = Math.sin(a) * 0.55;
  };
  const keepDist = () => {
    if (dd > keep + 40) mobSteer(w, u, t.x, t.y, 1);
    else if (dd < keep - 70) mobSteer(w, u, t.x, t.y, -1, 0.8);
    else strafe();
  };

  switch (d.ai) {
    case 'contact': {
      mobSteer(w, u, t.x, t.y, 1);
      if (dd < u.r + t.r + 5 && (u.contactT[t.id] || 0) < w.t) {
        u.contactT[t.id] = w.t + 0.85;
        w.hit(u, t, d.dmg, { kind: 'mob', knock: 40 });
        u.anim = 1;
      }
      break;
    }
    case 'melee':
    case 'blinker': {
      if (ai.state === 'wind') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd;
          u.anim = 1;
          for (const h of w.foesInCone(u.team, u.x, u.y, ai.ang, u.r + d.reach + 12, 1.7)) w.hit(u, h, d.dmg, { kind: 'mob', knock: 60 });
          w.emit('slash', u.x, u.y, ai.ang, u.r + d.reach + 12, 1.7, '#ff8a7a', u.id);
        }
        break;
      }
      if (ai.state === 'blink') {
        if (ai.t <= 0) {
          ai.state = 'move';
          w.emit('poof', u.x, u.y, '#7a4dff');
          u.x = u.px = ai.bx; u.y = u.py = ai.by;
          w.emit('poof', u.x, u.y, '#7a4dff');
          ai.cd = 0;
        }
        break;
      }
      if (d.ai === 'blinker' && (ai.blinkCd = (ai.blinkCd == null ? 3 : ai.blinkCd) - dt) <= 0 && dd > 140) {
        ai.blinkCd = 5 + w.rand() * 2;
        const back = angTo(t.x, t.y, u.x, u.y) + Math.PI;
        const p = clampToRoom(w, t.x + Math.cos(back) * (t.r + u.r + 20), t.y + Math.sin(back) * (t.r + u.r + 20), u.r);
        ai.bx = p.x; ai.by = p.y; ai.state = 'blink'; ai.t = 0.55;
        w.tele(u.team, 'circle', p.x, p.y, 0.55, null, { r: u.r + 10, kind: 'blink' });
        break;
      }
      if (dd < u.r + t.r + d.reach && ai.cd <= 0) {
        ai.state = 'wind';
        ai.t = d.wind;
        ai.ang = face;
        w.tele(u.team, 'cone', u.x, u.y, d.wind, null, { len: u.r + d.reach + 12, arc: 1.7, ang: face, follow: u, small: true });
      } else mobSteer(w, u, t.x, t.y, 1);
      break;
    }
    case 'ranged': {
      if (ai.state === 'aim') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd * (0.8 + w.rand() * 0.4);
          mobShot(w, u, angTo(u.x, u.y, t.x, t.y), d.shot);
          u.anim = 1;
        }
        break;
      }
      keepDist();
      if (ai.cd <= 0 && dd < keep + 200 && clearShot(w, u.x, u.y, t.x, t.y)) { ai.state = 'aim'; ai.t = 0.35; }
      break;
    }
    case 'charger': {
      if (ai.state === 'wind') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd;
          const a = ai.ang, sp = 720;
          u.dash = { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.48 };
          const seen = new Set();
          w.addArea({ team: u.team, follow: u, r: u.r + 6, dur: 0.5, tick: 1 / 60, hidden: true, onTick: (w2, ar) => {
            for (const h of w2.foesIn(u.team, ar.x, ar.y, ar.r)) { if (seen.has(h.id)) continue; seen.add(h.id); w2.hit(u, h, d.dmg, { kind: 'mob', knock: 140, ka: a }); if (d.slowHit) w2.slow(h, 0.4, 1.5); }
            if (d.trail && w2.tick % 6 === 0) fireZone(w2, u, ar.x, ar.y, 34, 2.2, d.dmg * 0.25);
          } });
        }
        break;
      }
      if (dd < 320 && ai.cd <= 0 && clearShot(w, u.x, u.y, t.x, t.y)) {
        ai.state = 'wind'; ai.t = 0.6; ai.ang = face;
        w.tele(u.team, 'line', u.x, u.y, 0.6, null, { ang: face, len: 350, wid: u.r * 2 + 8, follow: u });
      } else if (dd < 180) strafe(); else mobSteer(w, u, t.x, t.y, 1);
      break;
    }
    case 'caster': {
      keepDist();
      if (ai.cd <= 0 && dd < keep + 220) {
        ai.cd = d.cd * (0.85 + w.rand() * 0.3);
        const c = d.cast, tx = t.x + t.mx * 40, ty = t.y + t.my * 40;
        u.anim = 1;
        w.tele(u.team, 'circle', tx, ty, c.delay, (w2, a) => {
          if (c.zone === 'spore') {
            w2.addArea({ team: u.team, x: a.x, y: a.y, r: c.r, dur: c.dur, tick: 0.5, kind: 'spore', color: '#d65a8a', hostile: true, onTick: (w3, z) => {
              for (const h of w3.foesInArea(z)) { w3.hit(u, h, d.dmg, { kind: 'mob', raw: true, noDodge: true }); w3.slow(h, 0.3, 0.6); }
            } });
          } else if (c.zone === 'gravity') {
            w2.addArea({ team: u.team, x: a.x, y: a.y, r: c.r, dur: c.dur, tick: 0.5, kind: 'gravity', color: '#b48aff', hostile: true,
              onUpdate: (w3, z, dt2) => { for (const h of w3.foesIn(u.team, z.x, z.y, z.r + 40)) { const g = angTo(h.x, h.y, z.x, z.y); h.kx += Math.cos(g) * 160 * dt2; h.ky += Math.sin(g) * 160 * dt2; } },
              onTick: (w3, z) => { for (const h of w3.foesInArea(z)) w3.hit(u, h, d.dmg * 0.5, { kind: 'mob' }); } });
          } else {
            for (const h of w2.foesInArea(a)) { w2.hit(u, h, d.dmg, { kind: 'mob' }); w2.burn(h, u, 2, d.dmg * mult * 0.2); }
            w2.emit('boom', a.x, a.y, a.r, '#ffb02e');
          }
        }, { r: c.r });
      }
      break;
    }
    case 'bomber': {
      if (ai.state === 'fuse') {
        if (ai.t <= 0) {
          for (const h of w.foesIn(u.team, u.x, u.y, 88)) { w.hit(u, h, d.dmg, { kind: 'mob', knock: 160 }); w.freeze(h, 0.9); }
          w.emit('boom', u.x, u.y, 88, d.look.color);
          u.noGold = false;
          w.onZero(u, null, {});
        }
        break;
      }
      mobSteer(w, u, t.x, t.y, 1);
      u.spdMul = 1.15;
      if (dd < 70) { ai.state = 'fuse'; ai.t = 0.65; w.tele(u.team, 'circle', u.x, u.y, 0.65, null, { r: 88, follow: u }); }
      break;
    }
    case 'leaper': {
      if (ai.state === 'air') break;
      if (dd < 340 && dd > 80 && ai.cd <= 0) {
        ai.cd = d.cd;
        const T = 0.75, tx = t.x, ty = t.y, a = angTo(u.x, u.y, tx, ty), l = dist(u.x, u.y, tx, ty);
        ai.state = 'air';
        w.tele(u.team, 'circle', tx, ty, T, null, { r: 78 });
        u.dash = { vx: Math.cos(a) * l / T, vy: Math.sin(a) * l / T, t: T, air: true, onEnd: (w2, me) => {
          ai.state = 'move';
          for (const h of w2.foesIn(u.team, me.x, me.y, 78)) w2.hit(u, h, d.dmg, { kind: 'mob', knock: 120 });
          w2.emit('boom', me.x, me.y, 78, '#8a8f9e');
          w2.emit('shake', 3);
        } };
      } else mobSteer(w, u, t.x, t.y, 1);
      break;
    }
    case 'summoner': {
      keepDist();
      if (ai.cd <= 0) {
        ai.cd = d.cd;
        const s = d.summon;
        const have = w.units.filter((m) => m.kind === 'mob' && m.mid === s.id && m.summoner === u.id).length;
        for (let i = 0; i < s.n && have + i < s.max; i++) {
          const a = w.rand() * TAU;
          const p = clampToRoom(w, u.x + Math.cos(a) * (u.r + 24), u.y + Math.sin(a) * (u.r + 24), 12);
          const m = w.spawnMob(s.id, p.x, p.y, u.mult);
          m.summoner = u.id;
          m.noGold = true;
          w.emit('raise', p.x, p.y);
        }
        u.anim = 1;
      }
      break;
    }
    case 'ringer': {
      if (ai.state === 'aim') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd;
          const r = d.ring, off = w.rand() * TAU;
          for (let i = 0; i < r.n; i++) w.shoot(u, { x: u.x, y: u.y, ang: off + i / r.n * TAU, spd: r.spd, r: r.r, dmg: d.dmg, range: 600, kind: 'orb', color: r.color, o: { kind: 'mob' } });
          u.anim = 1;
        }
        break;
      }
      keepDist();
      if (ai.cd <= 0 && dd < keep + 260) { ai.state = 'aim'; ai.t = 0.5; w.tele(u.team, 'circle', u.x, u.y, 0.5, null, { r: u.r + 16, follow: u, small: true }); }
      break;
    }
    case 'laser': {
      if (ai.state === 'aim') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd;
          const a = { shape: 'line', x: u.x, y: u.y, ang: ai.ang, len: 760, wid: 28 };
          for (const h of w.units) if (h.team !== u.team && alive(h) && !h.untargetable && w.inArea(a, h)) w.hit(u, h, d.dmg, { kind: 'mob' });
          w.emit('beam', u.x, u.y, ai.ang, 760, d.look.color);
        }
        break;
      }
      keepDist();
      if (ai.cd <= 0 && dd < keep + 260) {
        ai.state = 'aim'; ai.t = 0.95; ai.ang = face;
        w.tele(u.team, 'line', u.x, u.y, 0.95, null, { ang: face, len: 760, wid: 28 });
      }
      break;
    }
    case 'slammer': {
      if (ai.state === 'wind') {
        if (ai.t <= 0) {
          ai.state = 'move';
          ai.cd = d.cd;
          for (const h of w.foesIn(u.team, u.x, u.y, 118)) w.hit(u, h, d.dmg, { kind: 'mob', knock: 220 });
          w.emit('boom', u.x, u.y, 118, d.look.color);
          w.emit('shake', 5);
          u.anim = 1;
        }
        break;
      }
      if (dd < 135 && ai.cd <= 0) { ai.state = 'wind'; ai.t = 0.85; w.tele(u.team, 'circle', u.x, u.y, 0.85, null, { r: 118, follow: u }); }
      else mobSteer(w, u, t.x, t.y, 1);
      break;
    }
    case 'lobber': {
      keepDist();
      if (ai.cd <= 0 && dd < keep + 260) {
        ai.cd = d.cd;
        const tx = t.x + t.mx * 50, ty = t.y + t.my * 50;
        u.anim = 1;
        w.tele(u.team, 'circle', tx, ty, 0.9, (w2, a) => {
          for (const h of w2.foesInArea(a)) { w2.hit(u, h, d.dmg, { kind: 'mob', knock: 100 }); w2.stun(h, 0.7); }
          w2.emit('boom', a.x, a.y, a.r, '#eef6ff');
        }, { r: 74 });
        w.shoot(u, { x: u.x, y: u.y, ang: 0, spd: 0, r: 14, dmg: 0, life: 9, kind: 'snowball', color: '#ffffff', lob: { x0: u.x, y0: u.y, x1: tx, y1: ty, T: 0.9, H: 120 } });
      }
      break;
    }
  }
}

function fireZone(w, src, x, y, r, dur, dmg) {
  w.addArea({ team: src.team, x, y, r, dur, tick: 0.5, kind: 'lava', color: '#ff6a1e', hostile: true, onTick: (w2, a) => {
    for (const h of w2.foesInArea(a)) { w2.hit(src, h, dmg, { kind: 'mob', raw: true, noDodge: true }); }
  } });
}

// Monster death: drops, splits, death effects and party passives that trigger on kills.
function onMobDeath(w, u, src, goldMul) {
  const d = u.mob;
  w.countKill(u);
  w.emit('die', u.x, u.y, d.look.color, u.r, u.mid);
  const owner = src && src.kind === 'summon' ? src.owner : src;
  if (!u.noGold) {
    let g = (d.gold || 1) * goldMul * (u.elite ? 4 : 1);
    if (owner && owner.kind === 'hero' && owner.s.midas && u.elite) g *= 3;
    const n = Math.min(8, Math.max(1, Math.round(g / 3)));
    for (let i = 0; i < n; i++) w.drop('gold', u.x, u.y, g / n);
    if (w.rand() < (u.elite ? 0.5 : 0.025)) w.drop('heal', u.x, u.y);
  }
  if (d.split) for (let i = 0; i < d.split.n; i++) {
    const m = w.spawnMob(d.split.id, u.x + (i ? 12 : -12), u.y, u.mult);
    m.kx = (i ? 1 : -1) * 220;
  }
  if (d.deathZone === 'lava') fireZone(w, u, u.x, u.y, 46, 3, d.dmg * u.mult.dmg * 0.3);
  if (u.elite === 'volatile') {
    const x = u.x, y = u.y, m = u.mult.dmg;
    w.tele(1, 'circle', x, y, 0.8, (w2, a) => {
      for (const h of w2.foesInArea(a)) w2.hit(null, h, 30 * m, { kind: 'mob', raw: true });
      w2.emit('boom', a.x, a.y, a.r, '#ffb02e');
    }, { r: 110 });
  }
  if (u.st.burn > 0 && w.flag(owner || u.st.burnSrc, 'combust')) {
    const by = (owner && owner.kind === 'hero') ? owner : u.st.burnSrc;
    if (by) for (const f of w.foesIn(by.team, u.x, u.y, 75)) if (f !== u) w.hit(by, f, 28, { kind: 'proc' });
    w.emit('boom', u.x, u.y, 75, '#ff7b2e');
  }
  if (owner && owner.kind === 'hero' && owner.hero.id === 'morrow' && w.rand() < 0.2) {
    const sk = owner.summons.filter((m) => !m.dead && m.stype === 'skeleton');
    if (sk.length < 6) { w.spawnSummon(owner, 'skeleton', u.x, u.y, { life: 8 }); w.emit('raise', u.x, u.y); }
  }
}

// ---------- Bosses ----------
function bossShootRing(w, u, n, spd, off, r, color, dmg) {
  for (let i = 0; i < n; i++) w.shoot(u, { x: u.x, y: u.y, ang: off + i / n * TAU, spd, r: r || 9, dmg: dmg || u.boss.dmg, range: 900, kind: 'orb', color: color || u.boss.color2, o: { kind: 'mob' } });
}

const BOSS_MOVES = {
  roots(w, u, t, p2) {
    const hs = heroesOf(w, u.team);
    for (const h of hs) {
      const per = p2 ? 2 : 1;
      for (let k = 0; k < per; k++) {
        const a = angTo(u.x, u.y, h.x, h.y) + (per > 1 ? (k ? 0.2 : -0.2) : 0);
        w.tele(u.team, 'line', u.x, u.y, 0.95, (w2, ar) => {
          for (const x of w2.foesInArea(ar)) { w2.hit(u, x, u.boss.dmg * 1.3, { kind: 'mob' }); w2.root(x, 1.1); }
          w2.emit('roots', ar.x, ar.y, ar.ang, ar.len);
        }, { ang: a, len: 640, wid: 46 });
      }
    }
    return 1.4;
  },
  ring(w, u, t, p2, big) {
    const waves = big ? 4 : 3, n = big ? 24 : 18;
    for (let i = 0; i < waves; i++) w.later(i * 0.45, () => bossShootRing(w, u, n, 210, (i % 2) * Math.PI / n), u.team);
    w.tele(u.team, 'circle', u.x, u.y, 0.4, null, { r: u.r + 20, follow: u, small: true });
    return waves * 0.45 + 0.5;
  },
  ring2(w, u, t) { return BOSS_MOVES.ring(w, u, t, true, true); },
  summon(w, u, t, p2) {
    const mobs = w.units.filter((m) => m.kind === 'mob').length;
    const n = Math.min(p2 ? 5 : 3, 14 - mobs);
    for (let i = 0; i < n; i++) {
      const a = i / Math.max(1, n) * TAU + w.rand();
      const p = clampToRoom(w, u.x + Math.cos(a) * (u.r + 50), u.y + Math.sin(a) * (u.r + 50), 16);
      w.tele(u.team, 'circle', p.x, p.y, 0.7, (w2) => { const m = w2.spawnMob(u.boss.summon, p.x, p.y, { hp: u.mult.hp * 0.5, dmg: u.mult.dmg * 0.8 }); m.noGold = true; w2.emit('raise', p.x, p.y); }, { r: 26, small: true });
    }
    return 1.2;
  },
  slam(w, u, t) {
    const a = angTo(u.x, u.y, t.x, t.y);
    u.dash = { vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, t: Math.min(0.7, Math.max(0, dist(u.x, u.y, t.x, t.y) - 80) / 300) };
    w.later(0.7, () => {
      w.tele(u.team, 'circle', u.x, u.y, 0.8, (w2, ar) => {
        for (const h of w2.foesInArea(ar)) w2.hit(u, h, u.boss.dmg * 1.6, { kind: 'mob', knock: 260 });
        w2.emit('boom', ar.x, ar.y, ar.r, u.boss.color2);
        w2.emit('shake', 9);
      }, { r: 175, follow: u });
    }, u.team);
    return 1.9;
  },
  charge(w, u, t) {
    const a = angTo(u.x, u.y, t.x, t.y);
    w.tele(u.team, 'line', u.x, u.y, 0.75, null, { ang: a, len: 620, wid: u.r * 2, follow: u });
    w.later(0.75, () => {
      const seen = new Set();
      u.dash = { vx: Math.cos(a) * 950, vy: Math.sin(a) * 950, t: 0.62 };
      w.addArea({ team: u.team, follow: u, r: u.r + 6, dur: 0.64, tick: 1 / 60, hidden: true, onTick: (w2, ar) => {
        for (const h of w2.foesIn(u.team, ar.x, ar.y, ar.r)) { if (seen.has(h.id)) continue; seen.add(h.id); w2.hit(u, h, u.boss.dmg * 1.5, { kind: 'mob', knock: 300, ka: a }); }
      } });
    }, u.team);
    return 1.8;
  },
  spiral(w, u, t, p2, arms) {
    arms = arms || (p2 ? 3 : 2);
    const dur = 2.8;
    let ang = w.rand() * TAU;
    for (let i = 0; i < dur / 0.09; i++) {
      w.later(i * 0.09, () => {
        ang += 0.23;
        for (let k = 0; k < arms; k++) w.shoot(u, { x: u.x, y: u.y, ang: ang + k / arms * TAU, spd: 230, r: 8, dmg: u.boss.dmg * 0.8, range: 900, kind: 'orb', color: u.boss.color2, o: { kind: 'mob' } });
      }, u.team);
    }
    return dur + 0.4;
  },
  spiral2(w, u, t) { return BOSS_MOVES.spiral(w, u, t, true, 4); },
  blink(w, u, t) {
    const a = w.rand() * TAU;
    const p = clampToRoom(w, t.x + Math.cos(a) * 260, t.y + Math.sin(a) * 260, u.r);
    w.tele(u.team, 'circle', p.x, p.y, 0.7, (w2) => {
      w2.emit('poof', u.x, u.y, u.boss.color2);
      u.x = u.px = p.x; u.y = u.py = p.y;
      w2.emit('poof', u.x, u.y, u.boss.color2);
      w2.tele(u.team, 'circle', u.x, u.y, 0.55, (w3, ar) => {
        for (const h of w3.foesInArea(ar)) w3.hit(u, h, u.boss.dmg * 1.3, { kind: 'mob', knock: 200 });
        w3.emit('ring', ar.x, ar.y, ar.r, u.boss.color2);
      }, { r: 160, follow: u });
    }, { r: u.r + 10 });
    return 1.6;
  },
  fan(w, u, t, p2) {
    for (let k = 0; k < 3; k++) w.later(k * 0.4, () => {
      const tt = u.ai.tgt && alive(u.ai.tgt) ? u.ai.tgt : t;
      const a = angTo(u.x, u.y, tt.x, tt.y), n = p2 ? 9 : 7;
      for (let i = 0; i < n; i++) w.shoot(u, { x: u.x, y: u.y, ang: a + (i - (n - 1) / 2) * 0.15, spd: 320, r: 8, dmg: u.boss.dmg, range: 900, kind: 'orb', color: u.boss.color2, o: { kind: 'mob' } });
    }, u.team);
    return 1.5;
  },
  beam(w, u, t) {
    const a = angTo(u.x, u.y, t.x, t.y);
    w.tele(u.team, 'line', u.x, u.y, 1.1, (w2, ar) => {
      for (const h of w2.foesInArea(ar)) w2.hit(u, h, u.boss.dmg * 2, { kind: 'mob' });
      w2.emit('beam', ar.x, ar.y, ar.ang, ar.len, u.boss.color2);
    }, { ang: a, len: 1000, wid: 46, follow: u });
    return 1.6;
  },
  meteors(w, u, t, p2, many) {
    const n = many ? 14 : 8;
    const hs = heroesOf(w, u.team);
    for (let i = 0; i < n; i++) w.later(i * 0.16, () => {
      const h = hs.length ? hs[i % hs.length] : t;
      const x = h.x + (w.rand() - 0.5) * 220, y = h.y + (w.rand() - 0.5) * 220;
      w.tele(u.team, 'circle', x, y, 0.85, (w2, ar) => {
        for (const x2 of w2.foesInArea(ar)) { w2.hit(u, x2, u.boss.dmg * 1.2, { kind: 'mob' }); w2.burn(x2, u, 2, u.boss.dmg * u.mult.dmg * 0.15); }
        w2.emit('boom', ar.x, ar.y, ar.r, '#ff7b2e');
        w2.emit('shake', 3);
      }, { r: 78 });
    }, u.team);
    return n * 0.16 + 1;
  },
  meteors2(w, u, t) { return BOSS_MOVES.meteors(w, u, t, true, true); },
  pools(w, u, t) {
    for (const h of heroesOf(w, u.team)) {
      w.tele(u.team, 'circle', h.x, h.y, 0.8, (w2, ar) => fireZone(w2, u, ar.x, ar.y, 92, 6, u.boss.dmg * u.mult.dmg * 0.35), { r: 92 });
    }
    return 1.2;
  },
  breath(w, u, t, p2) {
    const a = angTo(u.x, u.y, t.x, t.y), arc = p2 ? 1.3 : 0.95;
    w.tele(u.team, 'cone', u.x, u.y, 1.0, (w2, ar) => {
      for (const h of w2.foesInArea(ar)) { w2.hit(u, h, u.boss.dmg * 1.7, { kind: 'mob' }); w2.slow(h, 0.5, 2); }
      w2.emit('cone', ar.x, ar.y, ar.ang, ar.len, ar.arc, '#a8eaff');
    }, { ang: a, len: 400, arc, follow: u });
    return 1.6;
  },
  icicles(w, u, t, p2, many) {
    const n = many ? 22 : 13;
    const hs = heroesOf(w, u.team);
    for (let i = 0; i < n; i++) w.later(i * 0.08, () => {
      const h = hs.length ? hs[i % hs.length] : t;
      const x = h.x + (w.rand() - 0.5) * 300, y = h.y + (w.rand() - 0.5) * 300;
      w.tele(u.team, 'circle', x, y, 0.9, (w2, ar) => {
        for (const x2 of w2.foesInArea(ar)) { w2.hit(u, x2, u.boss.dmg, { kind: 'mob' }); w2.slow(x2, 0.4, 1.5); }
        w2.emit('shatter', ar.x, ar.y);
      }, { r: 50 });
    }, u.team);
    return n * 0.08 + 1.1;
  },
  icicles2(w, u, t) { return BOSS_MOVES.icicles(w, u, t, true, true); },
  orbs(w, u, t, p2) {
    const n = p2 ? 7 : 5;
    for (let i = 0; i < n; i++) w.shoot(u, { x: u.x, y: u.y, ang: i / n * TAU, spd: 150, r: 13, dmg: u.boss.dmg * 1.2, life: 6, homing: 1.3, kind: 'frostorb', color: '#a8eaff', noObst: true, onHit: (w2, p, h) => w2.slow(h, 0.5, 2), o: { kind: 'mob' } });
    return 1.3;
  },
  sweep(w, u) {
    w.tele(u.team, 'circle', u.x, u.y, 0.8, (w2, ar) => {
      for (const h of w2.foesInArea(ar)) w2.hit(u, h, u.boss.dmg * 1.4, { kind: 'mob', knock: 320 });
      w2.emit('ring', ar.x, ar.y, ar.r, u.boss.color2);
    }, { r: 225, follow: u });
    return 1.3;
  },
  waves(w, u, t, p2, many) {
    const vol = many ? 2 : 1;
    for (let v = 0; v < vol; v++) w.later(v * 0.6, () => {
      const tt = u.ai.tgt && alive(u.ai.tgt) ? u.ai.tgt : t;
      const a = angTo(u.x, u.y, tt.x, tt.y), n = many ? 5 : 3;
      for (let i = 0; i < n; i++) w.shoot(u, { x: u.x, y: u.y, ang: a + (i - (n - 1) / 2) * 0.32, spd: 340, r: 22, dmg: u.boss.dmg * 1.3, range: 1000, kind: 'crescent', color: '#b07bff', pierce: 99, noObst: true, o: { kind: 'mob' } });
    }, u.team);
    return 1 + vol * 0.6;
  },
  waves2(w, u, t) { return BOSS_MOVES.waves(w, u, t, true, true); },
  beams(w, u, t, p2, many) {
    const n = many ? 6 : 4, spd = many ? 0.75 : 0.55, dir = w.rand() < 0.5 ? 1 : -1, off = w.rand() * TAU;
    for (let i = 0; i < n; i++) {
      w.addArea({ team: u.team, x: u.x, y: u.y, follow: u, shape: 'line', ang: off + i / n * TAU, len: 900, wid: 30, dur: 4.2, delay: 1.1, tele: true, beam: true, tick: 0.2, hostile: true,
        onUpdate: (w2, ar, dt) => { ar.ang += spd * dir * dt; },
        onTick: (w2, ar) => { for (const h of w2.foesInArea(ar)) w2.hit(u, h, u.boss.dmg * 0.55, { kind: 'mob' }); },
      });
    }
    return 4.6;
  },
  beams2(w, u, t) { return BOSS_MOVES.beams(w, u, t, true, true); },
};

function bossTick(w, u, dt) {
