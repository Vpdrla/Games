        pc = null; peer = null; cid = null; pend = [];
      };
      token.on(() => { if (done) return; done = true; reset(); sig.close(); reject(new NetError('cancelled')); });
      sig.onmsg = async (m) => {
        if (done) return;
        const p = m.payload || {};
        if (m.type === 'OFFER') {
          if (peer && peer !== m.src) { sig.send('LEAVE', m.src, { why: 'busy' }); return; }
          if (p.v !== NET_PROTO) { sig.send('LEAVE', m.src, { why: 'version' }); return; }
          reset();
          peer = m.src;
          cid = p.cid;
          const myPc = pc = new RTCPeerConnection({ iceServers: cfg.ice });
          const chans = {};
          const check = () => {
            if (done || pc !== myPc) return;
            if (chans.r && chans.u && chans.r.readyState === 'open' && chans.u.readyState === 'open') {
              done = true;
              const link = new Link(myPc, chans.r, chans.u, 'host');
              setTimeout(() => sig.close(), 1500);
              resolve(link);
            }
          };
          myPc.onicecandidate = (ev) => { if (ev.candidate && pc === myPc) sig.send('CANDIDATE', peer, { cid, c: ev.candidate.toJSON() }); };
          myPc.ondatachannel = (ev) => {
            const ch = ev.channel;
            chans[ch.label] = ch;
            ch.onopen = check;
            check();
          };
          myPc.onconnectionstatechange = () => { if (!done && pc === myPc && myPc.connectionState === 'failed') reset(); };
          try {
            await myPc.setRemoteDescription(p.sdp);
            for (const c of pend.splice(0)) await myPc.addIceCandidate(c).catch(() => {});
            const ans = await myPc.createAnswer();
            await myPc.setLocalDescription(ans);
            if (pc === myPc) sig.send('ANSWER', peer, { cid, sdp: myPc.localDescription });
          } catch (e) { if (pc === myPc) reset(); }
        } else if (m.type === 'CANDIDATE' && m.src === peer && p.cid === cid) {
          if (pc && pc.remoteDescription) pc.addIceCandidate(p.c).catch(() => {});
          else pend.push(p.c);
        } else if (m.type === 'LEAVE' && m.src === peer) reset();
      };
    });
  },

  // Connect to a peer id that is waiting as host.
  async joinId(hostId, token, timeoutMs) {
    const cfg = netConfig();
    const sig = new Signal(NET_PREFIX + 'g-' + randId());
    token.on(() => sig.close());
    await sig.open(12000);
    return new Promise((resolve, reject) => {
      let done = false;
      const pc = new RTCPeerConnection({ iceServers: cfg.ice });
      const r = pc.createDataChannel('r', { ordered: true });
      const u = pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 });
      const cid = randId();
      const pend = [];
      const finish = (err, link) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (err) { try { pc.close(); } catch (e) { /* ignore */ } sig.close(); reject(err); } else { setTimeout(() => sig.close(), 1500); resolve(link); }
      };
      const timer = setTimeout(() => finish(new NetError('timeout', 'Could not connect to the other player. Try again, or try another network (Wi-Fi).')), timeoutMs || 20000);
      token.on(() => finish(new NetError('cancelled')));
      const check = () => { if (r.readyState === 'open' && u.readyState === 'open') finish(null, new Link(pc, r, u, 'guest')); };
      r.onopen = check;
      u.onopen = check;
      pc.onicecandidate = (ev) => { if (ev.candidate) sig.send('CANDIDATE', hostId, { cid, c: ev.candidate.toJSON() }); };
      pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') finish(new NetError('failed', 'The connection failed. Your networks may block direct connections; try Wi-Fi.')); };
      sig.onmsg = async (m) => {
        if (m.src !== hostId || done) return;
        const p = m.payload || {};
        if (m.type === 'ANSWER' && p.cid === cid) {
          try {
            await pc.setRemoteDescription(p.sdp);
            for (const c of pend.splice(0)) await pc.addIceCandidate(c).catch(() => {});
          } catch (e) { finish(new NetError('failed', 'The connection failed.')); }
        } else if (m.type === 'CANDIDATE' && p.cid === cid) {
          if (pc.remoteDescription) pc.addIceCandidate(p.c).catch(() => {}); else pend.push(p.c);
        } else if (m.type === 'EXPIRE') finish(new NetError('notfound', 'Room not found. Check the code and make sure your friend is waiting.'));
        else if (m.type === 'LEAVE') {
          const why = p.why;
          finish(new NetError(why === 'busy' ? 'busy' : why === 'version' ? 'version' : 'left',
            why === 'busy' ? 'That room already has two players.' : why === 'version' ? 'Your friend is running a different version of the game. Both of you should reload.' : 'The host left the room.'));
        }
      };
      pc.createOffer()
        .then((o) => pc.setLocalDescription(o))
        .then(() => sig.send('OFFER', hostId, { v: NET_PROTO, cid, sdp: pc.localDescription }))
        .catch(() => finish(new NetError('failed', 'Could not start a connection on this device.')));
    });
  },

  joinRoom(code, token) {
    return this.joinId(NET_PREFIX + code.toUpperCase(), token, 20000);
  },

  // Random matchmaking: whoever grabs the shared lobby id waits; the next player connects to them.
  async quickMatch(token, onStatus) {
    for (let i = 0; i < 40; i++) {
      if (token.cancelled) throw new NetError('cancelled');
      const sig = new Signal(QUICK_ID);
      token.on(() => sig.close());
      let hosting = false;
      try {
        await sig.open(12000);
        hosting = true;
      } catch (e) {
        if (e.code !== 'taken') throw e;
      }
      if (hosting) {
        onStatus('Searching for an opponent…');
        return this.acceptGuest(sig, token);
      }
      onStatus('Opponent found! Connecting…');
      try {
        return await this.joinId(QUICK_ID, token, 12000);
      } catch (e) {
        if (token.cancelled || e.code === 'cancelled' || e.code === 'offline') throw e;
        onStatus('Searching for an opponent…');
        await sleep(rand(400, 1800));
      }
    }
    throw new NetError('timeout', 'No opponent found right now. Try again later or invite a friend with a room code.');
  },
};

let SAVE = null;

const CHESTS = {

const CHEST_CYCLE = 'SSGSSSGSMSSGSSSGSSHSSGSSESSSGSSMSSGSSLSS'.split('').map((c) => ({ S: 'silver', G: 'gold', M: 'magic', H: 'giant', E: 'epic', L: 'legendary' }[c]));
const FREE_CHEST_EVERY = 4 * 60 * 60 * 1000;
const CROWNS_FOR_CHEST = 10;

function defaultSave() {
  const cards = {};
  for (const k of STARTER_DECK) cards[k] = { lvl: 1, n: 0 };
  return {
    v: 1,
    name: 'Player' + randi(1000, 9999),

    gold: 150, gems: 60,
    king: 1, kingXp: 0,
    cards,
    decks: [STARTER_DECK.slice(), STARTER_DECK.slice(), STARTER_DECK.slice()],
    deck: 0,
    chests: [null, null, null, null],
    cycle: 0,
    crowns: 0,
    free: null,
    shop: null,
    stats: { wins: 0, losses: 0, draws: 0, three: 0, onlineWins: 0, onlineLosses: 0, bestStreak: 0, streak: 0, played: 0 },
    settings: { sfx: true, music: true, vibrate: true },
    tutorial: false,
    arenaSeen: 0,
    fresh: {},
  };
}

function loadGame() {
  const d0 = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      SAVE = Object.assign(d0, d);
      SAVE.stats = Object.assign(defaultSave().stats, d.stats || {});
      SAVE.settings = Object.assign(defaultSave().settings, d.settings || {});
      SAVE.fresh = d.fresh || {};
      for (const k of Object.keys(SAVE.cards)) if (!CARDS[k]) delete SAVE.cards[k];
      for (const k of STARTER_DECK) if (!SAVE.cards[k]) SAVE.cards[k] = { lvl: 1, n: 0 };
      if (!Array.isArray(SAVE.decks) || SAVE.decks.length !== 3) SAVE.decks = defaultSave().decks;
      SAVE.decks = SAVE.decks.map((dk) => (Array.isArray(dk) && dk.length === 8 && dk.every((k) => SAVE.cards[k]) && new Set(dk).size === 8 ? dk : STARTER_DECK.slice()));
      if (!(SAVE.deck >= 0 && SAVE.deck < 3)) SAVE.deck = 0;
      if (!Array.isArray(SAVE.chests) || SAVE.chests.length !== 4) SAVE.chests = [null, null, null, null];
      return;
    }
  } catch (e) { /* corrupted or unavailable storage: start fresh */ }
  SAVE = d0;
}

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* storage unavailable */ }
}

function resetGame() {
  const s = SAVE.settings;
  SAVE = defaultSave();
  SAVE.settings = s;
  saveGame();
}

const curDeck = () => SAVE.decks[SAVE.deck];
const cardLvl = (k) => (SAVE.cards[k] ? SAVE.cards[k].lvl : 1);
const curArena = () => arenaIndex(SAVE.trophies);

function deckLevels() {
  const lv = {};
  for (const k of CARD_KEYS) lv[k] = cardLvl(k);
  return lv;
}

function avgDeckLevel(deck) {
  return deck.reduce((a, k) => a + cardLvl(k), 0) / deck.length;
}

function avgElixir(deck) {
  return deck.reduce((a, k) => a + CARDS[k].cost, 0) / deck.length;
}

// ---- upgrades ----
function upgradeCost(k) {
  const c = SAVE.cards[k];
  if (!c || c.lvl >= MAX_LEVEL) return null;
  const r = RARITY[CARDS[k].rarity];
  return { copies: r.copies[c.lvl - 1], gold: UPGRADE_GOLD[c.lvl - 1], xp: Math.round(UPGRADE_XP[c.lvl - 1] * r.xp) };
}

function canUpgrade(k) {
  const u = upgradeCost(k);
  return !!u && SAVE.cards[k].n >= u.copies && SAVE.gold >= u.gold;
}

function upgradeCard(k) {
  const u = upgradeCost(k);
  if (!u || !canUpgrade(k)) return null;
  const c = SAVE.cards[k];
  c.n -= u.copies;
  c.lvl++;
  SAVE.gold -= u.gold;
  const kingUps = addKingXp(u.xp);
  saveGame();
  return { lvl: c.lvl, xp: u.xp, kingUps };
}

function addKingXp(n) {
  SAVE.kingXp += n;
  let ups = 0;
  while (SAVE.king < MAX_LEVEL && SAVE.kingXp >= KING_XP[SAVE.king - 1]) {
    SAVE.kingXp -= KING_XP[SAVE.king - 1];
    SAVE.king++;
    SAVE.gems += 10;
    ups++;
  }
  if (SAVE.king >= MAX_LEVEL) SAVE.kingXp = 0;
  return ups;
}

function addCards(k, n) {
  const had = !!SAVE.cards[k];
  if (!had) {
    SAVE.cards[k] = { lvl: 1, n: n - 1 };
    SAVE.fresh[k] = true;
  } else SAVE.cards[k].n += n;
  return !had;
}

// ---- chests ----
function rollChest(type, arena, seed) {
  const def = CHESTS[type];
  const rng = new RNG(seed || (Date.now() & 0xffffffff));
  const pool = cardsForArena(arena);
  const byR = (r) => pool.filter((k) => CARDS[k].rarity === r);
  const out = [];
  const addStack = (rar, n) => {
    const list = byR(rar);
    if (!list.length || n <= 0) return;
    const k = rng.pick(list);
    const ex = out.find((o) => o.key === k);
    if (ex) ex.n += n; else out.push({ key: k, n });
  };
  const mult = 1 + arena * 0.35;
  if (def.only) {
    const n = Math.max(1, Math.round(def.cards * (def.only === 'legendary' ? 1 : mult * 0.6)));
    if (!byR(def.only).length) addStack('epic', Math.max(1, Math.round(n * 0.5)) || 1);
    else if (def.only === 'legendary') addStack('legendary', n);
    else { const a = Math.ceil(n / 2); addStack('epic', a); addStack('epic', n - a); }
  } else {
    let total = Math.round(def.cards * mult);
    let leg = 0, epic = def.minEpic || 0, rare = 0;
    for (let i = 0; i < total; i++) {
      const r = rng.next();
      if (r < def.leg) leg++; else if (r < def.leg + def.epic) epic++; else if (r < def.leg + def.epic + def.rare) rare++;
    }
    if (total >= 20) rare = Math.max(rare, Math.floor(total * 0.1));
    if (!byR('legendary').length) { epic += leg; leg = 0; }
    const common = Math.max(0, total - leg - epic - rare);
    const stacks = total >= 100 ? 4 : total >= 40 ? 3 : total >= 15 ? 3 : 2;
    let left = common;
    for (let i = 0; i < stacks; i++) {
      const n = i === stacks - 1 ? left : Math.round(left * rng.range(0.3, 0.55));
      addStack('common', n);
      left -= n;
    }
    if (rare) { const a = Math.ceil(rare * rng.range(0.5, 0.75)); addStack('rare', a); addStack('rare', rare - a); }
    if (epic) addStack('epic', epic);
    if (leg) addStack('legendary', leg);
  }
  const gold = Math.round(rng.range(def.gold[0], def.gold[1]) * (1 + arena * 0.5));
  const gems = def.gems ? rng.int(def.gems[0], def.gems[1]) : 0;
  out.sort((a, b) => RARITY_ORDER.indexOf(CARDS[a.key].rarity) - RARITY_ORDER.indexOf(CARDS[b.key].rarity));
  return { cards: out, gold, gems };
}

// Apply a chest's contents; returns the list with "new" markers for the reveal screen.
function grantChest(loot) {
  const res = [];
  for (const c of loot.cards) {
    const isNew = addCards(c.key, c.n);
    const rec = SAVE.cards[c.key];
    if (rec.lvl >= MAX_LEVEL && rec.n > 0) { SAVE.gold += rec.n * 5; rec.n = 0; }
    res.push({ key: c.key, n: c.n, isNew });
  }
  SAVE.gold += loot.gold;
  SAVE.gems += loot.gems;
  saveGame();
  return res;
}

function chestSlotFree() { return SAVE.chests.findIndex((c) => !c); }

function awardChest() {
  const i = chestSlotFree();
  if (i < 0) return null;
  const type = CHEST_CYCLE[SAVE.cycle % CHEST_CYCLE.length];
  SAVE.cycle++;
  SAVE.chests[i] = { type, arena: curArena(), unlockAt: 0, seed: randi(1, 1e9) };
  return SAVE.chests[i];
}

function chestState(ch) {
  if (!ch) return 'empty';
  if (!ch.unlockAt) return 'locked';
  return Date.now() >= ch.unlockAt ? 'ready' : 'unlocking';
}

function anyUnlocking() { return SAVE.chests.some((c) => chestState(c) === 'unlocking'); }

function gemsToOpen(ch) {
  const ms = ch.unlockAt ? Math.max(0, ch.unlockAt - Date.now()) : CHESTS[ch.type].time * 1000;
  return Math.max(1, Math.ceil(ms / 1000 / 60 / 6));
}

// Free chests build up every few hours (at most two waiting).
function freeState() {
  const now = Date.now();
  let f = SAVE.free;
  if (!f || typeof f.n !== 'number') f = SAVE.free = { n: 1, at: now + FREE_CHEST_EVERY };
  while (f.n < 2 && now >= f.at) { f.n++; f.at += FREE_CHEST_EVERY; }
  if (f.n >= 2) f.at = now + FREE_CHEST_EVERY;
  return f;
}

function takeFreeChest() {
  const f = freeState();
  if (f.n <= 0) return false;
  f.n--;
  saveGame();
  return true;
}

function nextFreeChestIn() {
  const f = freeState();
  return f.n > 0 ? 0 : Math.max(0, f.at - Date.now());
}

// ---- shop ----
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function refreshShop() {
  const day = todayKey();
  if (SAVE.shop && SAVE.shop.day === day) return SAVE.shop;
  const rng = new RNG(hashStr(day + SAVE.name));
  const pool = cardsForArena(curArena());
  const pick = (r) => { const l = pool.filter((k) => CARDS[k].rarity === r); return l.length ? rng.pick(l) : null; };
  const offers = [];
  const c1 = pick('common'), c2 = pick('common'), r1 = pick('rare'), e1 = pick('epic');
  if (c1) offers.push({ key: c1, n: 10, price: 150, cur: 'gold' });
  if (r1) offers.push({ key: r1, n: 3, price: 360, cur: 'gold' });
  if (e1) offers.push({ key: e1, n: 1, price: 1200, cur: 'gold' });
  if (c2 && c2 !== c1) offers.push({ key: c2, n: 20, price: 280, cur: 'gold' });
  SAVE.shop = { day, offers: offers.map((o) => Object.assign(o, { bought: false })) };
  saveGame();
  return SAVE.shop;
}

const SHOP_CHESTS = [
  { type: 'magic', gems: 90 },
  { type: 'giant', gems: 140 },
  { type: 'epic', gems: 180 },
  { type: 'legendary', gems: 350 },
];
const GOLD_PACKS = [{ gold: 250, gems: 20 }, { gold: 1500, gems: 100 }];

// ---- opponents & rewards ----
function aiOpponent(training) {
  const t = SAVE.trophies;
  const a = arenaIndex(t);
  const rng = new RNG(Date.now() & 0xffffff);
  const deck = buildAIDeck(training ? 0 : a, rng);
  const expected = 1 + t / 330;
  const mine = avgDeckLevel(curDeck());
  const offset = [-1, -0.5, -0.2, 0, 0.2, 0.4, 0.6, 0.8][a];
  const mean = training ? Math.max(1, mine - 1) : clamp(0.5 * expected + 0.5 * mine + offset + (t < 60 ? -1 : 0), 1, MAX_LEVEL);
  const levels = {};
  for (const k of CARD_KEYS) levels[k] = clamp(Math.round(mean + rng.range(-0.5, 0.5)), 1, MAX_LEVEL);
  const king = clamp(Math.round(training ? SAVE.king - 1 : 0.5 * SAVE.king + 0.5 * mean + (a >= 5 ? 0.5 : 0)), 1, MAX_LEVEL);
  const skill = training ? 0.05 : t < 60 ? 0.1 : clamp(0.18 + a * 0.115, 0, 1);
  const name = training ? 'Training Dummy' : rng.pick(AI_NAMES);
  const trophies = training ? 0 : Math.max(0, t + rng.int(-40, 40));
  return { deck, levels, king, skill, name, trophies };
}

// Called once a battle has ended; returns what was earned for the result screen.
function applyResult(r) {
  // r: { mode, win (bool), draw (bool), myCrowns, theirCrowns }
  const out = { trophies: 0, gold: 0, chest: null, crowns: 0, arenaUp: null, crownChest: false };
  const st = SAVE.stats;
  st.played++;
  if (r.mode === 'training') {
    if (r.win) out.gold = 5;
    SAVE.gold += out.gold;
    saveGame();
    return out;
  }
  const online = r.mode === 'host' || r.mode === 'guest';
  const a = curArena();
  if (r.win) {
    if (online) st.onlineWins++; else st.wins++;
    st.streak++;
    st.bestStreak = Math.max(st.bestStreak, st.streak);
    if (r.myCrowns >= 3) st.three++;
    out.gold = 15 + a * 6 + r.myCrowns * 3;
    if (!online) out.trophies = 28 + Math.min(4, Math.max(-4, Math.round((r.oppTrophies - SAVE.trophies) / 25)));
    out.chest = awardChest();
  } else if (r.draw) {
    st.draws++;
    st.streak = 0;
    out.gold = 5;
  } else {
    if (online) st.onlineLosses++; else st.losses++;
    st.streak = 0;
    if (!online) {
      const floor = ARENAS[arenaIndex(SAVE.trophies)].min;
      out.trophies = -Math.min(16, Math.max(0, SAVE.trophies - floor));
    }
  }
  const before = arenaIndex(SAVE.trophies);
  SAVE.trophies = Math.max(0, SAVE.trophies + out.trophies);
  SAVE.best = Math.max(SAVE.best, SAVE.trophies);
  const after = arenaIndex(SAVE.trophies);
  if (after > before && after > SAVE.arenaSeen) { out.arenaUp = after; SAVE.arenaSeen = after; }
  SAVE.gold += out.gold;
  out.crowns = r.myCrowns;
  const prev = SAVE.crowns;
  SAVE.crowns = Math.min(CROWNS_FOR_CHEST, SAVE.crowns + r.myCrowns);
  out.crownChest = prev < CROWNS_FOR_CHEST && SAVE.crowns >= CROWNS_FOR_CHEST;
  saveGame();
  return out;
}

// ===== 10-battle.js =====
// ---------- Battle scene: runs one match in offline, host or guest mode ----------
// offline ('ai' / 'training'): local Sim + AI.  host: local Sim, the remote player is team 1 and
// receives snapshots.  guest: no Sim; draws the host's snapshots and sends card plays.
const KINDS = ['troop', 'building', 'tower', 'proj', 'area'];
const UKEYS = Object.keys(UNITS).concat(['princess', 'king']);
const PKEYS = ['arrow', 'spear', 'bullet', 'cannonball', 'bomb', 'spit', 'orb', 'ice', 'flame', 'fireorb', 'fireball', 'log'];
const AKEYS = ['arrows', 'freeze', 'poison'];
const SNAP_EVERY = 2; // sim ticks per snapshot (15 per second)

const r2 = (v) => Math.round(v * 100);

class BattleScene {
  constructor(cfg) {
    this.cfg = cfg;
    this.mode = cfg.mode;
    this.myTeam = this.mode === 'guest' ? 1 : 0;
    this.view = new BattleView(this, { myTeam: this.myTeam, arena: cfg.arena });
    this.link = cfg.link || null;
    this.acc = 0;
    this.intro = 1.8;
    this.ended = false;
    this.endT = 0;
    this.result = null;
    this.paused = false;
    this.speed = 1;
    this.names = cfg.names;
    this.subs = cfg.subs || ['', ''];
    this.dblShown = false;
    this.outEv = [];
    this.snapTick = 0;
    this.pending = new Map();
    this.playSeq = 0;
    if (this.mode !== 'guest') {
      this.sim = new Sim({ decks: cfg.decks, levels: cfg.levels, kings: cfg.kings, seed: cfg.seed });
      if (this.mode === 'ai' || this.mode === 'training') this.ai = new AIPlayer(this.sim, 1, cfg.aiSkill, cfg.seed + 7);
    } else {
      this.g = { ents: new Map(), t: 0, ot: false, crowns: [0, 0], elixir: 5, hand: [null, null, null, null], next: null, lastAt: 0, period: 66, tick: -1, over: false };
    }
  }

  enter() {
    UI.showScreen(null);
    Music.play('battle');
    Game.keepAwake(true);
    if (this.link) {
      this.link.listen((m) => this.onNet(m));
      this.link.onclose = () => Lobby.onClose();
    }
    if (this.mode === 'ai' && !SAVE.tutorial) this.view.message('Drag a card onto your side!', '#ffe082', 4);
  }

  exit() {
    Game.keepAwake(false);
    if (this.link) this.link.onmsg = null;
  }

  onHidden() {
    if ((this.mode === 'ai' || this.mode === 'training') && !this.ended) this.openMenu();
  }

  // ---- per-frame ----
  update(dt) {
    const st = this.state();
    this.view.update(dt, st);
    if (this.intro > 0) { this.intro -= dt; return; }
    if (this.paused) return;
    if (this.sim) {
      this.acc += dt * this.speed;
      let n = 0;
      while (this.acc >= SIM_DT && n < 8 * this.speed) {
        this.acc -= SIM_DT;
        if (this.sim.over) break;
        if (this.ai) this.ai.update(SIM_DT);
        if (this.bot) this.bot.update(SIM_DT);
        this.sim.step();
        this.drain();
        n++;
        if (this.mode === 'host' && ++this.snapTick % SNAP_EVERY === 0) this.sendSnap();
      }
      if (this.acc > SIM_DT * 2) this.acc = SIM_DT * 2;
      if (!this.dblShown && this.sim.t >= DOUBLE_AT) { this.dblShown = true; this.view.onEvent(['dbl']); }
      if (this.sim.over && !this.ended) {
        const s = this.sim;
        const res = { winner: s.winner, crowns: [s.p[0].crowns, s.p[1].crowns], reason: s.endReason };
        if (this.mode === 'host') { this.sendSnap(); this.link.send({ t: 'end', w: res.winner, c: res.crowns, why: res.reason }); }
        this.finish(res);
      }
    } else {
      if (!this.dblShown && this.g.t >= DOUBLE_AT) { this.dblShown = true; this.view.onEvent(['dbl']); }
      for (const [slot, p] of this.pending) if (performance.now() - p.at > 2500) this.pending.delete(slot);
    }
    if (this.ended) {
      this.endT += dt;
      if (this.endT > 2.6 && !this.resultShown) {
        this.resultShown = true;
        Game.battleOver(this);
      }
    }
  }

  draw(ctx) { this.view.draw(ctx, this.state()); }

  pointer(type, x, y) {
    if (UI.modalOpen()) return;
    if (type === 'down' && this.view.hitMenu(x, y)) { Sound.play('click'); this.openMenu(); return; }
    if (this.ended) return;
    this.view.pointer(type, x, y, this.state());
  }

  drain() {
    const evs = this.sim.events;
    for (const ev of evs) {
      this.view.onEvent(ev);
      if (this.ai && ev[0] === 'tower' && Math.random() < 0.6) {
        const lostByAi = ev[2] === 1;
        setTimeout(() => this.view.showEmote(1, lostByAi ? choice([2, 3]) : choice([0, 1, 4])), 700);
      }
      if (this.mode === 'host') this.outEv.push(ev.map((v) => (typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v)));
    }
    evs.length = 0;
  }

  state() {
    if (this.sim) {
      const s = this.sim, me = s.p[this.myTeam], foe = s.p[1 - this.myTeam];
      return {
        ents: s.ents, alpha: clamp(this.acc / SIM_DT, 0, 1), t: s.t, timeLeft: s.timeLeft(), ot: s.ot, dbl: s.t >= DOUBLE_AT, over: s.over,
        intro: this.intro, tutorial: this.mode === 'ai' && !SAVE.tutorial && s.p[0].plays === 0 && s.t > 1.5,
        me: { elixir: me.elixir, hand: me.hand, next: me.queue[0], crowns: me.crowns, name: this.names[this.myTeam] },
        foe: { crowns: foe.crowns, name: this.names[1 - this.myTeam], sub: this.subs[1 - this.myTeam] },
        canPlace: (k, x, y) => s.canPlace(this.myTeam, k, x, y),
      };
    }
    const g = this.g;
    const now = performance.now();
    const alpha = clamp((now - g.lastAt) / g.period, 0, 1);
    const extra = g.over || !g.lastAt ? 0 : Math.min(0.5, (now - g.lastAt) / 1000);
    const mult = g.t >= DOUBLE_AT ? 2 : 1;
    const t = g.t + extra;
    return {
      ents: this.gList || [], alpha, t, timeLeft: g.ot ? REG_TIME + OT_TIME - t : REG_TIME - t, ot: g.ot, dbl: g.t >= DOUBLE_AT, over: g.over,
      intro: this.intro, stalled: !g.over && this.intro <= 0 && now - g.lastAt > 1500,
      me: { elixir: Math.min(10, g.elixir + extra * ELIXIR_RATE * mult), hand: g.hand, next: g.next, crowns: g.crowns[1], name: this.names[1], pending: new Set(this.pending.keys()) },
      foe: { crowns: g.crowns[0], name: this.names[0], sub: this.subs[0] },
      canPlace: (k, x, y) => this.guestCanPlace(k, x, y),
    };
  }

  // ---- player actions ----
  tryPlay(slot, x, y) {
    if (this.ended || this.intro > 0) return false;
    if (this.mode === 'guest') {
      const key = this.g.hand[slot];
      if (!key || this.pending.has(slot)) return false;
      const n = ++this.playSeq;
      this.pending.set(slot, { n, at: performance.now(), key });
      this.link.send({ t: 'play', s: slot, k: key, x, y, n });
      this.view.fx.puff(x, y, 3, 'rgba(255,255,255,0.6)', 0.4);
      return true;
    }
    const r = this.sim.play(this.myTeam, slot, x, y);
    if (r === 'ok') {
      if (!SAVE.tutorial && this.mode === 'ai') { SAVE.tutorial = true; saveGame(); }
      return true;
    }
    if (r === 'elixir') this.view.message('Not enough elixir', '#ff9cf2', 1.1);
    else if (r === 'place') this.view.badSpot = 0.6;
    Sound.play('error');
    return false;
  }

  sendEmote(i) {
    this.view.showEmote(this.myTeam, i);
    if (this.link) this.link.send({ t: 'emo', i });
    else if (this.ai && Math.random() < 0.5) setTimeout(() => this.view.showEmote(1, choice([0, 1, 2, 4])), 900);
  }

  surrender() {
    if (this.ended) return;
    if (this.link) this.link.send({ t: 'bye' });
    const s = this.sim;
    const crowns = s ? [s.p[0].crowns, s.p[1].crowns] : this.g.crowns.slice();
    crowns[1 - this.myTeam] = 3;
    this.finish({ winner: 1 - this.myTeam, crowns, reason: 'surrender' });
  }

  openMenu() {
    if (this.ended) return;
    const offline = !this.link;
    if (offline) this.paused = true;
    UI.battleMenu(this, offline);
  }

  resume() { this.paused = false; }

  finish(res) {
    if (this.ended) return;
    this.ended = true;
    this.result = res;
    if (this.g) this.g.over = true;
    const won = res.winner === this.myTeam, draw = res.winner === -1;
    this.view.message(draw ? 'DRAW' : won ? 'VICTORY!' : 'DEFEAT', draw ? '#fff' : won ? '#8fd0ff' : '#ff8a8a', 3);
    Sound.play(draw ? 'warn' : won ? 'victory' : 'defeat');
    Music.stop();
  }

  onDisconnect() {
    if (this.ended) return;
    this.view.message('Opponent disconnected', '#ffe082', 3);
    const crowns = this.sim ? [this.sim.p[0].crowns, this.sim.p[1].crowns] : this.g.crowns.slice();
    this.finish({ winner: this.myTeam, crowns, reason: 'disconnect' });
  }

  // ---- networking ----
  onNet(m) {
    switch (m.t) {
      case 's': if (this.mode === 'guest') this.applySnap(m); break;
      case 'play':
        if (this.mode === 'host' && !this.ended) {
          const p = this.sim.p[1];
          const r = p.hand[m.s] === m.k ? this.sim.play(1, m.s, +m.x, +m.y) : 'card';
          if (r !== 'ok') this.link.send({ t: 'rej', n: m.n, s: m.s, why: r });
        }
        break;
      case 'rej':
        this.pending.delete(m.s);
        if (m.why === 'elixir') this.view.message('Not enough elixir', '#ff9cf2', 1.1);
        else if (m.why === 'place') this.view.badSpot = 0.6;
        Sound.play('error');
        break;
      case 'emo': this.view.showEmote(1 - this.myTeam, m.i | 0); break;
      case 'end':
        if (this.mode === 'guest') this.finish({ winner: m.w, crowns: m.c, reason: m.why });
        break;
      case 'bye':
        if (!this.ended) {
          this.view.message('Opponent surrendered', '#ffe082', 3);
          const crowns = this.sim ? [this.sim.p[0].crowns, this.sim.p[1].crowns] : this.g.crowns.slice();
          crowns[this.myTeam] = 3;
          if (this.mode === 'host') this.link.send({ t: 'end', w: 0, c: crowns, why: 'surrender' });
          this.finish({ winner: this.myTeam, crowns, reason: 'surrender' });
        } else Lobby.onPeerMessage(m);
        break;
      default:
        Lobby.onPeerMessage(m);
    }
  }

  sendSnap() {
    const s = this.sim;
    const E = [];
    for (const e of s.ents) {
      if (e.dead) continue;
      const a = [e.id, KINDS.indexOf(e.kind), e.team, r2(e.x), r2(e.y)];
      if (e.kind === 'troop' || e.kind === 'building' || e.kind === 'tower') {
        const fl = (e.deployT > 0 ? 1 : 0) | (e.freezeT > 0 ? 2 : 0) | (e.stunT > 0 ? 4 : 0) | (e.slowT > 0 ? 8 : 0) | (e.attacking ? 16 : 0) |
          (e.moving ? 32 : 0) | (e.charging ? 64 : 0) | (e.jumping ? 128 : 0) | (e.tunnel ? 256 : 0) | (e.active ? 512 : 0) | (e.air ? 1024 : 0);
        const atk = e.attacking && e.st.hs ? Math.round(clamp(1 - e.cd / e.st.hs, 0, 1) * 99) : -1;
        a.push(UKEYS.indexOf(e.u), Math.ceil(e.hp), e.maxHp, e.lvl, fl, r2(e.fx), r2(e.fy), atk, r2(Math.max(0, e.deployT || 0)));
        if (e.kind === 'tower') a.push(e.lane);
        else if (e.u === 'inferno' && e.target && e.attacking) a.push(r2(e.target.x), r2(e.target.y), e.rampT < 2 ? 0 : e.rampT < 4 ? 1 : 2, e.target.air ? 1 : 0);
      } else if (e.kind === 'proj') {
        a.push(PKEYS.indexOf(e.pt), r2(e.trav), r2(e.d0), r2(e.h0 == null ? 0.8 : e.h0), r2(e.h1 == null ? 0.5 : e.h1), r2(e.tx), r2(e.ty));
      } else if (e.kind === 'area') {
        a.push(AKEYS.indexOf(e.sp), r2(e.r), r2(e.t), r2(e.dur));
      }
      E.push(a);
    }
    const p = s.p[1];
    this.link.send({ t: 's', k: s.tick, tm: r2(s.t), ot: s.ot ? 1 : 0, c: [s.p[0].crowns, s.p[1].crowns], el: r2(p.elixir), h: p.hand, n: p.queue[0], E, V: this.outEv }, true);
    this.outEv = [];
  }

  applySnap(m) {
    const g = this.g;
    if (m.k <= g.tick) return;
    const now = performance.now();
    const alphaNow = clamp((now - g.lastAt) / g.period, 0, 1);
    if (g.lastAt) g.period = clamp(lerp(g.period, now - g.lastAt, 0.2), 40, 250);
    g.lastAt = now;
    g.tick = m.k;
    g.t = m.tm / 100;
    g.ot = !!m.ot;
    g.crowns = m.c;
    g.elixir = m.el / 100;
    // cards we played have left the hand once the host confirms them
    for (const [slot, p] of this.pending) if (m.h[slot] !== p.key || now - p.at > 2500) this.pending.delete(slot);
    g.hand = m.h;
    g.next = m.n;
    const seen = new Set();
    for (const a of m.E) {
      const id = a[0];
      seen.add(id);
      let e = g.ents.get(id);
      const x = a[3] / 100, y = a[4] / 100;
      if (!e) { e = { id, x, y, px: x, py: y }; g.ents.set(id, e); } else {
        e.px = lerp(e.px, e.x, alphaNow);
        e.py = lerp(e.py, e.y, alphaNow);
        e.x = x;
        e.y = y;
      }
      e.kind = KINDS[a[1]];
      e.team = a[2];
      if (e.kind === 'troop' || e.kind === 'building' || e.kind === 'tower') {
        e.u = UKEYS[a[5]];
        e.hp = a[6];
        e.maxHp = a[7];
        e.lvl = a[8];
        const fl = a[9];
        e.deployT = fl & 1 ? a[13] / 100 : 0;
        e.freezeT = fl & 2 ? 1 : 0;
        e.stunT = fl & 4 ? 1 : 0;
        e.slowT = fl & 8 ? 1 : 0;
        e.attacking = !!(fl & 16);
        e.moving = !!(fl & 32);
        e.charging = !!(fl & 64);
        e.jumping = !!(fl & 128);
        e.tunnel = !!(fl & 256);
        e.active = !!(fl & 512);
        e.air = !!(fl & 1024);
        e.fx = a[10] / 100;
        e.fy = a[11] / 100;
        e.atk = a[12] < 0 ? -1 : a[12] / 99;
        if (e.kind === 'tower') {
          e.tt = e.u;
          e.lane = a[14];
          const ts = TOWER_STATS[e.tt];
          e.r = ts.r;
          e.half = e.tt === 'king' ? 2 : 1.5;
        } else {
          const u = UNITS[e.u];
          e.r = u ? u.r : 0.5;
          e.spd = u ? u.speed || 1 : 1;
          if (a.length > 14) { e.tgx = a[14] / 100; e.tgy = a[15] / 100; e.ramp = a[16]; e.tgAir = !!a[17]; } else e.tgx = null;
        }
      } else if (e.kind === 'proj') {
        e.pt = PKEYS[a[5]];
        e.trav = a[6] / 100;
        e.d0 = a[7] / 100;
        e.h0 = a[8] / 100;
        e.h1 = a[9] / 100;
        e.tx = a[10] / 100;
        e.ty = a[11] / 100;
        if (e.pt === 'log') e.dir = 1;
      } else if (e.kind === 'area') {
        e.sp = AKEYS[a[5]];
        e.r = a[6] / 100;
        e.t = a[7] / 100;
        e.dur = a[8] / 100;
      }
    }
    for (const id of g.ents.keys()) if (!seen.has(id)) g.ents.delete(id);
    this.gList = Array.from(g.ents.values());
    for (const ev of m.V || []) this.view.onEvent(ev);
  }

  guestCanPlace(key, x, y) {
    const list = this.gList || [];
    const towers = [0, 1].map((team) => [0, 1, -1].map((lane) => list.find((e) => e.kind === 'tower' && e.team === team && e.lane === lane) || { dead: true }));
    return Sim.prototype.canPlace.call({ ents: list, towers }, 1, key, Math.round(x * 2) / 2, Math.round(y * 2) / 2);
  }
}

const imgCache = new Map();
function cardImg(key, w) {
  const ck = key + '@' + w;
  let u = imgCache.get(ck);
  if (!u) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    u = cardArt(key, Math.round(w * dpr), Math.round(w * 1.24 * dpr)).toDataURL();
    imgCache.set(ck, u);
  }
  return u;
}

function chestImg(type, open) {
  const ck = 'chest:' + type + (open ? ':o' : '');
  let u = imgCache.get(ck);
  if (u) return u;
  const def = CHESTS[type];
  const cv = makeCanvas(160, 150);
  const x = cv.getContext('2d');
  x.translate(80, 84);
  x.scale(50, 50);
  x.fillStyle = 'rgba(0,0,0,0.3)';
  ellipse(x, 0, 0.95, 1.2, 0.25);
  x.fill();
  // body
  rrect(x, -1.2, -0.4, 2.4, 1.3, 0.18, def.col, 0.08);
  x.fillStyle = shade(def.col, -0.25);
  x.fillRect(-1.16, 0.45, 2.32, 0.4);
  rrect(x, -1.25, -0.45, 0.35, 1.38, 0.08, def.dark, 0.06);
  rrect(x, 0.9, -0.45, 0.35, 1.38, 0.08, def.dark, 0.06);
  if (open) {
    x.fillStyle = 'rgba(255,240,180,0.85)';
    x.beginPath();
    x.moveTo(-1, -0.4);
    x.lineTo(-1.5, -1.5);
    x.lineTo(1.5, -1.5);
    x.lineTo(1, -0.4);
    x.fill();
    rrect(x, -1.2, -1.45, 2.4, 0.5, 0.2, def.col, 0.08);
  } else {
    x.beginPath();
    x.moveTo(-1.2, -0.35);
    x.lineTo(-1.2, -0.7);
    x.quadraticCurveTo(0, -1.45, 1.2, -0.7);
    x.lineTo(1.2, -0.35);
    x.closePath();
    fillStroke(x, shade(def.col, 0.15), 0.08);
    rrect(x, -1.25, -0.8, 0.35, 0.5, 0.08, def.dark, 0.06);
    rrect(x, 0.9, -0.8, 0.35, 0.5, 0.08, def.dark, 0.06);
    rrect(x, -0.22, -0.55, 0.44, 0.5, 0.1, GOLDC, 0.06);
    x.fillStyle = OUT;
    circle(x, 0, -0.33, 0.07);
    x.fill();
  }
  if (type === 'crown') poly(x, [-0.5, 0.55, -0.5, 0.1, -0.25, 0.3, 0, -0.05, 0.25, 0.3, 0.5, 0.1, 0.5, 0.55], GOLDC, 0.05);
  if (type === 'legendary' || type === 'epic' || type === 'magic') {
    x.fillStyle = 'rgba(255,255,255,0.8)';
    for (const [sx, sy] of [[-0.7, -1.1], [0.8, -1.2], [1.3, 0.2]]) { circle(x, sx, sy, 0.07); x.fill(); }
  }
  u = cv.toDataURL();
  imgCache.set(ck, u);
  return u;
}

function arenaPreview(cv, a) {
  const theme = ARENAS[a];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || 300, h = cv.clientHeight || 170;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const x = cv.getContext('2d');
  x.scale(dpr, dpr);
  const T = w / 12;
  const bg = paintArena(theme, T * dpr, false);
  x.drawImage(bg.canvas, -(bg.pad + 3) * T, -(bg.pad + 1.2) * T, (AW + bg.pad * 2) * T, (AH + bg.pad * 2) * T);
  const tw = [{ tt: 'princess', lane: 0, x: 3.5, y: 6.5 }, { tt: 'king', lane: -1, x: 9, y: 3 }, { tt: 'princess', lane: 1, x: 14.5, y: 6.5 }];
  for (const t of tw) {
    x.save();
    x.translate((t.x - 3) * T, (t.y - 1.2 + 2.2) * T);
    x.scale(T * 0.85, T * 0.85);
    drawTower(x, t, { c: TEAM_COLORS[a % 2 === 0 ? 1 : 0], aimX: 0.3, aimY: 1, t: 1, atk: -1, active: true });
    x.restore();
  }
}

const UI = {
  pageName: 'battle',
  swapKey: null,
  lastTick: 0,

  init() {
    for (const b of document.querySelectorAll('#nav button')) b.addEventListener('click', () => { Sound.play('click'); this.page(b.dataset.p); });
    $('modal').addEventListener('pointerdown', (e) => { if (e.target === $('modal') && this.modalDismiss) this.closeModal(); });
  },

  showScreen(name) {
    $('home').classList.toggle('show', name === 'home');
    if (name === 'home') { this.refreshTop(); this.page(this.pageName); }
  },

  page(name) {
    if (name !== 'cards') this.swapKey = null;
    this.pageName = name;
    for (const s of document.querySelectorAll('.page')) s.classList.toggle('show', s.id === 'p-' + name);
    for (const b of document.querySelectorAll('#nav button')) b.classList.toggle('on', b.dataset.p === name);
    this.render(name);
    this.refreshNav();
  },

  render(name) {
    const fn = { battle: this.renderBattle, cards: this.renderCards, shop: this.renderShop, online: this.renderOnline, more: this.renderMore }[name || this.pageName];
    if (fn) fn.call(this);
  },

  refreshTop() {
    const need = SAVE.king < MAX_LEVEL ? KING_XP[SAVE.king - 1] : 1;
    const pct = SAVE.king < MAX_LEVEL ? clamp(SAVE.kingXp / need, 0, 1) * 100 : 100;
    $('h-prof').innerHTML = `<div class="klv">${SAVE.king}</div><div class="pname"><b>${esc(SAVE.name)}</b><div class="xpb"><i style="width:${pct}%"></i></div></div>`;
    $('h-gold').innerHTML = `<i class="coin"></i>${fmtNum(SAVE.gold)}`;
    $('h-gems').innerHTML = `<i class="gem"></i>${fmtNum(SAVE.gems)}`;
  },

  refreshNav() {
    const up = curDeck().some((k) => canUpgrade(k)) || Object.keys(SAVE.fresh).length > 0;
    const cardsBtn = document.querySelector('#nav button[data-p="cards"]');
    cardsBtn.classList.toggle('dot', up && this.pageName !== 'cards');
    const shopBtn = document.querySelector('#nav button[data-p="shop"]');
    const shop = refreshShop();
    shopBtn.classList.toggle('dot', this.pageName !== 'shop' && shop.offers.some((o) => !o.bought) && !SAVE.shopSeen);
  },

  // Called about once per second while the home screen is visible.
  tick() {
    if (!$('home').classList.contains('show')) return;
    if (this.pageName === 'battle') this.renderChests();
  },

  // ---- battle page ----
  renderBattle() {
    const a = curArena();
    const ar = ARENAS[a];
    const next = ARENAS[a + 1];
    const prog = next ? clamp((SAVE.trophies - ar.min) / (next.min - ar.min), 0, 1) * 100 : 100;
    $('p-battle').innerHTML = `<div class="inner">
      <div class="arena"><canvas id="arena-cv"></canvas>
        <div class="lbl"><div><div class="ai">Arena ${a + 1}</div><div class="an">${esc(ar.name)}</div></div>
        <div><div class="tp"><i class="tro"></i>${SAVE.trophies}</div>${next ? `<div class="prog"><i style="width:${prog}%"></i></div><div class="ai">Next: ${next.min}</div>` : '<div class="ai">Top arena!</div>'}</div></div>
      </div>
      <button class="btn gold big" id="b-battle">⚔️ BATTLE</button>
      <div class="row"><button class="btn blue small" id="b-train">🎯 Training</button><button class="btn purple small" id="b-online">🌐 Play Online</button></div>
      <div class="chests" id="chests"></div>
      <div class="minis" id="minis"></div>
    </div>`;
    requestAnimationFrame(() => { const cv = $('arena-cv'); if (cv) arenaPreview(cv, a); });
    $('b-battle').onclick = () => Game.startAIBattle(false);
    $('b-train').onclick = () => Game.startAIBattle(true);
    $('b-online').onclick = () => this.page('online');
    this.renderChests();
  },

  renderChests() {
    const box = $('chests');
    if (!box) return;
    const unlocking = anyUnlocking();
    box.innerHTML = SAVE.chests.map((ch, i) => {
      const st = chestState(ch);
      if (st === 'empty') return `<div class="slot"><div class="st muted">Chest slot</div></div>`;
      const def = CHESTS[ch.type];
      let label;
      if (st === 'ready') label = '<div class="st g">OPEN!</div>';
      else if (st === 'unlocking') label = `<div class="st y">${fmtDuration(ch.unlockAt - Date.now())}</div><div class="st">⚡${gemsToOpen(ch)}</div>`;
      else label = unlocking ? `<div class="st">${fmtDuration(def.time * 1000)}</div>` : `<div class="st y">Tap to unlock</div><div class="st">${fmtDuration(def.time * 1000)}</div>`;
      return `<div class="slot full ${st === 'ready' ? 'ready' : ''}" data-i="${i}"><span class="ar">A${ch.arena + 1}</span><img src="${chestImg(ch.type)}" alt="">${label}</div>`;
    }).join('');
    for (const el of box.querySelectorAll('.slot.full')) el.onclick = () => this.chestSlot(+el.dataset.i);
    const free = nextFreeChestIn();
    const fs = freeState();
    const minis = $('minis');
    if (!minis) return;
    minis.innerHTML = `<div class="mini ${free <= 0 ? 'ready' : ''}" id="m-free"><img src="${chestImg('free')}" alt=""><div><b>Free Chest</b><small>${free <= 0 ? 'Ready! (' + fs.n + ')' : 'Next in ' + fmtDuration(free)}</small></div></div>
      <div class="mini ${SAVE.crowns >= CROWNS_FOR_CHEST ? 'ready' : ''}" id="m-crown"><img src="${chestImg('crown')}" alt=""><div style="flex:1;min-width:0"><b>Crown Chest</b><small>${SAVE.crowns >= CROWNS_FOR_CHEST ? 'Ready!' : SAVE.crowns + ' / ' + CROWNS_FOR_CHEST + ' crowns'}</small><div class="pb"><i style="width:${(SAVE.crowns / CROWNS_FOR_CHEST) * 100}%"></i></div></div></div>`;
    $('m-free').onclick = () => {
      if (!takeFreeChest()) { this.toast('The next free chest arrives in ' + fmtDuration(nextFreeChestIn())); return; }
      this.openChest('free', curArena());
    };
    $('m-crown').onclick = () => {
      if (SAVE.crowns < CROWNS_FOR_CHEST) { this.toast('Win crowns by destroying enemy towers.'); return; }
      SAVE.crowns = 0;
      saveGame();
      this.openChest('crown', curArena());
    };
  },

  chestSlot(i) {
    const ch = SAVE.chests[i];
    const st = chestState(ch);
    const def = CHESTS[ch.type];
    if (st === 'ready') {
      SAVE.chests[i] = null;
      saveGame();
      this.openChest(ch.type, ch.arena, ch.seed);
      return;
    }
    const gems = gemsToOpen(ch);
    const canStart = st === 'locked' && !anyUnlocking();
    this.modal(`<h2>${def.name}</h2>
      <div class="chestbox"><img class="big" src="${chestImg(ch.type)}" alt=""></div>
      <p class="center muted">Arena ${ch.arena + 1} · about ${Math.round(def.cards * (1 + ch.arena * 0.35))} cards${def.only ? ' (' + def.only + ')' : ''}</p>
      <p class="center">${st === 'unlocking' ? 'Unlocking: ' + fmtDuration(ch.unlockAt - Date.now()) + ' left' : 'Unlock time: ' + fmtDuration(def.time * 1000)}</p>
      <div class="btns">
        ${canStart ? '<button class="btn green" id="c-start">Start unlock</button>' : ''}
        <button class="btn purple" id="c-gems" ${SAVE.gems < gems ? 'disabled' : ''}>Open now ⚡${gems}</button>
      </div>
      ${st === 'locked' && !canStart ? '<p class="center muted small">Another chest is already unlocking.</p>' : ''}
      <div class="btns"><button class="btn small" id="c-close">Close</button></div>`, true);
    if ($('c-start')) $('c-start').onclick = () => {
      ch.unlockAt = Date.now() + def.time * 1000;
      saveGame();
      this.closeModal();
      this.renderChests();
      Sound.play('click');
    };
    $('c-gems').onclick = () => {
      if (SAVE.gems < gems) return;
      SAVE.gems -= gems;
      SAVE.chests[i] = null;
      saveGame();
      this.refreshTop();
      this.openChest(ch.type, ch.arena, ch.seed);
    };
    $('c-close').onclick = () => this.closeModal();
  },

  // Chest opening: tap the chest, then tap through the cards.
  openChest(type, arena, seed) {
    const loot = rollChest(type, arena, seed);
    const got = grantChest(loot);
    this.refreshTop();
    const def = CHESTS[type];
    let step = -1;
    const show = () => {
      if (step < 0) {
        this.modal(`<h2>${def.name}</h2><div class="chestbox" id="cb"><img class="shake" src="${chestImg(type)}" alt=""><p class="muted">Tap to open!</p></div>`, false);
      } else if (step < got.length) {
        const g = got[step];
        const c = CARDS[g.key], r = RARITY[c.rarity];
        const rec = SAVE.cards[g.key];
        const need = upgradeCost(g.key);
        this.modal(`<h2 style="color:${r.color}">${esc(c.name)}</h2>
          <div class="chestbox" id="cb"><div class="reveal pop"><img src="${cardImg(g.key, 130)}" style="width:130px" alt="">
          <div class="cnt">x${g.n}</div>${g.isNew ? '<div class="nw">NEW CARD!</div>' : ''}
          <div class="muted small">${r.name} · Level ${rec.lvl}${need ? ' · ' + rec.n + '/' + need.copies + ' to upgrade' : ' · Max level'}</div></div>
          <p class="muted small">${got.length - step - 1} more</p></div>`, false);
        Sound.play(c.rarity === 'legendary' ? 'legendary' : c.rarity === 'epic' ? 'epic' : 'cardflip');
      } else {
        this.modal(`<h2>${def.name}</h2>
          <div class="loot">${got.map((g) => `<div class="cc"><img src="${cardImg(g.key, 80)}" alt=""><div class="lv">x${g.n}</div>${g.isNew ? '<span class="nw">NEW</span>' : ''}</div>`).join('')}</div>
          <div class="rw">${loot.gold ? `<div class="res"><i class="coin"></i>+${loot.gold}</div>` : ''}${loot.gems ? `<div class="res"><i class="gem"></i>+${loot.gems}</div>` : ''}</div>
          <div class="btns"><button class="btn gold" id="c-ok">Collect</button></div>`, false);
        Sound.play('coin');
        $('c-ok').onclick = () => { this.closeModal(); this.render(); this.refreshTop(); this.refreshNav(); };
        return;
      }
      $('cb').onclick = () => { step++; if (step === 0) Sound.play('chest'); show(); };
    };
    show();
  },

  // ---- cards page ----
  renderCards() {
    const deck = curDeck();
    const owned = CARD_KEYS.filter((k) => SAVE.cards[k] && !deck.includes(k));
    owned.sort((a, b) => CARDS[a].cost - CARDS[b].cost || RARITY_ORDER.indexOf(CARDS[a].rarity) - RARITY_ORDER.indexOf(CARDS[b].rarity));
    const locked = CARD_KEYS.filter((k) => !SAVE.cards[k]);
    locked.sort((a, b) => CARDS[a].arena - CARDS[b].arena);
    const cell = (k, inDeck) => {
      const rec = SAVE.cards[k];
      if (!rec) return `<div class="cc locked" data-k="${k}"><img src="${cardImg(k, 90)}" alt=""><div class="lv">Arena ${CARDS[k].arena + 1}</div></div>`;
      const u = upgradeCost(k);
      const pct = u ? clamp(rec.n / u.copies, 0, 1) * 100 : 100;
      const up = canUpgrade(k);
      return `<div class="cc ${this.swapKey && inDeck ? 'swap' : ''} ${this.swapKey === k ? 'sel' : ''}" data-k="${k}"><img src="${cardImg(k, 90)}" alt=""><div class="lv">Lvl ${rec.lvl}</div>
        ${up ? '<span class="up">↑</span>' : ''}${SAVE.fresh[k] ? '<span class="nw">NEW</span>' : ''}</div>
        <div class="bar2" style="margin-top:-2px"><i class="${pct >= 100 ? 'full' : ''}" style="width:${pct}%"></i><span>${u ? rec.n + '/' + u.copies : 'MAX'}</span></div>`;
    };
    const wrap = (k, inDeck) => `<div>${cell(k, inDeck)}</div>`;
    $('p-cards').innerHTML = `<div class="inner">
      <div class="deckbar"><div class="tabs">${[0, 1, 2].map((i) => `<button class="btn tiny ${i === SAVE.deck ? 'gold' : ''}" data-d="${i}">Deck ${i + 1}</button>`).join('')}</div>
      <div class="sp"></div><div class="avg"><i class="drop"></i>Avg ${avgElixir(deck).toFixed(1)}</div></div>
      ${this.swapKey ? `<div class="status"><img src="${cardImg(this.swapKey, 40)}" style="width:34px" alt="">Tap a card in your deck to replace it. <button class="btn tiny" id="sw-x">Cancel</button></div>` : ''}
      <div class="deckgrid"><div class="grid">${deck.map((k) => wrap(k, true)).join('')}</div></div>
      <h3>Collection <small>${Object.keys(SAVE.cards).length}/${CARD_KEYS.length} found</small></h3>
      <div class="grid">${owned.map((k) => wrap(k, false)).join('') || '<p class="muted">All your cards are in the deck.</p>'}</div>
      ${locked.length ? `<h3>Not found yet <small>Win chests to unlock</small></h3><div class="grid">${locked.map((k) => `<div>${cell(k)}</div>`).join('')}</div>` : ''}
    </div>`;
    for (const b of document.querySelectorAll('#p-cards [data-d]')) b.onclick = () => { SAVE.deck = +b.dataset.d; saveGame(); this.swapKey = null; this.renderCards(); };
    if ($('sw-x')) $('sw-x').onclick = () => { this.swapKey = null; this.renderCards(); };
    for (const el of document.querySelectorAll('#p-cards .cc')) {
      el.onclick = () => {
        const k = el.dataset.k;
        if (this.swapKey) {
          const d = curDeck();
          const i = d.indexOf(k);
          if (i >= 0) {
            d[i] = this.swapKey;
            this.swapKey = null;
            saveGame();
            Sound.play('click');
            this.renderCards();
          }
          return;
        }
        if (!SAVE.cards[k]) { this.cardInfo(k); return; }
        this.cardInfo(k);
      };
    }
  },

  cardInfo(k) {
    const c = CARDS[k], r = RARITY[c.rarity];
    const rec = SAVE.cards[k];
    const lvl = rec ? rec.lvl : 1;
    if (rec && SAVE.fresh[k]) { delete SAVE.fresh[k]; saveGame(); }
    const u = rec ? upgradeCost(k) : null;
    const cur = cardStatLines(k, lvl);
    const nxt = u ? cardStatLines(k, lvl + 1) : null;
    const inDeck = curDeck().includes(k);
    const rows = cur.map((row, i) => {
      const n = nxt && nxt[i] && nxt[i][1] !== row[1] && typeof row[1] === 'number' ? ` <span class="inc">+${nxt[i][1] - row[1]}</span>` : '';
      return `<tr><td>${row[0]}</td><td>${row[1]}${n}</td></tr>`;
    }).join('');
    this.modal(`<div class="cardinfo"><img src="${cardImg(k, 110)}" alt=""><div class="d">
        <h2 style="text-align:left;color:${r.color}">${esc(c.name)}</h2>
        <div class="rar" style="color:${r.color}">${r.name} ${c.type}${rec ? ' · Level ' + lvl : ''}</div>
        <p class="muted" style="margin-top:6px;font-size:13px">${esc(c.desc)}</p></div></div>
      <table class="stt">${rows}</table>
      ${!rec ? `<p class="center muted">Unlocks in Arena ${c.arena + 1}: ${esc(ARENAS[c.arena].name)} (${ARENAS[c.arena].min} trophies)</p>` : ''}
      ${rec && u ? `<p class="center small muted">Cards: ${rec.n} / ${u.copies} · Upgrade cost: ${u.gold} gold · +${u.xp} XP</p>` : ''}
      <div class="btns">
        ${rec && !inDeck ? '<button class="btn blue" id="ci-use">Use</button>' : ''}
        ${rec && u ? `<button class="btn green" id="ci-up" ${canUpgrade(k) ? '' : 'disabled'}>Upgrade <i class="coin"></i> ${u.gold}</button>` : ''}
        <button class="btn" id="ci-x">Close</button>
      </div>`, true);
    if ($('ci-use')) $('ci-use').onclick = () => { this.swapKey = k; this.closeModal(); this.renderCards(); };
    if ($('ci-up')) $('ci-up').onclick = () => {
      const res = upgradeCard(k);
      if (!res) return;
      Sound.play('upgrade');
      this.refreshTop();
      this.closeModal();
      this.renderCards();
      this.refreshNav();
      this.toast(`${c.name} upgraded to level ${res.lvl}! +${res.xp} XP`);
      if (res.kingUps) setTimeout(() => this.kingLevelUp(), 400);
    };
    $('ci-x').onclick = () => this.closeModal();
  },

  kingLevelUp() {
    Sound.play('levelup');
    this.modal(`<h2>King Level ${SAVE.king}!</h2><p class="center">Your towers are stronger now.</p><div class="rw"><div class="res"><i class="gem"></i>+10</div></div><div class="btns"><button class="btn gold" id="kl-ok">Great!</button></div>`, true);
    $('kl-ok').onclick = () => this.closeModal();
    this.refreshTop();
  },

  // ---- shop ----
  renderShop() {
    SAVE.shopSeen = todayKey();
    const shop = refreshShop();
    $('p-shop').innerHTML = `<div class="inner">
      <h3>Daily deals <small>New offers every day</small></h3>
      <div class="shopgrid">${shop.offers.map((o, i) => `<div class="offer ${o.bought ? 'done' : ''}"><img src="${cardImg(o.key, 90)}" alt=""><b>${esc(CARDS[o.key].name)} x${o.n}</b>
        <button class="btn small ${o.bought ? '' : 'gold'}" data-o="${i}" ${o.bought || SAVE.gold < o.price ? 'disabled' : ''}>${o.bought ? 'Sold' : `<i class="coin"></i> ${o.price}`}</button></div>`).join('')}</div>
      <h3>Chests</h3>
      <div class="shopgrid">${SHOP_CHESTS.map((c, i) => `<div class="offer"><img src="${chestImg(c.type)}" alt=""><b>${CHESTS[c.type].name}</b><small>Arena ${curArena() + 1} rewards</small>
        <button class="btn small purple" data-c="${i}" ${SAVE.gems < c.gems ? 'disabled' : ''}><i class="gem"></i> ${c.gems}</button></div>`).join('')}</div>
      <h3>Gold</h3>
      <div class="shopgrid">${GOLD_PACKS.map((g, i) => `<div class="offer"><div style="font-size:34px">💰</div><b>${g.gold} gold</b>
        <button class="btn small purple" data-g="${i}" ${SAVE.gems < g.gems ? 'disabled' : ''}><i class="gem"></i> ${g.gems}</button></div>`).join('')}</div>
      <p class="center muted small">Everything is earned in the game. No real money, no ads.</p>
    </div>`;
    for (const b of document.querySelectorAll('#p-shop [data-o]')) b.onclick = () => {
      const o = shop.offers[+b.dataset.o];
      if (o.bought || SAVE.gold < o.price) return;
      SAVE.gold -= o.price;
      o.bought = true;
      const isNew = addCards(o.key, o.n);
      saveGame();
      Sound.play('coin');
      this.toast(`${isNew ? 'New card: ' : ''}${CARDS[o.key].name} x${o.n}`);
      this.refreshTop();
      this.renderShop();
    };
    for (const b of document.querySelectorAll('#p-shop [data-c]')) b.onclick = () => {
      const c = SHOP_CHESTS[+b.dataset.c];
      if (SAVE.gems < c.gems) return;
      SAVE.gems -= c.gems;
      saveGame();
      this.refreshTop();
      this.openChest(c.type, curArena());
    };
    for (const b of document.querySelectorAll('#p-shop [data-g]')) b.onclick = () => {
      const g = GOLD_PACKS[+b.dataset.g];
      if (SAVE.gems < g.gems) return;
      SAVE.gems -= g.gems;
      SAVE.gold += g.gold;
      saveGame();
      Sound.play('coin');
      this.refreshTop();
      this.renderShop();
    };
  },

  // ---- online page ----
  renderOnline() {
    const st = SAVE.stats;
    const ok = Net.supported();
    $('p-online').innerHTML = `<div class="inner">
      <div class="card"><h2>Online Duel</h2>
        <p class="center muted" style="font-size:13px;margin-top:4px">Battle a friend's phone in real time. Both players need an internet connection. Online battles use tournament rules: every card and tower is level ${ONLINE_LEVEL}.</p></div>
      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <h3>Your name</h3>
        <div class="field"><input class="txt" id="on-name" maxlength="16" value="${esc(SAVE.name)}" autocomplete="off"></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px" id="lobby">
        ${ok ? `<button class="btn green" id="on-quick">⚡ Quick Match</button>
        <button class="btn blue" id="on-host">🏠 Create Room</button>
        <div class="field"><input class="txt code" id="on-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn gold" id="on-join">Join</button></div>
        <div id="on-status"></div>` : '<p class="center">Online play is not supported by this browser.</p>'}
      </div>
      <div class="stats"><div class="stat"><b>${st.onlineWins}</b><span>Online wins</span></div><div class="stat"><b>${st.onlineLosses}</b><span>Online losses</span></div><div class="stat"><b>${curDeck().length}</b><span>Cards in deck</span></div></div>
      <p class="center muted small">Tip: Create a room and send the code (or link) to a friend. Quick Match pairs you with anyone searching right now.</p>
    </div>`;
    const nameIn = $('on-name');
    nameIn.onchange = nameIn.onblur = () => {
      const v = nameIn.value.replace(/[<>]/g, '').trim().slice(0, 16);
      if (v) { SAVE.name = v; saveGame(); this.refreshTop(); }
    };
    if (!ok) return;
    $('on-quick').onclick = () => Lobby.start('quick');
    $('on-host').onclick = () => Lobby.start('host');
    $('on-join').onclick = () => {
      const code = $('on-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 4) { this.toast('Enter the 4-letter room code'); return; }
      Lobby.start('join', code);
    };
    $('on-code').oninput = () => { $('on-code').value = $('on-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); };
    if (Lobby.pendingCode) { $('on-code').value = Lobby.pendingCode; }
    if (Lobby.busy) this.lobbyStatus(Lobby.statusText || 'Connecting…', true);
  },

  lobbyStatus(text, spinning, err) {
    Lobby.statusText = text;
    const el = $('on-status');
    if (!el) return;
    el.innerHTML = `<div class="status ${err ? 'err' : ''}">${spinning ? '<i class="spin"></i>' : ''}<span style="flex:1">${esc(text)}</span>${Lobby.busy ? '<button class="btn tiny red" id="on-cancel">Cancel</button>' : ''}</div>`;
    if ($('on-cancel')) $('on-cancel').onclick = () => Lobby.cancel();
  },

  lobbyRoom(code) {
    const el = $('on-status');
    if (!el) return;
    const url = location.origin + location.pathname + '?room=' + code;
    el.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:stretch"><div class="center muted small">Room code</div><div class="roomcode">${code}</div>
      <div class="status"><i class="spin"></i><span style="flex:1">Waiting for your friend to join…</span></div>
      <div class="btns"><button class="btn small blue" id="on-share">Share invite</button><button class="btn small red" id="on-cancel">Cancel</button></div></div>`;
    $('on-cancel').onclick = () => Lobby.cancel();
    $('on-share').onclick = () => {
      const text = `Join my Crown Duel battle! Room code: ${code}`;
      if (navigator.share) navigator.share({ title: 'Crown Duel', text, url }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(() => this.toast('Invite copied!')).catch(() => this.toast(text));
      else this.toast(text);
    };
  },

    $('s-vib').onclick = () => { s.vibrate = !s.vibrate; saveGame(); this.renderMore(); };

      this.modal(`<h2>Reset progress?</h2><p class="center">All trophies, cards, gold and chests will be lost.</p><div class="btns"><button class="btn red" id="r-yes">Reset</button><button class="btn" id="r-no">Cancel</button></div>`, true);
      $('r-yes').onclick = () => { resetGame(); this.closeModal(); this.refreshTop(); this.page('battle'); };
      $('r-no').onclick = () => this.closeModal();

  // ---- battle overlays ----
  battleMenu(scene, offline) {
    this.modal(`<h2>${offline ? 'Paused' : 'Menu'}</h2>
      <div class="btns col" style="flex-direction:column">
        <button class="btn green" id="bm-res">Resume</button>
        <button class="btn small" id="bm-snd">Sound: ${SAVE.settings.sfx ? 'On' : 'Off'}</button>
        <button class="btn red" id="bm-sur">${offline ? 'Surrender' : 'Leave battle'}</button>
      </div>`, true, () => scene.resume());
    $('bm-res').onclick = () => { this.closeModal(); scene.resume(); };
    $('bm-snd').onclick = () => { SAVE.settings.sfx = !SAVE.settings.sfx; applySettings(); saveGame(); $('bm-snd').textContent = 'Sound: ' + (SAVE.settings.sfx ? 'On' : 'Off'); };
    $('bm-sur').onclick = () => { this.closeModal(); scene.resume(); scene.surrender(); };
  },

  resultModal(scene, r, rw) {
    const my = scene.myTeam;
    const res = scene.result;
    const online = !!scene.link;
    const title = r.draw ? 'Draw' : r.win ? 'Victory!' : 'Defeat';
    const reason = { surrender: r.win ? 'Your opponent surrendered.' : 'You surrendered.', disconnect: 'Your opponent disconnected.', tiebreak: 'Decided by the weakest tower.' }[res.reason] || '';
    const ch = rw.chest;
    this.modal(`<div class="result">
      <h2 style="font-size:30px;color:${r.draw ? '#fff' : r.win ? '#8fd0ff' : '#ff8a8a'}">${title}</h2>
      <div class="crowns"><div class="c"><i class="crn b"></i>${res.crowns[my]}</div><span class="muted" style="font-size:16px">vs</span><div class="c">${res.crowns[1 - my]}<i class="crn r"></i></div></div>
      <div class="muted small">${esc(scene.names[my])} vs ${esc(scene.names[1 - my])}</div>
      ${reason ? `<div class="muted small">${reason}</div>` : ''}
      <div class="rw">
        ${rw.trophies ? `<div class="res"><i class="tro"></i>${rw.trophies > 0 ? '+' : ''}${rw.trophies}</div>` : ''}
        ${rw.gold ? `<div class="res"><i class="coin"></i>+${rw.gold}</div>` : ''}
        ${rw.crowns ? `<div class="res">👑 +${rw.crowns}</div>` : ''}
      </div>
      ${ch ? `<div class="chestbox" style="min-height:0"><img src="${chestImg(ch.type)}" style="width:90px" alt=""><div class="small">You won a <b>${CHESTS[ch.type].name}</b>!</div></div>` : r.win && r.mode !== 'training' ? '<p class="muted small center">Chest slots are full, so no chest this time.</p>' : ''}
      ${rw.crownChest ? '<p class="small center" style="color:#ffe070">👑 Crown Chest is ready!</p>' : ''}
      ${rw.arenaUp != null ? `<p class="center" style="color:#ffe070;font-weight:900">New arena unlocked: ${esc(ARENAS[rw.arenaUp].name)}!</p>` : ''}
      <div class="btns" style="width:100%">
        ${online ? `<button class="btn green" id="rs-again" ${Lobby.link && !Lobby.link.closed ? '' : 'disabled'}>Rematch</button>` : ''}
        <button class="btn gold" id="rs-ok">${online ? 'Leave' : 'OK'}</button>
      </div>
      ${online ? '<div class="muted small" id="rs-note"></div>' : ''}
    </div>`, false);
    $('rs-ok').onclick = () => {
      this.closeModal();
      if (online) Lobby.leave();
      Game.toHome(rw.arenaUp);
    };
    if ($('rs-again')) $('rs-again').onclick = () => {
      $('rs-again').disabled = true;
      Lobby.requestRematch();
    };
    this.rematchUpdate();
  },

  rematchUpdate() {
    const n = $('rs-note');
    if (!n) return;
    const l = Lobby.link;
    if (!l || l.closed) { n.textContent = 'Your opponent left.'; const b = $('rs-again'); if (b) b.disabled = true; return; }
    n.textContent = Lobby.rematch.me && Lobby.rematch.them ? 'Starting…' : Lobby.rematch.me ? 'Waiting for your opponent…' : Lobby.rematch.them ? 'Your opponent wants a rematch!' : '';
  },

  arenaUnlocked(a) {
    const cards = CARD_KEYS.filter((k) => CARDS[k].arena === a);
    Sound.play('levelup');
    this.modal(`<h2>New Arena!</h2><p class="center" style="font-size:18px;font-weight:900">${esc(ARENAS[a].name)}</p>
      ${cards.length ? `<p class="center muted small">New cards can now drop from chests:</p><div class="loot">${cards.map((k) => `<div class="cc"><img src="${cardImg(k, 80)}" alt=""></div>`).join('')}</div>` : '<p class="center">You reached the top arena. Legendary!</p>'}
      <div class="btns"><button class="btn gold" id="au-ok">Awesome</button></div>`, true);
    $('au-ok').onclick = () => this.closeModal();
  },

  // ---- modal & toast ----
  modal(html, dismissable, onDismiss) {
    $('modal-panel').innerHTML = html;
    $('modal').classList.add('show');
    this.modalDismiss = dismissable ? (onDismiss || true) : null;
  },

  closeModal() {
    const d = this.modalDismiss;
    $('modal').classList.remove('show');
    this.modalDismiss = null;
    return d;
  },

  modalOpen() { return $('modal').classList.contains('show'); },

  toast(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    $('toast').appendChild(el);
    setTimeout(() => el.classList.add('out'), 2200);
    setTimeout(() => el.remove(), 2700);
  },
};

// Online lobby flow: find/create a match, exchange decks, then start battles (and rematches).
const Lobby = {
  token: null,
  link: null,
  role: null,
  busy: false,
  peer: null,
  rematch: { me: false, them: false },
  pendingCode: null,
  statusText: '',

  async start(kind, code) {
    if (this.busy) return;
    this.cancel();
    Sound.init();
    const tk = this.token = Net.token();
    this.busy = true;
    UI.lobbyStatus(kind === 'quick' ? 'Searching for an opponent…' : kind === 'host' ? 'Creating a room…' : 'Joining room ' + code + '…', true);
    try {
      let link;
      if (kind === 'quick') link = await Net.quickMatch(tk, (s) => UI.lobbyStatus(s, true));
      else if (kind === 'host') link = await Net.hostRoom(tk, (c) => UI.lobbyRoom(c));
      else link = await Net.joinRoom(code, tk);
      if (tk.cancelled) { link.close(); return; }
      this.connected(link);
    } catch (e) {
      this.busy = false;
      if (e.code === 'cancelled') return;
      UI.lobbyStatus(e.message || 'Connection failed.', false, true);
      Sound.play('error');
    }
  },

  cancel() {
    if (this.token) this.token.cancel();
    this.token = null;
    this.busy = false;
    UI.lobbyStatus('', false);
    const el = $('on-status');
    if (el) el.innerHTML = '';
  },

  connected(link) {
    this.link = link;
    this.role = link.role;
    this.rematch = { me: false, them: false };
    this.peer = null;
    link.onclose = () => this.onClose();
    link.listen((m) => this.onPeerMessage(m));
    UI.lobbyStatus('Connected! Getting ready…', true);
    Sound.play('emote');
    if (link.role === 'guest') link.send({ t: 'hello', v: NET_PROTO, name: SAVE.name, deck: curDeck(), trophies: SAVE.trophies, arena: curArena(), king: SAVE.king });
  },

  onClose() {
    this.busy = false;
    if (Game.scene instanceof BattleScene && !Game.scene.ended) { Game.scene.onDisconnect(); return; }
    UI.rematchUpdate();
    if (!(Game.scene instanceof BattleScene)) UI.lobbyStatus('Connection closed.', false, true);
  },

  validDeck(d) {
    return Array.isArray(d) && d.length === 8 && new Set(d).size === 8 && d.every((k) => typeof k === 'string' && CARDS[k]) ? d : STARTER_DECK.slice();
  },

  onPeerMessage(m) {
    if (m.t === 'hello' && this.role === 'host') {
      if (m.v !== NET_PROTO) { this.link.send({ t: 'bye' }); this.link.close(); return; }
      this.peer = { name: String(m.name || 'Rival').slice(0, 16), deck: this.validDeck(m.deck), trophies: m.trophies | 0, arena: clamp(m.arena | 0, 0, ARENAS.length - 1), king: m.king | 0 };
      this.startMatch();
    } else if (m.t === 'start' && this.role === 'guest') {
      this.beginBattle(m);
    } else if (m.t === 'again') {
      this.rematch.them = true;
      UI.rematchUpdate();
      if (this.rematch.me && this.role === 'host') this.startMatch();
    } else if (m.t === 'bye' || m.t === 'leave') {
      if (this.link) this.link.close();
    }
  },

  startMatch() {
    const p = this.peer;
    const seed = randi(1, 1e9);
    const msg = {
      t: 'start', seed, arena: Math.max(curArena(), p.arena),
      names: [SAVE.name, p.name], decks: [curDeck().slice(), p.deck],
      subs: ['🏆 ' + SAVE.trophies, '🏆 ' + p.trophies],
    };
    this.link.send(msg);
    this.beginBattle(msg);
  },

  beginBattle(m) {
    this.busy = false;
    this.rematch = { me: false, them: false };
    const lv = {};
    for (const k of CARD_KEYS) lv[k] = ONLINE_LEVEL;
    UI.closeModal();
    Game.setScene(new BattleScene({
      mode: this.role, link: this.link, decks: [this.validDeck(m.decks[0]), this.validDeck(m.decks[1])], levels: [lv, lv], kings: [ONLINE_LEVEL, ONLINE_LEVEL],
      names: [String(m.names[0]).slice(0, 16), String(m.names[1]).slice(0, 16)], subs: m.subs || ['', ''], arena: clamp(m.arena | 0, 0, ARENAS.length - 1), seed: m.seed | 0,
    }));
  },

  requestRematch() {
    if (!this.link || this.link.closed) return;
    this.rematch.me = true;
    this.link.send({ t: 'again' });
    UI.rematchUpdate();
    if (this.role === 'host' && this.rematch.them) this.startMatch();
  },

  leave() {
    if (this.link) {
      this.link.send({ t: 'leave' });
      const l = this.link;
      setTimeout(() => l.close(), 200);
    }
    this.link = null;
    this.busy = false;
  },
};

// ===== 12-audio.js =====
// ---------- Synthesized sound effects & music (no audio files needed) ----------
const Sound = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null,
  sfxOn: true, musicOn: true, last: {},

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = 0.8;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 5;
    this.master.connect(comp);
    comp.connect(c.destination);
    this.sfx = c.createGain();
    this.sfx.gain.value = this.sfxOn ? 0.55 : 0;
    this.sfx.connect(this.master);
    this.mus = c.createGain();
    this.mus.gain.value = this.musicOn ? 0.22 : 0;
    this.mus.connect(this.master);
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (c.state === 'suspended') c.resume().catch(() => {});
    Music.onReady();
  },

  setSfx(on) { this.sfxOn = on; if (this.sfx) this.sfx.gain.value = on ? 0.55 : 0; },
  setMusic(on) { this.musicOn = on; if (this.mus) this.mus.gain.value = on ? 0.22 : 0; },

  tone(f, dur, o = {}) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(o.bus || this.sfx);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  noise(dur, o = {}) {
    const c = this.ctx;
    if (!c || !this.noiseBuf) return;
    const t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    const f0 = o.freq || 1200;
    f.frequency.setValueAtTime(f0, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, f0 + o.slide), t + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.bus || this.sfx);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.05);
  },

  play(name) {
    if (!this.ctx || !this.sfxOn || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    if (this.last[name] && now - this.last[name] < 0.05) return;
    this.last[name] = now;
    const T = (f, d, o) => this.tone(f, d, o);
    const N = (d, o) => this.noise(d, o);
    switch (name) {
      case 'click': T(900, 0.04, { type: 'square', vol: 0.05 }); break;
      case 'deploy': N(0.12, { vol: 0.14, freq: 700, slide: -400 }); T(220, 0.1, { type: 'triangle', vol: 0.1, slide: -80 }); break;
      case 'cast': T(500, 0.18, { type: 'sine', vol: 0.08, slide: 500 }); N(0.2, { vol: 0.08, freq: 3000, filter: 'highpass' }); break;
      case 'thud': T(90, 0.2, { type: 'sine', vol: 0.3, slide: -40 }); N(0.12, { vol: 0.14, freq: 400 }); break;
      case 'hit': N(0.06, { vol: 0.16, freq: 2600, filter: 'bandpass', q: 0.8 }); T(260, 0.05, { type: 'square', vol: 0.05, slide: -120 }); break;
      case 'hitHeavy': N(0.14, { vol: 0.26, freq: 1400 }); T(120, 0.16, { type: 'sawtooth', vol: 0.12, slide: -60 }); break;
      case 'punch': N(0.1, { vol: 0.22, freq: 600 }); T(110, 0.12, { type: 'sine', vol: 0.2, slide: -50 }); break;
      case 'swing': N(0.16, { vol: 0.14, freq: 1600, filter: 'bandpass', q: 0.7, slide: -900 }); break;
      case 'bow': N(0.07, { vol: 0.07, freq: 3200, filter: 'highpass' }); T(640, 0.05, { type: 'triangle', vol: 0.03, slide: -200 }); break;
      case 'gun': N(0.1, { vol: 0.16, freq: 2400, slide: -1800 }); T(180, 0.06, { type: 'square', vol: 0.05, slide: -100 }); break;
      case 'cannon': N(0.22, { vol: 0.22, freq: 800, slide: -600 }); T(80, 0.2, { type: 'sine', vol: 0.22, slide: -30 }); break;
      case 'spit': T(700, 0.08, { type: 'triangle', vol: 0.05, slide: -400 }); break;
      case 'magic': T(700, 0.2, { type: 'sine', vol: 0.06, slide: 500 }); T(1050, 0.18, { type: 'triangle', vol: 0.03, delay: 0.04, slide: -300 }); break;
      case 'boom': N(0.5, { vol: 0.4, freq: 900, slide: -800 }); T(70, 0.4, { type: 'sine', vol: 0.3, slide: -30 }); break;
      case 'fire': N(0.28, { vol: 0.18, freq: 700, filter: 'bandpass', q: 0.6 }); break;
      case 'pop': N(0.12, { vol: 0.14, freq: 1200, slide: -800 }); break;
      case 'zap': N(0.25, { vol: 0.22, freq: 4000, filter: 'highpass', slide: -2000 }); T(1500, 0.12, { type: 'sawtooth', vol: 0.04, slide: -1200 }); break;
      case 'ice': T(1800, 0.2, { type: 'sine', vol: 0.06, slide: -1000 }); N(0.15, { vol: 0.08, freq: 5000, filter: 'highpass' }); break;
      case 'freeze': T(2200, 0.5, { type: 'sine', vol: 0.08, slide: -1600 }); N(0.5, { vol: 0.14, freq: 5000, filter: 'highpass' }); break;
      case 'poison': N(0.6, { vol: 0.1, freq: 500, filter: 'bandpass', q: 3, attack: 0.1 }); T(160, 0.5, { type: 'sine', vol: 0.08, slide: 60 }); break;
      case 'volley': N(0.5, { vol: 0.1, freq: 2800, filter: 'highpass', attack: 0.15 }); break;
      case 'log': N(0.9, { vol: 0.16, freq: 300, attack: 0.05 }); T(70, 0.8, { type: 'triangle', vol: 0.12 }); break;
      case 'die': T(420, 0.14, { type: 'triangle', vol: 0.07, slide: -300 }); N(0.12, { vol: 0.08, freq: 1600, slide: -1000 }); break;
      case 'dieBig': T(160, 0.4, { type: 'sawtooth', vol: 0.12, slide: -100 }); N(0.4, { vol: 0.2, freq: 700, slide: -500 }); break;
      case 'towerDown': N(1.1, { vol: 0.45, freq: 700, slide: -600 }); T(55, 0.9, { type: 'sine', vol: 0.35, slide: -20 }); [523, 659, 784].forEach((f, i) => T(f, 0.25, { type: 'square', vol: 0.04, delay: 0.3 + i * 0.1 })); break;
      case 'king': T(220, 0.4, { type: 'sawtooth', vol: 0.08, slide: 110 }); T(330, 0.4, { type: 'square', vol: 0.05, delay: 0.1 }); break;
      case 'elixir': T(1320, 0.08, { type: 'sine', vol: 0.07 }); T(1760, 0.12, { type: 'sine', vol: 0.07, delay: 0.06 }); break;
      case 'charge': T(300, 0.3, { type: 'sawtooth', vol: 0.05, slide: 300 }); break;
      case 'summon': T(200, 0.3, { type: 'triangle', vol: 0.08, slide: 200 }); N(0.2, { vol: 0.06, freq: 900 }); break;
      case 'dig': N(0.3, { vol: 0.2, freq: 500, slide: -200 }); break;
      case 'warn': T(880, 0.12, { type: 'square', vol: 0.05 }); T(1175, 0.18, { type: 'square', vol: 0.05, delay: 0.14 }); break;
      case 'emote': T(1046, 0.08, { type: 'triangle', vol: 0.08 }); T(1568, 0.1, { type: 'triangle', vol: 0.07, delay: 0.07 }); break;
      case 'error': T(160, 0.14, { type: 'square', vol: 0.07 }); break;
      case 'victory': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => T(f, 0.24, { type: 'square', vol: 0.07, delay: i * 0.12 })); break;
      case 'defeat': [392, 349, 311, 262].forEach((f, i) => T(f, 0.34, { type: 'triangle', vol: 0.11, delay: i * 0.2 })); break;
      case 'chest': N(0.35, { vol: 0.18, freq: 1500 }); [523, 659, 784, 1046].forEach((f, i) => T(f, 0.16, { type: 'square', vol: 0.06, delay: 0.1 + i * 0.07 })); break;
      case 'cardflip': N(0.08, { vol: 0.12, freq: 3000, filter: 'bandpass' }); T(880, 0.08, { type: 'triangle', vol: 0.06, delay: 0.03 }); break;
      case 'epic': [659, 831, 988, 1318].forEach((f, i) => T(f, 0.2, { type: 'triangle', vol: 0.09, delay: i * 0.08 })); break;
      case 'legendary': [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => T(f, 0.3, { type: 'square', vol: 0.06, delay: i * 0.09 })); N(0.8, { vol: 0.08, freq: 6000, filter: 'highpass', delay: 0.2 }); break;
      case 'upgrade': [392, 523, 659, 784].forEach((f, i) => T(f, 0.18, { type: 'square', vol: 0.06, delay: i * 0.07 })); break;
      case 'coin': T(1046, 0.07, { type: 'square', vol: 0.045 }); T(1568, 0.12, { type: 'square', vol: 0.045, delay: 0.06 }); break;
      case 'levelup': [523, 659, 784, 1046, 1318].forEach((f, i) => T(f, 0.2, { type: 'square', vol: 0.07, delay: i * 0.08 })); break;
    }
  },
};

const MIDI = (m) => 440 * Math.pow(2, (m - 69) / 12);
const SCALES = {
  major: [0, 2, 4, 5, 7, 9, 11],
  minor: [0, 2, 3, 5, 7, 8, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  mixo: [0, 2, 4, 5, 7, 9, 10],
};
const TRACKS = {
  menu: { bpm: 96, root: 60, scale: 'major', prog: [0, 5, 3, 4], drums: 1, arp: [0, 1, 2, 1], lead: 0.45, pad: true, seed: 3 },
  battle: { bpm: 132, root: 57, scale: 'dorian', prog: [0, 3, 6, 4], drums: 3, arp: [0, 1, 2, 3], lead: 0.65, seed: 11 },
};

const Music = {
  cur: null, name: null, timer: null, step: 0, next: 0, melody: null, want: null,
  onReady() {
    if (this.want) {
      const w = this.want;
      this.want = null;
      this.play(w);
    }
  },
  play(name) {
    if (!Sound.ctx) { this.want = name; return; }
    if (this.name === name) return;
    this.stop();
    this.name = name;
    this.cur = TRACKS[name];
    if (!this.cur) return;
    const rng = new RNG(this.cur.seed || 1);
    this.melody = [];
    for (let i = 0; i < 32; i++) this.melody.push(rng.chance(this.cur.lead || 0.5) ? rng.int(0, 7) : -1);
    this.step = 0;
    this.next = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 45);
  },
  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this.name = null;
    this.cur = null;
    this.want = null;
  },
  tick() {
    const c = Sound.ctx;
    if (!c || !this.cur) return;
    if (c.state !== 'running' || !Sound.musicOn) { this.next = c.currentTime + 0.05; return; }
    const sd = 60 / this.cur.bpm / 2;
    if (this.next < c.currentTime - 0.3) this.next = c.currentTime + 0.02;
    while (this.next < c.currentTime + 0.18) {
      this.playStep(this.step, this.next, sd);
      this.next += sd;
      this.step++;
    }
  },
  playStep(step, t, sd) {
    const tr = this.cur;
    const sc = SCALES[tr.scale];
    const bar = Math.floor(step / 8) % tr.prog.length;
    const s8 = step % 8;
    const deg = tr.prog[bar];
    const note = (d, oct) => tr.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
    const bus = Sound.mus;
    const delay = Math.max(0, t - Sound.ctx.currentTime);
    if (s8 === 0 || s8 === 3 || s8 === 4 || s8 === 6) Sound.tone(MIDI(note(deg, -2)), sd * 1.5, { type: 'triangle', vol: 0.3, delay, bus });
    const arp = tr.arp;
    const ct = [0, 2, 4, 7][arp[step % arp.length] % 4];
    Sound.tone(MIDI(note(deg + ct, 0)), sd * 0.9, { type: 'square', vol: 0.03, delay, bus });
    if (step % 2 === 0) {
      const m = this.melody[(step / 2) % 32];
      if (m >= 0) Sound.tone(MIDI(note(deg + m, 1)), sd * 1.8, { type: 'triangle', vol: 0.08, delay, bus });
    }
    if (tr.pad && s8 === 0) Sound.tone(MIDI(note(deg + 2, -1)), sd * 8, { type: 'sine', vol: 0.07, attack: 0.25, delay, bus });
    const dr = tr.drums || 0;
    if (dr >= 1 && (s8 === 0 || (dr >= 2 && s8 === 4))) Sound.tone(110, 0.18, { type: 'sine', vol: 0.45, slide: -70, delay, bus });
    if (dr >= 2 && (s8 === 2 || s8 === 6)) Sound.noise(0.12, { vol: 0.16, freq: 1800, filter: 'bandpass', delay, bus });
    if (dr >= 3) Sound.noise(0.03, { vol: 0.05, freq: 7000, filter: 'highpass', delay, bus });
  },
};

function applySettings() {
  Sound.setSfx(SAVE.settings.sfx);
  Sound.setMusic(SAVE.settings.music);
}
