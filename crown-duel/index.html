      weapon: musketWeapon, wAng: -0.3 });
  },
  maiden(ctx, o) {
    hum(ctx, o, { skin: SKIN, torso: STEEL, torso2: o.c.main, legs: '#5a4030',
      hat: (c, oo, hy, hr) => {
        ctx.beginPath();
        ctx.arc(0, hy - 0.02, hr + 0.04, Math.PI * 0.95, Math.PI * 2.05);
        fillStroke(c, '#ff8a2a', 0.04);
        rrect(c, -hr - 0.08, hy - 0.02, 0.1, 0.4, 0.05, '#ff8a2a', 0.035);
        rrect(c, hr - 0.02, hy - 0.02, 0.1, 0.4, 0.05, '#ff8a2a', 0.035);
      },
      wAng: o.atk >= 0 && o.atk < 0.35 ? lerp(-3.2, 2.9, o.atk / 0.35) : -1.2, weapon: (c) => W.axe(c, 0.5, true) });
  },
  boar(ctx, o) {
    ctx.save();
    ctx.scale(o.dir, 1);
    const g = o.moving ? Math.sin(o.walk * TAU * 1.5) * 0.06 : 0;
    const lift = o.jump || 0;
    ctx.translate(0, -lift);
    // boar
    for (const lx of [-0.32, -0.14, 0.14, 0.3]) rrect(ctx, lx - 0.05, -0.28 + (lx > 0 ? g : -g), 0.1, 0.28, 0.04, '#5a3a20', 0.035);
    ell(ctx, 0, -0.42, 0.46, 0.26, '#8a5a34', 0.05);
    ell(ctx, 0.38, -0.44, 0.2, 0.17, '#9a6a40', 0.045);
    ell(ctx, 0.54, -0.42, 0.07, 0.06, '#d08a8a', 0.03);
    poly(ctx, [0.46, -0.36, 0.56, -0.22, 0.42, -0.32], '#fff5dd', 0.025);
    ctx.fillStyle = OUT;
    circle(ctx, 0.42, -0.5, 0.03);
    ctx.fill();
    rrect(ctx, -0.22, -0.62, 0.36, 0.1, 0.04, o.c.main, 0.035);
    // rider
    ctx.translate(-0.02, -0.52);
    hum(ctx, { dir: 1, walk: 0, moving: false, t: o.t, atk: o.atk, back: o.back, c: o.c }, {
      size: 0.72, skin: SKIN, torso: o.c.main, torso2: o.c.dark, noLegs: true, beard: '#6a3a1a',
      hat: (c, oo, hy, hr) => { ctx.beginPath(); ctx.arc(0, hy, hr + 0.02, Math.PI, 0); fillStroke(c, '#3a2a1a', 0.04); },
      weapon: (c) => W.hammer(c, 0.42) });
    ctx.restore();
  },
  berserker(ctx, o) {
    hum(ctx, o, { skin: '#e8b48a', torso: '#6a4a3a', torso2: o.c.main, legs: '#3a2a20',
      hat: (c, oo, hy, hr) => { c.fillStyle = o.c.main; c.fillRect(-hr * 0.8, hy - 0.05, hr * 1.6, 0.05); },
      face: eyesAngry, off: (c) => { c.save(); c.translate(-0.25, -0.42); c.rotate(-1.8 + (o.atk > 0.7 ? 0.5 : 0)); W.axe(c, 0.34); c.restore(); },
      weapon: (c) => W.axe(c, 0.38) });
  },
  firemage(ctx, o) {
    hum(ctx, o, { skin: SKIN, torso: o.c.main, torso2: o.c.dark, legs: o.c.dark, beard: '#eee',
      hat: (c, oo, hy, hr) => {
        ell(c, 0, hy - hr * 0.45, hr + 0.14, 0.08, o.c.dark, 0.04);
        poly(c, [-hr * 0.8, hy - hr * 0.5, 0.05, hy - hr - 0.55, hr * 0.8, hy - hr * 0.5], o.c.main, 0.04);
      },
      wAng: o.atk > 0.6 ? -1.8 : -0.9,
      weapon: (c) => {
        const gl = 0.12 + Math.sin(o.t * 12) * 0.02;
        c.fillStyle = 'rgba(255,150,40,0.45)';
        circle(c, 0.1, 0, gl + 0.08);
        c.fill();
        ell(c, 0.1, 0, gl, gl, '#ffb028', 0.03);
      } });
  },
  drakeling(ctx, o) {
    const flap = Math.sin(o.t * 10 + o.id) * 0.45;
    ctx.save();
    ctx.scale(o.dir * 1.15, 1.15);
    const y = -0.5;
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * 0.1, y - 0.12);
      ctx.rotate(s * (0.3 + flap));
      poly(ctx, [0, 0, s * 0.5, -0.3, s * 0.46, -0.02, s * 0.56, 0.1, 0, 0.12], '#4fae4f', 0.035);
      ctx.restore();
    }
    poly(ctx, [-0.2, y + 0.05, -0.5, y + 0.2, -0.25, y + 0.14], '#3f9a3f', 0.035);
    ell(ctx, 0, y, 0.26, 0.22, '#5cc25c', 0.045);
    ell(ctx, 0.02, y + 0.06, 0.16, 0.12, '#f2e3a0', 0.03);
    ell(ctx, 0.22, y - 0.2, 0.18, 0.15, '#5cc25c', 0.045);
    poly(ctx, [0.14, y - 0.32, 0.12, y - 0.46, 0.22, y - 0.34], o.c.main, 0.03);
    poly(ctx, [0.26, y - 0.33, 0.3, y - 0.47, 0.34, y - 0.31], o.c.main, 0.03);
    if (!o.back) {
      ctx.fillStyle = OUT;
      circle(ctx, 0.28, y - 0.22, 0.03);
      ctx.fill();
    }
    ctx.restore();
  },
  lancer(ctx, o) {
    ctx.save();
    ctx.scale(o.dir, 1);
    const g = o.moving ? Math.sin(o.walk * TAU * 1.6) * 0.07 : 0;
    for (const lx of [-0.34, -0.18, 0.18, 0.34]) rrect(ctx, lx - 0.05, -0.34 + (lx > 0 ? g : -g), 0.1, 0.34, 0.04, '#e8e2d6', 0.035);
    ell(ctx, 0, -0.5, 0.48, 0.24, '#f4efe4', 0.05);
    rrect(ctx, 0.3, -0.86, 0.2, 0.38, 0.08, '#f4efe4', 0.045);
    ell(ctx, 0.46, -0.84, 0.16, 0.1, '#f4efe4', 0.045);
    rrect(ctx, 0.28, -0.9, 0.08, 0.3, 0.04, '#6a4a2a', 0.03);
    rrect(ctx, -0.36, -0.6, 0.6, 0.22, 0.06, o.c.main, 0.04);
    ctx.fillStyle = GOLDC;
    ctx.fillRect(-0.34, -0.44, 0.56, 0.04);
    ctx.translate(-0.05, -0.62);
    hum(ctx, { dir: 1, walk: 0, moving: false, t: o.t, atk: -1, back: o.back, c: o.c }, {
      size: 0.75, skin: SKIN, torso: STEEL, torso2: o.c.main, noLegs: true, hat: helmet('#aab4be', o.c.main),
      wAng: o.atk >= 0 && o.atk < 0.2 ? 0.1 : o.charging ? -0.05 : -0.45, weapon: (c) => {
        seg(c, -0.2, 0, 0.9, 0, 0.07, '#d9c28a');
        poly(c, [0.9, -0.07, 1.15, 0, 0.9, 0.07], STEEL, 0.03);
      } });
    ctx.restore();
  },
  balloon(ctx, o) {
    const sway = Math.sin(o.t * 2 + o.id) * 0.04;
    ctx.save();
    ctx.translate(sway, 0);
    seg(ctx, -0.18, -0.35, -0.3, -0.75, 0.025, '#6a4a2a');
    seg(ctx, 0.18, -0.35, 0.3, -0.75, 0.025, '#6a4a2a');
    rrect(ctx, -0.22, -0.4, 0.44, 0.26, 0.05, '#9a6a3a', 0.04);
    ell(ctx, 0.02, -0.5, 0.1, 0.1, BONE, 0.03);
    ell(ctx, 0, -1.12, 0.5, 0.48, o.c.main, 0.05);
    ctx.save();
    ellipse(ctx, 0, -1.12, 0.5, 0.48);
    ctx.clip();
    ctx.fillStyle = o.c.light;
    for (let i = -2; i <= 2; i++) ctx.fillRect(i * 0.2 - 0.04, -1.7, 0.08, 1.2);
    ctx.restore();
    ellipse(ctx, 0, -1.12, 0.5, 0.48);
    ctx.lineWidth = 0.05;
    ctx.strokeStyle = OUT;
    ctx.stroke();
    if (!(o.atk >= 0 && o.atk < 0.2)) ell(ctx, 0, -0.08, 0.13, 0.13, '#2a2a33', 0.035);
    ctx.restore();
  },
  necro(ctx, o) {
    hum(ctx, o, { skin: '#d8d0e8', torso: '#4a2f6a', torso2: o.c.main, legs: '#3a2350', belt: o.c.main,
      hat: hood('#3a2350'), face: glowEyes('#b56cff'),
      wAng: o.atk > 0.6 ? -1.9 : -1.2, weapon: (c) => { W.staff(c, 0.5, BONE, '#b56cff'); } });
  },
  juggernaut(ctx, o) {
    hum(ctx, o, { size: 1.55, skin: '#3a3f4a', torso: '#4a5060', torso2: o.c.main, legs: '#2e323c', hand: '#4a5060', head: 0.28,
      hat: (c, oo, hy, hr) => {
        poly(c, [-hr, hy, -hr - 0.16, hy - hr - 0.2, -hr * 0.4, hy - hr * 0.7], '#2e323c', 0.035);
        poly(c, [hr, hy, hr + 0.16, hy - hr - 0.2, hr * 0.4, hy - hr * 0.7], '#2e323c', 0.035);
      },
      face: glowEyes('#b388ff'), weapon: (c) => W.sword(c, 0.62, '#9fb0c4') });
  },
  golem(ctx, o) { golemArt(ctx, o, 1.6); },
  golemite(ctx, o) { golemArt(ctx, o, 0.95); },
  stormmage(ctx, o) {
    const crackle = (c) => {
      c.strokeStyle = '#bff4ff';
      c.lineWidth = 0.035;
      c.beginPath();
      c.moveTo(0, 0);
      for (let i = 1; i <= 4; i++) c.lineTo(i * 0.07, (Math.random() - 0.5) * 0.16);
      c.stroke();
    };
    hum(ctx, o, { skin: SKIN, torso: '#e6eef8', torso2: o.c.main, legs: '#5a6a8a',
      hat: (c, oo, hy, hr) => {
        poly(c, [-hr, hy - 0.05, -hr * 0.6, hy - hr - 0.2, -0.05, hy - hr, 0.1, hy - hr - 0.28, hr * 0.5, hy - hr - 0.02, hr + 0.1, hy - hr * 0.6, hr, hy - 0.05], '#dfe8f5', 0.04);
      },
      face: glowEyes('#6fe8ff'), wAng: o.atk > 0.6 || o.atk < 0.15 && o.atk >= 0 ? -0.2 : -0.8,
      weapon: (c) => { c.fillStyle = 'rgba(120,230,255,0.5)'; circle(c, 0.05, 0, 0.14); c.fill(); crackle(c); } });
  },
  tunneler(ctx, o) {
    hum(ctx, o, { skin: SKIN, torso: '#8a6a40', torso2: o.c.main, legs: '#4a3a2a', beard: '#8a8a8a',
      hat: (c, oo, hy, hr) => {
        ctx.beginPath();
        ctx.arc(0, hy - 0.02, hr + 0.04, Math.PI, 0);
        ctx.closePath();
        fillStroke(c, '#e0b020', 0.04);
        ell(c, 0.02, hy - hr * 0.6, 0.07, 0.06, '#fff8c0', 0.03);
      },
      weapon: (c) => W.pick(c, 0.45) });
  },
  frostmage(ctx, o) {
    hum(ctx, o, { skin: '#dff3ff', torso: '#e8f7ff', torso2: o.c.main, legs: '#9fc8e8', belt: o.c.main,
      hat: hood('#a8dcf8'), face: glowEyes('#3ab8ff'),
      wAng: o.atk > 0.6 ? -1.8 : -1.1, weapon: (c) => W.staff(c, 0.45, '#9ff0ff', '#9ff0ff') });
  },
  // ---- buildings ----
  cannon(ctx, o) {
    rrect(ctx, -0.7, -0.5, 1.4, 0.6, 0.12, '#8a6038', 0.05);
    ctx.fillStyle = o.c.main;
    ctx.fillRect(-0.66, -0.22, 1.32, 0.1);
    ell(ctx, 0, -0.55, 0.42, 0.3, '#6a4a2a', 0.05);
    ctx.save();
    ctx.translate(0, -0.62);
    const a = Math.atan2(o.aimY, o.aimX);
    ctx.rotate(a);
    const kick = o.atk >= 0 && o.atk < 0.15 ? -0.12 : 0;
    rrect(ctx, -0.2 + kick, -0.17, 0.82, 0.34, 0.12, '#3a3a44', 0.05);
    ell(ctx, 0.6 + kick, 0, 0.08, 0.18, '#22222a', 0.04);
    ctx.restore();
  },
  inferno(ctx, o) {
    rrect(ctx, -0.6, -0.4, 1.2, 0.5, 0.1, '#6a6070', 0.05);
    poly(ctx, [-0.5, -0.35, -0.3, -1.7, 0.3, -1.7, 0.5, -0.35], '#7a7080', 0.05);
    ctx.fillStyle = o.c.main;
    ctx.fillRect(-0.36, -0.9, 0.72, 0.1);
    const g = 0.2 + (o.attacking ? 0.06 + Math.sin(o.t * 20) * 0.03 : 0);
    ctx.fillStyle = 'rgba(255,90,30,0.45)';
    circle(ctx, 0, -1.85, g + 0.14);
    ctx.fill();
    ell(ctx, 0, -1.85, g, g, '#ff7a2a', 0.04);
    ell(ctx, 0, -1.85, g * 0.5, g * 0.5, '#ffe08a', 0.02);
  },
  tombstone(ctx, o) {
    ell(ctx, 0, -0.1, 0.75, 0.3, '#6a5a44', 0.05);
    rrect(ctx, -0.45, -1.3, 0.9, 1.2, 0.4, '#9aa0a8', 0.05);
    ctx.fillStyle = '#6a7078';
    ctx.fillRect(-0.06, -1.1, 0.12, 0.6);
    ctx.fillRect(-0.24, -0.92, 0.48, 0.12);
    ctx.fillStyle = o.c.main;
    ctx.fillRect(-0.4, -0.3, 0.8, 0.08);
  },
  pump(ctx, o) {
    rrect(ctx, -0.7, -0.4, 1.4, 0.5, 0.1, '#6a5040', 0.05);
    rrect(ctx, -0.45, -1.5, 0.9, 1.15, 0.3, 'rgba(230,220,255,0.55)', 0.05);
    const lvl = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(o.t * 1.5));
    ctx.save();
    roundRect(ctx, -0.42, -1.47, 0.84, 1.1, 0.28);
    ctx.clip();
    ctx.fillStyle = '#d23cf0';
    ctx.fillRect(-0.5, -0.37 - lvl * 1.0, 1, 1.2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-0.3, -1.4, 0.1, 1);
    ctx.restore();
    ctx.fillStyle = o.c.main;
    ctx.fillRect(-0.47, -0.95, 0.94, 0.1);
    rrect(ctx, 0.4, -1.1, 0.35, 0.12, 0.04, '#8a8f96', 0.035);
  },
};

function golemArt(ctx, o, k) {
  ctx.save();
  ctx.scale(o.dir * k, k);
  const mv = o.moving;
  const l = mv ? Math.sin(o.walk * TAU) * 0.06 : 0;
  ell(ctx, -0.22 + l, -0.14, 0.16, 0.14, '#8a7a6a', 0.045);
  ell(ctx, 0.22 - l, -0.14, 0.16, 0.14, '#8a7a6a', 0.045);
  const sw = swingAngle(o.atk, -0.4);
  ell(ctx, -0.42, -0.5, 0.16, 0.2, '#9a8a78', 0.045);
  ell(ctx, 0, -0.55, 0.4, 0.36, '#a89886', 0.05);
  ell(ctx, -0.1, -0.62, 0.12, 0.08, '#8a7a6a', 0.02);
  ell(ctx, 0.14, -0.44, 0.1, 0.07, '#8a7a6a', 0.02);
  ell(ctx, 0, -0.98, 0.24, 0.2, '#b0a08e', 0.045);
  poly(ctx, [-0.06, -1.14, 0.02, -1.36, 0.1, -1.14], o.c.main, 0.03);
  if (!o.back) {
    ctx.fillStyle = '#ffe28a';
    ctx.fillRect(0.02, -1.02, 0.07, 0.04);
    ctx.fillRect(0.14, -1.02, 0.07, 0.04);
  }
  ctx.save();
  ctx.translate(0.36, -0.58);
  ctx.rotate(sw * 0.5);
  ell(ctx, 0.08, 0.08, 0.17, 0.2, '#9a8a78', 0.045);
  ctx.restore();
  ctx.restore();
}

// Unit draw sizes (for shadows, hp bar placement and card art framing).
const UNIT_H = {
  knight: 1.2, archer: 1.15, goblin: 1.0, speargob: 1.0, skeleton: 0.95, bomber: 1.0, barbarian: 1.25, imp: 0.8, sprite: 0.8,
  giant: 2.1, musketeer: 1.2, maiden: 1.2, boar: 1.45, berserker: 1.2, firemage: 1.5, drakeling: 1.0, lancer: 1.7, balloon: 1.6,
  necro: 1.2, juggernaut: 1.9, golem: 2.2, golemite: 1.3, stormmage: 1.3, tunneler: 1.2, frostmage: 1.2,
  cannon: 1.1, inferno: 2.1, tombstone: 1.4, pump: 1.6,
};
const AIR_H = 1.1;

// ---- towers ----
function drawTower(ctx, e, o) {
  const k = e.tt === 'king';
  const hw = k ? 1.9 : 1.45;
  const c = o.c;
  if (e.dead || o.destroyed) {
    ell(ctx, 0, 0, hw, hw * 0.55, '#7a7066', 0.05);
    ell(ctx, -0.5, -0.2, 0.5, 0.3, '#8e857a', 0.04);
    ell(ctx, 0.5, -0.1, 0.45, 0.28, '#948b80', 0.04);
    ell(ctx, 0.1, -0.35, 0.4, 0.25, '#a0978a', 0.04);
    return;
  }
  const H = k ? 1.9 : 1.6;
  const top = -H - hw * 0.5;
  // walls (front face) and top platform
  rrect(ctx, -hw, top + hw * 0.5, hw * 2, H + hw * 0.5, 0.18, '#a39a8e', 0.06);
  ctx.save();
  roundRect(ctx, -hw + 0.06, top + hw * 0.5, hw * 2 - 0.12, H + hw * 0.5 - 0.06, 0.16);
  ctx.clip();
  ctx.fillStyle = '#8f867a';
  for (let r = 0; r < 4; r++) {
    for (let i = -1; i < 5; i++) ctx.fillRect(-hw + i * hw * 0.5 + (r % 2) * hw * 0.25, top + hw * 0.6 + r * H * 0.27 + 0.18, hw * 0.44, 0.07);
  }
  ctx.restore();
  rrect(ctx, -hw - 0.08, top - hw * 0.25, hw * 2 + 0.16, hw * 0.9, 0.2, '#b8afa2', 0.06);
  rrect(ctx, -hw + 0.18, top - hw * 0.12, hw * 2 - 0.36, hw * 0.62, 0.14, '#cfc6b8', 0.04);
  // team banner
  rrect(ctx, -0.35, top + hw * 0.75, 0.7, H * 0.55, 0.08, c.main, 0.045);
  poly(ctx, [-0.35, top + hw * 0.75 + H * 0.5, 0, top + hw * 0.75 + H * 0.66, 0.35, top + hw * 0.75 + H * 0.5], c.main, 0.045);
  ctx.fillStyle = GOLDC;
  if (k) {
    poly(ctx, [-0.2, top + hw * 0.95, -0.2, top + hw * 0.75 + 0.1, -0.1, top + hw * 0.85, 0, top + hw * 0.7 + 0.05, 0.1, top + hw * 0.85, 0.2, top + hw * 0.75 + 0.1, 0.2, top + hw * 0.95], GOLDC, 0.03);
  } else {
    circle(ctx, 0, top + hw * 0.95, 0.12);
    ctx.fill();
  }
  // crenellations
  for (let i = 0; i < 4; i++) rrect(ctx, -hw + 0.02 + i * (hw * 2 - 0.3) / 3, top - hw * 0.42, 0.3, 0.26, 0.05, '#b8afa2', 0.04);
  // occupant
  ctx.save();
  ctx.translate(0, top + hw * 0.2);
  const dir = o.aimX < -0.1 ? -1 : 1;
  const back = o.aimY < -0.2;
  if (k) {
    // cannon
    ctx.save();
    ctx.translate(0.55 * dir, 0.05);
    const a = Math.atan2(o.aimY * 0.6 - 0.4, o.aimX);
    ctx.rotate(o.active ? a : dir > 0 ? -0.5 : Math.PI + 0.5);
    rrect(ctx, -0.1, -0.13, 0.6, 0.26, 0.1, '#3a3a44', 0.045);
    ctx.restore();
    const sleeping = !o.active;
    hum(ctx, { dir: -dir, walk: 0, moving: false, t: o.t, atk: -1, back: false, c }, {
      size: 0.95, skin: SKIN, torso: c.main, torso2: c.light, noLegs: true, beard: '#f2f2f2', head: 0.3,
      face: sleeping ? (cc, oo, hy) => { seg(cc, 0.02, hy, 0.1, hy, 0.03, OUT); seg(cc, 0.14, hy, 0.22, hy, 0.03, OUT); } : eyesAngry,
      hat: (cc, oo, hy, hr) => poly(cc, [-hr, hy - hr * 0.5, -hr, hy - hr - 0.2, -hr * 0.5, hy - hr - 0.02, 0, hy - hr - 0.26, hr * 0.5, hy - hr - 0.02, hr, hy - hr - 0.2, hr, hy - hr * 0.5], GOLDC, 0.04),
      wAng: 0.6, weapon: null });
    if (sleeping) outlineText(ctx, 'z', 0.5, -1.2 - (o.t % 2) * 0.25, 0.34, '#fff');
  } else {
    hum(ctx, { dir, walk: 0, moving: false, t: o.t, atk: o.atk, back, c }, {
      size: 0.95, skin: SKIN, torso: c.main, torso2: c.light, noLegs: true, head: 0.3,
      hat: (cc, oo, hy, hr) => {
        ctx.beginPath();
        ctx.arc(0, hy - 0.02, hr + 0.04, Math.PI * 0.95, Math.PI * 2.05);
        fillStroke(cc, '#ff78b0', 0.04);
        poly(cc, [-0.12, hy - hr - 0.02, -0.12, hy - hr - 0.16, -0.04, hy - hr - 0.08, 0.04, hy - hr - 0.18, 0.12, hy - hr - 0.08, 0.2, hy - hr - 0.16, 0.2, hy - hr - 0.02], GOLDC, 0.03);
      },
      weapon: bowWeapon, wAng: -0.2 });
  }
  ctx.restore();
}

// ---- projectiles ----
function drawProjectile(ctx, p, o) {
  const a = Math.atan2(o.vy, o.vx);
  switch (p.pt) {
    case 'arrow':
    case 'spear':
      ctx.save();
      ctx.rotate(a);
      seg(ctx, -0.35, 0, 0.25, 0, 0.05, p.pt === 'spear' ? '#a0703a' : '#d8c8a0');
      poly(ctx, [0.25, -0.07, 0.4, 0, 0.25, 0.07], STEEL, 0.03);
      ctx.restore();
      break;
    case 'bullet':
      ell(ctx, 0, 0, 0.09, 0.09, '#333', 0.02);
      break;
    case 'cannonball':
      ell(ctx, 0, 0, 0.16, 0.16, '#2a2a33', 0.04);
      break;
    case 'bomb':
      ell(ctx, 0, 0, 0.16, 0.16, '#2a2a33', 0.04);
      ctx.fillStyle = '#ffcf40';
      circle(ctx, 0.1, -0.14, 0.05);
      ctx.fill();
      break;
    case 'spit':
      ell(ctx, 0, 0, 0.1, 0.1, '#b388ff', 0.03);
      break;
    case 'orb':
      ctx.fillStyle = 'rgba(180,100,255,0.4)';
      circle(ctx, 0, 0, 0.22);
      ctx.fill();
      ell(ctx, 0, 0, 0.12, 0.12, '#c78cff', 0.03);
      break;
    case 'ice':
      ctx.fillStyle = 'rgba(160,240,255,0.45)';
      circle(ctx, 0, 0, 0.22);
      ctx.fill();
      ell(ctx, 0, 0, 0.12, 0.12, '#dffaff', 0.03);
      break;
    case 'flame':
    case 'fireorb':
    case 'fireball': {
      const r = p.pt === 'fireball' ? 0.45 : p.pt === 'fireorb' ? 0.24 : 0.2;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,120,30,0.35)';
      ellipse(ctx, -r * 0.8, 0, r * 1.8, r * 0.9);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#ff7a1a';
      circle(ctx, 0, 0, r);
      ctx.fill();
      ctx.fillStyle = '#ffe07a';
      circle(ctx, 0, 0, r * 0.55);
      ctx.fill();
      break;
    }
    case 'log': {
      ctx.save();
      const roll = o.t * 14;
      rrect(ctx, -1.9, -0.45, 3.8, 0.6, 0.28, '#8a5a2b', 0.06);
      ctx.fillStyle = '#6a4220';
      for (let i = 0; i < 6; i++) {
        const x = -1.7 + i * 0.7 + (roll % 0.7);
        if (x < 1.7) ctx.fillRect(x, -0.42, 0.08, 0.54);
      }
      ell(ctx, -1.85, -0.15, 0.12, 0.28, '#c89a5a', 0.04);
      ell(ctx, 1.85, -0.15, 0.12, 0.28, '#c89a5a', 0.04);
      ctx.restore();
      break;
    }
    default:
      ell(ctx, 0, 0, 0.1, 0.1, '#fff', 0.02);
  }
}

// ---- arena background ----
function paintArena(theme, T, flipped) {
  const pad = 1.2;
  const cw = (AW + pad * 2) * T, ch = (AH + pad * 2) * T;
  const cv = makeCanvas(cw, ch);
  const ctx = cv.getContext('2d');
  ctx.translate(pad * T, pad * T);
  ctx.scale(T, T);
  const rng = new RNG(hashStr(theme.name));
  // surroundings
  ctx.fillStyle = theme.edge;
  ctx.fillRect(-pad, -pad, AW + pad * 2, AH + pad * 2);
  for (let i = 0; i < 90; i++) {
    const x = rng.range(-pad, AW + pad), y = rng.range(-pad, AH + pad);
    ctx.fillStyle = rgba('#000000', rng.range(0.05, 0.14));
    circle(ctx, x, y, rng.range(0.2, 0.7));
    ctx.fill();
  }
  // grass checkerboard
  for (let y = 0; y < AH; y++) {
    for (let x = 0; x < AW; x++) {
      ctx.fillStyle = theme.grass[(x + y) & 1];
      ctx.fillRect(x, y, 1.02, 1.02);
    }
  }
  // soft light variation
  const grd = ctx.createRadialGradient(AW / 2, AH / 2, 2, AW / 2, AH / 2, 20);
  grd.addColorStop(0, 'rgba(255,255,255,0.08)');
  grd.addColorStop(1, 'rgba(0,0,0,0.12)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, AW, AH);
  // walking paths along the lanes
  ctx.fillStyle = rgba(theme.path, 0.35);
  for (const bx of BRIDGES) {
    roundRect(ctx, bx - 1.1, 4, 2.2, AH - 8, 1);
    ctx.fill();
  }
  roundRect(ctx, 3.5, 7.3, 11, 1.5, 0.7);
  ctx.fill();
  roundRect(ctx, 3.5, AH - 8.8, 11, 1.5, 0.7);
  ctx.fill();
  // tower pads
  for (const team of [0, 1]) {
    for (const s of TOWER_SLOTS) {
      const y = flipped ? AH - mirrorY(team, s.y) : mirrorY(team, s.y);
      ctx.fillStyle = rgba('#000000', 0.12);
      roundRect(ctx, s.x - s.half - 0.35, y - s.half - 0.35, s.half * 2 + 0.7, s.half * 2 + 0.7, 0.6);
      ctx.fill();
      ctx.fillStyle = rgba(theme.path, 0.8);
      roundRect(ctx, s.x - s.half - 0.2, y - s.half - 0.2, s.half * 2 + 0.4, s.half * 2 + 0.4, 0.5);
      ctx.fill();
    }
  }
  // river
  const water = ctx.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  water.addColorStop(0, shade(theme.water, -0.25));
  water.addColorStop(0.5, theme.water);
  water.addColorStop(1, shade(theme.water, -0.25));
  ctx.fillStyle = water;
  ctx.fillRect(-pad, RIVER_TOP, AW + pad * 2, RIVER_BOT - RIVER_TOP);
  ctx.fillStyle = rgba('#000000', 0.18);
  ctx.fillRect(-pad, RIVER_TOP, AW + pad * 2, 0.12);
  ctx.fillRect(-pad, RIVER_BOT - 0.12, AW + pad * 2, 0.12);
  for (let i = 0; i < 40; i++) {
    const x = rng.range(-pad, AW + pad);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x, rng.range(RIVER_TOP + 0.3, RIVER_BOT - 0.4), rng.range(0.3, 0.9), 0.07);
  }
  // bridges
  for (const bx of BRIDGES) {
    const x0 = bx - BRIDGE_HALF;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x0 + 0.1, RIVER_TOP - 0.1, BRIDGE_HALF * 2, RIVER_BOT - RIVER_TOP + 0.4);
    ctx.fillStyle = '#b07a44';
    ctx.fillRect(x0, RIVER_TOP - 0.3, BRIDGE_HALF * 2, RIVER_BOT - RIVER_TOP + 0.6);
    ctx.fillStyle = '#8a5a2b';
    for (let y = RIVER_TOP - 0.3; y < RIVER_BOT + 0.3; y += 0.4) ctx.fillRect(x0, y, BRIDGE_HALF * 2, 0.06);
    ctx.fillStyle = '#6a4220';
    ctx.fillRect(x0 - 0.12, RIVER_TOP - 0.4, 0.18, RIVER_BOT - RIVER_TOP + 0.8);
    ctx.fillRect(x0 + BRIDGE_HALF * 2 - 0.06, RIVER_TOP - 0.4, 0.18, RIVER_BOT - RIVER_TOP + 0.8);
  }
  // border
  ctx.strokeStyle = rgba('#000000', 0.35);
  ctx.lineWidth = 0.12;
  ctx.strokeRect(0, 0, AW, AH);
  paintDeco(ctx, theme, rng, pad);
  return { canvas: cv, pad };
}

function paintDeco(ctx, theme, rng, pad) {
  const spots = [];
  for (let i = 0; i < 26; i++) {
    const left = rng.chance(0.5);
    spots.push([left ? rng.range(-pad + 0.3, -0.2) : rng.range(AW + 0.2, AW + pad - 0.3), rng.range(-0.5, AH + 0.5)]);
  }
  for (let i = 0; i < 8; i++) spots.push([rng.range(0, AW), rng.chance(0.5) ? rng.range(-pad + 0.2, -0.3) : rng.range(AH + 0.3, AH + pad - 0.2)]);
  for (const [x, y] of spots) {
    if (y > RIVER_TOP - 0.5 && y < RIVER_BOT + 0.5) continue;
    const s = rng.range(0.35, 0.6);
    switch (theme.deco) {
      case 'trees': case 'jungle': case 'royal':
        ell(ctx, x, y, s, s, theme.deco === 'jungle' ? '#1f6a33' : '#2f8a3a', 0.05);
        ell(ctx, x - s * 0.3, y - s * 0.3, s * 0.5, s * 0.5, theme.deco === 'jungle' ? '#2f8a4a' : '#4aa84f', 0.03);
        if (theme.deco === 'royal' && rng.chance(0.3)) ell(ctx, x + s * 0.3, y + s * 0.2, 0.12, 0.12, GOLDC, 0.03);
        break;
      case 'bones':
        ell(ctx, x, y, s * 0.6, s * 0.5, BONE, 0.04);
        ctx.fillStyle = OUT;
        circle(ctx, x - 0.08, y - 0.02, 0.06);
        ctx.fill();
        circle(ctx, x + 0.08, y - 0.02, 0.06);
        ctx.fill();
        break;
      case 'barrels':
        rrect(ctx, x - s * 0.4, y - s * 0.5, s * 0.8, s, 0.12, '#9a6a3a', 0.04);
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(x - s * 0.4, y - s * 0.1, s * 0.8, 0.06);
        break;
      case 'snow':
        ell(ctx, x, y, s, s * 0.8, '#f4fbff', 0.04);
        ell(ctx, x + s * 0.2, y + s * 0.1, s * 0.4, s * 0.3, '#dbeaf4', 0.02);
        break;
      case 'lava':
        ctx.fillStyle = '#ff6a1f';
        circle(ctx, x, y, s * 0.7);
        ctx.fill();
        ctx.fillStyle = '#ffd24a';
        circle(ctx, x, y, s * 0.3);
        ctx.fill();
        break;
      case 'storm':
        ell(ctx, x, y, s, s * 0.7, '#5a6a7a', 0.04);
        break;
    }
  }
}

// ---- card faces ----
const cardArtCache = new Map();
function cardArt(key, w, h, opts) {
  opts = opts || {};
  const ck = key + ':' + w + 'x' + h + (opts.plain ? 'p' : '');
  let cv = cardArtCache.get(ck);
  if (cv) return cv;
  cv = makeCanvas(w, h);
  const ctx = cv.getContext('2d');
  const c = CARDS[key];
  const rar = RARITY[c.rarity];
  const S = w / 100;
  ctx.scale(S, S);
  const H = h / S;
  // frame
  roundRect(ctx, 2, 2, 96, H - 4, 12);
  const fg = ctx.createLinearGradient(0, 0, 0, H);
  fg.addColorStop(0, shade(rar.color, 0.25));
  fg.addColorStop(1, rar.dark);
  ctx.fillStyle = fg;
  ctx.fill();
  // background
  roundRect(ctx, 8, 8, 84, H - 16, 8);
  const bg = ctx.createLinearGradient(0, 8, 0, H - 8);
  const cols = c.type === 'spell' ? ['#7a58c8', '#3a2a70'] : c.type === 'building' ? ['#c89a5a', '#6a4a2a'] : ['#6ab8f0', '#2a5a9a'];
  bg.addColorStop(0, cols[0]);
  bg.addColorStop(1, cols[1]);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.save();
  roundRect(ctx, 8, 8, 84, H - 16, 8);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.ellipse(50, H * 0.2, 60, 30, 0, 0, TAU);
  ctx.fill();
  // subject
  const o = { c: TEAM_COLORS[0], dir: 1, back: false, walk: 0.1, moving: false, t: 0.3, atk: -1, id: 1, aimX: 1, aimY: 0.2, attacking: true, charging: false };
  if (c.type === 'spell') drawSpellIcon(ctx, c.spell, 50, H * 0.52);
  else {
    const u = c.unit;
    const uh = UNIT_H[u] || 1.2;
    const n = Math.min(c.count || 1, 3);
    const sc = Math.min(58, (H * 0.62) / (uh + (UNITS[u].air ? 0.3 : 0))) * (n > 1 ? 0.8 : 1);
    for (let i = n - 1; i >= 0; i--) {
      ctx.save();
      const ox = n === 1 ? 0 : (i - (n - 1) / 2) * 24;
      ctx.translate(50 + ox, H * 0.86 - (n > 1 && i === 1 ? 6 : 0) - (UNITS[u].air ? sc * 0.25 : 0));
      ctx.scale(sc, sc);
      UNIT_ART[u](ctx, Object.assign({}, o, { id: i + 1 }));
      ctx.restore();
    }
  }
  ctx.restore();
  if (!opts.plain) {
    // elixir cost drop
    ctx.save();
    ctx.translate(20, 20);
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.bezierCurveTo(10, -3, 13, 3, 13, 7);
    ctx.arc(0, 7, 13, 0, Math.PI);
    ctx.bezierCurveTo(-13, 3, -10, -3, 0, -15);
    const eg = ctx.createRadialGradient(-3, 2, 2, 0, 4, 15);
    eg.addColorStop(0, '#ff9cf2');
    eg.addColorStop(1, '#b01ad0');
    ctx.fillStyle = eg;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#3a0848';
    ctx.stroke();
    outlineText(ctx, String(c.cost), 0, 6, 17, '#fff');
    ctx.restore();
  }
  cardArtCache.set(ck, cv);
  return cv;
}

function drawSpellIcon(ctx, sp, x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(30, 30);
  switch (sp) {
    case 'arrows':
      for (const [dx, dy] of [[-0.45, -0.1], [0, 0.15], [0.45, -0.1]]) {
        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(1.2);
        seg(ctx, -0.6, 0, 0.35, 0, 0.09, '#e0d0a8');
        poly(ctx, [0.35, -0.13, 0.62, 0, 0.35, 0.13], STEEL, 0.05);
        poly(ctx, [-0.6, 0, -0.75, -0.14, -0.45, 0], '#e84a4a', 0.04);
        ctx.restore();
      }
      break;
    case 'fireball':
      ctx.fillStyle = 'rgba(255,120,30,0.45)';
      ellipse(ctx, -0.35, -0.35, 0.9, 0.55);
      ctx.fill();
      ell(ctx, 0.1, 0.1, 0.62, 0.62, '#ff7a1a', 0.07);
      ell(ctx, 0.2, 0.0, 0.36, 0.36, '#ffe07a', 0.03);
      break;
    case 'zap':
      poly(ctx, [0.1, -1.0, -0.45, 0.1, -0.05, 0.1, -0.25, 1.0, 0.5, -0.2, 0.08, -0.2, 0.35, -1.0], '#aef4ff', 0.08);
      break;
    case 'freeze':
      ctx.strokeStyle = '#e8fbff';
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI) / 3);
        seg(ctx, -0.85, 0, 0.85, 0, 0.14, '#dff8ff');
        seg(ctx, 0.5, 0, 0.72, -0.2, 0.08, '#dff8ff');
        seg(ctx, 0.5, 0, 0.72, 0.2, 0.08, '#dff8ff');
        seg(ctx, -0.5, 0, -0.72, -0.2, 0.08, '#dff8ff');
        seg(ctx, -0.5, 0, -0.72, 0.2, 0.08, '#dff8ff');
        ctx.restore();
      }
      break;
    case 'poison':
      ell(ctx, 0, 0.15, 0.8, 0.55, '#7ad64a', 0.07);
      ell(ctx, -0.3, -0.2, 0.3, 0.3, '#9ae86a', 0.05);
      ell(ctx, 0.35, -0.25, 0.22, 0.22, '#9ae86a', 0.05);
      ctx.fillStyle = OUT;
      circle(ctx, -0.18, 0.15, 0.1);
      ctx.fill();
      circle(ctx, 0.18, 0.15, 0.1);
      ctx.fill();
      break;
    case 'log':
      ctx.rotate(-0.35);
      rrect(ctx, -0.95, -0.35, 1.9, 0.7, 0.34, '#8a5a2b', 0.07);
      ell(ctx, 0.95, 0, 0.18, 0.35, '#c89a5a', 0.05);
      for (let i = 0; i < 4; i++) poly(ctx, [-0.6 + i * 0.4, -0.35, -0.5 + i * 0.4, -0.58, -0.4 + i * 0.4, -0.35], STEEL, 0.03);
      break;
  }
  ctx.restore();
}

// ===== 06-fx.js =====
// ---------- Visual effects (purely cosmetic, never part of the simulation) ----------
// Particles live in world tiles; `z` lifts them off the ground.
class FX {
  constructor() { this.parts = []; }

  add(p) {
    if (this.parts.length > 700) this.parts.shift();
    p.t = 0;
    if (p.z == null) p.z = 0;
    this.parts.push(p);
    return p;
  }

  update(dt) {
    for (const p of this.parts) {
      p.t += dt;
      if (p.vx) p.x += p.vx * dt;
      if (p.vy) p.y += p.vy * dt;
      if (p.vz != null) {
        p.z += p.vz * dt;
        p.vz -= (p.g == null ? 14 : p.g) * dt;
        if (p.z < 0) { p.z = 0; p.vz = -p.vz * 0.3; if (p.vx) p.vx *= 0.6; if (p.vy) p.vy *= 0.6; }
      }
    }
    let n = 0;
    for (const p of this.parts) if (p.t < p.life) this.parts[n++] = p;
    this.parts.length = n;
  }

  puff(x, y, n, col, size, z) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(0.3, 1.2);
      this.add({ k: 'puff', x, y, z: z || 0.1, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6, life: rand(0.35, 0.7), r0: size * 0.4, r1: size * rand(0.8, 1.3), col: col || '#fff' });
    }
  }
  ring(x, y, r, col, life, w) { this.add({ k: 'ring', x, y, r, col, life: life || 0.35, w: w || 0.12 }); }
  flash(x, y, r, col, life) { this.add({ k: 'flash', x, y, r, col, life: life || 0.25 }); }
  sparks(x, y, n, col, z) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(2, 5);
      this.add({ k: 'spark', x, y, z: z || 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7, vz: rand(1, 4), g: 18, life: rand(0.15, 0.35), col: col || '#fff6c0' });
    }
  }
  debris(x, y, n, cols, spread) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(0.5, 3) * (spread || 1);
      this.add({ k: 'debris', x, y, z: rand(0.2, 1.2), vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7, vz: rand(3, 8), g: 20, life: rand(0.6, 1.2), col: choice(cols), s: rand(0.1, 0.25), rot: rand(0, TAU) });
    }
  }
  bolt(x1, y1, z1, x2, y2, z2, col, life) { this.add({ k: 'bolt', x: x1, y: y1, z: z1, x2, y2, z2, col: col || '#bff4ff', life: life || 0.18 }); }
  text(x, y, str, col, size) { this.add({ k: 'text', x, y, z: 1.2, vz: 2.2, g: 1.5, str, col: col || '#fff', size: size || 0.7, life: 1.0 }); }
  arrows(x, y, r, delays) {
    for (const d of delays) {
      for (let i = 0; i < 9; i++) {
        const a = Math.random() * TAU, rr = Math.sqrt(Math.random()) * r;
        this.add({ k: 'arrow', x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr, life: d + 0.02, fall: 0.3, col: '#d8c8a0' });
      }
    }
  }
  shards(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(1, 3);
      this.add({ k: 'shard', x, y, z: 0.4, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7, vz: rand(2, 5), g: 16, life: rand(0.4, 0.7), rot: rand(0, TAU) });
    }
  }

  draw(ctx, v) {
    const T = v.T;
    for (const p of this.parts) {
      const q = v.toScreen(p.x, p.y);
      const sx = q[0], sy = q[1] - p.z * T;
      const f = p.t / p.life;
      switch (p.k) {
        case 'puff': {
          ctx.globalAlpha = (1 - f) * 0.8;
          ctx.fillStyle = p.col;
          circle(ctx, sx, sy, lerp(p.r0, p.r1, easeOut(f)) * T);
          ctx.fill();
          break;
        }
        case 'ring':
          ctx.globalAlpha = 1 - f;
          ctx.strokeStyle = p.col;
          ctx.lineWidth = p.w * T * (1 - f * 0.5);
          ellipse(ctx, sx, sy, lerp(0.2, p.r, easeOut(f)) * T, lerp(0.2, p.r, easeOut(f)) * T * 0.8);
          ctx.stroke();
          break;
        case 'flash':
          ctx.globalAlpha = (1 - f) * 0.7;
          ctx.fillStyle = p.col;
          ellipse(ctx, sx, sy, p.r * T, p.r * T * 0.8);
          ctx.fill();
          break;
        case 'spark':
          ctx.globalAlpha = 1 - f;
          ctx.strokeStyle = p.col;
          ctx.lineWidth = 0.08 * T;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx - p.vx * 0.04 * T, sy - p.vy * 0.04 * T * (v.flip ? -1 : 1) + p.vz * 0.04 * T);
          ctx.stroke();
          break;
        case 'debris':
          ctx.globalAlpha = Math.min(1, (1 - f) * 3);
          ctx.fillStyle = p.col;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(p.rot + p.t * 8);
          ctx.fillRect(-p.s * T / 2, -p.s * T / 2, p.s * T, p.s * T);
          ctx.restore();
          break;
        case 'shard':
          ctx.globalAlpha = 1 - f;
          ctx.fillStyle = '#dffaff';
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(p.rot + p.t * 6);
          ctx.beginPath();
          ctx.moveTo(0, -0.18 * T);
          ctx.lineTo(0.07 * T, 0);
          ctx.lineTo(0, 0.18 * T);
          ctx.lineTo(-0.07 * T, 0);
          ctx.fill();
          ctx.restore();
          break;
        case 'bolt': {
          const q2 = v.toScreen(p.x2, p.y2);
          const ex = q2[0], ey = q2[1] - p.z2 * T;
          ctx.globalAlpha = 1 - f * 0.6;
          ctx.strokeStyle = p.col;
          ctx.lineWidth = 0.14 * T;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          const n = 6;
          for (let i = 1; i < n; i++) {
            const t = i / n;
            ctx.lineTo(lerp(sx, ex, t) + rand(-0.35, 0.35) * T, lerp(sy, ey, t) + rand(-0.35, 0.35) * T);
          }
          ctx.lineTo(ex, ey);
          ctx.stroke();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 0.05 * T;
          ctx.stroke();
          break;
        }
        case 'text':
          ctx.globalAlpha = Math.min(1, (1 - f) * 2);
          outlineText(ctx, p.str, sx, sy, p.size * T, p.col);
          break;
        case 'arrow': {
          if (p.life - p.t > p.fall) break;
          const h = ((p.life - p.t) / p.fall) * 7;
          ctx.globalAlpha = 1;
          ctx.strokeStyle = OUT;
          ctx.lineWidth = 0.1 * T;
          ctx.beginPath();
          ctx.moveTo(sx - 0.25 * T, sy - (h + 0.7) * T);
          ctx.lineTo(sx, sy - h * T);
          ctx.stroke();
          ctx.strokeStyle = p.col;
          ctx.lineWidth = 0.05 * T;
          ctx.stroke();
          break;
        }
        case 'dirt':
          ctx.globalAlpha = (1 - f) * 0.9;
          ctx.fillStyle = '#6a4a2a';
          ellipse(ctx, sx, sy, 0.35 * T, 0.22 * T);
          ctx.fill();
          break;
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ===== 07-view.js =====
// ---------- Battle view: draws a battle from a state object and turns touches into card plays ----------
// The state comes from a local Sim (offline / host) or from network snapshots (guest).
const UNIT_SCALE = 1.12;
const TOWER_SCALE = 0.86;
const TOP_ROOM = 1.7; // tiles reserved above the arena for the enemy king tower
const EMOTES = ['👍', '😂', '😡', '😭', '👏', '😱'];
const TIME_ANIM = { imp: 1, drakeling: 1, balloon: 1, stormmage: 1, firemage: 1 };

class BattleView {
  constructor(scene, o) {
    this.scene = scene;
    this.myTeam = o.myTeam;
    this.flip = o.myTeam === 1;
    this.theme = ARENAS[o.arena || 0];
    this.fx = new FX();
    this.t = 0;
    this.T = 20;
    this.sel = -1;
    this.drag = null;
    this.ptr = null;
    this.msgs = [];
    this.emotes = [];
    this.emoteOpen = false;
    this.shake = 0;
    this.vs = new Map();
    this.bg = null;
    this.bgT = 0;
    this.badSpot = 0;
    this.crownPops = [];
    this.sprites = new Map();
  }

  // Troops are drawn from cached animation frames (quantized walk / attack / wing-flap poses);
  // painting dozens of vector characters every frame is too slow on phones.
  sprite(key, u, o) {
    let sp = this.sprites.get(key);
    if (sp) return sp;
    if (this.sprites.size > 700) this.sprites.clear();
    const px = this.T * UNIT_SCALE * this.dpr;
    const uh = UNIT_H[u] || 1.2;
    const wT = Math.max(2.8, uh * 1.9), hT = uh * 1.35 + 0.8;
    const cv = makeCanvas(wT * px, hT * px);
    const c = cv.getContext('2d');
    const ox = wT / 2, oy = hT - 0.35;
    c.translate(ox * px, oy * px);
    c.scale(px, px);
    UNIT_ART[u](c, o);
    const k = this.T * UNIT_SCALE;
    sp = { cv, ox: ox * k, oy: oy * k, w: wT * k, h: hT * k };
    this.sprites.set(key, sp);
    return sp;
  }

  // ---- layout ----
  layout(W, H, safe) {
    this.W = W;
    this.H = H;
    const sb = safe.bottom || 0, st = safe.top || 0;
    let handH = clamp(H * 0.19, 112, 172);
    const eh = 20;
    let ch = handH - eh - 20;
    let cw = ch / 1.24;
    const maxW = Math.min(W, 560) - 16;
    if (cw * 4.62 + 30 > maxW) { cw = (maxW - 30) / 4.62; ch = cw * 1.24; handH = ch + eh + 20; }
    this.handH = handH + sb;
    this.handTop = H - this.handH;
    const availH = this.handTop - st;
    const T = Math.min(W / 18.3, availH / (AH + TOP_ROOM + 0.2));
    this.T = T;
    this.ox = Math.round((W - AW * T) / 2);
    this.oy = Math.round(st + (availH - (AH + TOP_ROOM + 0.2) * T) / 2 + TOP_ROOM * T);
    const nw = cw * 0.62, nh = ch * 0.62;
    const rowW = nw + 10 + cw * 4 + 18;
    const x0 = (W - rowW) / 2;
    const cy = this.handTop + 8;
    this.nextRect = { x: x0, y: cy + ch - nh, w: nw, h: nh };
    this.cards = [];
    for (let i = 0; i < 4; i++) this.cards.push({ x: x0 + nw + 10 + i * (cw + 6), y: cy, w: cw, h: ch });
    this.elixirRect = { x: x0 + nw + 10, y: cy + ch + 6, w: cw * 4 + 18, h: eh - 4 };
    this.emoteBtn = { x: Math.max(8, this.ox + 4) + 18, y: this.handTop - 26, r: 18 };
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (!this.bg || Math.abs(this.bgT - T) > 0.01) {
      this.bg = paintArena(this.theme, T * this.dpr, false);
      this.bgT = T;
      if (this.sprites) this.sprites.clear();
    }
  }

  toScreen(x, y) { return [this.ox + x * this.T, this.oy + (this.flip ? AH - y : y) * this.T]; }
  toWorld(sx, sy) {
    const x = (sx - this.ox) / this.T;
    let y = (sy - this.oy) / this.T;
    if (this.flip) y = AH - y;
    return [x, y];
  }

  vstate(e) {
    let s = this.vs.get(e.id);
    if (!s) { s = { dir: e.team === this.myTeam ? 1 : -1, walk: Math.random(), flash: 0, hp: e.hp, seen: this.t }; this.vs.set(e.id, s); }
    return s;
  }

  // ---- events from the simulation (or network) ----
  onEvent(ev) {
    const f = this.fx;
    const mine = (team) => team === this.myTeam;
    switch (ev[0]) {
      case 'play': {
        const [, team, key, x, y] = ev;
        if (!mine(team)) this.cardPop(key, x, y);
        Sound.play(CARDS[key].type === 'spell' ? 'cast' : 'deploy');
        break;
      }
      case 'land': {
        const [, , x, y, u] = ev;
        const big = UNITS[u] && UNITS[u].r >= 0.7;
        f.puff(x, y, big ? 8 : 4, 'rgba(240,235,220,0.9)', big ? 0.6 : 0.35);
        if (big) { this.shake = Math.max(this.shake, 0.15); Sound.play('thud'); }
        break;
      }
      case 'hit': {
        const [, , x, y, heavy, u] = ev;
        f.sparks(x, y, heavy > 1 ? 7 : 3, heavy > 1 ? '#ffe28a' : '#fff');
        Sound.play(heavy > 1 ? 'hitHeavy' : u === 'giant' || u === 'golem' || u === 'golemite' ? 'punch' : 'hit');
        break;
      }
      case 'phit': {
        const [, , pt, x, y] = ev;
        if (pt === 'ice') { f.shards(x, y, 3); Sound.play('ice'); } else f.sparks(x, y, 3, pt === 'spit' ? '#c9a8ff' : '#fff');
        if (pt === 'cannonball') Sound.play('thud');
        break;
      }
      case 'shoot': {
        const pt = ev[2];
        Sound.play(pt === 'arrow' || pt === 'spear' ? 'bow' : pt === 'bullet' ? 'gun' : pt === 'cannonball' ? 'cannon' : pt === 'spit' ? 'spit' : 'magic');
        break;
      }
      case 'boom': {
        const [, x, y, r, pt] = ev;
        const fire = pt === 'fireball' || pt === 'fireorb' || pt === 'flame';
        f.flash(x, y, r, fire ? '#ff9a3a' : pt === 'orb' ? '#b56cff' : pt === 'ice' ? '#bff0ff' : '#ffe8b0', 0.3);
        f.ring(x, y, r, fire ? '#ffcf6a' : pt === 'ice' ? '#e8fbff' : '#fff', 0.35, 0.14);
        if (pt === 'ice') f.shards(x, y, 6);
        else f.puff(x, y, r > 2 ? 10 : 5, fire ? 'rgba(255,140,60,0.8)' : 'rgba(120,110,100,0.8)', r * 0.4);
        if (r >= 2) { this.shake = Math.max(this.shake, r >= 2.4 ? 0.3 : 0.18); Sound.play('boom'); } else Sound.play(fire ? 'fire' : pt === 'ice' ? 'ice' : 'pop');
        break;
      }
      case 'spin': {
        const [, , x, y] = ev;
        f.ring(x, y, 1.8, '#fff', 0.25, 0.1);
        Sound.play('swing');
        break;
      }
      case 'bolt': {
        const [, x1, y1, x2, y2] = ev;
        f.bolt(x1, y1, 1.2, x2, y2, 0.6);
        Sound.play('zap');
        break;
      }
      case 'zapfx': {
        const [, x, y, r] = ev;
        f.flash(x, y, r, '#9ff0ff', 0.3);
        f.ring(x, y, r, '#e8fdff', 0.3, 0.1);
        for (let i = 0; i < 5; i++) { const a = Math.random() * TAU; f.bolt(x, y, 6, x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, 0, '#bff4ff', 0.25); }
        Sound.play('zap');
        break;
      }
      case 'frostfx': {
        const [, x, y, r] = ev;
        f.flash(x, y, r, '#cff6ff', 0.4);
        f.shards(x, y, 10);
        Sound.play('ice');
        break;
      }
      case 'spell': {
        const [, team, sp, x, y, r] = ev;
        if (sp === 'arrows') { f.arrows(x, y, r, [0.45, 0.7, 0.95]); Sound.play('volley'); }
        if (sp === 'zap') { f.flash(x, y, r, '#9ff0ff', 0.35); f.ring(x, y, r, '#e8fdff', 0.3, 0.12); for (let i = 0; i < 6; i++) { const a = Math.random() * TAU; f.bolt(x, y, 7, x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, 0, '#bff4ff', 0.3); } Sound.play('zap'); }
        if (sp === 'freeze') { f.flash(x, y, r, '#dffaff', 0.5); f.shards(x, y, 16); Sound.play('freeze'); }
        if (sp === 'poison') Sound.play('poison');
        if (sp === 'log') Sound.play('log');
        break;
      }
      case 'die': {
        const [, , u, x, y, air] = ev;
        const big = UNITS[u] && UNITS[u].r >= 0.7;
        f.puff(x, y, big ? 10 : 5, 'rgba(255,255,255,0.85)', big ? 0.7 : 0.4, air ? AIR_H : 0.2);
        if (UNITS[u] && UNITS[u].building) f.debris(x, y, 10, ['#8a7a6a', '#6a5a4a', '#a09080'], 0.8);
        if (u === 'skeleton' || u === 'bomber') f.debris(x, y, 4, [BONE], 0.6);
        Sound.play(big ? 'dieBig' : 'die');
        break;
      }
      case 'tower': {
        const [, , team, tt, x, y] = ev;
        f.debris(x, y, 26, ['#a39a8e', '#8f867a', '#cfc6b8', '#6a6258'], 1.6);
        f.puff(x, y, 16, 'rgba(210,200,190,0.9)', 1.2, 0.5);
        f.flash(x, y, 3, '#fff2c0', 0.4);
        this.shake = 0.55;
        Sound.play('towerDown');
        Game.vibrate(120);
        this.crownPops.push({ team: 1 - team, t: 0 });
        const byMe = mine(1 - team);
        this.message(tt === 'king' ? (byMe ? 'KING TOWER DOWN!' : 'Your king has fallen!') : byMe ? '+1 Crown!' : 'Tower lost!', byMe ? '#8fd0ff' : '#ff9a9a');
        break;
      }
      case 'king':
        if (!mine(ev[1])) this.message('King activated!', '#ffe082');
        Sound.play('king');
        break;
      case 'elx': {
        const [, team, x, y] = ev;
        if (mine(team)) { this.fx.text(x, y, '+1', '#ff9cf2', 0.8); Sound.play('elixir'); }
        break;
      }
      case 'charge': Sound.play('charge'); break;
      case 'lance': { const [, , x, y] = ev; f.sparks(x, y, 8, '#ffe28a'); Sound.play('hitHeavy'); break; }
      case 'summon': { const [, , x, y] = ev; f.puff(x, y, 3, 'rgba(180,120,255,0.7)', 0.4); Sound.play('summon'); break; }
      case 'dig': { const [, , x, y] = ev; f.debris(x, y, 10, ['#6a4a2a', '#8a6a40'], 0.8); Sound.play('dig'); break; }
      case 'ot': this.message('OVERTIME!', '#ffb74d', 2.5); Sound.play('warn'); break;
      case 'dbl': this.message('2x ELIXIR!', '#ff9cf2', 2.2); Sound.play('warn'); break;
    }
  }

  message(text, col, dur) { this.msgs.push({ text, col: col || '#fff', t: 0, dur: dur || 1.8 }); if (this.msgs.length > 3) this.msgs.shift(); }

  cardPop(key, x, y) { this.fx.add({ k: 'cardpop', x, y, key, life: 1.0 }); }

  showEmote(team, i) {
    this.emotes = this.emotes.filter((e) => e.team !== team);
    this.emotes.push({ team, i, t: 0 });
    Sound.play('emote');
  }

  update(dt, st) {
    this.t += dt;
    this.fx.update(dt);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
    if (this.badSpot > 0) this.badSpot -= dt;
    for (const m of this.msgs) m.t += dt;
    this.msgs = this.msgs.filter((m) => m.t < m.dur);
    for (const e of this.emotes) e.t += dt;
    this.emotes = this.emotes.filter((e) => e.t < 2.4);
    for (const c of this.crownPops) c.t += dt;
    this.crownPops = this.crownPops.filter((c) => c.t < 1.2);
    // per-entity visual bookkeeping
    for (const e of st.ents) {
      if (e.kind !== 'troop' && e.kind !== 'building' && e.kind !== 'tower') continue;
      const s = this.vstate(e);
      if (e.hp < s.hp - 0.5) s.flash = 0.12;
      s.hp = e.hp;
      if (s.flash > 0) s.flash -= dt;
      if (e.moving) s.walk = (s.walk + dt * (e.st ? e.st.speed || 1 : e.spd || 1) * 1.3) % 1;
      const fx = e.fx;
      if (fx > 0.2) s.dir = 1; else if (fx < -0.2) s.dir = -1;
      s.last = this.t;
    }
    if (this.vs.size > 400) for (const [id, s] of this.vs) if (this.t - s.last > 3) this.vs.delete(id);
    if (this.sel >= 0 && !st.me.hand[this.sel]) this.sel = -1;
  }

  // ---- drawing ----
  draw(ctx, st) {
    const W = this.W, H = this.H, T = this.T;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, this.theme.sky[0]);
    sky.addColorStop(1, this.theme.sky[1]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (this.shake > 0) ctx.translate(rand(-1, 1) * this.shake * 8, rand(-1, 1) * this.shake * 8);
    const pad = this.bg.pad;
    ctx.drawImage(this.bg.canvas, this.ox - pad * T, this.oy - pad * T, (AW + pad * 2) * T, (AH + pad * 2) * T);
    // shimmering river
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let i = 0; i < 12; i++) {
      const x = ((i * 1.7 + this.t * 0.6) % (AW + 2)) - 1;
      const y = RIVER_TOP + 0.4 + ((i * 0.37) % 1.2);
      const q = this.toScreen(x, this.flip ? AH - y : y);
      ctx.fillRect(q[0], q[1], 0.8 * T, 0.06 * T);
    }
    const a = st.alpha;
    const ents = st.ents;
    this.drawPlacementZones(ctx, st);
    // ground areas & shadows
    for (const e of ents) if (e.kind === 'area') this.drawArea(ctx, e);
    for (const e of ents) {
      if (e.kind !== 'troop' && e.kind !== 'building') continue;
      if (e.tunnel) continue;
      const q = this.toScreen(lerp(e.px, e.x, a), lerp(e.py, e.y, a));
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ellipse(ctx, q[0], q[1], e.r * T * (e.air ? 0.8 : 1), e.r * T * 0.45);
      ctx.fill();
    }
    // sprites (ground sorted by y, then flying)
    const ground = [], air = [];
    const alive = new Set();
    for (const e of ents) {
      if (e.kind === 'tower') alive.add(e.team + ':' + e.lane);
      if (e.kind === 'troop' || e.kind === 'building' || e.kind === 'tower') (e.air && e.deployT <= 0 ? air : ground).push(e);
    }
    for (const team of [0, 1]) {
      for (const s of TOWER_SLOTS) {
        if (alive.has(team + ':' + s.lane) || (st.t < 0.2 && !st.over)) continue;
        ground.push({ kind: 'rubble', tt: s.tt, team, x: s.x, y: mirrorY(team, s.y), px: s.x, py: mirrorY(team, s.y) });
      }
    }
    const sy = (e) => (this.flip ? AH - e.y : e.y);
    ground.sort((p, q) => sy(p) - sy(q));
    air.sort((p, q) => sy(p) - sy(q));
    for (const e of ground) this.drawEntity(ctx, e, a);
    for (const e of ents) if (e.kind === 'proj' && e.pt === 'log') this.drawProj(ctx, e, a);
    for (const e of air) this.drawEntity(ctx, e, a);
    for (const e of ents) if (e.kind === 'proj' && e.pt !== 'log') this.drawProj(ctx, e, a);
    this.fx.draw(ctx, this);
    this.drawCardPops(ctx);
    // health bars on top
    for (const e of ents) if (e.kind === 'troop' || e.kind === 'building' || e.kind === 'tower') this.drawHp(ctx, e, a);
    this.drawGhost(ctx, st);
    ctx.restore();
    this.drawHud(ctx, st);
  }

  drawArea(ctx, e) {
    const q = this.toScreen(e.x, e.y), T = this.T;
    const f = e.dur ? e.t / e.dur : 0;
    if (e.sp === 'poison') {
      ctx.fillStyle = 'rgba(120,220,60,0.28)';
      ellipse(ctx, q[0], q[1], e.r * T, e.r * T * 0.8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,255,90,0.6)';
      ctx.lineWidth = 0.1 * T;
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const an = i * 0.8 + this.t * 0.7, rr = ((i * 0.37 + this.t * 0.3) % 1) * e.r * 0.85;
        ctx.fillStyle = 'rgba(190,255,120,0.55)';
        circle(ctx, q[0] + Math.cos(an) * rr * T, q[1] + Math.sin(an) * rr * T * 0.8 - ((this.t * 1.3 + i) % 1) * 0.6 * T, 0.12 * T);
        ctx.fill();
      }
    } else if (e.sp === 'freeze') {
      ctx.globalAlpha = f > 0.85 ? (1 - f) / 0.15 : 1;
      ctx.fillStyle = 'rgba(190,240,255,0.3)';
      ellipse(ctx, q[0], q[1], e.r * T, e.r * T * 0.8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(230,252,255,0.8)';
      ctx.lineWidth = 0.08 * T;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.sp === 'arrows') {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 * (1 - f)) + ')';
      ctx.lineWidth = 0.06 * T;
      ellipse(ctx, q[0], q[1], e.r * T, e.r * T * 0.8);
      ctx.stroke();
    }
  }

  drawEntity(ctx, e, a) {
    const T = this.T;
    const x = lerp(e.px, e.x, a), y = lerp(e.py, e.y, a);
    const q = this.toScreen(x, y);
    const mine = e.team === this.myTeam;
    const c = TEAM_COLORS[mine ? 0 : 1];
    if (e.kind === 'rubble') {
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.scale(T * TOWER_SCALE, T * TOWER_SCALE);
      drawTower(ctx, e, { c, destroyed: true });
      ctx.restore();
      return;
    }
    const s = this.vstate(e);
    const fyS = this.flip ? -e.fy : e.fy;
    let aimX = e.fx, aimY = fyS;
    const atk = e.atk != null ? e.atk : e.attacking && e.st && e.st.hs ? clamp(1 - e.cd / e.st.hs, 0, 1) : -1;
    const o = {
      c, dir: s.dir, back: fyS < -0.25, walk: s.walk, moving: e.moving, t: this.t, atk, id: e.id,
      aimX, aimY, attacking: e.attacking, charging: e.charging, active: e.active, jump: 0,
    };
    if (e.kind === 'tower') {
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.scale(T * TOWER_SCALE, T * TOWER_SCALE);
      drawTower(ctx, e, o);
      if (e.freezeT > 0) this.frozenOverlay(ctx, e.tt === 'king' ? 2 : 1.5, 3.2);
      ctx.restore();
      if (s.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ellipse(ctx, q[0], q[1] - 1.5 * T, 1.5 * T, 1.3 * T); ctx.fill(); }
      return;
    }
    if (e.tunnel) {
      if (Math.random() < 0.3) this.fx.add({ k: 'dirt', x, y, life: 0.6 });
      ctx.fillStyle = '#7a5a36';
      ellipse(ctx, q[0], q[1], 0.45 * T, 0.28 * T);
      ctx.fill();
      ctx.fillStyle = '#9a7a4a';
      ellipse(ctx, q[0], q[1] - 0.1 * T, 0.3 * T, 0.18 * T);
      ctx.fill();
      return;
    }
    let z = 0;
    let alpha = 1;
    if (e.deployT > 0) {
      z = Math.min(e.deployT, 1) * 2.2;
      alpha = 0.55;
      // deploy timer
      ctx.strokeStyle = mine ? 'rgba(160,210,255,0.9)' : 'rgba(255,160,160,0.9)';
      ctx.lineWidth = 0.1 * T;
      ctx.beginPath();
      ctx.arc(q[0], q[1], e.r * T + 0.1 * T, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(1 - e.deployT, 0, 1));
      ctx.stroke();
    }
    if (e.air) z += AIR_H + Math.sin(this.t * 3 + e.id) * 0.08;
    if (e.jumping) z += 0.9;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(q[0], q[1] - z * T);
    const sc = T * UNIT_SCALE;
    if (e.kind === 'troop' && UNIT_ART[e.u]) {
      const fk = atk >= 0 ? 'a' + Math.min(7, Math.floor(atk * 8)) : e.moving ? 'w' + (Math.floor(s.walk * 4) % 4) : 'i';
      const tk = TIME_ANIM[e.u] ? Math.floor(this.t * 9 + e.id) % 4 : 0;
      const key = e.u + (mine ? 'b' : 'r') + (o.back ? 'k' : 'f') + fk + tk + (e.charging ? 'c' : '');
      const po = Object.assign({}, o, {
        dir: 1, t: tk / 9 + (TIME_ANIM[e.u] ? 0 : 0.3), id: 0,
        walk: e.moving ? (Math.floor(s.walk * 4) % 4) / 4 + 0.125 : 0,
        atk: atk >= 0 ? (Math.min(7, Math.floor(atk * 8)) + 0.5) / 8 : -1,
      });
      const sp = this.sprite(key, e.u, po);
      ctx.save();
      ctx.scale(s.dir, 1);
      ctx.drawImage(sp.cv, -sp.ox, -sp.oy, sp.w, sp.h);
      ctx.restore();
      ctx.scale(sc, sc);
    } else {
      ctx.scale(sc, sc);
      const f = UNIT_ART[e.u];
      if (f) f(ctx, o);
    }
    if (s.flash > 0) {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#fff';
      const h = UNIT_H[e.u] || 1.2;
      ellipse(ctx, 0, -h * 0.45, e.r * 1.1, h * 0.5);
      ctx.fill();
      ctx.globalAlpha = alpha;
    }
    if (e.freezeT > 0) this.frozenOverlay(ctx, e.r, UNIT_H[e.u] || 1.2);
    if (e.stunT > 0 && !(e.freezeT > 0)) {
      const h = (UNIT_H[e.u] || 1.2) + 0.15;
      for (let i = 0; i < 3; i++) {
        const an = this.t * 6 + (i * TAU) / 3;
        ctx.fillStyle = '#fff59d';
        circle(ctx, Math.cos(an) * 0.3, -h + Math.sin(an) * 0.1, 0.07);
        ctx.fill();
      }
    }
    if (e.slowT > 0 && !(e.freezeT > 0)) {
      ctx.strokeStyle = 'rgba(150,230,255,0.8)';
      ctx.lineWidth = 0.06;
      ellipse(ctx, 0, 0, e.r * 0.9, e.r * 0.4);
      ctx.stroke();
    }
    ctx.restore();
    // inferno beam
    if (e.u === 'inferno' && e.attacking) {
      const tx = e.target ? e.target.x : e.tgx, ty = e.target ? e.target.y : e.tgy;
      if (tx != null) {
        const tq = this.toScreen(tx, ty);
        const stage = e.rampT != null ? (e.rampT < 2 ? 0 : e.rampT < 4 ? 1 : 2) : e.ramp || 0;
        const tAir = e.target ? e.target.air : e.tgAir;
        const bx = q[0], by = q[1] - 1.85 * T * UNIT_SCALE, ex = tq[0], ey = tq[1] - (tAir ? AIR_H + 0.4 : 0.5) * T;
        ctx.strokeStyle = ['rgba(255,170,60,0.7)', 'rgba(255,110,40,0.85)', 'rgba(255,60,30,0.95)'][stage];
        ctx.lineWidth = (0.12 + stage * 0.08) * T;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.strokeStyle = '#fff3c0';
        ctx.lineWidth = 0.05 * T;
        ctx.stroke();
      }
    }
  }

  frozenOverlay(ctx, r, h) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#bff0ff';
    roundRect(ctx, -r * 1.1, -h * 1.02, r * 2.2, h * 1.04, 0.2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 0.05;
    ctx.stroke();
  }

  drawProj(ctx, p, a) {
    const T = this.T;
    const x = lerp(p.px, p.x, a), y = lerp(p.py, p.y, a);
    const q = this.toScreen(x, y);
    let z = 0;
    if (p.pt !== 'log') {
      const f = clamp(p.trav / (p.d0 || 1), 0, 1);
      const h0 = p.h0 == null ? 0.8 : p.h0, h1 = p.h1 == null ? 0.5 : p.h1;
      const arc = p.pt === 'bomb' || p.pt === 'fireball' || p.pt === 'cannonball' && h0 < 1.5 ? Math.min(3, (p.d0 || 1) * 0.35) : p.pt === 'arrow' || p.pt === 'spear' ? Math.min(1.2, (p.d0 || 1) * 0.12) : 0;
      z = lerp(h0, h1, f) + Math.sin(f * Math.PI) * arc;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ellipse(ctx, q[0], q[1], 0.15 * T, 0.07 * T);
      ctx.fill();
    }
    let vx = p.x - p.px, vy = p.y - p.py;
    if (Math.abs(vx) + Math.abs(vy) < 1e-4) { vx = (p.tx || p.x) - p.x; vy = (p.ty || p.y) - p.y; }
    if (this.flip) vy = -vy;
    ctx.save();
    ctx.translate(q[0], q[1] - z * T);
    ctx.scale(T, T);
    drawProjectile(ctx, p, { vx, vy, t: this.t });
    ctx.restore();
  }

  drawHp(ctx, e, a) {
    const T = this.T;
    const mine = e.team === this.myTeam;
    const col = TEAM_COLORS[mine ? 0 : 1].hp;
    const x = lerp(e.px, e.x, a), y = lerp(e.py, e.y, a);
    const q = this.toScreen(x, y);
    if (e.kind === 'tower') {
      const k = e.tt === 'king';
      if (k && !e.active && e.hp >= e.maxHp) {
        this.levelBadge(ctx, q[0] - 1.5 * T, q[1] - 3.8 * T, e.lvl, mine);
        return;
      }
      const w = (k ? 3.2 : 2.6) * T, h = 0.42 * T;
      const bx = q[0] - w / 2, by = q[1] - (k ? 4.05 : 3.8) * T;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      roundRect(ctx, bx - 2, by - 2, w + 4, h + 4, 5);
      ctx.fill();
      ctx.fillStyle = col;
      roundRect(ctx, bx, by, w * clamp(e.hp / e.maxHp, 0, 1), h, 4);
      ctx.fill();
      outlineText(ctx, String(Math.max(0, Math.ceil(e.hp))), q[0] + 0.25 * T, by + h / 2 + 0.5, Math.max(9, h * 0.95), '#fff');
      this.levelBadge(ctx, bx - 2, by + h / 2, e.lvl, mine);
      return;
    }
    if (e.hp >= e.maxHp - 0.5 || e.deployT > 0 || e.tunnel) return;
    const uh = (UNIT_H[e.u] || 1.2) * UNIT_SCALE + (e.air ? AIR_H : 0) + 0.25;
    const w = clamp(e.r * 2.2, 0.9, 2.2) * T, h = Math.max(3, 0.16 * T);
    const bx = q[0] - w / 2, by = q[1] - uh * T;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, w * clamp(e.hp / e.maxHp, 0, 1), h);
  }

  levelBadge(ctx, x, y, lvl, mine) {
    const r = Math.max(7, this.T * 0.36);
    ctx.fillStyle = mine ? '#1f4fb0' : '#a8182a';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const an = (i / 6) * TAU + Math.PI / 6;
      ctx.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    outlineText(ctx, String(lvl || 1), x, y + 0.5, r * 1.15, '#fff');
  }

  drawCardPops(ctx) {
    const T = this.T;
    for (const p of this.fx.parts) {
      if (p.k !== 'cardpop') continue;
      const q = this.toScreen(p.x, p.y);
      const f = p.t / p.life;
      const w = 1.9 * T, h = w * 1.24;
      ctx.globalAlpha = f > 0.7 ? (1 - f) / 0.3 : 1;
      const cv = cardArt(p.key, Math.round(w * this.dpr), Math.round(h * this.dpr));
      ctx.drawImage(cv, q[0] - w / 2, q[1] - h - 1.2 * T - f * 0.8 * T, w, h);
      ctx.globalAlpha = 1;
    }
  }

  // ---- card placement ----
  selectedKey(st) {
    const i = this.drag ? this.drag.slot : this.sel;
    return i >= 0 ? st.me.hand[i] : null;
  }

  drawPlacementZones(ctx, st) {
    const key = this.selectedKey(st);
    if (!key || (!this.drag && this.sel < 0)) return;
    const c = CARDS[key];
    if (c.type === 'spell' || c.anywhere) return;
    const T = this.T;
    // forbidden: the enemy half, except "pockets" where an enemy princess tower has fallen
    const enemyT = this.myTeam === 0 ? 1 : 0;
    const et = st.ents.filter((e) => e.kind === 'tower' && e.team === enemyT);
    const leftDown = !et.some((e) => e.lane === 0), rightDown = !et.some((e) => e.lane === 1);
    ctx.fillStyle = this.badSpot > 0 ? 'rgba(255,40,40,0.38)' : 'rgba(255,40,40,0.2)';
    const X = (x) => this.ox + x * T, Y = (ly) => this.oy + ly * T;
    ctx.fillRect(X(0), Y(0), AW * T, 10 * T);
    ctx.fillRect(X(leftDown ? 9 : 0), Y(10), (leftDown && rightDown ? 0 : leftDown || rightDown ? 9 : 18) * T, 5 * T);
    ctx.fillRect(X(0), Y(RIVER_TOP), AW * T, 2 * T);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(RIVER_BOT));
    ctx.lineTo(X(AW), Y(RIVER_BOT));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ghostPos(st) {
    if (!this.drag || !this.drag.over) return null;
    const [wx, wy] = this.toWorld(this.drag.x, this.drag.y - this.dragLift());
    const x = clamp(Math.round(wx * 2) / 2, 0.5, AW - 0.5), y = clamp(Math.round(wy * 2) / 2, 0.5, AH - 0.5);
    return [x, y];
  }

  // Lift the drop point above the finger so it isn't hidden under the thumb.
  dragLift() { return this.T * 1.2; }

  drawGhost(ctx, st) {
    const key = this.selectedKey(st);
    const g = this.ghostPos(st);
    if (!key || !g) return;
    const c = CARDS[key];
    const T = this.T;
    const ok = st.canPlace(key, g[0], g[1]);
    const q = this.toScreen(g[0], g[1]);
    ctx.save();
    if (c.type === 'spell') {
      const r = c.radius || 1;
      ctx.fillStyle = ok ? 'rgba(255,255,255,0.18)' : 'rgba(255,60,60,0.25)';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      if (c.spell === 'log') {
        const len = c.travel * T;
        ctx.fillRect(q[0] - c.halfW * T, q[1] - len, c.halfW * 2 * T, len);
        ctx.strokeRect(q[0] - c.halfW * T, q[1] - len, c.halfW * 2 * T, len);
      } else {
        ellipse(ctx, q[0], q[1], r * T, r * T);
        ctx.fill();
        ctx.stroke();
      }
    } else {
      const u = UNITS[c.unit];
      const n = c.count || 1;
      const offs = formation(n);
      ctx.globalAlpha = 0.55;
      for (let i = 0; i < n; i++) {
        const off = offs[i];
        const pq = this.toScreen(g[0] + off[0], g[1] + (this.myTeam === 0 ? off[1] : -off[1]));
        ctx.save();
        ctx.translate(pq[0], pq[1] - (u.air ? AIR_H * T : 0));
        ctx.scale(T * UNIT_SCALE, T * UNIT_SCALE);
        UNIT_ART[c.unit](ctx, { c: TEAM_COLORS[0], dir: 1, back: true, walk: 0, moving: false, t: this.t, atk: -1, id: i, aimX: 0, aimY: -1, attacking: false });
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      if (u.range >= 2 || u.building) {
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ellipse(ctx, q[0], q[1], (u.range + u.r) * T, (u.range + u.r) * T);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = ok ? 'rgba(255,255,255,0.9)' : 'rgba(255,70,70,0.95)';
      ctx.lineWidth = 2;
      ellipse(ctx, q[0], q[1], Math.max(0.5, u.r) * T, Math.max(0.5, u.r) * T * 0.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- HUD ----
  drawHud(ctx, st) {
    const W = this.W, T = this.T;
    // top: opponent name + timer
    const top = Math.max(this.oy - TOP_ROOM * T, 2);
    const nbw = Math.min(150, this.ox + 5.4 * T - 10);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, 6, top + 2, nbw, 34, 9);
    ctx.fill();
    ctx.save();
    roundRect(ctx, 6, top + 2, nbw - 4, 34, 9);
    ctx.clip();
    outlineText(ctx, st.foe.name, 14, top + 13, 12, '#ffb0a8', 'left');
    outlineText(ctx, st.foe.sub || '', 14, top + 27, 10, '#ffe082', 'left');
    ctx.restore();
    const tl = st.timeLeft;
    const tw = 92;
    // menu button
    const mb = this.menuBtn = { x: W - tw - 6 - 42, y: top + 2, w: 36, h: 36 };
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, mb.x, mb.y, mb.w, mb.h, 9);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) ctx.fillRect(mb.x + 9, mb.y + 10 + i * 7, 18, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, W - tw - 6, top + 2, tw, 38, 9);
    ctx.fill();
    outlineText(ctx, st.ot ? 'Overtime' : 'Time left', W - tw / 2 - 6, top + 12, 10, st.ot ? '#ffb74d' : '#ddd');
    outlineText(ctx, fmtTime(tl), W - tw / 2 - 6, top + 29, 17, tl <= 10 && !st.over ? '#ff6b6b' : '#fff');
    if (st.dbl) {
      ctx.fillStyle = '#c42be0';
      roundRect(ctx, W - tw - 6, top + 43, tw, 18, 7);
      ctx.fill();
      outlineText(ctx, st.ot ? 'x2 ELIXIR' : 'x2 ELIXIR', W - tw / 2 - 6, top + 52, 10, '#fff');
    }
    // crowns (right side, around the river)
    const cx = this.ox + AW * T - 0.9 * T;
    const mid = this.oy + RIVER_MID * T;
    this.crownRow(ctx, cx, mid - 2.4 * T, st.foe.crowns, false);
    this.crownRow(ctx, cx, mid + 2.4 * T, st.me.crowns, true);
    // messages
    let my = this.oy + 11 * T;
    for (const m of this.msgs) {
      const f = m.t / m.dur;
      const s = m.t < 0.15 ? easeOutBack(m.t / 0.15) : 1;
      ctx.globalAlpha = f > 0.8 ? (1 - f) / 0.2 : 1;
      let fs = Math.min(30, T * 1.4);
      ctx.font = `900 ${fs}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
      const mw = ctx.measureText(m.text).width;
      if (mw > W - 24) fs *= (W - 24) / mw;
      outlineText(ctx, m.text, W / 2, my, fs * s, m.col);
      ctx.globalAlpha = 1;
      my += T * 1.6;
    }
    // emotes
    for (const e of this.emotes) {
      const mine = e.team === this.myTeam;
      const ex = W / 2 + (mine ? -3.2 : 3.2) * T, ey = this.oy + (mine ? 26.2 : 5.2) * T;
      const s = e.t < 0.2 ? easeOutBack(e.t / 0.2) : 1;
      ctx.globalAlpha = e.t > 2 ? (2.4 - e.t) / 0.4 : 1;
      ctx.fillStyle = '#fff';
      roundRect(ctx, ex - 26 * s, ey - 24 * s, 52 * s, 44 * s, 12);
      ctx.fill();
      ctx.strokeStyle = mine ? TEAM_COLORS[0].main : TEAM_COLORS[1].main;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = `${Math.round(28 * s)}px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(EMOTES[e.i] || '?', ex, ey);
      ctx.globalAlpha = 1;
    }
    this.drawHand(ctx, st);
    if (st.tutorial && !this.drag) this.drawTutorial(ctx, st);
    if (st.stalled) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(ctx, W / 2 - 120, this.oy + 13 * T, 240, 44, 12);
      ctx.fill();
      outlineText(ctx, 'Waiting for opponent…', W / 2, this.oy + 13 * T + 22, 16, '#ffe082');
    }
    if (st.intro > 0) this.drawIntro(ctx, st);
  }

  crownRow(ctx, x, y, n, mine) {
    const T = this.T, s = Math.max(9, T * 0.55);
    for (let i = 0; i < 3; i++) {
      const cy = y + (mine ? i : -i) * s * 1.9;
      const on = i < n;
      ctx.save();
      ctx.translate(x, cy);
      ctx.globalAlpha = on ? 1 : 0.35;
      ctx.beginPath();
      ctx.moveTo(-s, s * 0.6);
      ctx.lineTo(-s, -s * 0.5);
      ctx.lineTo(-s * 0.5, 0);
      ctx.lineTo(0, -s * 0.8);
      ctx.lineTo(s * 0.5, 0);
      ctx.lineTo(s, -s * 0.5);
      ctx.lineTo(s, s * 0.6);
      ctx.closePath();
      ctx.fillStyle = on ? (mine ? '#5aa9ff' : '#ff6060') : '#222';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.restore();
    }
  }

  drawHand(ctx, st) {
    const W = this.W, H = this.H;
    const g = ctx.createLinearGradient(0, this.handTop, 0, H);
    g.addColorStop(0, '#2a3b5c');
    g.addColorStop(1, '#131c2e');
    ctx.fillStyle = g;
    ctx.fillRect(0, this.handTop, W, this.handH);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(0, this.handTop, W, 2);
    const me = st.me;
    // next card
    const nr = this.nextRect;
    if (me.next) {
      ctx.globalAlpha = 0.9;
      ctx.drawImage(cardArt(me.next, Math.round(nr.w * this.dpr), Math.round(nr.h * this.dpr)), nr.x, nr.y, nr.w, nr.h);
      ctx.globalAlpha = 1;
    }
    outlineText(ctx, 'Next', nr.x + nr.w / 2, nr.y - 8, 11, '#cfd8dc');
    // hand
    for (let i = 0; i < 4; i++) {
      const r = this.cards[i];
      const key = me.hand[i];
      if (!key) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        roundRect(ctx, r.x, r.y, r.w, r.h, 8);
        ctx.fill();
        continue;
      }
      const dragging = this.drag && this.drag.slot === i && this.drag.over;
      const lift = this.sel === i || (this.drag && this.drag.slot === i) ? 10 : 0;
      const pending = me.pending && me.pending.has(i);
      ctx.globalAlpha = dragging ? 0.35 : pending ? 0.5 : 1;
      ctx.drawImage(cardArt(key, Math.round(r.w * this.dpr), Math.round(r.h * this.dpr)), r.x, r.y - lift, r.w, r.h);
      ctx.globalAlpha = 1;
      const cost = CARDS[key].cost;
      if (me.elixir < cost) {
        const f = clamp(me.elixir / cost, 0, 1);
        ctx.fillStyle = 'rgba(10,10,20,0.62)';
        roundRect(ctx, r.x, r.y - lift, r.w, r.h * (1 - f), 8);
        ctx.fill();
      }
      if (lift) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        roundRect(ctx, r.x - 1, r.y - lift - 1, r.w + 2, r.h + 2, 9);
        ctx.stroke();
      }
    }
    // elixir bar
    const er = this.elixirRect;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, er.x, er.y, er.w, er.h, er.h / 2);
    ctx.fill();
    const el = clamp(me.elixir, 0, 10);
    const fw = (er.w - 4) * (el / 10);
    if (fw > 0) {
      const eg = ctx.createLinearGradient(0, er.y, 0, er.y + er.h);
      eg.addColorStop(0, '#f78cf2');
      eg.addColorStop(1, '#b01ad0');
      ctx.fillStyle = eg;
      roundRect(ctx, er.x + 2, er.y + 2, fw, er.h - 4, (er.h - 4) / 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let i = 1; i < 10; i++) ctx.fillRect(er.x + 2 + ((er.w - 4) * i) / 10 - 0.5, er.y + 3, 1, er.h - 6);
    // elixir drop with the number
    const dx = er.x - 2, dy = er.y + er.h / 2;
    ctx.save();
    ctx.translate(dx, dy);
    const ds = er.h * 0.9;
    ctx.beginPath();
    ctx.moveTo(0, -ds);
    ctx.bezierCurveTo(ds * 0.7, -ds * 0.2, ds * 0.8, ds * 0.2, ds * 0.8, ds * 0.4);
    ctx.arc(0, ds * 0.4, ds * 0.8, 0, Math.PI);
    ctx.bezierCurveTo(-ds * 0.8, ds * 0.2, -ds * 0.7, -ds * 0.2, 0, -ds);
    ctx.fillStyle = '#d23cf0';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    outlineText(ctx, String(Math.floor(el)), 0, ds * 0.35, ds * 1.1, '#fff');
    ctx.restore();
    // emote button
    const b = this.emoteBtn;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    circle(ctx, b.x, b.y, b.r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '18px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💬', b.x, b.y + 1);
    if (this.emoteOpen) {
      for (let i = 0; i < EMOTES.length; i++) {
        const p = this.emoteSlot(i);
        ctx.fillStyle = '#fff';
        circle(ctx, p.x, p.y, p.r);
        ctx.fill();
        ctx.strokeStyle = '#1f4fb0';
        ctx.stroke();
        ctx.font = `${Math.round(p.r * 1.2)}px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.fillText(EMOTES[i], p.x, p.y + 1);
      }
    }
    // dragged card follows the finger while still over the hand
    if (this.drag && !this.drag.over) {
      const key = me.hand[this.drag.slot];
      const r = this.cards[this.drag.slot];
      if (key) ctx.drawImage(cardArt(key, Math.round(r.w * this.dpr), Math.round(r.h * this.dpr)), this.drag.x - r.w / 2, this.drag.y - r.h / 2, r.w, r.h);
    }
  }

  // First battle: a finger shows how to drag a card onto the arena.
  drawTutorial(ctx, st) {
    const i = st.me.hand.findIndex((k) => k && CARDS[k].type === 'troop' && CARDS[k].cost <= st.me.elixir);
    if (i < 0) return;
    const r = this.cards[i];
    const f = (this.t % 2.2) / 1.6;
    if (f > 1) return;
    const e = easeOut(f);
    const [tx, ty] = this.toScreen(this.flip ? 14.5 : 3.5, this.flip ? AH - 21 : 21);
    const x = lerp(r.x + r.w / 2, tx, e), y = lerp(r.y + r.h / 2, ty, e);
    ctx.globalAlpha = f < 0.1 ? f * 10 : f > 0.85 ? (1 - f) / 0.15 : 1;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    circle(ctx, tx, ty, this.T * 1.2);
    ctx.fill();
    ctx.font = `${Math.round(this.T * 2)}px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('👆', x, y);
    ctx.globalAlpha = 1;
  }

  emoteSlot(i) {
    const b = this.emoteBtn;
    return { x: b.x + (i % 3) * 44 + 8, y: b.y - 50 - Math.floor(i / 3) * 44, r: 19 };
  }

  drawIntro(ctx, st) {
    const W = this.W, H = this.H;
    const f = st.intro;
    ctx.fillStyle = `rgba(5,10,25,${Math.min(0.6, f * 0.5)})`;
    ctx.fillRect(0, 0, W, H);
    const s = Math.min(1, f * 1.5);
    ctx.globalAlpha = s;
    outlineText(ctx, st.foe.name, W / 2, H * 0.3, 24, '#ff9a9a');
    outlineText(ctx, 'VS', W / 2, H * 0.4, 44, '#ffe082');
    outlineText(ctx, st.me.name, W / 2, H * 0.5, 24, '#8fd0ff');
    ctx.globalAlpha = 1;
  }

  // ---- input ----
  hitMenu(x, y) {
    const b = this.menuBtn;
    return !!b && x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4;
  }

  hitCard(x, y) {
    for (let i = 0; i < 4; i++) {
      const r = this.cards[i];
      if (x >= r.x - 3 && x <= r.x + r.w + 3 && y >= r.y - 12 && y <= r.y + r.h + 6) return i;
    }
    return -1;
  }

  pointer(type, x, y, st) {
    if (type === 'down') {
      if (this.emoteOpen) {
        for (let i = 0; i < EMOTES.length; i++) {
          const p = this.emoteSlot(i);
          if (Math.hypot(x - p.x, y - p.y) < p.r + 4) { this.emoteOpen = false; this.scene.sendEmote(i); return; }
        }
        this.emoteOpen = false;
      }
      const b = this.emoteBtn;
      if (Math.hypot(x - b.x, y - b.y) < b.r + 6) { this.emoteOpen = true; Sound.play('click'); return; }
      const i = this.hitCard(x, y);
      if (i >= 0 && st.me.hand[i]) {
        this.drag = { slot: i, x, y, sx: x, sy: y, over: false, moved: false, wasSel: this.sel === i };
        this.sel = i;
        Sound.play('click');
        return;
      }
      if (y < this.handTop && this.sel >= 0 && st.me.hand[this.sel]) {
        // tap-to-place with a selected card
        this.drag = { slot: this.sel, x, y: y + this.dragLift(), sx: x, sy: y, over: true, moved: true, tap: true };
        this.release(st);
      }
      return;
    }
    if (!this.drag) return;
    if (type === 'move') {
      this.drag.x = x;
      this.drag.y = y;
      if (Math.hypot(x - this.drag.sx, y - this.drag.sy) > 10) this.drag.moved = true;
      this.drag.over = y < this.handTop - 4;
      return;
    }
    if (type === 'up' || type === 'cancel') {
      if (type === 'cancel') { this.drag = null; return; }
      if (this.drag.over) this.release(st);
      else {
        if (!this.drag.moved && this.drag.wasSel) this.sel = -1;
        this.drag = null;
      }
    }
  }

  release(st) {
    const d = this.drag;
    this.drag = null;
    const key = st.me.hand[d.slot];
    if (!key) return;
    this.drag = d;
    const g = this.ghostPos(st);
    this.drag = null;
    if (!g) return;
    if (st.me.elixir < CARDS[key].cost) {
      this.message('Not enough elixir', '#ff9cf2', 1.1);
      Sound.play('error');
      return;
    }
    if (!st.canPlace(key, g[0], g[1])) {
      this.badSpot = 0.6;
      Sound.play('error');
      return;
    }
    if (this.scene.tryPlay(d.slot, g[0], g[1])) this.sel = -1;
  }
}

// ===== 08-net.js =====
// ---------- Online play ----------
// Two phones connect directly with WebRTC data channels. A PeerJS-compatible signaling server
// (the free public one at 0.peerjs.com by default) only introduces them; no game data goes through it.
// Add ?signal=host:port to the page URL to use your own PeerJS server instead.
const NET_PREFIX = 'crownduel-v1-';
const NET_PROTO = 1;
const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const QUICK_ID = NET_PREFIX + 'quick';

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const randCode = (n) => { let s = ''; for (let i = 0; i < n; i++) s += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)]; return s; };
const randId = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

function netConfig() {
  const qs = new URLSearchParams(location.search);
  const sig = qs.get('signal');
  let base = 'wss://0.peerjs.com:443/peerjs?key=peerjs';
  if (sig) {
    let u = sig;
    if (!/^wss?:\/\//.test(u)) u = (/^(localhost|127\.|10\.|192\.168\.|\[::1\])/.test(u) ? 'ws://' : 'wss://') + u;
    if (!/\/$/.test(u)) u += '/';
    base = u + 'peerjs?key=' + (qs.get('key') || 'peerjs');
  }
  const ice = qs.get('ice') === 'none' ? [] : [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  ];
  return { base, ice };
}

class NetError extends Error {
  constructor(code, msg) { super(msg || code); this.code = code; }
}

// A registration with the signaling server under one id.
class Signal {
  constructor(id) {
    this.id = id;
    this.ws = null;
    this.onmsg = null;
    this.hb = null;
    this.closed = false;
  }

  open(timeoutMs) {
    const cfg = netConfig();
    return new Promise((resolve, reject) => {
      let done = false;
      const fail = (code, msg) => { if (done) return; done = true; this.close(); reject(new NetError(code, msg)); };
      const timer = setTimeout(() => fail('offline', 'Could not reach the matchmaking server.'), timeoutMs || 10000);
      let ws;
      try {
        ws = new WebSocket(cfg.base + '&id=' + encodeURIComponent(this.id) + '&token=' + randId() + '&version=1.5.4');
      } catch (e) {
        clearTimeout(timer);
        fail('offline', 'Could not reach the matchmaking server.');
        return;
      }
      this.ws = ws;
      ws.onmessage = (ev) => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!done) {
          if (m.type === 'OPEN') {
            done = true;
            clearTimeout(timer);
            this.hb = setInterval(() => this.raw({ type: 'HEARTBEAT' }), 5000);
            resolve(this);
          } else if (m.type === 'ID-TAKEN') { clearTimeout(timer); fail('taken'); } else if (m.type === 'ERROR') { clearTimeout(timer); fail('server', 'The matchmaking server refused the connection.'); }
          return;
        }
        if (this.onmsg) this.onmsg(m);
      };
      ws.onerror = () => { clearTimeout(timer); fail('offline', 'Could not reach the matchmaking server.'); };
      ws.onclose = () => {
        clearTimeout(timer);
        if (!done) fail('offline', 'Could not reach the matchmaking server.');
        if (this.hb) clearInterval(this.hb);
        this.hb = null;
      };
    });
  }

  raw(m) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); } catch (e) { /* socket gone */ } }
  send(type, dst, payload) { this.raw({ type, dst, payload }); }

  close() {
    if (this.closed) return;
    this.closed = true;
    if (this.hb) clearInterval(this.hb);
    this.hb = null;
    try { if (this.ws) this.ws.close(); } catch (e) { /* already closed */ }
    this.ws = null;
  }
}

// A live connection to the other player: a reliable channel for commands and an
// unreliable one for the frequent battle snapshots.
class Link {
  constructor(pc, r, u, role) {
    this.pc = pc;
    this.r = r;
    this.u = u;
    this.role = role;
    this.onmsg = null;
    this.onclose = null;
    this.closed = false;
    this.rtt = 0;
    this.lastRecv = performance.now();
    this.queue = [];
    const recv = (ev) => {
      this.lastRecv = performance.now();
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === '_p') { this.send({ t: '_q', ts: m.ts }); return; }
      if (m.t === '_q') { this.rtt = performance.now() - m.ts; return; }
      if (this.onmsg) this.onmsg(m); else this.queue.push(m);
    };
    r.onmessage = recv;
    u.onmessage = recv;
    r.onclose = () => this.close('closed');
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'failed' || s === 'closed') this.close('lost');
    };
    this.pinger = setInterval(() => {
      this.send({ t: '_p', ts: performance.now() });
      if (performance.now() - this.lastRecv > 20000) this.close('timeout');
    }, 1000);
  }

  listen(fn) {
    this.onmsg = fn;
    const q = this.queue;
    this.queue = [];
    for (const m of q) fn(m);
  }

  send(m, fast) {
    if (this.closed) return;
    const ch = fast && this.u.readyState === 'open' ? this.u : this.r;
    if (ch.readyState !== 'open') return;
    try { ch.send(JSON.stringify(m)); } catch (e) { /* channel closing */ }
  }

  close(why) {
    if (this.closed) return;
    this.closed = true;
    clearInterval(this.pinger);
    try { this.r.close(); } catch (e) { /* ignore */ }
    try { this.u.close(); } catch (e) { /* ignore */ }
    try { this.pc.close(); } catch (e) { /* ignore */ }
    if (this.onclose) this.onclose(why || 'closed');
  }
}

const Net = {
  link: null,
  busy: null,

  supported() { return typeof RTCPeerConnection !== 'undefined' && typeof WebSocket !== 'undefined'; },

  // Cancellation token shared by the lobby UI.
  token() {
    const t = { cancelled: false, fns: [] };
    t.cancel = () => { if (t.cancelled) return; t.cancelled = true; for (const f of t.fns) { try { f(); } catch (e) { /* ignore */ } } };
    t.on = (f) => { if (t.cancelled) f(); else t.fns.push(f); };
    return t;
  },

  // Create a room with a short code and wait for a friend to join it.
  async hostRoom(token, onCode) {
    for (let i = 0; i < 6; i++) {
      if (token.cancelled) throw new NetError('cancelled');
      const code = randCode(4);
      const sig = new Signal(NET_PREFIX + code);
      token.on(() => sig.close());
      try {
        await sig.open(12000);
      } catch (e) {
        if (e.code === 'taken') continue;
        throw e;
      }
      onCode(code);
      return this.acceptGuest(sig, token);
    }
    throw new NetError('server', 'Could not create a room. Try again.');
  },

  acceptGuest(sig, token) {
    const cfg = netConfig();
    return new Promise((resolve, reject) => {
      let pc = null, peer = null, cid = null, pend = [], done = false;
      const reset = () => {
        if (pc) { try { pc.close(); } catch (e) { /* ignore */ } }
