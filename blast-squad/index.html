      // progress towards the goal direction
      const prog = (o.x - d.x) * Math.cos(a) + (o.y - d.y) * Math.sin(a);
      if (prog > bm) { bm = prog; bx = o.x; by = o.y; }
      if (prog >= step * 0.6) break;
    }
    d.x = bx; d.y = by;
  }

  // ---- 3. shots ----
  stepShots() {
    const S = this.shots, n0 = S.length; // shots spawned during this phase move from the next tick
    for (let i = 0; i < n0; i++) {
      const s = S[i];
      if (s.dead) continue;
      s.px = s.x; s.py = s.y;
      if (s.beam > 0) {
        s.ttl -= SIM_DT;
        if (s.ttl <= 0) { s.dead = true; this.ev(EV.SHOT_END, s.id, s.x, s.y, 0); }
      } else if (s.lob) this.stepLob(s);
      else this.stepStraight(s);
    }
  }

  stepStraight(s) {
    const m = this.map, B = this.brawlers, D = this.deploys, sp = s.s;
    let step = s.spd * SIM_DT;
    if (s.trav + step > s.range) step = Math.max(0, s.range - s.trav);
    const x0 = s.x, y0 = s.y, x1 = x0 + s.vx * step, y1 = y0 + s.vy * step;
    if (sp.grow) s.r = s.r0 + sp.grow * s.trav;
    if (s.breaks) this.breakAlong(x0, y0, x1, y1, s.r, s.owner, s.act);
    const tw = rayHit(m, x0, y0, x1, y1, TF_SHOT, this._ray);
    const wtx = this._ray.tx, wty = this._ray.ty;
    const tEnd = tw < 0 ? 1 : tw;
    if (s.dmg > 0) {
      let bt = 2, best = null;
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (!this.hittable(e) || e.team === s.team || ((s.hitMask >> e.slot) & 1)) continue;
        const t = segCircle(x0, y0, x1, y1, e.x, e.y, e.r + s.r);
        if (t < 0 || t > tEnd) continue;
        if (s.pierce) { s.hitMask |= 1 << e.slot; this.shotHit(s, e); } else if (t < bt) { bt = t; best = e; }
      }
      for (let i = 0; i < D.length; i++) {
        const e = D[i];
        if (e.dead || e.team === s.team || ((s.hitD >> e.owner) & 1)) continue;
        const t = segCircle(x0, y0, x1, y1, e.x, e.y, e.r + s.r);
        if (t < 0 || t > tEnd) continue;
        if (s.pierce) { s.hitD |= 1 << e.owner; this.shotHit(s, e); } else if (t < bt) { bt = t; best = e; }
      }
      if (best) {
        s.x = x0 + (x1 - x0) * bt;
        s.y = y0 + (y1 - y0) * bt;
        s.trav += step * bt;
        if (best.kind === K.BRAWLER) s.hitMask |= 1 << best.slot; else s.hitD |= 1 << best.owner;
        this.shotHit(s, best);
        if (s.bnc > 0 && this.bounce(s)) return;
        this.endShot(s, 0);
        return;
      }
    }
    if (s.heal > 0) {
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (!e.alive || e.team !== s.team || ((s.hitMask >> e.slot) & 1) || (e.slot === s.owner && !sp.hself)) continue;
        const t = segCircle(x0, y0, x1, y1, e.x, e.y, e.r + s.r);
        if (t < 0 || t > tEnd) continue;
        s.hitMask |= 1 << e.slot;
        this.heal(e, s.heal, s.owner, s.act);
      }
    }
    s.x = x0 + (x1 - x0) * tEnd;
    s.y = y0 + (y1 - y0) * tEnd;
    s.trav += step * tEnd;
    if (tw >= 0) {
      if (s.dmg > 0 && tileAtT(m, wtx, wty) === TILE.BOX) this.hurtBox(wty * m.w + wtx, s.dmg, s.owner, s.act);
      this.endShot(s, 1);
    } else if (s.trav >= s.range - 1e-6) this.endShot(s, 0);
  }

  shotHit(s, e) {
    const sp = s.s;
    let dmg = s.dmg, crit = s.sup ? 1 : 0;
    if (sp.ramp) {
      const k = clamp(s.trav / (sp.range || s.range || 1), 0, 1);
      dmg *= sp.ramp[0] + (sp.ramp[1] - sp.ramp[0]) * k;
      if ((sp.ramp[1] > sp.ramp[0] && k > 0.85) || (sp.ramp[1] < sp.ramp[0] && k < 0.15)) crit = 1;
    }
    const isB = e.kind === K.BRAWLER;
    const dealt = this.hurt(e, dmg, s.owner, s.act, crit, isB && s.act === ACT.ATTACK ? sp.chg || 0 : 0);
    if (isB) this.applyMods(e, sp, s.owner, s.act, s.vx, s.vy, s.stun);
    if (sp.steal && dealt > 0) this.heal(this.brawlers[s.owner], dealt * sp.steal, s.owner, s.act);
  }

  // Sends a bouncing shot on to the nearest enemy brawler it hasn't hit. False when there is none.
  bounce(s) {
    const B = this.brawlers, R = s.s.bounce.r;
    let best = null, bd = R * R;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!this.hittable(e) || e.team === s.team || ((s.hitMask >> e.slot) & 1)) continue;
      const d2 = dist2(s.x, s.y, e.x, e.y);
      if (d2 < bd) { bd = d2; best = e; }
    }
    if (!best) return false;
    s.bnc--;
    s.x0 = s.x; s.y0 = s.y;
    s.ang = Math.atan2(best.y - s.y, best.x - s.x);
    s.vx = Math.cos(s.ang); s.vy = Math.sin(s.ang);
    s.trav = 0;
    s.range = Math.sqrt(bd) + 1;
    return true;
  }

  endShot(s, wall) {
    s.dead = true;
    this.ev(EV.SHOT_END, s.id, s.x, s.y, wall);
    const sp = s.s.split;
    if (!sp) return;
    // spikes start just in front of a wall, not inside it
    const x = wall ? s.x - s.vx * 0.15 : s.x, y = wall ? s.y - s.vy * 0.15 : s.y;
    for (let i = 0; i < sp.n; i++) {
      const e = this.spawnShot(s.owner, s.team, sp, s.act, s.ang + ((i + 0.5) / sp.n) * TAU, x, y, s.mul, 0);
      e.hitMask = s.hitMask;
      e.hitD = s.hitD;
    }
  }

  stepLob(s) {
    const L = s.lob;
    L.t += SIM_DT;
    const k = Math.min(1, L.t / L.T);
    s.x = s.x0 + (L.tx - s.x0) * k;
    s.y = s.y0 + (L.ty - s.y0) * k;
    s.trav = s.range * k;
    if (k < 1) return;
    const sp = s.s, chg = s.act === ACT.ATTACK ? sp.chg || 0 : 0;
    if (sp.breaks) this.breakCircle(s.x, s.y, sp.blast || 1, s.owner, s.act);
    if (sp.blast && (s.dmg > 0 || sp.kb || s.stun)) this.blast(s.owner, s.team, s.act, s.x, s.y, sp.blast, s.dmg, sp, s.stun, chg);
    if (sp.area) this.spawnArea(s.owner, s.team, sp.area, s.act, s.x, s.y, s.mul, s.xslow, chg);
    this.endShot(s, 0);
  }

  // ---- 4. areas ----
  stepAreas() {
    const A = this.areas, B = this.brawlers, dt = SIM_DT;
    for (let i = 0; i < A.length; i++) {
      const a = A[i];
      if (a.dead) continue;
      a.t -= dt;
      a.tickT -= dt;
      if (a.slow > 0) {
        // slows act every tick so walking out frees you at once
        for (let j = 0; j < B.length; j++) {
          const e = B[j];
          if (this.hittable(e) && e.team !== a.team && dist2(a.x, a.y, e.x, e.y) <= a.r * a.r) {
            if (e.slowT < 0.2) this.slow(e, 0.3, a.slow, a.owner, a.act);
            else { e.slowT = Math.max(e.slowT, 0.3); e.slowF = Math.max(e.slowF, a.slow); }
          }
        }
      }
      if (a.tickT <= 0) {
        a.tickT += Sim.AREA_TICK;
        this.areaTick(a);
      }
      if (a.t <= 0) { a.dead = true; this.ev(EV.DESPAWN, a.id, K.AREA); }
    }
  }

  areaTick(a) {
    const B = this.brawlers, k = Sim.AREA_TICK, r2 = a.r * a.r;
    if (a.dmg > 0) {
      const chg = a.act === ACT.ATTACK ? a.chg : 0;
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (this.hittable(e) && e.team !== a.team && dist2(a.x, a.y, e.x, e.y) <= r2) this.hurt(e, a.dmg * k, a.owner, a.act, 0, chg);
      }
      for (let i = 0; i < this.deploys.length; i++) {
        const e = this.deploys[i];
        if (!e.dead && e.team !== a.team && dist2(a.x, a.y, e.x, e.y) <= (a.r + e.r) * (a.r + e.r)) this.hurt(e, a.dmg * k, a.owner, a.act, 0, 0);
      }
      if (this.hasBox) this.hurtBoxesIn(a.x, a.y, a.r, a.dmg * k, a.owner, a.act);
    }
    if (a.heal > 0) {
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (e.alive && e.team === a.team && dist2(a.x, a.y, e.x, e.y) <= r2) this.heal(e, a.heal * k, a.owner, a.act);
      }
    }
    const ob = this.brawlers[a.owner];
    if (ob.kit.pass.fieldHeal && a.act === ACT.SUPER && ob.alive && dist2(a.x, a.y, ob.x, ob.y) <= r2) {
      this.heal(ob, ob.kit.pass.fieldHeal * k * LEVEL_MULT(ob.lvl), ob.slot, a.act);
    }
  }

  // ---- 5. pickups ----
  spawnPickup(pick, n, x, y, tx, ty) {
    const T = 0.35, pop = tx !== x || ty !== y;
    const e = {
      id: this.nextId++, kind: K.PICKUP, team: -1, x, y, px: x, py: y, r: 0.3, dead: false,
      pick, n, vx: pop ? (tx - x) / T : 0, vy: pop ? (ty - y) / T : 0, t: 0, popT: pop ? T : 0,
    };
    this.pickups.push(e);
    this.ev(EV.SPAWN, e.id, K.PICKUP);
    return e;
  }

  // A random free point dmin..dmax tiles from (x, y) (sim.rng), for gems popping out and drops.
  scatterSpot(x, y, dmin, dmax, out) {
    const m = this.map;
    for (let k = 0; k < 12; k++) {
      const a = this.rng.range(0, TAU), d = this.rng.range(dmin, dmax);
      const tx = x + Math.cos(a) * d, ty = y + Math.sin(a) * d;
      if (tx < 0.5 || ty < 0.5 || tx > m.w - 0.5 || ty > m.h - 0.5) continue;
      if (flagsAt(m, tx, ty) & TF_MOVE) continue;
      out.x = tx; out.y = ty;
      pushOut(m, out, 0.3, TF_MOVE);
      if (!(flagsAt(m, out.x, out.y) & TF_MOVE)) return out;
    }
    return this.freeSpot(x, y, 0.3, out);
  }

  // One pickup popping out of (x, y) to a free spot dmin..dmax away (the gem mine).
  popPickup(pick, n, x, y, dmin, dmax) {
    const o = this.scatterSpot(x, y, dmin, dmax, this._o2);
    return this.spawnPickup(pick, n, x, y, o.x, o.y);
  }

  // `count` single pickups scattered around (x, y), e.g. the gems of a fallen carrier.
  dropPickups(pick, count, x, y) {
    if (count <= 0) return;
    for (let i = 0; i < count; i++) {
      const o = this.scatterSpot(x, y, 0.4, 1.4 + Math.min(1, count / 10), this._o2);
      this.spawnPickup(pick, 1, x, y, o.x, o.y);
    }
    this.ev(EV.DROP, pick, count, x, y);
  }

  stepPickups() {
    const P = this.pickups, B = this.brawlers, dt = SIM_DT, nb = B.length;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (p.dead) continue;
      p.px = p.x; p.py = p.y;
      p.t += dt;
      if (p.popT > 0) {
        const k = Math.min(dt, p.popT);
        p.x += p.vx * k; p.y += p.vy * k;
        p.popT -= dt;
        if (p.popT <= 0) { p.popT = 0; p.vx = p.vy = 0; }
      }
      if (p.t < 0.3) continue;
      // rotate who gets the first try so no slot wins every tie
      for (let j = 0; j < nb; j++) {
        const b = B[(j + this.tick) % nb];
        if (!this.hittable(b) || dist2(b.x, b.y, p.x, p.y) > (b.r + p.r) * (b.r + p.r)) continue;
        if (!this.mode.onPickup(this, b, p)) continue;
        p.dead = true;
        this.ev(EV.PICKUP, b.slot, p.pick, p.n, p.x, p.y);
        this.ev(EV.DESPAWN, p.id, K.PICKUP);
        break;
      }
    }
  }

  // ---- 7. timers ----
  stepTimers() {
    const B = this.brawlers, dt = SIM_DT;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (!b.alive) {
        if (b.respawnT > 0) {
          b.respawnT -= dt;
          if (b.respawnT <= 0) {
            if (this.mode.canRespawn(this, b)) this.spawn(b, true);
            else b.respawnT = -1;
          }
        }
        continue;
      }
      b.fireT += dt;
      b.quietT += dt;
      if (b.stunT > 0) b.stunT = Math.max(0, b.stunT - dt);
      if (b.slowT > 0) { b.slowT -= dt; if (b.slowT <= 0) { b.slowT = 0; b.slowF = 0; } }
      if (b.revealT > 0) b.revealT = Math.max(0, b.revealT - dt);
      if (b.invisT > 0) b.invisT = Math.max(0, b.invisT - dt);
      if (b.speedT > 0) { b.speedT -= dt; if (b.speedT <= 0) { b.speedT = 0; b.speedF = 0; } }
      if (b.shieldT > 0) { b.shieldT -= dt; if (b.shieldT <= 0) { b.shieldT = 0; b.shieldF = 0; b.spawnSh = false; } }
      if (b.faceT > 0) b.faceT = Math.max(0, b.faceT - dt);
      if (b.atkCd > 0) b.atkCd = Math.max(0, b.atkCd - dt);
      if (b.gadT > 0) b.gadT = Math.max(0, b.gadT - dt);
      const pass = b.kit.pass;
      if (b.ammo < MAX_AMMO) {
        let rate = 1 / b.reload;
        if (pass.moveReload && (b.mvx !== 0 || b.mvy !== 0)) rate *= 1 + pass.moveReload;
        b.ammo = Math.min(MAX_AMMO, b.ammo + rate * dt);
      }
      // regeneration comes in 1 s ticks once the brawler has been quiet for REGEN_DELAY
      if (b.quietT >= REGEN_DELAY && b.hp < b.maxHp) {
        b.regenAcc -= dt;
        if (b.regenAcc <= 0) { b.regenAcc += 1; this.heal(b, b.maxHp * REGEN_RATE, -1, 0); }
      } else b.regenAcc = 0;
      if (pass.invisHeal) {
        b.passAcc += dt;
        if (b.passAcc >= 0.5) {
          b.passAcc -= 0.5;
          if (b.invisT > 0) this.heal(b, pass.invisHeal * 0.5 * LEVEL_MULT(b.lvl), b.slot, ACT.SUPER);
        }
      }
    }
  }

  // ---- 8. poison ----
  stepPoison() {
    const sch = this.mode.poison, pt = this.t - this.roundT0, dt = SIM_DT;
    const P = (this.poison = poisonRect(this.map, pt, sch, this.poison || {}));
    if (pt < sch.start) return;
    if (this.poisonStage === 0) { this.poisonStage = 1; this.ev(EV.POISON, 1); }
    if (this.poisonStage === 1 && pt >= sch.start + sch.shrink) { this.poisonStage = 2; this.ev(EV.POISON, 2); }
    const B = this.brawlers;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (!b.alive) continue;
      if (b.x >= P.x0 && b.x <= P.x1 && b.y >= P.y0 && b.y <= P.y1) { b.poisAcc = 0.5; continue; }
      b.poisAcc -= dt;
      if (b.poisAcc <= 0) {
        b.poisAcc += 1;
        this.hurt(b, sch.dmg || 1000, -1, 0, 0, 0);
      }
    }
  }

  // ---- 9. deaths ----
  stepDeaths() {
    const B = this.brawlers;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (b.alive && b.hp <= 0) this.die(b);
    }
  }

  die(b) {
    const k = b.killer >= 0 ? this.brawlers[b.killer] : null;
    const killer = k && k.team !== b.team ? k : null;
    b.alive = false;
    b.st.deaths++;
    if (killer) killer.st.kills++;
    this.ev(EV.KILL, b.slot, killer ? killer.slot : -1, b.x, b.y);
    this.deathOrder.push(b.slot);
    this.clearStatus(b);
    if (this.ball && this.ball.holder === b.slot) this.dropBall();
    this.mode.onKill(this, b, killer);
    if (killer && killer.alive && killer.kit.pass.killHeal) this.heal(killer, killer.kit.pass.killHeal * LEVEL_MULT(killer.lvl), killer.slot, 0);
    b.respawnT = this.mode.canRespawn(this, b) ? RESPAWN_T : -1;
  }

  // ---- 10. vision ----
  // Walls never block sight. Hidden from a team: in a bush (and not revealed) unless one of its
  // living members is within REVEAL_R, or invisible unless one is within INVIS_R.
  updateVision() {
    const B = this.brawlers, m = this.map, all = (1 << this.nTeams) - 1;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (!b.alive) { b.inBush = false; b.vis = 1 << b.team; continue; }
      b.inBush = inBushAt(m, b.x, b.y);
      const bush = b.inBush && b.revealT <= 0, inv = b.invisT > 0;
      if (!bush && !inv) { b.vis = all; continue; }
      const R = inv ? Sim.INVIS_R : REVEAL_R, R2 = R * R;
      let vis = 1 << b.team;
      for (let j = 0; j < B.length; j++) {
        const o = B[j];
        if (o.alive && o.team !== b.team && dist2(b.x, b.y, o.x, o.y) <= R2) vis |= 1 << o.team;
      }
      b.vis = vis;
    }
  }

  // ---- 11. end ----
  // Result builder for modes: fills mvp, rank and stats.
  makeResult(winner, reason, score, rank) {
    return { winner, rank: rank || this.rankByScore(), mvp: this.mvpOf(winner), reason, score: score || [0, 0], stats: this.brawlers.map((b) => Object.assign({}, b.st)) };
  }

  end(r) {
    if (r.mvp == null) r.mvp = this.mvpOf(r.winner);
    if (!r.rank) r.rank = this.rankByScore();
    if (!r.stats) r.stats = this.brawlers.map((b) => Object.assign({}, b.st));
    if (!r.score) r.score = [0, 0];
    this.over = true;
    this.result = r;
    this.ev(EV.END);
  }

  perfScore(b) {
    const s = b.st;
    return s.kills * 3 + s.dmg / 1000 + s.heal / 1500 + s.gems * 1.5 + s.goals * 5 + s.stars * 1.5 - s.deaths * 0.5;
  }

  // Best performer of the winning team (of everyone on a draw or in Showdown).
  mvpOf(winner) {
    let best = -1, bs = -Infinity;
    for (const b of this.brawlers) {
      if (winner >= 0 && this.nTeams === 2 && b.team !== winner) continue;
      const s = this.perfScore(b);
      if (s > bs) { bs = s; best = b.slot; }
    }
    return best;
  }

  rankByScore() {
    return this.brawlers.map((b) => b.slot).sort((a, c) => this.perfScore(this.brawlers[c]) - this.perfScore(this.brawlers[a]) || a - c);
  }

  // ---- shared parts for later modes ----
  // Knockout: a new round. Clears shots, areas, pickups and units, puts every brawler back on its
  // spawn with full health (super charge and gadget uses carry over unless opts.resetSuper), and
  // restarts the poison clock. opts.tiles restores broken walls and boxes.
  resetRound(opts) {
    opts = opts || {};
    for (const arr of [this.shots, this.areas, this.pickups, this.deploys]) {
      for (const e of arr) if (!e.dead) { e.dead = true; this.ev(EV.DESPAWN, e.id, e.kind); }
      arr.length = 0;
    }
    this.deathOrder.length = 0;
    const m = this.map;
    if (opts.tiles) {
      for (let i = 0; i < m.tiles.length; i++) {
        if (m.tiles[i] === this.tiles0[i]) continue;
        this.setTile(i, this.tiles0[i]);
        if (this.tiles0[i] === TILE.BOX) this.boxHp[i] = Sim.BOX_HP;
      }
    }
    for (const b of this.brawlers) {
      if (opts.resetSuper) { b.sup = 0; b.supReady = false; }
      b.carry = 0;
      this.spawn(b, true);
    }
    this.roundT0 = this.t;
    this.poisonStage = 0;
    this.poison = this.mode.poison ? poisonRect(m, 0, this.mode.poison, this.poison || {}) : null;
    if (this.ball) this.placeBall(m.obj ? m.obj.x : m.w / 2, m.obj ? m.obj.y : m.h / 2);
    this.updateVision();
  }

  // Blast Ball: the ball entity and its physics. The mode calls stepBall() from its tick and
  // kickBall() from onAction; possession, goals and overtime are the mode's business.
  addBall(x, y) {
    this.ball = { id: this.nextId++, kind: K.BALL, team: -1, x, y, px: x, py: y, r: 0.35, dead: false, holder: -1, vx: 0, vy: 0, z: 0, vz: 0, kicker: -1, kickT: 0 };
    this.ev(EV.SPAWN, this.ball.id, K.BALL);
    return this.ball;
  }

  placeBall(x, y) {
    const o = this.ball;
    o.x = o.px = x; o.y = o.py = y;
    o.holder = -1; o.vx = o.vy = o.z = o.vz = 0; o.kicker = -1; o.kickT = 0;
  }

  // what: EV.BALL code (2 kick, 3 pass). vz lifts it (lobbed passes fly over brawlers).
  kickBall(b, ang, spd, vz, what) {
    const o = this.ball;
    o.holder = -1;
    o.x = b.x; o.y = b.y;
    o.vx = Math.cos(ang) * spd; o.vy = Math.sin(ang) * spd;
    o.z = 0.3; o.vz = vz || 0;
    o.kicker = b.slot; o.kickT = 0.35;
    this.ev(EV.BALL, what || 2, b.slot);
  }

  dropBall() {
    const o = this.ball;
    if (!o || o.holder < 0) return;
    const s = o.holder;
    o.holder = -1; o.vx = o.vy = 0; o.kicker = s; o.kickT = 0.5;
    this.ev(EV.BALL, 4, s);
  }

  stepBall() {
    const o = this.ball, dt = SIM_DT, m = this.map;
    if (!o) return;
    o.px = o.x; o.py = o.y;
    if (o.holder >= 0) {
      const h = this.brawlers[o.holder];
      if (!h.alive || h.stunT > 0 || h.kbT > 0) this.dropBall();
      else {
        o.x = h.x + Math.cos(h.face) * 0.45; o.y = h.y + Math.sin(h.face) * 0.45; o.z = 0;
        return;
      }
    }
    if (o.kickT > 0) o.kickT -= dt;
    o.vz -= 22 * dt;
    o.z += o.vz * dt;
    if (o.z <= 0) { o.z = 0; o.vz = o.vz < -3 ? -o.vz * 0.35 : 0; }
    // walls bounce it back (axis by axis); water and fences don't stop a rolling ball
    const nx = o.x + o.vx * dt;
    if (flagsAt(m, nx + sign(o.vx) * o.r, o.y) & TF_SHOT) o.vx = -o.vx * 0.6; else o.x = nx;
    const ny = o.y + o.vy * dt;
    if (flagsAt(m, o.x, ny + sign(o.vy) * o.r) & TF_SHOT) o.vy = -o.vy * 0.6; else o.y = ny;
    if (o.z === 0) { const f = Math.max(0, 1 - 2.2 * dt); o.vx *= f; o.vy *= f; }
    if (o.z > 0.8) return;
    const B = this.brawlers;
    for (let j = 0; j < B.length; j++) {
      const b = B[(j + this.tick) % B.length];
      if (!this.canAct(b) || (b.slot === o.kicker && o.kickT > 0)) continue;
      if (dist2(b.x, b.y, o.x, o.y) > (b.r + o.r) * (b.r + o.r)) continue;
      o.holder = b.slot; o.vx = o.vy = 0; o.kicker = -1;
      this.ev(EV.BALL, 1, b.slot);
      break;
    }
  }
}

Sim.BOX_HP = 6000; // Showdown power-cube box health
Sim.AREA_TICK = 0.5; // lasting zones deal damage / heal in ticks of this many seconds
Sim.INVIS_R = 1.6; // enemies this close see an invisible brawler
Sim.BEAM_FX = { pk: '', dmg: 0, spd: 0, range: 0, r: 0.1 };

// ===== 07-modes.js =====
// ---------- Modes ----------
// Each mode is a set of hooks the sim calls (see DESIGN.md "Modes"); its state lives in sim.ms.
// ModeKit.make(key, hooks) fills in defaults, so a mode only writes what differs.
//
// Adding a mode (Showdown, Blast Ball, Knockout, Bounty come in a later wave) — what the sim offers:
//   - spawns: ModeKit.spawnPoint picks map.spawns by team (3v3) or by slot / sim.ms.order (Showdown).
//   - poison: set `poison: { start, shrink, minHalf, dmg }` on the mode. The sim keeps sim.poison
//     (the safe rect), deals `dmg` per second outside it, emits EV.POISON, and measures time from
//     sim.roundT0 (restarted by sim.resetRound()).
//   - Showdown: map BOX tiles have sim.boxHp and drop PICK.CUBE pickups when destroyed; take them in
//     onPickup with ModeKit.cube (sim.addCube adds CUBE_HP and CUBE_DMG). sim.deathOrder lists the
//     slots in the order they went down; return `rank` (1st first) from checkEnd. canRespawn: false.
//     Drop cubes on death with sim.dropPickups(PICK.CUBE, n, x, y).
//   - Knockout: canRespawn false; when a team is wiped, EV.ROUND then sim.resetRound({ tiles }).
//   - Blast Ball: sim.addBall(x, y) in init, sim.stepBall() in tick, onAction(sim, b, act, input)
//     returning true when the holder kicks (sim.kickBall) instead of attacking. Goal rects are in
//     map.goals; count b.st.goals and emit EV.GOAL.
//   - Bounty: b.bounty (stars on the head), PICK.STAR pickups at map.obj, b.st.stars.
//   - every mode: hud(sim) returns the HUD object of DESIGN.md; checkEnd returns
//     sim.makeResult(winner, reason, score, rank) or null.
//   tools/sim-test.cjs registers a minimal Showdown-like mode ('zz_sd': poison, no respawn, cubes
//   dropped on death, placement from sim.deathOrder) on a generated 44 x 44 map: a working sketch.

const ModeKit = {
  base: {
    poison: null,
    onAction: null,
    init() {},
    spawnPoint(sim, b) { return ModeKit.spawnPoint(sim, b); },
    tick() {},
    onKill() {},
    onPickup(sim, b, p) { return ModeKit.cube(sim, b, p); },
    canRespawn() { return true; },
    checkEnd() { return null; },
    hud(sim) { return { mode: this.key, time: sim.t }; },
  },

  make(key, hooks) { return Object.assign({}, ModeKit.base, { key }, hooks); },

  // Index of b among its team's slots (0 for the lowest slot).
  teamIndex(sim, b) {
    let i = 0;
    for (const o of sim.brawlers) if (o.team === b.team && o.slot < b.slot) i++;
    return i;
  },

  // Team maps: the team's spawn markers in order. One-list maps (Showdown): by sim.ms.order[slot] or
  // slot. More players than markers share them on a small ring.
  spawnPoint(sim, b) {
    const sp = sim.map.spawns;
    let list, i;
    if (sp.length > 1) { list = sp[Math.min(b.team, sp.length - 1)]; i = ModeKit.teamIndex(sim, b); }
    else { list = sp[0]; i = sim.ms.order ? sim.ms.order[b.slot] : b.slot; }
    if (!list.length) return { x: sim.map.w / 2, y: sim.map.h / 2 };
    const p = list[i % list.length], lap = Math.floor(i / list.length);
    if (!lap) return { x: p.x, y: p.y };
    const a = lap * 2.4;
    return sim.freeSpot(p.x + Math.cos(a) * 0.8, p.y + Math.sin(a) * 0.8, BRAWLER_R, { x: 0, y: 0 });
  },

  cube(sim, b, p) {
    if (p.pick !== PICK.CUBE) return false;
    sim.addCube(b);
    return true;
  },

  // Index of the single highest value, or -1 on a tie.
  leader(arr) {
    let best = -1, bv = -Infinity, tie = false;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] > bv) { bv = arr[i]; best = i; tie = false; } else if (arr[i] === bv) tie = true;
    }
    return tie ? -1 : best;
  },
};

const MODES = {
  // Gem Rush (Gem Grab): the mine spits a gem every 7 s; a team holding 10+ gems and more than the
  // other starts a 15 s countdown that resets as soon as that stops being true.
  gem: ModeKit.make(MODE.GEM, {
    first: 2, // s until the first gem
    every: 7,
    goal: 10,
    count: 15,
    cap: 300, // hidden safety cap: no visible clock, but a match can't run forever

    init(sim) {
      sim.ms = { gems: [0, 0], mineT: this.first, count: 0, countTeam: -1, spawned: 0 };
    },

    tick(sim) {
      const ms = sim.ms, mine = sim.map.mine;
      ms.mineT -= SIM_DT;
      if (ms.mineT <= 0) {
        ms.mineT += this.every;
        if (mine) { sim.popPickup(PICK.GEM, 1, mine.x, mine.y, 1.1, 2.1); ms.spawned++; }
      }
      if (!this.recount(sim) && ms.countTeam >= 0) ms.count -= SIM_DT;
    },

    // Recounts the gems each team carries and starts/stops the countdown. True when it changed.
    recount(sim) {
      const ms = sim.ms;
      let a = 0, c = 0;
      for (const b of sim.brawlers) {
        if (!b.alive) continue;
        if (b.team === 0) a += b.carry; else c += b.carry;
      }
      ms.gems[0] = a;
      ms.gems[1] = c;
      const lead = a >= this.goal && a > c ? 0 : c >= this.goal && c > a ? 1 : -1;
      if (lead === ms.countTeam) return false;
      ms.countTeam = lead;
      ms.count = lead >= 0 ? this.count : 0;
      sim.ev(EV.COUNTDOWN, lead, ms.count);
      return true;
    },

    onKill(sim, v) {
      if (v.carry > 0) sim.dropPickups(PICK.GEM, v.carry, v.x, v.y);
      v.carry = 0;
      // deaths come after the mode's tick: recount now so a carrier who falls on the countdown's
      // last tick doesn't still win it
      this.recount(sim);
    },

    onPickup(sim, b, p) {
      if (p.pick !== PICK.GEM) return false;
      b.carry += p.n;
      b.st.gems += p.n;
      return true;
    },

    checkEnd(sim) {
      const ms = sim.ms;
      if (ms.countTeam >= 0 && ms.count <= 1e-6) return sim.makeResult(ms.countTeam, 'gems', ms.gems.slice());
      if (sim.t >= this.cap) return sim.makeResult(ModeKit.leader(ms.gems), 'time', ms.gems.slice());
      return null;
    },

    hud(sim) {
      const ms = sim.ms;
      // no visible clock in Gem Rush: time is the elapsed time
      return { mode: 'gem', time: sim.t, gems: [ms.gems[0], ms.gems[1]], count: ms.countTeam >= 0 ? Math.max(0, Math.ceil(ms.count - 1e-6)) : 0, countTeam: ms.countTeam };
    },
  }),

  // Test deathmatch (headless tests only): 2 minutes, respawns, most kills wins. Works for any number
  // of teams (team = slot gives a free-for-all on one-list maps).
  test: ModeKit.make('test', {
    len: 120,
    init(sim) { sim.ms = { kills: new Array(sim.nTeams).fill(0) }; },
    onKill(sim, v, k) { if (k) sim.ms.kills[k.team]++; },
    checkEnd(sim) {
      if (sim.t < this.len) return null;
      return sim.makeResult(ModeKit.leader(sim.ms.kills), 'time', sim.ms.kills.slice(0, 2));
    },
    hud(sim) {
      const h = { mode: 'test', time: Math.max(0, this.len - sim.t), kills: sim.ms.kills.slice() };
      if (sim.poison) h.poison = sim.poison;
      return h;
    },
  }),
};

// ===== 11-input.js =====
// ---------- Input: twin-stick touch controls, keyboard + mouse and gamepad -> input words ----------
// Landscape layout like the original (CSS pixels of the canvas, mirrored when Input.leftHanded):
//   move    floating joystick that appears where the left thumb lands (left ~45% of the screen)
//   attack  fixed joystick at the bottom right. Tap = auto-aim (ACT.ATTACK, auto 1). Drag past a small
//           deadzone = manual aim with an indicator, release fires; dragging back into the centre
//           cancels.
//   super   same tap/drag behaviour, left of / above attack; only takes a thumb while me.supReady
//   gadget  small button, fires on press (aimed where you walk, else auto)
//   chat    quick-chat button: a wheel of PINS and EMOTES -> Input.onPin(i) / Input.onEmote(i)
// Keyboard + mouse: WASD / arrows move, the mouse aims (Input.setScreenToWorld gives world points),
// left click attack, right click or Space super, Q / E gadget, F auto-aim attack, T quick chat
// (1-8 pins, Shift+1-5 emotes). Gamepad: left stick move, right stick aim, R1/RT attack (auto-aim
// when the right stick is centred), L1/LT super, A gadget, Y quick chat (stick + A picks, B closes).
//
// API
//   Input.init(canvas)                 listeners (pointer events on the canvas, keys on window)
//   Input.layout(w, h, safe, dpr)      canvas size in CSS px, safe = {l, r, t, b} CSS px, dpr of the
//                                      backing store (Input.draw scales by it)
//   Input.setFlip(flip)                team 1 sees the map turned 180 degrees: screen angles are
//                                      rotated by PI before packing, so words carry world angles
//   Input.setLocal(me, brawlerData)    local brawler entity (null when none) and its BRAWLERS entry
//   Input.setScreenToWorld(fn)         fn(sx, sy) -> {x, y} world tiles, for mouse aiming
//   Input.word()                       the word for this tick (polls the pad; at most one action,
//                                      and an action is sent once)
//   Input.aim                          { act, ang (world), d (share of range) } | null while aiming
//   Input.draw(ctx, me)                joysticks, buttons and the chat wheel; ctx in device pixels
//                                      with any transform (it sets its own: dpr scale)
//   Input.reset()  Input.enabled  Input.leftHanded  Input.pollPad()  Input.onPin  Input.onEmote
//   Input.touchMode (touch controls drawn), Input.size (user scale), Input.opacity
const Input = {
  canvas: null, W: 844, H: 390, dpr: 1, s: 1,
  safe: { l: 0, r: 0, t: 0, b: 0 },
  size: 1, opacity: 1, leftHanded: false, _lh: false,
  flip: false, me: null, data: null, s2w: null,
  _en: false, touchMode: false, device: 'mouse', tick: 0, anim: 0,
  // controls (centres and radii in CSS px, filled by layout)
  btn: {
    atk: { x: 0, y: 0, r: 46, hit: 1.45 },
    sup: { x: 0, y: 0, r: 36, hit: 1.35 },
    gad: { x: 0, y: 0, r: 24, hit: 1.5 },
    chat: { x: 0, y: 0, r: 19, hit: 1.6 },
  },
  home: { x: 120, y: 290 }, // resting place of the move joystick
  R: 58, // joystick radius (move and aim drags)
  ptr: new Map(), // pointerId -> 'move' | 'atk' | 'sup' | 'gad' | 'chat' | 'none'
  mv: { id: null, ox: 0, oy: 0, x: 0, y: 0 },
  st: {
    // aim sticks. st: 0 idle, 1 held in the centre (a tap so far), 2 aiming, 3 cancel
    atk: { id: null, ox: 0, oy: 0, x: 0, y: 0, st: 0, act: 1 },
    sup: { id: null, ox: 0, oy: 0, x: 0, y: 0, st: 0, act: 2 },
  },
  gadDown: false,
  keys: {}, // held movement keys: up / down / left / right
  mouse: { x: 0, y: 0, on: false },
  pad: { on: false, lx: 0, ly: 0, rx: 0, ry: 0, prev: [], held: [], sel: -1 },
  wheel: { open: false, x: 0, y: 0, R: 120, hover: -1, items: [] },
  pending: [], // queued actions {act, auto, ang, d, tick}; word() sends one per tick
  _aim: { act: 0, ang: 0, d: 1 },
  onPin(i) {}, // set by the match
  onEmote(i) {},

  get enabled() { return this._en; },
  set enabled(v) {
    v = !!v;
    if (v !== this._en) this.reset();
    this._en = v;
  },

  init(canvas) {
    this.canvas = canvas;
    try { this.touchMode = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { this.touchMode = false; }
    this.device = this.touchMode ? 'touch' : 'mouse';
    const opt = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.onDown(e), opt);
    canvas.addEventListener('pointermove', (e) => this.onMove(e), opt);
    canvas.addEventListener('pointerup', (e) => this.onUp(e, true), opt);
    canvas.addEventListener('pointercancel', (e) => this.onUp(e, false), opt);
    canvas.addEventListener('lostpointercapture', (e) => this.onUp(e, false), opt);
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') this.mouse.on = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('touchstart', (e) => { if (this._en) e.preventDefault(); }, opt);
    addEventListener('keydown', (e) => this.onKey(e, true));
    addEventListener('keyup', (e) => this.onKey(e, false));
    addEventListener('blur', () => this.reset());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.reset(); });
    if (!this.btn.atk.x) this.layout(this.W, this.H, this.safe, this.dpr);
  },

  // Drops every held control and queued action (pause, blur, death screens, scene changes).
  reset() {
    this.ptr.clear();
    this.mv.id = null;
    for (const k in this.st) { const a = this.st[k]; a.id = null; a.st = 0; }
    this.keys = {};
    this.gadDown = false;
    this.pending.length = 0;
    this.wheel.open = false;
    this.wheel.hover = -1;
    this.pad.sel = -1;
    // a button still held on the pad must be released before it fires again
    for (let i = 0; i < this.pad.held.length; i++) this.pad.prev[i] = this.pad.held[i];
  },

  setFlip(flip) { this.flip = !!flip; },
  setLocal(me, data) {
    this.me = me || null;
    this.data = data || (me && typeof BRAWLERS !== 'undefined' ? BRAWLERS[me.bk] : null) || null;
  },

  // ---------------- actions ----------------

  },

  drawMove(ctx, op) {
    const m = this.mv, R = this.R, s = this.s;
    const on = m.id !== null;
    const ox = on ? m.ox : this.home.x, oy = on ? m.oy : this.home.y;
    ctx.globalAlpha = op * (on ? 0.9 : 0.4);
    circle(ctx, ox, oy, R);
    ctx.fillStyle = 'rgba(12,24,48,0.42)';
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = 'rgba(120,200,255,0.75)';
    ctx.stroke();
    let kx = ox, ky = oy;
    if (on) {
      const dx = m.x - ox, dy = m.y - oy, d = Math.hypot(dx, dy), k = Math.min(d, R * 0.85);
      if (d > 0) { kx = ox + (dx / d) * k; ky = oy + (dy / d) * k; }
      // direction wedge on the rim
      if (d > Math.max(6, R * 0.12)) {
        const a = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.arc(ox, oy, R, a - 0.45, a + 0.45);
        ctx.lineWidth = 5 * s;
        ctx.strokeStyle = 'rgba(160,230,255,0.95)';
        ctx.stroke();
      }
    }
    ctx.globalAlpha = op * (on ? 0.95 : 0.55);
    circle(ctx, kx, ky, R * 0.42);
    ctx.fillStyle = '#5fb6ff';
    ctx.fill();
    ctx.lineWidth = 2.5 * s;
    ctx.strokeStyle = '#e6f6ff';
    ctx.stroke();
    circle(ctx, kx - R * 0.1, ky - R * 0.12, R * 0.16);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();
  },

  // Attack and super: a button at rest, a joystick while held.
  drawAimBtn(ctx, k, me, op) {
    const b = this.btn[k], a = this.st[k], s = this.s, R = this.R;
    const sup = k === 'sup';
    const ready = sup ? !!(me ? me.supReady : false) : true;
    const charge = sup ? (me ? clamp(me.sup || 0, 0, 1) : 0) : 1;
    const held = a.id !== null;
    const col = sup ? '#ffc21a' : '#ff5a3c';
    const pulse = 0.5 + 0.5 * Math.sin(this.anim * 6);
    // super-ready glow
    if (sup && ready) {
      ctx.globalAlpha = op * (0.35 + 0.3 * pulse);
      circle(ctx, b.x, b.y, b.r * (1.3 + 0.08 * pulse));
      ctx.fillStyle = 'rgba(255,214,60,0.55)';
      ctx.fill();
    }
    if (held) {
      // the drag area
      ctx.globalAlpha = op * 0.85;
      circle(ctx, b.x, b.y, R);
      ctx.fillStyle = 'rgba(20,10,10,0.38)';
      ctx.fill();
      ctx.lineWidth = 3 * s;
      ctx.strokeStyle = a.st === 3 ? 'rgba(255,80,80,0.9)' : sup ? 'rgba(255,220,90,0.85)' : 'rgba(255,140,120,0.85)';
      ctx.stroke();
      const dx = a.x - a.ox, dy = a.y - a.oy, d = Math.hypot(dx, dy), m = Math.min(d, R);
      const kx = d > 0 ? b.x + (dx / d) * m : b.x, ky = d > 0 ? b.y + (dy / d) * m : b.y;
      ctx.globalAlpha = op;
      circle(ctx, kx, ky, b.r * 0.62);
      ctx.fillStyle = a.st === 3 ? '#6b2a2a' : col;
      ctx.fill();
      ctx.lineWidth = 2.5 * s;
      ctx.strokeStyle = '#fff6e0';
      ctx.stroke();
      if (a.st === 3) {
        // back in the centre: releasing here cancels
        const c = b.r * 0.24;
        ctx.lineWidth = 4 * s;
        ctx.strokeStyle = '#ff6a6a';
        ctx.beginPath();
        ctx.moveTo(kx - c, ky - c); ctx.lineTo(kx + c, ky + c);
        ctx.moveTo(kx + c, ky - c); ctx.lineTo(kx - c, ky + c);
        ctx.stroke();
        outlineText(ctx, 'CANCEL', b.x, b.y - R - 10 * s, 12 * s, '#ff8a8a');
      } else this.icon(ctx, k, kx, ky, b.r * 0.62, true);
      return;
    }
    // resting button
    ctx.globalAlpha = op * (ready ? 0.95 : 0.7);
    circle(ctx, b.x, b.y, b.r);
    ctx.fillStyle = ready ? (sup ? 'rgba(255,194,26,0.9)' : 'rgba(240,64,48,0.66)') : 'rgba(40,40,48,0.6)';
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = ready ? (sup ? '#fff1a8' : 'rgba(255,220,210,0.9)') : 'rgba(200,200,210,0.5)';
    ctx.stroke();
    if (sup && !ready) {
      // charge ring
      ctx.globalAlpha = op;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 1.5 * s, -Math.PI / 2, -Math.PI / 2 + TAU * charge);
      ctx.lineWidth = 5 * s;
      ctx.strokeStyle = col;
      ctx.stroke();
    }
    ctx.globalAlpha = op * (ready ? 1 : 0.55);
    this.icon(ctx, k, b.x, b.y, b.r, ready);
  },

  drawGadget(ctx, me, op) {
    const b = this.btn.gad, s = this.s;
    const left = me ? me.gadLeft | 0 : 0;
    const cd = me ? me.gadT || 0 : 0;
    const spec = this.spec(ACT.GADGET);
    const cdT = (spec && spec.cd) || 5;
    const ok = !!me && left > 0 && cd <= 0;
    ctx.globalAlpha = op * (ok ? 0.95 : 0.6);
    circle(ctx, b.x, b.y, b.r);
    ctx.fillStyle = ok ? (this.gadDown ? '#9dff8a' : '#3fc43a') : 'rgba(50,56,52,0.75)';
    ctx.fill();
    ctx.lineWidth = 2.5 * s;
    ctx.strokeStyle = ok ? '#d8ffd0' : 'rgba(190,200,190,0.5)';
    ctx.stroke();
    if (cd > 0 && left > 0) {
      ctx.globalAlpha = op * 0.6;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(cd / cdT, 0, 1));
      ctx.closePath();
      ctx.fillStyle = '#000';
      ctx.fill();
    }
    ctx.globalAlpha = op * (ok ? 1 : 0.5);
    this.icon(ctx, 'gad', b.x, b.y, b.r, ok);
    // uses left: small pips under the button
    ctx.globalAlpha = op;
    for (let i = 0; i < 3; i++) {
      const px = b.x + (i - 1) * 8 * s, py = b.y + b.r + 7 * s;
      circle(ctx, px, py, 3 * s);
      ctx.fillStyle = i < left ? '#7dff6a' : 'rgba(30,30,30,0.7)';
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.stroke();
    }
  },

  drawChat(ctx, op) {
    const b = this.btn.chat, s = this.s;
    ctx.globalAlpha = op * (this.wheel.open ? 1 : 0.8);
    circle(ctx, b.x, b.y, b.r);
    ctx.fillStyle = this.wheel.open ? '#ffffff' : 'rgba(20,28,44,0.6)';
    ctx.fill();
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.stroke();
    this.icon(ctx, 'chat', b.x, b.y, b.r, true);
  },

  // Key / button names under the buttons for keyboard and gamepad players.
  drawHints(ctx, op) {
    const pad = this.device === 'pad', s = this.s;
    const lab = pad ? { atk: 'RT', sup: 'LT', gad: 'A', chat: 'Y' } : { atk: 'L-CLICK', sup: 'R-CLICK / SPACE', gad: 'Q', chat: 'T' };
    ctx.globalAlpha = Math.min(1, op + 0.2);
    ctx.font = `800 ${Math.round(9 * s)}px system-ui,sans-serif`;
    for (const k in lab) {
      if (k === 'gad' && !this.hasGadget()) continue;
      const b = this.btn[k];
      const y = k === 'gad' ? b.y - b.r - 7 * s : b.y + b.r + (k === 'chat' ? 9 : 11) * s;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(lab[k], b.x, y);
      ctx.fillStyle = '#fff';
      ctx.fillText(lab[k], b.x, y);
    }
  },

  drawWheel(ctx) {
    const wh = this.wheel, s = this.s;
    ctx.globalAlpha = 0.85;
    circle(ctx, wh.x, wh.y, wh.R + 18 * s);
    ctx.fillStyle = 'rgba(8,14,30,0.72)';
    ctx.fill();
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.stroke();
    // close cross in the middle
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 2.5 * s;
    ctx.strokeStyle = '#fff';
    const c = 6 * s;
    ctx.beginPath();
    ctx.moveTo(wh.x - c, wh.y - c); ctx.lineTo(wh.x + c, wh.y + c);
    ctx.moveTo(wh.x + c, wh.y - c); ctx.lineTo(wh.x - c, wh.y + c);
    ctx.stroke();
    ctx.font = `800 ${Math.round(12 * s)}px system-ui,sans-serif`;
    for (let i = 0; i < wh.items.length; i++) {
      const it = wh.items[i], hot = wh.hover === i;
      ctx.globalAlpha = 1;
      if (it.kind === 'pin') {
        const txt = PINS[it.i];
        it.w = ctx.measureText(txt).width + 18 * s;
        const w = Math.max(it.w, 60 * s), h = it.h;
        roundRect(ctx, it.x - w / 2, it.y - h / 2, w, h, h / 2);
        ctx.fillStyle = hot ? '#ffe46b' : '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2 * s;
        ctx.strokeStyle = hot ? '#b07a00' : 'rgba(0,0,0,0.5)';
        ctx.stroke();
        ctx.fillStyle = '#1b2236';
        ctx.fillText(txt, it.x, it.y + 0.5);
        if (this.device === 'mouse') {
          ctx.font = `800 ${Math.round(8 * s)}px system-ui,sans-serif`;
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillText(String(it.i + 1), it.x - w / 2 - 7 * s, it.y);
          ctx.font = `800 ${Math.round(12 * s)}px system-ui,sans-serif`;
        }
      } else {
        const r = (hot ? 19 : 16) * s;
        this.emoteIcon(ctx, EMOTES[it.i], it.x, it.y, r);
        if (hot) {
          circle(ctx, it.x, it.y, r + 2 * s);
          ctx.lineWidth = 2.5 * s;
          ctx.strokeStyle = '#ffe46b';
          ctx.stroke();
        }
      }
    }
  },

  // Small face icons for the emote ring (drawn, not text, so they read at a glance).
  emoteIcon(ctx, key, x, y, r) {
    const face = { gg: '#ffd23f', happy: '#ffd23f', angry: '#ff6a4a', sad: '#7fb8ff', thumbs: '#ffd23f' }[key] || '#ffd23f';
    circle(ctx, x, y, r);
    ctx.fillStyle = face;
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.12);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.stroke();
    ctx.fillStyle = '#2a1a10';
    ctx.strokeStyle = '#2a1a10';
    const ex = r * 0.33, ey = -r * 0.18, er = r * 0.11;
    if (key === 'gg') {
      ctx.font = `900 ${Math.round(r * 0.95)}px system-ui,sans-serif`;
      ctx.fillText('GG', x, y + r * 0.05);
      return;
    }
    if (key === 'thumbs') {
      // a fist with the thumb up
      ctx.fillStyle = '#fff3d6';
      roundRect(ctx, x - r * 0.42, y - r * 0.05, r * 0.7, r * 0.55, r * 0.15);
      ctx.fill();
      ctx.stroke();
      roundRect(ctx, x - r * 0.3, y - r * 0.62, r * 0.24, r * 0.62, r * 0.12);
      ctx.fill();
      ctx.stroke();
      return;
    }
    circle(ctx, x - ex, y + ey, er); ctx.fill();
    circle(ctx, x + ex, y + ey, er); ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.1);
    ctx.beginPath();
    if (key === 'happy') ctx.arc(x, y + r * 0.08, r * 0.42, 0.2, Math.PI - 0.2);
    else ctx.arc(x, y + r * 0.62, r * 0.36, Math.PI + 0.35, -0.35);
    ctx.stroke();
    if (key === 'angry') {
      ctx.beginPath();
      ctx.moveTo(x - ex - r * 0.2, y + ey - r * 0.28); ctx.lineTo(x - ex + r * 0.16, y + ey - r * 0.12);
      ctx.moveTo(x + ex + r * 0.2, y + ey - r * 0.28); ctx.lineTo(x + ex - r * 0.16, y + ey - r * 0.12);
      ctx.stroke();
    } else if (key === 'sad') {
      ctx.fillStyle = '#e8f6ff';
      ellipse(ctx, x + ex, y + ey + r * 0.3, r * 0.08, r * 0.14);
      ctx.fill();
    }
  },

  // Button pictograms: crosshair (attack), skull (super), bolt (gadget), speech bubble (chat).
  icon(ctx, k, x, y, r, lit) {
    const lw = Math.max(1.5, r * 0.11);
    ctx.lineWidth = lw;
    if (k === 'atk') {
      ctx.strokeStyle = '#fff';
      circle(ctx, x, y, r * 0.36);
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        ctx.moveTo(x + Math.cos(a) * r * 0.2, y + Math.sin(a) * r * 0.2);
        ctx.lineTo(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55);
      }
      ctx.stroke();
    } else if (k === 'sup') {
      const c = lit ? '#3a2400' : '#d8d8d8';
      ctx.fillStyle = c;
      ellipse(ctx, x, y - r * 0.08, r * 0.42, r * 0.38);
      ctx.fill();
      roundRect(ctx, x - r * 0.24, y + r * 0.12, r * 0.48, r * 0.3, r * 0.08);
      ctx.fill();
      ctx.fillStyle = lit ? '#ffc21a' : 'rgba(40,40,48,0.9)';
      circle(ctx, x - r * 0.16, y - r * 0.08, r * 0.11); ctx.fill();
      circle(ctx, x + r * 0.16, y - r * 0.08, r * 0.11); ctx.fill();
      ctx.fillRect(x - r * 0.03, y + r * 0.2, r * 0.06, r * 0.2);
    } else if (k === 'gad') {
      ctx.fillStyle = lit ? '#ffffff' : '#c8c8c8';
      ctx.beginPath();
      ctx.moveTo(x + r * 0.12, y - r * 0.6);
      ctx.lineTo(x - r * 0.32, y + r * 0.08);
      ctx.lineTo(x - r * 0.02, y + r * 0.08);
      ctx.lineTo(x - r * 0.14, y + r * 0.6);
      ctx.lineTo(x + r * 0.34, y - r * 0.12);
      ctx.lineTo(x + r * 0.04, y - r * 0.12);
      ctx.closePath();
      ctx.fill();
    } else if (k === 'chat') {
      const open = this.wheel.open;
      ctx.fillStyle = open ? '#1b2236' : '#ffffff';
      roundRect(ctx, x - r * 0.55, y - r * 0.42, r * 1.1, r * 0.72, r * 0.25);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.25, y + r * 0.25);
      ctx.lineTo(x - r * 0.38, y + r * 0.55);
      ctx.lineTo(x + r * 0.02, y + r * 0.27);
      ctx.fill();
      ctx.fillStyle = open ? '#ffffff' : '#1b2236';
      for (let i = -1; i <= 1; i++) { circle(ctx, x + i * r * 0.27, y - r * 0.06, r * 0.08); ctx.fill(); }
    }
  },
};

// ===== 14-match.js =====
// ---------- Match: runs one battle offline (or as the online host) ----------
// Every slot has a controller that produces its input word each tick: the local player (Input), a
// bot (class Bot: perception -> mind -> motor) or a remote friend (words from the network). The sim
// runs at SIM_HZ with a fixed-step accumulator; the view interpolates between ticks.
//   const m = new Match(cfg, { net: 'offline' | 'host', link }); m.update(dt); m.draw(ctx, opts);
//   m.onEnd(result) is called once, a moment after the sim ends.

// The local player's words come from the touch / keyboard / pad layer.
class LocalCtrl {
  constructor(slot) { this.slot = slot; }
  word() { return Input.word(); }
}

// A remote player's words, queued by the network layer (redundant packets: only new seqs count).
// Actions are never dropped; when the queue runs dry the last movement repeats without an action.
class RemoteCtrl {
  constructor(slot) { this.slot = slot; this.q = []; this.last = 0; this.seq = -1; this.lastRecv = 0; this.bot = null; }
  push(seq, words) {
    // words[i] has sequence seq - (words.length - 1 - i)
    for (let i = 0; i < words.length; i++) {
      const s = seq - (words.length - 1 - i);
      if (s <= this.seq) continue;
      this.seq = s;
      this.q.push(words[i] >>> 0);
    }
    // a long backlog: drop movement-only words but keep every action
    while (this.q.length > 4) {
      const i = this.q.findIndex((w) => !inAct(w));
      if (i < 0) break;
      this.q.splice(i, 1);
    }
  }
  word(sim) {
    if (this.bot) return this.bot.tick(sim); // the friend dropped out: an AI holds the brawler
    if (this.q.length) { const w = this.q.shift(); this.last = noAct(w); return w; }
    return this.last;
  }
}

// Used only if the bot modules are missing (keeps the match playable).
class IdleCtrl { word() { return IN_IDLE; } }

class Match {
  constructor(cfg, opts) {
    opts = opts || {};
    this.cfg = cfg;
    this.net = opts.net || 'offline';
    this.link = opts.link || null;
    this.local = cfg.localSlot || 0;
    this.sim = new Sim({ mode: cfg.mode, map: cfg.map, seed: cfg.seed, slots: cfg.slots.map((s) => ({ team: s.team, bk: s.bk, lvl: s.lvl, gadget: s.gadget, star: s.star, name: s.name })) });
    this.sim.pins = []; // recent quick-chat pins { slot, id, t } (bots read their team's)
    this.state = this.sim;
    this.ctrls = cfg.slots.map((s, i) => this.makeCtrl(s, i));
    this.acc = 0;
    this.speed = 1;
    this.paused = false;
    this.ended = false;
    this.endT = 0;
    this.onEnd = null;
    this.onTick = null; // host: called after every tick (snapshots)
    this.events = []; // this tick's events (host forwards them)
    this.telemetry = typeof Telemetry !== 'undefined' ? new Telemetry(this.sim, this.local) : null;
    const me = this.sim.brawlers[this.local];
    this.flip = me.team === 1 && cfg.mode !== MODE.SHOWDOWN;
    Input.reset();
    Input.setFlip(this.flip);
    Input.enabled = true;
    Input.onPin = (i) => this.pin(this.local, i);
    Input.onEmote = (i) => this.emote(this.local, i);
    View.reset(this.local);
    View.aim = Match.NO_AIM;
  }

  makeCtrl(s, i) {
    if (s.ctrl === 'local' && i === this.local) return new LocalCtrl(i);
    if (s.ctrl === 'remote') return new RemoteCtrl(i);
    if (typeof Bot !== 'undefined') return new Bot(i, s.profile || (typeof Meta !== 'undefined' ? Meta.botProfile(new RNG(this.cfg.seed + i), s.tro || 0, this.cfg.mode) : { skill: 0.5, traits: {} }), (this.cfg.seed ^ (i * 0x9e3779b1)) >>> 0);
    return new IdleCtrl();
  }

  pin(slot, id) {
    const sim = this.sim;
    sim.pins.push({ slot, id, t: sim.t });
    sim.ev(EV.PIN, slot, id);
  }
  emote(slot, id) { this.sim.ev(EV.EMOTE, slot, id); }

  // Hands a remote slot to an AI while its player is away, and back when they return.
  setAway(slot, away) {
    const c = this.ctrls[slot];
    if (!(c instanceof RemoteCtrl)) return;
    if (away && !c.bot && typeof Bot !== 'undefined') c.bot = new Bot(slot, { name: 'AI', skill: 0.55, traits: { aggr: 0.5, patience: 0.5, greed: 0.5, teamwork: 0.8, tilt: 0.2 }, fav: [] }, (this.cfg.seed ^ 0xabc) >>> 0);
    if (!away) c.bot = null;
  }

  step() {
    const sim = this.sim;
    const me = sim.brawlers[this.local];
    Input.setLocal(me.alive ? me : null, typeof BRAWLERS !== 'undefined' ? BRAWLERS[me.bk] : null);
    for (let i = 0; i < this.ctrls.length; i++) {
      const c = this.ctrls[i];
      const w = c.tick ? c.tick(sim) : c.word(sim);
      sim.setInput(i, w);
      if (c.outPin != null) { this.pin(i, c.outPin); c.outPin = null; }
      if (c.outEmote != null) { this.emote(i, c.outEmote); c.outEmote = null; }
    }
    sim.step();
    if (sim.pins.length && sim.t - sim.pins[0].t > 4) sim.pins.shift();
    const evs = sim.events;
    this.events = evs.slice();
    for (const ev of evs) this.onEvent(ev);
    evs.length = 0;
    if (this.telemetry) this.telemetry.tick();
    if (this.onTick) this.onTick(this);
  }

  onEvent(ev) {
    const sim = this.sim;
    View.onEvent(ev, sim);
    if (typeof Sound !== 'undefined') Sound.onEvent(ev, sim, this.local);
    if (ev[0] === EV.HIT && ev[1] === sim.brawlers[this.local].id && typeof Game !== 'undefined') Game.vibrate(18);
    else if (ev[0] === EV.KILL && ev[1] === this.local && typeof Game !== 'undefined') Game.vibrate(70);
  }

  update(dt) {
    if (this.paused) return;
    const sim = this.sim;
    if (this.ended) { this.endT += dt; return; }
    this.acc += dt * this.speed;
    let n = 0;
    const maxSteps = 5 * this.speed;
    while (this.acc >= SIM_DT && n < maxSteps && !sim.over) { this.step(); this.acc -= SIM_DT; n++; }
    if (this.acc > SIM_DT * 3) this.acc = SIM_DT; // a long hitch: drop the backlog instead of fast-forwarding
    const me = sim.brawlers[this.local];
    if (typeof Sound !== 'undefined') {
      Sound.ear(me.x, me.y, this.flip);
      Sound.onHud(sim.hud(), me.team);
    }
    if (typeof Music !== 'undefined') Music.intensity = this.intensity();
    if (sim.over && !this.ended) {
      this.ended = true;
      this.endT = 0;
      Input.enabled = false;
      setTimeout(() => { if (this.onEnd) this.onEnd(sim.result); }, 1800);
    }
  }

  // Music gets busier when it matters: a gem countdown, overtime, a close end, few players left.
  intensity() {
    const h = this.sim.hud();
    if (!h) return 0.5;
    if (h.mode === 'gem') return h.count > 0 ? 1 : 0.55;
    if (h.mode === 'sd') return h.alive <= 4 ? 1 : 0.6;
    if (h.mode === 'ball') return h.ot ? 1 : 0.6;
    return h.time != null && h.time < 30 ? 1 : 0.6;
  }

  draw(ctx, opts) {
    const sim = this.sim;
    View.aim = Input.aim || Match.NO_AIM;
    View.draw(ctx, sim, this.local, this.acc / SIM_DT, opts);
    const me = sim.brawlers[this.local];
    if (!this.ended) Input.draw(ctx, me.alive ? me : null);
  }

  quit() {
    this.paused = true;
    Input.enabled = false;
  }
}
Match.NO_AIM = { act: 0, ang: 0, d: 1 };

// ===== 15-art.js =====
// ---------- Art: procedural sprites (brawlers, tiles, shots, pickups, portraits) ----------
// Everything is painted once into cached canvases (by key, frame and pixel size) and stamped with
// drawImage. Painters work in tile units: (0, 0) is a brawler's feet, 1 = one tile, +x faces right,
// front view. The world pass of the view draws in device pixels with an identity transform; Art's
// world helpers (shot, area, pickup, ...) assume that and leave the transform as they found it.
const Art = (() => {
  const OL = '#1d1530'; // outline colour
  const LW = 0.05; // outline width (tile units)
  const SKIN = '#ffd3ae';
  const TAN = '#eeaa78';
  const PALE = '#e4def4';
  const TEAMC = ['#3d9bff', '#ff4a4a', '#ffd23f']; // own / enemy / neutral
  const STEP = [1, 0, -1, 0, 0, 0]; // walk frames 0-3, idle 4-5
  const BOB = [0, -0.04, 0, -0.04, 0, -0.02];
  const F = { WALK: 1, FLASH: 2, COLD: 4, ATK: 8 };

  // ---- painting helpers (tile units) ----
  function fs(x, fill, lw) {
    x.fillStyle = fill;
    x.fill();
    if (lw === 0) return;
    x.lineWidth = lw || LW;
    x.strokeStyle = OL;
    x.stroke();
  }
  function el(x, cx, cy, rx, ry, fill, lw) { x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, TAU); fs(x, fill, lw); }
  function elr(x, cx, cy, rx, ry, rot, fill, lw) { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, TAU); fs(x, fill, lw); }
  function rr(x, X, Y, w, h, r, fill, lw) { roundRect(x, X, Y, w, h, r); fs(x, fill, lw); }
  function pg(x, pts, fill, lw) {
    x.beginPath();
    x.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]);
    x.closePath();
    fs(x, fill, lw);
  }
  function ln(x, x1, y1, x2, y2, w, col, ow) {
    x.beginPath();
    x.moveTo(x1, y1);
    x.lineTo(x2, y2);
    x.lineCap = 'round';
    if (ow !== 0) {
      x.lineWidth = w + (ow || LW * 1.6);
      x.strokeStyle = OL;
      x.stroke();
    }
    x.lineWidth = w;
    x.strokeStyle = col;
    x.stroke();
  }
  function dot(x, cx, cy, r, col) { x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fillStyle = col; x.fill(); }
  function gloss(x, cx, cy, rx, ry, a) { x.beginPath(); x.ellipse(cx, cy, rx, ry, -0.5, 0, TAU); x.fillStyle = `rgba(255,255,255,${a || 0.4})`; x.fill(); }
  function stroke(x, w, col) { x.lineWidth = w; x.strokeStyle = col; x.stroke(); }
  function star5(x, cx, cy, r, ri, rot) {
    x.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot - Math.PI / 2 + (i * Math.PI) / 5, rad = i & 1 ? ri : r;
      x.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    x.closePath();
  }

  // ---- chibi body parts ----
  function feet(x, f, col) {
    const s = STEP[f];
    el(x, -0.13 + s * 0.06, -0.06 - Math.max(0, s) * 0.06, 0.12, 0.08, col);
    el(x, 0.13 - s * 0.06, -0.06 - Math.max(0, -s) * 0.06, 0.12, 0.08, col);
  }
  function eyes(x, ex, ey, s, pupil, iris) {
    s = s || 1;
    el(x, ex, ey, 0.064 * s, 0.088 * s, '#fff', 0.03);
    el(x, ex + 0.18 * s, ey, 0.058 * s, 0.084 * s, '#fff', 0.03);
    if (iris) {
      dot(x, ex + 0.016 * s, ey + 0.012 * s, 0.045 * s, iris);
      dot(x, ex + 0.194 * s, ey + 0.012 * s, 0.042 * s, iris);
    }
    dot(x, ex + 0.018 * s, ey + 0.014 * s, 0.032 * s, pupil || OL);
    dot(x, ex + 0.196 * s, ey + 0.014 * s, 0.03 * s, pupil || OL);
    dot(x, ex + 0.002 * s, ey - 0.024 * s, 0.015 * s, '#fff');
    dot(x, ex + 0.18 * s, ey - 0.024 * s, 0.014 * s, '#fff');
  }
  function smile(x, cx, cy, w, open) {
    x.beginPath();
    x.arc(cx, cy - w * 0.6, w, 0.45, Math.PI - 0.45);
    if (open) { x.closePath(); fs(x, '#a8304a', 0.025); } else stroke(x, 0.03, OL);
  }
  function brows(x, ex, ey, ang, col) {
    ln(x, ex - 0.05, ey - 0.1 - ang, ex + 0.05, ey - 0.1 + ang, 0.03, col || OL, 0);
    ln(x, ex + 0.13, ey - 0.1 + ang, ex + 0.23, ey - 0.1 - ang, 0.03, col || OL, 0);
  }
  function blush(x, cx, cy) { dot(x, cx, cy, 0.045, 'rgba(255,100,110,0.45)'); }
  // Hair over the top and back of a head (front view, face on the right) with a fringe of `n` points.
  function hairCap(x, hx, hy, r, col, n, drop) {
    n = n || 4;
    drop = drop == null ? 0.18 : drop;
    x.beginPath();
    x.arc(hx, hy, r * 1.05, Math.PI * 0.6, Math.PI * 1.97);
    const xa = hx + r * 0.98, xb = hx - r * 0.2, yb = hy - r * 0.42;
    for (let i = 0; i <= n; i++) {
      const u = i / n, px = lerp(xa, xb, u), py = yb + Math.sin(u * Math.PI) * -0.02;
      x.lineTo(px, py + (i % 2 ? drop * r : 0));
    }
    x.lineTo(hx - r * 0.28, hy + r * 0.15);
    x.closePath();
    fs(x, col);
    gloss(x, hx - r * 0.25, hy - r * 0.62, r * 0.28, r * 0.12, 0.3);
  }
  function hairBack(x, hx, hy, r, col) {
    el(x, hx, hy, r * 1.05, r * 1.02, col);

  function arm(x, ax, ay, col, hand) {

  GUN.nova = (x) => {

  const sprites = new Map();
  function paintVariant(x, w, h, v) {

  function bodySprite(bk, back, f, T, v) {

    let c = sprites.get(ck);
    if (c) return c;
    const L = lookOf(bk), k = T * L.s;
    const w = Math.ceil(k * 1.9), h = Math.ceil(k * 2.3);

    c.ay = Math.round(h - k * 0.26);

    x.translate(c.ax, c.ay);

    x.lineJoin = 'round';
    x.lineCap = 'round';

  // Draws a brawler (or pet/turret) with its feet at (x, y). scale: pixels per tile in ctx units.

  // view draws team circles), kept for the contract. flags: Art.F bits (WALK, FLASH, COLD, ATK).
  function brawler(ctx, bk, x, y, scale, face, anim, team, flags) {
    flags = flags | 0;
    const T = Math.max(4, Math.round(scale));
    const L = lookOf(bk);
    const ca = Math.cos(face), sa = Math.sin(face);
    const mirror = ca < 0;
    const back = sa < -0.45;
    const t = anim || 0;
    const f = flags & F.WALK ? Math.floor(t * 9) & 3 : 4 + (Math.floor(t * 1.7) & 1);
    const v = flags & F.FLASH ? 1 : flags & F.COLD ? 2 : 0;
    const body = bodySprite(bk, back, f, T, v);
    const hasGun = !!GUN[bk] || !BODY[bk];
    const k = T * L.s;
    const sc = scale / T;
    ctx.save();
    if (sc !== 1) { ctx.translate(x, y); ctx.scale(sc, sc); } else ctx.translate(Math.round(x), Math.round(y));
    if (mirror) ctx.scale(-1, 1);
    const a = mirror ? Math.PI - face : face;
    let gx = 0, gy = 0, g = null;
    if (hasGun) {
      g = gunSprite(bk, T, v);
      gx = L.hand[0] * k;
      gy = (L.hand[1] + BOB[f]) * k;
      if (back) gx = -gx * 0.4;

    if (g && back) drawGun(ctx, g, gx, gy, a, flags & F.ATK ? k * 0.08 : 0);
    ctx.drawImage(body, -body.ax, -body.ay);
    if (g && !back) drawGun(ctx, g, gx, gy, a, flags & F.ATK ? k * 0.08 : 0);
    ctx.restore();

    ctx.translate(gx, gy);
    ctx.rotate(a);
    ctx.drawImage(g, -g.ax - recoil, -g.ay);
    ctx.restore();
  }

  // ---- portraits (menus) ----

    const col = (RARITY[rar] && RARITY[rar].color) || '#9fb4c8';

  // ---- glow, shadows, rings, icons ----

  function glow(col, px) {

    g.addColorStop(0.35, rgba(col, 0.55));
    g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, R * 2, R * 2);
    glows.set(ck, c);
    return c;

  // Team circle under a brawler (side 0 own = blue, 1 enemy = red). sup: super-ready pulse 0..1.

      ctx.lineWidth = Math.max(1.5, T * 0.07);
      ctx.strokeStyle = '#ffd23f';
      ctx.stroke();
      ctx.globalAlpha = 1;

        const col = kind === 'boom' ? '#ff8a1a' : kind === 'pulse' ? '#9ae8ff' : kind === 'speed' ? '#7affb0' : kind === 'smoke' ? '#9a8ab8' : kind === 'drain' ? '#ff3a6a' : kind === 'shield' ? '#7ab8ff' : '#ffb06a';
        if (kind === 'boom') {
          const gl = glow('#ff8a1a', T);
          ctx.globalAlpha = fade * 0.9;
          ctx.drawImage(gl, x - R * 1.2, y - R * 1.2, R * 2.4, R * 2.4);
        }
        disc(col, 0.25 * (1 - u * 0.5), R);
        ctx.globalAlpha = (1 - u) * 0.9;
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(1.5, T * 0.12 * (1 - u));
        ctx.beginPath();
        ctx.ellipse(x, y, R * (0.3 + 0.7 * easeOut(Math.min(1, u * 2))), R * sy * (0.3 + 0.7 * easeOut(Math.min(1, u * 2))), 0, 0, TAU);
        ctx.stroke();
        rim(tc, Math.max(1, T * 0.04), 0.5);
        break;
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- pickups, deploys, ball, poison cloud ----
  function pickup(ctx, p, x, y, T, t) {
    const name = p.pick === PICK.GEM ? 'gem' : p.pick === PICK.CUBE ? 'cube' : 'star';
    const hop = p.t < 0.45 ? Math.sin((p.t / 0.45) * Math.PI) * 0.7 : 0;
    const bob = Math.sin(t * 3 + p.id) * 0.06 + 0.3 + hop;
    shadow(ctx, x, y, T * 0.28, 0.25);
    const col = name === 'gem' ? '#c86aff' : name === 'cube' ? '#6aff6a' : '#ffd23f';
    const gl = glow(col, T * 0.5);
    ctx.globalAlpha = 0.45 + 0.2 * Math.sin(t * 4 + p.id);
    ctx.drawImage(gl, x - T * 0.55, y - bob * T - T * 0.55, T * 1.1, T * 1.1);
    ctx.globalAlpha = 1;
    const ic = icon(name, T * (name === 'cube' ? 0.7 : 0.62));
    ctx.drawImage(ic, Math.round(x - ic.width / 2), Math.round(y - bob * T - ic.height / 2));
    if (p.n > 1) outlineText(ctx, String(p.n), x + T * 0.3, y - bob * T - T * 0.3, Math.max(9, T * 0.32), '#fff');
  }
  // Deploys: pets and turrets use body sprites; face is a screen angle.
  function deploy(ctx, d, x, y, T, t, face, flags) {
    if (BODY[d.dk]) brawler(ctx, d.dk, x, y, T, face, t, 0, flags);
    else {
      const col = lookOf(String(d.dk).split('.')[0]).col;
      shadow(ctx, x, y, T * 0.35);
      roundRect(ctx, x - T * 0.3, y - T * 0.55, T * 0.6, T * 0.55, T * 0.1);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.lineWidth = Math.max(1, T * 0.05);
      ctx.strokeStyle = OL;
      ctx.stroke();
    }
  }
  function ball(ctx, x, y, z, T, t, roll) {
    shadow(ctx, x, y, T * 0.3 * (1 - Math.min(0.5, z * 0.12)), 0.3);
    const ic = icon('ball', T * 0.66);
    const by = y - (z + 0.3) * T;
    ctx.setTransform(Math.cos(roll), Math.sin(roll), -Math.sin(roll), Math.cos(roll), x, by);
    ctx.drawImage(ic, -ic.width / 2, -ic.height / 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  // A puff of poison gas (cached, CLOUD tiles across), drawn unscaled along the edge of the safe
  // zone: soft toxic lime blobs without outlines, so it never reads as a bush.
  const CLOUD = 2.2;
  function cloud(px) {
    return rawSprite('cloud', rawT || px, (x) => {
      const P = [[0.5, 0.52, 0.42], [0.27, 0.58, 0.3], [0.74, 0.56, 0.3], [0.4, 0.33, 0.28], [0.64, 0.32, 0.26]];
      for (const [cx, cy, r] of P) {
        const g = x.createRadialGradient(cx - r * 0.2, cy - r * 0.25, r * 0.1, cx, cy, r);
        g.addColorStop(0, 'rgba(214,255,140,0.95)');
        g.addColorStop(0.55, 'rgba(120,226,80,0.8)');
        g.addColorStop(1, 'rgba(60,170,70,0)');
        x.fillStyle = g;
        x.beginPath();
        x.arc(cx, cy, r, 0, TAU);
        x.fill();
      }
      for (const [cx, cy, r] of [[0.36, 0.5, 0.05], [0.6, 0.62, 0.04], [0.52, 0.38, 0.035]]) dot(x, cx, cy, r, 'rgba(40,120,40,0.55)');
    }, CLOUD, CLOUD, 0, 0);
  }

  // Clears every cached sprite (call when the zoom changes a lot, e.g. after a resize).
  function clear() {
    sprites.clear();
    rawCache.clear();
    shotCache.clear();
    glows.clear();
  }

  return {
    F, OL, TEAMC, LOOK, ENV, MX, MY, CLOUD,
    brawler, portrait, tileLayer, updateTile, drawRow, drawWaterRow, frame,
    shot, shotStyle, beam, area, pickup, deploy, ball, cloud, ring, shadow, glow, icon, clear,
    color: (bk) => lookOf(bk).col,
    hasLook: (bk) => !!BODY[bk],
  };
})();

// ===== 16-fx.js =====
// ---------- FX: particles, damage numbers, screen shake, banners and per-brawler cues ----------
// Purely cosmetic: fed by sim events (FX.onEvent) and drawn by View. Particles live in world tiles
// with a height z (tiles); View passes the world -> screen mapping when drawing. A fixed pool of
// particle objects is reused, so nothing is allocated per frame.
const FX = (() => {
  const MAXP = 700;
  const pool = [];
  for (let i = 0; i < MAXP; i++) {
    pool.push({ k: '', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, g: 0, t: 0, life: 1, r: 0, r1: 0, col: '#fff', col2: '#fff', str: '', size: 1, rot: 0, vr: 0, x2: 0, y2: 0, ang: 0, w: 0, tgt: -1, n: 0, pts: new Float32Array(20) });
  }
  const live = [];
  const rng = new RNG(0x51eed);
  const R = (a, b) => a + rng.next() * (b - a);
  // events already handled (the match may hand the same event to View.onEvent and FX.onEvent)
  const seen = new Array(64).fill(null);
  let seenI = 0;
  // shot id -> visual key, so a SHOT_END can show the right impact after the shot is gone
  const memo = [];
  for (let i = 0; i < 160; i++) memo.push({ id: -1, pk: '', lob: false, sup: false, slot: -1 });
  let memoI = 0;
  const cues = [];
  for (let i = 0; i < 12; i++) cues.push({ hit: 0, atk: 0, heal: 0, sup: 0, pin: -1, pinT: 0, emote: -1, emoteT: 0, ready: 0 });

  const FXO = {
    low: false,
    local: -1, // local slot (View sets it every frame)
    sd: null, // Showdown colouring (View sets it every frame)
    shake: 0, // tiles
    hurt: 0, // red screen flash (s)
    banner: null,
    feed: [], // kill feed: { kb, kn, ks, vb, vn, vs, t }
    cues,
    count: () => live.length,

    add(k, x, y, z, life) {
      if (live.length >= (this.low ? MAXP * 0.45 : MAXP)) return null;
      const o = pool[live.length];
      if (!o) return null;
      o.k = k; o.x = x; o.y = y; o.z = z || 0; o.t = 0; o.life = life;
      o.vx = 0; o.vy = 0; o.vz = 0; o.g = 0; o.r = 0.1; o.r1 = 0; o.col = '#fff'; o.col2 = '#fff';
      o.str = ''; o.size = 1; o.rot = 0; o.vr = 0; o.w = 0.1; o.tgt = -1; o.n = 0;
      live.push(o);
      return o;
    },

    clear() {
      live.length = 0;
      this.shake = 0;
      this.hurt = 0;
      this.banner = null;
      this.feed.length = 0;
      for (const c of cues) { c.hit = c.atk = c.heal = c.sup = c.pinT = c.emoteT = c.ready = 0; c.pin = c.emote = -1; }
      for (const m of memo) m.id = -1;
      seen.fill(null);
    },

    update(dt) {
      let n = 0;
      for (let i = 0; i < live.length; i++) {
        const o = live[i];
        o.t += dt;
        if (o.t >= o.life) continue;
        o.x += o.vx * dt;
        o.y += o.vy * dt;
        if (o.g || o.vz) {
          o.z += o.vz * dt;
          o.vz -= o.g * dt;
          if (o.z < 0 && o.k === 'debris') { o.z = 0; o.vz = -o.vz * 0.35; o.vx *= 0.6; o.vy *= 0.6; o.vr *= 0.6; }
        }
        if (o.k === 'spark') { const f = 1 - Math.min(1, 4 * dt); o.vx *= f; o.vy *= f; }
        o.rot += o.vr * dt;
        // keep the pool packed: live[0..n) are the active particles
        if (i !== n) { const tmp = live[n]; live[n] = o; live[i] = tmp; pool[n] = o; pool[i] = tmp; }
        n++;
      }
      live.length = n;
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * Math.max(0.6, this.shake * 6));
      if (this.hurt > 0) this.hurt -= dt;
      if (this.banner) { this.banner.t += dt; if (this.banner.t >= this.banner.life) this.banner = null; }
      for (const c of cues) {
        if (c.hit > 0) c.hit -= dt;
        if (c.atk > 0) c.atk -= dt;
        if (c.heal > 0) c.heal -= dt;
        if (c.ready > 0) c.ready -= dt;
        if (c.pinT > 0) c.pinT -= dt;
        if (c.emoteT > 0) c.emoteT -= dt;
      }
      for (let i = this.feed.length - 1; i >= 0; i--) { this.feed[i].t += dt; if (this.feed[i].t > 4.5) this.feed.splice(i, 1); }
    },

    // ---- emitters (world tiles) ----
    sparks(x, y, z, n, col, spd) {
      if (this.low) n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        const o = this.add('spark', x, y, z, R(0.18, 0.4));
        if (!o) return;
        const a = R(0, TAU), s = R(0.4, 1) * (spd || 4);
        o.vx = Math.cos(a) * s; o.vy = Math.sin(a) * s * 0.75; o.vz = R(1, 4); o.g = 14;
        o.col = col; o.r = R(0.03, 0.06);
      }
    },
    puff(x, y, z, r, col, life, n) {
      n = n || 1;
      if (this.low) n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        const o = this.add('puff', x + (n > 1 ? R(-r, r) * 0.4 : 0), y + (n > 1 ? R(-r, r) * 0.3 : 0), z, (life || 0.45) * R(0.8, 1.2));
        if (!o) return;
        o.r = r * 0.35; o.r1 = r * (n > 1 ? R(0.6, 1) : 1); o.col = col;
        if (n > 1) { const a = R(0, TAU); o.vx = Math.cos(a) * r; o.vy = Math.sin(a) * r * 0.6; o.vz = R(0.2, 0.8); }
      }
    },
    ring(x, y, r, col, life, w) {
      const o = this.add('ring', x, y, 0, life || 0.35);
      if (!o) return;
      o.r = r * 0.2; o.r1 = r; o.col = col; o.w = w || 0.1;
    },
    flash(x, y, z, r, col, life) {
      const o = this.add('flash', x, y, z, life || 0.2);
      if (!o) return;
      o.r = r; o.col = col;
    },
    debris(x, y, n, cols) {
      if (this.low) n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        const o = this.add('debris', x + R(-0.3, 0.3), y + R(-0.3, 0.3), R(0.2, 0.7), R(0.7, 1.2));
        if (!o) return;
        const a = R(0, TAU), s = R(0.5, 3);
        o.vx = Math.cos(a) * s; o.vy = Math.sin(a) * s * 0.7; o.vz = R(2, 6); o.g = 22;
        o.col = cols[i % cols.length]; o.r = R(0.07, 0.15); o.rot = R(0, TAU); o.vr = R(-10, 10);
      }
    },
    stars(x, y, z, n, col, spread) {
      if (this.low) n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        const o = this.add('star', x + R(-1, 1) * (spread || 0.4), y + R(-1, 1) * (spread || 0.4) * 0.6, z + R(0, 0.6), R(0.35, 0.7));
        if (!o) return;
        o.vz = R(0.5, 1.5); o.col = col; o.r = R(0.08, 0.15);
      }
    },
    beam(x, y, x2, y2, z, w, col, life) {
      const o = this.add('beam', x, y, z, life || 0.18);
      if (!o) return;
      o.x2 = x2; o.y2 = y2; o.w = w; o.col = col;
    },
    bolt(x, y, x2, y2, z, col, life) {
      const o = this.add('bolt', x, y, z, life || 0.2);
      if (!o) return;
      o.x2 = x2; o.y2 = y2; o.col = col;
      const nx = -(y2 - y), ny = x2 - x, l = Math.hypot(nx, ny) || 1;
      for (let i = 0; i < 10; i++) {
        const u = i / 9, off = i === 0 || i === 9 ? 0 : R(-1, 1) * Math.min(0.35, l * 0.08);
        o.pts[i * 2] = lerp(x, x2, u) + (nx / l) * off;
        o.pts[i * 2 + 1] = lerp(y, y2, u) + (ny / l) * off;
      }
    },
    arc(x, y, ang, r, spread, col, life) {
      const o = this.add('arc', x, y, 0.4, life || 0.18);
      if (!o) return;
      o.ang = ang; o.r = r; o.w = spread; o.col = col;
    },
    column(x, y, col) {
      const o = this.add('column', x, y, 0, 0.7);
      if (!o) return;
      o.col = col;
    },
    // Damage / heal number above (x, y). Hits on the same target within a moment are summed, like
    // a shotgun's pellets in the original.
    number(x, y, val, col, size, tgt) {
      if (tgt >= 0) {
        for (const o of live) {
          if (o.k === 'text' && o.tgt === tgt && o.col === col && o.t < 0.14) { o.n += val; o.str = String(Math.round(o.n)); o.t = Math.min(o.t, 0.05); return; }
        }
      }
      const o = this.add('text', x + R(-0.15, 0.15), y, 1.35, 0.9);
      if (!o) return;
      o.vz = 1.6; o.g = 1.2; o.n = val; o.str = String(Math.round(val)); o.col = col; o.size = size || 1; o.tgt = tgt;
    },
    label(x, y, str, col, size) {
      const o = this.add('text', x, y, 1.5, 1.0);
      if (!o) return;
      o.vz = 1.2; o.g = 0.8; o.str = str; o.col = col; o.size = size || 0.9; o.tgt = -1;
    },
    explode(x, y, r, col, near) {
      this.flash(x, y, 0.3, r * 1.6, '#fff3c0', 0.18);
      this.flash(x, y, 0.3, r * 2.2, col || '#ff8a1a', 0.35);
      this.ring(x, y, r, col || '#ffb040', 0.32, 0.14);
      this.puff(x, y, 0.3, r * 0.8, 'rgba(90,80,80,0.55)', 0.7, 5);
      this.sparks(x, y, 0.4, 12, '#ffd23f', 6);
      if (near < 5) this.shake = Math.max(this.shake, 0.18 * (1 - near / 5) * Math.min(1.6, r));
    },
    say(text, sub, col, life) {
      this.banner = { text, sub: sub || '', col: col || '#fff', t: 0, life: life || 2 };
    },

    // ---- sim events ----
    onEvent(ev, state) {
      for (let i = 0; i < 64; i++) if (seen[i] === ev) return;
      seen[seenI] = ev;
      seenI = (seenI + 1) & 63;
      const bs = state.brawlers || [];
      const me = bs[this.local];
      const myTeam = me ? me.team : 0;
      const sd = isSd(state);
      const side = (b) => (b && b.team === myTeam && (!sd || b.slot === this.local) ? 0 : 1);
      const near = (x, y) => (me && me.alive ? Math.hypot(me.x - x, me.y - y) : 99);
      const seenBy = (b) => !b || b.team === myTeam || b.vis === undefined || ((b.vis >> myTeam) & 1);
      switch (ev[0]) {
        case EV.FIRE: {
          const b = bs[ev[1]];
          if (!b) break;
          const c = cues[ev[1]];
          if (c) c.atk = 0.16;
          if (!seenBy(b)) break;
          const act = ev[2], ang = ev[5], col = Art.color(b.bk), x = ev[3], y = ev[4];
          const mx = x + Math.cos(ang) * 0.6, my = y + Math.sin(ang) * 0.6;
          const s = specOf(b, act), prim = s ? s.t : 'shot';
          if (prim === 'shot' || prim === 'beam' || prim === 'lob') {
            this.flash(mx, my, 0.45, act === 2 ? 0.75 : 0.45, act === 2 ? '#ffd23f' : '#fff3b0', 0.1);
            if (prim !== 'lob' && !this.low) this.sparks(mx, my, 0.45, 2, '#fff3b0', 2.5);
          } else if (prim === 'arc') this.arc(x, y, ang, (s.range || 2) * 0.8, (s.half || 0.6) * 2, col, 0.16);
          else if (prim === 'pulse') {
            // gadget pulses: a ring the size of the effect, coloured by what it does
            const pc = s.heal ? '#5dff7a' : s.stun ? '#ffe14a' : s.slow ? '#bff4ff' : s.kb ? '#ffffff' : col;
            this.ring(x, y, s.r || 2, pc, 0.4, 0.16);
            this.ring(x, y, (s.r || 2) * 0.6, pc, 0.3, 0.1);
            this.flash(x, y, 0.4, (s.r || 2) * 0.8, pc, 0.25);
            this.stars(x, y, 0.3, 8, pc, (s.r || 2) * 0.6);
            if (s.stun || s.kb) this.sparks(x, y, 0.4, 10, pc, 6);
          } else if (prim === 'dash' || prim === 'leap') {
            this.puff(x, y, 0.1, 0.7, 'rgba(240,230,210,0.75)', 0.4, 5);
            if (prim === 'leap') this.ring(x, y, 1.0, '#ffffff', 0.3, 0.08);
          } else if (prim === 'heal') {
            this.stars(x, y, 0.5, 10, '#5dff7a', 0.5);
            this.ring(x, y, 0.9, '#5dff7a', 0.4, 0.1);
          } else if (prim === 'buff' && s.what === 'ammo') {
            this.stars(x, y, 0.8, 8, '#ffb02e', 0.4);
            if (ev[1] === this.local) this.label(x, y, 'Reload!', '#ffb02e', 0.85);
          } else if (prim === 'buff' && (s.what === 'nextStun' || s.what === 'nextSlow' || s.what === 'petStun' || s.what === 'deployRate')) {
            this.stars(x, y, 0.8, 8, '#ffe14a', 0.4);
            this.ring(x, y, 0.8, '#ffe14a', 0.3, 0.08);
          }
          if (act === 2) this.ring(x, y, 1.2, '#ffd23f', 0.3, 0.08);
          break;
        }
        case EV.SPAWN: {
          if (ev[2] === K.SHOT) {
            const s = findId(state.shots, ev[1]);
            if (s) { const m = memo[memoI]; memoI = (memoI + 1) % memo.length; m.id = s.id; m.pk = s.pk; m.lob = !!s.lob; m.sup = !!s.sup; m.slot = s.owner; }
            // beams are drawn by the view from the beam shot; light up where they end
            if (s && s.beam > 0) {
              const st = Art.shotStyle(s.pk, s.sup);
              this.flash(s.x, s.y, 0.45, 0.7, st[2], 0.22);
              this.sparks(s.x, s.y, 0.45, 4, st[1], 4);
            }
          } else if (ev[2] === K.DEPLOY) {
            const d = findId(state.deploys, ev[1]);
            if (d) { this.puff(d.x, d.y, 0.2, 0.6, 'rgba(255,255,255,0.8)', 0.4, 4); this.ring(d.x, d.y, 0.9, '#ffffff', 0.3, 0.06); }
          } else if (ev[2] === K.AREA) {
            const a = findId(state.areas, ev[1]);
            if (a) this.ring(a.x, a.y, a.r, '#ffffff', 0.3, 0.06);
          }
          break;
        }
        case EV.SHOT_END: {
          let m = null;
          for (const q of memo) if (q.id === ev[1]) { m = q; break; }
          const x = ev[2], y = ev[3];
          const st = m ? Art.shotStyle(m.pk, m.sup) : null;
          const kind = st ? st[0] : '';
          if (kind === 'bomb' || kind === 'barrel' || kind === 'grenade') this.explode(x, y, kind === 'barrel' ? 1.5 : 0.9, '#ff8a1a', near(x, y));
          else if (kind === 'bottle') { this.puff(x, y, 0.1, 0.8, st[2], 0.4, 3); this.sparks(x, y, 0.2, 8, '#bfffd0', 4); this.debris(x, y, 4, ['#c8ffd8', st[1]]); }
          else if (kind === 'spikebag' || kind === 'cactus') { this.sparks(x, y, 0.3, 8, '#cfffb0', 5); this.puff(x, y, 0.2, 0.5, 'rgba(220,200,150,0.6)', 0.35); }
          else if (kind === 'storm') { this.ring(x, y, 2, '#9ae8ff', 0.4, 0.1); this.flash(x, y, 0.3, 1.5, '#3ad8ff', 0.3); }
          else if (kind === 'crate' || kind === 'pawball') this.puff(x, y, 0.1, 0.7, 'rgba(255,255,255,0.7)', 0.4, 4);
          else if (ev[4]) { this.puff(x, y, 0.4, 0.3, 'rgba(255,240,220,0.8)', 0.25); this.sparks(x, y, 0.4, 3, st ? st[2] : '#ffd23f', 3); }
          if (m) m.id = -1;
          break;
        }
        case EV.HIT: {
          const id = ev[1], dmg = ev[2], x = ev[3], y = ev[4], src = ev[5], crit = ev[6];
          let tb = null;
          for (const b of bs) if (b && b.id === id) { tb = b; break; }
          const sb = bs[src];
          this.sparks(x, y, 0.5, 5, sb ? Art.color(sb.bk) : '#fff', 3.5);
          this.flash(x, y, 0.5, 0.35, '#ffffff', 0.08);
          if (tb) {
            const c = cues[tb.slot];
