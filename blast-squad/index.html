<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Blast Squad</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a1690'/%3E%3Cpath d='M32 8 L47 22 L41 54 L23 54 L17 22 Z' fill='%23c05cff' stroke='%231a0f2e' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#1a0f2e;--panel:#2b1d5c;--panel2:#3b2a7a;--line:#120a26;--text:#fff;--muted:#b9b0e0;--yellow:#ffd23f;--blue:#3d9bff;--red:#ff4a4a;--green:#5bd16a;--u:min(1vh,2.2vw)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:#14102e;color:var(--text);font-family:"Arial Black","Segoe UI Black","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#game{position:absolute;left:0;top:0;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*3.6)}
.screen{position:absolute;inset:0;display:none}
.screen.show{display:flex}
#safe-probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.o{text-shadow:0 .12em 0 var(--line),.06em .06em 0 var(--line),-.06em .06em 0 var(--line),.06em -.04em 0 var(--line),-.06em -.04em 0 var(--line)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.45em 1.1em;min-height:2.4em;border-radius:.7em;border:.16em solid var(--line);background:linear-gradient(#7c6cff,#4b3bd0);box-shadow:inset 0 .18em 0 rgba(255,255,255,.35),0 .22em 0 var(--line);color:#fff;font-size:1em;letter-spacing:.02em;white-space:nowrap;text-shadow:0 .1em 0 var(--line)}
.btn:active{transform:translateY(.12em);box-shadow:inset 0 .18em 0 rgba(255,255,255,.35),0 .1em 0 var(--line)}
.btn.y{background:linear-gradient(#ffe46a,#ffb21a);color:#3a2300;text-shadow:0 .08em 0 rgba(255,255,255,.4)}
.btn.g{background:linear-gradient(#7be56f,#2fa83d)}
.btn.r{background:linear-gradient(#ff7a7a,#d22a3a)}
.btn.b{background:linear-gradient(#6cc0ff,#2a6fe0)}
.btn.dark{background:linear-gradient(#4a3a8a,#2d2063)}
.btn[disabled]{filter:grayscale(.85) brightness(.75);pointer-events:none}
.ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;background-size:contain;background-repeat:no-repeat;background-position:center}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc21a 55%,#b87a00);box-shadow:0 0 0 .1em var(--line);vertical-align:-.15em}
.gemi{display:inline-block;width:.85em;height:.85em;background:linear-gradient(135deg,#a8ffbf,#21c35c);transform:rotate(45deg);border-radius:.15em;box-shadow:0 0 0 .1em var(--line);vertical-align:-.1em;margin:0 .05em}
.ppi{display:inline-block;width:1em;height:1em;border-radius:.25em;background:radial-gradient(circle at 40% 35%,#f6c4ff,#c05cff 60%,#6a1fb5);box-shadow:0 0 0 .1em var(--line);vertical-align:-.15em}
.cri{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9f6ff,#36c6ff 60%,#1270b8);box-shadow:0 0 0 .1em var(--line);vertical-align:-.15em}
.troi{display:inline-block;width:1em;height:1em;vertical-align:-.15em;background:linear-gradient(#ffe070,#e0a000);clip-path:polygon(10% 0,90% 0,85% 40%,60% 60%,60% 78%,78% 100%,22% 100%,40% 78%,40% 60%,15% 40%)}
.pill{display:inline-flex;align-items:center;gap:.35em;background:rgba(10,4,30,.6);border:.12em solid var(--line);border-radius:2em;padding:.18em .7em .18em .4em;white-space:nowrap}

/* lobby */
#lobby{pointer-events:auto;background:radial-gradient(ellipse at 50% 60%,#5a2dc2 0%,#2a1569 55%,#14102e 100%);overflow:hidden}
#lobby::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 70%,rgba(255,255,255,.035) 0 10deg,transparent 10deg 20deg);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:.6em;padding:calc(env(safe-area-inset-top) + .5em) calc(env(safe-area-inset-right) + .8em) .4em calc(env(safe-area-inset-left) + .8em)}
.prof{display:flex;align-items:center;gap:.5em;background:rgba(10,4,30,.55);border:.14em solid var(--line);border-radius:.7em;padding:.2em .7em .2em .2em}
.prof canvas{width:2.2em;height:2.2em;border-radius:.45em;border:.12em solid var(--line)}
.prof .nm{font-size:.95em}
.prof .tt{font-size:.8em;color:var(--yellow)}
.road-mini{display:flex;flex-direction:column;gap:.15em;min-width:9em;background:rgba(10,4,30,.55);border:.14em solid var(--line);border-radius:.7em;padding:.25em .6em}
.road-mini .bar{height:.5em;background:#120a26;border-radius:.3em;overflow:hidden}
.road-mini .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe070,#ff9f2e)}
.road-mini .lab{font-size:.75em;display:flex;justify-content:space-between;gap:.5em}
.cur{margin-left:auto;display:flex;gap:.4em;font-size:.9em}
.side{position:absolute;left:calc(env(safe-area-inset-left) + .8em);top:4.2em;bottom:.8em;display:flex;flex-direction:column;gap:.45em;justify-content:center}
.side .mb{position:relative;width:4.4em;height:3.5em;border-radius:.7em;border:.15em solid var(--line);background:linear-gradient(#5b4bd0,#3a2a9a);box-shadow:inset 0 .15em 0 rgba(255,255,255,.25),0 .2em 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72em;gap:.1em}
.side .mb b{font-size:1.6em;line-height:1}
.dot::after{content:"!";position:absolute;right:-.35em;top:-.35em;width:1.3em;height:1.3em;border-radius:50%;background:#ff3b3b;border:.12em solid var(--line);color:#fff;font-size:.9em;line-height:1.1em;text-align:center}
.hero{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25em}
.hero canvas{width:13em;height:13em}
.hero .hn{font-size:1.6em;letter-spacing:.03em}
.hero .hi{display:flex;gap:.5em;align-items:center;font-size:.9em}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;padding:.1em .45em;border-radius:.4em;background:linear-gradient(#c45cff,#7a24d0);border:.12em solid var(--line);font-size:.85em}
.right{position:absolute;right:calc(env(safe-area-inset-right) + .9em);bottom:calc(env(safe-area-inset-bottom) + .9em);display:flex;flex-direction:column;align-items:flex-end;gap:.6em}
.evc{width:13.5em;border-radius:.8em;border:.16em solid var(--line);overflow:hidden;box-shadow:0 .22em 0 var(--line);text-align:left}
.evc .eh{padding:.3em .6em;display:flex;justify-content:space-between;align-items:center;font-size:.9em}
.evc .eb{background:rgba(10,4,30,.55);padding:.3em .6em;font-size:.78em;display:flex;justify-content:space-between}
#play{font-size:1.9em;padding:.35em 1.5em;border-radius:.6em}
.mmode{width:1.4em;height:1.4em;display:inline-block;vertical-align:-.3em}

/* panels */
#panel{pointer-events:auto;flex-direction:column;background:linear-gradient(#2a1569,#14102e)}
.ph{display:flex;align-items:center;gap:.7em;padding:calc(env(safe-area-inset-top) + .45em) calc(env(safe-area-inset-right) + .8em) .45em calc(env(safe-area-inset-left) + .8em);background:rgba(10,4,30,.5);border-bottom:.14em solid var(--line)}
.ph .tl{font-size:1.25em}
.ph .cur{font-size:.85em}
.back{width:2.4em;height:2.2em;border-radius:.6em;border:.15em solid var(--line);background:linear-gradient(#ff7a7a,#d22a3a);box-shadow:0 .18em 0 var(--line);font-size:1em}
.pb{flex:1;overflow:auto;padding:.7em calc(env(safe-area-inset-right) + .9em) calc(env(safe-area-inset-bottom) + .9em) calc(env(safe-area-inset-left) + .9em);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr));gap:.55em}
.bc{position:relative;border-radius:.6em;border:.16em solid var(--line);overflow:hidden;box-shadow:0 .2em 0 var(--line);background:#2b1d5c;text-align:center;padding-bottom:.25em}
.bc canvas{width:100%;aspect-ratio:1;display:block}
.bc .bn{font-size:.82em;margin-top:.15em}
.bc .bt{font-size:.7em;color:var(--yellow)}
.bc.lock canvas{filter:grayscale(1) brightness(.45)}
.bc .bl{position:absolute;left:.25em;top:.25em}
.bc.sel{outline:.2em solid var(--yellow)}
.card{background:rgba(43,29,92,.92);border:.16em solid var(--line);border-radius:.8em;padding:.6em .8em;box-shadow:0 .2em 0 var(--line)}
.det{display:flex;gap:1em;align-items:flex-start}
.det .lft{flex:none;width:13em;display:flex;flex-direction:column;align-items:center;gap:.4em}
.det .lft canvas{width:12em;height:12em}
.det .rgt{flex:1;display:flex;flex-direction:column;gap:.5em;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.stat{background:rgba(10,4,30,.5);border-radius:.5em;padding:.3em .4em;text-align:center}
.stat .k{font-size:.65em;color:var(--muted)}
.stat .v{font-size:.95em}
.abil{display:flex;gap:.6em;align-items:flex-start}
.abil .tag{flex:none;min-width:4.6em;text-align:center;font-size:.68em;border-radius:.4em;padding:.25em .3em;border:.12em solid var(--line)}
.abil .tx{font-size:.75em;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:700;color:#e8e2ff}
.abil .tx b{font-family:"Arial Black",system-ui,sans-serif;color:#fff;font-weight:900}
.track{display:flex;gap:.55em;overflow-x:auto;padding:.4em .2em 1em;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.node{flex:none;width:7.2em;border-radius:.7em;border:.16em solid var(--line);background:#2b1d5c;text-align:center;padding:.35em .3em;box-shadow:0 .2em 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:.3em}
.node.done{opacity:.55}
.node.ready{background:linear-gradient(#ffe46a,#ffb21a);color:#3a2300}
.node .nt{font-size:.75em}
.node canvas{width:3.6em;height:3.6em}
.rw{display:flex;flex-direction:column;align-items:center;gap:.1em;font-size:.8em}
.rwb{width:3.4em;height:3.4em;border-radius:.6em;display:flex;align-items:center;justify-content:center;font-size:1.6em;border:.12em solid var(--line);background:rgba(10,4,30,.4)}
.offers{display:flex;gap:.7em;flex-wrap:wrap}
.offer{width:10em;border-radius:.8em;border:.16em solid var(--line);background:linear-gradient(#4b3bd0,#2b1d5c);text-align:center;padding:.5em;display:flex;flex-direction:column;align-items:center;gap:.4em;box-shadow:0 .2em 0 var(--line)}
.offer.bought{filter:grayscale(.8) brightness(.7)}
.quest{display:flex;align-items:center;gap:.8em}
.quest .qb{flex:1}
.qbar{height:.6em;background:#120a26;border-radius:.3em;overflow:hidden;margin-top:.3em}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#7be56f,#2fa83d)}
.rows{display:flex;flex-direction:column;gap:.5em}
.set{display:flex;align-items:center;justify-content:space-between;gap:1em}
.tog{min-width:5em}
input.nm{font:inherit;font-size:.95em;background:#120a26;color:#fff;border:.14em solid var(--line);border-radius:.5em;padding:.3em .6em;width:12em;user-select:text;-webkit-user-select:text}

/* matchmaking / vs / result */
#mm,#vs,#result{pointer-events:auto;flex-direction:column;align-items:center;justify-content:center;gap:.8em;background:radial-gradient(ellipse at 50% 50%,#3b2a9a,#14102e)}
.mmt{font-size:1.5em}
.mms{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;max-width:90vw}
.mmslot{width:6.4em;height:7.6em;border-radius:.7em;border:.16em solid var(--line);background:rgba(10,4,30,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;font-size:.72em;text-align:center;overflow:hidden}
.mmslot canvas{width:4.6em;height:4.6em;border-radius:.5em}
.mmslot.empty{opacity:.4}
.mmslot .pn{max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsrow{display:flex;gap:.6em;justify-content:center}
.vsrow.t0 .mmslot{background:linear-gradient(#3d9bff,#1f4fb0)}
.vsrow.t1 .mmslot{background:linear-gradient(#ff6a6a,#a8182a)}
.vsrow.sd .mmslot{background:linear-gradient(#5bd16a,#2a7a3a)}
.vsx{font-size:3em;color:var(--yellow);transform:rotate(-8deg)}
.res-h{font-size:3.2em;letter-spacing:.04em}
.res-h.win{color:#ffd23f}.res-h.loss{color:#ff6a6a}.res-h.draw{color:#c9c2ff}
.res-rows{display:flex;gap:.8em;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(10,4,30,.6);border:.14em solid var(--line);border-radius:.6em;padding:.3em .7em;font-size:.9em}
.mvp{position:absolute;top:-.6em;left:50%;transform:translateX(-50%);background:var(--yellow);color:#3a2300;font-size:.75em;padding:0 .4em;border-radius:.3em;border:.12em solid var(--line)}
.rel{position:relative}
#pause{pointer-events:auto;align-items:center;justify-content:center;background:rgba(10,4,30,.7)}
#pause .card{display:flex;flex-direction:column;gap:.6em;align-items:stretch;min-width:14em;text-align:center}

/* drop opening */
#drop{pointer-events:auto;align-items:center;justify-content:center;flex-direction:column;gap:.8em;background:rgba(10,4,30,.85)}
.dropb{width:9em;height:9em;border-radius:50%;border:.25em solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.2em;transition:transform .15s,background .25s;box-shadow:0 0 2em rgba(255,255,255,.25)}
.dropb.pop{transform:scale(1.15)}
.dropr{font-size:1.6em}

#modal{pointer-events:auto;align-items:center;justify-content:center;background:rgba(10,4,30,.7)}
#modal .card{max-width:80vw;max-height:84vh;overflow:auto;display:flex;flex-direction:column;gap:.6em;text-align:center}
#pausebtn{position:absolute;right:calc(env(safe-area-inset-right) + .6em);top:calc(env(safe-area-inset-top) + .5em);display:none;pointer-events:auto;width:2.3em;height:2.3em;border-radius:.6em;border:.15em solid var(--line);background:rgba(10,4,30,.55);font-size:1em;z-index:3}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(10,4,30,.92);border:.15em solid var(--line);border-radius:.7em;padding:.5em 1.1em;font-size:.95em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
#toast.show{opacity:1}
#rotate{position:fixed;inset:0;display:none;z-index:50;background:#14102e;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:1em;font-size:5vw;text-align:center;padding:2em}
#rotate .ph{width:8vw;height:14vw;border:1vw solid #fff;border-radius:2vw;animation:rot 2s infinite ease-in-out;background:none}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>

</div>
<div id="rotate"><div class="ph"></div><div>Turn your phone sideways to play Blast Squad</div></div>
<div id="safe-probe"></div>
<script>
(function () {
// ===== 01-util.js =====
'use strict';
// ---------- Core helpers ----------
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = (id) => document.getElementById(id);

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + this.f() * (b - a); }
  int(a, b) { return Math.floor(a + this.f() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.f() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  weighted(entries) {
    let total = 0;
    for (const e of entries) total += e[1];
    let r = this.f() * total;
    for (const e of entries) {
      r -= e[1];
      if (r <= 0) return e[0];
    }
    return entries[entries.length - 1][0];
  }
}

function shade(hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) {
    r *= 1 + amt; g *= 1 + amt; b *= 1 + amt;
  } else {
    r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt;
  }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function rgba(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((ch) => ch + ch).join('');
  const n = parseInt(c, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 100000) return (n / 1000).toFixed(0) + 'k';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

function fmtDuration(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  if (s >= 60) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return s + 's';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function ellipse(ctx, x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU);
}

function circle(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0.01, r), 0, TAU);
}

// Outlined bold text used all over the battle HUD.
function outlineText(ctx, text, x, y, size, fill, align, stroke) {
  ctx.font = `900 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.24;
  ctx.strokeStyle = stroke || 'rgba(0,0,0,0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill || '#fff';
  ctx.fillText(text, x, y);
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// ---------- Angles & vectors (Blast Squad) ----------
const wrapAng = (a) => { a %= TAU; return a < -Math.PI ? a + TAU : a > Math.PI ? a - TAU : a; }; // to [-PI, PI]
const angDiff = (a, b) => wrapAng(b - a); // signed shortest turn from a to b
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const len2 = (x, y) => x * x + y * y;
const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);

// ---- input word: one 30-bit integer per player per tick (human, bot and remote player alike) ----
// bits 0-7 move angle (256 steps) | 8-10 move magnitude 0..7 (0 = stand still) | 11-20 aim angle
// (1024 steps) | 21-26 aim distance 0..63 (share of the attack's range; lobs land there) |
// 27-28 action 0 none, 1 attack, 2 super, 3 gadget | 29 auto-aim (the sim picks the nearest
// enemy the shooter's team can see; aim fields are ignored).
// The action is an edge: it fires once on the tick it arrives. Angles are world angles (atan2).
const ACT = { NONE: 0, ATTACK: 1, SUPER: 2, GADGET: 3 };
const IN_IDLE = 0;

function packIn(mvA, mvM, aimA, aimD, act, auto) {
  const m = Math.round(clamp(mvM, 0, 1) * 7);
  const ma = m ? Math.round(((mvA % TAU) + TAU) % TAU / TAU * 256) & 255 : 0;
  const aa = Math.round(((aimA % TAU) + TAU) % TAU / TAU * 1024) & 1023;
  const ad = Math.round(clamp(aimD, 0, 1) * 63);
  return (ma | (m << 8) | (aa << 11) | (ad << 21) | ((act & 3) << 27) | ((auto ? 1 : 0) << 29)) >>> 0;
}

// Fills `o` with { mvA, mvM, mx, my, aimA, aimD, ax, ay, act, auto } and returns it.
function unpackIn(w, o) {
  o = o || {};
  const m = (w >>> 8) & 7;
  o.mvM = m / 7;
  o.mvA = (w & 255) / 256 * TAU;
  o.mx = m ? Math.cos(o.mvA) * o.mvM : 0;
  o.my = m ? Math.sin(o.mvA) * o.mvM : 0;
  o.aimA = ((w >>> 11) & 1023) / 1024 * TAU;
  o.aimD = ((w >>> 21) & 63) / 63;
  o.ax = Math.cos(o.aimA);
  o.ay = Math.sin(o.aimA);
  o.act = (w >>> 27) & 3;
  o.auto = (w >>> 29) & 1;
  return o;
}

// Rotates both angles by 180 degrees (the second team plays a view turned upside down).
function flipIn(w) {
  const ma = ((w & 255) + 128) & 255;
  const aa = (((w >>> 11) & 1023) + 512) & 1023;
  return ((w & ~255 & ~(1023 << 11)) | ma | (aa << 11)) >>> 0;
}

const inAct = (w) => (w >>> 27) & 3;
const withAct = (w, act, auto) => ((w & ~(3 << 27) & ~(1 << 29)) | ((act & 3) << 27) | ((auto ? 1 : 0) << 29)) >>> 0;
const noAct = (w) => (w & ~(3 << 27) & ~(1 << 29)) >>> 0;

// ===== 03-brawlers.js =====
// ---------- Brawlers ----------
// Pure data. Every attack, super and gadget is a small "primitive" spec that the sim interprets, so a
// new brawler is a table entry, not new code. Numbers are in the original game's units at power 1
// (health, damage, heal, speed 720/770/820) and are scaled by LEVEL_MULT(lvl) in the sim. Ranges and
// radii are in tiles, projectile speeds in tiles/s, times in seconds, angles in radians.
//
// Primitives (`t`):
//   shot   straight projectiles. n (count), spread (total fan angle), burst (s between projectiles;
//          0 = all at once), jit (sideways barrel offset, alternating), spd, r, range, dmg.
//          Modifiers: pierce, bounce {n, r} (jumps to the nearest other enemy), breaks (walls),
//          kb (knockback tiles, along the shot), slow {T, f}, stun (s), ramp [mulNear, mulFar]
//          (damage over the travelled share of range), split {n, dmg, spd, range, r} (bursts on
//          landing/hit/wall), steal (share of damage healed back), heal (heals allies it passes),
//          hself (heal also the shooter), grow (radius gain per tile travelled).
//   lob    thrown over everything, lands after T s (shorter throws land sooner). n, gap (sideways
//          spacing between landing points), spread (fan of landing points), ring (landing points on
//          a circle of that radius), at:'self' (around the thrower, not at the aim point), blast
//          (radius), dmg, kb, stun, slow, breaks, area {r, T, dps, hps, slow} (puddle on landing).
//   beam   instant segment: range, dmg, w (half width), pierce, chain {n, r, mul}. Clips at walls.
//   arc    instant melee swipe: range, half (half angle), dmg, kb.
//   dash   the brawler rushes dist tiles at spd: dmg to everything it passes (w), inv (untouchable).
//   leap   jumps to the aim point (range), T flight time, lands with r/dmg/kb/breaks, heal. away:
//          auto-aim jumps away from the nearest enemy (an escape), not onto it.
//   deploy places a unit at the aim point (range): unit 'turret' (shoots shot spec every rate s at
//          the nearest visible enemy within aggro) or 'pet' (chases enemies within aggro, hits for
//          dmg every rate s at reach, else follows its owner). land {r, dmg} on arrival. One per owner.
//   area   a lasting zone at the aim point (at:'aim', range) or on the user (at:'self').
//   pulse  instant ring around the user: r, dmg, heal (allies + self), kb, stun, slow.
//   heal   heals the user by amt.
//   buff   what: 'shield' (f damage blocked for T), 'speed' (+f for T; r = allies in radius too),
//          'invis' (T), 'ammo' (+v bars), 'nextStun' (next attack stuns v s), 'nextSlow' (next
//          puddle slows by v), 'petStun' (pet's next hit stuns v s), 'deployRate' (unit fires v times
//          faster for T).
// Any primitive may carry `then: [primitive, ...]`, run right after it with the same aim.
// `chg` on a main attack (or its split/area/pet) = share of the super gained per enemy brawler hit.
// Gadgets: 3 uses per match, `cd` s apart; `req: 'deploy'` needs the brawler's unit on the field.
// Star powers: `patch` replaces fields of atk/sup specs; `pass` holds passive effects the sim reads:
//   petHeal (owner heals when the pet hits), atkHeal (heal per attack fired), deployHeal (the unit
//   heals when the main attack hits), ammoOnHit, killHeal, moveReload (+share of reload while
//   moving), invisHeal (per second while invisible), fieldHeal (per second in own lasting zone).

const BRAWLER_KEYS = ['nova', 'dax', 'brick', 'bramble', 'pip', 'melody', 'sizzle', 'gizmo', 'volt', 'hawk', 'frost', 'shade', 'zip', 'specter', 'thorn'];

// The kit a brawler fights with: atk/sup with the chosen star power patched in, the gadget, and
// passive effects. Cached because every Sim builds one per slot.
const brawlerKitCache = {};
function brawlerKit(bk, star, gadget) {
  const key = bk + ':' + star + ':' + gadget;
  if (brawlerKitCache[key]) return brawlerKitCache[key];
  const D = BRAWLERS[bk];
  if (!D) throw new Error('Unknown brawler ' + bk);
  const sp = star >= 0 ? D.stars[star] : null;
  const patch = (sp && sp.patch) || {};
  const kit = {
    bk, D, hp: D.hp, speed: U(D.speed), reload: D.reload,
    atk: Object.assign({}, D.atk, patch.atk || {}),
    sup: Object.assign({}, D.sup, patch.sup || {}),
    gad: gadget >= 0 ? D.gadgets[gadget] : null,
    pass: (sp && sp.pass) || {},
  };
  brawlerKitCache[key] = kit;
  return kit;
}

// Numbers for the brawler info screen, scaled to a power level.
function brawlerStats(bk, lvl) {
  const D = BRAWLERS[bk], m = LEVEL_MULT(lvl || 1), a = D.atk;
  const range = a.range || a.dist || 0;
  return {
    hp: Math.round(D.hp * m),
    dmg: Math.round((a.dmg || (a.area ? a.area.dps : 0)) * m),
    n: a.n || 1,
    range,
    rangeName: range < 4.5 ? 'Short' : range < 8.5 ? 'Normal' : 'Long',
    reload: D.reload,
    reloadName: D.reload < 1.3 ? 'Fast' : D.reload < 1.9 ? 'Normal' : 'Slow',
    speed: D.speed,
    speedName: D.speed >= 820 ? 'Very fast' : D.speed >= 770 ? 'Fast' : 'Normal',
    supDmg: Math.round((D.sup.dmg || D.sup.heal || (D.sup.area ? D.sup.area.dps : 0) || D.sup.dps || (D.sup.shot ? D.sup.shot.dmg : 0) || 0) * m),
  };
}

// ===== 04-maps.js =====
// ---------- Maps ----------
// Maps are ASCII art. 3v3 maps are drawn as their top half (rows 0..mid, the middle row included);
// the bottom half is the top half mirrored upside down, with team markers swapped, so every 3v3 map
// is fair by construction. Showdown maps are drawn in full (`full: true`).
//
// Legend:
//   .  floor              #  wall (breaks under `breaks` supers)     X  stone (never breaks)
//   ~  water (blocks movement, not shots)     =  rope fence (same)    "  bush (hides brawlers)
//   B  power-cube box (Showdown)              J  jump pad (lands at `pads` target)
//   1  team 0 spawn (bottom)   2  team 1 spawn (top)   S  Showdown spawn
//   G  gem mine   O  mode objective (ball start / bounty centre star)
//   Y  team 0 goal mouth (bottom, Blast Ball)   Z  team 1 goal mouth (top)   (both are floor)

const MAP_CHARS = {
  '.': TILE.FLOOR, '#': TILE.WALL, X: TILE.STONE, '~': TILE.WATER, '=': TILE.FENCE, '"': TILE.BUSH,
  B: TILE.BOX, J: TILE.PAD, 1: TILE.FLOOR, 2: TILE.FLOOR, S: TILE.FLOOR, G: TILE.STONE, O: TILE.FLOOR,
  Y: TILE.FLOOR, Z: TILE.FLOOR,
};
const MIRROR_SWAP = { 1: '2', 2: '1', Y: 'Z', Z: 'Y' };

// key -> { name, modes: [...], rows: [...], full?: bool, pads?: [[x, y, tx, ty]] (tile coords) }
const MAPS = {
  crystal_cove: {
    name: 'Crystal Cove', modes: [MODE.GEM],
    rows: [
      '....."""".X."""".....',
      '......""..2..""......',
      '##.......2.2.......##',
      '.....................',
      '...###.........###...',
      '..."""........."""...',
      '.......~~~~~~~.......',
      '..==.............==..',
      '.....""".....""".....',
      '##.................##',
      '......#.......#......',
      '.."""..........."""..',
      '.....................',
      '....###.......###....',
      '...."""......."""....',
      '.........#.#.........',
      '........#.G.#........',
    ],
  },
};

// Parses a map definition into a MapGrid:
// { key, name, modes, w, h, tiles: Uint8Array(w*h), spawns: [[{x,y}...] team 0, [...] team 1] or
//   [[{x,y}...]] for Showdown (one list), mine: {x,y}|null, obj: {x,y}|null,
//   goals: [{team, x0, y0, x1, y1}] (team = the team that DEFENDS it), pads: [{x,y,tx,ty}] }
// All points are tile centres in world units (tiles).
function parseMap(key) {
  const def = MAPS[key];
  if (!def) throw new Error('Unknown map ' + key);
  let rows = def.rows.slice();
  const w = rows[0].length;
  for (const r of rows) if (r.length !== w) throw new Error(`Map ${key}: row width ${r.length} != ${w}: ${r}`);
  if (!def.full) {
    const top = rows.slice(0, rows.length - 1);
    const mirrored = top.slice().reverse().map((r) => r.split('').map((c) => MIRROR_SWAP[c] || c).join(''));
    rows = rows.concat(mirrored);
  }
  const h = rows.length;
  const tiles = new Uint8Array(w * h);
  const spawns = def.full ? [[]] : [[], []];
  const goals = [];
  const goalTiles = { Y: [], Z: [] };
  let mine = null, obj = null;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = rows[y][x];
      if (!(c in MAP_CHARS)) throw new Error(`Map ${key}: unknown char '${c}' at ${x},${y}`);
      tiles[y * w + x] = MAP_CHARS[c];
      const p = { x: x + 0.5, y: y + 0.5 };
      if (c === '1') spawns[0].push(p);
      else if (c === '2') spawns[1].push(p);
      else if (c === 'S') spawns[0].push(p);
      else if (c === 'G') mine = p;
      else if (c === 'O') obj = p;
      else if (c === 'Y' || c === 'Z') goalTiles[c].push([x, y]);
    }
  }
  for (const [c, team] of [['Y', 0], ['Z', 1]]) {
    const t = goalTiles[c];
    if (!t.length) continue;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of t) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + 1); y1 = Math.max(y1, y + 1); }
    goals.push({ team, x0, y0, x1, y1 });
  }
  const pads = (def.pads || []).map(([x, y, tx, ty]) => ({ x: x + 0.5, y: y + 0.5, tx: tx + 0.5, ty: ty + 0.5 }));
  return { key, name: def.name, modes: def.modes, w, h, tiles, spawns, mine, obj, goals, pads };
}

// Copy of a MapGrid with its own tiles (the sim breaks walls, so every match needs its own copy).
function cloneMap(m) {
  return Object.assign({}, m, { tiles: new Uint8Array(m.tiles) });
}

// ===== 05-geo.js =====
// ---------- Geometry on the tile grid ----------
// Pure functions shared by the sim, the guest's movement prediction and the bots. No allocation in
// the hot paths: results go into caller-owned `out` objects.

const tileIdx = (m, tx, ty) => ty * m.w + tx;
// Tile code at tile coords; outside the map counts as STONE (walls you can't leave through).
const tileAtT = (m, tx, ty) => (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h ? TILE.STONE : m.tiles[ty * m.w + tx]);
const tileAt = (m, x, y) => tileAtT(m, Math.floor(x), Math.floor(y));
const flagsAt = (m, x, y) => TILE_FLAGS[tileAt(m, x, y)];
const flagsAtT = (m, tx, ty) => TILE_FLAGS[tileAtT(m, tx, ty)];
const inBushAt = (m, x, y) => (flagsAt(m, x, y) & TF_BUSH) !== 0;

// Pushes a circle out of every blocking tile it overlaps (two passes) and keeps it inside the map.
function pushOut(m, o, r, mask) {
  for (let pass = 0; pass < 2; pass++) {
    const tx0 = Math.floor(o.x - r), tx1 = Math.floor(o.x + r);
    const ty0 = Math.floor(o.y - r), ty1 = Math.floor(o.y + r);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (!(flagsAtT(m, tx, ty) & mask)) continue;
        const nx = clamp(o.x, tx, tx + 1), ny = clamp(o.y, ty, ty + 1);
        const dx = o.x - nx, dy = o.y - ny;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r * r) continue;
        if (d2 > 1e-10) {
          const d = Math.sqrt(d2);
          o.x += (dx / d) * (r - d);
          o.y += (dy / d) * (r - d);
        } else {
          // centre inside the tile: leave along the shallowest side
          const l = o.x - tx, rr = tx + 1 - o.x, t = o.y - ty, b = ty + 1 - o.y;
          const mn = Math.min(l, rr, t, b);
          if (mn === l) o.x = tx - r; else if (mn === rr) o.x = tx + 1 + r; else if (mn === t) o.y = ty - r; else o.y = ty + 1 + r;
        }
      }
    }
  }
  o.x = clamp(o.x, r, m.w - r);
  o.y = clamp(o.y, r, m.h - r);
  return o;
}

// Moves a circle by (dx, dy), sliding along blocking tiles. Steps of at most 0.25 tile, so fast
// dashes can't tunnel through a one-tile wall. Writes the result to out.x/out.y and returns out.
function moveCircle(m, x, y, r, dx, dy, out, mask) {
  mask = mask || TF_MOVE;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.25));
  out.x = x; out.y = y;
  const sx = dx / n, sy = dy / n;
  for (let i = 0; i < n; i++) {
    out.x += sx; out.y += sy;
    pushOut(m, out, r, mask);
  }
  return out;
}

// Walks the segment (x0,y0)->(x1,y1) through the tile grid (DDA). Returns the fraction t in [0, 1]
// where it first enters a tile whose flags match `mask`, or -1 if none. The tile is written to
// out.tx/out.ty when `out` is given. A start inside a matching tile returns 0.
function rayHit(m, x0, y0, x1, y1, mask, out) {
  let tx = Math.floor(x0), ty = Math.floor(y0);
  const tx1 = Math.floor(x1), ty1 = Math.floor(y1);
  if (flagsAtT(m, tx, ty) & mask) { if (out) { out.tx = tx; out.ty = ty; } return 0; }
  const dx = x1 - x0, dy = y1 - y0;
  const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
  const tdx = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tdy = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  let tmx = dx !== 0 ? (dx > 0 ? tx + 1 - x0 : x0 - tx) * tdx : Infinity;
  let tmy = dy !== 0 ? (dy > 0 ? ty + 1 - y0 : y0 - ty) * tdy : Infinity;
  let guard = 0;
  while ((tx !== tx1 || ty !== ty1) && guard++ < 512) {
    let t;
    if (tmx < tmy) { t = tmx; tmx += tdx; tx += stepX; } else { t = tmy; tmy += tdy; ty += stepY; }
    if (t > 1) break;
    if (flagsAtT(m, tx, ty) & mask) { if (out) { out.tx = tx; out.ty = ty; } return t; }
  }
  return -1;
}

// True when a straight shot from a to b would not be stopped by a wall (water and fences don't stop
// shots). Used for auto-aim, bot shooting decisions and beam clipping, never for visibility.
const shotClear = (m, x0, y0, x1, y1) => rayHit(m, x0, y0, x1, y1, TF_SHOT, null) < 0;
// True when a brawler could walk straight from a to b (centre line only).
const walkClear = (m, x0, y0, x1, y1) => rayHit(m, x0, y0, x1, y1, TF_MOVE, null) < 0;

// First t in [0, 1] where the segment (x0,y0)->(x1,y1) touches the circle (cx, cy, r), or -1.
function segCircle(x0, y0, x1, y1, cx, cy, r) {
  const dx = x1 - x0, dy = y1 - y0;
  const fx = x0 - cx, fy = y0 - cy;
  const a = dx * dx + dy * dy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  if (a < 1e-12) return -1;
  const b = 2 * (fx * dx + fy * dy);
  const disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}

// The part of the world a player at (x, y) sees: the same rectangle the view shows on a 16:9 phone.
// `flip` is true for the team whose view is turned upside down (team 1 in 3v3); `sd` centres it
// (Showdown). The camera stops at the map edges (with a one-tile margin). Writes out.x0/y0/x1/y1
// and out.cx/cy (camera centre) and returns out.
function cameraRect(m, x, y, flip, sd, out) {
  out = out || {};
  const ahead = sd ? 0 : (CAM_AHEAD - 0.5) * CAM_H; // camera centre sits this far ahead of the player
  let cx = x, cy = flip ? y + ahead : y - ahead;
  const hw = CAM_W / 2, hh = CAM_H / 2;
  cx = m.w + 2 <= CAM_W ? m.w / 2 : clamp(cx, hw - 1, m.w + 1 - hw);
  cy = m.h + 2 <= CAM_H ? m.h / 2 : clamp(cy, hh - 1, m.h + 1 - hh);
  out.cx = cx; out.cy = cy;
  out.x0 = cx - hw; out.x1 = cx + hw; out.y0 = cy - hh; out.y1 = cy + hh;
  return out;
}
const inRect = (r, x, y, pad) => x >= r.x0 - (pad || 0) && x <= r.x1 + (pad || 0) && y >= r.y0 - (pad || 0) && y <= r.y1 + (pad || 0);

// Safe zone of a closing poison cloud at time t (s). sched: { start, shrink, minHalf } — the cloud
// starts closing at `start`, takes `shrink` seconds, and stops at a square of half-size `minHalf`
// around the map centre. Before `start` the safe zone is the whole map. Writes out.x0/y0/x1/y1.
function poisonRect(m, t, sched, out) {
  out = out || {};
  const k = clamp((t - sched.start) / sched.shrink, 0, 1);
  const cx = m.w / 2, cy = m.h / 2;
  const hx = lerp(m.w / 2 + 0.5, sched.minHalf, k), hy = lerp(m.h / 2 + 0.5, sched.minHalf, k);
  out.x0 = cx - hx; out.x1 = cx + hx; out.y0 = cy - hy; out.y1 = cy + hy;
  out.k = k;
  return out;
}

// ---- flow fields (bot navigation) ----
// Distance in tiles from every tile to the nearest goal, walking in 8 directions without cutting
// corners. Blocked tiles get Infinity. goals: array of {x, y} (world units). Returns Float32Array.
function flowField(m, goals, mask) {
  mask = mask || TF_MOVE;
  const n = m.w * m.h;
  const d = new Float32Array(n).fill(Infinity);
  // binary heap of tile indices keyed by d
  const heap = new Int32Array(n * 8 + 16);
  let hn = 0;
  const push = (i) => {
    let k = hn++;
    heap[k] = i;
    while (k > 0) {
      const p = (k - 1) >> 1;
      if (d[heap[p]] <= d[heap[k]]) break;
      const t = heap[p]; heap[p] = heap[k]; heap[k] = t; k = p;
    }
  };
  const pop = () => {
    const top = heap[0];
    heap[0] = heap[--hn];
    let k = 0;
    for (;;) {
      const l = 2 * k + 1, r = l + 1;
      let s = k;
      if (l < hn && d[heap[l]] < d[heap[s]]) s = l;
      if (r < hn && d[heap[r]] < d[heap[s]]) s = r;
      if (s === k) break;
      const t = heap[s]; heap[s] = heap[k]; heap[k] = t; k = s;
    }
    return top;
  };
  for (const g of goals) {
    const tx = clamp(Math.floor(g.x), 0, m.w - 1), ty = clamp(Math.floor(g.y), 0, m.h - 1);
    const i = ty * m.w + tx;
    if (!(TILE_FLAGS[m.tiles[i]] & mask)) { d[i] = 0; push(i); continue; }
    // goal on a blocked tile (e.g. the gem mine): start from the free tiles around it
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = tx + dx, ny = ty + dy;
        if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) continue;
        const j = ny * m.w + nx;
        if (TILE_FLAGS[m.tiles[j]] & mask) continue;
        const v = dx && dy ? Math.SQRT2 : 1;
        if (v < d[j]) { d[j] = v; push(j); }
      }
    }
  }
  const done = new Uint8Array(n);
  while (hn > 0) {
    const i = pop();
    if (done[i]) continue;
    done[i] = 1;
    const x = i % m.w, y = (i / m.w) | 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) continue;
        const j = ny * m.w + nx;
        if (TILE_FLAGS[m.tiles[j]] & mask) continue;
        if (dx && dy && ((TILE_FLAGS[m.tiles[y * m.w + nx]] & mask) || (TILE_FLAGS[m.tiles[ny * m.w + x]] & mask))) continue;
        const nd = d[i] + (dx && dy ? Math.SQRT2 : 1);
        if (nd < d[j]) { d[j] = nd; if (hn < heap.length) push(j); }
      }
    }
  }
  return d;
}

// Value of a flow field at a world point (Infinity on blocked tiles / outside).
const flowAt = (m, f, x, y) => {
  const tx = Math.floor(x), ty = Math.floor(y);
  return tx < 0 || ty < 0 || tx >= m.w || ty >= m.h ? Infinity : f[ty * m.w + tx];
};

// Direction to walk downhill on a flow field from (x, y): towards the best of the 8 neighbouring
// tile centres (no corner cutting). Writes out.x/out.y (unit vector, 0,0 at a goal or when stuck)
// and out.d (distance left) and returns out.
function flowDir(m, f, x, y, out) {
  const tx = Math.floor(x), ty = Math.floor(y);
  const here = flowAt(m, f, x, y);
  out.d = here;
  out.x = 0; out.y = 0;
  let best = here, bx = 0, by = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = tx + dx, ny = ty + dy;
      if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) continue;
      if (dx && dy && (flagsAtT(m, tx + dx, ty) & TF_MOVE || flagsAtT(m, tx, ty + dy) & TF_MOVE)) continue;
      const v = f[ny * m.w + nx];
      if (v < best) { best = v; bx = nx + 0.5; by = ny + 0.5; }
    }
  }
  if (best < here) {
    const vx = bx - x, vy = by - y, l = Math.hypot(vx, vy) || 1;
    out.x = vx / l; out.y = vy / l;
  } else if (here === Infinity) {
    // standing on a blocked tile (pushed against a wall): step back towards the tile centre
    const vx = tx + 0.5 - x, vy = ty + 0.5 - y, l = Math.hypot(vx, vy) || 1;
    out.x = vx / l; out.y = vy / l;
  }
  return out;
}

// ===== 06-sim.js =====
// ---------- Simulation ----------
// Pure, deterministic game logic (no DOM, no clocks, only sim.rng): used offline, by the online host
// and by every headless test. One step() = one tick of SIM_DT, in the fixed phase order of DESIGN.md.
// Brawler kits are data (03-brawlers.js); the do*() methods below interpret its primitives.
// Telemetry: fxn[slot * 4 + act] counts effects (hits, heals, statuses, buffs, broken walls) and
// dmgBy[slot * 4 + act] damage dealt to enemy brawlers, per action (0 other, 1 attack, 2 super,
// 3 gadget). Box tiles show up in EV.HIT with the id -1 - tileIndex.

class Sim {
  constructor(cfg) {
    this.cfg = cfg;
    this.modeKey = cfg.mode;
    this.mode = MODES[cfg.mode];
    if (!this.mode) throw new Error('Unknown mode ' + cfg.mode);
    this.map = cloneMap(parseMap(cfg.map));
    this.tiles0 = new Uint8Array(this.map.tiles); // for round resets
    this.seed = cfg.seed >>> 0;
    this.rng = new RNG(this.seed);
    this.tick = 0;
    this.t = 0;
    this.roundT0 = 0; // the poison clock starts here (Knockout restarts it every round)
    this.events = [];
    this.over = false;
    this.result = null;
    this.nextId = 1;
    this.shots = [];
    this.areas = [];
    this.pickups = [];
    this.deploys = [];
    this.ball = null;
    this.poison = null; // current safe rect {x0, y0, x1, y1, k} when the mode has poison
    this.poisonStage = 0;
    this.deathOrder = []; // slots in the order they went down (Showdown placement)
    const n = cfg.slots.length;
    this.nTeams = 0;
    for (const s of cfg.slots) this.nTeams = Math.max(this.nTeams, s.team + 1);
    this.inputs = new Uint32Array(n);
    this.fxn = new Uint32Array(n * 4);
    this.dmgBy = new Float64Array(n * 4);
    const m = this.map;
    this.boxHp = new Float32Array(m.w * m.h);
    this.hasBox = false;
    for (let i = 0; i < m.tiles.length; i++) if (m.tiles[i] === TILE.BOX) { this.boxHp[i] = Sim.BOX_HP; this.hasBox = true; }
    // scratch objects, so the step allocates nothing but events and new entities
    this._in = {};
    this._o = { x: 0, y: 0 };
    this._o2 = { x: 0, y: 0 };
    this._ray = { tx: 0, ty: 0 };
    this._tg = { x: 0, y: 0, r: 0 };
    this._xStun = 0;
    this._xSlow = 0;
    this.brawlers = [];
    for (let i = 0; i < n; i++) this.brawlers.push(this.newBrawler(i, cfg.slots[i]));
    this.ms = {};
    this.mode.init(this);
    for (const b of this.brawlers) this.spawn(b, false);
    if (this.mode.poison) this.poison = poisonRect(m, 0, this.mode.poison, {});
    this.updateVision();
  }

  ev(...a) { this.events.push(a); }
  hud() { return this.mode.hud(this); }
  visibleTo(team, e) { return e.kind === K.BRAWLER ? ((e.vis >> team) & 1) === 1 : true; }
  setInput(slot, w) { this.inputs[slot] = w >>> 0; }
  dmgMul(b) { return LEVEL_MULT(b.lvl) * (1 + CUBE_DMG * b.cubes); }
  canAct(b) { return b.alive && b.stunT <= 0 && b.kbT <= 0 && b.dashT <= 0 && b.jumpT <= 0; }
  hittable(b) { return b.alive && b.jumpT <= 0; }

  newBrawler(slot, c) {
    const star = c.star == null ? -1 : c.star, gad = c.gadget == null ? -1 : c.gadget;
    const kit = brawlerKit(c.bk, star, gad);
    const lvl = c.lvl || 1;
    const hp = Math.round(kit.hp * LEVEL_MULT(lvl));
    return {
      id: this.nextId++, kind: K.BRAWLER, team: c.team, x: 0, y: 0, px: 0, py: 0, r: BRAWLER_R, dead: false,
      slot, bk: c.bk, lvl, gadget: kit.gad ? gad : -1, star, name: c.name || kit.D.name,
      hp, maxHp: hp, alive: true, respawnT: 0, face: 0,
      ammo: MAX_AMMO, reload: kit.reload, sup: 0, supReady: false, gadLeft: kit.gad ? 3 : 0, gadT: 0,
      cubes: 0, carry: 0, bounty: 0,
      vis: 0, inBush: false, revealT: 0, quietT: 0, shieldT: 0,
      stunT: 0, slowT: 0, slowF: 0, kbT: 0, kbx: 0, kby: 0, dashT: 0,
      invisT: 0, speedT: 0, speedF: 0,
      mvx: 0, mvy: 0, lastSeq: 0,
      st: { kills: 0, deaths: 0, dmg: 0, heal: 0, gems: 0, goals: 0, stars: 0 },
      // sim-private (the view may read jumpT/jumpTT for the jump arc, aimA/fireT/lastAct for poses)
      kit, pk: [c.bk, c.bk + '.atk', c.bk + '.sup', c.bk + '.gad'], speed: kit.speed,
      shieldF: 0, spawnSh: false, fireT: 9, faceT: 0, atkCd: 0, lastAct: 0, aimA: 0,
      bqN: 0, bqI: 0, bqT: 0, bqS: null, bqA: 0, bqAct: 0, bqMul: 1, bqStun: 0,
      dvx: 0, dvy: 0, dashS: null, dashAct: 0, dashHit: 0, dashHitD: 0, dashMul: 1,
      jumpT: 0, jumpTT: 0, jx0: 0, jy0: 0, jx1: 0, jy1: 0, jumpS: null, jumpAct: 0, jumpMul: 1,
      nxStun: 0, nxSlow: 0, regenAcc: 0, passAcc: 0, poisAcc: 0, killer: -1, dying: false,
    };
  }

  // (Re)places a brawler at the mode's spawn point with full health and ammo. Super charge and
  // gadget uses carry over, as in the original.
  spawn(b, re) {
    const p = this.mode.spawnPoint(this, b);
    b.x = b.px = p.x;
    b.y = b.py = p.y;
    b.alive = true;
    b.respawnT = 0;
    b.hp = b.maxHp;
    b.ammo = MAX_AMMO;
    this.clearStatus(b);
    b.shieldT = SPAWN_SHIELD_T;
    b.shieldF = 1;
    b.spawnSh = true;
    b.quietT = 0;
    b.face = b.y > this.map.h / 2 ? -Math.PI / 2 : Math.PI / 2;
    b.inBush = inBushAt(this.map, b.x, b.y);
    if (re) this.ev(EV.RESPAWN, b.slot, b.x, b.y);
  }

  clearStatus(b) {
    b.stunT = b.slowT = b.slowF = b.kbT = b.kbx = b.kby = b.dashT = 0;
    b.invisT = b.speedT = b.speedF = b.shieldT = b.shieldF = b.revealT = 0;
    b.spawnSh = false;
    b.bqN = 0; b.bqS = null; b.dashS = null; b.jumpT = 0; b.jumpS = null;
    b.mvx = b.mvy = 0; b.nxStun = b.nxSlow = 0; b.atkCd = 0; b.faceT = 0;
    b.poisAcc = 0.5; b.regenAcc = 0; b.passAcc = 0; b.killer = -1; b.dying = false;
  }

  // ================= step =================
  step() {
    if (this.over) return;
    this.tick++;
    this.t = this.tick * SIM_DT;
    const B = this.brawlers;
    for (let i = 0; i < B.length; i++) this.applyInput(B[i]); // 1. inputs: move, then fire
    this.stepDeploys(); // 2
    this.stepShots(); // 3
    this.stepAreas(); // 4
    this.stepPickups(); // 5
    this.mode.tick(this); // 6
    this.stepTimers(); // 7
    if (this.mode.poison) this.stepPoison(); // 8
    this.stepDeaths(); // 9
    this.compact(this.shots); this.compact(this.areas); this.compact(this.pickups); this.compact(this.deploys);
    this.updateVision(); // 10
    const r = this.mode.checkEnd(this); // 11
    if (r) this.end(r);
  }

  compact(arr) {
    let j = 0;
    for (let i = 0; i < arr.length; i++) { const e = arr[i]; if (!e.dead) arr[j++] = e; }
    arr.length = j;
  }

  // ---- 1. inputs ----
  applyInput(b) {
    const w = this.inputs[b.slot];
    this.inputs[b.slot] = noAct(w); // actions are edges: a word left in place doesn't fire again
    b.px = b.x;
    b.py = b.y;
    if (!b.alive) { b.mvx = b.mvy = 0; return; }
    const I = unpackIn(w, this._in);
    const m = this.map, o = this._o, dt = SIM_DT;
    if (b.jumpT > 0) this.stepJump(b);
    else if (b.kbT > 0) {
      const k = Math.min(dt, b.kbT);
      moveCircle(m, b.x, b.y, b.r, b.kbx * k, b.kby * k, o);
      b.x = o.x; b.y = o.y;
      b.kbT = Math.max(0, b.kbT - dt);
    } else if (b.dashT > 0) this.stepDash(b);
    else if (b.stunT <= 0 && I.mvM > 0) {
      let k = b.speed * dt;
      if (b.slowT > 0) k *= 1 - b.slowF;
      if (b.speedT > 0) k *= 1 + b.speedF;
      moveCircle(m, b.x, b.y, b.r, I.mx * k, I.my * k, o);
      b.x = o.x; b.y = o.y;
      if (b.faceT <= 0) b.face = I.mvA;
      if (m.pads.length && (flagsAt(m, b.x, b.y) & TF_PAD)) this.padJump(b);
    }
    if (I.act && this.canAct(b) && !(this.mode.onAction && this.mode.onAction(this, b, I.act, I))) this.tryFire(b, I.act, I);
    if (b.bqN > 0) this.stepBurst(b);
    b.mvx = (b.x - b.px) / dt;
    b.mvy = (b.y - b.py) / dt;
  }

  tryFire(b, act, I) {
    const kit = b.kit;
    let s;
    if (act === ACT.ATTACK) {
      if (b.ammo < 1 || b.atkCd > 0 || b.bqN > 0) return false;
      s = kit.atk;
    } else if (act === ACT.SUPER) {
      if (!b.supReady || b.bqN > 0) return false;
      s = kit.sup;
    } else {
      s = kit.gad;
      if (!s || b.gadLeft <= 0 || b.gadT > 0) return false;
      if (s.req === 'deploy' && !this.deployOf(b.slot)) return false;
    }
    const range = s.range || s.dist || 0;
    let ang, d;
    if (I.auto) {
      const tg = range > 0 ? this.autoTarget(b, range) : null;
      if (tg && s.away) { ang = Math.atan2(b.y - tg.y, b.x - tg.x); d = range; } // escapes jump away
      else if (tg) { ang = Math.atan2(tg.y - b.y, tg.x - b.x); d = Math.min(range, Math.hypot(tg.x - b.x, tg.y - b.y)); }
      else { ang = b.face; d = range; }
    } else {
      ang = I.aimA;
      d = I.aimD * range;
    }
    if (act === ACT.ATTACK) {
      b.ammo -= 1;
      b.atkCd = s.cd || (s.burst ? (s.n - 1) * s.burst + 0.15 : 0.3);
    } else if (act === ACT.SUPER) {
      b.sup = 0;
      b.supReady = false;
    } else {
      b.gadLeft--;
      b.gadT = s.cd || 5;
    }
    if (act !== ACT.GADGET) {
      // attacking breaks cover: reveals, stops regen, ends invisibility and the spawn shield
      b.quietT = 0;
      b.regenAcc = 0;
      b.revealT = REVEAL_T;
      b.invisT = 0;
      if (b.spawnSh) { b.shieldT = 0; b.shieldF = 0; b.spawnSh = false; }
    }
    b.face = ang; b.aimA = ang; b.faceT = 0.35; b.fireT = 0; b.lastAct = act;
    this.ev(EV.FIRE, b.slot, act, b.x, b.y, ang, b.lastSeq);
    if (act === ACT.ATTACK) {
      this._xStun = b.nxStun; this._xSlow = b.nxSlow;
      b.nxStun = 0; b.nxSlow = 0;
    }
    this.exec(b, s, act, ang, d, this.dmgMul(b));
    this._xStun = 0; this._xSlow = 0;
    if (act === ACT.ATTACK && kit.pass.atkHeal) this.heal(b, kit.pass.atkHeal * LEVEL_MULT(b.lvl), b.slot, ACT.ATTACK);
    return true;
  }

  // Runs one primitive (and its `then` follow-ups) for brawler b.
  exec(b, s, act, ang, d, mul) {
    switch (s.t) {
      case 'shot': this.doShot(b, s, act, ang, mul); break;
      case 'lob': this.doLob(b, s, act, ang, d, mul); break;
      case 'beam': this.doBeam(b, s, act, ang, mul); break;
      case 'arc': this.doArc(b, s, act, ang, mul); break;
      case 'dash': this.doDash(b, s, act, ang, mul); break;
      case 'leap': this.doLeap(b, s, act, ang, d, mul); break;
      case 'deploy': this.doDeploy(b, s, act, ang, d, mul); break;
      case 'area': this.doArea(b, s, act, ang, d, mul); break;
      case 'pulse': this.doPulse(b, s, act, mul); break;
      case 'heal': this.heal(b, s.amt * LEVEL_MULT(b.lvl), b.slot, act); break;
      case 'buff': this.doBuff(b, s, act); break;
      default: throw new Error('Unknown primitive ' + s.t);
    }
    if (s.then) for (let i = 0; i < s.then.length; i++) this.exec(b, s.then[i], act, ang, d, mul);
  }

  // Nearest enemy the shooter's team can see within range + 1 (brawlers first, then units, then
  // Showdown boxes). Returns a scratch {x, y} or null.
  autoTarget(b, range) {
    const R = range + 1, tg = this._tg, B = this.brawlers;
    let bd = R * R, found = false;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!e.alive || e.team === b.team || !((e.vis >> b.team) & 1)) continue;
      const d2 = dist2(b.x, b.y, e.x, e.y);
      if (d2 < bd) { bd = d2; tg.x = e.x; tg.y = e.y; found = true; }
    }
    if (found) return tg;
    for (let i = 0; i < this.deploys.length; i++) {
      const e = this.deploys[i];
      if (e.dead || e.team === b.team) continue;
      const d2 = dist2(b.x, b.y, e.x, e.y);
      if (d2 < bd) { bd = d2; tg.x = e.x; tg.y = e.y; found = true; }
    }
    if (found || !this.hasBox) return found ? tg : null;
    const m = this.map;
    const tx0 = Math.max(0, Math.floor(b.x - R)), tx1 = Math.min(m.w - 1, Math.floor(b.x + R));
    const ty0 = Math.max(0, Math.floor(b.y - R)), ty1 = Math.min(m.h - 1, Math.floor(b.y + R));
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (m.tiles[ty * m.w + tx] !== TILE.BOX) continue;
        const d2 = dist2(b.x, b.y, tx + 0.5, ty + 0.5);
        if (d2 < bd) { bd = d2; tg.x = tx + 0.5; tg.y = ty + 0.5; found = true; }
      }
    }
    return found ? tg : null;
  }

  // ---- primitives ----
  doShot(b, s, act, ang, mul) {
    const n = s.n || 1;
    if (s.burst > 0) {
      // fired over several ticks from wherever the brawler is, along the original aim
      b.bqN = n; b.bqI = 0; b.bqT = 0; b.bqS = s; b.bqA = ang; b.bqAct = act; b.bqMul = mul; b.bqStun = this._xStun;
      return;
    }
    const sp = n > 1 ? s.spread || 0 : 0;
    for (let i = 0; i < n; i++) {
      const a = n > 1 ? ang + (i / (n - 1) - 0.5) * sp : ang;
      this.spawnShot(b.slot, b.team, s, act, a, b.x, b.y, mul, this._xStun);
    }
  }

  stepBurst(b) {
    if (!this.canAct(b)) { b.bqN = 0; return; } // stunned or knocked back: the rest of the burst is lost
    b.bqT -= SIM_DT;
    const s = b.bqS;
    while (b.bqN > 0 && b.bqT <= 0) {
      const side = (b.bqI & 1 ? 1 : -1) * (s.jit || 0);
      const ox = b.x - Math.sin(b.bqA) * side, oy = b.y + Math.cos(b.bqA) * side;
      this.spawnShot(b.slot, b.team, s, b.bqAct, b.bqA, ox, oy, b.bqMul, b.bqStun);
      b.bqI++;
      b.bqN--;
      b.bqT += s.burst;
    }
    if (b.bqN <= 0) b.bqS = null;
  }

  spawnShot(owner, team, s, act, ang, x, y, mul, xstun) {
    const c = Math.cos(ang), sn = Math.sin(ang), r = s.r || 0.15;
    const ob = this.brawlers[owner];
    const e = {
      id: this.nextId++, kind: K.SHOT, team, x, y, px: x, py: y, r, dead: false,
      owner, pk: s.pk || ob.pk[act], x0: x, y0: y, ang, spd: s.spd || 0, range: s.range || 0, trav: 0,
      dmg: (s.dmg || 0) * mul, pierce: !!s.pierce, hitMask: 0, sup: act === ACT.SUPER, breaks: !!s.breaks, lob: null,
      act, s, vx: c, vy: sn, r0: r, hitD: 0, bnc: s.bounce ? s.bounce.n : 0,
      heal: (s.heal || 0) * LEVEL_MULT(ob.lvl), stun: Math.max(s.stun || 0, xstun || 0), xslow: 0, beam: 0, ttl: 0, mul,
    };
    this.shots.push(e);
    this.ev(EV.SPAWN, e.id, K.SHOT);
    return e;
  }

  doLob(b, s, act, ang, d, mul) {
    const n = s.n || 1, self = s.at === 'self', m = this.map;
    const dist = self ? 0 : clamp(d, 0, s.range);
    const T = s.T * (self ? 1 : 0.6 + 0.4 * (s.range > 0 ? dist / s.range : 1)); // short throws land sooner
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const cx = b.x + ca * dist, cy = b.y + sa * dist;
    for (let i = 0; i < n; i++) {
      let tx = cx, ty = cy;
      if (s.ring) {
        const a = ang + (i / n) * TAU;
        tx = b.x + Math.cos(a) * s.ring; ty = b.y + Math.sin(a) * s.ring;
      } else if (n > 1 && s.gap) {
        const off = (i - (n - 1) / 2) * s.gap;
        tx = cx - sa * off; ty = cy + ca * off;
      } else if (n > 1 && s.spread) {
        const a = ang + (i / (n - 1) - 0.5) * s.spread;
        tx = b.x + Math.cos(a) * dist; ty = b.y + Math.sin(a) * dist;
      }
      tx = clamp(tx, 0.3, m.w - 0.3);
      ty = clamp(ty, 0.3, m.h - 0.3);
      const e = this.spawnShot(b.slot, b.team, s, act, Math.atan2(ty - b.y, tx - b.x), b.x, b.y, mul, this._xStun);
      const L = Math.hypot(tx - b.x, ty - b.y);
      e.range = L;
      e.spd = L / T;
      e.lob = { tx, ty, T, t: 0 };
      e.xslow = this._xSlow;
    }
  }

  doBeam(b, s, act, ang, mul) {
    const m = this.map, B = this.brawlers, D = this.deploys;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const ex = b.x + ca * s.range, ey = b.y + sa * s.range;
    const tw = rayHit(m, b.x, b.y, ex, ey, TF_SHOT, this._ray);
    const wtx = this._ray.tx, wty = this._ray.ty;
    const tEnd = tw < 0 ? 1 : tw;
    const dmg = s.dmg * mul, chg = act === ACT.ATTACK ? s.chg || 0 : 0, w = s.w || 0.25;
    let mask = 0, first = null, ft = 2, len = s.range * tEnd;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!this.hittable(e) || e.team === b.team) continue;
      const t = segCircle(b.x, b.y, ex, ey, e.x, e.y, e.r + w);
      if (t < 0 || t > tEnd) continue;
      if (s.pierce) { mask |= 1 << e.slot; this.hurt(e, dmg, b.slot, act, act === ACT.SUPER ? 1 : 0, chg); this.applyMods(e, s, b.slot, act, ca, sa, 0); }
      if (t < ft) { ft = t; first = e; }
    }
    let firstD = null;
    for (let i = 0; i < D.length; i++) {
      const e = D[i];
      if (e.dead || e.team === b.team) continue;
      const t = segCircle(b.x, b.y, ex, ey, e.x, e.y, e.r + w);
      if (t < 0 || t > tEnd) continue;
      if (s.pierce) this.hurt(e, dmg, b.slot, act, 0, 0);
      else if (t < ft) { ft = t; first = null; firstD = e; }
    }
    if (!s.pierce) {
      if (first) { mask |= 1 << first.slot; this.hurt(first, dmg, b.slot, act, 0, chg); this.applyMods(first, s, b.slot, act, ca, sa, 0); }
      else if (firstD) this.hurt(firstD, dmg, b.slot, act, 0, 0);
      if (first || firstD) len = s.range * ft;
    }
    if (tw >= 0 && len >= s.range * tEnd - 1e-6 && tileAtT(m, wtx, wty) === TILE.BOX) this.hurtBox(wty * m.w + wtx, dmg, b.slot, act);
    this.beamFx(b.slot, b.team, act, b.x, b.y, ang, len, s.pk);
    if (s.chain && first) {
      // jumps on from the nearest enemy hit to the closest enemy not hit yet
      let from = first;
      for (let c = 0; c < s.chain.n; c++) {
        let best = null, bd = s.chain.r * s.chain.r;
        for (let i = 0; i < B.length; i++) {
          const e = B[i];
          if (!this.hittable(e) || e.team === b.team || ((mask >> e.slot) & 1)) continue;
          const d2 = dist2(from.x, from.y, e.x, e.y);
          if (d2 < bd) { bd = d2; best = e; }
        }
        if (!best) break;
        mask |= 1 << best.slot;
        this.hurt(best, dmg * s.chain.mul, b.slot, act, 0, chg);
        this.beamFx(b.slot, b.team, act, from.x, from.y, Math.atan2(best.y - from.y, best.x - from.x), Math.sqrt(bd), s.pk);
        from = best;
      }
    }
  }

  // A short-lived shot that only carries the beam's picture: from x0,y0 to x,y (`beam` = length).
  beamFx(owner, team, act, x, y, ang, len, pk) {
    const e = this.spawnShot(owner, team, Sim.BEAM_FX, act, ang, x, y, 0, 0);
    if (pk) e.pk = pk;
    e.x = e.px = x + Math.cos(ang) * len;
    e.y = e.py = y + Math.sin(ang) * len;
    e.range = e.trav = len;
    e.beam = Math.max(len, 0.01);
    e.ttl = 0.15;
  }

  doArc(b, s, act, ang, mul) {
    const B = this.brawlers, dmg = s.dmg * mul, chg = act === ACT.ATTACK ? s.chg || 0 : 0;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!this.hittable(e) || e.team === b.team) continue;
      const d = Math.hypot(e.x - b.x, e.y - b.y);
      if (d > s.range + e.r) continue;
      const a = Math.atan2(e.y - b.y, e.x - b.x);
      if (Math.abs(angDiff(ang, a)) > s.half + Math.atan2(e.r, Math.max(d, 0.01))) continue;
      if (!shotClear(this.map, b.x, b.y, e.x, e.y)) continue;
      this.hurt(e, dmg, b.slot, act, 0, chg);
      this.applyMods(e, s, b.slot, act, Math.cos(a), Math.sin(a), 0);
    }
    for (let i = 0; i < this.deploys.length; i++) {
      const e = this.deploys[i];
      if (e.dead || e.team === b.team || dist2(b.x, b.y, e.x, e.y) > (s.range + e.r) * (s.range + e.r)) continue;
      if (Math.abs(angDiff(ang, Math.atan2(e.y - b.y, e.x - b.x))) <= s.half + 0.3) this.hurt(e, dmg, b.slot, act, 0, 0);
    }
  }

  doDash(b, s, act, ang, mul) {
    b.dashT = s.dist / s.spd;
    b.dvx = Math.cos(ang) * s.spd;
    b.dvy = Math.sin(ang) * s.spd;
    b.dashS = s; b.dashAct = act; b.dashHit = 0; b.dashHitD = 0; b.dashMul = mul;
    b.bqN = 0;
    if (s.inv) {
      b.shieldT = Math.max(b.shieldT, b.dashT + 0.1);
      b.shieldF = 1;
      b.spawnSh = false;
      this.ev(EV.STATUS, b.slot, 5, b.dashT + 0.1);
    }
    if (!s.dmg) this.fxn[b.slot * 4 + act]++;
  }

  stepDash(b) {
    const o = this._o, dt = Math.min(SIM_DT, b.dashT), x0 = b.x, y0 = b.y;
    moveCircle(this.map, x0, y0, b.r, b.dvx * dt, b.dvy * dt, o);
    b.x = o.x; b.y = o.y;
    b.dashT -= SIM_DT;
    const s = b.dashS;
    if (s && s.dmg) {
      const B = this.brawlers, w = s.w || 0.4, chg = b.dashAct === ACT.ATTACK ? s.chg || 0 : 0;
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (!this.hittable(e) || e.team === b.team || ((b.dashHit >> e.slot) & 1)) continue;
        if (segCircle(x0, y0, b.x, b.y, e.x, e.y, e.r + w) < 0) continue;
        b.dashHit |= 1 << e.slot;
        this.hurt(e, s.dmg * b.dashMul, b.slot, b.dashAct, 0, chg);
        this.applyMods(e, s, b.slot, b.dashAct, b.dvx / s.spd, b.dvy / s.spd, 0);
      }
      for (let i = 0; i < this.deploys.length; i++) {
        const e = this.deploys[i];
        if (e.dead || e.team === b.team || ((b.dashHitD >> e.owner) & 1)) continue;
        if (segCircle(x0, y0, b.x, b.y, e.x, e.y, e.r + w) < 0) continue;
        b.dashHitD |= 1 << e.owner;
        this.hurt(e, s.dmg * b.dashMul, b.slot, b.dashAct, 0, 0);
      }
    }
    // stopped by a wall
    const want = Math.hypot(b.dvx, b.dvy) * dt;
    if (Math.hypot(b.x - x0, b.y - y0) < want * 0.4) b.dashT = 0;
    if (b.dashT <= 0) { b.dashT = 0; b.dashS = null; }
  }

  doLeap(b, s, act, ang, d, mul) {
    const dist = clamp(d, 0, s.range);
    const o = this.freeSpot(b.x + Math.cos(ang) * dist, b.y + Math.sin(ang) * dist, b.r, this._o2);
    const L = Math.hypot(o.x - b.x, o.y - b.y);
    this.startJump(b, o.x, o.y, s.T || 0.45 + 0.055 * L, s, act, mul);
    if (!s.dmg && !s.heal) this.fxn[b.slot * 4 + act]++;
  }

  startJump(b, tx, ty, T, s, act, mul) {
    b.jumpT = b.jumpTT = T;
    b.jx0 = b.x; b.jy0 = b.y; b.jx1 = tx; b.jy1 = ty;
    b.jumpS = s; b.jumpAct = act; b.jumpMul = mul;
    b.bqN = 0; b.dashT = 0; b.kbT = 0;
  }

  stepJump(b) {
    b.jumpT -= SIM_DT;
    const k = b.jumpT <= 0 ? 1 : 1 - b.jumpT / b.jumpTT;
    b.x = b.jx0 + (b.jx1 - b.jx0) * k;
    b.y = b.jy0 + (b.jy1 - b.jy0) * k;
    if (b.jumpT > 0) return;
    b.jumpT = 0;
    const s = b.jumpS;
    b.jumpS = null;
    const o = this._o;
    o.x = b.x; o.y = b.y;
    pushOut(this.map, o, b.r, TF_MOVE);
    b.x = o.x; b.y = o.y;
    if (!s) return; // jump pad
    if (s.breaks) this.breakCircle(b.x, b.y, s.r || 1, b.slot, b.jumpAct);
    if (s.dmg) this.blast(b.slot, b.team, b.jumpAct, b.x, b.y, s.r || 1, s.dmg * b.jumpMul, s, 0, 0);
    if (s.heal) this.heal(b, s.heal * LEVEL_MULT(b.lvl), b.slot, b.jumpAct);
  }

  padJump(b) {
    const m = this.map, tx = Math.floor(b.x), ty = Math.floor(b.y);
    for (const p of m.pads) {
      if (Math.floor(p.x) !== tx || Math.floor(p.y) !== ty) continue;
      const L = Math.hypot(p.tx - b.x, p.ty - b.y);
      this.startJump(b, p.tx, p.ty, 0.5 + 0.045 * L, null, 0, 1);
      return;
    }
  }

  deployOf(slot) {
    for (let i = 0; i < this.deploys.length; i++) { const d = this.deploys[i]; if (!d.dead && d.owner === slot) return d; }
    return null;
  }

  doDeploy(b, s, act, ang, d, mul) {
    const old = this.deployOf(b.slot);
    if (old) this.killDeploy(old); // one unit per owner
    const dist = clamp(d, 0, s.range), r = s.rad || 0.5;
    const o = this.freeSpot(b.x + Math.cos(ang) * dist, b.y + Math.sin(ang) * dist, r, this._o2);
    const hp = Math.round(s.hp * LEVEL_MULT(b.lvl));
    const e = {
      id: this.nextId++, kind: K.DEPLOY, team: b.team, x: o.x, y: o.y, px: o.x, py: o.y, r, dead: false,
      owner: b.slot, dk: s.dk, hp, maxHp: hp, face: ang, t: 0,
      s, act, mul, cd: 0.5, tgt: null, mvx: 0, mvy: 0, rateT: 0, rateF: 1, stunNext: 0,
    };
    this.deploys.push(e);
    this.ev(EV.SPAWN, e.id, K.DEPLOY);
    this.fxn[b.slot * 4 + act]++;
    if (s.land) this.blast(b.slot, b.team, act, e.x, e.y, s.land.r, s.land.dmg * mul, s.land, 0, 0);
  }

  killDeploy(e) {
    if (e.dead) return;
    e.dead = true;
    e.hp = 0;
    this.ev(EV.DESPAWN, e.id, K.DEPLOY);
  }

  doArea(b, s, act, ang, d, mul) {
    let x = b.x, y = b.y;
    if (s.at !== 'self') {
      const dist = clamp(d, 0, s.range || 0);
      x = clamp(x + Math.cos(ang) * dist, 0.3, this.map.w - 0.3);
      y = clamp(y + Math.sin(ang) * dist, 0.3, this.map.h - 0.3);
    }
    this.spawnArea(b.slot, b.team, s, act, x, y, mul, 0, 0);
  }

  spawnArea(owner, team, a, act, x, y, mul, xslow, chg) {
    const ob = this.brawlers[owner];
    const e = {
      id: this.nextId++, kind: K.AREA, team, x, y, px: x, py: y, r: a.r, dead: false,
      owner, ak: a.ak || ob.pk[act], t: a.T, T: a.T, dmg: (a.dps || 0) * mul, heal: (a.hps || 0) * LEVEL_MULT(ob.lvl),
      slow: Math.max(a.slow || 0, xslow || 0), act, tickT: 0, chg: chg || 0,
    };
    this.areas.push(e);
    this.ev(EV.SPAWN, e.id, K.AREA);
    return e;
  }

  // Instant ring around the user: damage/knockback/stun/slow enemies, heal allies (and self).
  doPulse(b, s, act, mul) {
    const B = this.brawlers;
    if (s.dmg || s.kb || s.stun || s.slow) {
      this.blast(b.slot, b.team, act, b.x, b.y, s.r, (s.dmg || 0) * mul, s, s.stun || 0, 0);
    }
    if (s.heal) {
      const h = s.heal * LEVEL_MULT(b.lvl);
      for (let i = 0; i < B.length; i++) {
        const e = B[i];
        if (e.alive && e.team === b.team && dist2(b.x, b.y, e.x, e.y) <= (s.r + e.r) * (s.r + e.r)) this.heal(e, h, b.slot, act);
      }
    }
  }

  doBuff(b, s, act) {
    const B = this.brawlers;
    switch (s.what) {
      case 'shield':
        b.shieldF = b.shieldT > 0 ? Math.max(b.shieldF, s.f) : s.f;
        b.shieldT = Math.max(b.shieldT, s.T);
        b.spawnSh = false;
        this.ev(EV.STATUS, b.slot, 5, s.T);
        break;
      case 'speed':
        for (let i = 0; i < B.length; i++) {
          const e = B[i];
          if (!e.alive || e.team !== b.team) continue;
          if (e !== b && (!s.r || dist2(b.x, b.y, e.x, e.y) > s.r * s.r)) continue;
          e.speedT = s.T; e.speedF = s.f;
          this.ev(EV.STATUS, e.slot, 6, s.T);
        }
        break;
      case 'invis':
        b.invisT = s.T;
        this.ev(EV.STATUS, b.slot, 4, s.T);
        break;
      case 'ammo': b.ammo = Math.min(MAX_AMMO, b.ammo + s.v); break;
      case 'nextStun': b.nxStun = s.v; break;
      case 'nextSlow': b.nxSlow = s.v; break;
      case 'petStun': { const d = this.deployOf(b.slot); if (d) d.stunNext = s.v; break; }
      case 'deployRate': { const d = this.deployOf(b.slot); if (d) { d.rateT = s.T; d.rateF = s.v; } break; }
      default: throw new Error('Unknown buff ' + s.what);
    }
    this.fxn[b.slot * 4 + act]++;
  }

  // Damage (and knockback/stun/slow from `o`) to every enemy in a circle, units and boxes included.
  blast(src, team, act, x, y, r, dmg, o, stun, chg) {
    const B = this.brawlers;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!this.hittable(e) || e.team === team) continue;
      const d2 = dist2(x, y, e.x, e.y), rr = r + e.r;
      if (d2 > rr * rr) continue;
      if (dmg > 0) this.hurt(e, dmg, src, act, act === ACT.SUPER ? 1 : 0, chg);
      const d = Math.sqrt(d2) || 1;
      this.applyMods(e, o, src, act, d2 > 1e-6 ? (e.x - x) / d : 1, d2 > 1e-6 ? (e.y - y) / d : 0, stun);
    }
    if (dmg > 0) {
      for (let i = 0; i < this.deploys.length; i++) {
        const e = this.deploys[i];
        if (e.dead || e.team === team || dist2(x, y, e.x, e.y) > (r + e.r) * (r + e.r)) continue;
        this.hurt(e, dmg, src, act, 0, 0);
      }
      if (this.hasBox) this.hurtBoxesIn(x, y, r, dmg, src, act);
    }
  }

  // Knockback along (dx, dy), stun and slow from a spec onto a brawler.
  applyMods(e, s, src, act, dx, dy, xstun) {
    if (!s) return;
    if (s.kb) this.knock(e, dx, dy, s.kb, src, act);
    const st = Math.max(s.stun || 0, xstun || 0);
    if (st) this.stun(e, st, src, act);
    if (s.slow && s.slow.T) this.slow(e, s.slow.T, s.slow.f, src, act);
  }

  // ---- damage, healing, statuses ----
  // Hurts a brawler or unit. src: attacker slot (-1 none, e.g. poison); act: action for telemetry;
  // chg: super charge for the attacker when the target is a brawler. Returns the damage dealt.
  hurt(e, amt, src, act, crit, chg) {
    if (e.kind === K.BRAWLER) {
      if (!e.alive) return 0;
      if (e.shieldT > 0) amt *= 1 - e.shieldF;
      amt = Math.round(amt);
      if (amt <= 0) return 0;
      e.quietT = 0;
      e.regenAcc = 0;
      e.revealT = REVEAL_T;
      const dealt = Math.min(amt, e.hp);
      e.hp -= amt;
      if (e.hp <= 0) {
        e.hp = 0;
        if (!e.dying) { e.dying = true; e.killer = src; }
      }
      this.ev(EV.HIT, e.id, amt, e.x, e.y, src, crit || 0);
      if (src >= 0) {
        const sb = this.brawlers[src];
        if (sb.team !== e.team) { sb.st.dmg += dealt; this.dmgBy[src * 4 + act] += dealt; }
        this.fxn[src * 4 + act]++;
        if (chg > 0) {
          this.charge(sb, chg);
          if (act === ACT.ATTACK) this.onAtkHit(sb);
        }
      }
      return dealt;
    }
    if (e.kind === K.DEPLOY) {
      if (e.dead) return 0;
      amt = Math.round(amt);
      if (amt <= 0) return 0;
      const dealt = Math.min(amt, e.hp);
      e.hp -= amt;
      this.ev(EV.HIT, e.id, amt, e.x, e.y, src, crit || 0);
      if (src >= 0) this.fxn[src * 4 + act]++;
      if (e.hp <= 0) this.killDeploy(e);
      return dealt;
    }
    return 0;
  }

  // Star powers that trigger when a main attack lands on an enemy brawler.
  onAtkHit(b) {
    const p = b.kit.pass;
    if (p.ammoOnHit) b.ammo = Math.min(MAX_AMMO, b.ammo + p.ammoOnHit);
    if (p.deployHeal) {
      const d = this.deployOf(b.slot);
      if (d) d.hp = Math.min(d.maxHp, d.hp + Math.round(p.deployHeal * LEVEL_MULT(b.lvl)));
    }
  }

  charge(b, amt) {
    if (b.supReady) return;
    b.sup += amt;
    if (b.sup >= 1 - 1e-9) {
      b.sup = 1;
      b.supReady = true;
      this.ev(EV.SUPER_READY, b.slot);
    }
  }

  heal(b, amt, src, act) {
    if (!b.alive || b.hp <= 0 || amt <= 0) return 0; // at 0 HP it goes down this tick, whatever heals it
    const real = Math.min(Math.round(amt), b.maxHp - b.hp);
    if (real <= 0) return 0;
    b.hp += real;
    this.ev(EV.HEAL, b.slot, real, b.x, b.y);
    if (src >= 0) { this.brawlers[src].st.heal += real; this.fxn[src * 4 + act]++; }
    return real;
  }

  immune(b) { return b.shieldT > 0 && b.shieldF >= 1; }

  knock(b, dx, dy, dist, src, act) {
    if (!b.alive || this.immune(b) || b.jumpT > 0) return;
    const T = 0.12 + dist * 0.05;
    b.kbT = T;
    b.kbx = dx * dist / T;
    b.kby = dy * dist / T;
    b.dashT = 0; b.dashS = null; b.bqN = 0;
    this.ev(EV.STATUS, b.slot, 3, T);
    if (src >= 0) this.fxn[src * 4 + act]++;
  }

  stun(b, t, src, act) {
    if (!b.alive || this.immune(b)) return;
    b.stunT = Math.max(b.stunT, t);
    b.dashT = 0; b.dashS = null; b.bqN = 0;
    this.ev(EV.STATUS, b.slot, 1, t);
    if (src >= 0) this.fxn[src * 4 + act]++;
  }

  slow(b, T, f, src, act) {
    if (!b.alive || this.immune(b)) return;
    const was = b.slowT > 0;
    b.slowT = Math.max(b.slowT, T);
    b.slowF = was ? Math.max(b.slowF, f) : f;
    if (!was) this.ev(EV.STATUS, b.slot, 2, T);
    if (src >= 0) this.fxn[src * 4 + act]++;
  }

  // Showdown power-cube boxes
  addCube(b) {
    b.cubes++;
    b.maxHp += CUBE_HP;
    if (b.alive) b.hp += CUBE_HP;
  }

  // ---- tiles ----
  setTile(ti, t) {
    this.map.tiles[ti] = t;
    this.ev(EV.TILE, ti, t);
  }

  hurtBox(ti, amt, src, act) {
    const m = this.map;
    if (m.tiles[ti] !== TILE.BOX) return;
    amt = Math.round(amt);
    if (amt <= 0) return;
    this.boxHp[ti] -= amt;
    this.ev(EV.HIT, -1 - ti, amt, (ti % m.w) + 0.5, Math.floor(ti / m.w) + 0.5, src, 0);
    if (src >= 0) this.fxn[src * 4 + act]++;
    if (this.boxHp[ti] <= 0) this.destroyBox(ti);
  }

  destroyBox(ti) {
    const m = this.map, x = (ti % m.w) + 0.5, y = Math.floor(ti / m.w) + 0.5;
    this.boxHp[ti] = 0;
    this.setTile(ti, TILE.FLOOR);
    this.spawnPickup(PICK.CUBE, 1, x, y, x, y);
  }

  breakTile(ti, src, act) {
    const t = this.map.tiles[ti];
    if (t === TILE.WALL) this.setTile(ti, TILE.FLOOR);
    else if (t === TILE.BOX) this.destroyBox(ti);
    else return;
    if (src >= 0) this.fxn[src * 4 + act]++;
  }

  // Breaks WALL/BOX tiles touched by a circle of radius r swept from (x0,y0) to (x1,y1).
  breakAlong(x0, y0, x1, y1, r, src, act) {
    const m = this.map;
    const tx0 = Math.max(0, Math.floor(Math.min(x0, x1) - r)), tx1 = Math.min(m.w - 1, Math.floor(Math.max(x0, x1) + r));
    const ty0 = Math.max(0, Math.floor(Math.min(y0, y1) - r)), ty1 = Math.min(m.h - 1, Math.floor(Math.max(y0, y1) + r));
    const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const ti = ty * m.w + tx, t = m.tiles[ti];
        if (t !== TILE.WALL && t !== TILE.BOX) continue;
        // closest point of the segment to the tile centre, then circle-vs-box there
        let k = l2 > 1e-12 ? ((tx + 0.5 - x0) * dx + (ty + 0.5 - y0) * dy) / l2 : 0;
        k = clamp(k, 0, 1);
        const px = x0 + dx * k, py = y0 + dy * k;
        const nx = clamp(px, tx, tx + 1), ny = clamp(py, ty, ty + 1);
        if ((px - nx) * (px - nx) + (py - ny) * (py - ny) < r * r) this.breakTile(ti, src, act);
      }
    }
  }

  breakCircle(x, y, r, src, act) { this.breakAlong(x, y, x, y, r, src, act); }

  hurtBoxesIn(x, y, r, amt, src, act) {
    const m = this.map;
    const tx0 = Math.max(0, Math.floor(x - r)), tx1 = Math.min(m.w - 1, Math.floor(x + r));
    const ty0 = Math.max(0, Math.floor(y - r)), ty1 = Math.min(m.h - 1, Math.floor(y + r));
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (m.tiles[ty * m.w + tx] !== TILE.BOX) continue;
        const nx = clamp(x, tx, tx + 1), ny = clamp(y, ty, ty + 1);
        if ((x - nx) * (x - nx) + (y - ny) * (y - ny) < r * r) this.hurtBox(ty * m.w + tx, amt, src, act);
      }
    }
  }

  // Nearest spot to (x, y) where a circle of radius r can stand. Writes out.x/out.y.
  freeSpot(x, y, r, out) {
    const m = this.map;
    x = clamp(x, r, m.w - r);
    y = clamp(y, r, m.h - r);
    out.x = x; out.y = y;
    if (!(flagsAt(m, x, y) & TF_MOVE)) {
      pushOut(m, out, r, TF_MOVE);
      if (!(flagsAt(m, out.x, out.y) & TF_MOVE)) return out;
    }
    const tx = Math.floor(x), ty = Math.floor(y);
    let best = Infinity;
    for (let R = 1; R <= 16 && best === Infinity; R++) {
      for (let dy = -R; dy <= R; dy++) {
        for (let dx = -R; dx <= R; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== R) continue;
          const cx = tx + dx, cy = ty + dy;
          if (flagsAtT(m, cx, cy) & TF_MOVE) continue;
          const d2 = dist2(x, y, cx + 0.5, cy + 0.5);
          if (d2 < best) { best = d2; out.x = cx + 0.5; out.y = cy + 0.5; }
        }
      }
    }
    if (best === Infinity) { out.x = x; out.y = y; }
    pushOut(m, out, r, TF_MOVE);
    return out;
  }

  // ---- 2. deploys ----
  stepDeploys() {
    const D = this.deploys, dt = SIM_DT;
    for (let i = 0; i < D.length; i++) {
      const d = D[i];
      if (d.dead) continue;
      d.px = d.x; d.py = d.y;
      d.t += dt;
      d.cd -= dt;
      if (d.rateT > 0) d.rateT -= dt;
      if (d.s.unit === 'turret') this.stepTurret(d);
      else this.stepPet(d);
      d.mvx = (d.x - d.px) / dt;
      d.mvy = (d.y - d.py) / dt;
    }
  }

  // Nearest enemy a unit's team can see within R: brawlers first, then other units.
  unitTarget(d, R, needClear) {
    const B = this.brawlers;
    let best = null, bd = R * R;
    for (let i = 0; i < B.length; i++) {
      const e = B[i];
      if (!this.hittable(e) || e.team === d.team || !((e.vis >> d.team) & 1)) continue;
      const d2 = dist2(d.x, d.y, e.x, e.y);
      if (d2 < bd && (!needClear || shotClear(this.map, d.x, d.y, e.x, e.y))) { bd = d2; best = e; }
    }
    if (best) return best;
    for (let i = 0; i < this.deploys.length; i++) {
      const e = this.deploys[i];
      if (e.dead || e.team === d.team) continue;
      const d2 = dist2(d.x, d.y, e.x, e.y);
      if (d2 < bd && (!needClear || shotClear(this.map, d.x, d.y, e.x, e.y))) { bd = d2; best = e; }
    }
    return best;
  }

  stepTurret(d) {
    const s = d.s;
    const tg = this.unitTarget(d, s.aggro, true);
    if (!tg) return;
    d.face = Math.atan2(tg.y - d.y, tg.x - d.x);
    if (d.cd > 0) return;
    d.cd += s.rate / (d.rateT > 0 ? d.rateF : 1);
    if (d.cd < 0) d.cd = 0;
    const e = this.spawnShot(d.owner, d.team, s.shot, d.act, d.face, d.x, d.y, d.mul, 0);
    e.sup = false; // the unit's own fire: drawn and counted as plain shots
  }

  stepPet(d) {
    const s = d.s, owner = this.brawlers[d.owner], dt = SIM_DT;
    let tg = d.tgt;
    if (tg) {
      const ok = tg.kind === K.BRAWLER ? this.hittable(tg) && ((tg.vis >> d.team) & 1) : !tg.dead;
      if (!ok || dist2(d.x, d.y, tg.x, tg.y) > s.aggro * s.aggro * 2) tg = null;
    }
    if (!tg) tg = this.unitTarget(d, s.aggro, false);
    d.tgt = tg;
    let gx, gy, stop;
    if (tg) { gx = tg.x; gy = tg.y; stop = s.reach * 0.7 + tg.r; }
    else if (owner.alive) { gx = owner.x; gy = owner.y; stop = 1.6; }
    else return;
    const dx = gx - d.x, dy = gy - d.y, dd = Math.hypot(dx, dy);
    const a = Math.atan2(dy, dx);
    if (dd > stop) this.unitMove(d, a, Math.min(s.spd * dt, dd - stop));
    d.face = a;
    if (!tg || d.cd > 0 || dist2(d.x, d.y, tg.x, tg.y) > (s.reach + tg.r) * (s.reach + tg.r)) return;
    d.cd = s.rate;
    const isB = tg.kind === K.BRAWLER;
    this.hurt(tg, s.dmg * d.mul, d.owner, d.act, 0, isB ? s.chg || 0 : 0);
    if (isB && d.stunNext) { this.stun(tg, d.stunNext, d.owner, ACT.GADGET); d.stunNext = 0; }
    if (owner.kit.pass.petHeal) this.heal(owner, owner.kit.pass.petHeal * LEVEL_MULT(owner.lvl), owner.slot, d.act);
  }

  // Steps a unit towards angle a, trying small detours when a wall is in the way.
  unitMove(d, a, step) {
    const m = this.map, o = this._o;
    let bx = d.x, by = d.y, bm = -1;
    for (let k = 0; k < 7; k++) {
      const off = k === 0 ? 0 : (k & 1 ? 1 : -1) * 0.5 * ((k + 1) >> 1);
      const aa = a + off;
      moveCircle(m, d.x, d.y, d.r, Math.cos(aa) * step, Math.sin(aa) * step, o);
