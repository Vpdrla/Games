// ---------- Input: floating thumb joystick, keyboard, gamepad ----------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Escape: 'pause', KeyP: 'pause',
};

const Input = {
  key: {}, canvas: null, active: false,
  stick: { id: null, ox: 0, oy: 0, x: 0, y: 0, on: false },
  R: 52, // joystick radius in CSS pixels
  mx: 0, my: 0, moved: false, pauseLatch: false, padPause: false,

  init(canvas) {
    this.canvas = canvas;
    addEventListener('keydown', (e) => {
      const a = KEYMAP[e.code];
      if (a) {
        if (a === 'pause' && !e.repeat) this.pauseLatch = true;
        this.key[a] = true;
        if (this.active) e.preventDefault();
      }
      Sound.init();
    });
    addEventListener('keyup', (e) => {
      const a = KEYMAP[e.code];
      if (a) this.key[a] = false;
    });
    addEventListener('blur', () => this.reset());
    const opt = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.down(e), opt);
    canvas.addEventListener('pointermove', (e) => this.move(e), opt);
    canvas.addEventListener('pointerup', (e) => this.up(e), opt);
    canvas.addEventListener('pointercancel', (e) => this.up(e), opt);
    canvas.addEventListener('lostpointercapture', (e) => this.up(e), opt);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), opt);
  },

  reset() {
    this.key = {};
    this.pauseLatch = false;
    this.stick.id = null;
    this.stick.on = false;
    this.mx = this.my = 0;
  },

  down(e) {
    Sound.init();
    if (!this.active) return;
    e.preventDefault();
    const s = this.stick;
    if (s.id !== null) return;
    try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    s.id = e.pointerId;
    s.ox = s.x = e.clientX;
    s.oy = s.y = e.clientY;
    s.on = true;
  },

  move(e) {
    const s = this.stick;
    if (e.pointerId !== s.id) return;
    e.preventDefault();
    s.x = e.clientX;
    s.y = e.clientY;
    // the base follows the thumb when it is dragged far away
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), lim = this.R * 1.4;
    if (d > lim) {
      s.ox = s.x - (dx / d) * lim;
      s.oy = s.y - (dy / d) * lim;
    }
  },

  up(e) {
    const s = this.stick;
    if (e.pointerId !== s.id) return;
    s.id = null;
    s.on = false;
  },

  // Movement vector with length 0..1.
  poll() {
    let x = 0, y = 0;
    const s = this.stick;
    if (s.on) {
      const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
      if (d > 5) {
        const m = Math.min(1, (d - 5) / (this.R * 0.7));
        x = (dx / d) * m;
        y = (dy / d) * m;
      }
    }
    const k = this.key;
    if (k.left) x -= 1;
    if (k.right) x += 1;
    if (k.up) y -= 1;
    if (k.down) y += 1;
    let pads = null;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : null; } catch (err) { pads = null; }
    let padPause = false;
    if (pads) {
      for (const gp of pads) {
        if (!gp) continue;
        const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
        if (Math.hypot(ax, ay) > 0.2) { x += ax; y += ay; }
        const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
        if (b(14)) x -= 1;
        if (b(15)) x += 1;
        if (b(12)) y -= 1;
        if (b(13)) y += 1;
        if (b(9)) padPause = true;
      }
    }
    if (padPause && !this.padPause) this.pauseLatch = true;
    this.padPause = padPause;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    this.mx = x;
    this.my = y;
    if (l > 0.1) this.moved = true;
  },

  takePause() {
    const p = this.pauseLatch;
    this.pauseLatch = false;
    return p;
  },

  draw(ctx) {
    const s = this.stick;
    if (!s.on) return;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = 'rgba(10,12,30,0.45)';
    circle(ctx, s.ox, s.oy, this.R);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(255,240,200,0.7)';
    ctx.stroke();
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), m = Math.min(d, this.R);
    const kx = d > 0 ? s.ox + (dx / d) * m : s.ox, ky = d > 0 ? s.oy + (dy / d) * m : s.oy;
    ctx.globalAlpha = 0.8;
    const g = ctx.createRadialGradient(kx - 6, ky - 6, 2, kx, ky, 24);
    g.addColorStop(0, '#fff6d8');
    g.addColorStop(1, '#ffb040');
    ctx.fillStyle = g;
    circle(ctx, kx, ky, 22);
    ctx.fill();
    ctx.restore();
  },
};

// ===== 04-grid.js =====
// ---------- Spatial hash for fast neighbour queries ----------
// The world is unbounded, so cells wrap around a 64x64 table. Items from far-away cells that
// alias into the same bucket are rejected by the callers' distance checks.
const GRID_C = 40;
const GRID_N = 64;
const GRID_MASK = GRID_N - 1;

class Grid {
  constructor(max) {
    this.head = new Int32Array(GRID_N * GRID_N).fill(-1);
    this.next = new Int32Array(max);
    this.items = new Array(max);
    this.max = max;
    this.n = 0;
  }

  clear() {
    this.head.fill(-1);
    this.n = 0;
  }

  insert(o) {
    if (this.n >= this.max) return;
    const i = this.n++;
    this.items[i] = o;
    const k = ((Math.floor(o.y / GRID_C) & GRID_MASK) << 6) | (Math.floor(o.x / GRID_C) & GRID_MASK);
    this.next[i] = this.head[k];
    this.head[k] = i;
  }

  // Fills `out` with items in cells overlapping the square around (x, y); returns the count.
  query(x, y, r, out) {
    let x0 = Math.floor((x - r) / GRID_C), x1 = Math.floor((x + r) / GRID_C);
    let y0 = Math.floor((y - r) / GRID_C), y1 = Math.floor((y + r) / GRID_C);
    if (x1 - x0 >= GRID_N) x1 = x0 + GRID_N - 1;
    if (y1 - y0 >= GRID_N) y1 = y0 + GRID_N - 1;
    let n = 0;
    const head = this.head, next = this.next, items = this.items;
    for (let cy = y0; cy <= y1; cy++) {
      const row = (cy & GRID_MASK) << 6;
      for (let cx = x0; cx <= x1; cx++) {
        for (let i = head[row | (cx & GRID_MASK)]; i !== -1; i = next[i]) out[n++] = items[i];
      }
    }
    return n;
  }
}

// ===== 05-run.js =====
// ---------- One run: player, pickups, levels, chests, damage (pure simulation, no DOM) ----------
// Shared query buffers. The simulation is single-threaded; each call site uses its own buffer so
// nested queries (an explosion triggered by a hit) never clobber a list that is being walked.
const Q1 = new Array(4096), Q2 = new Array(4096), Q3 = new Array(4096), QS = new Array(4096), QB = new Array(4096);

class Run {
  constructor(cfg) {
    this.cfg = cfg;
    this.rng = new RNG(cfg.seed || 1);
    this.stageIdx = cfg.stage || 0;
    this.stage = STAGES[this.stageIdx];
    this.charKey = cfg.char || 'lumen';
    this.char = CHARACTERS[this.charKey];
    this.mode = cfg.mode || 'normal'; // normal | quick | daily
    this.endless = !!cfg.endless;
    this.mods = {};
    for (const m of cfg.mods || []) this.mods[m] = true;
    this.scale = this.mode === 'quick' ? 3 : 1; // night seconds per real second
    this.viewW = cfg.viewW || 420;
    this.viewH = cfg.viewH || 900;
    this.time = 0; // real seconds
    this.T = 0; // night seconds (drives the spawner and enemy scaling)
    this.stepN = 0;
    this.over = false;
    this.won = false;
    this.dawnT = 0;
    this.events = [];
    this.enemies = [];
    this.projs = [];
    this.eprojs = [];
    this.zones = [];
    this.drops = [];
    this.booms = [];
    this.alive = 0;
    this.grid = new Grid(1400);
    this.nextId = 1;
    this.level = 1;
    this.xp = 0;
    this.xpNext = xpNeed(1);
    this.pendingLevels = 0;
    this.kills = 0;
    this.byType = {};
    this.gold = 0;
    this.chestsOpened = 0;
    this.hearts = 0;
    this.minis = 0;
    this.bosses = 0;
    this.evolved = {};
    this.weapons = [];
    this.passives = [];
    this.banished = {};
    this.dmgBy = {};
    this.hurtBy = {};
    this.chests = [];
    this.power = cfg.power || {};
    this.unlocked = (cfg.weapons || BASE_WEAPONS.slice(0, 8)).slice();
    this.rerolls = this.power.reroll || 0;
    this.skips = this.power.skip || 0;
    this.banishes = this.power.banish || 0;
    this.revivals = this.power.revival || 0;
    this.gemCount = 0;
    this.bigGem = null;
    this.vacuum = 0;
    this.boss = null;
    this.hasZero = false;
    this.wind = { x: 0, y: 0 };
    this.dmgEvents = 0;
    this.player = { x: 0, y: 0, r: 11, hp: 100, fx: 1, dirX: 1, dirY: 0, mx: 0, my: 0, moving: false, hurtT: 0, inv: 0, slowT: 0, walk: 0 };
    this.stats = null;
    if (!this.unlocked.includes(this.char.weapon)) this.unlocked.push(this.char.weapon);
    this.recalc();
    this.player.hp = this.stats.maxHp;
    this.addWeapon(this.char.weapon);
    this.director = new Director(this);
  }

  // ----- stats -----
  passiveLvl(k) {
    for (const p of this.passives) if (p.key === k) return p.lvl;
    return 0;
  }

  recalc() {
    const P = this.power, ch = this.char.mods, pl = (k) => this.passiveLvl(k), M = this.mods;
    const s = {
      might: 1 + 0.05 * (P.might || 0) + 0.1 * pl('might'),
      cd: Math.max(0.35, 1 - 0.03 * (P.cd || 0) - 0.08 * pl('haste') + (ch.cd || 0)),
      area: 1 + 0.05 * (P.area || 0) + 0.1 * pl('area') + (ch.area || 0),
      dur: 1 + 0.06 * (P.dur || 0) + 0.12 * pl('duration'),
      amount: (P.amount || 0) + pl('multishot') + (ch.amount || 0),
      speed: 1 + 0.05 * (P.speed || 0) + 0.1 * pl('swiftness') + (ch.speed || 0),
      vel: 1 + 0.12 * pl('velocity'),
      maxHp: 100 * (1 + 0.1 * (P.maxHp || 0) + 0.2 * pl('vitality') + (ch.maxHp || 0)),
      regen: 0.1 * (P.regen || 0) + 0.25 * pl('regen'),
      armor: (P.armor || 0) + pl('armor') + (ch.armor || 0),
      magnet: 44 * (1 + 0.2 * (P.magnet || 0) + 0.35 * pl('magnet')),
      luck: 1 + 0.08 * (P.luck || 0) + 0.1 * pl('luck'),
      growth: 1 + 0.04 * (P.growth || 0),
      greed: (1 + 0.1 * (P.greed || 0)) * this.stage.gold,
    };
    if (M.glass) { s.might *= 1.6; s.maxHp *= 0.5; }
    if (M.lucky) s.luck += 0.5;
    if (M.swarm) s.growth *= 1.3;
    if (M.giant) s.growth *= 1.5;
    if (M.greedy) s.greed *= 2;
    if (M.quick) s.speed *= 1.25;
    if (this.mode === 'quick') { s.growth *= 2.4; s.greed *= 0.6; }
    s.maxHp = Math.round(s.maxHp);
    s.crit = 0.05 * s.luck;
    const p = this.player;
    if (this.stats) {
      const gain = s.maxHp - this.stats.maxHp;
      if (gain > 0) p.hp += gain;
    }
    p.hp = Math.min(p.hp, s.maxHp);
    this.stats = s;
    for (const w of this.weapons) w.st = this.weaponStats(w);
    this.hasZero = this.weapons.some((w) => w.key === 'zero');
  }

  weaponStats(w) {
    const d = WEAPONS[w.key], b = d.base, s = this.stats;
    let dmg = b.dmg, cd = 0, amount = b.amount, area = 0, speed = 0, dur = 0, pierce = b.pierce, chain = b.chain || 0;
    if (d.lv) {
      for (let i = 0; i < w.lvl - 1; i++) {
        const x = d.lv[i];
        dmg += x.dmg || 0; cd += x.cd || 0; amount += x.amount || 0; area += x.area || 0;
        speed += x.speed || 0; dur += x.dur || 0; pierce += x.pierce || 0; chain += x.chain || 0;
      }
    }
    return {
      dmg: dmg * s.might,
      cd: b.cd * (1 + cd) * s.cd,
      amount: b.amount > 0 ? amount + s.amount : 0,
      area: b.area * (1 + area) * s.area,
      speed: b.speed * (1 + speed) * s.vel,
      dur: b.dur * (1 + dur) * s.dur,
      pierce, chain,
      knock: b.knock,
      interval: b.interval || 0.5,
    };
  }

  // ----- inventory -----
  family(k) {
    for (const w of this.weapons) if (w.key === k || WEAPONS[w.key].evolved === k) return w;
    return null;
  }

  addWeapon(key) {
    const w = { key, lvl: 1, slot: this.weapons.length, t: 0.4, st: null, s: {} };
    this.weapons.push(w);
    w.st = this.weaponStats(w);
    this.events.push(['newWeapon', key]);
    return w;
  }

  addPassive(key) {
    this.passives.push({ key, lvl: 1 });
    this.recalc();
  }

  upgradable() {
    const out = [];
    for (const w of this.weapons) if (!WEAPONS[w.key].evolved && w.lvl < WEAPON_MAX) out.push({ kind: 'weapon', key: w.key, lvl: w.lvl + 1 });
    for (const p of this.passives) if (p.lvl < PASSIVES[p.key].max) out.push({ kind: 'passive', key: p.key, lvl: p.lvl + 1 });
    return out;
  }

  evolvable() {
    for (const w of this.weapons) {
      const d = WEAPONS[w.key];
      if (d.evo && w.lvl >= WEAPON_MAX && this.passiveLvl(d.pair) > 0) return w;
    }
    return null;
  }

  rollChoices() {
    const opts = [];
    for (const o of this.upgradable()) if (!this.banished[o.key]) { o.w = o.kind === 'weapon' ? 1.3 : 1.1; opts.push(o); }
    if (this.weapons.length < MAX_WEAPONS) {
      for (const k of this.unlocked) if (!this.family(k) && !this.banished[k]) opts.push({ kind: 'weapon', key: k, lvl: 1, isNew: true, w: 1 });
    }
    if (this.passives.length < MAX_PASSIVES) {
      for (const k of PASSIVE_KEYS) if (!this.passiveLvl(k) && !this.banished[k]) opts.push({ kind: 'passive', key: k, lvl: 1, isNew: true, w: 0.8 });
    }
    const n = this.rng.next() < Math.min(0.6, (this.stats.luck - 1) * 1.2) ? 4 : 3;
    const out = [];
    while (out.length < n && opts.length) {
      let tot = 0;
      for (const o of opts) tot += o.w;
      let r = this.rng.next() * tot, i = 0;
      for (; i < opts.length - 1; i++) { r -= opts[i].w; if (r <= 0) break; }
      out.push(opts[i]);
      opts.splice(i, 1);
    }
    if (!out.length) out.push({ kind: 'gold', v: 25 }, { kind: 'heal', v: 30 });
    return out;
  }

  applyChoice(c) {
    this.upgrade(c);
    this.pendingLevels = Math.max(0, this.pendingLevels - 1);
  }

  upgrade(c) {
    if (c.kind === 'weapon') {
      const w = this.family(c.key);
      if (w) { w.lvl = Math.min(WEAPON_MAX, w.lvl + 1); w.st = this.weaponStats(w); } else this.addWeapon(c.key);
    } else if (c.kind === 'passive') {
      const p = this.passives.find((x) => x.key === c.key);
      if (p) p.lvl = Math.min(PASSIVES[p.key].max, p.lvl + 1);
      else this.passives.push({ key: c.key, lvl: 1 });
      this.recalc();
    } else if (c.kind === 'gold') {
      this.gold += Math.round(c.v * this.stats.greed);
    } else if (c.kind === 'heal') {
      this.heal(c.v);
    }
  }

  skipLevel() {
    if (this.skips <= 0) return false;
    this.skips--;
    this.pendingLevels = Math.max(0, this.pendingLevels - 1);
    return true;
  }

  evolve(w) {
    const from = w.key, to = WEAPONS[from].evo;
    w.key = to;
    w.lvl = WEAPON_MAX;
    w.s = {};
    w.t = 0.2;
    this.dmgBy[to] = this.dmgBy[from] || 0;
    this.evolved[to] = 1;
    this.recalc();
    this.events.push(['evolve', from, to]);
    return to;
  }

  // Chests evolve weapons when a recipe is ready, otherwise they upgrade random items.
  openChest(chest) {
    this.chestsOpened++;
    const L = this.stats.luck, r = this.rng.next();
    let n = chest.boss ? (r < 0.3 * L ? 5 : 3) : (r < 0.03 * L ? 5 : r < 0.13 * L ? 3 : 1);
    const items = [];
    for (let i = 0; i < n; i++) {
      const ew = this.evolvable();
      if (ew) {
        const from = ew.key;
        items.push({ kind: 'evolve', key: this.evolve(ew), from });
        continue;
      }
      const ups = this.upgradable();
      if (!ups.length) break;
      const c = ups[this.rng.int(0, ups.length - 1)];
      this.upgrade(c);
      items.push(c);
    }
    const gold = Math.round(this.rng.int(25, 60) * (chest.boss ? 3 : 1) * this.stats.greed);
    this.gold += gold;
    return { items, gold, boss: !!chest.boss };
  }

  // ----- player -----
  heal(v) {
    const p = this.player;
    const before = p.hp;
    p.hp = Math.min(this.stats.maxHp, p.hp + v);
    if (p.hp - before >= 1) this.events.push(['heal', p.hp - before]);
  }

  hurt(dmg, src) {
    const p = this.player;
    if (p.inv > 0 || this.over || this.dawnT > 0) return;
    const d = Math.max(1, dmg - this.stats.armor);
    if (src) this.hurtBy[src] = (this.hurtBy[src] || 0) + d;
    p.hp -= d;
    p.hurtT = 0.22;
    p.inv = 0.06;
    this.events.push(['hurt', d]);
    if (p.hp <= 0) {
      if (this.revivals > 0) {
        this.revivals--;
        p.hp = this.stats.maxHp * 0.5;
        p.inv = 2;
        this.blast(p.x, p.y, 160, 9999, true);
        this.events.push(['revive']);
      } else {
        p.hp = 0;
        this.over = true;
        this.won = false;
        this.events.push(['death']);
      }
    }
  }

  setMove(x, y) {
    this.player.mx = x;
    this.player.my = y;
  }

  setView(w, h) {
    this.viewW = w;
    this.viewH = h;
  }

  updatePlayer(dt) {
    const p = this.player, s = this.stats;
    let spd = 105 * s.speed;
    if (p.slowT > 0) { spd *= 0.6; p.slowT -= dt; }
    p.x += (p.mx * spd + this.wind.x) * dt;
    p.y += (p.my * spd + this.wind.y) * dt;
    const l = Math.hypot(p.mx, p.my);
    p.moving = l > 0.1;
    if (p.moving) {
      p.dirX = p.mx / l;
      p.dirY = p.my / l;
      if (Math.abs(p.mx) > 0.15) p.fx = p.mx > 0 ? 1 : -1;
      p.walk += dt * (4 + 6 * l);
    }
    if (s.regen > 0 && p.hp < s.maxHp) p.hp = Math.min(s.maxHp, p.hp + s.regen * dt);
    if (p.inv > 0) p.inv -= dt;
    if (p.hurtT > 0) p.hurtT -= dt;
    if (this.vacuum > 0) this.vacuum -= dt;
  }

  // ----- XP, drops and pickups -----
  gainXp(v) {
    this.xp += v * this.stats.growth;
    while (this.xp >= this.xpNext) {
      this.xp -= this.xpNext;
      this.level++;
      this.xpNext = xpNeed(this.level);
      this.pendingLevels++;
      this.events.push(['level', this.level]);
    }
  }

  drop(k, x, y, v) {
    const d = { k, x, y, v: v || 0, mag: false, sp: 0, t: 0, dead: false };
    this.drops.push(d);
    return d;
  }

  dropGem(x, y, v) {
    if (this.gemCount >= 300) {
      if (!this.bigGem || this.bigGem.dead) {
        this.bigGem = this.drop('gem', x, y, 0);
        this.bigGem.big = true;
        this.gemCount++;
      }
      this.bigGem.v += v;
      return;
    }
    this.gemCount++;
    this.drop('gem', x + this.rng.range(-3, 3), y + this.rng.range(-3, 3), v);
  }

  collect(d) {
    d.dead = true;
    switch (d.k) {
      case 'gem':
        this.gemCount--;
        this.gainXp(d.v);
        this.events.push(['gem', d.v]);
        break;
      case 'heart':
        this.hearts++;
        this.heal(30);
        break;
      case 'coin':
      case 'bag': {
        const g = Math.max(1, Math.round(d.v * this.stats.greed));
        this.gold += g;
        this.events.push(['coin', g]);
        break;
      }
      case 'magnet':
        this.vacuum = 3;
        this.events.push(['magnet']);
        break;
      case 'bomb':
        this.blast(this.player.x, this.player.y, Math.max(this.viewW, this.viewH) * 0.75, 9999, false);
        this.events.push(['bomb', this.player.x, this.player.y]);
        break;
      case 'chest':
        this.chests.push(d);
        this.events.push(['chest']);
        break;
    }
  }

  updateDrops(dt) {
    const p = this.player, mr = this.stats.magnet, mr2 = mr * mr, vac = this.vacuum > 0;
    for (const d of this.drops) {
      if (d.dead) continue;
      d.t += dt;
      const dx = p.x - d.x, dy = p.y - d.y, d2 = dx * dx + dy * dy;
      if (d.k === 'chest') {
        if (d2 < (p.r + 16) * (p.r + 16)) this.collect(d);
        continue;
      }
      if (!d.mag && (d2 < mr2 || (vac && d.k === 'gem'))) {
        d.mag = true;
        d.sp = -70;
      }
      if (d.mag) {
        d.sp = Math.min(900, d.sp + 1300 * dt);
        const dist = Math.sqrt(d2) || 1;
        const mv = Math.min(dist, d.sp * dt);
        d.x += (dx / dist) * mv;
        d.y += (dy / dist) * mv;
        if (dist < p.r + 6) this.collect(d);
      } else if (d.k !== 'gem' && d.t > 60) {
        d.dead = true; // stray items fade after a minute; gems stay
      }
    }
  }

  // ----- combat helpers -----
  onScreen(e, margin) {
    const p = this.player, m = margin || 0;
    return Math.abs(e.x - p.x) < this.viewW / 2 + m && Math.abs(e.y - p.y) < this.viewH / 2 + m;
  }

  isTarget(e) { return !e.dead && !e.prop && e.spawnT <= 0; }

  // Up to n distinct targets sorted by distance (repeats the list if there are fewer).
  nearestList(x, y, maxR, n, out) {
    let r = 140, cnt = 0;
    out.length = 0;
    while (true) {
      cnt = this.grid.query(x, y, r, Q2);
      const r2 = r * r;
      for (let i = 0; i < cnt; i++) {
        const e = Q2[i];
        if (!this.isTarget(e)) continue;
        const dx = e.x - x, dy = e.y - y, d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        e._d = d2;
        out.push(e);
      }
      if (out.length >= n || r >= maxR) break;
      out.length = 0;
      r = Math.min(maxR, r * 2);
    }
    out.sort((a, b) => a._d - b._d);
    if (out.length > n) out.length = n;
    return out;
  }

  nearest(x, y, maxR) {
    const l = this.nearestList(x, y, maxR, 1, NEAR_TMP);
    return l.length ? l[0] : null;
  }

  randomOnScreen() {
    const es = this.enemies, n = es.length;
    if (!n) return null;
    for (let tries = 0; tries < 24; tries++) {
      const e = es[this.rng.int(0, n - 1)];
      if (this.isTarget(e) && this.onScreen(e, -10)) return e;
    }
    return null;
  }

  hit(e, dmg, w, kx, ky, knock) {
    if (e.dead) return;
    if (e.prop) { this.kill(e); return; }
    let crit = false;
    if (this.rng.next() < this.stats.crit) { dmg *= 2; crit = true; }
    if (e.shield && kx * e.fx < -0.3) dmg *= 0.35;
    if (e.frozen > 0 && this.hasZero) dmg *= 1.5;
    e.hp -= dmg;
    e.flash = 0.12;
    if (w) this.dmgBy[w.key] = (this.dmgBy[w.key] || 0) + dmg;
    if (knock && !e.boss) {
      const k = knock * 55 * e.kres;
      e.kx += kx * k;
      e.ky += ky * k;
    }
    if (this.dmgEvents < 30) {
      this.dmgEvents++;
      this.events.push(['dmg', e.x, e.y - e.r, dmg, crit]);
    }
    if (e.hp <= 0) this.kill(e);
  }

  // Damage every enemy touching a circle. interval > 0 limits repeat hits per weapon slot.
  areaHit(x, y, r, dmg, w, interval, knock, buf, onEach) {
    const n = this.grid.query(x, y, r + 30, buf);
    const slot = w ? w.slot : 6;
    let hits = 0;
    for (let i = 0; i < n; i++) {
      const e = buf[i];
      if (e.dead || e.spawnT > 0) continue;
      const dx = e.x - x, dy = e.y - y, rr = r + e.r, d2 = dx * dx + dy * dy;
      if (d2 > rr * rr) continue;
      if (interval > 0) {
        if (e.hc[slot] > this.time) continue;
        e.hc[slot] = this.time + interval;
      }
      const d = Math.sqrt(d2) || 1;
      if (onEach) onEach(e);
      this.hit(e, dmg, w, dx / d, dy / d, knock);
      hits++;
    }
    return hits;
  }

  // Holy bomb / revive blast: kills ordinary enemies, chunks bosses.
  blast(x, y, r, dmg, quiet) {
    const n = this.grid.query(x, y, r, QB);
    for (let i = 0; i < n; i++) {
      const e = QB[i];
      if (e.dead || e.prop) continue;
      if (Math.abs(e.x - x) > r || Math.abs(e.y - y) > r) continue;
      if (e.boss) this.hit(e, e.maxHp * 0.04, null, 0, 0, 0);
      else this.hit(e, dmg, null, 0, 0, 0);
    }
    if (!quiet) this.events.push(['flash']);
  }

  kill(e) {
    if (e.dead) return;
    e.dead = true;
    if (e.prop) {
      this.propDrop(e);
      this.events.push(['prop', e.x, e.y]);
      return;
    }
    this.events.push(['kill', e.x, e.y, e.type, e.boss ? 2 : e.elite ? 1 : 0, e.r]);
    if (e.noReward) return;
    this.kills++;
    this.byType[e.type] = (this.byType[e.type] || 0) + 1;
    if (e.boss) { this.onBossDead(e); return; }
    const def = e.def;
    this.dropGem(e.x, e.y, e.elite ? def.xp * 12 + 10 : def.xp);
    if (e.elite) this.drop('chest', e.x, e.y);
    const L = this.stats.luck, r = this.rng.next();
    if (r < 0.0035 * L) this.drop('heart', e.x + 6, e.y);
    else if (r < 0.0235 * L) this.drop('coin', e.x + 6, e.y, this.rng.int(1, 2));
    else if (r < 0.026 * L) this.drop('bag', e.x + 6, e.y, 20);
    else if (r < 0.027 * L) this.drop('magnet', e.x + 6, e.y);
    onEnemyDeath(this, e);
  }

  propDrop(e) {
    const k = this.rng.weighted([['coin', 30], ['heart', 26], ['magnet', 14], ['bomb', 10], ['bag', 12], ['chest', 3]]);
    this.drop(k, e.x, e.y, k === 'coin' ? 5 : k === 'bag' ? 25 : 0);
  }

  onBossDead(e) {
    if (this.boss === e) this.boss = null;
    const ch = this.drop('chest', e.x, e.y);
    ch.boss = true;
    this.dropGem(e.x, e.y + 14, 60);
    if (e.final) {
      this.bosses++;
      if (!this.endless) {
        this.dawnT = 3.5;
        for (const o of this.enemies) if (!o.dead && !o.prop) { o.noReward = true; this.kill(o); }
        this.eprojs.length = 0;
        this.events.push(['dawn']);
        return;
      }
    } else this.minis++;
    this.events.push(['bossDown', e.bossKey, !!e.final]);
  }

  // ----- the main step -----
  step() {
    if (this.over) return;
    const dt = SIM_DT;
    this.stepN++;
    this.time += dt;
    if (this.dawnT <= 0) this.T += dt * this.scale;
    this.dmgEvents = 0;
    const g = this.grid;
    g.clear();
    for (const e of this.enemies) g.insert(e);
    this.updatePlayer(dt);
    if (this.dawnT <= 0) this.director.update(dt);
    for (const e of this.enemies) if (!e.dead) updateEnemy(this, e, dt);
    this.separate();
    this.contact();
    for (const w of this.weapons) updateWeapon(this, w, dt);
    this.updateProjs(dt);
    this.updateZones(dt);
    this.updateEProjs(dt);
    this.updateDrops(dt);
    processBooms(this);
    compact(this.enemies);
    compact(this.projs);
    compact(this.eprojs);
    compact(this.zones);
    compact(this.drops);
    if (this.dawnT > 0) {
      this.dawnT -= dt;
      this.player.hp = Math.min(this.stats.maxHp, this.player.hp + 20 * dt);
      if (this.dawnT <= 0) {
        // collect everything left on the field before the sun is up
        for (const d of this.drops) if (!d.dead) this.collect(d);
        for (const c of this.chests) this.openChest(c);
        this.chests.length = 0;
        this.over = true;
        this.won = true;
        this.events.push(['win']);
      }
    }
  }

  separate() {
    const es = this.enemies, g = this.grid, p = this.player;
    for (const a of es) {
      if (a.dead || a.prop) continue;
      // keep out of the player's body (the player is never blocked)
      const px = a.x - p.x, py = a.y - p.y, pr = a.r + p.r - 4, pd2 = px * px + py * py;
      if (pd2 < pr * pr && pd2 > 0.01) {
        const pd = Math.sqrt(pd2), push = (pr - pd) * 0.5;
        a.x += (px / pd) * push;
        a.y += (py / pd) * push;
      }
      if (a.ghost) continue;
      const n = g.query(a.x, a.y, a.r + 26, QS);
      for (let i = 0; i < n; i++) {
        const b = QS[i];
        if (b === a || b.dead || b.ghost || b.prop) continue;
        let dx = a.x - b.x, dy = a.y - b.y;
        const rr = a.r + b.r;
        let d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (d2 < 0.0001) { dx = (a.id % 7) - 3 + 0.5; dy = (a.id % 5) - 2 + 0.5; d2 = dx * dx + dy * dy; }
        const d = Math.sqrt(d2), over = rr - d;
        if (a.boss) {
          if (!b.boss) { b.x -= (dx / d) * over * 0.6; b.y -= (dy / d) * over * 0.6; }
          continue;
        }
        if (b.boss) continue;
        const wa = b.mass / (a.mass + b.mass);
        a.x += (dx / d) * over * 0.5 * wa;
        a.y += (dy / d) * over * 0.5 * wa;
      }
    }
  }

  contact() {
    const p = this.player;
    const n = this.grid.query(p.x, p.y, 70, Q3);
    for (let i = 0; i < n; i++) {
      const e = Q3[i];
      if (e.dead || e.prop || e.tcd > 0 || e.spawnT > 0) continue;
      const dx = e.x - p.x, dy = e.y - p.y, rr = e.r + p.r;
      if (dx * dx + dy * dy > rr * rr) continue;
      e.tcd = e.ai === 'sweep' ? 99 : 0.5; // a passing swarm only bites once
      this.hurt(e.dmg, e.boss ? 'boss' : e.type);
    }
  }

  updateProjs(dt) {
    const g = this.grid;
    for (const p of this.projs) {
      if (p.dead) continue;
      p.t += dt;
      if (p.fn) p.fn(this, p, dt);
      else { p.x += p.vx * dt; p.y += p.vy * dt; }
      if (p.dead) continue;
      if (p.t >= p.life) {
        p.dead = true;
        if (p.onEnd) p.onEnd(this, p);
        continue;
      }
      if (p.noHit) continue;
      const n = g.query(p.x, p.y, p.r + 30, Q1);
      for (let i = 0; i < n; i++) {
        const e = Q1[i];
        if (e.dead || e.spawnT > 0) continue;
        const dx = e.x - p.x, dy = e.y - p.y, rr = p.r + e.r;
        if (dx * dx + dy * dy > rr * rr) continue;
        if (p.hm) {
          const last = p.hm.get(e.id);
          if (last !== undefined && this.time < last) continue;
          p.hm.set(e.id, this.time + p.rehit);
        } else {
          if (p.hits.indexOf(e.id) >= 0) continue;
          p.hits.push(e.id);
        }
        const sp = Math.hypot(p.vx, p.vy) || 1;
        if (p.onHit) p.onHit(this, p, e);
        else this.hit(e, p.dmg, p.w, p.vx / sp, p.vy / sp, p.knock);
        if (--p.pierce <= 0) {
          p.dead = true;
          if (p.onEnd) p.onEnd(this, p);
          break;
        }
      }
    }
  }

  updateZones(dt) {
    for (const z of this.zones) {
      if (z.dead) continue;
      z.t += dt;
      if (z.fn) z.fn(this, z, dt);
      if (z.t >= z.life) {
        z.dead = true;
        if (z.onEnd) z.onEnd(this, z);
      }
    }
  }

  updateEProjs(dt) {
    const p = this.player;
    for (const b of this.eprojs) {
      if (b.dead) continue;
      b.t += dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.t >= b.life) { b.dead = true; continue; }
      const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r - 2;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true;
        this.hurt(b.dmg, b.k);
        if (b.slow) p.slowT = 1.2;
      }
    }
  }

  // Live numbers used by achievements while a run is in progress.
  summary() {
    return {
      time: this.time, level: this.level, kills: this.kills, byType: this.byType, minis: this.minis, bosses: this.bosses,
      evolved: this.evolved, chests: this.chestsOpened, weapons: this.weapons.length, gold: this.gold, won: this.won,
      stage: this.stage.key, char: this.charKey, endless: this.endless, hearts: this.hearts, mode: this.mode,
    };
  }
}

const NEAR_TMP = [];

function compact(arr) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) {
    const o = arr[i];
    if (!o.dead) arr[n++] = o;
  }
  arr.length = n;
}

// ===== 06-weapons.js =====
// ---------- Weapons: how each one fires, its projectiles and ground effects ----------
const TGT = [];

function proj(run, w, o) {
  const p = {
    k: 'bolt', x: 0, y: 0, vx: 0, vy: 0, r: 5, dmg: w.st.dmg, pierce: w.st.pierce || 1, life: 1, t: 0, w,
    knock: w.st.knock, hits: null, hm: null, rehit: 0, fn: null, onHit: null, onEnd: null, dead: false, ang: 0, noHit: false,
  };
  Object.assign(p, o);
  if (p.rehit > 0) p.hm = new Map();
  else p.hits = [];
  run.projs.push(p);
  return p;
}

function zone(run, o) {
  const z = { k: 'pool', x: 0, y: 0, r: 30, life: 1, t: 0, dead: false, fn: null, w: null };
  Object.assign(z, o);
  run.zones.push(z);
  return z;
}

function sfx(run, name) { run.events.push(['sfx', name]); }

// Cooldown helper: returns true when the weapon should fire now.
function ready(w, dt) {
  w.t -= dt;
  if (w.t > 0) return false;
  w.t = Math.max(0.05, w.t + w.st.cd);
  return true;
}

function ellipseHit(run, cx, cy, rx, ry, w, dirx) {
  const n = run.grid.query(cx, cy, Math.max(rx, ry) + 30, Q2);
  const st = w.st;
  let hits = 0;
  for (let i = 0; i < n; i++) {
    const e = Q2[i];
    if (e.dead || e.spawnT > 0) continue;
    const dx = (e.x - cx) / (rx + e.r), dy = (e.y - cy) / (ry + e.r);
    if (dx * dx + dy * dy > 1) continue;
    run.hit(e, st.dmg, w, dirx, 0, st.knock);
    hits++;
  }
  return hits;
}

function segmentHit(run, x0, y0, x1, y1, width, w, interval) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, L = Math.hypot(x1 - x0, y1 - y0) || 1;
  const n = run.grid.query(mx, my, L / 2 + 30, Q2);
  const ux = (x1 - x0) / L, uy = (y1 - y0) / L, st = w.st;
  let hits = 0;
  for (let i = 0; i < n; i++) {
    const e = Q2[i];
    if (e.dead || e.spawnT > 0) continue;
    const ex = e.x - x0, ey = e.y - y0;
    const along = ex * ux + ey * uy;
    if (along < -e.r || along > L + e.r) continue;
    const perp = Math.abs(ex * uy - ey * ux);
    if (perp > width + e.r) continue;
    if (e.hc[w.slot] > run.time) continue;
    e.hc[w.slot] = run.time + interval;
    run.hit(e, st.dmg, w, -uy, ux, st.knock);
    hits++;
  }
  return hits;
}

function aimAt(run, maxR) {
  const p = run.player, e = run.nearest(p.x, p.y, maxR || 400);
  if (e) return Math.atan2(e.y - p.y, e.x - p.x);
  return Math.atan2(p.dirY, p.dirX);
}

// ----- individual weapons -----
function fireBolt(run, w, a, spd, r, life) {
  const p = run.player;
  proj(run, w, { k: w.key === 'storm' ? 'storm' : 'bolt', x: p.x, y: p.y - 4, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, life, pierce: w.st.pierce, ang: a });
}

function slashAt(run, w, side, yoff, big) {
  const p = run.player, st = w.st;
  const rx = 58 * st.area, ry = 22 * st.area * (big ? 1.25 : 1);
  const cx = p.x + side * rx * 0.85, cy = p.y + yoff;
  ellipseHit(run, cx, cy, rx, ry, w, side);
  zone(run, { k: 'slash', x: cx, y: cy, ox: side * rx * 0.85, oy: yoff, rx, ry, side, life: 0.22, big: !!big, col: WEAPONS[w.key].col, fn: followPlayer });
}

function followPlayer(run, z) {
  z.x = run.player.x + z.ox;
  z.y = run.player.y + z.oy;
}

function boomerangFn(run, p, dt) {
  if (!p.back) {
    p.spd -= 600 * dt;
    if (p.spd <= 0) { p.back = true; p.spd = 0; p.hm.clear(); }
    p.vx = p.dx * p.spd;
    p.vy = p.dy * p.spd;
  } else {
    const pl = run.player, dx = pl.x - p.x, dy = pl.y - p.y, d = Math.hypot(dx, dy) || 1;
    p.spd = Math.min(p.maxSpd, p.spd + 800 * dt);
    p.vx = (dx / d) * p.spd;
    p.vy = (dy / d) * p.spd;
    if (d < 16) p.dead = true;
  }
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.ang += 16 * dt;
}

function throwBoomerang(run, w, a) {
  const st = w.st, p = run.player, big = w.key === 'moons';
  const spd = 340 * st.speed * (big ? 1.1 : 1);
  proj(run, w, {
    k: big ? 'moon' : 'boom', x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), spd, maxSpd: spd * 1.3,
    r: 9 * st.area, life: 5, pierce: 999, rehit: 0.5, back: false, fn: boomerangFn,
  });
}

function zapChain(run, w, first, strikes) {
  const st = w.st, hitIds = [first.id];
  const pts = [first.x + run.rng.range(-30, 30), first.y - 260, first.x, first.y];
  let cur = first, dmg = st.dmg;
  const boom = w.key === 'tempest';
  run.hit(first, dmg, w, 0, 0, st.knock);
  if (boom) run.areaHit(first.x, first.y, 40 * st.area, dmg * 0.5, w, 0, 0.5, Q3);
  for (let c = 0; c < st.chain; c++) {
    const n = run.grid.query(cur.x, cur.y, 95 * st.area, Q3);
    let best = null, bd = 1e9;
    for (let i = 0; i < n; i++) {
      const e = Q3[i];
      if (!run.isTarget(e) || hitIds.indexOf(e.id) >= 0) continue;
      const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2;
      if (d < bd && d < (95 * st.area) ** 2) { bd = d; best = e; }
    }
    if (!best) break;
    hitIds.push(best.id);
    pts.push(best.x, best.y);
    dmg *= 0.85;
    run.hit(best, dmg, w, 0, 0, st.knock);
    if (boom) run.areaHit(best.x, best.y, 32 * st.area, dmg * 0.4, w, 0, 0.5, Q3);
    cur = best;
  }
  run.events.push(['zap', pts, boom]);
  strikes.n++;
}

function poolFn(run, z, dt) {
  if (z.creep) {
    const e = run.nearest(z.x, z.y, 220);
    if (e) {
      const dx = e.x - z.x, dy = e.y - z.y, d = Math.hypot(dx, dy) || 1;
      z.x += (dx / d) * 34 * dt;
      z.y += (dy / d) * 34 * dt;
    }
  }
  run.areaHit(z.x, z.y, z.r, z.w.st.dmg, z.w, z.w.st.interval, 0, Q1);
}

function flaskLand(run, p) {
  const st = p.w.st, inferno = p.w.key === 'inferno';
  zone(run, { k: 'pool', x: p.tx, y: p.ty, r: 34 * st.area, life: 2.4 * st.dur, w: p.w, fn: poolFn, creep: inferno, inferno });
  sfx(run, 'flask');
}

function flaskFn(run, p) {
  const u = Math.min(1, p.t / p.life);
  p.x = p.sx + (p.tx - p.sx) * u;
  p.y = p.sy + (p.ty - p.sy) * u - Math.sin(u * Math.PI) * 60;
  p.ang += 0.3;
}

function novaFn(run, z) {
  const u = Math.min(1, z.t / 0.45);
  z.cur = z.r * easeOut(u);
  if (u >= 1) return;
  const zero = z.w.key === 'zero', st = z.w.st;
  run.areaHit(z.x, z.y, z.cur, st.dmg, z.w, 0.6, st.knock, Q1, (e) => {
    if (zero && !e.boss) { e.frozen = Math.max(e.frozen, 2 * st.dur); }
    e.slow = Math.max(e.slow, e.boss ? 0.3 : 0.45);
    e.slowT = Math.max(e.slowT, 1.6 * st.dur);
  });
}

function orbFn(run, p, dt) {
  const pl = run.player, hw = run.viewW / 2 - 6, hh = run.viewH / 2 - 6;
  if (p.seek) {
    p.st -= dt;
    if (p.st <= 0) {
      p.st = 0.25;
      const e = run.nearest(p.x, p.y, 200);
      if (e) {
        const sp = Math.hypot(p.vx, p.vy), a0 = Math.atan2(p.vy, p.vx), a1 = Math.atan2(e.y - p.y, e.x - p.x);
        let da = a1 - a0;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const a = a0 + clamp(da, -0.5, 0.5);
        p.vx = Math.cos(a) * sp;
        p.vy = Math.sin(a) * sp;
      }
    }
  }
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.x > pl.x + hw) { p.x = pl.x + hw; p.vx = -Math.abs(p.vx); p.bounce = 0.15; }
  if (p.x < pl.x - hw) { p.x = pl.x - hw; p.vx = Math.abs(p.vx); p.bounce = 0.15; }
  if (p.y > pl.y + hh) { p.y = pl.y + hh; p.vy = -Math.abs(p.vy); p.bounce = 0.15; }
  if (p.y < pl.y - hh) { p.y = pl.y - hh; p.vy = Math.abs(p.vy); p.bounce = 0.15; }
  if (p.bounce > 0) p.bounce -= dt;
}

function missileFn(run, p, dt) {
  if (!p.tgt || p.tgt.dead) {
    p.rt -= dt;
    if (p.rt <= 0) { p.rt = 0.15; p.tgt = run.nearest(p.x, p.y, 320); }
  }
  if (p.tgt && !p.tgt.dead) {
    const a0 = Math.atan2(p.vy, p.vx), a1 = Math.atan2(p.tgt.y - p.y, p.tgt.x - p.x);
    let da = a1 - a0;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    const a = a0 + clamp(da, -7 * dt, 7 * dt);
    p.vx = Math.cos(a) * p.spd;
    p.vy = Math.sin(a) * p.spd;
  }
  p.spd = Math.min(p.spd + 300 * dt, p.maxSpd);
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.ang = Math.atan2(p.vy, p.vx);
}

function missileHit(run, p) {
  const st = p.w.st;
  run.areaHit(p.x, p.y, 26 * st.area, st.dmg, p.w, 0, st.knock, Q2);
  run.events.push(['boom', p.x, p.y, 26 * st.area, '#8affc1']);
}

function runeFn(run, z, dt) {
  if (z.cool > 0) { z.cool -= dt; return; }
  const n = run.grid.query(z.x, z.y, 40, Q1);
  for (let i = 0; i < n; i++) {
    const e = Q1[i];
    if (!run.isTarget(e)) continue;
    const dx = e.x - z.x, dy = e.y - z.y, rr = 12 + e.r;
    if (dx * dx + dy * dy > rr * rr) continue;
    const st = z.w.st;
    run.areaHit(z.x, z.y, 30 * st.area, st.dmg, z.w, 0, st.knock, Q2);
    run.events.push(['spike', z.x, z.y, 30 * st.area, z.glyph]);
    if (z.glyph) z.cool = 0.8;
    else z.dead = true;
    return;
  }
}

const WEAPON_IMPL = {
  bolt(run, w, dt) {
    const s = w.s;
    if (s.burst > 0) {
      s.bt -= dt;
      if (s.bt <= 0) {
        s.bt = 0.07;
        const tg = s.tg[(s.i++) % s.tg.length];
        const p = run.player;
        const a = tg && !tg.dead ? Math.atan2(tg.y - p.y, tg.x - p.x) : s.a;
        s.a = a;
        fireBolt(run, w, a + run.rng.range(-0.04, 0.04), 300 * w.st.speed, 5 * w.st.area, 1.6 * w.st.dur);
        s.burst--;
        sfx(run, 'bolt');
      }
      return;
    }
    w.t -= dt;
    if (w.t > 0) return;
    const p = run.player;
    const tg = run.nearestList(p.x, p.y, 420, w.st.amount, TGT);
    if (!tg.length) { w.t = 0.1; return; }
    w.t = w.st.cd;
    s.tg = tg.slice();
    s.i = 0;
    s.a = 0;
    s.burst = w.st.amount;
    s.bt = 0;
  },

  storm(run, w, dt) {
    if (!ready(w, dt)) return;
    const p = run.player;
    const tg = run.nearestList(p.x, p.y, 420, 6, TGT);
    if (!tg.length) { w.t = 0.1; return; }
    for (let i = 0; i < w.st.amount; i++) {
      const e = tg[run.rng.int(0, tg.length - 1)];
      fireBolt(run, w, Math.atan2(e.y - p.y, e.x - p.x) + run.rng.range(-0.08, 0.08), 380 * w.st.speed, 6 * w.st.area, 1.4 * w.st.dur);
    }
    sfx(run, 'bolt');
  },

  slash(run, w, dt) {
    const s = w.s;
    if (s.q && s.q.length) {
      s.qt -= dt;
      if (s.qt <= 0) {
        const side = s.q.shift();
        const yoff = s.n < 2 ? 0 : Math.floor(s.n / 2) % 2 ? -24 : 24;
        slashAt(run, w, side, yoff, w.key === 'dawn');
        s.n++;
        s.qt = 0.12;
        sfx(run, 'slash');
      }
    }
    if (!ready(w, dt)) return;
    const f = run.player.fx;
    s.q = [];
    for (let i = 0; i < w.st.amount; i++) s.q.push(i % 2 ? -f : f);
    s.qt = 0;
    s.n = 0;
  },

  dawn(run, w, dt) {
    WEAPON_IMPL.slash(run, w, dt);
    if (w.s.n === 1 && !w.s.launched) {
      w.s.launched = true;
      const p = run.player, st = w.st;
      for (const side of [-1, 1]) {
        proj(run, w, { k: 'crescent', x: p.x + side * 20, y: p.y, vx: side * 300 * st.speed, vy: 0, r: 18 * st.area, life: 1.1 * st.dur, pierce: 999, rehit: 99, ang: side });
      }
    }
    if (w.s.n === 0) w.s.launched = false;
  },

  blades(run, w, dt) {
    const s = w.s, st = w.st, p = run.player;
    const always = w.key === 'halo';
    if (s.ang == null) { s.ang = 0; s.on = false; s.tt = 0.3; }
    if (!always) {
      s.tt -= dt;
      if (s.tt <= 0) {
        s.on = !s.on;
        s.tt = s.on ? 3 * st.dur : st.cd;
        if (s.on) sfx(run, 'blades');
      }
    } else s.on = true;
    if (!s.on) return;
    s.n = st.amount;
    s.rad = 62 * st.area;
    s.size = 9 * st.area;
    s.ang += 3.4 * st.speed * dt;
    for (let i = 0; i < s.n; i++) {
      const a = s.ang + (i * TAU) / s.n;
      run.areaHit(p.x + Math.cos(a) * s.rad, p.y + Math.sin(a) * s.rad, s.size, st.dmg, w, st.interval, st.knock, Q1);
    }
  },
  halo(run, w, dt) { WEAPON_IMPL.blades(run, w, dt); },

  aura(run, w, dt) {
    const s = w.s, st = w.st, p = run.player, sanct = w.key === 'sanctum';
    s.r = 44 * st.area;
    s.pulse = Math.max(0, (s.pulse || 0) - dt * 3);
    if (!ready(w, dt)) return;
    s.pulse = 1;
    const hits = run.areaHit(p.x, p.y, s.r, st.dmg, w, 0, st.knock, Q1, sanct ? (e) => { e.slow = Math.max(e.slow, 0.4); e.slowT = Math.max(e.slowT, 0.8); } : null);
    if (sanct && hits > 0) run.heal(Math.min(2, 0.4 + hits * 0.05));
  },
  sanctum(run, w, dt) { WEAPON_IMPL.aura(run, w, dt); },

  boomerang(run, w, dt) {
    const s = w.s;
    if (s.burst > 0) {
      s.bt -= dt;
      if (s.bt <= 0) {
        s.bt = 0.12;
        s.burst--;
        throwBoomerang(run, w, aimAt(run, 360) + run.rng.range(-0.1, 0.1));
        sfx(run, 'throw');
      }
      return;
    }
    if (!ready(w, dt)) return;
    s.burst = w.st.amount;
    s.bt = 0;
  },

  moons(run, w, dt) {
    if (!ready(w, dt)) return;
    const a = aimAt(run, 360), n = w.st.amount;
    for (let i = 0; i < n; i++) throwBoomerang(run, w, a + (i * TAU) / n);
    sfx(run, 'throw');
  },

  lightning(run, w, dt) {
    if (!ready(w, dt)) return;
    const strikes = { n: 0 };
    for (let i = 0; i < w.st.amount; i++) {
      const e = run.randomOnScreen();
      if (e) zapChain(run, w, e, strikes);
    }
    if (!strikes.n) w.t = 0.15;
    else sfx(run, 'zap');
  },
  tempest(run, w, dt) { WEAPON_IMPL.lightning(run, w, dt); },

  flask(run, w, dt) {
    if (!ready(w, dt)) return;
    const p = run.player, st = w.st;
    for (let i = 0; i < st.amount; i++) {
      const e = run.randomOnScreen();
      let tx, ty;
      if (e) { tx = e.x + run.rng.range(-12, 12); ty = e.y + run.rng.range(-12, 12); }
      else { const a = run.rng.range(0, TAU), d = run.rng.range(40, 140); tx = p.x + Math.cos(a) * d; ty = p.y + Math.sin(a) * d; }
      proj(run, w, { k: 'flask', x: p.x, y: p.y, sx: p.x, sy: p.y, tx, ty, life: 0.45 + i * 0.06, noHit: true, fn: flaskFn, onEnd: flaskLand });
    }
    sfx(run, 'throw');
  },
  inferno(run, w, dt) { WEAPON_IMPL.flask(run, w, dt); },

  frost(run, w, dt) {
    if (!ready(w, dt)) return;
    const p = run.player;
    zone(run, { k: 'nova', x: p.x, y: p.y, r: 120 * w.st.area, cur: 0, life: 0.6, w, fn: novaFn, zero: w.key === 'zero' });
    sfx(run, 'frost');
  },
  zero(run, w, dt) { WEAPON_IMPL.frost(run, w, dt); },

  orb(run, w, dt) {
    if (!ready(w, dt)) return;
    const p = run.player, st = w.st, prism = w.key === 'prism';
    const base = aimAt(run, 400);
    for (let i = 0; i < st.amount; i++) {
      const a = base + (i * TAU) / st.amount + run.rng.range(-0.3, 0.3), spd = 250 * st.speed;
      proj(run, w, { k: prism ? 'prism' : 'orb', x: p.x, y: p.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 9 * st.area, life: 2.8 * st.dur, pierce: 999, rehit: 0.45, fn: orbFn, seek: prism, st: 0, bounce: 0 });
    }
    sfx(run, 'orb');
  },
  prism(run, w, dt) { WEAPON_IMPL.orb(run, w, dt); },

  beam(run, w, dt) {
    const s = w.s, st = w.st, p = run.player, solar = w.key === 'solar';
    if (s.ang == null) { s.ang = 0; s.on = false; s.tt = 0.5; }
    if (!solar) {
      s.tt -= dt;
      if (s.tt <= 0) {
        s.on = !s.on;
        s.tt = s.on ? 1.6 * st.dur : st.cd;
        if (s.on) sfx(run, 'beam');
      }
    } else s.on = true;
    if (!s.on) return;
    s.n = Math.max(1, st.amount);
    s.len = 150 * st.area;
    s.width = 9 * st.area;
    s.ang += 3.6 * st.speed * dt;
    let hits = 0;
    for (let i = 0; i < s.n; i++) {
      const a = s.ang + (i * TAU) / s.n;
      hits += segmentHit(run, p.x, p.y, p.x + Math.cos(a) * s.len, p.y + Math.sin(a) * s.len, s.width, w, st.interval);
    }
    if (solar && hits > 0) run.heal(Math.min(0.5, hits * 0.08));
  },
  solar(run, w, dt) { WEAPON_IMPL.beam(run, w, dt); },

  drones(run, w, dt) {
    const s = w.s, st = w.st, p = run.player, hive = w.key === 'hive';
    if (!s.d) { s.d = []; s.a = 0; }
    while (s.d.length < st.amount) s.d.push({ x: p.x, y: p.y, t: 0.3 + s.d.length * 0.25 });
    s.a += 1.3 * dt;
    const n = s.d.length;
    for (let i = 0; i < n; i++) {
      const d = s.d[i];
      const a = s.a + (i * TAU) / n, rad = 34 + (n > 3 ? 10 : 0);
      const tx = p.x + Math.cos(a) * rad, ty = p.y - 10 + Math.sin(a) * rad * 0.6;
      d.x += (tx - d.x) * Math.min(1, 8 * dt);
      d.y += (ty - d.y) * Math.min(1, 8 * dt);
      d.t -= dt;
      if (d.t <= 0) {
        const e = run.nearest(d.x, d.y, 320);
        if (!e) { d.t = 0.2; continue; }
        d.t = st.cd;
        const ang = Math.atan2(e.y - d.y, e.x - d.x) + run.rng.range(-0.6, 0.6), spd = 140 * st.speed;
        proj(run, w, { k: 'missile', x: d.x, y: d.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spd, maxSpd: 300 * st.speed, r: 5, life: 2.6, pierce: 1, tgt: e, rt: 0, fn: missileFn, onHit: missileHit, ang });
        sfx(run, 'missile');
      }
      if (hive && (run.stepN + i) % 4 === 0) {
        for (const g of run.drops) {
          if (g.mag || g.k !== 'gem') continue;
          const dx = g.x - d.x, dy = g.y - d.y;
          if (dx * dx + dy * dy < 50 * 50) { g.mag = true; g.sp = 120; }
        }
      }
    }
  },
  hive(run, w, dt) { WEAPON_IMPL.drones(run, w, dt); },

  runes(run, w, dt) {
    if (!ready(w, dt)) return;
    const p = run.player, st = w.st, glyph = w.key === 'glyph';
    let active = 0;
    for (const z of run.zones) if (z.k === 'rune' && z.w === w && !z.dead) active++;
    const max = (glyph ? 8 : 4) + 2 * st.amount;
    for (let i = 0; i < st.amount && active < max; i++, active++) {
      const e = run.randomOnScreen();
      let x, y;
      if (e && Math.hypot(e.x - p.x, e.y - p.y) < 220) { x = e.x + run.rng.range(-26, 26); y = e.y + run.rng.range(-26, 26); }
      else { const a = run.rng.range(0, TAU), d = run.rng.range(30, 130); x = p.x + Math.cos(a) * d; y = p.y + Math.sin(a) * d; }
      zone(run, { k: 'rune', x, y, r: 14, life: 8 * st.dur, w, fn: runeFn, cool: 0.25, glyph });
    }
  },
  glyph(run, w, dt) { WEAPON_IMPL.runes(run, w, dt); },
};

function updateWeapon(run, w, dt) {
  const fn = WEAPON_IMPL[w.key];
  if (fn) fn(run, w, dt);
}

// ===== 07-enemies.js =====
// ---------- Enemies: spawning, behaviour, bosses, stage hazards and the wave director ----------
const Q4 = new Array(4096);

// Later stages start a little tougher and ramp up much faster.
function hpMult(run) {
  const T = run.T, sh = run.stage.hp;
  let m = 1 + (sh - 1) * 0.12 + (Math.min(T, 900) / 60) * 0.12 * sh;
  if (T > 900) m *= 1 + ((T - 900) / 60) * 0.3;
  if (run.mods.giant) m *= 2;
  if (run.mode === 'quick') m *= 0.75;
  return m;
}

function dmgMult(run) {
  const T = run.T, sd = run.stage.dmg;
  let m = 1 + (sd - 1) * 0.15 + (Math.min(T, 900) / 900) * 0.6 * sd;
  m *= 0.6 + 0.4 * Math.min(1, T / 180); // a gentler first few minutes
  if (T > 900) m *= 1 + ((T - 900) / 60) * 0.08;
  if (run.mods.greedy) m *= 1.2;
  if (run.mode === 'quick') m *= 0.8;
  return m;
}

function spawnEnemy(run, type, x, y, o) {
  const def = ENEMIES[type];
  const hp = def.hp * (def.ai === 'prop' ? 1 : hpMult(run));
  const spd = def.spd * (run.mods.quick ? 1.25 : 1);
  const e = {
    id: run.nextId++, type, def, look: type, x, y, r: def.r, hp, maxHp: hp, spd, dmg: def.dmg * dmgMult(run),
    ai: def.ai, fly: !!def.fly, ghost: def.ai === 'ghost', shield: !!def.shield, prop: def.ai === 'prop',
    kres: def.kres == null ? 1 : def.kres, mass: def.r * def.r,
    kx: 0, ky: 0, fx: x < run.player.x ? 1 : -1, t: run.rng.range(0, 10), st: 0, sT: def.every ? def.every * run.rng.range(0.3, 1) : 0,
    side: run.rng.chance(0.5) ? 1 : -1, flash: 0, slow: 0, slowT: 0, frozen: 0, tcd: 0, hc: [0, 0, 0, 0, 0, 0, 0, 0],
    spawnT: 0, elite: false, boss: false, dead: false, noReward: false, vx: 0, vy: 0, life: 0,
  };
  if (o) Object.assign(e, o);
  run.enemies.push(e);
  return e;
}

function makeElite(e) {
  e.elite = true;
  e.hp = e.maxHp = e.maxHp * 14;
  e.r = Math.round(e.r * 1.45);
  e.dmg *= 1.5;
  e.mass *= 4;
  e.kres *= 0.25;
  return e;
}

// A point just outside the visible area, biased toward where the player is heading.
function spawnPoint(run, out) {
  const p = run.player, hw = run.viewW / 2 + 34, hh = run.viewH / 2 + 34;
  let a;
  if (p.moving && run.rng.chance(0.45)) a = Math.atan2(p.dirY, p.dirX) + run.rng.range(-1, 1);
  else a = run.rng.range(0, TAU);
  const c = Math.cos(a), s = Math.sin(a);
  const t = Math.min(hw / Math.max(1e-6, Math.abs(c)), hh / Math.max(1e-6, Math.abs(s)));
  out.x = p.x + c * t;
  out.y = p.y + s * t;
  return out;
}
const SPT = { x: 0, y: 0 };

function enemyShoot(run, e, dx, dy) {
  const sh = SHOTS[e.def.shot];
  const base = Math.atan2(dy, dx);
  for (let i = 0; i < sh.n; i++) {
    const a = base + (i - (sh.n - 1) / 2) * sh.spread;
    run.eprojs.push({ k: e.def.shot, x: e.x, y: e.y - 4, vx: Math.cos(a) * sh.spd, vy: Math.sin(a) * sh.spd, r: sh.r, dmg: e.dmg * sh.dmg, life: 4, t: 0, slow: !!sh.slow, dead: false });
  }
  run.events.push(['eshot', e.def.shot]);
}

function updateEnemy(run, e, dt) {
  if (e.prop) {
    const p = run.player;
    if (Math.abs(p.x - e.x) > 1400 || Math.abs(p.y - e.y) > 1400) e.dead = true;
    return;
  }
  const p = run.player;
  e.t += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.tcd > 0) e.tcd -= dt;
  if (e.spawnT > 0) { e.spawnT -= dt; return; }
  let dx = p.x - e.x, dy = p.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d;
  dy /= d;
  let spd = e.spd;
  if (e.slowT > 0) { e.slowT -= dt; spd *= 1 - e.slow; if (e.slowT <= 0) e.slow = 0; }
  if (e.frozen > 0) { e.frozen -= dt; spd = 0; }
  if (e.boss) { bossUpdate(run, e, dt, d, dx, dy, spd); return; }
  let mx = dx, my = dy;
  switch (e.ai) {
    case 'bat': {
      const w = Math.sin(e.t * 4 + e.id) * 0.75, c = Math.cos(w), s = Math.sin(w);
      mx = dx * c - dy * s;
      my = dx * s + dy * c;
      break;
    }
    case 'ghost': {
      const w = Math.sin(e.t * 2 + e.id) * 0.35, c = Math.cos(w), s = Math.sin(w);
      mx = dx * c - dy * s;
      my = dx * s + dy * c;
      break;
    }
    case 'hop':
      spd *= Math.max(0, Math.sin(e.t * 5 + e.id)) * 2.1;
      break;
    case 'sweep':
      mx = e.vx;
      my = e.vy;
      e.life -= dt;
      if (e.life <= 0) { e.dead = true; return; }
      break;
    case 'ranged': {
      const R = e.def.range;
      if (d < R * 0.6) { mx = -dx; my = -dy; spd *= 0.8; } else if (d < R) { mx = -dy * e.side; my = dx * e.side; spd *= 0.4; }
      e.sT -= dt;
      if (e.sT <= 0 && d < R * 1.3 && e.frozen <= 0 && run.onScreen(e, -16)) { e.sT = e.def.every * run.rng.range(0.9, 1.2); enemyShoot(run, e, dx, dy); }
      break;
    }
    case 'charge':
      if (e.st === 0) {
        if (d < 170 && e.frozen <= 0) { e.st = 1; e.sT = 0.7; e.cx = dx; e.cy = dy; }
      } else if (e.st === 1) {
        spd = 0;
        e.sT -= dt;
        if (e.sT <= 0) { e.st = 2; e.sT = 0.55; run.events.push(['sfx', 'charge']); }
      } else if (e.st === 2) {
        mx = e.cx;
        my = e.cy;
        spd = e.spd * 5;
        e.sT -= dt;
        if (e.sT <= 0) { e.st = 3; e.sT = 0.8; }
      } else {
        spd *= 0.3;
        e.sT -= dt;
        if (e.sT <= 0) e.st = 0;
      }
      break;
    case 'bloat':
      if (e.st === 0 && d < 40) { e.st = 1; e.sT = 0.7; }
      if (e.st === 1) {
        spd *= 0.15;
        e.sT -= dt;
        if (e.sT <= 0) { run.kill(e); return; }
      }
      break;
    case 'summon':
      if (d < 150) { mx = -dx; my = -dy; spd *= 0.8; } else if (d < 210) spd = 0;
      e.sT -= dt;
      if (e.sT <= 0) {
        e.sT = 7;
        if (run.onScreen(e, 20)) {
          for (let i = 0; i < 3; i++) {
            const a = (i / 3) * TAU + e.t;
            spawnEnemy(run, e.def.minion, e.x + Math.cos(a) * 26, e.y + Math.sin(a) * 26, { spawnT: 0.6 });
          }
          run.events.push(['summon', e.x, e.y]);
        }
      }
      break;
    case 'blink':
      e.sT -= dt;
      if (e.sT <= 0) {
        e.sT = run.rng.range(3.5, 5);
        if (d > 150 && d < 420 && e.frozen <= 0) {
          const a = run.rng.range(0, TAU), ox = e.x, oy = e.y;
          e.x = p.x + Math.cos(a) * 120;
          e.y = p.y + Math.sin(a) * 120;
          e.spawnT = 0.5;
          run.events.push(['blink', ox, oy, e.x, e.y]);
          return;
        }
      }
      break;
  }
  const wf = e.fly ? 1.1 : 0.75;
  e.x += (mx * spd + e.kx + run.wind.x * wf) * dt;
  e.y += (my * spd + e.ky + run.wind.y * wf) * dt;
  const kd = Math.min(1, 9 * dt);
  e.kx -= e.kx * kd;
  e.ky -= e.ky * kd;
  if (e.ai === 'charge' && e.st === 2) e.fx = e.cx > 0 ? 1 : -1;
  else if (Math.abs(dx) > 0.15) e.fx = dx > 0 ? 1 : -1;
  // enemies left far behind come back in front of the player
  if (e.ai !== 'sweep' && (Math.abs(p.x - e.x) > run.viewW / 2 + 240 || Math.abs(p.y - e.y) > run.viewH / 2 + 240)) {
    spawnPoint(run, SPT);
    e.x = SPT.x;
    e.y = SPT.y;
  }
}

function onEnemyDeath(run, e) {
  const def = e.def;
  if (def.split) {
    for (let i = 0; i < 2; i++) {
      const s = spawnEnemy(run, def.split, e.x + (i ? 8 : -8), e.y, {});
      s.kx = (i ? 1 : -1) * 80;
      if (e.elite) makeElite(s);
    }
  }
  if (e.ai === 'bloat') run.booms.push({ x: e.x, y: e.y, r: e.elite ? 80 : 54, pdmg: e.dmg * 2, edmg: 30 * hpMult(run), col: '#d86ad0' });
  if (def.puddle) zone(run, { k: 'puddle', x: e.x, y: e.y, r: e.elite ? 36 : 22, life: 3, warn: 0, dmg: e.dmg * 0.6, cd: 0, fn: hazardFn });
}

// Explosions are resolved after the step so chains of exploding enemies never nest queries.
function processBooms(run) {
  let guard = 0;
  while (run.booms.length && guard++ < 40) {
    const b = run.booms.shift();
    const p = run.player;
    if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < (b.r + p.r) ** 2) run.hurt(b.pdmg, 'boom');
    run.areaHit(b.x, b.y, b.r, b.edmg, null, 0, 1.5, Q4);
    run.events.push(['boom', b.x, b.y, b.r, b.col]);
  }
  run.booms.length = 0;
}

// Ground hazards that hurt the player (and sometimes enemies).
function hazardFn(run, z, dt) {
  if (z.cd > 0) z.cd -= dt;
  if (z.drift) {
    const p = run.player, dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy) || 1;
    z.x += (dx / d) * z.drift * dt;
    z.y += (dy / d) * z.drift * dt;
  }
  if (z.t < z.warn) return;
  const p = run.player;
  if ((p.x - z.x) ** 2 + (p.y - z.y) ** 2 < (z.r + p.r - 4) ** 2 && z.cd <= 0) {
    run.hurt(z.dmg, z.k);
    z.cd = 0.5;
  }
  if (z.edmg) run.areaHit(z.x, z.y, z.r, z.edmg, null, 0.5, 0, Q4);
}

// ----- bosses -----
function spawnBoss(run, key, final, loop) {
  const b = BOSSES[key];
  const bodyDef = ENEMIES[b.body];
  const baseR = bodyDef ? bodyDef.r : 14;
  const p = run.player;
  const x = p.x + run.rng.range(-60, 60), y = p.y - run.viewH / 2 - 40;
  let hp = b.hp * (0.6 + 0.02 * run.level) * (1 + (loop || 0) * 0.9);
  if (run.mode === 'quick') hp *= 0.7;
  if (run.mods.giant) hp *= 1.5;
  const e = spawnEnemy(run, bodyDef ? b.body : 'golem', x, y, {
    boss: true, bossKey: key, final: !!final, look: b.body, r: Math.min(44, Math.round(baseR * b.scale)), hp, maxHp: hp,
    spd: b.spd * (run.mods.quick ? 1.2 : 1), dmg: b.dmg * dmgMult(run) / run.stage.dmg * (0.7 + 0.3 * run.stage.dmg), mass: 1e6, kres: 0,
    ghost: !!b.ghost, shield: false, ai: 'boss', phase: 1, atkI: 0, sT: 2.2, act: null, aT: 0, aN: 0, spA: 0, def: bodyDef || ENEMIES.golem,
  });
  run.boss = e;
  run.events.push(['boss', key, !!final]);
  return e;
}

function bossShot(run, e, a, spd, big) {
  if (run.eprojs.length > 500) return;
  run.eprojs.push({ k: 'boss', x: e.x, y: e.y - e.r * 0.3, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: big ? 9 : 7, dmg: e.dmg * 0.65, life: 6, t: 0, dead: false, col: BOSSES[e.bossKey].tint || '#ff5a3a' });
}

function slamEnd(run, z) {
  const p = run.player;
  if ((p.x - z.x) ** 2 + (p.y - z.y) ** 2 < (z.r + p.r) ** 2) run.hurt(z.dmg, 'slam');
  run.events.push(['slam', z.x, z.y, z.r]);
}

function bossUpdate(run, e, dt, d, dx, dy, spd) {
  const p = run.player, B = BOSSES[e.bossKey];
  if (e.phase === 1 && e.hp < e.maxHp * 0.5) {
    e.phase = 2;
    e.spd *= 1.2;
    run.events.push(['enrage', e.x, e.y]);
  }
  const P2 = e.phase === 2;
  if (!e.act) {
    if (d > e.r + 20) {
      const fast = d > 240 ? 2.4 : 1; // bosses never fall far behind
      e.x += dx * spd * fast * dt;
      e.y += dy * spd * fast * dt;
    }
    if (Math.abs(dx) > 0.15) e.fx = dx > 0 ? 1 : -1;
    e.sT -= dt;
    if (e.sT <= 0 && e.frozen <= 0) {
      e.act = B.attacks[e.atkI++ % B.attacks.length];
      e.aT = 0;
      e.aN = 0;
    }
    return;
  }
  e.aT += dt;
  const done = () => { e.act = null; e.sT = P2 ? 1.3 : 2.1; };
  switch (e.act) {
    case 'slam': {
      const n = P2 ? 3 : 1;
      if (e.aN < n && e.aT >= e.aN * 0.5) {
        e.aN++;
        const r = 55 + e.r * 0.45;
        zone(run, { k: 'warn', x: p.x + p.mx * 30, y: p.y + p.my * 30, r, life: 1.0, dmg: e.dmg * 0.9, onEnd: slamEnd });
      }
      if (e.aT > n * 0.5 + 0.6) done();
      break;
    }
    case 'ring': {
      const n = P2 ? 2 : 1;
      if (e.aN < n && e.aT >= 0.35 + e.aN * 0.6) {
        e.aN++;
        const k = P2 ? 22 : 16, off = e.aN * 0.2;
        for (let i = 0; i < k; i++) bossShot(run, e, off + (i / k) * TAU, 115);
        run.events.push(['sfx', 'bossShot']);
      }
      if (e.aT > 0.35 + n * 0.6) done();
      break;
    }
    case 'spiral': {
      const len = 2.2;
      e.spT = (e.spT || 0) - dt;
      if (e.spT <= 0 && e.aT < len) {
        e.spT = 0.09;
        e.spA += 0.33;
        const arms = P2 ? 3 : 2;
        for (let i = 0; i < arms; i++) bossShot(run, e, e.spA + (i / arms) * TAU, 105);
      }
      if (e.aT > len + 0.3) done();
      break;
    }
    case 'volley': {
      if (e.aN < 3 && e.aT >= 0.3 + e.aN * 0.45) {
        e.aN++;
        const base = Math.atan2(p.y - e.y, p.x - e.x), k = P2 ? 7 : 5;
        for (let i = 0; i < k; i++) bossShot(run, e, base + (i - (k - 1) / 2) * 0.2, 150, true);
        run.events.push(['sfx', 'bossShot']);
      }
      if (e.aT > 1.8) done();
      break;
    }
    case 'dash': {
      const n = P2 ? 2 : 1;
      const cyc = 1.3, k = Math.floor(e.aT / cyc), u = e.aT - k * cyc;
      if (k >= n) { done(); break; }
      if (e.aN <= k) {
        e.aN = k + 1;
        e.cx = dx;
        e.cy = dy;
        zone(run, { k: 'warnLine', x: e.x, y: e.y, ang: Math.atan2(dy, dx), len: 300, w: e.r * 1.6, life: 0.65 });
      }
      if (u > 0.65 && u < 1.2) {
        e.x += e.cx * 440 * dt;
        e.y += e.cy * 440 * dt;
        e.fx = e.cx > 0 ? 1 : -1;
      }
      break;
    }
    case 'summon': {
      if (e.aN === 0 && e.aT > 0.4) {
        e.aN = 1;
        let alive = 0;
        for (const o of run.enemies) if (!o.dead && !o.prop) alive++;
        const k = Math.min(P2 ? 9 : 6, ENEMY_CAP - alive);
        for (let i = 0; i < k; i++) {
          const a = (i / k) * TAU;
          spawnEnemy(run, B.minion, e.x + Math.cos(a) * (e.r + 26), e.y + Math.sin(a) * (e.r + 26), { spawnT: 0.6 });
        }
        run.events.push(['summon', e.x, e.y]);
      }
      if (e.aT > 1.1) done();
      break;
    }
    case 'blink': {
      if (e.aN === 0 && e.aT > 0.45) {
        e.aN = 1;
        const a = run.rng.range(0, TAU), ox = e.x, oy = e.y;
        e.x = p.x + Math.cos(a) * 160;
        e.y = p.y + Math.sin(a) * 160;
        run.events.push(['blink', ox, oy, e.x, e.y]);
      }
      if (e.aN === 1 && e.aT > 0.75) {
        e.aN = 2;
        const k = P2 ? 12 : 8;
        for (let i = 0; i < k; i++) bossShot(run, e, (i / k) * TAU, 130);
      }
      if (e.aT > 1.2) done();
      break;
    }
    default:
      done();
  }
}

// ----- the wave director -----
class Director {
  constructor(run) {
    this.run = run;
    this.acc = 0;
    this.nextElite = 50;
    this.nextSwarm = 75;
    this.nextRing = 140;
    this.nextProp = 8;
    this.nextHazard = 30;
    this.hazardOn = 0;
    this.loop = 0;
    const st = run.stage;
    this.bossQ = [
      { t: 300, k: st.minis[0] },
      { t: 600, k: st.minis[1] },
      { t: 900, k: st.boss, final: true },
    ];
  }

  pick(minute) {
    const pool = this.run.stage.pools[Math.min(minute, this.run.stage.pools.length - 1)];
    return this.run.rng.weighted(pool);
  }

  update(dt) {
    const run = this.run, T = run.T, M = run.mods;
    const minute = Math.floor(T / 60);
    const tm = Math.min(T, 960) / 60;
    let rate = 1.1 + (0.42 * tm + 0.035 * tm * tm) * run.stage.rate;
    let cap = Math.min(ENEMY_CAP, 30 + 24 * tm + 0.6 * tm * tm);
    if (M.swarm) { rate *= 1.6; cap = Math.min(ENEMY_CAP, cap * 1.4); }
    if (run.boss && run.boss.final) rate *= 0.5;
    let alive = 0, props = 0;
    for (const e of run.enemies) { if (e.prop) props++; else if (!e.dead) alive++; }
    run.alive = alive;
    this.acc += rate * dt;
    while (this.acc >= 1) {
      this.acc -= 1;
      if (alive >= cap) { this.acc = 0; break; }
      spawnPoint(run, SPT);
      spawnEnemy(run, this.pick(minute), SPT.x, SPT.y);
      alive++;
    }
    if (T >= this.nextElite) {
      this.nextElite += M.bounty ? 30 : 60;
      let type = this.pick(minute);
      for (let i = 0; i < 4 && (type === 'bat' || type === 'wisp' || type === 'slimelet'); i++) type = this.pick(minute);
      spawnPoint(run, SPT);
      makeElite(spawnEnemy(run, type, SPT.x, SPT.y));
      run.events.push(['elite']);
    }
    if (T >= this.nextSwarm) { this.nextSwarm += 120; this.swarm(minute); }
    if (T >= this.nextRing) { this.nextRing += 120; this.ring(minute); }
    if (run.time >= this.nextProp) {
      this.nextProp = run.time + 18;
      if (props < 3) {
        const p = run.player, hw = run.viewW / 2, hh = run.viewH / 2;
        const side = run.rng.chance(0.5) ? 1 : -1;
        spawnEnemy(run, 'brazier', p.x + run.rng.range(-hw * 0.8, hw * 0.8), p.y + side * run.rng.range(hh * 0.45, hh * 0.85));
      }
    }
    const b = this.bossQ[0];
    if (b) {
      if (T >= b.t - 4 && !b.warned) { b.warned = true; run.events.push(['bossWarn', b.k, !!b.final]); }
      if (T >= b.t) { this.bossQ.shift(); spawnBoss(run, b.k, b.final, b.loop || 0); }
    } else if (run.endless) {
      this.loop++;
      const st = run.stage, keys = [st.minis[0], st.minis[1], st.boss];
      const k = keys[this.loop % 3];
      this.bossQ.push({ t: 900 + this.loop * 180, k, final: k === st.boss, loop: Math.ceil(this.loop / 3) });
    }
    this.hazard(dt);
  }

  swarm(minute) {
    const run = this.run, p = run.player, type = run.stage.swarm;
    const n = Math.min(40, 10 + minute * 3);
    const horiz = run.rng.chance(0.6), dir = run.rng.chance(0.5) ? 1 : -1;
    const hw = run.viewW / 2 + 50, hh = run.viewH / 2 + 50;
    for (let i = 0; i < n; i++) {
      const off = (i - n / 2) * 11 + run.rng.range(-6, 6), lag = run.rng.range(0, 60);
      const x = horiz ? p.x - dir * (hw + lag) : p.x + off;
      const y = horiz ? p.y + off : p.y - dir * (hh + lag);
      const e = spawnEnemy(run, type, x, y, { ai: 'sweep', vx: horiz ? dir : 0, vy: horiz ? 0 : dir, spd: 125, life: 14, ghost: true });
      e.dmg *= 0.6;
    }
    run.events.push(['swarm']);
  }

  ring(minute) {
    const run = this.run, p = run.player, type = run.stage.ring;
    const n = Math.min(40, 22 + minute);
    const R = Math.min(run.viewW, run.viewH) * 0.5 + 90;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      spawnEnemy(run, type, p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, { spawnT: 0.6 });
    }
    run.events.push(['ring']);
  }

  hazard(dt) {
    const run = this.run, hz = run.stage.hazard;
    if (!hz) return;
    if (this.hazardOn > 0) {
      this.hazardOn -= dt;
      if (this.hazardOn <= 0) { run.wind.x = run.wind.y = 0; run.events.push(['blizzard', 0]); }
    }
    if (run.time < this.nextHazard) return;
    const p = run.player, dm = dmgMult(run) / run.stage.dmg;
    if (hz === 'vents') {
      this.nextHazard = run.time + run.rng.range(13, 19);
      const n = run.rng.int(3, 5);
      for (let i = 0; i < n; i++) {
        const a = run.rng.range(0, TAU), d = i === 0 ? 0 : run.rng.range(60, 170);
        zone(run, { k: 'vent', x: p.x + p.mx * 50 + Math.cos(a) * d, y: p.y + p.my * 50 + Math.sin(a) * d, r: 34, life: 3.6, warn: 1.2, dmg: 10 * dm, edmg: 25 * hpMult(run) / run.stage.hp, cd: 0, fn: hazardFn });
      }
      run.events.push(['vents']);
    } else if (hz === 'blizzard') {
      this.nextHazard = run.time + run.rng.range(55, 75);
      this.hazardOn = 9;
      const a = run.rng.range(0, TAU);
      run.wind.x = Math.cos(a) * 46;
      run.wind.y = Math.sin(a) * 46;
      run.events.push(['blizzard', 1]);
    } else if (hz === 'rifts') {
      this.nextHazard = run.time + run.rng.range(26, 36);
      for (let i = 0; i < 2; i++) {
        const a = run.rng.range(0, TAU), d = 230;
        zone(run, { k: 'rift', x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d, r: 26, life: 10, warn: 0.6, dmg: 9 * dm, cd: 0, drift: 26, fn: hazardFn });
      }
      run.events.push(['rifts']);
    }
  }
}

// ===== 08-bot.js =====
// ---------- Autopilot: steers and picks upgrades. Used by the balance tests and the demo. ----------
const BQ = new Array(4096);
const BOT_PASSIVES = ['might', 'haste', 'area', 'vitality', 'armor', 'duration', 'multishot', 'regen', 'magnet', 'swiftness', 'luck', 'velocity'];

class Bot {
  constructor(run, skill) {
    this.run = run;
    this.skill = skill == null ? 1 : skill;
    this.t = 0;
    this.mx = 0;
    this.my = 0;
    this.wa = Math.random() * TAU;
    this.dir = 1;
    this.flip = 50;
  }

  update(dt) {
    const run = this.run;
    this.t -= dt;
    if (this.t > 0) { run.setMove(this.mx, this.my); return; }
    this.t = 0.08 + (1 - this.skill) * 0.25;
    const p = run.player;
    // enemy pressure: rx/ry points away from the horde
    let rx = 0, ry = 0, danger = 0;
    const n = run.grid.query(p.x, p.y, 170, BQ);
    for (let i = 0; i < n; i++) {
      const e = BQ[i];
      if (e.dead || e.prop) continue;
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
      if (d > 170) continue;
      const gap = Math.max(6, d - e.r - p.r);
      const w = (e.boss ? 5 : e.elite ? 2 : 1) * 900 / (gap * gap);
      rx += (dx / d) * w;
      ry += (dy / d) * w;
      danger += w;
    }
    // hard dangers: shots and hazards
    let hx = 0, hy = 0;
    for (const b of run.eprojs) {
      const dx = p.x - b.x, dy = p.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > 110 * 110) continue;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      if (dx * b.vx + dy * b.vy <= 0) continue; // moving away
      // sidestep perpendicular to the shot, away from its path
      const side = (dx * b.vy - dy * b.vx) > 0 ? -1 : 1;
      const w = (500 / Math.max(64, d2)) * 40;
      hx += (-b.vy / sp) * side * w;
      hy += (b.vx / sp) * side * w;
      danger += w * 0.5;
    }
    for (const z of run.zones) {
      if (z.k !== 'vent' && z.k !== 'rift' && z.k !== 'puddle' && z.k !== 'warn') continue;
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy) || 1;
      if (d > z.r + 50) continue;
      const w = 30 * (1 - (d - z.r) / 60);
      hx += (dx / d) * w;
      hy += (dy / d) * w;
      danger += w;
    }
    let fx = hx, fy = hy;
    // circle around the horde: the classic way to keep enemies inside your weapons' reach
    const rl = Math.hypot(rx, ry);
    if (rl > 0.01) {
      this.flip -= 1;
      if (this.flip <= 0) { this.flip = 40 + Math.random() * 60; if (Math.random() < 0.35) this.dir = -this.dir; }
      const away = Math.min(2, rl / 2.5);
      fx += (rx / rl) * away + (-ry / rl) * this.dir;
      fy += (ry / rl) * away + (rx / rl) * this.dir;
    }
    // go for pickups when it is safe enough
    let best = null, bd = 1e9;
    for (const d of run.drops) {
      if (d.mag) continue;
      const dist = Math.hypot(d.x - p.x, d.y - p.y);
      const want = d.k === 'chest' ? 0.35 : d.k === 'heart' ? (p.hp < run.stats.maxHp * 0.6 ? 0.4 : 3) : d.k === 'gem' ? 1 : 0.7;
      const score = dist * want;
      if (score < bd && dist < 320) { bd = score; best = d; }
    }
    if (best && danger < 12) {
      const dx = best.x - p.x, dy = best.y - p.y, d = Math.hypot(dx, dy) || 1;
      const w = (best.k === 'chest' ? 3 : 1.2) * (danger < 3 ? 2 : 1);
      fx += (dx / d) * w;
      fy += (dy / d) * w;
    }
    this.wa += 0.03;
    fx += Math.cos(this.wa) * 0.25;
    fy += Math.sin(this.wa) * 0.25;
    if (this.skill < 1) {
      fx += (Math.random() - 0.5) * (1 - this.skill) * 3;
      fy += (Math.random() - 0.5) * (1 - this.skill) * 3;
    }
    const l = Math.hypot(fx, fy);
    this.mx = l > 0.05 ? fx / l : 0;
    this.my = l > 0.05 ? fy / l : 0;
    run.setMove(this.mx, this.my);
  }

  score(c) {
    const run = this.run;
    if (c.kind === 'gold') return 1;
    if (c.kind === 'heal') return run.player.hp < run.stats.maxHp * 0.5 ? 3 : 0.5;
    if (c.kind === 'weapon') {
      if (!c.isNew) return 10 + c.lvl * 0.3;
      return run.weapons.length < 4 ? 9 : 7;
    }
    // passives: prefer the ones that evolve a weapon we own
    const owned = PAIR_OF[c.key] && run.family(PAIR_OF[c.key]);
    const pri = BOT_PASSIVES.length - BOT_PASSIVES.indexOf(c.key);
    return (owned ? 9.5 : 4) + pri * 0.1 + (c.isNew ? 0 : 0.5);
  }

  choose(choices) {
    let best = choices[0], bs = -1;
    for (const c of choices) {
      const s = this.score(c) + Math.random() * 0.5;
      if (s > bs) { bs = s; best = c; }
    }
    return best;
  }
}

// ===== 09-art.js =====
// ---------- Procedural art: heroes, monsters, bosses, pickups, icons, ground ----------
// Painters draw in body units: (0, 0) is the body centre, radius 1, facing +x.
// Everything is painted once into cached canvases and stamped with drawImage.
const OUT = '#1a1424';
const BONE = '#ece6d2';
const GOLDC = '#ffcc33';

function fs(ctx, fill, lw) {
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.lineWidth = lw || 0.12;
  ctx.strokeStyle = OUT;
  ctx.stroke();
}
function el(ctx, x, y, rx, ry, fill, lw) { ellipse(ctx, x, y, rx, ry); fs(ctx, fill, lw); }
function rr(ctx, x, y, w, h, r, fill, lw) { roundRect(ctx, x, y, w, h, r); fs(ctx, fill, lw); }
function ln(ctx, x1, y1, x2, y2, w, col) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineCap = 'round';
  ctx.lineWidth = w + 0.14;
  ctx.strokeStyle = OUT;
  ctx.stroke();
  ctx.lineWidth = w;
  ctx.strokeStyle = col;
  ctx.stroke();
}
function pg(ctx, pts, fill, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  fs(ctx, fill, lw);
}
function dot(ctx, x, y, r, col) {
  circle(ctx, x, y, r);
  ctx.fillStyle = col;
  ctx.fill();
}
function eyes(ctx, x, y, gap, r, col, pupil) {
  for (const s of [-1, 1]) {
    el(ctx, x + s * gap, y, r, r * 1.15, col || '#fff', 0.07);
    if (pupil) dot(ctx, x + s * gap + r * 0.35, y + r * 0.1, r * 0.5, pupil);
  }
}
function feet(ctx, f, col, y, gap) {
  const a = f ? 0.12 : -0.12;
  el(ctx, -gap + a, y, 0.22, 0.14, col);
  el(ctx, gap - a, y, 0.22, 0.14, col);
}

// ----- heroes -----
function paintHero(ctx, f, look) {
  const c = look.cloak, t = look.trim, skin = look.skin;
  feet(ctx, f, '#3a2a2a', 0.92, 0.32);
  // cloak
  ctx.beginPath();
  ctx.moveTo(-0.62, 0.9);
  ctx.quadraticCurveTo(-0.7, -0.05, -0.2, -0.2);
  ctx.lineTo(0.2, -0.2);
  ctx.quadraticCurveTo(0.7, -0.05, 0.62, 0.9);
  ctx.closePath();
  fs(ctx, c);
  pg(ctx, [-0.12, -0.15, 0.12, -0.15, 0.08, 0.86, -0.08, 0.86], t, 0.06);
  // head
  el(ctx, 0.04, -0.52, 0.5, 0.46, skin);
  eyes(ctx, 0.18, -0.5, 0.15, 0.08, OUT);
  dot(ctx, 0.36, -0.36, 0.06, 'rgba(255,120,120,0.6)');
  // hats
  switch (look.hat) {
    case 'hood':
      ctx.beginPath();
      ctx.moveTo(-0.55, -0.35);
      ctx.quadraticCurveTo(-0.5, -1.15, 0.1, -1.05);
      ctx.quadraticCurveTo(0.6, -0.95, 0.55, -0.62);
      ctx.quadraticCurveTo(0.1, -0.85, -0.2, -0.6);
      ctx.quadraticCurveTo(-0.4, -0.45, -0.55, -0.35);
      ctx.closePath();
      fs(ctx, c);
      break;
    case 'hood2':
      ctx.beginPath();
      ctx.moveTo(-0.58, -0.25);
      ctx.quadraticCurveTo(-0.62, -1.1, 0.05, -1.08);
      ctx.quadraticCurveTo(0.62, -1.0, 0.56, -0.55);
      ctx.lineTo(0.3, -0.78);
      ctx.quadraticCurveTo(-0.15, -0.8, -0.3, -0.45);
      ctx.closePath();
      fs(ctx, c);
      pg(ctx, [-0.55, -0.9, -0.95, -1.2, -0.62, -0.7], t, 0.07);
      break;
    case 'witch':
      el(ctx, 0.02, -0.82, 0.72, 0.16, c);
      pg(ctx, [-0.38, -0.86, 0.36, -0.86, 0.05, -1.75, -0.25, -1.55], c);
      rr(ctx, -0.36, -0.98, 0.72, 0.14, 0.05, t, 0.06);
      dot(ctx, 0.05, -1.78, 0.09, t);
      break;
    case 'helm':
      ctx.beginPath();
      ctx.arc(0.04, -0.55, 0.56, Math.PI * 1.02, Math.PI * 1.98);
      ctx.lineTo(0.6, -0.3);
      ctx.lineTo(0.3, -0.3);
      ctx.lineTo(0.3, -0.62);
      ctx.lineTo(-0.52, -0.62);
      ctx.closePath();
      fs(ctx, '#b8c2d4');
      pg(ctx, [-0.05, -1.08, 0.12, -1.42, 0.25, -1.06], '#d84a4a', 0.07);
      break;
    case 'goggles':
      ctx.beginPath();
      ctx.arc(0.04, -0.56, 0.52, Math.PI, TAU);
      ctx.closePath();
      fs(ctx, '#7a3a2a');
      rr(ctx, -0.5, -0.8, 1.05, 0.16, 0.06, '#4a3a3a', 0.06);
      el(ctx, 0.16, -0.73, 0.14, 0.13, '#9fe8ff', 0.07);
      el(ctx, 0.46, -0.73, 0.12, 0.12, '#9fe8ff', 0.07);
      break;
    case 'cap':
      ctx.beginPath();
      ctx.arc(0.02, -0.62, 0.5, Math.PI * 1.05, Math.PI * 1.95);
      ctx.closePath();
      fs(ctx, c);
      pg(ctx, [0.2, -0.7, 0.85, -0.7, 0.75, -0.6, 0.2, -0.6], c, 0.07);
      ln(ctx, -0.1, -1.08, -0.2, -1.4, 0.05, '#999');
      dot(ctx, -0.2, -1.42, 0.09, t);
      break;
  }
  // lantern in the front hand
  ln(ctx, 0.5, 0.15, 0.78, 0.2, 0.08, c);
  ln(ctx, 0.82, 0.05, 0.82, 0.2, 0.05, '#555');
  rr(ctx, 0.66, 0.2, 0.32, 0.38, 0.06, '#5a3a1a', 0.07);
  rr(ctx, 0.71, 0.26, 0.22, 0.24, 0.05, '#ffe27a', 0.04);
}

// ----- monsters -----
function paintSkeleton(ctx, f, bow) {
  feet(ctx, f, BONE, 0.92, 0.28);
  ln(ctx, -0.18, 0.5, -0.24 + (f ? 0.06 : -0.06), 0.85, 0.1, BONE);
  ln(ctx, 0.18, 0.5, 0.24 - (f ? 0.06 : -0.06), 0.85, 0.1, BONE);
  rr(ctx, -0.36, -0.12, 0.72, 0.66, 0.2, '#d8d0b8');
  for (const y of [0.05, 0.2, 0.35]) ln(ctx, -0.24, y, 0.24, y, 0.04, '#a89e86');
  ln(ctx, 0.3, 0.0, 0.8, 0.12 + (f ? 0.05 : -0.05), 0.09, BONE);
  ln(ctx, -0.3, 0.0, -0.6, 0.35, 0.09, BONE);
  el(ctx, 0.06, -0.55, 0.5, 0.46, BONE);
  rr(ctx, -0.1, -0.24, 0.42, 0.2, 0.06, BONE, 0.08);
  el(ctx, 0.0, -0.58, 0.13, 0.15, OUT, 0.02);
  el(ctx, 0.3, -0.58, 0.12, 0.14, OUT, 0.02);
  dot(ctx, 0.02, -0.58, 0.05, '#ff5a3a');
  dot(ctx, 0.31, -0.58, 0.05, '#ff5a3a');
  if (bow) {
    ctx.beginPath();

function paintSlime(ctx, f, col, dark) {
  const sq = f ? 1.08 : 0.94;
  ctx.beginPath();
  ctx.moveTo(-0.95 * sq, 0.85);
  ctx.quadraticCurveTo(-1.0 * sq, -0.9 / sq, 0, -0.85 / sq);
  ctx.quadraticCurveTo(1.0 * sq, -0.9 / sq, 0.95 * sq, 0.85);
  ctx.closePath();
  fs(ctx, col);
  el(ctx, -0.35, -0.35 / sq, 0.18, 0.12, 'rgba(255,255,255,0.7)', 0.01);
  eyes(ctx, 0.25, 0.05, 0.22, 0.12, '#fff', OUT);
  ln(ctx, 0.15, 0.42, 0.45, 0.42, 0.05, dark);
}

function paintBeast(ctx, f, col, dark, eye, horns) {
  const o = f ? 0.12 : -0.12;
  ln(ctx, -0.55, 0.4, -0.65 + o, 0.9, 0.16, dark);
  ln(ctx, 0.45, 0.4, 0.55 - o, 0.9, 0.16, dark);
  ln(ctx, -0.8, 0.0, -1.15, -0.35 + o, 0.14, col);
  el(ctx, -0.05, 0.2, 0.85, 0.48, col);
  ln(ctx, -0.35, 0.45, -0.25 - o, 0.9, 0.16, col);
  ln(ctx, 0.25, 0.45, 0.35 + o, 0.9, 0.16, col);
  el(ctx, 0.72, -0.25, 0.45, 0.4, col);
  el(ctx, 1.02, -0.12, 0.2, 0.16, dark, 0.07);
  pg(ctx, [0.45, -0.5, 0.48, -0.95, 0.72, -0.6], col, 0.08);
  if (horns) pg(ctx, [0.6, -0.6, 0.85, -1.0, 0.82, -0.6], '#ffd8a0', 0.06);
  dot(ctx, 0.82, -0.32, 0.09, eye);
}

// Crown drawn above bosses' heads.
function paintCrown(ctx, y) {
  pg(ctx, [-0.4, y + 0.25, -0.4, y - 0.15, -0.2, y + 0.05, 0, y - 0.25, 0.2, y + 0.05, 0.4, y - 0.15, 0.4, y + 0.25], GOLDC, 0.08);
  dot(ctx, 0, y + 0.08, 0.07, '#ff4a6a');
}

// ----- sprite cache -----
// Half-size of each sprite canvas in body radii (just enough for hats, wings and staffs).
const SPRITE_PAD = { bat: 1.45, archer: 1.45, drake: 1.65, sovereign: 1.65 };

const Sprites = {
  cache: new Map(),
  clear() { this.cache.clear(); },
  // look: painter key or hero look object; rpx: body radius in device pixels
  get(key, look, frame, flip, variant, rpx, tint) {
    const R = Math.max(2, Math.round(rpx));
    const ck = key + '|' + frame + '|' + (flip ? 1 : 0) + '|' + variant + '|' + R;
    let c = this.cache.get(ck);
    if (c) return c;
    let pad = typeof look === 'object' ? 1.95 : SPRITE_PAD[look] || 1.38;
    if (variant === 'elite') pad += 0.35;
    if (variant === 'boss') pad = Math.max(pad, 1.85) + 0.25;
    const size = Math.ceil(R * pad * 2);
    c = makeCanvas(size, size);
    const x = c.getContext('2d');
    x.translate(size / 2, size / 2);
    x.scale(R, R);
    if (flip) x.scale(-1, 1);
    x.lineJoin = 'round';
    x.lineCap = 'round';
    const paint = typeof look === 'object' ? PAINT.hero : PAINT[look] || PAINT.skeleton;
    if (variant === 'elite') {
      x.shadowColor = '#ffd84a';
      x.shadowBlur = R * 0.6;
    }
    if (variant === 'boss') {
      x.shadowColor = tint || '#ff4a4a';
      x.shadowBlur = R * 0.35;
    }
    paint(x, frame, look);
    x.shadowBlur = 0;
    if (variant === 'flash') {
      x.globalCompositeOperation = 'source-atop';
      x.fillStyle = 'rgba(255,255,255,0.85)';
      x.fillRect(-pad, -pad, pad * 2, pad * 2);
    } else if (variant === 'frozen') {
      x.globalCompositeOperation = 'source-atop';
      x.fillStyle = 'rgba(150,220,255,0.55)';
      x.fillRect(-pad, -pad, pad * 2, pad * 2);
    } else if (variant === 'boss' && tint) {
      x.globalCompositeOperation = 'source-atop';
      x.fillStyle = rgba(tint, 0.3);
      x.fillRect(-pad, -pad, pad * 2, pad * 2);
    }
    x.globalCompositeOperation = 'source-over';
    if (variant === 'boss' && key !== 'sovereign') paintCrown(x, -1.45);
    this.cache.set(ck, c);
    return c;
  },
};

const GEM_COLS = [['#4ab8ff', '#bfe8ff'], ['#4aff8a', '#c8ffd8'], ['#ff4a6a', '#ffc0cc']];
function gemTier(v) { return v <= 2 ? 0 : v <= 12 ? 1 : 2; }

    fs(x, '#ff4a6a', 0.14);
