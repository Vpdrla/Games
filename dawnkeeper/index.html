const DropSprites = {
  cache: new Map(),
  get(k, tier, rpx) {
    const R = Math.max(2, Math.round(rpx));
    const ck = k + tier + '|' + R;
    let c = this.cache.get(ck);
    if (c) return c;
    const size = Math.ceil(R * 2.6);
    c = makeCanvas(size, size);
    const x = c.getContext('2d');

    x.scale(R, R);
    x.lineJoin = 'round';
    DROP_PAINT[k](x, tier);
    this.cache.set(ck, c);
    return c;
  },
};

function star(ctx, x, y, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, rr2 = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath();
  fs(ctx, col, 0.08);
}

const Icons = {
  cache: new Map(),
  // Returns a canvas of size px with the icon of a weapon / passive / power-up key.
  canvas(key, px) {
    const ck = key + '@' + px;
    let c = this.cache.get(ck);
    if (c) return c;
    c = makeCanvas(px, px);
    const x = c.getContext('2d');
    x.translate(px / 2, px / 2);
    x.scale(px * 0.4, px * 0.4);
    x.lineJoin = 'round';
    x.lineCap = 'round';
    const wd = WEAPONS[key];
    const base = wd && wd.evolved ? wd.evolved : key;
    const col = wd ? wd.col : PASSIVES[key] ? PASSIVES[key].col : '#fff';
    if (wd && wd.evolved) {
      const g = x.createRadialGradient(0, 0, 0.2, 0, 0, 1.25);
      g.addColorStop(0, rgba(col, 0.9));
      g.addColorStop(1, rgba(col, 0));
      x.fillStyle = g;
      x.fillRect(-1.25, -1.25, 2.5, 2.5);
    }
    const p = ICON[base] || ICON[(POWERUPS[key] && POWERUPS[key].icon) || ''] || ICON.might;
    p(x, col);
    if (wd && wd.evolved) star(x, 0.72, -0.72, 0.32, '#fff6a8');
    this.cache.set(ck, c);
    return c;
  },
  url(key, px) {
    const ck = 'u:' + key + '@' + px;
    let u = this.cache.get(ck);
    if (!u) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      u = this.canvas(key, Math.round(px * dpr)).toDataURL();
      this.cache.set(ck, u);
    }
    return u;
  },
};

// ----- ground and decorations -----
function groundTile(stage, px) {
  const c = makeCanvas(px, px);
  const x = c.getContext('2d');
  const rng = new RNG(hashStr(stage.key));
  const [g0, g1, g2] = stage.ground;
  x.fillStyle = g0;
  x.fillRect(0, 0, px, px);
  const k = px / 256;
  // soft blotches (wrapped so the tile repeats seamlessly)
  for (let i = 0; i < 26; i++) {
    const cx = rng.range(0, px), cy = rng.range(0, px), r = rng.range(18, 52) * k;
    x.fillStyle = rgba(rng.chance(0.5) ? g1 : g2, 0.55);
    for (const ox of [-px, 0, px]) for (const oy of [-px, 0, px]) {
      ellipse(x, cx + ox, cy + oy, r, r * 0.7);
      x.fill();
    }
  }
  // details
  for (let i = 0; i < 70; i++) {
    const cx = rng.range(0, px), cy = rng.range(0, px);
    x.fillStyle = rgba(stage.accent, rng.range(0.25, 0.6));
    if (stage.decor === 'grave' || stage.decor === 'ice') {
      x.fillRect(cx, cy, 1.5 * k, 4 * k);
      x.fillRect(cx + 2 * k, cy + 1 * k, 1.5 * k, 3 * k);
    } else if (stage.decor === 'lava') {
      x.fillRect(cx, cy, 2.5 * k, 1.5 * k);
    } else {
      x.fillRect(cx, cy, 2 * k, 2 * k);
    }
  }
  if (stage.decor === 'lava') {
    x.strokeStyle = 'rgba(255,110,40,0.35)';
    x.lineWidth = 1.6 * k;
    for (let i = 0; i < 6; i++) {
      let cx = rng.range(0, px), cy = rng.range(0, px);
      x.beginPath();
      x.moveTo(cx, cy);
      for (let j = 0; j < 4; j++) { cx += rng.range(-18, 18) * k; cy += rng.range(-18, 18) * k; x.lineTo(cx, cy); }
      x.stroke();
    }
  }
  if (stage.decor === 'void') {
    x.strokeStyle = 'rgba(160,90,255,0.18)';
    x.lineWidth = 1.2 * k;
    for (let i = 0; i <= 4; i++) {
      x.beginPath(); x.moveTo(i * 64 * k, 0); x.lineTo(i * 64 * k, px); x.stroke();
      x.beginPath(); x.moveTo(0, i * 64 * k); x.lineTo(px, i * 64 * k); x.stroke();
    }
  }
  return c;
}

const DecorSprites = {
  cache: new Map(),
  get(kind, i, rpx) {
    const R = Math.max(2, Math.round(rpx));
    const ck = kind + i + '|' + R;
    let c = this.cache.get(ck);
    if (c) return c;
    const size = Math.ceil(R * 2.4);
    c = makeCanvas(size, size);
    const x = c.getContext('2d');
    x.translate(size / 2, size / 2);
    x.scale(R, R);
    x.lineJoin = 'round';
    x.lineCap = 'round';
    DECOR[kind][i](x);
    this.cache.set(ck, c);
    return c;
  },
};

const Glow = {
  cache: new Map(),
  get(col, px) {
    const R = Math.max(2, Math.round(px));
    const ck = col + R;
    let c = this.cache.get(ck);
    if (c) return c;
    c = makeCanvas(R * 2, R * 2);
    const x = c.getContext('2d');
    const g = x.createRadialGradient(R, R, 0, R, R, R);
    g.addColorStop(0, rgba(col, 1));
    g.addColorStop(0.35, rgba(col, 0.55));
    g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, R * 2, R * 2);
    this.cache.set(ck, c);
    return c;
  },
};

// ===== 10-fx.js =====
// ---------- Visual effects in world space (pooled particles, damage numbers, lightning) ----------
class FX {
  constructor() {
    this.p = [];
    this.free = [];
    this.texts = 0;
    this.low = false;
  }

  add(k, x, y, life) {
    if (this.p.length > (this.low ? 300 : 700)) return null;
    const o = this.free.pop() || {};
    o.k = k; o.x = x; o.y = y; o.t = 0; o.life = life;
    o.vx = 0; o.vy = 0; o.r = 4; o.r1 = 0; o.col = '#fff'; o.str = ''; o.size = 10; o.pts = null; o.g = 0; o.rot = 0; o.w = 2;
    this.p.push(o);
    return o;
  }

  clear() {
    for (const o of this.p) this.free.push(o);
    this.p.length = 0;
    this.texts = 0;
  }

  update(dt) {
    const ps = this.p;
    let n = 0;
    for (let i = 0; i < ps.length; i++) {
      const o = ps[i];
      o.t += dt;
      if (o.t >= o.life) {
        if (o.k === 'text') this.texts--;
        o.pts = null;
        this.free.push(o);
        continue;
      }
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      if (o.g) o.vy += o.g * dt;
      if (o.k === 'spark' || o.k === 'shard') { o.vx *= 1 - 3 * dt; o.vy *= 1 - 3 * dt; }
      ps[n++] = o;
    }
    ps.length = n;
  }

  sparks(x, y, n, col, spd) {
    if (this.low) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const o = this.add('spark', x, y, rand(0.2, 0.45));
      if (!o) return;
      const a = rand(0, TAU), s = rand(0.4, 1) * (spd || 160);
      o.vx = Math.cos(a) * s;
      o.vy = Math.sin(a) * s;
      o.col = col;
      o.r = rand(1.2, 2.4);
    }
  }

  puff(x, y, r, col, life) {
    const o = this.add('puff', x, y, life || 0.4);
    if (!o) return;
    o.r = r * 0.4;
    o.r1 = r;
    o.col = col;
  }

  ring(x, y, r, col, life, w) {
    const o = this.add('ring', x, y, life || 0.35);
    if (!o) return;
    o.r = r * 0.2;
    o.r1 = r;
    o.col = col;
    o.w = w || 3;
  }

  flash(x, y, r, col, life) {
    const o = this.add('flash', x, y, life || 0.25);
    if (!o) return;
    o.r = r;
    o.col = col;
  }

  shards(x, y, n, col) {
    if (this.low) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const o = this.add('shard', x, y, rand(0.35, 0.6));
      if (!o) return;
      const a = rand(0, TAU), s = rand(40, 140);
      o.vx = Math.cos(a) * s;
      o.vy = Math.sin(a) * s - 60;
      o.g = 260;
      o.col = col;
      o.r = rand(1.5, 3.5);
      o.rot = rand(0, TAU);
    }
  }

  text(x, y, str, col, size) {
    if (this.texts > (this.low ? 25 : 55)) return;
    const o = this.add('text', x + rand(-5, 5), y, 0.75);
    if (!o) return;
    this.texts++;
    o.vy = -38;
    o.str = str;
    o.col = col;
    o.size = size || 9;
  }

  zap(pts, col, w) {
    const o = this.add('zap', 0, 0, 0.22);
    if (!o) return;
    // jag each segment once so the bolt looks electric
    const out = [pts[0], pts[1]];
    for (let i = 2; i < pts.length; i += 2) {
      const x0 = pts[i - 2], y0 = pts[i - 1], x1 = pts[i], y1 = pts[i + 1];
      const nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny) || 1;
      for (let j = 1; j < 4; j++) {
        const u = j / 4, off = rand(-1, 1) * Math.min(14, l * 0.12);
        out.push(lerp(x0, x1, u) + (nx / l) * off, lerp(y0, y1, u) + (ny / l) * off);
      }
      out.push(x1, y1);
    }
    o.pts = out;
    o.col = col;
    o.w = w || 2.5;
  }

  draw(ctx) {
    for (const o of this.p) {
      const u = o.t / o.life;
      switch (o.k) {
        case 'spark':
          ctx.globalAlpha = 1 - u;
          ctx.fillStyle = o.col;
          ctx.fillRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
          break;
        case 'puff':
          ctx.globalAlpha = (1 - u) * 0.6;
          ctx.fillStyle = o.col;
          circle(ctx, o.x, o.y, lerp(o.r, o.r1, easeOut(u)));
          ctx.fill();
          break;
        case 'ring':
          ctx.globalAlpha = 1 - u;
          ctx.strokeStyle = o.col;
          ctx.lineWidth = o.w * (1 - u * 0.6);
          circle(ctx, o.x, o.y, lerp(o.r, o.r1, easeOut(u)));
          ctx.stroke();
          break;
        case 'flash': {
          ctx.globalAlpha = (1 - u) * 0.9;
          const gl = Glow.get(o.col, 32);
          const r = o.r * (0.7 + u * 0.5);
          ctx.drawImage(gl, o.x - r, o.y - r, r * 2, r * 2);
          break;
        }
        case 'shard':
          ctx.globalAlpha = 1 - u;
          ctx.fillStyle = o.col;
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.rotate(o.rot + o.t * 8);
          ctx.beginPath();
          ctx.moveTo(-o.r, -o.r * 0.6);
          ctx.lineTo(o.r, 0);
          ctx.lineTo(-o.r * 0.4, o.r);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
          break;
        case 'zap': {
          ctx.globalAlpha = 1 - u;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(o.pts[0], o.pts[1]);
          for (let i = 2; i < o.pts.length; i += 2) ctx.lineTo(o.pts[i], o.pts[i + 1]);
          ctx.strokeStyle = rgba(o.col, 0.45);
          ctx.lineWidth = o.w * 3;
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = o.w;
          ctx.stroke();
          break;
        }
        case 'text':
          ctx.globalAlpha = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3;
          outlineText(ctx, o.str, o.x, o.y, o.size * (u < 0.15 ? 1 + (0.15 - u) * 3 : 1), o.col);
          break;
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ===== 11-view.js =====
// ---------- Run renderer: camera, world, effects, night overlay and HUD ----------
const VIEW_SHORT = 350; // world units across the shorter screen side
const SHOT_COLS = { arrow: '#f0e0b0', snowball: '#ffffff', fireball: '#ff8a2a', spread: '#ff6ad5' };
const KILL_COLS = { bat: '#8a5ab0', zombie: '#7ab868', skeleton: '#ece6d2', ghost: '#dcebff', slime: '#5ad06a', slimelet: '#8ae89a', archer: '#ece6d2', hound: '#c8483a', bloater: '#d878c8', knight: '#a8b4c8', necro: '#7a4aa8', wisp: '#7fd8ff', golem: '#a09888', wolf: '#e8f0f8', yeti: '#ffffff', imp: '#ff6a3a', crawler: '#ff9a3a', shade: '#a05aff', watcher: '#f2e8f6' };

class View {
  constructor(run) {
    this.run = run;
    this.fx = new FX();
    this.W = 360; this.H = 640; this.k = 1; this.dpr = 1; this.scale = 1;
    this.sa = { top: 0, bottom: 0 };
    this.shake = 0;
    this.hurtFlash = 0;
    this.whiteFlash = 0;
    this.banner = null;
    this.tile = null;
    this.tileFor = 0;
    this.sorted = [];
    this.t = 0;
    this.dmgNums = true;
    this.dawnGlow = 0;
    this.snow = [];
    for (let i = 0; i < 70; i++) this.snow.push({ x: Math.random(), y: Math.random(), s: rand(0.6, 1.4) });
  }

  layout(W, H, sa, dpr) {
    this.W = W;
    this.H = H;
    this.sa = sa || this.sa;
    this.dpr = dpr || this.dpr;
    this.scale = Math.min(W, H) / VIEW_SHORT;
    this.k = this.scale * this.dpr;
    this.run.setView(W / this.scale, H / this.scale);
    if (Math.abs(this.tileFor - this.k) > 0.001) {
      Sprites.clear();
      DropSprites.cache.clear();
      DecorSprites.cache.clear();
      this.tile = groundTile(this.run.stage, Math.round(256 * this.k));
      this.tileFor = this.k;
    }
  }

  say(text, sub, col, time) {
    this.banner = { text, sub: sub || '', col: col || '#fff', t: 0, life: time || 2.4 };
  }

  // Turn simulation events into effects.
  onEvent(ev) {
    const fx = this.fx, run = this.run, p = run.player;
    switch (ev[0]) {
      case 'dmg':
        if (this.dmgNums) fx.text(ev[1], ev[2], String(Math.round(ev[3])), ev[4] ? '#ffd84a' : '#ffffff', ev[4] ? 11 : 8.5);
        break;
      case 'kill': {
        const col = KILL_COLS[ev[3]] || '#fff';
        if (ev[4] === 2) {
          fx.flash(ev[1], ev[2], 140, '#fff3c0', 0.6);
          fx.ring(ev[1], ev[2], 160, '#ffd84a', 0.7, 6);
          fx.sparks(ev[1], ev[2], 40, '#ffd84a', 320);
          this.shake = Math.max(this.shake, 14);
        } else {
          fx.puff(ev[1], ev[2], (ev[5] || 10) * 1.3, col, 0.35);
          fx.sparks(ev[1], ev[2], ev[4] ? 14 : 4, col, ev[4] ? 220 : 120);
          if (ev[4]) { fx.ring(ev[1], ev[2], 60, '#ffd84a', 0.4, 4); this.shake = Math.max(this.shake, 5); }
        }
        break;
      }
      case 'hurt':
        this.hurtFlash = 0.35;
        this.shake = Math.max(this.shake, 4);
        fx.sparks(p.x, p.y, 5, '#ff5a5a', 120);
        break;
      case 'heal':
        if (ev[1] >= 3) fx.text(p.x, p.y - 22, '+' + Math.round(ev[1]), '#6fe07a', 10);
        break;
      case 'coin':
        fx.text(p.x, p.y - 22, '+' + ev[1], '#ffcc33', 9);
        break;
      case 'zap':
        fx.zap(ev[1], ev[2] ? '#e0fbff' : '#9fe8ff', ev[2] ? 3.5 : 2.5);
        fx.flash(ev[1][2], ev[1][3], 26, '#bff4ff', 0.2);
        break;
      case 'boom':
        fx.flash(ev[1], ev[2], ev[3] * 1.6, ev[4] || '#ffb040', 0.3);
        fx.ring(ev[1], ev[2], ev[3], ev[4] || '#ffb040', 0.3, 3);
        fx.sparks(ev[1], ev[2], 6, ev[4] || '#ffb040', 160);
        this.shake = Math.max(this.shake, 2);
        break;
      case 'spike':
        fx.ring(ev[1], ev[2], ev[3], '#ffd84a', 0.3, 4);
        fx.shards(ev[1], ev[2], 8, ev[4] ? '#fff3a8' : '#ffd84a');
        break;
      case 'slam':
        fx.ring(ev[1], ev[2], ev[3], '#ff6a4a', 0.45, 6);
        fx.puff(ev[1], ev[2], ev[3], 'rgba(160,120,100,0.6)', 0.5);
        this.shake = Math.max(this.shake, 10);
        break;
      case 'blink':
        fx.puff(ev[1], ev[2], 24, '#7a3ab8', 0.4);
        fx.puff(ev[3], ev[4], 24, '#7a3ab8', 0.4);
        fx.ring(ev[3], ev[4], 40, '#d07aff', 0.35, 3);
        break;
      case 'summon':
        fx.ring(ev[1], ev[2], 60, '#7aff8a', 0.5, 3);
        break;
      case 'bomb':
      case 'flash':
        this.whiteFlash = 0.6;
        this.shake = Math.max(this.shake, 8);
        break;
      case 'prop':
        fx.sparks(ev[1], ev[2], 14, '#ffb040', 160);
        fx.puff(ev[1], ev[2], 20, '#ffb040', 0.4);
        break;
      case 'level':
        fx.ring(p.x, p.y, 70, '#7fc8ff', 0.5, 4);
        fx.sparks(p.x, p.y, 16, '#bfe8ff', 180);
        break;
      case 'enrage':
        fx.ring(ev[1], ev[2], 120, '#ff3a3a', 0.6, 6);
        this.say('ENRAGED!', '', '#ff6a5a', 1.6);
        this.shake = Math.max(this.shake, 10);
        break;
      case 'boss':
        this.say(BOSSES[ev[1]].name, ev[2] ? 'The night\'s master is here' : 'A mighty foe appears', '#ff8a6a', 3);
        this.shake = Math.max(this.shake, 8);
        break;
      case 'bossWarn':
        this.say(ev[2] ? 'Dawn is near...' : 'Something big approaches...', ev[2] ? 'Defeat the master of the night!' : '', '#ffb070', 3);
        break;
      case 'bossDown':
        this.say('VICTORY!', BOSSES[ev[1]].name + ' defeated', '#ffd84a', 2.2);
        break;
      case 'swarm':
        this.say('Swarm!', '', '#d8b0ff', 1.6);
        break;
      case 'ring':
        this.say('Surrounded!', '', '#9fe8ff', 1.6);
        break;
      case 'elite':
        break;
      case 'blizzard':
        if (ev[1]) this.say('Blizzard!', 'The wind pushes everything', '#cfe8ff', 1.8);
        break;
      case 'revive':
        fx.ring(p.x, p.y, 160, '#ffd84a', 0.8, 8);
        this.say('REVIVED!', '', '#ffd84a', 2);
        break;
      case 'dawn':
        this.dawnGlow = 1;
        this.say('DAWN BREAKS!', 'You survived the night', '#ffd88a', 3.4);
        this.shake = 16;
        break;
    }
  }

  update(dt) {
    this.t += dt;
    this.fx.update(dt);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 30);
    if (this.hurtFlash > 0) this.hurtFlash -= dt;
    if (this.whiteFlash > 0) this.whiteFlash -= dt;
    if (this.banner) { this.banner.t += dt; if (this.banner.t > this.banner.life) this.banner = null; }
    if (this.dawnGlow > 0 && this.run.dawnT <= 0 && this.run.over) this.dawnGlow = Math.max(0.6, this.dawnGlow);
  }

  // ----- drawing -----
  draw(ctx) {
    const run = this.run, p = run.player, k = this.k, dpr = this.dpr;
    const W = this.W, H = this.H;
    let sx = 0, sy = 0;
    if (this.shake > 0) { sx = rand(-1, 1) * this.shake * 0.4; sy = rand(-1, 1) * this.shake * 0.4; }
    const camX = p.x, camY = p.y;
    const hw = W / this.scale / 2, hh = H / this.scale / 2;
    this.view = { x0: camX - hw - 40, x1: camX + hw + 40, y0: camY - hh - 50, y1: camY + hh + 50 };
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = run.stage.ground[0];
    ctx.fillRect(0, 0, W, H);
    // ground tiles (device-pixel space)
    const T = this.tile.width;
    const ox = (W * dpr) / 2 - camX * k + sx * dpr, oy = (H * dpr) / 2 - camY * k + sy * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const tx0 = Math.floor(-ox / T), ty0 = Math.floor(-oy / T);
    for (let ty = ty0; ty * T + oy < H * dpr; ty++) for (let tx = tx0; tx * T + ox < W * dpr; tx++) ctx.drawImage(this.tile, Math.round(tx * T + ox), Math.round(ty * T + oy));
    // world transform
    ctx.setTransform(k, 0, 0, k, ox, oy);
    this.ox = ox;
    this.oy = oy;
    this.drawDecor(ctx);
    this.drawZones(ctx, false);
    this.drawWeaponsUnder(ctx);
    this.drawDrops(ctx);
    this.drawEntities(ctx);
    this.drawProjs(ctx);
    this.drawWeaponsOver(ctx);
    this.drawZones(ctx, true);
    this.fx.draw(ctx);
    this.drawEnemyShots(ctx);
    this.drawNight(ctx);
    this.drawLights(ctx);
    // screen space
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.drawWeather(ctx);
    if (this.hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, 'rgba(255,0,0,0)');
      g.addColorStop(1, `rgba(255,30,30,${Math.min(0.5, this.hurtFlash * 1.4)})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (this.whiteFlash > 0) {
      ctx.fillStyle = `rgba(255,250,220,${Math.min(0.85, this.whiteFlash * 1.5)})`;
      ctx.fillRect(0, 0, W, H);
    }
    this.drawHUD(ctx);
  }

  inView(x, y, r) {
    const v = this.view;
    return x + r > v.x0 && x - r < v.x1 && y + r > v.y0 && y - r < v.y1;
  }

  drawDecor(ctx) {
    const v = this.view, C = 150, kind = this.run.stage.decor, list = DECOR[kind];
    const cx0 = Math.floor(v.x0 / C) - 1, cx1 = Math.floor(v.x1 / C) + 1, cy0 = Math.floor(v.y0 / C) - 1, cy1 = Math.floor(v.y1 / C) + 1;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const h = hashStr(cx + ',' + cy);
        if (h % 100 >= 30) continue;
        const x = cx * C + ((h >>> 8) % C), y = cy * C + ((h >>> 16) % C);
        const r = 12 + ((h >>> 4) % 9);
        if (!this.inView(x, y, r * 2)) continue;
        const spr = DecorSprites.get(kind, (h >>> 12) % list.length, r * this.k);
        const s = spr.width / this.k;
        ctx.drawImage(spr, x - s / 2, y - s / 2, s, s);
      }
    }
  }

  drawZones(ctx, over) {
    const run = this.run, t = this.t;
    for (const z of run.zones) {
      if (z.dead || !this.inView(z.x, z.y, (z.r || 40) + (z.len || 0))) continue;
      const u = z.t / z.life;
      switch (z.k) {
        case 'slash': {
          if (!over) break;
          const a = 1 - u;
          ctx.save();
          ctx.translate(z.x, z.y);
          ctx.scale(z.side, 1);
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.ellipse(-z.rx * 0.2, 0, z.rx * 1.1, z.ry * 1.25, 0, -Math.PI / 2, Math.PI / 2);
          ctx.ellipse(-z.rx * 0.45, 0, z.rx * 0.8, z.ry * 0.7, 0, Math.PI / 2, -Math.PI / 2, true);
          ctx.closePath();
          ctx.fillStyle = rgba(z.col, 0.85);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.stroke();
          ctx.restore();
          ctx.globalAlpha = 1;
          break;
        }
        case 'pool': {
          if (over) break;
          const fade = Math.min(1, (1 - u) * 4, z.t * 6);
          ctx.globalAlpha = fade * 0.75;
          const gl = Glow.get(z.inferno ? '#ff3a1a' : '#ff7a2a', 32);
          ctx.drawImage(gl, z.x - z.r * 1.3, z.y - z.r * 1.3, z.r * 2.6, z.r * 2.6);
          ctx.globalAlpha = fade;
          for (let i = 0; i < 5; i++) {
            const a = i * 1.26 + t * 2, rr2 = z.r * (0.25 + (i % 3) * 0.22);
            const fx2 = z.x + Math.cos(a) * rr2, fy = z.y + Math.sin(a) * rr2 * 0.6;
            const fl = 4 + Math.sin(t * 12 + i) * 1.5;
            ctx.fillStyle = i % 2 ? '#ffd84a' : '#ff8a2a';
            ctx.beginPath();
            ctx.moveTo(fx2 - fl * 0.6, fy);
            ctx.quadraticCurveTo(fx2, fy - fl * 2.6, fx2 + fl * 0.6, fy);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'nova': {
          if (!over) break;
          ctx.globalAlpha = 1 - u;
          ctx.strokeStyle = z.zero ? '#e8fbff' : '#9fe4ff';
          ctx.lineWidth = z.zero ? 7 : 5;
          circle(ctx, z.x, z.y, z.cur || 1);
          ctx.stroke();
          ctx.fillStyle = z.zero ? 'rgba(200,240,255,0.18)' : 'rgba(150,220,255,0.12)';
          ctx.fill();
          ctx.globalAlpha = 1;
          break;
        }
        case 'rune': {
          if (over) break;
          const ready = !(z.cool > 0);
          ctx.globalAlpha = Math.min(1, z.t * 4, (z.life - z.t) * 2) * (ready ? 1 : 0.4);
          ctx.strokeStyle = z.glyph ? '#fff3a8' : '#ffd84a';
          ctx.lineWidth = 1.6;
          circle(ctx, z.x, z.y, 11 + Math.sin(t * 5 + z.x) * 1);
          ctx.stroke();
          ctx.beginPath();
          for (let i = 0; i < 3; i++) {
            const a = t * 1.5 + (i * TAU) / 3;
            ctx.moveTo(z.x + Math.cos(a) * 7, z.y + Math.sin(a) * 7);
            ctx.lineTo(z.x + Math.cos(a + 2.1) * 7, z.y + Math.sin(a + 2.1) * 7);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        }
        case 'vent': {
          if (over) break;
          if (z.t < z.warn) {
            const w = z.t / z.warn;
            ctx.fillStyle = `rgba(255,80,30,${0.12 + w * 0.2})`;
            circle(ctx, z.x, z.y, z.r);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,120,40,0.35)';
            circle(ctx, z.x, z.y, z.r * w);
            ctx.fill();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#ff6a2a';
            ctx.lineWidth = 1.5;
            circle(ctx, z.x, z.y, z.r);
            ctx.stroke();
            ctx.setLineDash([]);
          } else {
            const f = Math.min(1, (z.life - z.t) * 2);
            ctx.globalAlpha = f;
            const gl = Glow.get('#ff5a1a', 32);
            ctx.drawImage(gl, z.x - z.r * 1.5, z.y - z.r * 1.5, z.r * 3, z.r * 3);
            ctx.fillStyle = '#ffb040';
            for (let i = 0; i < 6; i++) {
              const a = i + t * 3, rr2 = z.r * 0.6 * ((i * 37) % 10) / 10;
              const fl = 5 + Math.sin(t * 14 + i) * 2;
              const fx2 = z.x + Math.cos(a) * rr2, fy = z.y + Math.sin(a) * rr2 * 0.6;
              ctx.beginPath();
              ctx.moveTo(fx2 - fl * 0.6, fy);
              ctx.quadraticCurveTo(fx2, fy - fl * 3.2, fx2 + fl * 0.6, fy);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
          break;
        }
        case 'rift': {
          if (over) break;
          ctx.globalAlpha = Math.min(1, z.t * 2, (z.life - z.t) * 2);
          const gl = Glow.get('#7a2aff', 32);
          ctx.drawImage(gl, z.x - z.r * 1.6, z.y - z.r * 1.6, z.r * 3.2, z.r * 3.2);
          ctx.fillStyle = '#12061f';
          circle(ctx, z.x, z.y, z.r * 0.75);
          ctx.fill();
          ctx.strokeStyle = '#c08aff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 3; i++) {
            const a = t * 3 + (i * TAU) / 3;
            ctx.moveTo(z.x + Math.cos(a) * z.r * 0.75, z.y + Math.sin(a) * z.r * 0.75);
            ctx.quadraticCurveTo(z.x + Math.cos(a + 1) * z.r * 0.3, z.y + Math.sin(a + 1) * z.r * 0.3, z.x, z.y);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        }
        case 'puddle': {
          if (over) break;
          ctx.globalAlpha = Math.min(1, (z.life - z.t)) * 0.7;
          ctx.fillStyle = '#ff6a1a';
          ellipse(ctx, z.x, z.y, z.r, z.r * 0.7);
          ctx.fill();
          ctx.fillStyle = '#ffc84a';
          ellipse(ctx, z.x, z.y, z.r * 0.55, z.r * 0.38);
          ctx.fill();
          ctx.globalAlpha = 1;
          break;
        }
        case 'warn': {
          if (!over) break;
          ctx.fillStyle = 'rgba(255,40,40,0.16)';
          circle(ctx, z.x, z.y, z.r);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,60,40,0.35)';
          circle(ctx, z.x, z.y, z.r * u);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,90,70,0.9)';
          ctx.lineWidth = 2;
          circle(ctx, z.x, z.y, z.r);
          ctx.stroke();
          break;
        }
        case 'warnLine': {
          if (!over) break;
          ctx.save();
          ctx.translate(z.x, z.y);
          ctx.rotate(z.ang);
          ctx.fillStyle = `rgba(255,50,40,${0.14 + u * 0.2})`;
          ctx.fillRect(0, -z.w / 2, z.len, z.w);
          ctx.strokeStyle = 'rgba(255,90,70,0.8)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(0, -z.w / 2, z.len, z.w);
          ctx.restore();
          break;
        }
      }
    }
  }

  drawWeaponsUnder(ctx) {
    const run = this.run, p = run.player;
    for (const w of run.weapons) {
      const s = w.s;
      if ((w.key === 'aura' || w.key === 'sanctum') && s.r) {
        const sanct = w.key === 'sanctum';
        const gl = Glow.get(sanct ? '#fff3b0' : '#fff0a0', 48);
        ctx.globalAlpha = 0.28 + (s.pulse || 0) * 0.25;
        ctx.drawImage(gl, p.x - s.r * 1.25, p.y - s.r * 1.25, s.r * 2.5, s.r * 2.5);
        ctx.globalAlpha = 0.5 + (s.pulse || 0) * 0.4;
        ctx.strokeStyle = sanct ? '#ffe98a' : '#fff3a8';
        ctx.lineWidth = 1.5;
        circle(ctx, p.x, p.y, s.r);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  drawWeaponsOver(ctx) {
    const run = this.run, p = run.player;
    for (const w of run.weapons) {
      const s = w.s, col = WEAPONS[w.key].col;
      if ((w.key === 'blades' || w.key === 'halo') && s.on && s.n) {
        for (let i = 0; i < s.n; i++) {
          const a = s.ang + (i * TAU) / s.n;
          const x = p.x + Math.cos(a) * s.rad, y = p.y + Math.sin(a) * s.rad;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(a + Math.PI / 2 + this.t * 0);
          const L = s.size * 1.7;
          ctx.globalAlpha = 0.35;
          ctx.drawImage(Glow.get(col, 24), -L, -L, L * 2, L * 2);
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.moveTo(0, -L);
          ctx.lineTo(L * 0.35, 0);
          ctx.lineTo(0, L * 0.5);
          ctx.lineTo(-L * 0.35, 0);
          ctx.closePath();
          ctx.fillStyle = '#f2f6ff';
          ctx.fill();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = OUT;
          ctx.stroke();
          ctx.restore();
        }
      }
      if ((w.key === 'beam' || w.key === 'solar') && s.on && s.n) {
        ctx.lineCap = 'round';
        for (let i = 0; i < s.n; i++) {
          const a = s.ang + (i * TAU) / s.n;
          const x1 = p.x + Math.cos(a) * s.len, y1 = p.y + Math.sin(a) * s.len;
          ctx.strokeStyle = rgba(col, 0.35);
          ctx.lineWidth = s.width * 2.6;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x1, y1); ctx.stroke();
          ctx.strokeStyle = rgba(col, 0.9);
          ctx.lineWidth = s.width * 1.2;
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = s.width * 0.45;
          ctx.stroke();
        }
      }
      if ((w.key === 'drones' || w.key === 'hive') && s.d) {
        for (const d of s.d) {
          const bob = Math.sin(this.t * 6 + d.x * 0.1) * 1.5;
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ellipse(ctx, d.x, d.y + 14, 5, 2);
          ctx.fill();
          ctx.strokeStyle = '#cfd8e8';
          ctx.lineWidth = 1.2;
          const pr = 5 + Math.sin(this.t * 40) * 2;
          ctx.beginPath(); ctx.moveTo(d.x - pr - 4, d.y - 5 + bob); ctx.lineTo(d.x + pr + 4, d.y - 5 + bob); ctx.stroke();
          rr(ctx, d.x - 5, d.y - 4 + bob, 10, 7, 3, col, 1.2);
          ctx.fillStyle = '#fff';
          ctx.fillRect(d.x - 1, d.y - 2 + bob, 2, 2);
        }
      }
    }
  }

  drawDrops(ctx) {
    const run = this.run, k = this.k, t = this.t;
    for (const d of run.drops) {
      if (d.dead || !this.inView(d.x, d.y, 12)) continue;
      let spr, r;
      if (d.k === 'gem') {
        const tier = d.big ? 2 : gemTier(d.v);
        r = d.big ? 8 : 4.2 + tier * 0.9;
        spr = DropSprites.get('gem', tier, r * k);
      } else if (d.k === 'chest') {
        r = 9;
        spr = DropSprites.get('chest', d.boss ? 1 : 0, r * k);
        ctx.globalAlpha = 0.5 + Math.sin(t * 5) * 0.2;
        ctx.drawImage(Glow.get(d.boss ? '#c88aff' : '#ffd84a', 32), d.x - 22, d.y - 22, 44, 44);
        ctx.globalAlpha = 1;
      } else {
        r = d.k === 'coin' ? 4.5 : 6.5;
        spr = DropSprites.get(d.k, 0, r * k);
      }
      const bob = d.k === 'gem' ? 0 : Math.sin(t * 4 + d.x) * 1.5;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(spr, Math.round(d.x * k + this.ox - spr.width / 2), Math.round((d.y + bob) * k + this.oy - spr.height / 2));
      ctx.setTransform(k, 0, 0, k, this.ox, this.oy);
    }
  }

  drawEntities(ctx) {
    const run = this.run, p = run.player, k = this.k, list = this.sorted;
    list.length = 0;
    for (const e of run.enemies) if (!e.dead && this.inView(e.x, e.y, e.r * 2)) list.push(e);
    list.push(p);
    list.sort((a, b) => a.y - b.y);
    // shadows first
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    for (const e of list) {
      const r = e.r, fly = e.fly ? 6 : 0;
      ctx.moveTo(e.x + r * 0.8, e.y + r * 0.95 + fly);
      ctx.ellipse(e.x, e.y + r * 0.95 + fly, r * 0.8, r * 0.3, 0, 0, TAU);
    }
    ctx.fill();
    // sprites are stamped 1:1 in device pixels: crisp and fast
    const ox = this.ox, oy = this.oy;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const e of list) {
      if (e === p) {
        ctx.setTransform(k, 0, 0, k, ox, oy);
        this.drawPlayer(ctx);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        continue;
      }
      const sp = e.ai === 'bat' || e.ai === 'sweep' || e.type === 'imp' ? 9 : 5;
      let frame = Math.floor(e.t * sp) % 2;
      if (e.frozen > 0) frame = 0;
      let variant = 'n';
      if (e.boss) variant = 'boss';
      else if (e.elite) variant = 'elite';
      if (e.flash > 0) variant = 'flash';
      else if (e.frozen > 0) variant = 'frozen';
      if (e.ai === 'bloat' && e.st === 1 && Math.floor(this.t * 12) % 2) variant = 'flash';
      const tint = e.boss ? BOSSES[e.bossKey].tint : null;
      const spr = Sprites.get(e.boss ? e.bossKey : e.look, e.look, frame, e.fx < 0, variant, e.r * k, tint);
      const bob = e.ai === 'hop' ? -Math.max(0, Math.sin(e.t * 5 + e.id)) * e.r * 0.5 : e.fly ? Math.sin(e.t * 4 + e.id) * 2 - 4 : 0;
      if (e.spawnT > 0) ctx.globalAlpha = Math.max(0.1, 1 - e.spawnT / 0.6);
      else if (e.ghost && !e.boss) ctx.globalAlpha = 0.85;
      ctx.drawImage(spr, Math.round(e.x * k + ox - spr.width / 2), Math.round((e.y + bob) * k + oy - spr.height / 2));
      ctx.globalAlpha = 1;
      if (e.prop || (e.ai === 'charge' && e.st === 1) || (e.elite && e.hp < e.maxHp)) {
        ctx.setTransform(k, 0, 0, k, ox, oy);
        if (e.prop) {
          ctx.globalAlpha = 0.5 + Math.sin(this.t * 6 + e.id) * 0.15;
          ctx.drawImage(Glow.get('#ffb040', 32), e.x - 26, e.y - e.r - 20, 52, 52);
          ctx.globalAlpha = 1;
        }
        if (e.ai === 'charge' && e.st === 1) outlineText(ctx, '!', e.x, e.y - e.r - 10, 16, '#ff4a3a');
        if (e.elite && e.hp < e.maxHp) this.bar(ctx, e.x, e.y - e.r - 8, e.r * 2, 3, e.hp / e.maxHp, '#ffd84a');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
    }
    ctx.setTransform(k, 0, 0, k, ox, oy);
  }

  drawPlayer(ctx) {
    if (this.dead) return;
    const run = this.run, p = run.player, k = this.k;
    const ch = run.char;
    const frame = p.moving ? Math.floor(p.walk) % 2 : 0;
    const blink = p.hurtT > 0 && Math.floor(this.t * 30) % 2;
    const spr = Sprites.get('hero:' + run.charKey, ch.look, frame, p.fx < 0, blink ? 'flash' : 'n', p.r * k);
    const s = spr.width / k;
    const bob = p.moving ? -Math.abs(Math.sin(p.walk * Math.PI)) * 1.5 : 0;
    ctx.drawImage(spr, p.x - s / 2, p.y - s / 2 + bob, s, s);
    // health bar under the hero
    const hpf = clamp(p.hp / run.stats.maxHp, 0, 1);
    this.bar(ctx, p.x, p.y + p.r + 7, 26, 3.5, hpf, hpf > 0.5 ? '#6fe07a' : hpf > 0.25 ? '#ffd84a' : '#ff4a4a');
  }

  bar(ctx, x, y, w, h, f, col) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x - w / 2 - 0.8, y - 0.8, w + 1.6, h + 1.6);
    ctx.fillStyle = col;
    ctx.fillRect(x - w / 2, y, w * f, h);
  }

  drawProjs(ctx) {
    const run = this.run;
    for (const p of run.projs) {
      if (p.dead || !this.inView(p.x, p.y, 30)) continue;
      const col = WEAPONS[p.w.key].col;
      switch (p.k) {
        case 'bolt':
        case 'storm': {
          const r = p.r * 2.6;
          ctx.drawImage(Glow.get(col, 24), p.x - r, p.y - r, r * 2, r * 2);
          const sp = Math.hypot(p.vx, p.vy) || 1;
          ctx.strokeStyle = rgba(col, 0.6);
          ctx.lineWidth = p.r * 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - (p.vx / sp) * p.r * 3, p.y - (p.vy / sp) * p.r * 3);
          ctx.stroke();
          ctx.fillStyle = '#fff';
          circle(ctx, p.x, p.y, p.r * 0.55);
          ctx.fill();
          break;
        }
        case 'crescent': {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(p.ang, 1);
          ctx.globalAlpha = Math.min(1, (p.life - p.t) * 3);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.r * 0.7, p.r * 1.3, 0, -Math.PI / 2, Math.PI / 2);
          ctx.ellipse(-p.r * 0.35, 0, p.r * 0.5, p.r * 1.0, 0, Math.PI / 2, -Math.PI / 2, true);
          ctx.closePath();
          ctx.fillStyle = rgba(col, 0.9);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();
          ctx.globalAlpha = 1;
          break;
        }
        case 'boom':
        case 'moon': {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.ang);
          const r = p.r * 1.3;
          ctx.scale(r, r);
          ctx.lineJoin = 'round';
          pg(ctx, [-0.9, 0.35, 0, -0.55, 0.9, 0.35, 0.65, 0.55, 0, -0.1, -0.65, 0.55], col, 0.16);
          ctx.restore();
          break;
        }
        case 'flask': {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.ang);
          ctx.scale(5, 5);
          rr(ctx, -0.25, -1.1, 0.5, 0.5, 0.1, '#cfe4ff', 0.2);
          el(ctx, 0, 0, 0.75, 0.75, col, 0.2);
          ctx.restore();
          break;
        }
        case 'orb':
        case 'prism': {
          const r = p.r * 2.2;
          ctx.drawImage(Glow.get(col, 24), p.x - r, p.y - r, r * 2, r * 2);
          ctx.fillStyle = p.k === 'prism' ? '#fff0ff' : '#f2e0ff';
          circle(ctx, p.x, p.y, p.r * 0.6);
          ctx.fill();
          break;
        }
        case 'missile': {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.ang);
          ctx.drawImage(Glow.get('#ffb040', 16), -14, -6, 12, 12);
          rr(ctx, -5, -2.2, 9, 4.4, 2, '#e8eef5', 1);
          ctx.fillStyle = col;
          ctx.fillRect(1, -2.2, 2, 4.4);
          ctx.restore();
          break;
        }
      }
    }
  }

  drawEnemyShots(ctx) {
    for (const b of this.run.eprojs) {
      if (b.dead || !this.inView(b.x, b.y, 12)) continue;
      if (b.k === 'arrow') {
        const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
        ln(ctx, b.x - ux * 9, b.y - uy * 9, b.x + ux * 3, b.y + uy * 3, 1.8, '#e8d8b0');
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(b.x + ux * 6, b.y + uy * 6);
        ctx.lineTo(b.x - uy * 3, b.y + ux * 3);
        ctx.lineTo(b.x + uy * 3, b.y - ux * 3);
        ctx.fill();
        continue;
      }
      const col = b.col || SHOT_COLS[b.k] || '#ff5a3a';
      const r = b.r;
      ctx.drawImage(Glow.get(col, 16), b.x - r * 2.4, b.y - r * 2.4, r * 4.8, r * 4.8);
      circle(ctx, b.x, b.y, r);
      ctx.fillStyle = b.k === 'snowball' ? '#ffffff' : '#fff6e8';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = b.k === 'boss' ? '#2a0a1a' : OUT;
      ctx.stroke();
      if (b.k === 'boss' || b.k === 'spread' || b.k === 'fireball') {
        ctx.fillStyle = col;
        circle(ctx, b.x, b.y, r * 0.55);
        ctx.fill();
      }
    }
  }

  // Night darkness with a pool of lantern light around the hero; it lifts as dawn nears.
  drawNight(ctx) {
    const run = this.run, st = run.stage, p = run.player;
    const prog = clamp(run.T / NIGHT, 0, 1);
    let a = lerp(0.5, 0.12, prog);
    if (run.dawnT > 0 || run.won) a = Math.max(0, a - (1 - Math.max(0, run.dawnT) / 3.5) * 0.4);
    if (a <= 0.01) return;
    const v = this.view;
    const g = ctx.createRadialGradient(p.x, p.y - 4, 55, p.x, p.y, Math.max(v.x1 - v.x0, v.y1 - v.y0) * 0.55);
    const night = prog < 0.8 ? st.night : st.night;
    g.addColorStop(0, rgba(night, 0));
    g.addColorStop(0.35, rgba(night, a * 0.55));
    g.addColorStop(1, rgba(night, a));
    ctx.fillStyle = g;
    ctx.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    if (prog > 0.75) {
      // warm dawn glow creeping in from the top of the screen
      const d = (prog - 0.75) / 0.25;
      const g2 = ctx.createLinearGradient(0, v.y0, 0, v.y0 + (v.y1 - v.y0) * 0.6);
      g2.addColorStop(0, rgba(st.dawn, 0.28 * d));
      g2.addColorStop(1, rgba(st.dawn, 0));
      ctx.fillStyle = g2;
      ctx.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    }
  }

  drawLights(ctx) {
    const run = this.run, p = run.player, t = this.t;
    ctx.globalCompositeOperation = 'lighter';
    // the lantern
    const fl = 1 + Math.sin(t * 9) * 0.04 + Math.sin(t * 23) * 0.03;
    ctx.globalAlpha = 0.22;
    ctx.drawImage(Glow.get('#ffb050', 48), p.x + p.fx * 9 - 40 * fl, p.y - 36 * fl, 80 * fl, 80 * fl);
    ctx.globalAlpha = 0.5;
    for (const e of run.enemies) {
      if (e.prop && !e.dead && this.inView(e.x, e.y, 30)) ctx.drawImage(Glow.get('#ff9a30', 32), e.x - 22, e.y - e.r - 14, 44, 44);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (this.dawnGlow > 0) {
      const v = this.view;
      ctx.fillStyle = `rgba(255,220,160,${0.25 * this.dawnGlow})`;
      ctx.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    }
  }

  drawWeather(ctx) {
    const run = this.run;
    const W = this.W, H = this.H;
    if (run.stage.hazard === 'blizzard' || run.stage.decor === 'ice') {
      const wind = run.wind, strong = Math.hypot(wind.x, wind.y) > 1;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const n = strong ? 70 : 30;
      for (let i = 0; i < n; i++) {
        const s = this.snow[i];
        const vx = strong ? wind.x * 6 : 8, vy = strong ? wind.y * 6 + 30 : 30;
        const x = (((s.x * W + this.t * vx * s.s - run.player.x * this.scale * 0.3) % W) + W) % W;
        const y = (((s.y * H + this.t * vy * s.s - run.player.y * this.scale * 0.3) % H) + H) % H;
        if (strong) {
          ctx.globalAlpha = 0.5;
          ctx.fillRect(x, y, 6 * s.s, 1.4);
        } else {
          ctx.globalAlpha = 0.7;
          ctx.fillRect(x, y, 2 * s.s, 2 * s.s);
        }
      }
      ctx.globalAlpha = 1;
      if (strong) {
        ctx.fillStyle = 'rgba(220,235,255,0.12)';
        ctx.fillRect(0, 0, W, H);
      }
    } else if (run.stage.decor === 'lava') {
      ctx.fillStyle = 'rgba(255,150,60,0.7)';
      for (let i = 0; i < 24; i++) {
        const s = this.snow[i];
        const x = (((s.x * W - run.player.x * this.scale * 0.4 + Math.sin(this.t + i) * 10) % W) + W) % W;
        const y = (((s.y * H - this.t * 24 * s.s - run.player.y * this.scale * 0.4) % H) + H) % H;
        ctx.globalAlpha = 0.5 + Math.sin(this.t * 3 + i) * 0.3;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ----- HUD (CSS pixels) -----
  drawHUD(ctx) {
    const run = this.run, W = this.W, H = this.H, top = this.sa.top, bot = this.sa.bottom;
    // XP bar
    const xb = 8, yb = top + 6, wb = W - 16, hb = 13;
    ctx.fillStyle = 'rgba(5,8,25,0.75)';
    roundRect(ctx, xb - 1.5, yb - 1.5, wb + 3, hb + 3, 6);
    ctx.fill();
    const f = clamp(run.xp / run.xpNext, 0, 1);
    if (f > 0) {
      const g = ctx.createLinearGradient(xb, 0, xb + wb, 0);
      g.addColorStop(0, '#3a8aff');
      g.addColorStop(1, '#8ad8ff');
      ctx.fillStyle = g;
      roundRect(ctx, xb, yb, Math.max(6, wb * f), hb, 5);
      ctx.fill();
    }
    outlineText(ctx, 'LV ' + run.level, xb + wb - 6, yb + hb / 2 + 0.5, 11, '#fff', 'right');
    // timer + dawn progress
    const time = run.mode === 'quick' ? run.time : run.time;
    outlineText(ctx, fmtTime(time), W / 2, top + 38, 22, '#fff');
    const pw = 96, px = W / 2 - pw / 2, py = top + 54;
    const prog = clamp(run.T / NIGHT, 0, 1);
    ctx.fillStyle = 'rgba(5,8,25,0.6)';
    roundRect(ctx, px, py, pw, 5, 2.5);
    ctx.fill();
    const g2 = ctx.createLinearGradient(px, 0, px + pw, 0);
    g2.addColorStop(0, '#6a7aff');
    g2.addColorStop(1, '#ffc46a');
    ctx.fillStyle = g2;
    roundRect(ctx, px, py, Math.max(5, pw * prog), 5, 2.5);
    ctx.fill();
    ctx.fillStyle = '#cfd8ff';
    circle(ctx, px - 7, py + 2.5, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(5,8,25,1)';
    circle(ctx, px - 5.5, py + 1.5, 3.2);
    ctx.fill();
    ctx.fillStyle = '#ffc46a';
    circle(ctx, px + pw + 7, py + 2.5, 4);
    ctx.fill();
    // kills and gold
    outlineText(ctx, '💀 ' + fmtNum(run.kills), 10, top + 36, 13, '#fff', 'left');
    ctx.fillStyle = '#ffcc33';
    circle(ctx, 16, top + 56, 5.5);
    ctx.fill();
    ctx.strokeStyle = '#8a5a00';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    outlineText(ctx, fmtNum(run.gold), 25, top + 56.5, 13, '#ffe27a', 'left');
    // inventory
    let x = 8;
    const iy = top + 70;
    for (const w of run.weapons) {
      this.slotIcon(ctx, w.key, x, iy, 22, WEAPONS[w.key].evolved ? 'MAX' : w.lvl, WEAPONS[w.key].evolved);
      x += 25;
    }
    x = 8;
    for (const p of run.passives) {
      this.slotIcon(ctx, p.key, x, iy + 27, 17, p.lvl, false);
      x += 20;
    }
    // boss bar
    const b = run.boss;
    if (b && !b.dead) {
      const bw = Math.min(W - 40, 420), bx = (W - bw) / 2, by = H - bot - 26;
      ctx.fillStyle = 'rgba(10,4,12,0.8)';
      roundRect(ctx, bx - 2, by - 2, bw + 4, 14, 6);
      ctx.fill();
      const g3 = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g3.addColorStop(0, '#ff3a5a');
      g3.addColorStop(1, '#ff9a4a');
      ctx.fillStyle = g3;
      roundRect(ctx, bx, by, Math.max(4, bw * clamp(b.hp / b.maxHp, 0, 1)), 10, 5);
      ctx.fill();
      outlineText(ctx, BOSSES[b.bossKey].name + (b.phase === 2 ? ' (enraged)' : ''), W / 2, by - 10, 13, '#ffd0c0');
    }
    // banner
    const bn = this.banner;
    if (bn) {
      const u = bn.t / bn.life;
      const a = u < 0.1 ? u / 0.1 : u > 0.8 ? (1 - u) / 0.2 : 1;
      ctx.globalAlpha = a;
      const sc = u < 0.1 ? 0.7 + u * 3 : 1;
      outlineText(ctx, bn.text, W / 2, H * 0.27, 28 * sc, bn.col);
      if (bn.sub) outlineText(ctx, bn.sub, W / 2, H * 0.27 + 26, 13, '#f0e8ff');
      ctx.globalAlpha = 1;
    }
    Input.draw(ctx);
  }

  slotIcon(ctx, key, x, y, s, lvl, evo) {
    ctx.fillStyle = evo ? 'rgba(80,50,0,0.75)' : 'rgba(5,8,25,0.7)';
    roundRect(ctx, x, y, s, s, 4);
    ctx.fill();
    if (evo) { ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 1.2; ctx.stroke(); }
    const ic = Icons.canvas(key, Math.round(s * this.dpr));
    ctx.drawImage(ic, x, y, s, s);
    outlineText(ctx, String(lvl), x + s - 1, y + s - 2, s > 20 ? 8 : 7, evo ? '#ffd84a' : '#fff', 'right');
  }
}

// ===== 12-save.js =====
// ---------- Saved progress (localStorage), run results, achievements and the daily night ----------
const SAVE_KEY = 'dawnkeeper-save-v1';
let SAVE = null;

function defaultSave() {
  return {
    v: 1,
    gold: 0,
    power: {},
    chars: ['lumen', 'aria'],
    weapons: BASE_WEAPONS.slice(0, 8),
    stages: 1,
    ach: {},
    stats: {
      kills: 0, byType: {}, runs: 0, wins: 0, bestTime: 0, maxLevel: 0, minis: 0, bosses: 0, chests: 0, maxWeapons: 0,
      goldEarned: 0, dailies: 0, bestKills: 0, bestEndless: 0, noHealClear: 0, playTime: 0,
    },
    best: {},
    cleared: {},
    heroClears: {},
    evolved: {},
    seen: { w: {}, e: {} },
    sel: { char: 'lumen', stage: 0, mode: 'normal', endless: false },
    daily: { date: '', best: 0, rewarded: false },
    settings: { sfx: true, music: true, vibrate: true, dmgNums: true, quality: 'auto' },
    tutorial: false,
  };
}

function loadGame() {
  const d0 = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      SAVE = Object.assign(d0, d);
      const fresh = defaultSave();
      SAVE.stats = Object.assign(fresh.stats, d.stats || {});
      SAVE.settings = Object.assign(fresh.settings, d.settings || {});
      SAVE.sel = Object.assign(fresh.sel, d.sel || {});
      SAVE.seen = Object.assign(fresh.seen, d.seen || {});
      SAVE.daily = Object.assign(fresh.daily, d.daily || {});
      SAVE.chars = (SAVE.chars || []).filter((k) => CHARACTERS[k]);
      for (const k of ['lumen', 'aria']) if (!SAVE.chars.includes(k)) SAVE.chars.push(k);
      SAVE.weapons = (SAVE.weapons || []).filter((k) => BASE_WEAPONS.includes(k));
      for (const k of BASE_WEAPONS.slice(0, 8)) if (!SAVE.weapons.includes(k)) SAVE.weapons.push(k);
      for (const k of Object.keys(SAVE.power)) if (!POWERUPS[k]) delete SAVE.power[k];
      SAVE.stages = clamp(SAVE.stages | 0, 1, STAGES.length);
      if (!CHARACTERS[SAVE.sel.char] || !SAVE.chars.includes(SAVE.sel.char)) SAVE.sel.char = 'lumen';
      if (!(SAVE.sel.stage >= 0 && SAVE.sel.stage < SAVE.stages)) SAVE.sel.stage = 0;
      return;
    }
  } catch (e) { /* corrupted or unavailable storage: start fresh */ }
  SAVE = d0;
}

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* storage unavailable */ }
}

function resetGame() {
  const s = SAVE.settings;
  SAVE = defaultSave();
  SAVE.settings = s;
  SAVE.tutorial = true;
  saveGame();
}

function achReward(a) {
  const r = a.reward, out = [];
  if (r.gold) { SAVE.gold += r.gold; out.push(r.gold + ' gold'); }
  if (r.char && !SAVE.chars.includes(r.char)) { SAVE.chars.push(r.char); out.push('Hero: ' + CHARACTERS[r.char].name); }
  if (r.weapon && !SAVE.weapons.includes(r.weapon)) { SAVE.weapons.push(r.weapon); out.push('Weapon: ' + WEAPONS[r.weapon].name); }
  if (r.stage) { SAVE.stages = Math.max(SAVE.stages, Math.min(STAGES.length, r.stage + 1)); out.push('Stage: ' + STAGES[Math.min(STAGES.length - 1, r.stage)].name); }
  return out.join(', ');
}

function rewardText(a) {
  const r = a.reward, out = [];
  if (r.gold) out.push(r.gold + ' gold');
  if (r.char) out.push('Hero ' + CHARACTERS[r.char].name);
  if (r.weapon) out.push(WEAPONS[r.weapon].name);
  if (r.stage) out.push(STAGES[r.stage].name);
  return out.join(' + ');
}

// Claims every achievement that is now complete. r = live run summary or null.
function checkAchievements(r) {
  const got = [];
  for (const a of ACHIEVEMENTS) {
    if (SAVE.ach[a.id]) continue;
    const [cur, goal] = a.prog(SAVE, r);
    if (cur >= goal) {
      SAVE.ach[a.id] = 1;
      got.push({ a, text: achReward(a) });
    }
  }
  if (got.length) saveGame();
  return got;
}

function powerRanks() {
  const p = {};
  for (const k of POWERUP_KEYS) p[k] = SAVE.power[k] || 0;
  return p;
}

// Fold a finished run into the save. Returns the gold earned (with bonuses).
function applyRunResult(run, quit) {
  const S = SAVE, st = S.stats, r = run.summary();
  let gold = run.gold;
  // a little gold for every minute survived, a lot for seeing the dawn
  gold += Math.floor(run.time / 60) * Math.round(10 * run.stage.gold);
  if (run.won) gold += Math.round(300 * (run.stageIdx + 1) * (run.mode === 'quick' ? 0.4 : 1));
  if (quit) gold = Math.round(gold * 0.5);
  S.gold += gold;
  st.goldEarned += gold;
  st.runs++;
  st.kills += run.kills;
  for (const [k, v] of Object.entries(run.byType)) st.byType[k] = (st.byType[k] || 0) + v;
  st.bestKills = Math.max(st.bestKills, run.kills);
  st.maxLevel = Math.max(st.maxLevel, run.level);
  st.minis += run.minis;
  st.bosses += run.bosses;
  st.chests += run.chestsOpened;
  st.maxWeapons = Math.max(st.maxWeapons, run.weapons.length);
  st.playTime += run.time;
  if (!quit) st.bestTime = Math.max(st.bestTime, run.time);
  if (run.endless) st.bestEndless = Math.max(st.bestEndless, run.time);
  for (const k of Object.keys(run.evolved)) S.evolved[k] = 1;
  for (const w of run.weapons) S.seen.w[w.key] = 1;
  for (const k of Object.keys(run.byType)) S.seen.e[k] = 1;
  const key = run.stage.key;
  const b = S.best[key] || (S.best[key] = { time: 0, won: false, char: '' });
  if (run.mode !== 'quick' && run.time > b.time) { b.time = run.time; b.char = run.charKey; }
  if (run.won) {
    st.wins++;
    b.won = true;
    if (run.mode !== 'quick') {
      S.cleared[key] = 1;
      S.heroClears[run.charKey] = 1;
      if (!run.hearts) st.noHealClear = 1;
    }
  }
  if (run.mode === 'daily') {
    st.dailies++;
    const today = dailyKey();
    if (S.daily.date !== today) S.daily = { date: today, best: 0, rewarded: false };
    S.daily.best = Math.max(S.daily.best, run.time);
    if (!S.daily.rewarded) {
      S.daily.rewarded = true;
      S.gold += 150;
      gold += 150;
    }
  }
  const ach = checkAchievements(null);
  saveGame();
  return { gold, ach };
}

// ----- the daily night: same seed for everyone on a given date -----
function dailyKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function dailyInfo() {
  const key = dailyKey();
  const rng = new RNG(hashStr('dawnkeeper:' + key));
  const stage = rng.int(0, STAGES.length - 1);
  const char = rng.pick(CHAR_KEYS);
  const mods = rng.shuffle(DAILY_MOD_KEYS.slice()).slice(0, 2);
  return { key, stage, char, mods, seed: hashStr('night:' + key) };
}

// ---------- Menus and modals: home, hero & stage select, power-ups, codex, achievements, in-run dialogs ----------
const imgCache = new Map();
function canvasUrl(key, make) {
  let u = imgCache.get(key);
  if (!u) {
    u = make().toDataURL();
    imgCache.set(key, u);
  }
  return u;
}
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
function heroImg(k, px) {
  return canvasUrl('hero:' + k + px, () => Sprites.get('hero-ui:' + k, CHARACTERS[k].look, 0, false, 'n', (px * DPR()) / 4));
}
function enemyImg(k, px) {
  return canvasUrl('enemy:' + k + px, () => Sprites.get('ui:' + k, k, 0, false, 'n', (px * DPR()) / 4));
}
function chestImg(boss) {
  return canvasUrl('chest:' + boss, () => DropSprites.get('chest', boss ? 1 : 0, 50 * DPR()));
}
function icon(k, px) { return Icons.url(k, px || 40); }
function tog(id, on, dis) { return `<button class="tog${on ? ' on' : ''}" id="${id}"${dis ? ' disabled' : ''}></button>`; }
function goldTag(n) { return `<span class="res"><i class="coin"></i>${fmtNum(n)}</span>`; }

function itemName(c) {
  if (c.kind === 'weapon') return WEAPONS[c.key].name;
  if (c.kind === 'passive') return PASSIVES[c.key].name;
  if (c.kind === 'gold') return 'Gold Pouch';
  if (c.kind === 'heal') return 'Hearty Meal';
  if (c.kind === 'evolve') return WEAPONS[c.key].name;
  return '';
}

function itemDesc(c) {
  if (c.kind === 'weapon') {
    const w = WEAPONS[c.key];
    if (c.lvl <= 1) return w.desc;
    return deltaText(c.key, w.lv[c.lvl - 2]);
  }
  if (c.kind === 'passive') return PASSIVES[c.key].desc;
  if (c.kind === 'gold') return '+' + c.v + ' gold';
  if (c.kind === 'heal') return 'Restore ' + c.v + ' health';
  if (c.kind === 'evolve') return WEAPONS[c.key].desc;
  return '';
}

        <div class="card"><div class="setrow"><div>Endless night<small>${canEndless ? 'Keep fighting after dawn. Bosses keep coming.' : 'Clear this stage to unlock'}</small></div>${tog('s-end', sel.endless, !canEndless)}</div></div>
      </div>
      <div class="pfoot"><button class="btn big gold" id="s-go">START NIGHT</button></div>`;
    $('s-back').onclick = () => { Sound.play('click'); saveGame(); this.showScreen('home'); };
    for (const h of document.querySelectorAll('#setup .hero')) h.onclick = () => {
      const k = h.dataset.h;
      if (!SAVE.chars.includes(k)) {
        Sound.play('error');
        const a = ACHIEVEMENTS.find((x) => x.reward.char === k);
        this.toast(`🔒 ${esc(CHARACTERS[k].name)}: ${a ? esc(a.desc) : 'locked'}`);
        return;
      }
      Sound.play('click');
      sel.char = k;
      this.renderSetup();
    };
    for (const s of document.querySelectorAll('#setup .stage')) s.onclick = () => {
      const i = +s.dataset.s;
      if (i >= SAVE.stages) { Sound.play('error'); this.toast('🔒 Clear ' + esc(STAGES[i - 1].name) + ' first'); return; }
      Sound.play('click');
      sel.stage = i;
      this.renderSetup();
    };
    for (const b of document.querySelectorAll('#s-mode button')) b.onclick = () => { Sound.play('click'); sel.mode = b.dataset.m; this.renderSetup(); };
    $('s-end').onclick = () => { if (!canEndless) return; Sound.play('click'); sel.endless = !sel.endless; this.renderSetup(); };
    $('s-go').onclick = () => {
      saveGame();
      Game.startRun({ stage: sel.stage, char: sel.char, mode: sel.mode, endless: sel.endless && canEndless });
    };
  },

  // ----- power-ups -----
  renderShop() {
    let spent = 0;
    for (const k of POWERUP_KEYS) for (let r = 0; r < (SAVE.power[k] || 0); r++) spent += powerCost(k, r);
    const cards = POWERUP_KEYS.map((k) => {
      const p = POWERUPS[k], rank = SAVE.power[k] || 0, max = rank >= p.max, cost = max ? 0 : powerCost(k, rank);
      const pips = Array.from({ length: p.max }, (_, i) => `<i class="${i < rank ? 'on' : ''}"></i>`).join('');
      return `<div class="pu${max ? ' max' : ''}"><div class="t"><img src="${icon(p.icon, 36)}"><div><b>${esc(p.name)}</b><small>${esc(p.desc)}</small></div></div>
        <div class="pips">${pips}</div>
        <button class="btn small ${max ? '' : 'gold'}" data-k="${k}" ${max || SAVE.gold < cost ? 'disabled' : ''}>${max ? 'MAX' : '<i class="coin"></i>' + fmtNum(cost)}</button></div>`;
    }).join('');
    $('shop').innerHTML = `
      <div class="phead"><button class="iconbtn" id="sh-back" aria-label="Back">←</button><h2>Power-ups</h2>${goldTag(SAVE.gold)}</div>
      <div class="pbody scroll">
        <p class="muted" style="font-size:13px">Power-ups make every run stronger. Earn gold by picking up coins, opening chests and surviving.</p>
        <div class="pgrid">${cards}</div>
        <div class="card"><div class="setrow"><div>Refund everything<small>Get all ${fmtNum(spent)} gold back to rebuy differently</small></div><button class="btn small red" id="sh-refund" ${spent ? '' : 'disabled'}>Refund</button></div></div>
      </div>`;
    $('sh-back').onclick = () => { Sound.play('click'); this.showScreen('home'); };
    for (const b of document.querySelectorAll('#shop .pu button[data-k]')) b.onclick = () => {
      const k = b.dataset.k, rank = SAVE.power[k] || 0, cost = powerCost(k, rank);
      if (rank >= POWERUPS[k].max || SAVE.gold < cost) { Sound.play('error'); return; }
      SAVE.gold -= cost;
      SAVE.power[k] = rank + 1;
      saveGame();
      Sound.play('buy');
      Game.vibrate(20);
      const y = $('shop').querySelector('.pbody').scrollTop;
      this.renderShop();
      $('shop').querySelector('.pbody').scrollTop = y;
    };
    $('sh-refund').onclick = () => {
      this.modal(`<h2>Refund all?</h2><p class="center">You get back <b>${fmtNum(spent)}</b> gold and all power-ups reset.</p><div class="btns"><button class="btn" id="r-no">Cancel</button><button class="btn red" id="r-yes">Refund</button></div>`, true);
      $('r-no').onclick = () => this.closeModal();
      $('r-yes').onclick = () => {
        SAVE.gold += spent;
        SAVE.power = {};
        saveGame();
        Sound.play('coin');
        this.closeModal();
        this.renderShop();
      };
    };
  },

  // ----- codex -----
  renderCodex() {
    const tab = this.codexTab;
    let body = '';
    if (tab === 'w') {
      body = '<div class="codex">' + BASE_WEAPONS.map((k) => {
        const w = WEAPONS[k], unlocked = SAVE.weapons.includes(k), evo = w.evo, found = SAVE.evolved[evo];
        const a = ACHIEVEMENTS.find((x) => x.reward.weapon === k);
        return `<div class="cx${unlocked ? '' : ' unk'}"><img src="${icon(k, 40)}"><div class="d"><b>${unlocked ? esc(w.name) : '🔒 ' + esc(w.name)}</b>
          <small>${unlocked ? esc(w.desc) : 'Unlock: ' + (a ? esc(a.desc) : '?')}</small>
          <small>Lv 8 + ${esc(PASSIVES[w.pair].name)} → <b style="display:inline;color:${found ? '#ffd84a' : '#a9abd0'}">${found ? esc(WEAPONS[evo].name) : '???'}</b></small></div>
          <span class="ar">→</span><div class="${found ? '' : 'unk'}" style="display:contents"><img src="${icon(evo, 40)}" style="${found ? '' : 'filter:brightness(0) opacity(.5)'}"></div></div>`;
      }).join('') + '</div>';
    } else if (tab === 'p') {
      body = '<div class="codex">' + PASSIVE_KEYS.map((k) => {
        const p = PASSIVES[k], w = PAIR_OF[k];
        return `<div class="cx"><img src="${icon(k, 40)}"><div class="d"><b>${esc(p.name)} <small style="display:inline">max Lv ${p.max}</small></b><small>${esc(p.desc)}</small><small>Evolves ${esc(WEAPONS[w].name)}</small></div></div>`;
      }).join('') + '</div>';
    } else {
      body = '<div class="egrid">' + ENEMY_KEYS.map((k) => {
        const seen = SAVE.seen.e[k], n = SAVE.stats.byType[k] || 0;
        return `<div class="en${seen ? '' : ' unk'}"><img src="${enemyImg(k, 56)}"><b>${seen ? esc(ENEMIES[k].name) : '???'}</b><small>${seen ? fmtNum(n) + ' defeated' : 'Not met yet'}</small></div>`;
      }).join('') + '</div>';
    }
    $('codex').innerHTML = `
      <div class="phead"><button class="iconbtn" id="cx-back" aria-label="Back">←</button><h2>Codex</h2></div>
      <div class="pbody scroll">
        <div class="seg" id="cx-tabs"><button data-t="w" class="${tab === 'w' ? 'on' : ''}">Weapons</button><button data-t="p" class="${tab === 'p' ? 'on' : ''}">Items</button><button data-t="e" class="${tab === 'e' ? 'on' : ''}">Monsters</button></div>
        ${body}
      </div>`;
    $('cx-back').onclick = () => { Sound.play('click'); this.showScreen('home'); };
    for (const b of document.querySelectorAll('#cx-tabs button')) b.onclick = () => { Sound.play('click'); this.codexTab = b.dataset.t; this.renderCodex(); };
  },

  // ----- achievements -----
  renderAchs() {
    const rows = ACHIEVEMENTS.map((a) => {
      const done = !!SAVE.ach[a.id], [cur, goal] = a.prog(SAVE, null), f = clamp(cur / goal, 0, 1);
      const shown = goal >= 60 && a.id.startsWith('survive') || a.id === 'endless20' ? fmtTime(Math.min(cur, goal)) + ' / ' + fmtTime(goal) : fmtNum(Math.min(cur, goal)) + ' / ' + fmtNum(goal);
      return `<div class="ach${done ? ' done' : ''}"><div class="ic">${done ? '🏆' : '🔸'}</div><div class="d"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small>
        <div class="rw">Reward: ${esc(rewardText(a))}</div>${done ? '' : `<div class="bar"><i style="width:${(f * 100).toFixed(1)}%"></i></div><small>${shown}</small>`}</div></div>`;
    }).join('');
    $('achs').innerHTML = `
      <div class="phead"><button class="iconbtn" id="a-back" aria-label="Back">←</button><h2>Achievements</h2></div>
      <div class="pbody scroll">${rows}</div>`;
    $('a-back').onclick = () => { Sound.play('click'); this.showScreen('home'); };
  },

  // ----- settings -----
  settingsModal(inRun) {
    const s = SAVE.settings;
    const q = (v, l) => `<button data-q="${v}" class="${s.quality === v ? 'on' : ''}">${l}</button>`;
    this.modal(`<h2>Settings</h2>
      <div class="card">
        <div class="setrow">Sound effects ${tog('o-sfx', s.sfx)}</div>
        <div class="setrow">Music ${tog('o-mus', s.music)}</div>
        <div class="setrow">Vibration ${tog('o-vib', s.vibrate)}</div>
        <div class="setrow">Damage numbers ${tog('o-dmg', s.dmgNums)}</div>
        <div class="setrow"><div>Graphics<small>Low helps older phones</small></div><div class="seg" id="o-q" style="width:190px">${q('auto', 'Auto')}${q('high', 'High')}${q('low', 'Low')}</div></div>
        ${inRun ? '' : `<div class="setrow"><div>Offline play<small>${Game.offlineReady ? '✅ Ready' : Game.isEmbedded() ? 'Open the game directly to install' : 'Available after the first load'}</small></div></div>`}
      </div>
      <div class="btns">${inRun ? '' : '<button class="btn small red" id="o-reset">Reset progress</button>'}<button class="btn" id="o-ok">Done</button></div>`, true);
    const bind = (id, key, after) => {
      $(id).onclick = () => {
        s[key] = !s[key];
        $(id).classList.toggle('on', s[key]);
        applySettings();
        saveGame();
        if (after) after();
        Sound.play('click');
      };
    };
    bind('o-sfx', 'sfx');
    bind('o-mus', 'music');
    bind('o-vib', 'vibrate');
    bind('o-dmg', 'dmgNums');
    for (const b of document.querySelectorAll('#o-q button')) b.onclick = () => {
      s.quality = b.dataset.q;
      for (const o of document.querySelectorAll('#o-q button')) o.classList.toggle('on', o === b);
      saveGame();
      Game.applyQuality();
      Sound.play('click');
    };
    $('o-ok').onclick = () => this.closeModal();
    const rb = $('o-reset');
    if (rb) rb.onclick = () => {
      this.modal(`<h2>Reset progress?</h2><p class="center">All gold, power-ups, heroes, stages and achievements will be lost.</p><div class="btns"><button class="btn" id="r-no">Cancel</button><button class="btn red" id="r-yes">Reset</button></div>`, true);
      $('r-no').onclick = () => this.settingsModal();
      $('r-yes').onclick = () => { resetGame(); this.closeModal(); this.showScreen('home'); };
    };
  },

  // ----- in-run dialogs -----
  choiceHTML(run, c, i, banish) {
    let tag = '', evo = '', cls = c.kind;
    if (c.kind === 'weapon') {
      const w = WEAPONS[c.key];
      tag = c.isNew ? '<span class="tag">NEW</span>' : `<span class="tag lv">Lv ${c.lvl}</span>`;
      const has = run.passiveLvl(w.pair) > 0;
      evo = c.lvl >= WEAPON_MAX ? (has ? '✦ Ready to evolve! Open a chest' : `✦ Evolves with ${PASSIVES[w.pair].name}`) : `✦ Evolves with ${PASSIVES[w.pair].name}${has ? ' ✓' : ''}`;
    } else if (c.kind === 'passive') {
      tag = c.isNew ? '<span class="tag">NEW</span>' : `<span class="tag lv">Lv ${c.lvl}</span>`;
      const wk = PAIR_OF[c.key], fam = run.family(wk);
      if (fam && !WEAPONS[fam.key].evolved) evo = `✦ Evolves your ${WEAPONS[wk].name}`;
    }
    return `<button class="choice ${cls}${banish ? ' banish' : ''} pop" style="animation-delay:${i * 0.06}s" data-i="${i}"><img src="${icon(c.key || c.kind, 50)}"><div class="d"><b>${esc(itemName(c))} ${tag}</b><small>${esc(itemDesc(c))}</small>${evo ? `<div class="evo">${esc(evo)}</div>` : ''}</div></button>`;
  },

  levelUp(scene, choices) {
    const run = scene.run;
    let banish = false;
    const render = () => {
      const tools = [];
      if (run.rerolls > 0) tools.push(`<button class="btn small blue" id="lv-rr">🔄 Reroll ${run.rerolls}</button>`);
      if (run.skips > 0) tools.push(`<button class="btn small" id="lv-sk">⏭ Skip ${run.skips}</button>`);
      if (run.banishes > 0 && choices.some((c) => c.key)) tools.push(`<button class="btn small ${banish ? 'red' : ''}" id="lv-bn">🚫 ${banish ? 'Tap to banish' : 'Banish ' + run.banishes}</button>`);
      this.modal(`<h2 class="lvl">LEVEL UP!</h2>
        <p class="center muted" style="margin-top:-6px">Level ${run.level - run.pendingLevels + 1}${run.pendingLevels > 1 ? ' · ' + run.pendingLevels + ' to pick' : ''}</p>
        ${choices.map((c, i) => this.choiceHTML(run, c, i, banish && c.key)).join('')}
        ${tools.length ? `<div class="btns">${tools.join('')}</div>` : ''}`, false);
      for (const b of document.querySelectorAll('#modal .choice')) b.onclick = () => {
        const c = choices[+b.dataset.i];
        if (banish && c.key) {
          run.banishes--;
          run.banished[c.key] = 1;
          banish = false;
          Sound.play('banish');
          choices = run.rollChoices();
          render();
          return;
        }
        this.closeModal();
        scene.pick(c);
      };
      const rr2 = $('lv-rr');
      if (rr2) rr2.onclick = () => { run.rerolls--; banish = false; Sound.play('reroll'); choices = run.rollChoices(); render(); };
      const sk = $('lv-sk');
      if (sk) sk.onclick = () => { run.skipLevel(); Sound.play('click'); this.closeModal(); scene.resume(); };
      const bn = $('lv-bn');
      if (bn) bn.onclick = () => { banish = !banish; Sound.play('click'); render(); };
    };
    render();
  },

  chest(scene, res, boss) {
    this.modal(`<div class="chest" id="ch-box"><img class="box shake glow" src="${chestImg(boss)}"><b>${boss ? 'Boss Treasure!' : 'Treasure Chest!'}</b><small class="muted">Tap to open</small></div>`, false);
    let opened = false;
    const open = () => {
      if (opened) return;
      opened = true;
      Sound.play(res.items.some((i) => i.kind === 'evolve') ? 'evolve' : 'chestOpen');
      Game.vibrate([30, 40, 60]);
      const rows = res.items.map((c, i) => {
        if (c.kind === 'evolve') {
          return `<div class="lootrow evo pop" style="animation-delay:${0.2 + i * 0.35}s"><img src="${icon(c.key, 38)}"><div><b>EVOLUTION! ${esc(WEAPONS[c.key].name)}</b><small>${esc(WEAPONS[c.from].name)} evolved: ${esc(WEAPONS[c.key].desc)}</small></div></div>`;
        }
        return `<div class="lootrow pop" style="animation-delay:${0.2 + i * 0.35}s"><img src="${icon(c.key, 38)}"><div><b>${esc(itemName(c))} <span style="color:#7fc8ff">Lv ${c.lvl}</span></b><small>${esc(itemDesc(c))}</small></div></div>`;
      }).join('');
      $('modal-panel').innerHTML = `<div class="chest"><img class="box pop" src="${chestImg(boss)}" style="width:96px"></div>
        <div class="loot">${rows || '<p class="center muted">Your gear is maxed out!</p>'}
        <div class="lootrow pop" style="animation-delay:${0.2 + res.items.length * 0.35}s"><span class="coin" style="width:30px;height:30px;margin:4px"></span><div><b>+${res.gold} gold</b></div></div></div>
        <div class="btns"><button class="btn gold" id="ch-ok">Collect</button></div>`;
      $('ch-ok').onclick = () => { Sound.play('coin'); this.closeModal(); scene.resume(); };
    };
    $('ch-box').onclick = open;
    setTimeout(open, 1400);
  },

  pause(scene) {
    const run = scene.run, s = run.stats;
    const inv = run.weapons.map((w) => `<div class="it${WEAPONS[w.key].evolved ? ' evo' : ''}"><img src="${icon(w.key, 42)}"><span>${WEAPONS[w.key].evolved ? '★' : w.lvl}</span></div>`).join('') +
      run.passives.map((p) => `<div class="it"><img src="${icon(p.key, 42)}"><span>${p.lvl}</span></div>`).join('');
    const pct = (v) => (v >= 1 ? '+' : '') + Math.round((v - 1) * 100) + '%';
    this.modal(`<h2>Paused</h2>
      <div class="inv">${inv}</div>
      <div class="stats">
        <div class="stat"><b>${Math.ceil(run.player.hp)}/${s.maxHp}</b><span>Health</span></div>
        <div class="stat"><b>${pct(s.might)}</b><span>Damage</span></div>
        <div class="stat"><b>${Math.round((1 - s.cd) * 100)}%</b><span>Faster</span></div>
        <div class="stat"><b>${pct(s.area)}</b><span>Area</span></div>
        <div class="stat"><b>${s.armor}</b><span>Armor</span></div>
        <div class="stat"><b>${pct(s.speed)}</b><span>Speed</span></div>
      </div>
      <div class="btns"><button class="btn small" id="p-set">⚙️ Settings</button><button class="btn small red" id="p-quit">Give up</button></div>
      <button class="btn big green" id="p-go">▶ Resume</button>`, false);
    $('p-go').onclick = () => { Sound.play('click'); this.closeModal(); scene.resume(); };
    $('p-set').onclick = () => {
      Sound.play('click');
      this.settingsModal(true);
      $('o-ok').onclick = () => this.pause(scene);
      this.modalDismiss = false;
    };
    $('p-quit').onclick = () => {
      this.modal(`<h2>Give up?</h2><p class="center">You keep half of the gold from this run.</p><div class="btns"><button class="btn" id="q-no">Keep going</button><button class="btn red" id="q-yes">Give up</button></div>`, false);
      $('q-no').onclick = () => this.pause(scene);
      $('q-yes').onclick = () => { this.closeModal(); scene.quit(); };
    };
  },

  result(scene, out, quit) {
    const run = scene.run;
    const title = run.won ? '☀️ DAWN BREAKS!' : quit ? 'Run abandoned' : '🌑 The night claims you';
    const sub = run.won ? `${esc(run.stage.name)} is safe until tomorrow.` : quit ? '' : 'Your light will shine again. Power up and try once more!';
    const dmg = Object.entries(run.dmgBy).filter(([k]) => WEAPONS[k]).sort((a, b) => b[1] - a[1]);
    const top = dmg.length ? dmg[0][1] : 1;
    const rows = dmg.slice(0, 6).map(([k, v]) => `<div class="dmgrow"><img src="${icon(k, 24)}"><span class="nm">${esc(WEAPONS[k].name)}</span><div class="bar"><i style="width:${((v / top) * 100).toFixed(1)}%"></i></div><span class="v">${fmtNum(v)}</span></div>`).join('');
    const achs = out.ach.map((g) => `<div class="newach pop">🏆<div><b>${esc(g.a.name)}</b>${esc(g.text)}</div></div>`).join('');
    const extra = run.won && !quit ? `<p class="center" style="color:#ffd84a;font-weight:800">Dawn bonus included!</p>` : '';
    this.modal(`<h2>${title}</h2>${sub ? `<p class="center muted">${sub}</p>` : ''}
      <div class="stats">
        <div class="stat"><b>${fmtTime(run.time)}</b><span>Survived</span></div>
        <div class="stat"><b>${run.level}</b><span>Level</span></div>
        <div class="stat"><b>${fmtNum(run.kills)}</b><span>Defeated</span></div>
      </div>
      <div class="card" style="display:flex;justify-content:center;gap:8px;align-items:center;font-weight:900;font-size:18px"><i class="coin"></i> +${fmtNum(out.gold)} gold</div>
      ${extra}
      ${rows ? `<h3>Damage</h3>${rows}` : ''}
      ${achs}
      <div class="btns"><button class="btn" id="r-home">Home</button><button class="btn gold" id="r-again">Play again</button></div>`, false);
    $('r-home').onclick = () => { Sound.play('click'); this.closeModal(); Game.toHome(); };
    $('r-again').onclick = () => { Sound.play('click'); this.closeModal(); Game.startRun(scene.cfg); };
    if (out.ach.length) setTimeout(() => Sound.play('unlock'), 500);
  },
};

// ===== 14-audio.js =====
// ---------- Synthesized sound effects & music (no audio files needed) ----------
const Sound = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null,
  sfxOn: true, musicOn: true, last: {},

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = 0.8;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 5;
    this.master.connect(comp);
    comp.connect(c.destination);
    this.sfx = c.createGain();
    this.sfx.gain.value = this.sfxOn ? 0.55 : 0;
    this.sfx.connect(this.master);
    this.mus = c.createGain();
    this.mus.gain.value = this.musicOn ? 0.22 : 0;
    this.mus.connect(this.master);
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (c.state === 'suspended') c.resume().catch(() => {});
    Music.onReady();
  },

  setSfx(on) { this.sfxOn = on; if (this.sfx) this.sfx.gain.value = on ? 0.55 : 0; },
  setMusic(on) { this.musicOn = on; if (this.mus) this.mus.gain.value = on ? 0.22 : 0; },

  tone(f, dur, o = {}) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(o.bus || this.sfx);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  noise(dur, o = {}) {
    const c = this.ctx;
    if (!c || !this.noiseBuf) return;
    const t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    const f0 = o.freq || 1200;
    f.frequency.setValueAtTime(f0, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, f0 + o.slide), t + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.bus || this.sfx);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.05);
  },

  play(name, pitch) {
    if (!this.ctx || !this.sfxOn || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    const gap = name === 'gem' ? 0.035 : name === 'hit' ? 0.06 : 0.05;
    if (this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    const T = (f, d, o) => this.tone(f, d, o);
    const N = (d, o) => this.noise(d, o);
    const pm = pitch || 1;
    switch (name) {
      case 'click': T(900, 0.04, { type: 'square', vol: 0.05 }); break;
      case 'select': T(660, 0.08, { type: 'triangle', vol: 0.08 }); T(990, 0.12, { type: 'triangle', vol: 0.07, delay: 0.06 }); break;
      case 'gem': T(1046 * pm, 0.07, { type: 'sine', vol: 0.06 }); T(1568 * pm, 0.06, { type: 'triangle', vol: 0.025, delay: 0.02 }); break;
      case 'coin': T(1318, 0.06, { type: 'square', vol: 0.04 }); T(1976, 0.1, { type: 'square', vol: 0.04, delay: 0.05 }); break;
      case 'bolt': T(880, 0.07, { type: 'sine', vol: 0.035, slide: 600 }); break;
      case 'slash': N(0.14, { vol: 0.09, freq: 2400, filter: 'bandpass', q: 0.8, slide: -1400 }); break;
      case 'blades': T(1200, 0.25, { type: 'triangle', vol: 0.03, slide: 400 }); N(0.2, { vol: 0.04, freq: 5000, filter: 'highpass' }); break;
      case 'throw': N(0.12, { vol: 0.06, freq: 1500, filter: 'bandpass', q: 1, slide: 900 }); break;
      case 'zap': N(0.2, { vol: 0.12, freq: 4000, filter: 'highpass', slide: -2000 }); T(1400, 0.1, { type: 'sawtooth', vol: 0.03, slide: -1100 }); break;
      case 'flask': N(0.25, { vol: 0.09, freq: 700, filter: 'bandpass', q: 0.6 }); T(1800, 0.05, { type: 'triangle', vol: 0.03 }); break;
      case 'frost': T(2000, 0.35, { type: 'sine', vol: 0.05, slide: -1500 }); N(0.3, { vol: 0.07, freq: 5000, filter: 'highpass' }); break;
      case 'orb': T(520, 0.15, { type: 'sine', vol: 0.05, slide: 400 }); break;
      case 'beam': T(300, 0.5, { type: 'sawtooth', vol: 0.03, slide: 500, attack: 0.05 }); break;
      case 'missile': N(0.12, { vol: 0.04, freq: 1200, slide: -600 }); break;
      case 'hit': N(0.05, { vol: 0.06, freq: 2600, filter: 'bandpass', q: 0.8 }); break;
      case 'kill': T(320, 0.07, { type: 'triangle', vol: 0.04, slide: -200 }); break;
      case 'killBig': N(0.4, { vol: 0.25, freq: 900, slide: -700 }); T(90, 0.35, { type: 'sine', vol: 0.25, slide: -40 }); break;
      case 'boom': N(0.3, { vol: 0.16, freq: 900, slide: -700 }); T(80, 0.25, { type: 'sine', vol: 0.14, slide: -30 }); break;
      case 'spike': N(0.12, { vol: 0.1, freq: 3000, filter: 'bandpass', slide: -1500 }); T(260, 0.1, { type: 'square', vol: 0.04, slide: -100 }); break;
      case 'slam': N(0.5, { vol: 0.3, freq: 500, slide: -350 }); T(55, 0.45, { type: 'sine', vol: 0.3, slide: -20 }); break;
      case 'hurt': T(200, 0.12, { type: 'square', vol: 0.08, slide: -100 }); N(0.08, { vol: 0.1, freq: 900 }); break;
      case 'heal': [784, 988, 1318].forEach((f, i) => T(f, 0.12, { type: 'sine', vol: 0.06, delay: i * 0.05 })); break;
      case 'level': [523, 659, 784, 1046, 1318].forEach((f, i) => T(f, 0.16, { type: 'square', vol: 0.055, delay: i * 0.06 })); break;
      case 'chest': [392, 523, 659].forEach((f, i) => T(f, 0.14, { type: 'triangle', vol: 0.08, delay: i * 0.07 })); break;

      case 'evolve': [392, 523, 659, 784, 1046, 1318, 1568].forEach((f, i) => T(f, 0.3, { type: 'square', vol: 0.06, delay: i * 0.09 })); N(1, { vol: 0.08, freq: 6000, filter: 'highpass', delay: 0.3 }); break;

      case 'bomb': N(0.9, { vol: 0.35, freq: 2500, slide: -2200 }); T(110, 0.8, { type: 'sine', vol: 0.3, slide: -60 }); [1046, 1318, 1568].forEach((f, i) => T(f, 0.4, { type: 'triangle', vol: 0.05, delay: 0.1 + i * 0.05 })); break;

      case 'boss': T(110, 0.9, { type: 'sawtooth', vol: 0.12, slide: -30 }); T(165, 0.9, { type: 'sawtooth', vol: 0.08, delay: 0.1 }); N(0.8, { vol: 0.12, freq: 400 }); break;
      case 'swarm': N(0.8, { vol: 0.07, freq: 1800, filter: 'bandpass', q: 2, attack: 0.2 }); break;
      case 'victory': [523, 659, 784, 1046, 784, 1046, 1318, 1568].forEach((f, i) => T(f, 0.26, { type: 'square', vol: 0.07, delay: i * 0.12 })); break;
      case 'defeat': [392, 349, 311, 262, 196].forEach((f, i) => T(f, 0.4, { type: 'triangle', vol: 0.1, delay: i * 0.22 })); break;

    }
